# Parity table: every legacy Central CI (workflow_key, test_profile) pair of
# .github/workflows/central-ci-dispatch.yml and every capability of
# contracts/repository-ci-v1.json maps to exactly one new per-purpose workflow.
# tests/test_ci_parity.py fails on any unmapped pair or capability.
#
# target: workflow file (existing today or planned) | "retired" | "runner"
# status: implemented (file exists) | planned (file not yet written)
# tailscale: whether the target workflow joins the private network.
legacy_pairs:
  - {key: validation.repository, profile: lint,        target: ci-gradle-or-xcode (project choice), status: implemented, tailscale: true}
  - {key: validation.repository, profile: build,       target: ci-gradle-or-xcode (project choice), status: implemented, tailscale: true}
  - {key: validation.repository, profile: test,        target: ci-gradle-or-xcode (project choice), status: implemented, tailscale: true}
  - {key: validation.repository, profile: full,        target: ci-gradle-or-xcode (project choice), status: planned, tailscale: true}
  - {key: validation.repository, profile: ui-test,     target: ci-gradle-or-xcode (project choice), status: planned, tailscale: true}
  - {key: validation.repository, profile: device-test, target: ci-xcode, status: planned, tailscale: true}
  - {key: release.repository,    profile: "*",         target: ci-python/ci-node/ci-gradle/ci-xcode release operation, status: planned, tailscale: true}
  - {key: release.android,       profile: play,        target: ci-gradle release operation, status: planned, tailscale: true}
  - {key: release.apple,         profile: testflight,  target: ci-xcode release operation, status: planned, tailscale: true}
  - {key: release.apple,         profile: binary-package, target: ci-xcode release operation, status: planned, tailscale: true}
  - {key: release.apple,         profile: swiftpm-package, target: ci-swiftpm, status: planned, tailscale: true}
  - {key: release.library-package, profile: publish,   target: ci-swiftpm, status: planned, tailscale: true}
  - {key: release.maven,         profile: publish,     target: ci-maven, status: planned, tailscale: true}
  - {key: release.public-native-image-chart, profile: "*", target: ci-helm, status: planned, tailscale: false}
  - {key: release.public-native-image-chart-primary, profile: "*", target: ci-helm, status: planned, tailscale: false}
  - {key: release.public-native-image-chart-secondary, profile: "*", target: ci-helm, status: planned, tailscale: false}
  - {key: oci.reproducibility,   profile: "*",         target: ci-docker, status: planned, tailscale: false}
  - {key: inspection.cluster,    profile: "*",         target: ci-cluster-inspect, status: planned, tailscale: true}
  - {key: validation.android,    profile: "*",         target: ci-gradle ui-test operation, status: planned, tailscale: true}
  - {key: maintenance.ci-cancel, profile: cancel,      target: runner, status: implemented, tailscale: false}
  - {key: maintenance.branch-delete, profile: delete,  target: runner, status: implemented, tailscale: false}
  - {key: source.checkpoint-publish, profile: publish, target: runner, status: implemented, tailscale: false}
  - {key: source.snapshot,       profile: "*",         target: runner, status: implemented, tailscale: false}
  - {key: validation.node,       profile: "*",         target: retired, status: implemented, tailscale: false}
  - {key: validation.flutter,    profile: "*",         target: retired, status: implemented, tailscale: false}
  - {key: validation.container-service, profile: "*",  target: retired, status: implemented, tailscale: false}
  - {key: validation.python,     profile: "*",         target: ci-python, status: implemented, tailscale: true}
  - {key: validation.apple,      profile: "*",         target: retired, status: implemented, tailscale: false}
capabilities:
  "exact source checkout and observed-SHA attestation": actions/ci-setup
  "hosted Linux and macOS execution": every ci-<ecosystem>-stage workflow (runs-on)
  "reviewed high-capacity macOS execution": ci-xcode-stage
  "private network for the full child execution lifetime": actions/setup-tailscale
  "ephemeral Git HTTPS authentication": actions/ci-setup (ci_registry_auth.py --github-git)
  "ephemeral private HTTPS registry authentication": actions/ci-setup (ci_registry_auth.py --registry-netrc)
  "ephemeral Gradle private-Maven read authentication": ci-gradle-stage (ci_registry_auth.py --gradle-maven)
  "authorized OCI image and Helm registry publication": ci-docker and ci-helm (planned)
  "product and toolchain build/test/package commands": convention in scripts/ci/ci_stage.py or tracked .ci/<stage>.sh
  "product target, selector, UI-mode and release semantics": options in contracts/repository-ci-v1.json
  "toolchain bootstrap and hosted emulator/simulator setup for ordinary validation": ci-gradle-stage and ci-xcode-stage
  "product integration-test fixture/service credentials": ci-xcode (test job only)
  "Apple signing and App Store Connect distribution credentials": ci-xcode release operation (planned)
  "Android signing and store distribution credentials": ci-gradle release operation (planned)
  "physical-device execution and device-provider orchestration": ci-xcode device-test (planned)
  "screenshot review and visual-acceptance orchestration": runner
  "immutable Maven publication/readback archive lifecycle": ci-maven (planned)
  "source snapshot/checkpoint publication and branch deletion": runner
  "technology-specific dependency caches": actions/ci-cache (Gradle, SwiftPM; Maven planned)
