# COPY/ADAPT EXAMPLE.
# TODO_EXECUTION_BACKEND must be exactly organization or github-hosted.
# TODO(consumer): choose product-owned paths OR paths-ignore; do not keep both.
name: TODO checked-in script validation

"on":
  pull_request:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_PRODUCT_PATH/**
      - .github/workflows/TODO_CALLER_WORKFLOW.yml
      - TODO_PRODUCT_CONFIGURATION_PATH
  push:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_PRODUCT_PATH/**
      - .github/workflows/TODO_CALLER_WORKFLOW.yml
      - TODO_PRODUCT_CONFIGURATION_PATH

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    permissions:
      contents: read
      pull-requests: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-resolve-source.yml@main
    with:
      source_mode: auto
      expected_branch: TODO_PROTECTED_BRANCH
      execution_backend: TODO_EXECUTION_BACKEND

  validate:
    needs: source
    permissions:
      contents: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-script.yml@main
    with:
      execution_backend: TODO_EXECUTION_BACKEND
      admitted_sha: ${{ needs.source.outputs.source_sha }}
      validation_profile: general
      working_directory: TODO_SCRIPT_WORKING_DIRECTORY
      script_path: TODO_PRODUCT_SCRIPT_PATH
