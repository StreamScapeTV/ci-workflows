# COPY/ADAPT EXAMPLE.
# TODO(consumer): choose product-owned paths OR paths-ignore; do not keep both.
name: TODO Helm validation

"on":
  pull_request:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_CHART_PATH/**
      - .github/workflows/TODO_CALLER_WORKFLOW.yml
      - TODO_PRODUCT_CONFIGURATION_PATH
  push:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_CHART_PATH/**
      - .github/workflows/TODO_CALLER_WORKFLOW.yml
      - TODO_PRODUCT_CONFIGURATION_PATH

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    permissions:
      contents: read
      pull-requests: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-resolve-source.yml@main
    with:
      source_mode: auto
      expected_branch: TODO_PROTECTED_BRANCH

  validate:
    needs: source
    permissions:
      contents: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-helm-validate.yml@main
    with:
      admitted_sha: ${{ needs.source.outputs.source_sha }}
      # Caller-owned chart identity; this is not a Central registration key.
      product_id: TODO_HELM_CALLER_IDENTITY
      values_profile: TODO_HELM_VALUES_PROFILE
      policy_path: TODO_HELM_POLICY_PATH
