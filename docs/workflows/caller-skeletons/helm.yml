# COPY/ADAPT EXAMPLE.
# Helm rendering is provided by the supported validation.gitops capability.
# TODO_EXECUTION_BACKEND must be exactly organization or github-hosted.
# TODO(consumer): choose product-owned paths OR paths-ignore; do not keep both.
name: TODO Helm render validation

"on":
  pull_request:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_CHART_PATH/**
      - TODO_GITOPS_CONSUMER_CONTRACT
      - .github/workflows/TODO_CALLER_WORKFLOW.yml
  push:
    branches:
      - TODO_PROTECTED_BRANCH
    paths:
      - TODO_CHART_PATH/**
      - TODO_GITOPS_CONSUMER_CONTRACT
      - .github/workflows/TODO_CALLER_WORKFLOW.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    permissions:
      contents: read
      pull-requests: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-resolve-source.yml@main
    with:
      source_mode: auto
      expected_branch: TODO_PROTECTED_BRANCH
      execution_backend: TODO_EXECUTION_BACKEND

  validate:
    needs: source
    permissions:
      contents: read
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-gitops-validation.yml@main
    with:
      execution_backend: TODO_EXECUTION_BACKEND
      admitted_sha: ${{ needs.source.outputs.source_sha }}
      validation_profile: helm-render
      consumer_contract: TODO_GITOPS_CONSUMER_CONTRACT
