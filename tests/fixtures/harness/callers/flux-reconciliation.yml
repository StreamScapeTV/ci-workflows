name: Flux reconciliation caller
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  reconcile_flux:
    name: Reconcile authorized Flux target
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-flux-reconcile.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      admitted_sha: ${{ github.sha }}
      target_id: production
      operation: reconcile
      policy_path: policy/reconcile.json
      allowlist_path: policy/targets.json
      request_id: fixture-request-0005
      dry_run: true
    secrets:
      flux_kubeconfig: ${{ secrets.FLUX_KUBECONFIG }}
      flux_sops_age_key: ${{ secrets.FLUX_SOPS_AGE_KEY }}
