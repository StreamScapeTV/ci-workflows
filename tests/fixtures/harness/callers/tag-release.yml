name: Exact tag release caller
on:
  push:
    tags:
      - 'v*'
permissions:
  actions: read
  contents: write
jobs:
  release_products:
    name: Release verified products
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-release.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      admitted_sha: ${{ github.sha }}
      release_contract: backend
      release_tag: ${{ github.ref_name }}
      release_version: 1.2.3
      request_id: fixture-request-0003
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_token: ${{ secrets.REGISTRY_TOKEN }}
      flux_handoff_token: ${{ secrets.FLUX_HANDOFF_TOKEN }}
