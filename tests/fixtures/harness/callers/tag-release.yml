name: Exact tag release caller
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release_products:
    name: Release verified native image and chart
    uses: StreamScapeTV/ci-workflows/.github/workflows/reusable-native-image-chart.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      image_name: fixture-image
      chart_name: fixture-chart
      chart_path: charts/fixture-chart
      dockerfile_path: Dockerfile
      build_context: .
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_token: ${{ secrets.REGISTRY_TOKEN }}
