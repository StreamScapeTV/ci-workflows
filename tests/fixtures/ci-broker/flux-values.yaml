# Deployment-compatibility fixture for the Flux-owned ci-broker HelmRelease.
# The diagnostics reader is permanently withdrawn. The false value is retained
# here only to prove a chart upgrade remains compatible while Flux removes the
# deprecated no-op key from desired state.
replicaCount: 1
fullnameOverride: ci-broker

diagnostics:
  enabled: false

image:
  repository: git.faruqi.dev/mimranfaruqi/ci-workflows/ci-broker
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - private-registry

existingSecret:
  name: ci-broker-secrets

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
