name: Helm workflow contract smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/helm-validation-smoke.yml"
      - ".github/workflows/reusable-helm-validate.yml"
      - ".github/workflows/reusable-helm-publish.yml"
      - "actions/validate-helm/**"
      - "actions/publish-helm/**"
      - "actions/measure-helm/**"
      - "contracts/helm-*.json"
      - "contracts/action-tool-lock.json"
      - "contracts/bootstrap-public-workflows.json"
      - "contracts/ciw-commands.json"
      - "contracts/public-workflow-types.json"
      - "contracts/public-workflows.json"
      - "contracts/public-workflows/products.json"
      - "contracts/runner-profiles.json"
      - "contracts/runner-execution-backends.json"
      - "generated/runner-mappings.json"
      - "generated/runner-execution-backends.json"
      - "scripts/ci/helm*.py"
      - "src/ci_workflows/ciw.py"
      - "src/ci_workflows/ciw_helm.py"
      - "src/ci_workflows/helm*.py"
      - "tests/fixtures/helm-validation/**"
      - "tests/test_helm*.py"
      - "tests/test_ciw*.py"
      - "tests/test_bootstrap.py"
      - "tests/test_reusable_workflow_source_identity.py"
      - "docs/architecture/helm-validation.md"
      - "docs/inventory/runner-compatibility.md"
      - "docs/reference/ciw.md"
      - "docs/workflows/helm-validation.md"
      - "docs/workflows/public-api-reference.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: CI / Helm workflow contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          set-safe-directory: false
      - name: Verify exact smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Verify pre-provisioned general-Linux CPython 3.12
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate="$(type -P python3.12 || true)"
          if [[ -z "${candidate}" ]]; then
            candidate="$(type -P python3 || true)"
          fi
          test -n "${candidate}"
          test "${candidate}" = "${candidate#/}" || true
          resolved="$("${candidate}" -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          test "${resolved}" != "${resolved#/}"
          test -x "${resolved}"
          identity="$("${resolved}" -c 'import platform,sys; m=platform.machine().lower(); m={"amd64":"x86_64","x64":"x86_64","aarch64":"arm64"}.get(m,m); print(f"{sys.implementation.name}|{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}|{platform.system()}|{m}")')"
          IFS='|' read -r implementation version system machine <<< "${identity}"
          [[ "${implementation}" == "cpython" ]]
          [[ "${version}" == 3.12.* ]]
          [[ "${system}" == "Linux" ]]
          [[ "${machine}" == "x86_64" ]]
          printf 'VERIFIED_PYTHON=%s\n' "${resolved}" >> "${GITHUB_ENV}"
      - name: Prepare pinned validation runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          validation_root="${RUNNER_TEMP}/ciw-helm-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${validation_root}"
          mkdir -p -- "${validation_root}/python"
          "${VERIFIED_PYTHON}" scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${validation_root}/python"
          {
            printf 'HELM_SMOKE_VALIDATION_ROOT=%s\n' "${validation_root}"
            printf 'PYTHONPATH=%s:%s/src\n' "${validation_root}/python" "${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"
      - name: Run bounded Helm contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          "${VERIFIED_PYTHON}" -m unittest discover \
            -s tests -p 'test_helm*.py' -v
      - name: Remove pinned validation runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${HELM_SMOKE_VALIDATION_ROOT:-}" ]]; then
            case "${HELM_SMOKE_VALIDATION_ROOT}" in "${RUNNER_TEMP}"/*) ;; *) exit 2 ;; esac
            rm -rf -- "${HELM_SMOKE_VALIDATION_ROOT}"
            test ! -e "${HELM_SMOKE_VALIDATION_ROOT}"
          fi
