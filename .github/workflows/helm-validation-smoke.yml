name: Helm workflow contract smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: CI / Helm workflow contract smoke
    runs-on: [linux, amd64, general]
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          set-safe-directory: false
      - name: Verify exact smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run bounded Helm contract tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m unittest discover \
            -s tests -p 'test_helm*.py' -v
