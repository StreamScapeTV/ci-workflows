name: Refresh canonical repository source snapshot

"on":
  push:
    branches:
      - main
      - develop
  workflow_call:
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: true
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: true
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: source-snapshot-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Central snapshot action
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: main
          persist-credentials: false
          path: central

      - name: Refresh exact integration-branch snapshot
        uses: ./central/actions/source-snapshot
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: ${{ github.repository }}
          repository_name: ${{ github.event.repository.name }}
          ref: ${{ github.ref_name }}
          source_sha: ${{ github.sha }}
          source_app_id: ${{ secrets.SOURCE_APP_ID }}
          source_app_private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
