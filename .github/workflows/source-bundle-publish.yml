name: Publish reviewed source bundle

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      branch:
        type: string
        required: true
      expected_head:
        type: string
        required: true
      drive_bundle_file_id:
        type: string
        required: true
      bundle_sha256:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: true
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: true
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Central publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark Agent State run as running
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate bounded publication inputs
        id: request
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          DRIVE_BUNDLE_FILE_ID: ${{ inputs.drive_bundle_file_id }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from scripts.ci.source_bundle_publish import validate_request

          validate_request(
              os.environ["TARGET_REPOSITORY"],
              os.environ["TARGET_BRANCH"],
              os.environ["EXPECTED_HEAD"],
              os.environ["DRIVE_BUNDLE_FILE_ID"],
              os.environ["BUNDLE_SHA256"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository_name={os.environ['TARGET_REPOSITORY'].split('/', 1)[1]}\n")
          PY
          git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null 2>&1 || {
            echo "source bundle branch is not a valid Git branch" >&2
            exit 2
          }

      - name: Create exact target repository token
        id: target_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.request.outputs.repository_name }}
          permission-contents: write
          permission-metadata: read

      - name: Resolve Google Drive access token
        id: drive
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          access_token="$(
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token" \
              https://oauth2.googleapis.com/token \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)'
          )"
          echo "::add-mask::${access_token}"
          printf 'access_token=%s\n' "${access_token}" >> "${GITHUB_OUTPUT}"

      - name: Download exact private Drive bundle
        id: download
        shell: bash
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.drive.outputs.access_token }}
          DRIVE_BUNDLE_FILE_ID: ${{ inputs.drive_bundle_file_id }}
        run: |
          set -Eeuo pipefail
          bundle="${RUNNER_TEMP}/reviewed-source-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GOOGLE_DRIVE_ACCESS_TOKEN}" \
            --output "${bundle}" \
            "https://www.googleapis.com/drive/v3/files/${DRIVE_BUNDLE_FILE_ID}?alt=media"
          test -s "${bundle}"
          printf 'bundle=%s\n' "${bundle}" >> "${GITHUB_OUTPUT}"

      - name: Publish exact reviewed bundle
        id: publish
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target_token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          DRIVE_BUNDLE_FILE_ID: ${{ inputs.drive_bundle_file_id }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          SOURCE_BUNDLE_PATH: ${{ steps.download.outputs.bundle }}
        run: |
          set -Eeuo pipefail
          result="$(python3 scripts/ci/source_bundle_publish.py \
            --repository "${TARGET_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --expected-head "${EXPECTED_HEAD}" \
            --drive-file-id "${DRIVE_BUNDLE_FILE_ID}" \
            --bundle-sha256 "${BUNDLE_SHA256}" \
            --bundle "${SOURCE_BUNDLE_PATH}")"
          printf '%s\n' "${result}"
          python3 - "${result}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          print(f"commit_sha={value['commit_sha']}")
          print(f"tree_sha={value['tree_sha']}")
          print(f"file_count={value['files']}")
          PY

      - name: Record observed source SHA
        id: record_source
        if: ${{ steps.publish.outcome == 'success' }}
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ inputs.expected_head }}

      - name: Record publication result
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit_sha }}
          PUBLISHED_TREE: ${{ steps.publish.outputs.tree_sha }}
          PUBLISHED_FILES: ${{ steps.publish.outputs.file_count }}
        run: |
          {
            printf 'Published exact reviewed source bundle.\n'
            printf -- '- target: `%s@%s`\n' "${TARGET_REPOSITORY}" "${TARGET_BRANCH}"
            printf -- '- previous head: `%s`\n' "${EXPECTED_HEAD}"
            printf -- '- published commit: `%s`\n' "${PUBLISHED_COMMIT}"
            printf -- '- published tree: `%s`\n' "${PUBLISHED_TREE}"
            printf -- '- files: `%s`\n' "${PUBLISHED_FILES}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean source bundle workspace
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_BUNDLE_PATH: ${{ steps.download.outputs.bundle }}
        run: |
          test -z "${SOURCE_BUNDLE_PATH}" || rm -f "${SOURCE_BUNDLE_PATH}"

      - name: Finish Agent State run
        if: ${{ always() }}
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.publish.outcome == 'success' && steps.record_source.outcome == 'success' && 'succeeded' || 'failed' }}
