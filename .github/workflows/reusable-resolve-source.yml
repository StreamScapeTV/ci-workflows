name: Reusable exact source admission

on:
  workflow_call:
    inputs:
      source_mode:
        description: Bounded source mode; trust is derived from the event and cannot be requested
        required: true
        type: string
      requested_sha:
        description: Optional exact lowercase 40-character SHA
        required: false
        type: string
      expected_branch:
        description: Optional expected integration branch without refs/heads
        required: false
        type: string
      release_contract:
        description: Required bounded release contract for tag admission
        required: false
        type: string
      history_depth:
        description: Bounded checkout history depth returned to the caller
        required: false
        default: 1
        type: number
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
    outputs:
      caller_repository:
        description: Validated caller repository
        value: ${{ jobs.admit.outputs.caller_repository }}
      caller_default_branch:
        description: Current validated default branch
        value: ${{ jobs.admit.outputs.caller_default_branch }}
      caller_integration_branch:
        description: Validated integration branch
        value: ${{ jobs.admit.outputs.caller_integration_branch }}
      trust_mode:
        description: Event-derived trust mode
        value: ${{ jobs.admit.outputs.trust_mode }}
      source_repository:
        description: Repository that contains the admitted source SHA
        value: ${{ jobs.admit.outputs.source_repository }}
      source_sha:
        description: Exact admitted source SHA
        value: ${{ jobs.admit.outputs.source_sha }}
      requested_sha:
        description: Exact requested SHA when one was supplied
        value: ${{ jobs.admit.outputs.requested_sha }}
      resolved_sha:
        description: Exact resolved commit SHA
        value: ${{ jobs.admit.outputs.resolved_sha }}
      pr_number:
        description: Pull-request number when applicable
        value: ${{ jobs.admit.outputs.pr_number }}
      pr_head_repository:
        description: Pull-request head repository when applicable
        value: ${{ jobs.admit.outputs.pr_head_repository }}
      pr_head_sha:
        description: Current exact pull-request head SHA when applicable
        value: ${{ jobs.admit.outputs.pr_head_sha }}
      pr_base_branch:
        description: Current pull-request base branch when applicable
        value: ${{ jobs.admit.outputs.pr_base_branch }}
      pr_base_sha:
        description: Current exact pull-request base SHA when applicable
        value: ${{ jobs.admit.outputs.pr_base_sha }}
      pr_merge_sha:
        description: Current exact pull-request merge SHA when available
        value: ${{ jobs.admit.outputs.pr_merge_sha }}
      tag_name:
        description: Exact admitted tag name when applicable
        value: ${{ jobs.admit.outputs.tag_name }}
      tag_object_sha:
        description: Exact Git tag-object or lightweight-tag commit SHA
        value: ${{ jobs.admit.outputs.tag_object_sha }}
      tag_commit_sha:
        description: Exact dereferenced tag commit
        value: ${{ jobs.admit.outputs.tag_commit_sha }}
      requires_freshness:
        description: Whether mutable source evidence must be revalidated before privileged publication or merge
        value: ${{ jobs.admit.outputs.requires_freshness }}
      history_depth:
        description: Validated bounded history depth
        value: ${{ jobs.admit.outputs.history_depth }}
      request_id:
        description: Stable source request identifier safe for checks and logs
        value: ${{ jobs.admit.outputs.request_id }}
      evidence_id:
        description: Stable redacted evidence identifier
        value: ${{ jobs.admit.outputs.evidence_id }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Resolve bounded hosted source execution backend
    if: ${{ inputs.execution_backend == 'github-hosted' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
    steps:
      - id: backend
        name: Resolve bounded hosted execution backend
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@01d1d10bafcc4fc1e4c51663f72b08f694dc4e35 # issue #447 portable backend checkpoint
        with:
          workflow_api: source.resolve
          source_trust: trusted-exact
          execution_backend: ${{ inputs.execution_backend }}

  plan_organization:
    name: Resolve bounded organization source execution backend
    if: ${{ inputs.execution_backend != 'github-hosted' }}
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
    steps:
      - id: backend
        name: Resolve bounded organization execution backend
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@01d1d10bafcc4fc1e4c51663f72b08f694dc4e35 # issue #447 portable backend checkpoint
        with:
          workflow_api: source.resolve
          source_trust: trusted-exact
          execution_backend: ${{ inputs.execution_backend }}

  admit:
    name: Shared / Source admission
    needs: [plan, plan_organization]
    if: ${{ always() && (needs.plan.result == 'success' || needs.plan_organization.result == 'success') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json || needs.plan_organization.outputs.runs_on_json) }}
    timeout-minutes: 10
    outputs:
      caller_repository: ${{ steps.resolve.outputs.caller_repository }}
      caller_default_branch: ${{ steps.resolve.outputs.caller_default_branch }}
      caller_integration_branch: ${{ steps.resolve.outputs.caller_integration_branch }}
      trust_mode: ${{ steps.resolve.outputs.trust_mode }}
      source_repository: ${{ steps.resolve.outputs.source_repository }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      requested_sha: ${{ steps.resolve.outputs.requested_sha }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_head_repository: ${{ steps.resolve.outputs.pr_head_repository }}
      pr_head_sha: ${{ steps.resolve.outputs.pr_head_sha }}
      pr_base_branch: ${{ steps.resolve.outputs.pr_base_branch }}
      pr_base_sha: ${{ steps.resolve.outputs.pr_base_sha }}
      pr_merge_sha: ${{ steps.resolve.outputs.pr_merge_sha }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_object_sha: ${{ steps.resolve.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.resolve.outputs.tag_commit_sha }}
      requires_freshness: ${{ steps.resolve.outputs.requires_freshness }}
      history_depth: ${{ steps.resolve.outputs.history_depth }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      evidence_id: ${{ steps.resolve.outputs.evidence_id }}
    steps:
      - id: resolve
        name: Resolve exact source through immutable trusted helper
        uses: StreamScapeTV/ci-workflows/actions/resolve-source@0b55b5f4bc2623815e47759d186e4955b6444075 # issue #350 PR-merge snapshot race checkpoint
        with:
          source_mode: ${{ inputs.source_mode }}
          requested_sha: ${{ inputs.requested_sha }}
          expected_branch: ${{ inputs.expected_branch }}
          release_contract: ${{ inputs.release_contract }}
          history_depth: ${{ inputs.history_depth }}
