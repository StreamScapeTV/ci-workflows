name: Reusable source resolver

on:
  workflow_call:
    inputs:
      source_mode:
        description: Event-bound source mode selected by the consumer workflow
        required: true
        type: string
      requested_sha:
        description: Exact approved source SHA for trusted or privileged modes
        required: false
        type: string
      expected_branch:
        description: Exact protected branch expected for trusted branch-bound modes
        required: false
        type: string
      release_contract:
        description: Optional bounded release contract identifier for tag releases
        required: false
        type: string
      history_depth:
        description: Bounded source history depth required by the consumer
        required: false
        default: 1
        type: number
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
    outputs:
      caller_repository:
        description: Exact caller repository
        value: ${{ jobs.admit.outputs.caller_repository }}
      caller_default_branch:
        description: Exact caller default branch
        value: ${{ jobs.admit.outputs.caller_default_branch }}
      caller_integration_branch:
        description: Exact caller integration branch from reviewed organization mapping
        value: ${{ jobs.admit.outputs.caller_integration_branch }}
      trust_mode:
        description: Derived trust mode
        value: ${{ jobs.admit.outputs.trust_mode }}
      source_repository:
        description: Exact admitted source repository
        value: ${{ jobs.admit.outputs.source_repository }}
      source_sha:
        description: Exact admitted immutable source commit
        value: ${{ jobs.admit.outputs.source_sha }}
      requested_sha:
        description: Exact requested SHA when present
        value: ${{ jobs.admit.outputs.requested_sha }}
      resolved_sha:
        description: Exact immutable SHA selected by admission
        value: ${{ jobs.admit.outputs.resolved_sha }}
      pr_number:
        description: Pull request number when applicable
        value: ${{ jobs.admit.outputs.pr_number }}
      pr_head_repository:
        description: Exact pull request head repository when applicable
        value: ${{ jobs.admit.outputs.pr_head_repository }}
      pr_head_sha:
        description: Exact pull request head SHA when applicable
        value: ${{ jobs.admit.outputs.pr_head_sha }}
      pr_base_branch:
        description: Exact pull request base branch when applicable
        value: ${{ jobs.admit.outputs.pr_base_branch }}
      pr_base_sha:
        description: Exact pull request base SHA when applicable
        value: ${{ jobs.admit.outputs.pr_base_sha }}
      pr_merge_sha:
        description: Exact server-synthesized pull request merge-candidate SHA when applicable
        value: ${{ jobs.admit.outputs.pr_merge_sha }}
      tag_name:
        description: Exact release tag when applicable
        value: ${{ jobs.admit.outputs.tag_name }}
      tag_object_sha:
        description: Exact release tag object identity when applicable
        value: ${{ jobs.admit.outputs.tag_object_sha }}
      tag_commit_sha:
        description: Exact release tag commit identity when applicable
        value: ${{ jobs.admit.outputs.tag_commit_sha }}
      requires_freshness:
        description: Whether the caller must revalidate mutable authority immediately before privileged work
        value: ${{ jobs.admit.outputs.requires_freshness }}
      history_depth:
        description: Validated bounded checkout history depth
        value: ${{ jobs.admit.outputs.history_depth }}
      request_id:
        description: Stable evidence identity
        value: ${{ jobs.admit.outputs.request_id }}
      evidence_id:
        description: Stable evidence identity
        value: ${{ jobs.admit.outputs.evidence_id }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded source execution backend
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
    steps:
      - id: backend
        name: Resolve bounded execution backend
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@34d736612462f7ab4e7be83443760c59027478db # issue #405 execution-backend checkpoint
        with:
          workflow_api: source.resolve
          source_trust: trusted-exact
          execution_backend: ${{ inputs.execution_backend }}

  admit:
    name: Shared / Source admission
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 10
    outputs:
      caller_repository: ${{ steps.source.outputs.caller_repository }}
      caller_default_branch: ${{ steps.source.outputs.caller_default_branch }}
      caller_integration_branch: ${{ steps.source.outputs.caller_integration_branch }}
      trust_mode: ${{ steps.source.outputs.trust_mode }}
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      requested_sha: ${{ steps.source.outputs.requested_sha }}
      resolved_sha: ${{ steps.source.outputs.resolved_sha }}
      pr_number: ${{ steps.source.outputs.pr_number }}
      pr_head_repository: ${{ steps.source.outputs.pr_head_repository }}
      pr_head_sha: ${{ steps.source.outputs.pr_head_sha }}
      pr_base_branch: ${{ steps.source.outputs.pr_base_branch }}
      pr_base_sha: ${{ steps.source.outputs.pr_base_sha }}
      pr_merge_sha: ${{ steps.source.outputs.pr_merge_sha }}
      tag_name: ${{ steps.source.outputs.tag_name }}
      tag_object_sha: ${{ steps.source.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.source.outputs.tag_commit_sha }}
      requires_freshness: ${{ steps.source.outputs.requires_freshness }}
      history_depth: ${{ steps.source.outputs.history_depth }}
      request_id: ${{ steps.source.outputs.request_id }}
      evidence_id: ${{ steps.source.outputs.evidence_id }}
    steps:
      - id: source
        name: Resolve source admission
        uses: StreamScapeTV/ci-workflows/actions/resolve-source@0b55b5f4bc2623815e47759d186e4955b6444075 # issue #350 PR-merge snapshot race checkpoint
        with:
          phase: admit
          source_mode: ${{ inputs.source_mode }}
          requested_sha: ${{ inputs.requested_sha }}
          expected_branch: ${{ inputs.expected_branch }}
          release_contract: ${{ inputs.release_contract }}
          history_depth: ${{ inputs.history_depth }}
