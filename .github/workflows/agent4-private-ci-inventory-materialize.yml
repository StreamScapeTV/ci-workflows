name: Agent 4 private CI inventory materializer

on:
  push:
    branches:
      - agent4/issue-595-private-ci-consolidation

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare validation Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python_root="${RUNNER_TEMP}/issue-595-python"
          rm -rf "${python_root}"
          mkdir -p "${python_root}"
          python3.12 scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${python_root}"
          printf 'PYTHONPATH=%s:%s/src\n' "${python_root}" "${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Refresh only private CI inventory entries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3.12 - <<'PY'
          from __future__ import annotations
          import ast
          import os
          from pathlib import Path
          import yaml

          root = Path.cwd()
          source_root = root / "src" / "ci_workflows"
          inventory_path = root / "PYTHON_INVENTORY.yml"
          inventory = yaml.safe_load(inventory_path.read_text(encoding="utf-8"))
          source_paths = sorted(source_root.glob("*.py"))
          module_names = {path.stem for path in source_paths if path.name != "__init__.py"}
          private = inventory["domains"]["private_ci"]
          private["files"] = [
              record
              for record in private["files"]
              if record["path"] != "src/ci_workflows/ci_private_apple.py"
          ]
          target_path = source_root / "ci_private.py"
          tree = ast.parse(target_path.read_text(encoding="utf-8"), filename=str(target_path))

          def sentence(text: str | None, fallback: str) -> str:
              value = " ".join((text or "").split()) or fallback
              boundary = value.find(". ")
              if boundary >= 0:
                  value = value[: boundary + 1]
              if value[-1] not in ".!?":
                  value += "."
              return value

          def signature(node: ast.FunctionDef | ast.AsyncFunctionDef) -> str:
              prefix = "async " if isinstance(node, ast.AsyncFunctionDef) else ""
              suffix = f" -> {ast.unparse(node.returns)}" if node.returns is not None else ""
              return f"{prefix}{node.name}({ast.unparse(node.args)}){suffix}"

          trivial = {"__init__", "__repr__", "__str__", "__hash__", "__eq__", "__post_init__"}
          responsibility = sentence(
              ast.get_docstring(tree, clean=True),
              "Product-neutral opaque private Central CI execution.",
          )
          classes = []
          functions = []
          for node in tree.body:
              if isinstance(node, ast.ClassDef):
                  methods = []
                  for child in node.body:
                      if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name not in trivial:
                          methods.append(
                              {
                                  "name": child.name,
                                  "signature": signature(child),
                                  "purpose": sentence(
                                      ast.get_docstring(child, clean=True),
                                      f"Implements {node.name}.{child.name} for private CI execution.",
                                  ),
                              }
                          )
                  classes.append(
                      {
                          "name": node.name,
                          "purpose": sentence(
                              ast.get_docstring(node, clean=True),
                              f"Defines {node.name} for private CI execution.",
                          ),
                          "methods": methods,
                      }
                  )
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  functions.append(
                      {
                          "name": node.name,
                          "signature": signature(node),
                          "purpose": sentence(
                              ast.get_docstring(node, clean=True),
                              f"Implements {node.name} for private CI execution.",
                          ),
                      }
                  )

          dependencies = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom):
                  candidates = []
                  if node.level and node.module:
                      candidates.append(node.module.split(".")[0])
                  elif node.module and node.module.startswith("ci_workflows."):
                      candidates.append(node.module.removeprefix("ci_workflows.").split(".")[0])
                  elif node.level and not node.module:
                      candidates.extend(alias.name.split(".")[0] for alias in node.names)
                  dependencies.update(candidate for candidate in candidates if candidate in module_names)
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.startswith("ci_workflows."):
                          candidate = alias.name.removeprefix("ci_workflows.").split(".")[0]
                          if candidate in module_names:
                              dependencies.add(candidate)

          replacement = {
              "path": "src/ci_workflows/ci_private.py",
              "responsibility": responsibility,
              "status": "keep",
              "classes": classes,
              "functions": functions,
              "internal_dependencies": sorted(dependencies),
          }
          for index, record in enumerate(private["files"]):
              if record["path"] == replacement["path"]:
                  private["files"][index] = replacement
                  break
          else:
              raise SystemExit("ci_private inventory entry missing")

          expected_paths = {
              "src/ci_workflows/central_profile.py",
              "src/ci_workflows/ci_private.py",
          }
          if {record["path"] for record in private["files"]} != expected_paths:
              raise SystemExit("private_ci inventory did not converge to two files")
          inventory["multi_file_domains"] = [
              report
              for report in inventory["multi_file_domains"]
              if report["domain"] != "private_ci"
          ]
          inventory["generated_from_sha"] = os.environ["GITHUB_SHA"]
          inventory["summary"]["python_files_discovered"] = len(source_paths)
          inventory["summary"]["note"] = (
              "Protected-main inventory was reconciled by #595 after the redundant "
              "Apple-private executor was consolidated into the generic private CI owner."
          )
          rendered = yaml.safe_dump(
              inventory,
              sort_keys=False,
              allow_unicode=True,
              width=180,
          )
          inventory_path.write_text(rendered, encoding="utf-8")
          print(f"python_files={len(source_paths)}")
          print("private_ci_files=2")
          PY

      - name: Commit refreshed inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- PYTHON_INVENTORY.yml
          if git diff --cached --quiet; then
            echo 'Inventory already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] #595 refresh private CI inventory'
          git push origin HEAD:agent4/issue-595-private-ci-consolidation
