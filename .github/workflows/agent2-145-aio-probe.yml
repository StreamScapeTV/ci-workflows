name: Agent 2 #145 AIO probe

on:
  push:
    branches:
      - issue/145-buildah-runner-image
    paths:
      - .github/workflows/agent2-145-aio-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, amd64, general, small]
    timeout-minutes: 10
    steps:
      - name: Resolve exact upstream image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "containers/aio"
          registry = "https://quay.io"
          accept = ", ".join(
              (
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              )
          )

          def get(url: str, *, token: str | None = None, headers: dict[str, str] | None = None):
              request_headers = {"Accept": accept, **(headers or {})}
              if token:
                  request_headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(url, headers=request_headers)
              try:
                  return urllib.request.urlopen(request, timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code != 401 or token is not None:
                      raise
                  challenge = error.headers.get("WWW-Authenticate", "")
                  if not challenge.startswith("Bearer "):
                      raise
                  values = dict(re.findall(r'(\w+)="([^"]*)"', challenge))
                  realm = values["realm"]
                  query = urllib.parse.urlencode(
                      {
                          "service": values.get("service", "quay.io"),
                          "scope": values.get("scope", f"repository:{repository}:pull"),
                      }
                  )
                  with urllib.request.urlopen(f"{realm}?{query}", timeout=60) as token_response:
                      payload = json.load(token_response)
                  bearer = payload.get("token") or payload.get("access_token")
                  if not isinstance(bearer, str) or not bearer:
                      raise RuntimeError("missing_bearer_token")
                  return get(url, token=bearer, headers=headers)

          root_url = f"{registry}/v2/{repository}/manifests/latest"
          with get(root_url) as response:
              root_raw = response.read()
              root_header = response.headers.get("Docker-Content-Digest", "")
          root_digest = "sha256:" + hashlib.sha256(root_raw).hexdigest()
          if root_header and root_header != root_digest:
              raise RuntimeError("root_digest_header_mismatch")
          root = json.loads(root_raw)

          manifests = root.get("manifests")
          if not isinstance(manifests, list):
              raise RuntimeError("latest_is_not_multi_platform")
          matches = [
              item
              for item in manifests
              if item.get("platform", {}).get("os") == "linux"
              and item.get("platform", {}).get("architecture") == "amd64"
          ]
          if len(matches) != 1:
              raise RuntimeError("amd64_manifest_not_unique")
          amd64_digest = matches[0]["digest"]

          manifest_url = f"{registry}/v2/{repository}/manifests/{amd64_digest}"
          with get(manifest_url) as response:
              manifest_raw = response.read()
          if "sha256:" + hashlib.sha256(manifest_raw).hexdigest() != amd64_digest:
              raise RuntimeError("amd64_manifest_digest_mismatch")
          manifest = json.loads(manifest_raw)
          config_digest = manifest["config"]["digest"]

          config_url = f"{registry}/v2/{repository}/blobs/{config_digest}"
          with get(config_url, headers={"Accept": "application/octet-stream"}) as response:
              config_raw = response.read()
              final_host = urllib.parse.urlsplit(response.geturl()).hostname
          if "sha256:" + hashlib.sha256(config_raw).hexdigest() != config_digest:
              raise RuntimeError("config_digest_mismatch")
          config = json.loads(config_raw)

          print(f"root_digest={root_digest}")
          print(f"amd64_manifest_digest={amd64_digest}")
          print(f"amd64_config_digest={config_digest}")
          print(f"config_blob_final_host={final_host}")
          print(f"user={config.get('config', {}).get('User', '')}")
          print(f"working_dir={config.get('config', {}).get('WorkingDir', '')}")
          print("env=" + json.dumps(config.get("config", {}).get("Env", []), separators=(",", ":")))
          PY
