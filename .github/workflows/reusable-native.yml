name: Reusable native CMake validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      working_directory:
        description: Relative CMake source directory within the exact checkout
        required: false
        default: .
        type: string
      validation_plan_json:
        description: Bounded product-owned CMake definitions, options, targets and parallelism
        required: true
        type: string
    outputs:
      result:
        description: Success only after native validation and terminal cleanup
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded machine-readable configure/build/test summary
        value: ${{ jobs.validate.outputs.test_summary }}
      cleanup_result:
        description: Marker-bound workspace cleanup result
        value: ${{ jobs.validate.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  validate:
    name: CI / Native CMake validation
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.native.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.clean.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.native.outputs.test_summary }}
      cleanup_result: ${{ steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - name: Verify runner-provided CMake
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake_path="$(type -P cmake || true)"
          test -n "${cmake_path}" && test "${cmake_path}" = /* && test -x "${cmake_path}"
          cmake --version

      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated native build state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: native
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}

      - id: native
        name: Execute bounded native configure build and test
        uses: StreamScapeTV/ci-workflows/actions/validate-native@7f83425d53edcc7fd2287adbb347fa320fc24e56 # issue #360 native adapter checkpoint
        with:
          admitted_sha: ${{ inputs.admitted_sha }}
          working_directory: ${{ inputs.working_directory }}
          validation_plan_json: ${{ inputs.validation_plan_json }}

      - id: cleanup
        name: Remove and verify all registered native state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: clean
        name: Verify exact source remained clean after cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )
