name: Issue 627 Buildah proof

"on":
  push:
    branches: ["agent7/issue-627-runner-cleanup"]

permissions:
  contents: read

jobs:
  buildah:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Buildah runner image
        run: docker build -t ci-runner-buildah:issue-627 runner-images/buildah

      - name: Run Buildah runner smoke
        run: docker run --rm ci-runner-buildah:issue-627 /usr/local/bin/runner-image-smoke
