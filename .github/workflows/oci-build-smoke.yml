name: OCI build contract smoke

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-oci-build.yml"
      - ".github/workflows/oci-build-smoke.yml"
      - "actions/validate-oci/**"
      - "contracts/oci-*.json"
      - "generated/oci-engine-mapping.json"
      - "scripts/ci/oci.py"
      - "src/ci_workflows/ciw_oci.py"
      - "src/ci_workflows/oci_*.py"
      - "tests/fixtures/oci-build/**"
      - "tests/test_oci_*.py"

concurrency:
  group: oci-build-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  contracts:
    name: Validate OCI build contracts and security boundaries
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Check out exact Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact Central source
        working-directory: .ciw
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - id: plan
        name: Resolve contract-owned OCI smoke product and consumer runner
        uses: ./.ciw/actions/validate-oci
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-input-smoke
          release_version: 0.0.0-smoke
          platform_set: linux-amd64

      - name: Require specialized execution to remain a consumer contract only
        shell: bash
        env:
          RUNS_ON_JSON: ${{ steps.plan.outputs.runs_on_json }}
        run: |
          set -Eeuo pipefail
          test "${RUNS_ON_JSON}" = '["linux","amd64","buildah","small"]'

      - name: Run focused OCI contract, security, and media tests
        working-directory: .ciw
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_oci_*.py' -v

      - name: Verify focused tests left exact source clean
        if: always()
        working-directory: .ciw
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  zero_artifacts:
    name: Verify OCI contract smoke retains zero artifacts
    needs: contracts
    if: ${{ always() && !cancelled() }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Require contract success and zero Actions artifacts
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${CONTRACT_RESULT}" = success
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("OCI contract smoke retained Actions artifacts")
          print("OCI contract smoke Actions artifacts verified: zero.")
          PY
