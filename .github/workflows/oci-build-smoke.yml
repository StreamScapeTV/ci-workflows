name: OCI build contract smoke

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-oci-build.yml"
      - ".github/workflows/oci-build-smoke.yml"
      - "actions/validate-oci/**"
      - "contracts/oci-*.json"
      - "generated/oci-engine-mapping.json"
      - "scripts/ci/oci.py"
      - "src/ci_workflows/ciw_oci.py"
      - "src/ci_workflows/oci_*.py"
      - "tests/fixtures/oci-build/**"
      - "tests/test_oci_*.py"
concurrency:
  group: oci-build-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Resolve bounded OCI smoke plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - name: Admit same-repository trusted pull request source
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${HEAD_REPOSITORY}" = "${BASE_REPOSITORY}"
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          )

      - id: plan
        name: Resolve contract-owned OCI smoke product and runner
        uses: ./.ciw/actions/validate-oci
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-smoke
          release_version: 0.0.0-smoke
          platform_set: linux-amd64

      - name: Run focused OCI contract, security, and media tests
        working-directory: .ciw
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_oci_*.py' -v

      - name: Verify focused OCI tests left central source clean
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

  smoke:
    name: Non-publishing Buildah smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 180
    steps:
      - name: Check out exact central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          )

      - name: Check out exact admitted smoke source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated marker-bound OCI smoke state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}

      - id: execute
        name: Build and inspect exact smoke source without publication
        continue-on-error: true
        uses: ./.ciw/actions/validate-oci
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-smoke
          release_version: 0.0.0-smoke
          platform_set: linux-amd64

      - name: Diagnose malformed OCI layout structure
        if: ${{ steps.execute.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .ciw/src
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from ci_workflows.oci_execution import state_root
          root = state_root(os.environ)
          layouts = sorted((root / "layouts").iterdir())
          if len(layouts) != 1:
              raise SystemExit(f"expected one OCI layout, found {len(layouts)}")
          layout = layouts[0]
          def blob(descriptor):
              digest = descriptor["digest"].removeprefix("sha256:")
              return json.loads((layout / "blobs" / "sha256" / digest).read_text())
          index = json.loads((layout / "index.json").read_text())
          rows = []
          for outer in index.get("manifests", []):
              outer_payload = blob(outer)
              children = outer_payload.get("manifests", []) if isinstance(outer_payload, dict) and "manifests" in outer_payload else [outer]
              for child in children:
                  manifest = blob(child)
                  config_desc = manifest.get("config", {}) if isinstance(manifest, dict) else {}
                  config = blob(config_desc) if isinstance(config_desc, dict) and "digest" in config_desc else {}
                  rootfs = config.get("rootfs", {}) if isinstance(config, dict) else {}
                  rows.append({"outer_media_type": outer.get("mediaType"), "child_media_type": child.get("mediaType"), "platform": child.get("platform"), "manifest_media_type": manifest.get("mediaType") if isinstance(manifest, dict) else None, "config_media_type": config_desc.get("mediaType") if isinstance(config_desc, dict) else None, "layer_media_types": [layer.get("mediaType") for layer in manifest.get("layers", [])] if isinstance(manifest, dict) else [], "os": config.get("os") if isinstance(config, dict) else None, "architecture": config.get("architecture") if isinstance(config, dict) else None, "variant": config.get("variant") if isinstance(config, dict) else None, "rootfs_type": rootfs.get("type") if isinstance(rootfs, dict) else None, "diff_id_count": len(rootfs.get("diff_ids", [])) if isinstance(rootfs, dict) and isinstance(rootfs.get("diff_ids", []), list) else None, "layer_count": len(manifest.get("layers", [])) if isinstance(manifest, dict) and isinstance(manifest.get("layers", []), list) else None, "config_keys": sorted(config.keys()) if isinstance(config, dict) else []})
          print(json.dumps({"root_media_type": index.get("mediaType"), "rows": rows}, sort_keys=True))
          PY

      - name: Render deterministic redacted OCI smoke evidence
        if: ${{ always() && !cancelled() }}
        uses: ./.ciw/actions/render-evidence
        with:
          source_sha: ${{ github.event.pull_request.head.sha }}
          workflow_release: oci-build-1.0.0
          runner_profile: ${{ needs.plan.outputs.runner_profile }}
          toolchain_json: >-
            {"buildah":"1.33.7","publication":"false","registry_credentials":"false"}
          command_profile: ciw-oci-smoke
          result: ${{ steps.execute.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: not-run
          cleanup_removed_paths: "0"

      - id: oci_cleanup
        name: Remove OCI smoke images, manifests, containers, layouts, caches, and temporary state
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-smoke
          release_version: 0.0.0-smoke
          platform_set: linux-amd64

      - id: residue
        name: Verify zero OCI-specific smoke residue
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-smoke
          release_version: 0.0.0-smoke
          platform_set: linux-amd64

      - id: workspace_cleanup
        name: Remove and verify registered OCI smoke state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Verify exact smoke source remained clean
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

      - name: Project terminal OCI smoke status
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          OCI_CLEANUP_OUTCOME: ${{ steps.oci_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${EXECUTE_OUTCOME}" = "success"
          test "${OCI_CLEANUP_OUTCOME}" = "success"
          test "${RESIDUE_OUTCOME}" = "success"
          test "${WORKSPACE_CLEANUP_OUTCOME}" = "success"

  zero_artifacts:
    name: Verify OCI smoke routine artifacts remain zero
    needs: smoke
    if: ${{ always() && !cancelled() }}
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    steps:
      - id: audit
        name: Require OCI smoke success and zero Actions artifacts
        continue-on-error: true
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${SMOKE_RESULT}" = success
          token_scope="$(mktemp -d "${RUNNER_TEMP}/ciw-oci-token.XXXXXX")"
          chmod 700 "${token_scope}"
          printf 'token_scope=%s\n' "${token_scope}" >> "${GITHUB_OUTPUT}"
          umask 077
          token_file="${token_scope}/github-token"
          printf '%s' "${GITHUB_TOKEN}" > "${token_file}"
          unset GITHUB_TOKEN
          OCI_TOKEN_FILE="${token_file}" python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = Path(os.environ["OCI_TOKEN_FILE"]).read_text(encoding="utf-8")

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("OCI smoke retained Actions artifacts")
          print("Routine OCI smoke Actions artifacts verified: zero.")
          PY

      - id: token_scope_cleanup
        name: Remove bounded zero-artifact audit token scope
        if: always()
        env:
          TOKEN_SCOPE: ${{ steps.audit.outputs.token_scope }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -z "${TOKEN_SCOPE}"; then
            exit 0
          fi
          case "${TOKEN_SCOPE}" in
            "${RUNNER_TEMP}"/ciw-oci-token.*) ;;
            *) exit 1 ;;
          esac
          if test -L "${TOKEN_SCOPE}"; then
            rm -- "${TOKEN_SCOPE}"
            exit 1
          fi
          test -d "${TOKEN_SCOPE}"
          token_file="${TOKEN_SCOPE}/github-token"
          if test -L "${token_file}"; then
            rm -- "${token_file}"
            rmdir -- "${TOKEN_SCOPE}"
            exit 1
          fi
          rm -f -- "${token_file}"
          rmdir -- "${TOKEN_SCOPE}"

      - id: token_scope_residue
        name: Verify zero-artifact audit token scope residue is absent
        if: always()
        env:
          TOKEN_SCOPE: ${{ steps.audit.outputs.token_scope }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -z "${TOKEN_SCOPE}"; then
            exit 0
          fi
          test ! -e "${TOKEN_SCOPE}"
          test ! -L "${TOKEN_SCOPE}"

      - name: Project OCI smoke artifact audit status
        if: ${{ always() && !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TOKEN_SCOPE_CLEANUP_OUTCOME: ${{ steps.token_scope_cleanup.outcome }}
          TOKEN_SCOPE_RESIDUE_OUTCOME: ${{ steps.token_scope_residue.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${AUDIT_OUTCOME}" = success
          test "${TOKEN_SCOPE_CLEANUP_OUTCOME}" = success
          test "${TOKEN_SCOPE_RESIDUE_OUTCOME}" = success
