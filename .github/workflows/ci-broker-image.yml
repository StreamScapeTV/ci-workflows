name: CI broker image and Helm release

on:
  push:
    tags:
      - 'ci-broker-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact ci-broker-X.Y.Z tag to replay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-broker-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: git.faruqi.dev
  REGISTRY_NAMESPACE: mimranfaruqi
  CHART_NAMESPACE: mimranfaruqi/helm-charts
  IMAGE_NAME: ci-broker
  CHART_NAME: ci-broker

jobs:
  admit:
    name: Admit exact broker release tag
    if: ${{ github.event_name != 'workflow_dispatch' || github.actor == 'mimranfaruqi' }}
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - id: release
        name: Admit exact broker release version and source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_TAG}" =~ ^ci-broker-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          version="${RELEASE_TAG#ci-broker-}"
          case "${GITHUB_EVENT_NAME}" in
            push)
              test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
              test "${source_sha}" = "${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              test "${GITHUB_ACTOR}" = "mimranfaruqi"
              ;;
            *)
              echo "::error::Unsupported broker release event ${GITHUB_EVENT_NAME}." >&2
              exit 1
              ;;
          esac
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify trusted ARC release admission runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "Linux"
          command -v python3 >/dev/null
          command -v git >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  image:
    name: Build smoke publish and read back broker image
    needs: admit
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      image_reference: ${{ steps.publish.outputs.image_reference }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Require ARC Buildah publication capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "Linux"
          command -v buildah >/dev/null
          command -v skopeo >/dev/null
          ! command -v docker >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare isolated registry authentication state
        shell: bash
        run: |
          set -Eeuo pipefail
          authfile="${RUNNER_TEMP}/ci-broker-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          test ! -e "${authfile}"
          umask 077
          printf '{}\n' > "${authfile}"
          chmod 0600 "${authfile}"
          printf 'BROKER_REGISTRY_AUTH=%s\n' "${authfile}" >> "${GITHUB_ENV}"

      - name: Build exact broker image once
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="localhost/${IMAGE_NAME}:${SOURCE_SHA}"
          buildah bud \
            --authfile "${BROKER_REGISTRY_AUTH}" \
            --layers=false \
            --isolation chroot \
            --label 'dev.streamscape.product=ci-broker' \
            --label 'org.opencontainers.image.source=https://github.com/StreamScapeTV/ci-workflows' \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label 'org.opencontainers.image.title=StreamScape CI broker' \
            --label 'org.opencontainers.image.description=Event-driven Central CI webhook broker' \
            --label 'org.opencontainers.image.licenses=MIT' \
            --tag "${local_ref}" \
            --file broker/Containerfile \
            .

      - name: Smoke exact local broker image
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="localhost/${IMAGE_NAME}:${SOURCE_SHA}"
          container="ci-broker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildah from --name "${container}" "${local_ref}" >/dev/null
          buildah run "${container}" -- python3 /opt/ci-broker/scripts/ci/ci_broker.py self-check
          buildah rm "${container}" >/dev/null

      - name: Authenticate to fixed private Forgejo registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CIW_REGISTRY_USERNAME}"
          test -n "${CIW_REGISTRY_TOKEN}"
          printf '%s' "${CIW_REGISTRY_TOKEN}" | buildah login \
            --authfile "${BROKER_REGISTRY_AUTH}" \
            --username "${CIW_REGISTRY_USERNAME}" \
            --password-stdin "${REGISTRY}" >/dev/null

      - id: publish
        name: Publish immutable image version and read it back
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="localhost/${IMAGE_NAME}:${SOURCE_SHA}"
          remote_ref="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}"

          if existing="$(skopeo inspect --authfile "${BROKER_REGISTRY_AUTH}" "docker://${remote_ref}" 2>/dev/null)"; then
            existing_revision="$(printf '%s' "${existing}" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')"
            existing_version="$(printf '%s' "${existing}" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.version", ""))')"
            test "${existing_revision}" = "${SOURCE_SHA}"
            test "${existing_version}" = "${VERSION}"
          else
            buildah push --authfile "${BROKER_REGISTRY_AUTH}" "${local_ref}" "docker://${remote_ref}"
          fi

          readback="$(skopeo inspect --authfile "${BROKER_REGISTRY_AUTH}" "docker://${remote_ref}")"
          digest="$(printf '%s' "${readback}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')"
          revision="$(printf '%s' "${readback}" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')"
          version="$(printf '%s' "${readback}" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.version", ""))')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${revision}" = "${SOURCE_SHA}"
          test "${version}" = "${VERSION}"
          printf 'image_digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'image_reference=%s@%s\n' "${remote_ref%%:*}" "${digest}" >> "${GITHUB_OUTPUT}"
          echo "Broker image published and read back from private Forgejo OCI."

      - name: Remove broker image and registry residue
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          container="ci-broker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_ref="localhost/${IMAGE_NAME}:${SOURCE_SHA}"
          buildah rm "${container}" >/dev/null 2>&1 || true
          buildah logout --authfile "${BROKER_REGISTRY_AUTH:-/dev/null}" "${REGISTRY}" >/dev/null 2>&1 || true
          buildah rmi "${local_ref}" >/dev/null 2>&1 || true
          if test -n "${BROKER_REGISTRY_AUTH:-}"; then
            rm -f -- "${BROKER_REGISTRY_AUTH}" || failed=1
            test ! -e "${BROKER_REGISTRY_AUTH}" || failed=1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || failed=1
          exit "${failed}"

  chart:
    name: Package publish and read back broker Helm chart
    needs: [admit, image]
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Require ARC Helm publication capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "Linux"
          command -v helm >/dev/null
          command -v yq >/dev/null
          command -v tar >/dev/null
          command -v gzip >/dev/null
          ! command -v buildah >/dev/null 2>&1
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare isolated Helm state
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${RUNNER_TEMP}/ci-broker-helm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${root}"
          mkdir -m 0700 -p "${root}/config" "${root}/cache" "${root}/data" "${root}/package" "${root}/readback"
          printf 'BROKER_HELM_ROOT=%s\n' "${root}" >> "${GITHUB_ENV}"
          printf 'HELM_REGISTRY_CONFIG=%s\n' "${root}/registry.json" >> "${GITHUB_ENV}"
          printf 'HELM_CONFIG_HOME=%s\n' "${root}/config" >> "${GITHUB_ENV}"
          printf 'HELM_CACHE_HOME=%s\n' "${root}/cache" >> "${GITHUB_ENV}"
          printf 'HELM_DATA_HOME=%s\n' "${root}/data" >> "${GITHUB_ENV}"

      - name: Lint render and deterministically package matching broker chart
        shell: bash
        run: |
          set -Eeuo pipefail
          chart="charts/ci-broker"
          helm lint --strict "${chart}"
          rendered="$(helm template ci-broker "${chart}" --set-string image.tag="${VERSION}")"
          test -n "${rendered}"
          printf '%s\n' "${rendered}" | grep -F "image: \"${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}\"" >/dev/null
          printf '%s\n' "${rendered}" | grep -F 'replicas: 1' >/dev/null
          helm package "${chart}" \
            --destination "${BROKER_HELM_ROOT}/package" \
            --version "${VERSION}" \
            --app-version "${VERSION}" >/dev/null
          package="${BROKER_HELM_ROOT}/package/${CHART_NAME}-${VERSION}.tgz"
          test -f "${package}"

          normalized_root="${BROKER_HELM_ROOT}/normalized"
          mkdir -m 0700 "${normalized_root}"
          tar -xzf "${package}" -C "${normalized_root}"
          normalized="${BROKER_HELM_ROOT}/package/${CHART_NAME}-${VERSION}.normalized.tgz"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -cf - \
            -C "${normalized_root}" "${CHART_NAME}" \
            | gzip -n > "${normalized}"
          test -s "${normalized}"
          mv "${normalized}" "${package}"
          rm -rf "${normalized_root}"
          printf 'BROKER_CHART_PACKAGE=%s\n' "${package}" >> "${GITHUB_ENV}"

      - name: Authenticate Helm to fixed private Forgejo registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CIW_REGISTRY_USERNAME}"
          test -n "${CIW_REGISTRY_TOKEN}"
          printf '%s' "${CIW_REGISTRY_TOKEN}" | helm registry login \
            "${REGISTRY}" \
            --username "${CIW_REGISTRY_USERNAME}" \
            --password-stdin >/dev/null

      - name: Publish immutable chart version and read it back
        shell: bash
        run: |
          set -Eeuo pipefail
          chart_ref="oci://${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}"
          local_sha="$(sha256sum "${BROKER_CHART_PACKAGE}" | awk '{print $1}')"
          existing_dir="${BROKER_HELM_ROOT}/existing"
          mkdir -m 0700 "${existing_dir}"

          if helm pull "${chart_ref}" --version "${VERSION}" --destination "${existing_dir}" >/dev/null 2>&1; then
            existing="${existing_dir}/${CHART_NAME}-${VERSION}.tgz"
            test -f "${existing}"
            test "$(sha256sum "${existing}" | awk '{print $1}')" = "${local_sha}"
          else
            helm push "${BROKER_CHART_PACKAGE}" "oci://${REGISTRY}/${CHART_NAMESPACE}" >/dev/null
          fi

          rm -f "${BROKER_HELM_ROOT}/readback/${CHART_NAME}-${VERSION}.tgz"
          helm pull "${chart_ref}" --version "${VERSION}" --destination "${BROKER_HELM_ROOT}/readback" >/dev/null
          readback="${BROKER_HELM_ROOT}/readback/${CHART_NAME}-${VERSION}.tgz"
          test -f "${readback}"
          test "$(sha256sum "${readback}" | awk '{print $1}')" = "${local_sha}"
          metadata="$(helm show chart "${chart_ref}" --version "${VERSION}")"
          test "$(printf '%s\n' "${metadata}" | yq -r '.name')" = "${CHART_NAME}"
          test "$(printf '%s\n' "${metadata}" | yq -r '.version')" = "${VERSION}"
          test "$(printf '%s\n' "${metadata}" | yq -r '.appVersion')" = "${VERSION}"
          echo "Broker Helm chart published and read back from private Forgejo OCI."

      - name: Remove Helm and registry residue
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          helm registry logout "${REGISTRY}" >/dev/null 2>&1 || true
          if test -n "${BROKER_HELM_ROOT:-}"; then
            rm -rf -- "${BROKER_HELM_ROOT}" || failed=1
            test ! -e "${BROKER_HELM_ROOT}" || failed=1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || failed=1
          exit "${failed}"
