name: CI broker image and Helm release

on:
  push:
    tags:
      - 'ci-broker-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact ci-broker-X.Y.Z tag to replay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-broker-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: git.faruqi.dev
  REGISTRY_NAMESPACE: mimranfaruqi
  CHART_NAMESPACE: mimranfaruqi/helm-charts
  IMAGE_NAME: ci-broker
  CHART_NAME: ci-broker

jobs:
  admit:
    name: Admit exact broker release tag
    if: ${{ github.event_name != 'workflow_dispatch' || github.actor == 'mimranfaruqi' }}
    runs-on: [macOS, ARM64]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - id: release
        name: Admit exact broker release version and source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_TAG}" =~ ^ci-broker-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          version="${RELEASE_TAG#ci-broker-}"
          case "${GITHUB_EVENT_NAME}" in
            push)
              test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
              test "${source_sha}" = "${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              test "${GITHUB_ACTOR}" = "mimranfaruqi"
              ;;
            *)
              echo "::error::Unsupported broker release event ${GITHUB_EVENT_NAME}." >&2
              exit 1
              ;;
          esac
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify organization macOS bootstrap capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "macOS"
          test "$(uname -m)" = "arm64"
          command -v python3 >/dev/null
          command -v git >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  image:
    name: Build smoke publish and read back broker image
    needs: admit
    runs-on: [macOS, ARM64]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      image_reference: ${{ steps.publish.outputs.image_reference }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Require macOS Docker publication capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "macOS"
          test "$(uname -m)" = "arm64"
          command -v docker >/dev/null
          docker version >/dev/null
          docker buildx version >/dev/null
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare isolated Docker registry authentication state
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${RUNNER_TEMP}/ci-broker-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${root}"
          mkdir -m 0700 "${root}"
          printf 'BROKER_DOCKER_CONFIG=%s\n' "${root}" >> "${GITHUB_ENV}"
          printf 'DOCKER_CONFIG=%s\n' "${root}" >> "${GITHUB_ENV}"

      - name: Build exact Linux amd64 broker image once
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="ci-broker-local:${SOURCE_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --provenance=false \
            --label 'dev.streamscape.product=ci-broker' \
            --label 'org.opencontainers.image.source=https://github.com/StreamScapeTV/ci-workflows' \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label 'org.opencontainers.image.title=StreamScape CI broker' \
            --label 'org.opencontainers.image.description=Event-driven Central CI webhook broker' \
            --label 'org.opencontainers.image.licenses=MIT' \
            --tag "${local_ref}" \
            --file broker/Containerfile \
            .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${local_ref}")" = "linux/amd64"

      - name: Smoke exact local broker image
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="ci-broker-local:${SOURCE_SHA}"
          docker run \
            --rm \
            --platform linux/amd64 \
            --entrypoint python3 \
            "${local_ref}" \
            /opt/ci-broker/scripts/ci/ci_broker.py self-check

      - name: Authenticate to fixed private Forgejo registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CIW_REGISTRY_USERNAME}"
          test -n "${CIW_REGISTRY_TOKEN}"
          printf '%s' "${CIW_REGISTRY_TOKEN}" | docker login \
            "${REGISTRY}" \
            --username "${CIW_REGISTRY_USERNAME}" \
            --password-stdin >/dev/null

      - id: publish
        name: Publish immutable image version and read it back
        shell: bash
        run: |
          set -Eeuo pipefail
          local_ref="ci-broker-local:${SOURCE_SHA}"
          remote_ref="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}"

          if docker pull --platform linux/amd64 "${remote_ref}" >/dev/null 2>&1; then
            existing_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${remote_ref}")"
            existing_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${remote_ref}")"
            test "${existing_revision}" = "${SOURCE_SHA}"
            test "${existing_version}" = "${VERSION}"
          else
            docker tag "${local_ref}" "${remote_ref}"
            docker push "${remote_ref}" >/dev/null
          fi

          docker image rm -f "${remote_ref}" >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "${remote_ref}" >/dev/null
          readback_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${remote_ref}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${remote_ref}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${remote_ref}")"
          digest_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${remote_ref}" | grep -F "${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}@sha256:" | head -n 1)"
          test -n "${digest_ref}"
          digest="${digest_ref##*@}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${readback_platform}" = "linux/amd64"
          test "${revision}" = "${SOURCE_SHA}"
          test "${version}" = "${VERSION}"
          printf 'image_digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'image_reference=%s/%s/%s@%s\n' "${REGISTRY}" "${REGISTRY_NAMESPACE}" "${IMAGE_NAME}" "${digest}" >> "${GITHUB_OUTPUT}"
          echo "Broker Linux amd64 image published and read back from private Forgejo OCI."

      - name: Remove broker image and Docker registry residue
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          local_ref="ci-broker-local:${SOURCE_SHA:-unknown}"
          remote_ref="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION:-unknown}"
          if test -n "${BROKER_DOCKER_CONFIG:-}"; then
            docker logout "${REGISTRY}" >/dev/null 2>&1 || true
          fi
          docker image rm -f "${remote_ref}" "${local_ref}" >/dev/null 2>&1 || true
          if test -n "${BROKER_DOCKER_CONFIG:-}"; then
            rm -rf -- "${BROKER_DOCKER_CONFIG}" || failed=1
            test ! -e "${BROKER_DOCKER_CONFIG}" || failed=1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || failed=1
          exit "${failed}"

  chart:
    name: Package publish and read back broker Helm chart
    needs: [admit, image]
    runs-on: [macOS, ARM64]
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - name: Check out exact tagged Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Require macOS Helm publication capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "macOS"
          test "$(uname -m)" = "arm64"
          command -v helm >/dev/null
          command -v python3 >/dev/null
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare isolated Helm state
        shell: bash
        run: |
          set -Eeuo pipefail
          root="${RUNNER_TEMP}/ci-broker-helm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${root}"
          mkdir -m 0700 -p "${root}/config" "${root}/cache" "${root}/data" "${root}/package" "${root}/readback"
          printf 'BROKER_HELM_ROOT=%s\n' "${root}" >> "${GITHUB_ENV}"
          printf 'HELM_REGISTRY_CONFIG=%s\n' "${root}/registry.json" >> "${GITHUB_ENV}"
          printf 'HELM_CONFIG_HOME=%s\n' "${root}/config" >> "${GITHUB_ENV}"
          printf 'HELM_CACHE_HOME=%s\n' "${root}/cache" >> "${GITHUB_ENV}"
          printf 'HELM_DATA_HOME=%s\n' "${root}/data" >> "${GITHUB_ENV}"

      - name: Lint render and deterministically package matching broker chart
        shell: bash
        run: |
          set -Eeuo pipefail
          chart="charts/ci-broker"
          helm lint --strict "${chart}"
          rendered="$(helm template ci-broker "${chart}" --set-string image.tag="${VERSION}")"
          test -n "${rendered}"
          printf '%s\n' "${rendered}" | grep -F "image: \"${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}\"" >/dev/null
          printf '%s\n' "${rendered}" | grep -F 'replicas: 1' >/dev/null
          helm package "${chart}" \
            --destination "${BROKER_HELM_ROOT}/package" \
            --version "${VERSION}" \
            --app-version "${VERSION}" >/dev/null
          package="${BROKER_HELM_ROOT}/package/${CHART_NAME}-${VERSION}.tgz"
          canonical="${BROKER_HELM_ROOT}/package/${CHART_NAME}-${VERSION}.canonical.tgz"
          test -f "${package}"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python3 - "${package}" "${canonical}" "${CHART_NAME}" <<'PY'
          from pathlib import Path
          import sys
          from ci_workflows.helm_archive import canonicalize_chart_archive

          canonicalize_chart_archive(Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3])
          PY
          test -s "${canonical}"
          mv "${canonical}" "${package}"
          printf 'BROKER_CHART_PACKAGE=%s\n' "${package}" >> "${GITHUB_ENV}"

      - name: Authenticate Helm to fixed private Forgejo registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CIW_REGISTRY_USERNAME}"
          test -n "${CIW_REGISTRY_TOKEN}"
          printf '%s' "${CIW_REGISTRY_TOKEN}" | helm registry login \
            "${REGISTRY}" \
            --username "${CIW_REGISTRY_USERNAME}" \
            --password-stdin >/dev/null

      - name: Publish immutable chart version and read it back
        shell: bash
        run: |
          set -Eeuo pipefail
          chart_ref="oci://${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}"
          file_sha() {
            python3 - "$1" <<'PY'
          import hashlib
          import pathlib
          import sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          }
          local_sha="$(file_sha "${BROKER_CHART_PACKAGE}")"
          existing_dir="${BROKER_HELM_ROOT}/existing"
          mkdir -m 0700 "${existing_dir}"

          if helm pull "${chart_ref}" --version "${VERSION}" --destination "${existing_dir}" >/dev/null 2>&1; then
            existing="${existing_dir}/${CHART_NAME}-${VERSION}.tgz"
            test -f "${existing}"
            test "$(file_sha "${existing}")" = "${local_sha}"
          else
            helm push "${BROKER_CHART_PACKAGE}" "oci://${REGISTRY}/${CHART_NAMESPACE}" >/dev/null
          fi

          readback="${BROKER_HELM_ROOT}/readback/${CHART_NAME}-${VERSION}.tgz"
          rm -f "${readback}"
          helm pull "${chart_ref}" --version "${VERSION}" --destination "${BROKER_HELM_ROOT}/readback" >/dev/null
          test -f "${readback}"
          test "$(file_sha "${readback}")" = "${local_sha}"
          echo "Broker Helm chart published and read back from private Forgejo OCI."

      - name: Remove Helm registry and package residue
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          if test -n "${BROKER_HELM_ROOT:-}"; then
            helm registry logout "${REGISTRY}" >/dev/null 2>&1 || true
            rm -rf -- "${BROKER_HELM_ROOT}" || failed=1
            test ! -e "${BROKER_HELM_ROOT}" || failed=1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || failed=1
          exit "${failed}"
