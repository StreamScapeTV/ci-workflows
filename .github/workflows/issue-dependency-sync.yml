name: Organization issue dependency sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: issue-dependency-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile repository issue dependencies
    if: >-
      ${{ github.repository == 'StreamScapeTV/ci-workflows' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify protected central execution
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "${EXPECTED_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          test "${EXPECTED_REF}" = "refs/heads/main"
          case "${EXPECTED_EVENT}" in
            schedule|workflow_dispatch) ;;
            *) echo "::error::Unsupported dependency-sync event ${EXPECTED_EVENT}." >&2; exit 1 ;;
          esac
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify hosted CPython 3.12
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate="$(type -P python3.12 || true)"
          if [[ -z "${candidate}" ]]; then
            candidate="$(type -P python3 || true)"
          fi
          if [[ -z "${candidate}" || "${candidate}" != /* || ! -x "${candidate}" ]]; then
            echo "::error::No absolute executable Python candidate is pre-provisioned." >&2
            exit 1
          fi
          resolved="$("${candidate}" -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          identity="$("${resolved}" -c 'import platform,sys; print(f"{sys.implementation.name}|{sys.version_info.major}.{sys.version_info.minor}|{platform.system()}")')"
          IFS='|' read -r implementation version system <<< "${identity}"
          test "${implementation}" = "cpython"
          test "${version}" = "3.12"
          test "${system}" = "Linux"
          printf 'VERIFIED_PYTHON=%s\n' "${resolved}" >> "${GITHUB_ENV}"

      - name: Check out exact protected central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact protected source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Prepare locked YAML validation runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_root="${RUNNER_TEMP}/issue-dependency-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${runtime_root}"
          mkdir -p "${runtime_root}/python"
          "${VERIFIED_PYTHON}" scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${runtime_root}/python"
          test -f "${runtime_root}/python/yaml/__init__.py"
          VALIDATION_TARGET="${runtime_root}/python" \
          PYTHONPATH="${runtime_root}/python" \
          "${VERIFIED_PYTHON}" - <<'PY'
          import os
          from pathlib import Path
          import yaml

          target = Path(os.environ["VALIDATION_TARGET"]).resolve()
          module_path = Path(yaml.__file__).resolve()
          if target not in module_path.parents or yaml.__version__ != "6.0.3":
              raise SystemExit("locked YAML validation runtime mismatch")
          PY
          {
            printf 'DEPENDENCY_SYNC_RUNTIME_ROOT=%s\n' "${runtime_root}"
            printf 'PYTHONPATH=%s:%s/src\n' "${runtime_root}/python" "${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

      - name: Reconcile opted-in repository dependency manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_SYNC_GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          "${VERIFIED_PYTHON}" scripts/ci/sync_issue_dependencies.py

      - name: Verify tracked central source remains clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d .git ]]; then
            git diff --exit-code
            git diff --cached --exit-code
          fi

      - name: Remove dependency-sync runtime state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          if [[ -n "${DEPENDENCY_SYNC_RUNTIME_ROOT:-}" ]]; then
            rm -rf "${DEPENDENCY_SYNC_RUNTIME_ROOT}" || cleanup_failed=1
            [[ ! -e "${DEPENDENCY_SYNC_RUNTIME_ROOT}" ]] || cleanup_failed=1
          fi
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || cleanup_failed=1
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || cleanup_failed=1
          if [[ -d .git ]]; then
            test -z "$(git status --porcelain --untracked-files=all)" || cleanup_failed=1
          fi
          exit "${cleanup_failed}"
