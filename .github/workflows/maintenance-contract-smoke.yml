name: Maintenance contract smoke

on:
  pull_request:
    paths:
      - '.github/workflows/reusable-*maintenance*.yml'
      - '.github/workflows/reusable-artifact-cleanup.yml'
      - '.github/workflows/reusable-branch-hygiene.yml'
      - '.github/workflows/reusable-conformance.yml'
      - '.github/workflows/reusable-runner-infrastructure-retry.yml'
      - '.github/workflows/reusable-flux-reconcile.yml'
      - '.github/workflows/maintenance-contract-smoke.yml'
      - 'actions/maintenance-*/**'
      - 'actions/flux-reconcile/**'
      - 'contracts/organization-maintenance*.json'
      - 'contracts/public-workflows/operations.json'
      - 'scripts/ci/maintenance.py'
      - 'scripts/ci/flux_reconcile.py'
      - 'src/ci_workflows/maintenance*.py'
      - 'src/ci_workflows/flux.py'
      - 'src/ci_workflows/flux_reconcile*.py'
      - 'tests/test_maintenance_*.py'
      - 'tests/test_flux_component_facade.py'
      - 'tests/test_flux_reconcile_*.py'
      - 'tests/fixtures/organization-maintenance/**'
permissions:
  actions: read
  contents: read
jobs:
  focused:
    name: Validate bounded maintenance and Flux contracts
    runs-on: [linux, amd64, general]
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact source and Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python_path="$(type -P python3.12 || type -P python3)"
          "${python_path}" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          printf 'VERIFIED_PYTHON=%s\n' "${python_path}" >> "${GITHUB_ENV}"
      - name: Prepare pinned validation runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          validation_root="${RUNNER_TEMP}/maintenance-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${validation_root}"
          mkdir -p "${validation_root}/python"
          "${VERIFIED_PYTHON}" scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${validation_root}/python"
          test -f "${validation_root}/python/yaml/__init__.py"
          printf 'VALIDATION_ROOT=%s\n' "${validation_root}" >> "${GITHUB_ENV}"
      - name: Run focused maintenance and Flux contract tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          PYTHONPATH="${VALIDATION_ROOT}/python:${GITHUB_WORKSPACE}/src" \
            "${VERIFIED_PYTHON}" -m unittest -v \
              tests.test_maintenance_contract \
              tests.test_maintenance_component_facade \
              tests.test_maintenance_operations_fragment \
              tests.test_maintenance_runtime \
              tests.test_maintenance_security \
              tests.test_maintenance_conformance_race \
              tests.test_maintenance_credential_separation \
              tests.test_maintenance_projection \
              tests.test_maintenance_reference_proposals \
              tests.test_flux_component_facade \
              tests.test_flux_reconcile_contract \
              tests.test_flux_reconcile_security \
              tests.test_maintenance_workflow_contract \
              tests.test_flux_reconcile_workflow_contract
      - name: Cleanup focused validation state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${VALIDATION_ROOT:-}" ]]; then
            rm -rf "${VALIDATION_ROOT}"
            test ! -e "${VALIDATION_ROOT}"
          fi
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Confirm zero Actions artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          "${VERIFIED_PYTHON:-python3}" - <<'PY'
          import json, os, urllib.request
          url=f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          request=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['GH_TOKEN']}" ,"X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(request,timeout=30) as response: count=int(json.load(response).get("total_count",0))
          if count: raise SystemExit(f"unexpected Actions artifacts: {count}")
          print("Maintenance smoke artifact policy passed: zero Actions artifacts.")
          PY
