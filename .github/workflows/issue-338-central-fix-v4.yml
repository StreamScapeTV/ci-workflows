name: Issue 338 persist validated non-workflow fixes

on:
  push:
    branches:
      - agent1/issue-338-android-live-release

permissions:
  contents: write

jobs:
  persist:
    if: ${{ github.event.head_commit.message == '[#338] Persist validated non-workflow fixes' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 40
    steps:
      - name: Check out exact validated patch base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7ae281944c23dbfc17dcd980edca4754d27b6d10
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Reproduce the exact validated patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/issue-338-central-fix-v2.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          if marker not in source:
              raise SystemExit('v2 patch heredoc start missing')
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = textwrap.dedent(body)
          namespace = {'__name__': '__main__'}
          exec(compile(script, 'issue-338-central-fix-v2-patch.py', 'exec'), namespace, namespace)
          Path('.github/workflows/issue-338-central-fix-v3.yml').unlink(missing_ok=True)
          PY

      - name: Revalidate the exact patch tree
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          python_bin="$(type -P python3.12 || type -P python3)"
          validation_root="${RUNNER_TEMP}/issue-338-central-fix-${GITHUB_RUN_ID}"
          test ! -e "${validation_root}"
          mkdir -m 0700 "${validation_root}"
          "${python_bin}" scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${validation_root}/python"
          export PYTHONPATH="${validation_root}/python:${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/tests"
          "${python_bin}" scripts/ci/validation_harness.py \
            --root . \
            --summary "${validation_root}/summary.json"
          "${python_bin}" scripts/ci/public_api_contract.py validate
          "${python_bin}" scripts/ci/public_api_contract.py render --check
          "${python_bin}" -m unittest -v \
            tests.test_android_completion \
            tests.test_public_api_contract \
            tests.test_validation_harness \
            tests.test_android_ciw_dispatch
          git diff --check
          rm -rf "${validation_root}"

      - name: Persist only non-workflow files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent1/issue-338-android-live-release
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['BRANCH_NAME']
          token = os.environ['GITHUB_TOKEN']
          paths = (
              'src/ci_workflows/public_api_contract.py',
              'src/ci_workflows/validation_policy.py',
              'tests/test_android_completion.py',
              'tests/test_public_api_contract.py',
              'tests/test_validation_harness.py',
              'docs/workflows/android-completion.md',
          )

          def request(method: str, url: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return {} if not raw else json.loads(raw)

          def get(path: str):
              return request(
                  'GET',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}?ref={urllib.parse.quote(branch, safe="")}',
              )

          for path in paths:
              current = get(path)
              content = Path(path).read_text(encoding='utf-8')
              request(
                  'PUT',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
                  {
                      'message': f'[skip ci] #338 validated Central fix: {Path(path).name}',
                      'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                      'sha': current['sha'],
                      'branch': branch,
                  },
              )
          PY
