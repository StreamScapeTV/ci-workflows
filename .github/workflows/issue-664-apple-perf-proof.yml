name: Issue 664 Apple post-680 performance proof

"on":
  push:
    branches: ["agent2/issue-664-apple-parallel"]

permissions:
  contents: read

jobs:
  fast:
    uses: ./.github/workflows/apple.yml
    with:
      repository: StreamScapeTV/iptv-apple
      ref: develop
      source_is_tag: false
      test_profile: host
      upload_private_log: true
    secrets: inherit

  broad:
    uses: ./.github/workflows/apple.yml
    with:
      repository: StreamScapeTV/iptv-apple
      ref: develop
      source_is_tag: false
      test_profile: full
      upload_private_log: true
    secrets: inherit
