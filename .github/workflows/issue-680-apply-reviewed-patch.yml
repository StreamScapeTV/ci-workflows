name: Issue 680 apply reviewed patch

on:
  push:
    branches:
      - agent3/issue-680-drive-macos-zero-offset

permissions:
  contents: write

concurrency:
  group: issue-680-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent3/issue-680-drive-macos-zero-offset
          fetch-depth: 1
      - name: Apply reviewed issue 680 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/issue680.patch <<'PATCH'
          diff --git a/actions/google-drive/action.yml b/actions/google-drive/action.yml
          index 78d09b0..b27a4e1 100644
          --- a/actions/google-drive/action.yml
          +++ b/actions/google-drive/action.yml
          @@ -283,9 +283,9 @@ runs:
                       echo "Google Drive resumable upload returned an invalid completed offset" >&2
                       exit 1
                     fi
          -          range_args=()
          +          set --
                     if test "${offset}" -gt 0; then
          -            range_args=(--header "Content-Range: bytes ${offset}-$((byte_size - 1))/${byte_size}")
          +            set -- --header "Content-Range: bytes ${offset}-$((byte_size - 1))/${byte_size}"
                     fi
                     : > "${media_headers_file}"
                     : > "${media_response_file}"
          @@ -300,7 +300,7 @@ runs:
                           --header "Authorization: Bearer ${access_token}" \
                           --header "Content-Type: ${DRIVE_MIME_TYPE}" \
                           --header "Content-Length: ${remaining}" \
          -                "${range_args[@]}" \
          +                "$@" \
                           --data-binary @- \
                           "${session_url}"
                     )"
          diff --git a/tests/test_ci_helpers.py b/tests/test_ci_helpers.py
          index c79c3e7..72e144e 100644
          --- a/tests/test_ci_helpers.py
          +++ b/tests/test_ci_helpers.py
          @@ -1,4 +1,6 @@
           from pathlib import Path
          +import subprocess
          +import tempfile
           import unittest
           import yaml
           
          @@ -84,6 +86,68 @@ class CiHelperTests(unittest.TestCase):
                   self.assertIn("Range header", text)
                   self.assertIn('Content-Range: bytes ${offset}-$((byte_size - 1))/${byte_size}', text)
           
          +    def test_google_drive_media_put_executes_zero_and_resumed_offsets_under_strict_bash(self) -> None:
          +        action = yaml.safe_load((ROOT / "actions/google-drive/action.yml").read_text())
          +        script = action["runs"]["steps"][0]["run"]
          +        lines = script.splitlines()
          +        start = next(index for index, line in enumerate(lines) if line.strip() == "run_media_put() {")
          +        end = next(
          +            index
          +            for index, line in enumerate(lines[start + 1 :], start + 1)
          +            if line.strip() == "reconcile_session() {"
          +        )
          +        function_text = "\n".join(lines[start:end]).rstrip()
          +
          +        self.assertNotIn("range_args", function_text)
          +        self.assertIn('"$@"', function_text)
          +
          +        with tempfile.TemporaryDirectory() as temp_dir:
          +            temp = Path(temp_dir)
          +            payload = temp / "payload.bin"
          +            payload.write_bytes(b"abcdef")
          +            for offset, expected_body, expected_range in (
          +                (0, b"abcdef", None),
          +                (2, b"cdef", "Content-Range: bytes 2-5/6"),
          +            ):
          +                args_file = temp / f"curl-{offset}.args"
          +                body_file = temp / f"curl-{offset}.body"
          +                harness = f'''set -Eeuo pipefail
          +{function_text}
          +byte_size=6
          +upload_path={str(payload)!r}
          +media_headers_file={str(temp / f"media-{offset}.headers")!r}
          +media_response_file={str(temp / f"media-{offset}.json")!r}
          +access_token=masked-test-token
          +DRIVE_MIME_TYPE=application/octet-stream
          +session_url=https://masked.invalid/upload-session
          +CURL_ARGS={str(args_file)!r}
          +CURL_BODY={str(body_file)!r}
          +curl() {{
          +  : > "${{CURL_ARGS}}"
          +  for arg in "$@"; do printf '%s\\n' "$arg" >> "${{CURL_ARGS}}"; done
          +  cat > "${{CURL_BODY}}"
          +  printf '200'
          +}}
          +run_media_put {offset}
          +test "${{media_curl_status}}" -eq 0
          +test "${{media_http_code}}" = 200
          +'''
          +                completed = subprocess.run(
          +                    ["bash", "-c", harness],
          +                    cwd=ROOT,
          +                    check=False,
          +                    capture_output=True,
          +                    text=True,
          +                )
          +                self.assertEqual(completed.returncode, 0, completed.stderr)
          +                self.assertEqual(body_file.read_bytes(), expected_body)
          +                curl_args = args_file.read_text()
          +                self.assertIn(f"Content-Length: {len(expected_body)}", curl_args)
          +                if expected_range is None:
          +                    self.assertNotIn("Content-Range:", curl_args)
          +                else:
          +                    self.assertIn(expected_range, curl_args)
          +
               def test_private_git_action_is_one_fixed_tailscale_boundary(self) -> None:
                   text = (ROOT / "actions/private-git/action.yml").read_text()
                   self.assertIn("tailscale/github-action@v4", text)
          PATCH
          git apply --check /tmp/issue680.patch
          git apply /tmp/issue680.patch
          rm -f .github/workflows/issue-680-apply-reviewed-patch.yml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('actions/google-drive/action.yml').read_text())
          print('action-yaml-ok')
          PY
          python3 -m unittest tests.test_ci_helpers -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add actions/google-drive/action.yml tests/test_ci_helpers.py .github/workflows/issue-680-apply-reviewed-patch.yml
          git commit -m '[skip ci] #680 apply reviewed macOS Drive patch'
          git push origin HEAD:agent3/issue-680-drive-macos-zero-offset
