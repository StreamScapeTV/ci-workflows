name: Private native image and Helm release

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      image_name:
        type: string
        required: true
      chart_name:
        type: string
        required: true
      chart_path:
        type: string
        required: true
      dockerfile_path:
        type: string
        required: false
        default: Dockerfile
      build_context:
        type: string
        required: false
        default: "."
      publish_latest_image:
        type: boolean
        required: false
        default: false
      ci_run_id:
        type: string
        required: true
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: true
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: true
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: true
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: true
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      FORGEJO_REGISTRY_USERNAME:
        required: true
      FORGEJO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

env:
  REGISTRY: git.faruqi.dev
  REGISTRY_NAMESPACE: mimranfaruqi
  CHART_NAMESPACE: mimranfaruqi/helm-charts
  PUBLISHER_SHA: b777940a39a4cdec0b0ce82d6c7485af31e0b592

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Initialize private release log
        shell: bash
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/central-release.log"
          : > "${log}"
          chmod 0600 "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Check out reviewed publisher implementation
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ env.PUBLISHER_SHA }}
          path: .ciw
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewed publisher implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${PUBLISHER_SHA}"
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

      - name: Prepare source token
        id: source_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact tagged product source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: authority
        name: Verify exact tag authority
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          git -C source show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          source_sha="$(git -C source rev-parse HEAD)"
          tag_sha="$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "${source_sha}" = "${tag_sha}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record exact tagged product source SHA
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.authority.outputs.source_sha }}

      - name: Connect to private registry service
        id: private_git
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Initialize isolated publication state
        shell: bash
        run: |
          set -Eeuo pipefail
          state_root="${RUNNER_TEMP}/private-native-image-chart"
          test ! -e "${state_root}"
          mkdir -m 0700 "${state_root}" "${state_root}/packages"
          printf '{}\n' > "${state_root}/auth.json"
          chmod 0600 "${state_root}/auth.json"
          {
            printf 'REGISTRY_AUTH_FILE=%s\n' "${state_root}/auth.json"
            printf 'HELM_REGISTRY_CONFIG=%s\n' "${state_root}/helm-registry.json"
            printf 'PACKAGE_ROOT=%s\n' "${state_root}/packages"
          } >> "${GITHUB_ENV}"

      - name: Validate bounded release inputs and hosted tools
        id: validate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          test "${{ inputs.publish_latest_image }}" = false
          test "${CI_RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(uname -m)" = "x86_64"
          buildah --version >> "${CI_LOG}" 2>&1
          skopeo --version >> "${CI_LOG}" 2>&1
          helm version --short >> "${CI_LOG}" 2>&1
          python3 .ciw/scripts/ci/native_image_chart_validate.py >> "${CI_LOG}" 2>&1

      - name: Resolve product-owned publication version
        id: publication
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -Eeuo pipefail
          chart_metadata="$(helm show chart "source/${CHART_PATH}")"
          publication_version="$(
            printf '%s\n' "${chart_metadata}" |
              awk '
                /^version:[[:space:]]+/ {
                  if (found++) exit 2
                  if (NF != 2) exit 2
                  value = $2
                }
                END {
                  if (found != 1 || value == "") exit 2
                  print value
                }
              '
          )"
          test -n "${publication_version}"
          printf 'publication_version=%s\n' "${publication_version}" >> "${GITHUB_OUTPUT}"

      - id: prepare
        name: Build image and package chart
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.ciw/src
          VERSION: ${{ steps.publication.outputs.publication_version }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          REGISTRY: localhost
          REGISTRY_NAMESPACE: ciw-private
        run: |
          set -Eeuo pipefail
          python3 .ciw/scripts/ci/native_image_chart_prepare.py >> "${CI_LOG}" 2>&1

      - name: Authenticate and require unused immutable version
        id: authenticate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.ciw/src
          CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.publication.outputs.publication_version }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHART_NAME: ${{ inputs.chart_name }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "${CI_LOG}" 2>&1
          import os
          from pathlib import Path
          from ci_workflows.packaging_primitives import registry_authenticate
          env = dict(os.environ)
          registry = os.environ["REGISTRY"]
          registry_authenticate(registry, environment=env, tool="buildah", cwd=Path("source"))
          registry_authenticate(registry, environment=env, tool="helm", cwd=Path("source"))
          PY
          image_reference="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}"
          chart_reference="${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}:${VERSION}"
          require_unused() {
            local reference="$1"
            local error_file
            error_file="$(mktemp "${RUNNER_TEMP}/private-registry-inspect.XXXXXX")"
            if skopeo inspect --authfile "${REGISTRY_AUTH_FILE}" "docker://${reference}" >> "${CI_LOG}" 2>"${error_file}"; then
              printf 'Immutable publication already exists.\n' >> "${CI_LOG}"
              rm -f "${error_file}"
              return 1
            fi
            cat "${error_file}" >> "${CI_LOG}"
            if grep -Eqi 'manifest unknown|name unknown|not found|status code: 404|statuscode: 404' "${error_file}"; then
              rm -f "${error_file}"
              return 0
            fi
            rm -f "${error_file}"
            printf 'Private registry inspection failed for a reason other than an unused immutable version.\n' >> "${CI_LOG}"
            return 1
          }
          require_unused "${image_reference}"
          require_unused "${chart_reference}"

      - name: Revalidate exact tag before publication
        id: revalidate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.ref }}
          SOURCE_SHA: ${{ steps.authority.outputs.source_sha }}
          SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          set -Eeuo pipefail
          auth_header="$(printf 'x-access-token:%s' "${SOURCE_TOKEN}" | base64 -w0)"
          git -C source \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --force --tags origin >> "${CI_LOG}" 2>&1
          unset auth_header
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${SOURCE_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Publish immutable image and chart
        id: publish
        shell: bash
        env:
          VERSION: ${{ steps.publication.outputs.publication_version }}
          IMAGE_NAME: ${{ inputs.image_name }}
          LOCAL_IMAGE_REFERENCE: ${{ steps.prepare.outputs.image_reference }}
          REMOTE_IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ inputs.image_name }}:${{ steps.publication.outputs.publication_version }}
          PACKAGE_PATH: ${{ steps.prepare.outputs.package_path }}
        run: |
          set -Eeuo pipefail
          test -n "${LOCAL_IMAGE_REFERENCE}"
          test -n "${REMOTE_IMAGE_REFERENCE}"
          test -f "${PACKAGE_PATH}"
          buildah inspect "${LOCAL_IMAGE_REFERENCE}" >> "${CI_LOG}" 2>&1
          buildah push --authfile "${REGISTRY_AUTH_FILE}" "${LOCAL_IMAGE_REFERENCE}" "docker://${REMOTE_IMAGE_REFERENCE}" >> "${CI_LOG}" 2>&1
          helm push "${PACKAGE_PATH}" "oci://${REGISTRY}/${CHART_NAMESPACE}" >> "${CI_LOG}" 2>&1

      - id: readback
        name: Authenticated private registry read-back
        shell: bash
        env:
          VERSION: ${{ steps.publication.outputs.publication_version }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHART_NAME: ${{ inputs.chart_name }}
          REMOTE_IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ inputs.image_name }}:${{ steps.publication.outputs.publication_version }}
          CHART_PACKAGE_SHA256: ${{ steps.prepare.outputs.chart_package_sha256 }}
        run: |
          set -Eeuo pipefail
          readback_root="${RUNNER_TEMP}/private-native-image-chart/readback"
          mkdir -m 0700 "${readback_root}"
          skopeo inspect --authfile "${REGISTRY_AUTH_FILE}" "docker://${REMOTE_IMAGE_REFERENCE}" > "${readback_root}/image.json"
          python3 - "${readback_root}/image.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text())
          digest = value.get("Digest", "")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("private image read-back returned no digest")
          PY
          helm pull "oci://${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}" \
            --version "${VERSION}" \
            --destination "${readback_root}" >> "${CI_LOG}" 2>&1
          chart_archive="${readback_root}/${CHART_NAME}-${VERSION}.tgz"
          test -f "${chart_archive}"
          test "$(sha256sum "${chart_archive}" | awk '{print $1}')" = "${CHART_PACKAGE_SHA256}"
          printf 'Authenticated private image/chart read-back verified.\n' >> "${CI_LOG}"

      - name: Clean publication state
        id: cleanup
        if: always()
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.ciw/src
          LOCAL_IMAGE_REFERENCE: ${{ steps.prepare.outputs.image_reference }}
          CIW_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CIW_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "${CI_LOG}" 2>&1 || true
          import os
          from pathlib import Path
          from ci_workflows.packaging_primitives import cleanup_packaging_state, registry_logout
          env = dict(os.environ)
          registry = os.environ["REGISTRY"]
          source = Path("source") if Path("source").is_dir() else Path.cwd()
          for tool in ("helm", "buildah"):
              try:
                  registry_logout(registry, environment=env, tool=tool, cwd=source)
              except Exception:
                  pass
          cleanup_packaging_state((Path(os.environ["RUNNER_TEMP"]) / "private-native-image-chart",))
          PY
          if test -n "${LOCAL_IMAGE_REFERENCE:-}"; then
            buildah rmi "${LOCAL_IMAGE_REFERENCE}" >/dev/null 2>&1 || true
          fi
          test ! -e "${RUNNER_TEMP}/private-native-image-chart"
          if test -d source/.git && test -n "${{ steps.authority.outputs.source_sha }}"; then
            test "$(git -C source rev-parse HEAD)" = "${{ steps.authority.outputs.source_sha }}"
            test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          fi
          if test -d .ciw/.git; then
            test "$(git -C .ciw rev-parse HEAD)" = "${PUBLISHER_SHA}"
            test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"
          fi

      - name: Scrub private release log
        id: scrub
        if: always()
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CI_SECRET_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY

      - name: Upload private release log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-release.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          gzip: "false"
          mime_type: text/plain

      - name: Finish Agent State run
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.private_git.outcome == 'success' && steps.validate.outcome == 'success' && steps.publication.outcome == 'success' && steps.prepare.outcome == 'success' && steps.authenticate.outcome == 'success' && steps.revalidate.outcome == 'success' && steps.publish.outcome == 'success' && steps.readback.outcome == 'success' && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && steps.cleanup.outcome == 'success' && 'succeeded' || 'failed' }}
