name: Flutter Apple validation smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/reusable-flutter.yml"
      - ".github/workflows/flutter-validation-smoke.yml"
      - ".github/workflows/flutter-apple-validation-smoke.yml"
      - "actions/validate-flutter/**"
      - "contracts/flutter-validation.json"
      - "scripts/ci/flutter.py"
      - "src/ci_workflows/flutter*.py"
      - "src/ci_workflows/ciw_flutter.py"
      - "tests/fixtures/flutter-validation/**"
      - "tests/test_flutter_validation.py"
      - "tests/test_flutter_workflow_contract.py"
      - "docs/workflows/flutter.md"
      - "docs/architecture/flutter-validation.md"

concurrency:
  group: flutter-apple-validation-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Resolve Flutter Apple smoke selector and runtime tuple
    if: >-
      ${{ github.event.pull_request.user.login == 'mimranfaruqi' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: plan
        name: Resolve contract-owned Apple selector and immutable tuple
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          platform: ios-simulator
          source_trust: trusted-pr
      - name: Require unchanged semantic Apple selector
        shell: bash
        env:
          RUNS_ON_JSON: ${{ steps.plan.outputs.runs_on_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os

          assert json.loads(os.environ["RUNS_ON_JSON"]) == ["macOS", "ARM64"]
          PY

  ios:
    name: Flutter Apple iOS simulator smoke
    needs: plan
    if: >-
      ${{ github.event.pull_request.user.login == 'mimranfaruqi' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 100
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Apple state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: apple
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - id: persistent_cache_snapshot
        name: Snapshot persistent host pub cache before Flutter setup
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: persistent-cache-snapshot
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Set up exact immutable Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-{1}', env.CI_TOOL_ROOT, needs.plan.outputs.flutter_version) }}
          pub-cache-path: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
      - id: pub_cache_bind
        name: Force Flutter pub cache beneath registered state
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: pub-cache-bind
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: toolchain
        name: Verify exact Flutter and Dart before project generation
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: verify-toolchain
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Create contract-owned iOS smoke source with isolated pub state
        shell: bash
        env:
          EXPECTED_PUB_CACHE: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
        run: |
          set -Eeuo pipefail
          test "${PUB_CACHE}" = "${EXPECTED_PUB_CACHE}"
          test -d "${PUB_CACHE}"
          test ! -L "${PUB_CACHE}"
          flutter create --no-pub --platforms=ios --project-name ciw_flutter_smoke source
          test "${PUB_CACHE}" = "${EXPECTED_PUB_CACHE}"
          test -d "${PUB_CACHE}"
          test ! -L "${PUB_CACHE}"
          (cd source && flutter pub get)
          test -f source/pubspec.lock
      - id: flutter
        name: Execute bounded iOS simulator validation
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          platform: ios-simulator
          source_trust: trusted-pr
      - id: persistent_cache_verify
        name: Prove persistent host pub cache is unchanged
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: persistent-cache-verify
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove registered Flutter and pub state and preserve primary failure
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
          primary_failure_code: ${{ steps.flutter.outputs.primary_failure_code || steps.flutter.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific and pub-cache residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Remove disposable iOS smoke source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source
          test ! -e source
      - id: workspace_cleanup
        name: Cleanup Apple workspace
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  zero_artifacts:
    name: Verify Apple routine artifacts remain zero
    needs: [plan, ios]
    if: >-
      ${{ github.event.pull_request.user.login == 'mimranfaruqi' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          always() && !cancelled() }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Require Apple smoke paths and zero Actions artifacts
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${PLAN_RESULT}" = success
          test "${IOS_RESULT}" = success
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Flutter Apple smoke retained Actions artifacts")
          print("Routine Flutter Apple Actions artifacts verified: zero.")
          PY
