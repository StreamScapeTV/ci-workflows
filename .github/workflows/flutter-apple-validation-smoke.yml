name: Flutter Apple validation smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/reusable-flutter.yml"
      - ".github/workflows/flutter-validation-smoke.yml"
      - ".github/workflows/flutter-apple-validation-smoke.yml"
      - "actions/validate-flutter/**"
      - "contracts/flutter-validation.json"
      - "scripts/ci/flutter.py"
      - "src/ci_workflows/flutter*.py"
      - "src/ci_workflows/ciw_flutter.py"
      - "tests/fixtures/flutter-validation/**"
      - "tests/test_flutter_validation.py"
      - "tests/test_flutter_workflow_contract.py"
      - "docs/workflows/flutter.md"
      - "docs/architecture/flutter-validation.md"

concurrency:
  group: flutter-apple-validation-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Resolve Flutter Apple smoke selector
    runs-on: portable
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: plan
        name: Resolve contract-owned Apple selector
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          platform: ios-simulator
          source_trust: trusted-pr

  ios:
    name: Flutter Apple iOS simulator smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 100
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Apple state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: apple
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - name: Set up exact immutable Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: "3.41.4"
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-3.41.4', env.CI_TOOL_ROOT) }}
          pub-cache-path: ${{ format('{0}/.pub-cache', env.HOME) }}
      - name: Create contract-owned iOS smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter create --no-pub --platforms=ios --project-name ciw_flutter_smoke source
          (cd source && flutter pub get)
          test -f source/pubspec.lock
      - id: flutter
        name: Execute bounded iOS simulator validation
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          platform: ios-simulator
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove Flutter-specific iOS state
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_residue
        name: Verify zero Flutter-specific iOS residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Remove disposable iOS smoke source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source
          test ! -e source
      - id: workspace_cleanup
        name: Cleanup Apple workspace
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  zero_artifacts:
    name: Verify Apple routine artifacts remain zero
    needs: [plan, ios]
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require Apple smoke paths and zero Actions artifacts
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${PLAN_RESULT}" = success
          test "${IOS_RESULT}" = success
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Flutter Apple smoke retained Actions artifacts")
          print("Routine Flutter Apple Actions artifacts verified: zero.")
          PY
