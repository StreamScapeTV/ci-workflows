name: Device lock contract smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/device-lock-contract-smoke.yml"
      - "actions/device-lock/**"
      - "contracts/device-lock.json"
      - "contracts/ciw-commands.json"
      - "docs/reference/ciw.md"
      - "src/ci_workflows/ciw.py"
      - "src/ci_workflows/ciw_device_lock.py"
      - "src/ci_workflows/device_lock.py"
      - "tests/fixtures/device-lock/**"
      - "tests/test_ciw_contracts.py"
      - "tests/test_device_lock*.py"
      - "docs/architecture/device-locking.md"
      - "RUNNERS.md"

concurrency:
  group: device-lock-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  contract_smoke:
    name: Validate synthetic cross-run fencing contract
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [linux, amd64, general]
    timeout-minutes: 30
    steps:
      - name: Initialize synthetic private backend path
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          test -n "${GITHUB_ENV:-}"
          printf 'CIW_DEVICE_LOCK_ROOT=%s/ciw-device-lock-%s-%s\n' \
            "${RUNNER_TEMP}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - name: Provision synthetic private backend root
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "${CIW_DEVICE_LOCK_ROOT}"
          mkdir -m 0700 "${CIW_DEVICE_LOCK_ROOT}"
          test "$(stat -c '%a' "${CIW_DEVICE_LOCK_ROOT}")" = "700"

      - id: focused
        name: Run focused device-lock tests
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.ciw/src \
            python3 -m unittest discover -s .ciw/tests -p 'test_device_lock*.py' -v

      - id: acquire
        name: Acquire one synthetic cross-run lock receipt
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: acquire
          device_family: android
          device_capability: instrumentation
          device_identity_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tested_source_sha: ${{ github.event.pull_request.head.sha }}
          authorization_receipt: issue-136-synthetic-owner-authorization
          request_id: issue-136-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"

      - id: verify
        name: Revalidate the exact current receipt before synthetic mutation boundary
        if: ${{ always() && steps.acquire.outputs.resource_lock_receipt != '' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: verify
          device_family: android
          device_capability: instrumentation
          device_identity_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tested_source_sha: ${{ github.event.pull_request.head.sha }}
          authorization_receipt: issue-136-synthetic-owner-authorization
          request_id: issue-136-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          minimum_remaining_seconds: "30"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: release
        name: Expected-state release the exact receipt
        if: ${{ always() && steps.acquire.outputs.resource_lock_receipt != '' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: release
          device_family: android
          device_capability: instrumentation
          device_identity_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tested_source_sha: ${{ github.event.pull_request.head.sha }}
          authorization_receipt: issue-136-synthetic-owner-authorization
          request_id: issue-136-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: residue
        name: Verify the exact receipt left no active lock residue
        if: ${{ always() && steps.release.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: residue
          device_family: android
          device_capability: instrumentation
          device_identity_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tested_source_sha: ${{ github.event.pull_request.head.sha }}
          authorization_receipt: issue-136-synthetic-owner-authorization
          request_id: issue-136-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: backend_cleanup
        name: Remove only synthetic backend control state
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RESOURCE_KEY_HASH: ${{ steps.acquire.outputs.resource_key_hash }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${RESOURCE_KEY_HASH}" ]]; then
            rm -f -- "${CIW_DEVICE_LOCK_ROOT}/leases/${RESOURCE_KEY_HASH}.json"
            rm -f -- "${CIW_DEVICE_LOCK_ROOT}/released/${RESOURCE_KEY_HASH}.json"
          fi
          rm -f -- "${CIW_DEVICE_LOCK_ROOT}/.transaction.lock"
          if [[ -d "${CIW_DEVICE_LOCK_ROOT}/leases" ]]; then
            rmdir "${CIW_DEVICE_LOCK_ROOT}/leases"
          fi
          if [[ -d "${CIW_DEVICE_LOCK_ROOT}/released" ]]; then
            rmdir "${CIW_DEVICE_LOCK_ROOT}/released"
          fi
          rmdir "${CIW_DEVICE_LOCK_ROOT}"
          test ! -e "${CIW_DEVICE_LOCK_ROOT}"
          test ! -L "${CIW_DEVICE_LOCK_ROOT}"

      - name: Project terminal synthetic lock result after cleanup
        if: always()
        shell: bash
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          BACKEND_CLEANUP_OUTCOME: ${{ steps.backend_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${FOCUSED_OUTCOME}" = success
          test "${ACQUIRE_OUTCOME}" = success
          test "${VERIFY_OUTCOME}" = success
          test "${RELEASE_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${BACKEND_CLEANUP_OUTCOME}" = success

  zero_artifacts:
    name: Verify device lock smoke artifacts remain zero
    needs: contract_smoke
    if: ${{ always() && !cancelled() }}
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    steps:
      - name: Require zero Actions artifacts and successful contract smoke
        env:
          CONTRACT_RESULT: ${{ needs.contract_smoke.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ARTIFACTS'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("device lock contract smoke retained Actions artifacts")
          print("Routine device lock contract Actions artifacts verified: zero.")
          PY_ARTIFACTS
          test "${CONTRACT_RESULT}" = success
