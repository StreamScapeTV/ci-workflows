name: Agent State command

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Fresh immutable command ID; reuse only for exact retry or replay
        required: true
        type: string
      repository:
        description: Mapped target repository in owner/name form
        required: true
        type: string
      project:
        description: Agent State project assertion from the target AGENTS.md
        required: true
        type: string
      action:
        description: Bounded Agent State action
        required: true
        type: choice
        options:
          - resume
          - start
          - claim
          - release
          - reconcile_base
          - block
          - review
          - done
          - cancel
      session_name:
        description: Exact assigned Agent N name; Codex N is rejected
        required: true
        type: string
      agent_id:
        description: Active full gpt-agent-N ID; leave empty only for resume
        required: false
        type: string
      issue_number:
        description: Originating implementation issue when required
        required: false
        type: string
      pr_number:
        description: Optional exact PR assertion for review or done
        required: false
        type: string
      task:
        description: Bounded task for start only
        required: false
        type: string
      base_sha:
        description: Exact integration SHA assertion for start or reconcile_base
        required: false
        type: string
      head_sha:
        description: Exact PR head assertion when pr_number is supplied
        required: false
        type: string
      branch:
        description: Exact receipt-bound issue branch when required
        required: false
        type: string
      files:
        description: Newline-delimited exact repository-relative file claims
        required: false
        type: string
      packages:
        description: Newline-delimited package or shared-resource claims
        required: false
        type: string
      claim_type:
        description: Claim type for start or claim only
        required: true
        default: none
        type: choice
        options:
          - none
          - advisory
          - write
          - exclusive
      claim_mode:
        description: Claim mode for start or claim only
        required: true
        default: none
        type: choice
        options:
          - none
          - exact
          - prefix
      summary:
        description: Bounded summary for review or done only
        required: false
        type: string
      reason:
        description: Bounded reason for block or cancel only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-state-command-${{ inputs.repository }}-${{ inputs.project }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  command:
    name: Execute authoritative Agent State command
    runs-on: agent-state
    timeout-minutes: 10
    outputs:
      accepted: ${{ steps.execute.outputs.accepted }}
      decision: ${{ steps.execute.outputs.decision }}
      instruction: ${{ steps.execute.outputs.instruction }}
      receipt_id: ${{ steps.execute.outputs.receipt_id }}
      agent_id: ${{ steps.execute.outputs.agent_id }}
      lifecycle_status: ${{ steps.execute.outputs.status }}
      request_id: ${{ steps.execute.outputs.request_id }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_STATE_API_URL: ${{ vars.AGENT_STATE_API_URL }}
      AGENT_STATE_API_TOKEN: ${{ secrets.AGENT_STATE_API_TOKEN }}
      TARGET_GITHUB_TOKEN: ${{ secrets.AGENT_STATE_GITHUB_TOKEN }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      INPUT_REPOSITORY: ${{ inputs.repository }}
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_SESSION_NAME: ${{ inputs.session_name }}
      INPUT_AGENT_ID: ${{ inputs.agent_id }}
      INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      INPUT_PR_NUMBER: ${{ inputs.pr_number }}
      INPUT_TASK: ${{ inputs.task }}
      INPUT_BASE_SHA: ${{ inputs.base_sha }}
      INPUT_HEAD_SHA: ${{ inputs.head_sha }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_FILES: ${{ inputs.files }}
      INPUT_PACKAGES: ${{ inputs.packages }}
      INPUT_CLAIM_TYPE: ${{ inputs.claim_type }}
      INPUT_CLAIM_MODE: ${{ inputs.claim_mode }}
      INPUT_SUMMARY: ${{ inputs.summary }}
      INPUT_REASON: ${{ inputs.reason }}

    steps:
      - name: Check out exact protected central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact protected source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - id: execute
        name: Validate typed inputs and execute transport
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m ci_workflows.agent_state_command

      - name: Remove disposable Python state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || cleanup_failed=1
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || cleanup_failed=1
          test -z "$(find . -type d -name __pycache__ -print -quit)" || cleanup_failed=1
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)" || cleanup_failed=1
          git diff --exit-code || cleanup_failed=1
          git diff --cached --exit-code || cleanup_failed=1
          exit "${cleanup_failed}"
