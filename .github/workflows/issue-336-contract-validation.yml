name: Issue 336 contract validation

on:
  push:
    branches:
      - agent1/issue-336-apple-single-executor

permissions:
  contents: read

concurrency:
  group: issue-336-contract-validation
  cancel-in-progress: true

jobs:
  contracts:
    name: Public API and full unit contracts
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Validate and render canonical public API reference
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py validate
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py render
          git diff -- docs/workflows/public-api-reference.md
          test -z "$(git diff -- docs/workflows/public-api-reference.md)"

      - name: Run complete discovered unit suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Require clean checked-out tree and zero generated residue
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
