name: Issue 336 contract validation

on:
  push:
    branches:
      - agent1/issue-336-apple-single-executor

permissions:
  contents: read

concurrency:
  group: issue-336-contract-validation
  cancel-in-progress: true

jobs:
  contracts:
    name: Apple and public API contract preflight
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Validate generated public API contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py validate
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py render --check

      - name: Run issue-owned Apple and public API contracts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m unittest -v \
            tests.test_apple_protected_full \
            tests.test_apple_workflow_contract \
            tests.test_apple_validation \
            tests.test_apple_simulator_ownership \
            tests.test_apple_terminal_cleanup \
            tests.test_apple_smoke_trigger_contract \
            tests.test_apple_ciw_dispatch \
            tests.test_public_api_contract

      - name: Require clean checked-out tree and zero generated residue
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
