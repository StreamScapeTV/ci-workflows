name: Swift binary package publication

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      source_is_tag:
        type: boolean
        required: true
      expected_source_sha:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      PACKAGE_PUBLISH_USERNAME:
        required: false
      PACKAGE_PUBLISH_TOKEN:
        required: false
      PACKAGE_READ_TOKEN:
        required: false
    outputs:
      source_sha:
        description: Exact immutable GitHub tag commit admitted by Central
        value: ${{ jobs.publish.outputs.source_sha }}
      package_revision:
        description: Exact GitHub commit resolved by the SwiftPM semantic version tag
        value: ${{ jobs.publish.outputs.package_revision }}
      package_url:
        description: Credential-free GitHub SwiftPM package URL
        value: ${{ jobs.publish.outputs.package_url }}
      package_version:
        description: Published semantic SwiftPM version
        value: ${{ jobs.publish.outputs.package_version }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: [macOS, ARM64]
    timeout-minutes: 300
    outputs:
      source_sha: ${{ steps.source_identity.outputs.source_sha }}
      package_revision: ${{ steps.publication.outputs.package_revision }}
      package_url: ${{ steps.publication.outputs.package_url }}
      package_version: ${{ steps.publication.outputs.package_version }}
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate GitHub tag request
        id: request
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
        run: |
          set -Eeuo pipefail
          test "${SOURCE_IS_TAG}" = "true" || {
            echo "Swift binary publication requires an immutable GitHub tag" >&2
            exit 2
          }
          [[ "${SOURCE_REPOSITORY}" =~ ^StreamScapeTV/[A-Za-z0-9_.-]+$ ]] || {
            echo "Swift binary publication requires one StreamScapeTV repository" >&2
            exit 2
          }
          version="${SOURCE_REF#refs/tags/}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "Swift binary publication requires a plain semantic Git tag" >&2
            exit 2
          }
          test "${SOURCE_REF}" = "${version}" || test "${SOURCE_REF}" = "refs/tags/${version}" || exit 2
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'package_url=https://github.com/%s.git\n' "${SOURCE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Check out Central validation helper
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.sha }}
          path: central-ci
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact GitHub release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ steps.request.outputs.version }}
          token: ${{ steps.source.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          if test -n "${EXPECTED_SOURCE_SHA}"; then
            [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 2
            test "${source_sha}" = "${EXPECTED_SOURCE_SHA}" || {
              echo "SwiftPM source moved after aggregate release admission" >&2
              exit 1
            }
          fi
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Validate VERSION, Package.swift and fixed product wrapper
        id: source_contract
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ steps.request.outputs.version }}
          SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          contract="${RUNNER_TEMP}/swiftpm-binary-contract.json"
          dump="${RUNNER_TEMP}/swiftpm-binary-package-dump.json"
          if ! python3 central-ci/scripts/ci/swiftpm_binary.py source-contract \
            --root source \
            --repository "${SOURCE_REPOSITORY}" \
            --version "${VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --output "${contract}" \
            --dump-output "${dump}" \
            >>"${CI_LOG}" 2>&1; then
            echo "Swift binary package contract validation failed; inspect the private CI log" >&2
            exit 1
          fi
          printf 'contract=%s\n' "${contract}" >> "${GITHUB_OUTPUT}"
          printf 'dump=%s\n' "${dump}" >> "${GITHUB_OUTPUT}"

      - name: Prepare exact-source binary artifacts
        id: prepare
        shell: bash
        env:
          CI_SWIFTPM_BINARY_PROFILE: prepare
          CI_SWIFTPM_BINARY_SOURCE_REPOSITORY: ${{ inputs.repository }}
          CI_SWIFTPM_BINARY_SOURCE_REF: refs/tags/${{ steps.request.outputs.version }}
          CI_SWIFTPM_BINARY_SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          CI_SWIFTPM_BINARY_VERSION: ${{ steps.request.outputs.version }}
          CI_SWIFTPM_BINARY_PACKAGE_URL: ${{ steps.request.outputs.package_url }}
          CI_SWIFTPM_BINARY_EVIDENCE_DIR: ${{ runner.temp }}/swiftpm-binary-evidence
          CI_SWIFTPM_BINARY_RESULT_FILE: ${{ runner.temp }}/swiftpm-binary-prepare.json
        run: |
          set -Eeuo pipefail
          rm -rf "${CI_SWIFTPM_BINARY_EVIDENCE_DIR}"
          rm -f "${CI_SWIFTPM_BINARY_RESULT_FILE}"
          mkdir -p "${CI_SWIFTPM_BINARY_EVIDENCE_DIR}"
          printf '\n===== swiftpm-binary-prepare =====\n' >>"${CI_LOG}"
          if ! (cd source && bash scripts/ci/run-swiftpm-binary.sh) >>"${CI_LOG}" 2>&1; then
            echo "Exact-source Swift binary preparation failed; inspect the private CI log" >&2
            exit 1
          fi
          test -s "${CI_SWIFTPM_BINARY_RESULT_FILE}" && test ! -L "${CI_SWIFTPM_BINARY_RESULT_FILE}" || {
            echo "Swift binary preparation did not produce its required result" >&2
            exit 2
          }
          printf 'evidence_dir=%s\n' "${CI_SWIFTPM_BINARY_EVIDENCE_DIR}" >> "${GITHUB_OUTPUT}"
          printf 'result=%s\n' "${CI_SWIFTPM_BINARY_RESULT_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Validate binary cohort against Package.swift
        id: plan
        shell: bash
        env:
          CONTRACT: ${{ steps.source_contract.outputs.contract }}
          PREPARE_RESULT: ${{ steps.prepare.outputs.result }}
          EVIDENCE_DIR: ${{ steps.prepare.outputs.evidence_dir }}
        run: |
          set -Eeuo pipefail
          normalized="${RUNNER_TEMP}/swiftpm-binary-publication-plan.json"
          if ! python3 central-ci/scripts/ci/swiftpm_binary.py validate-plan \
            --contract "${CONTRACT}" \
            --plan "${PREPARE_RESULT}" \
            --evidence-dir "${EVIDENCE_DIR}" \
            --output "${normalized}" \
            >>"${CI_LOG}" 2>&1; then
            echo "Swift binary artifact cohort does not match Package.swift; inspect the private CI log" >&2
            exit 1
          fi
          printf 'normalized=%s\n' "${normalized}" >> "${GITHUB_OUTPUT}"

      - name: Validate fixed private package credentials
        shell: bash
        env:
          CI_PACKAGE_USERNAME: ${{ secrets.PACKAGE_PUBLISH_USERNAME }}
          CI_PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          CI_PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in CI_PACKAGE_USERNAME CI_PACKAGE_PUBLISH_TOKEN CI_PACKAGE_READ_TOKEN; do
            test -n "${!name-}" || {
              echo "Missing fixed private Generic Package credential: ${name}" >&2
              exit 1
            }
          done

      - name: Connect to private package registry network
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Publish and read back immutable binary cohort
        id: publication
        shell: bash
        env:
          CI_SWIFTPM_BINARY_PACKAGE_USERNAME: ${{ secrets.PACKAGE_PUBLISH_USERNAME }}
          CI_SWIFTPM_BINARY_PACKAGE_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          CI_SWIFTPM_BINARY_PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          NORMALIZED_PLAN: ${{ steps.plan.outputs.normalized }}
          SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          PACKAGE_URL: ${{ steps.request.outputs.package_url }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -Eeuo pipefail
          receipt="${RUNNER_TEMP}/swiftpm-binary-publication-receipt.json"
          printf '\n===== swiftpm-binary-publication =====\n' >>"${CI_LOG}"
          if ! python3 central-ci/scripts/ci/swiftpm_binary.py publish \
            --plan "${NORMALIZED_PLAN}" \
            --output "${receipt}" \
            >>"${CI_LOG}" 2>&1; then
            echo "Immutable Swift binary publication/readback failed; inspect the private CI log" >&2
            exit 1
          fi
          test -s "${receipt}" && test ! -L "${receipt}" || exit 2
          printf 'package_revision=%s\n' "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'package_url=%s\n' "${PACKAGE_URL}" >> "${GITHUB_OUTPUT}"
          printf 'package_version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'receipt=%s\n' "${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Prove unauthenticated private GitHub and artifact reads fail
        id: controls
        shell: bash
        env:
          PUBLICATION_RECEIPT: ${{ steps.publication.outputs.receipt }}
          PACKAGE_URL: ${{ steps.request.outputs.package_url }}
          VERSION: ${{ steps.request.outputs.version }}
          CI_PACKAGE_USERNAME: ${{ secrets.PACKAGE_PUBLISH_USERNAME }}
          CI_PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          control_root="${RUNNER_TEMP}/swiftpm-private-controls"
          rm -rf -- "${control_root}"
          mkdir -p "${control_root}"
          identity="${control_root}/artifact-identity.json"
          python3 - "${PUBLICATION_RECEIPT}" "${identity}" >>"${CI_LOG}" <<'PY_RECEIPT'
          from pathlib import Path
          import json
          import re
          import sys

          receipt_path = Path(sys.argv[1])
          identity_path = Path(sys.argv[2])
          value = json.loads(receipt_path.read_text(encoding="utf-8"))
          expected = {
              "schemaVersion", "packageURL", "version", "packageRevision",
              "artifactCount", "replayed", "artifacts",
          }
          if not isinstance(value, dict) or set(value) != expected or value.get("schemaVersion") != 1:
              raise SystemExit("Swift binary publication receipt schema is invalid")
          artifacts = value.get("artifacts")
          if not isinstance(artifacts, list) or not 1 <= len(artifacts) <= 64:
              raise SystemExit("Swift binary publication receipt artifact count is invalid")
          if value.get("artifactCount") != len(artifacts) or not isinstance(value.get("replayed"), bool):
              raise SystemExit("Swift binary publication receipt summary is invalid")
          if not isinstance(value.get("version"), str) or len(value["version"]) > 64:
              raise SystemExit("Swift binary publication receipt version is invalid")
          if not isinstance(value.get("packageRevision"), str) or re.fullmatch(r"[0-9a-f]{40}", value["packageRevision"]) is None:
              raise SystemExit("Swift binary publication receipt revision is invalid")
          for item in artifacts:
              if not isinstance(item, dict) or set(item) != {"target", "url", "checksum", "size"}:
                  raise SystemExit("Swift binary publication receipt artifact is malformed")
              if not isinstance(item["target"], str) or re.fullmatch(r"[A-Za-z0-9_.-]{1,128}", item["target"]) is None:
                  raise SystemExit("Swift binary publication receipt target is invalid")
              if not isinstance(item["url"], str) or len(item["url"].encode("utf-8")) > 2048:
                  raise SystemExit("Swift binary publication receipt URL is invalid")
              if not isinstance(item["checksum"], str) or re.fullmatch(r"[0-9a-f]{64}", item["checksum"]) is None:
                  raise SystemExit("Swift binary publication receipt checksum is invalid")
              if isinstance(item["size"], bool) or not isinstance(item["size"], int) or not 1 <= item["size"] <= 536870912:
                  raise SystemExit("Swift binary publication receipt size is invalid")
          print("publication_receipt=" + json.dumps(value, sort_keys=True, separators=(",", ":")))
          first = artifacts[0]
          identity_path.write_text(
              json.dumps(
                  {"url": first["url"], "checksum": first["checksum"], "size": first["size"]},
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          PY_RECEIPT
          first_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["url"])' "${identity}")"
          first_checksum="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksum"])' "${identity}")"
          first_size="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["size"])' "${identity}")"

          sha256_file() {
            python3 - "$1" <<'PY_SHA256'
          from pathlib import Path
          import hashlib
          import sys

          digest = hashlib.sha256()
          with Path(sys.argv[1]).open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          print(digest.hexdigest())
          PY_SHA256
          }

          anonymous_home="${control_root}/anonymous-home"
          anonymous_body="${control_root}/anonymous-body.bin"
          anonymous_headers="${control_root}/anonymous-headers.txt"
          mkdir -p "${anonymous_home}"
          set +e
          anonymous_status="$(env -i \
            PATH="${PATH}" \
            HOME="${anonymous_home}" \
            CURL_HOME="${anonymous_home}" \
            XDG_CONFIG_HOME="${anonymous_home}" \
            curl --disable --silent --show-error \
              --output "${anonymous_body}" \
              --dump-header "${anonymous_headers}" \
              --write-out '%{http_code}' \
              --max-time 30 \
              "${first_url}" \
              2>>"${CI_LOG}")"
          anonymous_rc=$?
          set -e
          printf 'artifact_anonymous_control curl_rc=%s http_status=%s\n' "${anonymous_rc}" "${anonymous_status}" >>"${CI_LOG}"
          if test "${anonymous_rc}" -ne 0; then
            printf 'artifact_anonymous_control classification=transport_error\n' >>"${CI_LOG}"
            echo "Unauthenticated Swift binary control hit a transport failure; inspect the private CI log" >&2
            exit 1
          fi
          case "${anonymous_status}" in
            401|403)
              printf 'artifact_anonymous_control classification=authentication_refusal\n' >>"${CI_LOG}"
              ;;
            2??)
              anonymous_sha="$(sha256_file "${anonymous_body}")"
              anonymous_size="$(wc -c < "${anonymous_body}" | tr -d '[:space:]')"
              if test "${anonymous_sha}" = "${first_checksum}" && test "${anonymous_size}" = "${first_size}"; then
                printf 'artifact_anonymous_control classification=exact_artifact_access sha256=%s size=%s\n' "${anonymous_sha}" "${anonymous_size}" >>"${CI_LOG}"
                echo "Private Swift binary artifact is readable without authentication" >&2
              else
                printf 'artifact_anonymous_control classification=unexpected_2xx sha256=%s size=%s\n' "${anonymous_sha}" "${anonymous_size}" >>"${CI_LOG}"
                echo "Unauthenticated Swift binary control returned HTTP 2xx without the exact artifact; inspect the private CI log" >&2
              fi
              exit 1
              ;;
            *)
              printf 'artifact_anonymous_control classification=unexpected_http_status\n' >>"${CI_LOG}"
              echo "Unauthenticated Swift binary control did not return an explicit authentication refusal; inspect the private CI log" >&2
              exit 1
              ;;
          esac

          authenticated_home="${control_root}/authenticated-home"
          authenticated_body="${control_root}/authenticated-body.bin"
          mkdir -p "${authenticated_home}"
          umask 077
          cat >"${authenticated_home}/.netrc" <<EOF_NETRC
          machine git.faruqi.dev
            login ${CI_PACKAGE_USERNAME}
            password ${CI_PACKAGE_READ_TOKEN}
          EOF_NETRC
          chmod 600 "${authenticated_home}/.netrc"
          set +e
          authenticated_status="$(env -i \
            PATH="${PATH}" \
            HOME="${authenticated_home}" \
            CURL_HOME="${authenticated_home}" \
            XDG_CONFIG_HOME="${authenticated_home}" \
            curl --disable --silent --show-error \
              --netrc-file "${authenticated_home}/.netrc" \
              --output "${authenticated_body}" \
              --write-out '%{http_code}' \
              --max-time 120 \
              "${first_url}" \
              2>>"${CI_LOG}")"
          authenticated_rc=$?
          set -e
          printf 'artifact_authenticated_readback curl_rc=%s http_status=%s\n' "${authenticated_rc}" "${authenticated_status}" >>"${CI_LOG}"
          if test "${authenticated_rc}" -ne 0 || test "${authenticated_status}" != 200; then
            echo "Authenticated Swift binary control could not read the private artifact; inspect the private CI log" >&2
            exit 1
          fi
          authenticated_sha="$(sha256_file "${authenticated_body}")"
          authenticated_size="$(wc -c < "${authenticated_body}" | tr -d '[:space:]')"
          if test "${authenticated_sha}" != "${first_checksum}" || test "${authenticated_size}" != "${first_size}"; then
            printf 'artifact_authenticated_readback classification=identity_mismatch sha256=%s size=%s\n' "${authenticated_sha}" "${authenticated_size}" >>"${CI_LOG}"
            echo "Authenticated Swift binary control returned the wrong artifact identity; inspect the private CI log" >&2
            exit 1
          fi
          printf 'artifact_authenticated_readback classification=exact sha256=%s size=%s\n' "${authenticated_sha}" "${authenticated_size}" >>"${CI_LOG}"

          unauth_home="${control_root}/github-unauth-home"
          unauth_stderr="${control_root}/github-unauth-stderr.txt"
          mkdir -p "${unauth_home}"
          set +e
          env -i \
            PATH="${PATH}" \
            HOME="${unauth_home}" \
            XDG_CONFIG_HOME="${unauth_home}" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 \
            GIT_ASKPASS=/usr/bin/false \
            git -c credential.helper= -c core.askPass=/usr/bin/false \
              ls-remote --refs --tags "${PACKAGE_URL}" "refs/tags/${VERSION}" \
              >/dev/null 2>"${unauth_stderr}"
          git_rc=$?
          set -e
          if test "${git_rc}" -eq 0; then
            echo "Private GitHub Swift package is readable without authentication" >&2
            exit 1
          fi
          if ! grep -Eqi 'authentication failed|could not read Username|terminal prompts disabled|repository not found|requested URL returned error: (401|403)' "${unauth_stderr}"; then
            printf 'github_unauthenticated_control git_rc=%s classification=unclassified_failure\n' "${git_rc}" >>"${CI_LOG}"
            echo "Unauthenticated GitHub package control failed without authentication-refusal evidence; inspect the private CI log" >&2
            exit 1
          fi
          printf 'github_unauthenticated_control git_rc=%s classification=authentication_required\n' "${git_rc}" >>"${CI_LOG}"
          printf 'Unauthenticated GitHub package and private binary HTTPS controls rejected as required; authenticated binary identity readback matched publication receipt.\n' >>"${CI_LOG}"

      - name: Run two fresh ordinary SwiftPM/Xcode consumers
        id: consumer
        shell: bash
        env:
          CI_GITHUB_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_PACKAGE_USERNAME: ${{ secrets.PACKAGE_PUBLISH_USERNAME }}
          CI_PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          CONTRACT: ${{ steps.source_contract.outputs.contract }}
        run: |
          set -Eeuo pipefail
          askpass="${RUNNER_TEMP}/github-swiftpm-askpass.sh"
          cat >"${askpass}" <<'SH_ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${CI_GITHUB_SOURCE_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          SH_ASKPASS
          chmod 700 "${askpass}"

          wrapper="${GITHUB_WORKSPACE}/source/scripts/ci/run-swiftpm-binary.sh"
          for attempt in 1 2; do
            home="${RUNNER_TEMP}/swiftpm-consumer-home-${attempt}"
            work="${RUNNER_TEMP}/swiftpm-consumer-work-${attempt}"
            result="${RUNNER_TEMP}/swiftpm-consumer-result-${attempt}.json"
            rm -rf "${home}" "${work}" "${result}"
            mkdir -p "${home}" "${work}"
            umask 077
            cat >"${home}/.netrc" <<EOF_NETRC
          machine github.com
            login x-access-token
            password ${CI_GITHUB_SOURCE_TOKEN}
          machine git.faruqi.dev
            login ${CI_PACKAGE_USERNAME}
            password ${CI_PACKAGE_READ_TOKEN}
          EOF_NETRC
            chmod 600 "${home}/.netrc"
            printf '\n===== swiftpm-binary-consumer-%s =====\n' "${attempt}" >>"${CI_LOG}"
            if ! (cd "${RUNNER_TEMP}" && env \
              HOME="${home}" \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_ASKPASS="${askpass}" \
              GIT_TERMINAL_PROMPT=0 \
              CI_SWIFTPM_BINARY_PROFILE=consumer \
              CI_SWIFTPM_BINARY_CONTEXT_FILE="${CONTRACT}" \
              CI_SWIFTPM_BINARY_WORK_DIR="${work}" \
              CI_SWIFTPM_BINARY_RESULT_FILE="${result}" \
              bash "${wrapper}") >>"${CI_LOG}" 2>&1; then
              echo "Fresh SwiftPM/Xcode consumer ${attempt} failed; inspect the private CI log" >&2
              exit 1
            fi
            test -s "${result}" && test ! -L "${result}" || exit 2
          done
          printf 'result_one=%s\n' "${RUNNER_TEMP}/swiftpm-consumer-result-1.json" >> "${GITHUB_OUTPUT}"
          printf 'result_two=%s\n' "${RUNNER_TEMP}/swiftpm-consumer-result-2.json" >> "${GITHUB_OUTPUT}"

      - name: Validate fresh consumer acceptance evidence
        id: evidence
        shell: bash
        env:
          CONTRACT: ${{ steps.source_contract.outputs.contract }}
          RESULT_ONE: ${{ steps.consumer.outputs.result_one }}
          RESULT_TWO: ${{ steps.consumer.outputs.result_two }}
        run: |
          set -Eeuo pipefail
          if ! python3 central-ci/scripts/ci/swiftpm_binary.py validate-consumer \
            --contract "${CONTRACT}" \
            --result-one "${RESULT_ONE}" \
            --result-two "${RESULT_TWO}" \
            >>"${CI_LOG}" 2>&1; then
            echo "Fresh SwiftPM consumer acceptance evidence is invalid; inspect the private CI log" >&2
            exit 1
          fi
          printf 'Two fresh GitHub-tagged SwiftPM/Xcode consumers accepted.\n' >>"${CI_LOG}"

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_LOG_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_PACKAGE_USERNAME: ${{ secrets.PACKAGE_PUBLISH_USERNAME }}
          CI_SECRET_PACKAGE_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          CI_SECRET_PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path
          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-apple-swiftpm.txt
          mime_type: text/plain

      - name: Clean Swift binary publication workspace
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf \
            "${RUNNER_TEMP}/swiftpm-binary-evidence" \
            "${RUNNER_TEMP}/swiftpm-private-controls" \
            "${RUNNER_TEMP}/swiftpm-unauth-home" \
            "${RUNNER_TEMP}/swiftpm-consumer-home-1" \
            "${RUNNER_TEMP}/swiftpm-consumer-home-2" \
            "${RUNNER_TEMP}/swiftpm-consumer-work-1" \
            "${RUNNER_TEMP}/swiftpm-consumer-work-2"
          rm -f \
            "${RUNNER_TEMP}/swiftpm-binary-contract.json" \
            "${RUNNER_TEMP}/swiftpm-binary-package-dump.json" \
            "${RUNNER_TEMP}/swiftpm-binary-prepare.json" \
            "${RUNNER_TEMP}/swiftpm-binary-publication-plan.json" \
            "${RUNNER_TEMP}/swiftpm-binary-publication-receipt.json" \
            "${RUNNER_TEMP}/swiftpm-consumer-result-1.json" \
            "${RUNNER_TEMP}/swiftpm-consumer-result-2.json" \
            "${RUNNER_TEMP}/github-swiftpm-askpass.sh" \
            "${CI_LOG}"

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: >-
            ${{ steps.source_contract.outcome == 'success'
                && steps.prepare.outcome == 'success'
                && steps.plan.outcome == 'success'
                && steps.publication.outcome == 'success'
                && steps.controls.outcome == 'success'
                && steps.consumer.outcome == 'success'
                && steps.evidence.outcome == 'success'
                && steps.scrub.outcome == 'success'
                && steps.drive.outcome == 'success'
                && steps.cleanup.outcome == 'success'
                && 'succeeded' || 'failed' }}
