name: Reusable organization artifact cleanup

on:
  workflow_call:
    inputs:
      repository_scope:
        description: Optional checked-in project identifier; empty means every allowlisted project
        required: false
        type: string
      dry_run:
        description: Report deletion candidates without deleting
        required: false
        default: true
        type: boolean
      request_id:
        description: Bounded caller-generated request identifier
        required: true
        type: string
    secrets:
      organization_maintenance_token:
        description: Least-privilege organization Actions maintenance token
        required: true
    outputs:
      result: {value: '${{ jobs.cleanup.outputs.result }}'}
      mutation_count: {value: '${{ jobs.cleanup.outputs.mutation_count }}'}
      request_id: {value: '${{ jobs.cleanup.outputs.request_id }}'}
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    name: Maintenance / Artifact cleanup
    runs-on: [linux, amd64, general]
    timeout-minutes: 60
    outputs:
      result: ${{ steps.cleanup.outputs.result }}
      mutation_count: ${{ steps.cleanup.outputs.mutation_count }}
      request_id: ${{ steps.cleanup.outputs.request_id }}
    steps:
      - name: Run bounded artifact maintenance
        id: cleanup
        uses: StreamScapeTV/ci-workflows/actions/maintenance-artifacts@ac5b6be68ea2aa562ccc513103dbdd9b6c23d7ad # issue #20 immutable maintenance action checkpoint
        with:
          repository_scope: ${{ inputs.repository_scope }}
          dry_run: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
          token: ${{ secrets.organization_maintenance_token }}
      - name: Cleanup maintenance workflow state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/ci-workflows-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${state}"
          test ! -e "${state}"
