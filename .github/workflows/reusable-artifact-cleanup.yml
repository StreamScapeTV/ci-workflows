name: Reusable organization artifact cleanup

on:
  workflow_call:
    inputs:
      repository_scope:
        description: Optional checked-in project identifier; empty means every allowlisted project
        required: false
        type: string
      dry_run:
        description: Report deletion candidates without deleting
        required: false
        default: true
        type: boolean
      request_id:
        description: Bounded caller-generated request identifier
        required: true
        type: string
    secrets:
      organization_maintenance_token:
        description: Least-privilege organization Actions maintenance token
        required: true
    outputs:
      result: {value: '${{ jobs.cleanup.outputs.result }}'}
      mutation_count: {value: '${{ jobs.cleanup.outputs.mutation_count }}'}
      request_id: {value: '${{ jobs.cleanup.outputs.request_id }}'}
permissions:
  actions: write
  contents: read
concurrency:
  group: maintenance-artifacts-${{ inputs.repository_scope || 'all' }}
  cancel-in-progress: false
jobs:
  cleanup:
    name: Maintenance / Artifact cleanup
    runs-on: [linux, amd64, general]
    timeout-minutes: 60
    outputs:
      result: ${{ steps.cleanup.outputs.result }}
      mutation_count: ${{ steps.cleanup.outputs.mutation_count }}
      request_id: ${{ steps.cleanup.outputs.request_id }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact central workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ job.workflow_repository }}" = "StreamScapeTV/ci-workflows"
          test "$(git -C .ciw rev-parse HEAD)" = "${{ job.workflow_sha }}"
      - id: cleanup
        uses: ./.ciw/actions/maintenance-artifacts
        with:
          repository_scope: ${{ inputs.repository_scope }}
          dry_run: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
          token: ${{ secrets.organization_maintenance_token }}
