name: Reusable Helm validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      product_id:
        description: Approved Helm product identity
        required: true
        type: string
      release_version:
        description: Optional exact chart version assertion
        required: false
        type: string
      values_profile:
        description: Optional checked-in product values profile
        required: false
        type: string
      policy_path:
        description: Optional fixed product policy path
        required: false
        type: string
      artifact_exception_id:
        description: Must remain empty; this workflow retains no package artifact
        required: false
        type: string
    outputs:
      result:
        description: Success only after terminal cleanup
        value: ${{ jobs.validate.outputs.result }}
      chart_digest:
        description: SHA-256 of the deterministic normalized chart package
        value: ${{ jobs.validate.outputs.chart_digest }}
      artifact_exception_used:
        description: Always false for the zero-artifact Helm family
        value: ${{ jobs.validate.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded Helm validation plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - name: Check out exact called workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact called workflow source
        shell: bash
        env:
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "${CALLED_WORKFLOW_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          (cd .ciw && test "$(git rev-parse HEAD)" = "${CALLED_WORKFLOW_SHA}")
      - id: plan
        name: Resolve fixed Helm contract
        uses: ./.ciw/actions/validate-helm
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          values_profile: ${{ inputs.values_profile }}
          policy_path: ${{ inputs.policy_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository && 'untrusted-fork' || (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'trusted-pr' || 'trusted-exact' }}

  validate:
    name: CI / Helm validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 60
    outputs:
      result: ${{ steps.helm.outcome == 'success' && steps.helm_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      chart_digest: ${{ steps.helm.outputs.chart_digest }}
      artifact_exception_used: ${{ steps.helm.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact called workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact called workflow source
        shell: bash
        env:
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "${CALLED_WORKFLOW_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          (cd .ciw && test "$(git rev-parse HEAD)" = "${CALLED_WORKFLOW_SHA}")
      - name: Check out exact admitted caller source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
      - name: Prepare isolated Helm state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}
      - id: helm
        name: Validate and deterministically package Helm chart
        continue-on-error: true
        uses: ./.ciw/actions/validate-helm
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          values_profile: ${{ inputs.values_profile }}
          policy_path: ${{ inputs.policy_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: helm_cleanup
        name: Remove Helm package and credential state
        if: always()
        uses: ./.ciw/actions/validate-helm
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: residue
        name: Verify zero Helm-specific residue
        if: always()
        uses: ./.ciw/actions/validate-helm
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: workspace_cleanup
        name: Remove and verify all registered workspace state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace
      - name: Verify exact caller source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}" && test -z "$(git status --porcelain --untracked-files=all)")
      - name: Project terminal Helm validation status
        if: always()
        shell: bash
        env:
          HELM_OUTCOME: ${{ steps.helm.outcome }}
          HELM_CLEANUP_OUTCOME: ${{ steps.helm_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${HELM_OUTCOME}" = success
          test "${HELM_CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
