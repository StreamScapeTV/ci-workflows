name: Delete repository branch

"on":
  delete:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      branch:
        type: string
        required: true
      expected_head:
        type: string
        required: false
        default: ''
      ci_run_id:
        type: string
        required: false
        default: ''
      deletion_source:
        type: string
        required: false
        default: agent-state
      deleted_ref_type:
        type: string
        required: false
        default: ''
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: true
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: true
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: branch-retirement-${{ github.event_name == 'delete' && github.repository || inputs.repository }}-${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
  cancel-in-progress: false

jobs:
  delete:
    outputs:
      repository: ${{ steps.request.outputs.repository }}
      branch: ${{ steps.request.outputs.branch }}
      deletion_source: ${{ steps.request.outputs.deletion_source }}
      branch_was_present: ${{ steps.delete_branch.outputs.branch_was_present }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mark Agent State run as running
        if: ${{ github.event_name != 'delete' && inputs.deletion_source != 'github-delete-event' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate bounded branch deletion inputs
        id: request
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.event_name == 'delete' && github.repository || inputs.repository }}
          TARGET_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DELETION_SOURCE: ${{ github.event_name == 'delete' && 'github-delete-event' || inputs.deletion_source }}
          DELETED_REF_TYPE: ${{ github.event_name == 'delete' && github.event.ref_type || inputs.deleted_ref_type }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import re

          repository = os.environ["TARGET_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          ci_run_id = os.environ["CI_RUN_ID"]
          deletion_source = os.environ["DELETION_SOURCE"]
          deleted_ref_type = os.environ["DELETED_REF_TYPE"]

          if not re.fullmatch(r"StreamScapeTV/[A-Za-z0-9_.-]{1,100}", repository):
              raise SystemExit("branch deletion repository must be one bounded StreamScapeTV owner/name")
          if branch in {"main", "develop"}:
              raise SystemExit("branch deletion refuses protected integration branch names")
          if branch.startswith("refs/"):
              raise SystemExit("branch deletion requires one logical branch name, not a full ref")
          if not branch or len(branch.encode("utf-8")) > 255 or "\x00" in branch:
              raise SystemExit("branch deletion branch name is invalid")
          if deletion_source not in {"agent-state", "github-delete-event"}:
              raise SystemExit("branch deletion source is invalid")

          if deletion_source == "agent-state":
              if deleted_ref_type:
                  raise SystemExit("Agent State branch deletion does not accept deleted_ref_type")
              if not re.fullmatch(r"[0-9a-f]{40}", expected_head):
                  raise SystemExit("branch deletion expected_head must be one lowercase 40-character Git SHA")
              if not ci_run_id:
                  raise SystemExit("Agent State branch deletion requires ci_run_id")
          else:
              if deleted_ref_type != "branch":
                  raise SystemExit("GitHub delete-event cleanup accepts branch refs only")
              if expected_head:
                  raise SystemExit("GitHub delete-event cleanup does not accept expected_head")
              if ci_run_id:
                  raise SystemExit("GitHub delete-event cleanup does not use Agent State ci_run_id")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository_name={repository.split('/', 1)[1]}\n")
              output.write(f"repository={repository}\n")
              output.write(f"branch={branch}\n")
              output.write(f"deletion_source={deletion_source}\n")
          PY
          git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null 2>&1 || {
            echo "branch deletion branch name is not a valid Git branch" >&2
            exit 2
          }

      - name: Create exact target repository token
        id: target_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.request.outputs.repository_name }}
          permission-contents: ${{ steps.request.outputs.deletion_source == 'github-delete-event' && 'read' || 'write' }}
          permission-metadata: read

      - name: Delete exact eligible branch
        id: delete_branch
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ steps.request.outputs.repository }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          DELETION_SOURCE: ${{ steps.request.outputs.deletion_source }}
          TARGET_TOKEN: ${{ steps.target_token.outputs.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api_root = "https://api.github.com"
          repository = os.environ["TARGET_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          deletion_source = os.environ["DELETION_SOURCE"]
          token = os.environ["TARGET_TOKEN"]
          github_delete_event = deletion_source == "github-delete-event"

          owner, repository_name = repository.split("/", 1)
          encoded_owner = urllib.parse.quote(owner, safe="")
          encoded_repository = urllib.parse.quote(repository_name, safe="")
          encoded_branch = urllib.parse.quote(branch, safe="")
          encoded_ref_branch = urllib.parse.quote(branch, safe="/")
          repository_path = f"/repos/{encoded_owner}/{encoded_repository}"
          branch_path = f"{repository_path}/branches/{encoded_branch}"
          rules_path = f"{repository_path}/rules/branches/{encoded_branch}"
          delete_path = f"{repository_path}/git/refs/heads/{encoded_ref_branch}"
          private_rules_unavailable_message = "Upgrade to GitHub Pro or make this repository public to enable this feature."

          def api(
              path: str,
              *,
              method: str = "GET",
              allow_not_found: bool = False,
              allow_private_feature_unavailable: bool = False,
              label: str = "request",
          ):
              request = urllib.request.Request(
                  api_root + path,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "StreamScapeTV-central-branch-maintenance",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  if allow_not_found and exc.code == 404:
                      return None
                  accepted = (exc.headers.get("X-Accepted-GitHub-Permissions") or "").strip()
                  message = ""
                  try:
                      payload = json.loads(exc.read().decode("utf-8", errors="replace"))
                      if isinstance(payload, dict) and isinstance(payload.get("message"), str):
                          message = " ".join(payload["message"].split())[:240]
                  except (json.JSONDecodeError, UnicodeError):
                      pass
                  if (
                      allow_private_feature_unavailable
                      and exc.code == 403
                      and "metadata=read" in {value.strip() for value in accepted.split(",")}
                      and message == private_rules_unavailable_message
                  ):
                      print(
                          "GitHub branch rules feature is unavailable for this private repository plan; "
                          "continuing with main/develop, live-default, protected-branch, exact-head, and server-side deletion guards."
                      )
                      return []
                  detail = f"; accepted-permissions={accepted}" if accepted else ""
                  if message:
                      detail += f"; message={message}"
                  raise SystemExit(
                      f"GitHub branch maintenance {label} was refused with HTTP {exc.code}{detail}"
                  ) from None
              except urllib.error.URLError:
                  raise SystemExit("GitHub branch maintenance request failed") from None
              if method == "DELETE":
                  return None
              try:
                  return json.loads(body)
              except json.JSONDecodeError:
                  raise SystemExit("GitHub branch maintenance returned invalid JSON") from None

          def validate_live_state():
              repository_value = api(repository_path, label="repository metadata")
              if not isinstance(repository_value, dict) or repository_value.get("full_name") != repository:
                  raise SystemExit("GitHub branch maintenance repository identity mismatch")
              if repository_value.get("default_branch") == branch:
                  raise SystemExit("branch deletion refuses the repository live default branch")
              private_repository = repository_value.get("private") is True

              branch_value = api(branch_path, allow_not_found=True, label="branch metadata")
              if branch_value is None:
                  return None
              if github_delete_event:
                  raise SystemExit("GitHub delete-event cleanup refuses to delete Drive state while the branch still exists")
              if not isinstance(branch_value, dict) or branch_value.get("name") != branch:
                  raise SystemExit("GitHub branch maintenance branch identity mismatch")
              if branch_value.get("protected") is not False:
                  raise SystemExit("branch deletion refuses a protected branch")
              head = branch_value.get("commit", {}).get("sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise SystemExit("GitHub branch maintenance returned an invalid branch head")
              if head != expected_head:
                  raise SystemExit("branch deletion expected head is stale")

              rules = []
              for page in range(1, 11):
                  page_rules = api(
                      f"{rules_path}?per_page=100&page={page}",
                      allow_private_feature_unavailable=private_repository,
                      label="branch rules",
                  )
                  if not isinstance(page_rules, list):
                      raise SystemExit("GitHub branch maintenance could not verify branch rules")
                  rules.extend(page_rules)
                  if len(page_rules) < 100:
                      break
              else:
                  raise SystemExit("GitHub branch maintenance branch rules exceed the bounded verification limit")
              if any(isinstance(rule, dict) and rule.get("type") == "deletion" for rule in rules):
                  raise SystemExit("branch deletion refuses a branch protected by a deletion rule")
              return head

          initial_head = validate_live_state()
          if github_delete_event:
              if initial_head is not None:
                  raise SystemExit("GitHub delete-event cleanup requires the exact branch to be absent")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("branch_was_present=false\n")
              print("GitHub delete event branch absence verified; continuing with same-ref Drive snapshot cleanup.")
              raise SystemExit(0)

          if initial_head is None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("branch_was_present=false\n")
              print("Branch is already absent; continuing with same-ref Drive snapshot cleanup.")
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("branch_was_present=true\n")
          final_head = validate_live_state()
          if final_head is None:
              print("Branch became absent after validation; continuing with same-ref Drive snapshot cleanup.")
              raise SystemExit(0)
          if final_head != expected_head:
              raise SystemExit("branch deletion expected head changed before deletion")
          api(delete_path, method="DELETE", label="branch ref deletion")
          PY

      - name: Record bounded GitHub deletion result
        if: ${{ steps.delete_branch.outcome == 'success' }}
        shell: bash
        run: |
          printf '%s\n' 'GitHub branch is absent after bounded branch-retirement validation.' >> "${GITHUB_STEP_SUMMARY}"

  snapshot_cleanup:
    needs: delete
    if: ${{ needs.delete.result == 'success' }}
    uses: ./.github/workflows/source-snapshot-delete.yml
    with:
      repository: ${{ needs.delete.outputs.repository }}
      ref: ${{ needs.delete.outputs.branch }}
      expected_source_sha: ''
    secrets: inherit

  finish:
    needs:
      - delete
      - snapshot_cleanup
    if: ${{ always() && github.event_name != 'delete' && inputs.deletion_source != 'github-delete-event' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Finish Agent State run
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ needs.delete.result == 'success' && needs.snapshot_cleanup.result == 'success' && 'succeeded' || 'failed' }}
