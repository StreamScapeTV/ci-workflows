name: Issue 577 Android Tailscale proof

"on":
  push:
    branches:
      - orchestrator/issue-577-tailscale-android

permissions:
  contents: read

jobs:
  private-git-buildah:
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 10
    steps:
      - name: Prove shared private-Git action on Buildah capacity
        uses: StreamScapeTV/ci-workflows/actions/private-git@orchestrator/issue-577-tailscale-android
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

  full:
    uses: ./.github/workflows/android.yml
    with:
      repository: StreamScapeTV/iptv-android
      ref: 7d8aed24cef77d883624e134c2cb000f6d0f17d9
      test_profile: full
      project_directory: .
      room_schema: true
      upload_private_log: true
    secrets: inherit

  release:
    uses: ./.github/workflows/android.yml
    with:
      repository: StreamScapeTV/iptv-android
      ref: 7d8aed24cef77d883624e134c2cb000f6d0f17d9
      test_profile: release
      project_directory: .
      room_schema: false
      upload_private_log: true
    secrets: inherit
