name: OCI publication exact-head mock smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-oci-publish.yml
      - .github/workflows/oci-publish-smoke.yml
      - actions/publish-oci/**
      - actions/validate-oci/**
      - contracts/oci-products.json
      - contracts/oci-publication.schema.json
      - contracts/runner-profiles.json
      - docs/workflows/oci-publish.md
      - generated/oci-engine-mapping.json
      - generated/runner-mappings.json
      - scripts/ci/oci_publish.py
      - src/ci_workflows/oci.py
      - src/ci_workflows/ciw_oci.py
      - src/ci_workflows/issue_dependency_manifest.py
      - src/ci_workflows/oci_contract.py
      - src/ci_workflows/oci_execution.py
      - src/ci_workflows/oci_execution_safe.py
      - src/ci_workflows/oci_publish*.py
      - src/ci_workflows/oci_supply_evidence.py
      - src/ci_workflows/oci_types.py
      - tests/fixtures/oci-publish/**
      - tests/test_oci_capacity_roots.py
      - tests/test_oci_publication*.py
      - tests/test_oci_registry_write_policy.py

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-publish-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mock_validation:
    name: CI / OCI publication mock validation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [linux, amd64, buildah, tiny]
    timeout-minutes: 20
    steps:
      - name: Check out exact same-repository pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact mock-smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test ! -e /var/lib/containers/cache
          test ! -L /var/lib/containers/cache

      - id: immutable_checkpoint
        name: Exercise the immutable publication checkpoint residue guard
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@be0ec9505800bb5678083fc7ce912be83a90f139 # issue #17 immutable publication helper checkpoint
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          release_authority_sha: ${{ github.event.pull_request.head.sha }}
          product_id: ciw-oci-publish-smoke
          release_version: 1.2.3
          platform_set: linux-amd64

      - name: Verify the immutable checkpoint returned a clean result
        shell: bash
        env:
          CHECKPOINT_RESULT: ${{ steps.immutable_checkpoint.outputs.result }}
          CHECKPOINT_CLEANUP: ${{ steps.immutable_checkpoint.outputs.cleanup_result }}
        run: |
          set -Eeuo pipefail
          test "${CHECKPOINT_RESULT}" = success
          test "${CHECKPOINT_CLEANUP}" = success

      - name: Run focused trusted-publication and recovery tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v \
            tests.test_oci_publication \
            tests.test_oci_publication_assertion_evidence \
            tests.test_oci_publication_contract_alignment \
            tests.test_oci_publication_event_guard \
            tests.test_oci_publication_facade \
            tests.test_oci_publication_failure_codes \
            tests.test_oci_publication_filesystem \
            tests.test_oci_publication_output_bounds \
            tests.test_oci_publication_recovery \
            tests.test_oci_publication_workflow_contract \
            tests.test_oci_registry_write_policy \
            tests.test_oci_terminal_supply_evidence \
            tests.test_oci_capacity_roots

      - name: Compile publication, facade, and CIW adapters
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            scripts/ci/oci_publish.py \
            src/ci_workflows/oci.py \
            src/ci_workflows/ciw_oci.py \
            src/ci_workflows/issue_dependency_manifest.py \
            src/ci_workflows/oci_contract.py \
            src/ci_workflows/oci_publish.py \
            src/ci_workflows/oci_publish_assertions.py \
            src/ci_workflows/oci_publish_contract.py \
            src/ci_workflows/oci_publish_guards.py \
            src/ci_workflows/oci_supply_evidence.py \
            src/ci_workflows/oci_types.py \
            tests/test_oci_publication.py \
            tests/test_oci_publication_assertion_evidence.py \
            tests/test_oci_publication_contract_alignment.py \
            tests/test_oci_publication_event_guard.py \
            tests/test_oci_publication_facade.py \
            tests/test_oci_publication_failure_codes.py \
            tests/test_oci_publication_filesystem.py \
            tests/test_oci_publication_output_bounds.py \
            tests/test_oci_publication_recovery.py \
            tests/test_oci_publication_workflow_contract.py \
            tests/test_oci_registry_write_policy.py \
            tests/test_oci_terminal_supply_evidence.py \
            tests/test_oci_capacity_roots.py

      - name: Verify smoke source remains clean and credential-free
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e /var/lib/containers/cache
          test ! -L /var/lib/containers/cache
          for parent in /var/tmp/buildah /var/lib/containers/storage /run/containers/storage; do
            test -d "${parent}"
            test ! -L "${parent}"
            test -z "$(find "${parent}" -maxdepth 1 -name 'ciw-oci-publish-*' -print -quit)"
          done

      - name: Confirm exact run retained zero Actions artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if int(payload.get("total_count", 0)) != 0 or payload.get("artifacts") != []:
              raise SystemExit("OCI publication smoke retained an artifact")
          PY
