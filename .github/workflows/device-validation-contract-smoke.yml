name: Device validation contract smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-device.yml
      - .github/workflows/device-validation-contract-smoke.yml
      - actions/validate-device/**
      - contracts/device-*.json
      - contracts/public-workflows.json
      - contracts/public-workflows/validation.json
      - contracts/public-workflow-types.json
      - contracts/permission-profiles.json
      - src/ci_workflows/device*.py
      - src/ci_workflows/ciw_device.py
      - tests/device_test_support.py
      - tests/test_device_*.py
      - tests/test_public_api_contract.py
      - tests/fixtures/device-validation/**
      - tests/fixtures/public-api/callers.json
      - docs/workflows/devices.md
      - docs/workflows/public-api-reference.md
      - docs/architecture/device-validation.md
  push:
    branches:
      - main
      - 'agent*/**'
      - 'agent/**'
      - 'issue/**'
    paths:
      - .github/workflows/reusable-device.yml
      - .github/workflows/device-validation-contract-smoke.yml
      - actions/validate-device/**
      - contracts/device-*.json
      - contracts/public-workflows.json
      - contracts/public-workflows/validation.json
      - contracts/public-workflow-types.json
      - contracts/permission-profiles.json
      - src/ci_workflows/device*.py
      - src/ci_workflows/ciw_device.py
      - tests/device_test_support.py
      - tests/test_device_*.py
      - tests/test_public_api_contract.py
      - tests/fixtures/device-validation/**
      - tests/fixtures/public-api/callers.json
      - docs/workflows/devices.md
      - docs/workflows/public-api-reference.md
      - docs/architecture/device-validation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_tests:
    name: Device source contracts
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch_depth: "1"
      - name: Run focused device and public API regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          PYTHONPATH=src:tests python3 -m unittest \
            tests.test_device_admission_plan \
            tests.test_device_denied_plan \
            tests.test_device_fixture_completeness \
            tests.test_device_inventory_evidence \
            tests.test_device_live_safe \
            tests.test_device_workflow_contract \
            tests.test_public_api_contract
      - name: Remove exact source
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a7865f420e7ff37893907bbd0c4ad557a0e9ca6 # issue #479 same-repository PR event checkpoint
        with:
          phase: cleanup-checkout
          source_root: source

  authorized_pr_plan:
    name: Authorized same-repository PR device plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - id: plan
        name: Prove caller PR event remains trusted-exact
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a7865f420e7ff37893907bbd0c4ad557a0e9ca6 # issue #479 same-repository PR event checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
          CIW_DEVICE_AUTHORIZATION_RECEIPT: >-
            {"device_capability":"pr-contract","device_family":"ios","not_after_epoch":4102444799,"packet_version":"device-authorization/1","repository":"StreamScapeTV/ci-workflows","request_id":"issue-479-pr-contract","source_sha":"${{ github.event.pull_request.head.sha }}"}
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          device_family: ios
          device_capability: pr-contract
          host_capacity: apple
          prepare_script_path: tests/fixtures/device-validation/scripts/prepare.sh
          test_script_path: tests/fixtures/device-validation/scripts/test.sh
          evidence_script_path: tests/fixtures/device-validation/scripts/evidence.sh
          cleanup_script_path: tests/fixtures/device-validation/scripts/cleanup.sh
          arguments_json: '[]'
          environment_json: '{}'
          max_duration_minutes: "15"
          request_id: issue-479-pr-contract
      - name: Require authorized exact PR plan without device execution
        shell: bash
        env:
          RESULT: ${{ steps.plan.outputs.result }}
          AUTHORIZED: ${{ steps.plan.outputs.execution_authorized }}
          FAILURE: ${{ steps.plan.outputs.authorization_failure }}
          TRUST: ${{ steps.plan.outputs.derived_source_trust }}
          ADMITTED_SHA: ${{ steps.plan.outputs.admitted_sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$RESULT" = planned
          test "$AUTHORIZED" = true
          test -z "$FAILURE"
          test "$TRUST" = trusted-exact
          test "$ADMITTED_SHA" = "$EXPECTED_SHA"

  synthetic:
    name: Synthetic ${{ matrix.family }} device contract
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: android
            capability: synthetic-android
            host_capacity: mobile
            inventory: tests/fixtures/device-validation/android.txt
          - family: ios
            capability: synthetic-ios
            host_capacity: apple
            inventory: tests/fixtures/device-validation/ios.json
          - family: tvos
            capability: synthetic-tvos
            host_capacity: apple
            inventory: tests/fixtures/device-validation/tvos.json
    steps:
      - name: Check out exact source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch_depth: "1"
      - id: synthetic
        name: Execute synthetic product-neutral device contract
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a7865f420e7ff37893907bbd0c4ad557a0e9ca6 # issue #479 same-repository PR event checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "false"
        with:
          phase: synthetic
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          device_family: ${{ matrix.family }}
          device_capability: ${{ matrix.capability }}
          host_capacity: ${{ matrix.host_capacity }}
          prepare_script_path: tests/fixtures/device-validation/scripts/prepare.sh
          test_script_path: tests/fixtures/device-validation/scripts/test.sh
          evidence_script_path: tests/fixtures/device-validation/scripts/evidence.sh
          cleanup_script_path: tests/fixtures/device-validation/scripts/cleanup.sh
          arguments_json: '[]'
          environment_json: '{}'
          max_duration_minutes: "15"
          request_id: issue-341-device-smoke
          inventory_fixture: ${{ matrix.inventory }}
          synthetic_mode: "true"
          source_root: source
      - name: Verify bounded synthetic result
        shell: bash
        env:
          RESULT: ${{ steps.synthetic.outputs.result }}
          EVIDENCE_ID: ${{ steps.synthetic.outputs.device_evidence_id }}
          ARTIFACT_EXCEPTION: ${{ steps.synthetic.outputs.artifact_exception_used }}
          TRUST: ${{ steps.synthetic.outputs.derived_source_trust }}
        run: |
          set -Eeuo pipefail
          test "$RESULT" = success
          test "$ARTIFACT_EXCEPTION" = false
          test "$TRUST" = trusted-pr
          [[ "$EVIDENCE_ID" =~ ^[0-9a-f]{64}$ ]]
      - name: Remove exact source
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a7865f420e7ff37893907bbd0c4ad557a0e9ca6 # issue #479 same-repository PR event checkpoint
        with:
          phase: cleanup-checkout
          source_root: source

  zero_artifacts:
    name: Verify zero routine device artifacts
    needs: [source_tests, authorized_pr_plan, synthetic]
    if: ${{ always() && !cancelled() }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    steps:
      - name: Require all applicable device smoke jobs green
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source_tests.result }}
          AUTHORIZED_PR_RESULT: ${{ needs.authorized_pr_plan.result }}
          SYNTHETIC_RESULT: ${{ needs.synthetic.result }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE_RESULT" = success
          test "$SYNTHETIC_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$AUTHORIZED_PR_RESULT" = success
          else
            test "$AUTHORIZED_PR_RESULT" = skipped
          fi
          echo 'Device contract smoke retains zero GitHub Actions artifacts.'
