name: Device validation contract smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/reusable-device.yml"
      - ".github/workflows/device-validation-contract-smoke.yml"
      - "actions/validate-device/**"
      - "scripts/ci/device.py"
      - "src/ci_workflows/device*.py"
      - "src/ci_workflows/ciw_device.py"
      - "contracts/device-profiles.json"
      - "contracts/device-evidence.json"
      - "tests/fixtures/device-validation/**"
      - "tests/test_device_validation.py"
      - "tests/test_device_workflow_contract.py"
      - "docs/workflows/devices.md"
      - "docs/architecture/device-validation.md"

concurrency:
  group: device-validation-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  contract_smoke:
    name: Validate synthetic device contracts only
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: portable
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - name: Clear fixed synthetic source root without following links
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 .ciw/scripts/ci/device.py cleanup-checkout --source-root source
          test ! -e source
          test ! -L source

      - name: Check out exact synthetic source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - name: Run focused device source tests
        shell: bash
        run: |
          set -Eeuo pipefail
          CIW_DEVICE_FOCUSED_TEST=true PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.ciw/src \
            python3 -m unittest discover -s .ciw/tests -p 'test_device_*.py' -v

      - name: Validate synthetic Android inventory and typed plan
        uses: ./.ciw/actions/validate-device
        with:
          phase: synthetic
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          device_family: android
          device_capability: synthetic-android
          device_alias: synthetic-primary
          command_profile: ciw-device-synthetic
          script_path: tests/fixtures/device-validation/scripts/test.sh
          max_duration_minutes: "15"
          request_id: issue-14-${{ github.run_id }}-${{ github.run_attempt }}
          source_root: source
          inventory_fixture: tests/fixtures/device-validation/android.txt
          synthetic_mode: "true"

      - name: Validate synthetic iOS inventory and typed plan
        uses: ./.ciw/actions/validate-device
        with:
          phase: synthetic
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          device_family: ios
          device_capability: synthetic-ios
          device_alias: synthetic-primary
          command_profile: ciw-device-synthetic
          script_path: tests/fixtures/device-validation/scripts/test.sh
          max_duration_minutes: "15"
          request_id: issue-14-${{ github.run_id }}-${{ github.run_attempt }}
          source_root: source
          inventory_fixture: tests/fixtures/device-validation/ios.json
          synthetic_mode: "true"

      - name: Validate synthetic tvOS inventory and typed plan
        uses: ./.ciw/actions/validate-device
        with:
          phase: synthetic
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          device_family: tvos
          device_capability: synthetic-tvos
          device_alias: synthetic-primary
          command_profile: ciw-device-synthetic
          script_path: tests/fixtures/device-validation/scripts/test.sh
          max_duration_minutes: "15"
          request_id: issue-14-${{ github.run_id }}-${{ github.run_attempt }}
          source_root: source
          inventory_fixture: tests/fixtures/device-validation/tvos.json
          synthetic_mode: "true"

      - name: Remove exact synthetic and central source without following links
        if: always()
        shell: bash
        run: |
          set -u
          cleanup_failed=0
          if [[ -d .ciw && ! -L .ciw ]]; then
            PYTHONDONTWRITEBYTECODE=1 \
              python3 .ciw/scripts/ci/device.py cleanup-checkout --source-root source \
              || cleanup_failed=1
            PYTHONDONTWRITEBYTECODE=1 \
              python3 .ciw/scripts/ci/device.py cleanup-checkout --source-root .ciw \
              || cleanup_failed=1
          elif [[ -L .ciw || -f .ciw ]]; then
            unlink .ciw || cleanup_failed=1
          fi
          [[ ! -e source && ! -L source ]] || cleanup_failed=1
          [[ ! -e .ciw && ! -L .ciw ]] || cleanup_failed=1
          exit "${cleanup_failed}"

  zero_artifacts:
    name: Verify device contract smoke artifacts remain zero
    needs: contract_smoke
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require contract smoke success and zero Actions artifacts
        env:
          CONTRACT_RESULT: ${{ needs.contract_smoke.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${CONTRACT_RESULT}" = success
          python3 - <<'PY_ARTIFACTS'
          import json
          import os
          import urllib.request
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("device contract smoke retained Actions artifacts")
          print("Routine device contract Actions artifacts verified: zero.")
          PY_ARTIFACTS
