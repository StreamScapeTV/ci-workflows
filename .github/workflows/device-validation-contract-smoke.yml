name: Device validation contract smoke

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-device.yml"
      - ".github/workflows/device-validation-contract-smoke.yml"
      - "actions/validate-device/**"
      - "scripts/ci/device.py"
      - "src/ci_workflows/device*.py"
      - "contracts/device-*.json"
      - "tests/test_device*.py"
      - "tests/fixtures/device-validation/**"
      - "docs/architecture/device-validation.md"
      - "docs/workflows/devices.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic device contract smoke
    runs-on: [linux, amd64, general]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - family: android
            capability: synthetic-android
            fixture: tests/fixtures/device-validation/android.txt
          - family: ios
            capability: synthetic-ios
            fixture: tests/fixtures/device-validation/ios.json
          - family: tvos
            capability: synthetic-tvos
            fixture: tests/fixtures/device-validation/tvos.json
    steps:
      - name: Remove stale source-only smoke checkouts without following links
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported smoke checkout entry")

          remove_no_follow(Path("source"))
          remove_no_follow(Path(".ciw"))
          PY

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Check out exact Central implementation beside source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact synthetic and Central checkouts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

      - id: synthetic
        name: Execute bounded synthetic device contract
        uses: StreamScapeTV/ci-workflows/actions/validate-device@092d26777aebaf87a0a07d39a1660b4bc5cb658d # issue #14 complete CIW checkpoint
        with:
          phase: synthetic
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          device_family: ${{ matrix.family }}
          device_capability: ${{ matrix.capability }}
          device_alias: synthetic-primary
          command_profile: ciw-device-synthetic
          script_path: tests/fixtures/device-validation/scripts/test.sh
          max_duration_minutes: "15"
          request_id: issue-14-contract-smoke
          source_root: source
          inventory_fixture: tests/fixtures/device-validation/${{ matrix.family == 'android' && 'android.txt' || format('{0}.json', matrix.family) }}
          synthetic_mode: "true"

      - name: Assert synthetic evidence is explicitly non-physical
        shell: bash
        env:
          RESULT: ${{ steps.synthetic.outputs.result }}
          EVIDENCE_ID: ${{ steps.synthetic.outputs.device_evidence_id }}
          CLEANUP_RESULT: ${{ steps.synthetic.outputs.cleanup_result }}
        run: |
          set -Eeuo pipefail
          test "${RESULT}" = "success"
          test "${CLEANUP_RESULT}" = "success"
          [[ "${EVIDENCE_ID}" =~ ^[0-9a-f]{64}$ ]]

      - name: Remove exact synthetic and central source without following links
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported smoke checkout entry")

          remove_no_follow(Path("source"))
          remove_no_follow(Path(".ciw"))
          PY
          test ! -e source
          test ! -L source
          test ! -e .ciw
          test ! -L .ciw

  unauthorized:
    name: Unauthorized physical plan fails closed
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    steps:
      - name: Remove stale source-only smoke checkout without following links
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported smoke checkout entry")

          remove_no_follow(Path(".ciw"))
          PY

      - name: Check out exact Central implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact Central implementation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

      - name: Verify real profile without owner receipt is denied before scheduling
        shell: bash
        env:
          DEVICE_DENIED_OUTPUT: ${{ runner.temp }}/device-denied.out
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.ciw/src python3 - <<'PY'
          import os
          from pathlib import Path
          from ci_workflows.ciw import main
          sha = "0123456789abcdef0123456789abcdef01234567"
          out = Path(os.environ["DEVICE_DENIED_OUTPUT"])
          out.write_text("", encoding="utf-8")
          env = dict(os.environ)
          env.update({
              "GITHUB_REPOSITORY": "StreamScapeTV/iptv-android",
              "GITHUB_EVENT_NAME": "workflow_dispatch",
              "GITHUB_RUN_ID": "31234567891",
              "GITHUB_RUN_ATTEMPT": "1",
              "GITHUB_OUTPUT": str(out),
              "INPUT_ADMITTED_SHA": sha,
              "INPUT_DEVICE_FAMILY": "android",
              "INPUT_DEVICE_CAPABILITY": "instrumentation",
              "INPUT_DEVICE_ALIAS": "acceptance-primary",
              "INPUT_COMMAND_PROFILE": "iptv-android-device",
              "INPUT_SCRIPT_PATH": "build.sh",
              "INPUT_MAX_DURATION_MINUTES": "60",
              "INPUT_EVIDENCE_EXCEPTION_ID": "",
              "INPUT_REQUEST_ID": "issue-14-physical-request",
              "CIW_DEVICE_EVENT_REPOSITORY": "StreamScapeTV/iptv-android",
              "CIW_DEVICE_EVENT_SHA": sha,
              "CIW_DEVICE_HEAD_REPOSITORY": "StreamScapeTV/iptv-android",
              "CIW_DEVICE_HEAD_FORK": "false",
              "CIW_DEVICE_LIVE_BACKEND_PRESENT": "true",
              "CIW_DEVICE_AUTHORIZATION_PRESENT": "false",
          })
          rc = main(["--root", ".ciw", "device", "validate", "--phase", "plan"], environment=env)
          if rc:
              raise SystemExit(f"typed denial plan failed before projection: {rc}")
          lines = set(out.read_text(encoding="utf-8").splitlines())
          need = {"execution_authorized=false", "authorization_failure=physical_authorization_required"}
          if not need <= lines:
              raise SystemExit(f"typed denial projection missing: {sorted(need - lines)}")
          PY

      - name: Remove exact Central source without following links
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported smoke checkout entry")

          remove_no_follow(Path(".ciw"))
          PY
          test ! -e .ciw
          test ! -L .ciw

  zero_artifacts:
    name: Verify device contract smoke artifacts remain zero
    if: ${{ always() && !cancelled() }}
    needs: [synthetic, unauthorized]
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    steps:
      - name: Assert prerequisite jobs passed
        shell: bash
        env:
          SYNTHETIC_RESULT: ${{ needs.synthetic.result }}
          UNAUTHORIZED_RESULT: ${{ needs.unauthorized.result }}
        run: |
          set -Eeuo pipefail
          test "${SYNTHETIC_RESULT}" = "success"
          test "${UNAUTHORIZED_RESULT}" = "success"

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Assert exact run retained no Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          actual_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.head_sha')"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.total_count')"
          test "${count}" = "0"
