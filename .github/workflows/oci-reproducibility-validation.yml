name: OCI reproducibility validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/reusable-oci-reproducibility.yml
      - .github/workflows/oci-reproducibility-validation.yml
      - contracts/bootstrap-public-workflows.json
      - contracts/public-workflows.json
      - contracts/public-workflows/products.json
      - contracts/repository-policy.json
      - contracts/runner-profiles.json
      - generated/runner-mappings.json
      - docs/workflows/public-api-reference.md
      - scripts/ci/oci_reproducibility.py
      - src/ci_workflows/oci_reproducibility.py
      - src/ci_workflows/public_api_contract.py
      - tests/test_bootstrap.py
      - tests/test_oci_reproducibility_workflow.py
      - tests/test_public_api_contract.py
      - tests/test_public_ci_admission.py
      - tests/test_simple_script_workflow_contract.py
      - tests/test_validation_runner_selectors.py
      - tests/fixtures/oci-reproducibility/**
  push:
    # Keep the real two-clean-build proof attached to every #471 implementation/contract surface.
    paths:
      - .github/workflows/reusable-oci-reproducibility.yml
      - .github/workflows/oci-reproducibility-validation.yml
      - contracts/bootstrap-public-workflows.json
      - contracts/public-workflows.json
      - contracts/public-workflows/products.json
      - contracts/repository-policy.json
      - contracts/runner-profiles.json
      - generated/runner-mappings.json
      - docs/workflows/public-api-reference.md
      - scripts/ci/oci_reproducibility.py
      - src/ci_workflows/oci_reproducibility.py
      - src/ci_workflows/public_api_contract.py
      - tests/test_bootstrap.py
      - tests/test_oci_reproducibility_workflow.py
      - tests/test_public_api_contract.py
      - tests/test_public_ci_admission.py
      - tests/test_simple_script_workflow_contract.py
      - tests/test_validation_runner_selectors.py
      - tests/fixtures/oci-reproducibility/**

permissions:
  contents: read

jobs:
  deterministic_fixture:
    name: Prove deterministic amd64 and arm64 raw configs
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login == 'mimranfaruqi' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 180
    env:
      ADMITTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_ROOT: .
      DOCKERFILE_PATH: tests/fixtures/oci-reproducibility/Dockerfile
      BUILD_CONTEXT: tests/fixtures/oci-reproducibility
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact validation source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify fixed daemonless multi-platform tool contract
        shell: bash
        run: |
          set -Eeuo pipefail
          buildah --version
          skopeo --version
          command -v qemu-aarch64-static >/dev/null
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          ! command -v docker
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock

      - id: proof
        name: Build twice and compare raw per-platform OCI config blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/oci_reproducibility.py run

      - name: Remove all run-owned OCI reproducibility state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state_root="${RUNNER_TEMP}/ciw-oci-repro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -f scripts/ci/oci_reproducibility.py; then
            python3 scripts/ci/oci_reproducibility.py cleanup
          else
            rm -rf "${state_root}"
          fi
          test ! -e "${state_root}"

      - name: Verify exact source and zero routine residue
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'ciw-oci-repro-*' -print -quit)"
