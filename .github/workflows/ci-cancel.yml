name: Cancel exact authorized workflow

"on":
  workflow_call:
    inputs:
      ci_run_id:
        type: string
        required: true
    secrets:
      AGENT_STATE_SUPABASE_URL:
        required: true
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start cancellation maintenance execution
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}
      - name: Cancel backend-authorized target
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        run: python3 scripts/ci/ci_cancel.py
      - name: Settle cancellation maintenance execution
        if: ${{ always() }}
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ job.status == 'cancelled' && 'cancelled' || (job.status == 'success' && 'succeeded' || 'failed') }}
          error_summary: ${{ job.status != 'success' && 'Central cancellation operation failed or was interrupted.' || '' }}
