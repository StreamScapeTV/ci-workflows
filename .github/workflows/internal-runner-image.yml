name: Internal runner image build and publish

on:
  workflow_call:
    inputs:
      image:
        description: Fixed ci-workflows runner image id
        required: true
        type: string
      source_sha:
        description: Exact ci-workflows source commit to build
        required: true
        type: string
      release_tag:
        description: Optional human-readable Git release tag used as the OCI tag
        required: false
        default: ""
        type: string
      publish:
        description: Publish the built image to the fixed private registry
        required: false
        default: false
        type: boolean
    secrets:
      registry_username:
        required: false
      registry_token:
        required: false
    outputs:
      image_reference:
        description: Fixed registry reference when release_tag is supplied
        value: ${{ jobs.image.outputs.image_reference }}

permissions:
  contents: read

jobs:
  image:
    name: Runner image / ${{ inputs.image }}
    runs-on: [linux, amd64, buildah, high]
    timeout-minutes: 180
    outputs:
      image_reference: ${{ steps.runner_image.outputs.image_reference }}
    steps:
      - name: Check out exact runner-image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - id: runner_image
        name: Build smoke and optionally publish fixed runner image
        uses: ./actions/runner-image
        with:
          image: ${{ inputs.image }}
          source_sha: ${{ inputs.source_sha }}
          release_tag: ${{ inputs.release_tag }}
          publish: ${{ inputs.publish }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}

      - name: Verify runner-image credential cleanup
        if: always()
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
          test ! -e "${authfile}"
          test ! -L "${authfile}"

      - name: Verify exact source remained clean
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
