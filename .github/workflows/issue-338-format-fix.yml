name: Issue 338 public type formatting fix

on:
  push:
    branches:
      - agent1/issue-338-android-live-release

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == '[#338] Restore public type formatting' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 20
    steps:
      - name: Check out exact formatting-fix head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Restore reviewed formatting and validate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_REF: 336556e9fdbade0ecd80b5e890d558917ba2b367
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          ref = os.environ['BASELINE_REF']
          path = 'contracts/public-workflow-types.json'
          url = (
              f"{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              f"?ref={urllib.parse.quote(ref, safe='')}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          text = base64.b64decode(payload['content']).decode('utf-8')
          old = '    "artifact_manifest_json": {"type": "json-object", "nullable": true},'
          new = '    "artifact_manifest_json": {"type": "json-array", "nullable": true},'
          if old not in text:
              raise SystemExit('reviewed pre-cleanup artifact manifest row not found')
          text = text.replace(old, new, 1)
          Path(path).write_text(text, encoding='utf-8')
          PY
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py validate
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py render --check
          PYTHONPATH=src python3 -m unittest -v tests.test_public_api_contract tests.test_android_completion
          git diff --check -- contracts/public-workflow-types.json

      - name: Persist formatted contract and remove this workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent1/issue-338-android-live-release
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['BRANCH_NAME']
          token = os.environ['GITHUB_TOKEN']

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return {} if not raw else json.loads(raw)

          def get(path):
              return request(
                  'GET',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}?ref={urllib.parse.quote(branch, safe="")}',
              )

          path = 'contracts/public-workflow-types.json'
          current = get(path)
          content = Path(path).read_text(encoding='utf-8')
          request(
              'PUT',
              f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
              {
                  'message': '[skip ci] #338 restore public type formatting',
                  'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                  'sha': current['sha'],
                  'branch': branch,
              },
          )

          workflow = '.github/workflows/issue-338-format-fix.yml'
          current = get(workflow)
          request(
              'DELETE',
              f'{api}/repos/{repo}/contents/{urllib.parse.quote(workflow, safe="/")}',
              {
                  'message': '[skip ci] #338 remove formatting fix workflow',
                  'sha': current['sha'],
                  'branch': branch,
              },
          )
          PY
