name: Node CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      test_profile:
        type: string
        required: true
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          permission-contents: ${{ inputs.test_profile == 'static-web-lock-refresh' && 'write' || 'read' }}

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: ${{ inputs.test_profile == 'static-web-lock-refresh' }}

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9A-Fa-f]{40}$ ]] || exit 2
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Set up fixed Node 22.18.0
        if: ${{ inputs.test_profile == 'frontend-full' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          cache: ""

      - name: Set up repository-pinned Node
        if: ${{ inputs.test_profile == 'static-web' || inputs.test_profile == 'static-web-lock-refresh' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: ""

      - name: Resolve Node default-branch cache scope
        id: node_cache_scope
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -Eeuo pipefail
          restore_enabled=false
          save_enabled=false
          default_branch=""
          cache_key=""

          source_ref="${REQUESTED_REF}"
          normalized_ref="${source_ref#refs/heads/}"
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          source_is_pr=false
          case "${source_ref}" in
            refs/pull/*) source_is_pr=true ;;
          esac

          if test -n "${SOURCE_REPOSITORY}" &&
            [[ "${SOURCE_REPOSITORY}" == StreamScapeTV/* ]] &&
            test -n "${SOURCE_TOKEN}" &&
            test -f package.json &&
            test -f package-lock.json; then
            repository_json="$(curl --fail --silent --show-error --header "Authorization: Bearer ${SOURCE_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${SOURCE_REPOSITORY}" || true)"
            if test -n "${repository_json}"; then
              default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))' 2>/dev/null || true)"
            fi

            if test "${source_is_pr}" = "true" || test -n "${checkout_branch}"; then
              restore_enabled=true
            fi
            if test "${restore_enabled}" = "true" &&
              test "${normalized_ref}" = "${default_branch}" &&
              test "${checkout_branch}" = "${default_branch}" &&
              test "${TEST_PROFILE}" != "static-web-lock-refresh"; then
              save_enabled=true
            fi

            if test "${restore_enabled}" = "true"; then
              repository_key="$(printf '%s' "${SOURCE_REPOSITORY}" | tr '/' '-')"
              node_identity="$(node --version | tr -cd 'A-Za-z0-9._-')"
              npm_identity="$(npm --version | tr -cd 'A-Za-z0-9._-')"
              dependency_fingerprint="$({
                sha256sum package.json
                sha256sum package-lock.json
              } | sha256sum | awk '{print $1}')"
              cache_key="node-modules-v1-${repository_key}-${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}-${node_identity}-npm${npm_identity}-${dependency_fingerprint}"
            fi
          fi

          printf 'restore_enabled=%s\n' "${restore_enabled}" >> "${GITHUB_OUTPUT}"
          printf 'save_enabled=%s\n' "${save_enabled}" >> "${GITHUB_OUTPUT}"
          printf 'default_branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"
          printf 'key=%s\n' "${cache_key}" >> "${GITHUB_OUTPUT}"

      - name: Restore Node modules cache
        id: node_modules_cache
        if: ${{ steps.node_cache_scope.outputs.restore_enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.node_cache_scope.outputs.key }}

      - name: Run fixed Node profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
          NODE_MODULES_CACHE_HIT: ${{ steps.node_modules_cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "$label" >> "$CI_LOG"
            if ! "$@" >> "$CI_LOG" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "$label" >&2
              return 1
            fi
          }
          ensure_node_modules() {
            if test "${NODE_MODULES_CACHE_HIT:-false}" = "true"; then
              printf '\n===== npm-ci =====\nnode_modules cache hit; npm ci skipped\n' >> "$CI_LOG"
            else
              run_logged npm-ci npm ci
            fi
          }

          case "$TEST_PROFILE" in
            frontend-full)
              ensure_node_modules
              run_logged test npm test
              run_logged typecheck npm run typecheck
              run_logged build npm run build
              ;;
            static-web)
              export NEXT_PUBLIC_API_URL=https://api.streamscapetv.com
              export NEXT_TELEMETRY_DISABLED=1
              ensure_node_modules
              run_logged check npm run check
              run_logged repository-clean git diff --exit-code
              ;;
            static-web-lock-refresh)
              export NEXT_PUBLIC_API_URL=https://api.streamscapetv.com
              export NEXT_TELEMETRY_DISABLED=1
              test -n "${SOURCE_REPOSITORY}" || { echo "lock refresh requires an explicit source repository" >&2; exit 2; }
              case "${TARGET_REF}" in
                issue/*|orchestrator/*|agent*/*|codex*/*) ;;
                *) echo "lock refresh accepts only bounded non-protected work branches" >&2; exit 2 ;;
              esac
              checked_out_head="$(git rev-parse HEAD)"
              remote_head="$(git ls-remote --heads origin "refs/heads/${TARGET_REF}" | awk 'NR == 1 {print $1}')"
              test -n "${remote_head}" && test "${remote_head}" = "${checked_out_head}" || {
                echo "lock refresh source branch does not resolve to the checked-out head" >&2
                exit 1
              }
              manifest_before="$(sha256sum package.json | awk '{print $1}')"
              run_logged lock-refresh npm install --package-lock-only --ignore-scripts --no-audit
              manifest_after="$(sha256sum package.json | awk '{print $1}')"
              test "${manifest_after}" = "${manifest_before}" || {
                echo "lock refresh modified package.json" >&2
                exit 1
              }
              mapfile -t changed_paths < <(git diff --name-only)
              test "${#changed_paths[@]}" -eq 1 && test "${changed_paths[0]}" = package-lock.json || {
                printf 'lock refresh changed unexpected paths: %s\n' "${changed_paths[*]:-<none>}" >&2
                exit 1
              }
              run_logged npm-ci npm ci
              run_logged check npm run check
              printf '\n===== audit-full =====\n' >> "$CI_LOG"
              audit_full_status=0
              npm audit --json >> "$CI_LOG" 2>&1 || audit_full_status=$?
              printf 'audit-full-exit=%s\n' "${audit_full_status}" >> "$CI_LOG"
              run_logged audit-production npm audit --omit=dev --audit-level=low --json
              mapfile -t changed_paths < <(git diff --name-only)
              test "${#changed_paths[@]}" -eq 1 && test "${changed_paths[0]}" = package-lock.json || {
                printf 'validated lock refresh changed unexpected paths: %s\n' "${changed_paths[*]:-<none>}" >&2
                exit 1
              }
              git config user.name "streamscape-ci-source[bot]"
              git config user.email "320226917+streamscape-ci-source[bot]@users.noreply.github.com"
              git add -- package-lock.json
              git commit -m "[skip push ci] Refresh npm lockfile from reviewed manifest" >> "$CI_LOG" 2>&1
              refreshed_head="$(git rev-parse HEAD)"
              printf 'refreshed-head=%s\n' "${refreshed_head}" >> "$CI_LOG"
              run_logged lock-push git push origin "HEAD:refs/heads/${TARGET_REF}"
              ;;
            *) echo "Unsupported Node test_profile: $TEST_PROFILE" >&2; exit 2 ;;
          esac

      - name: Save Node modules cache
        id: node_modules_cache_save
        if: ${{ steps.node_cache_scope.outputs.save_enabled == 'true' && steps.commands.outcome == 'success' && steps.node_modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.node_modules_cache.outputs.cache-primary-key }}

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          mime_type: text/plain

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && (steps.node_modules_cache_save.outcome == 'success' || steps.node_modules_cache_save.outcome == 'skipped') && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
