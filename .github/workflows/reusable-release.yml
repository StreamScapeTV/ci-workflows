name: Reusable exact-tag release orchestration

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted for this release
        required: true
        type: string
      release_contract:
        description: Checked-in release contract identifier
        required: true
        type: string
      release_tag:
        description: Exact immutable v-prefixed release tag
        required: true
        type: string
      release_version:
        description: Exact stable SemVer release version without v prefix
        required: true
        type: string
      request_id:
        description: Caller-generated idempotency identity for the reviewed handoff
        required: true
        type: string
      target_id:
        description: Optional confirmation of the checked-in release target
        required: false
        type: string
    secrets:
      registry_username:
        description: Least-privilege private registry username
        required: true
      registry_token:
        description: Least-privilege private registry token
        required: true
      flux_handoff_token:
        description: Token limited to submitting a reviewed handoff request to StreamScapeTV/flux
        required: true
    outputs:
      result:
        description: Success only after verified publication, release metadata, and reviewed handoff request
        value: ${{ jobs.request_handoff_and_finalize.outputs.result }}
      immutable_references_json:
        description: Bounded immutable image and chart publication identities
        value: ${{ jobs.verify_and_record.outputs.immutable_references_json }}
      release_manifest_sha256:
        description: SHA-256 of the canonical immutable release manifest
        value: ${{ jobs.verify_and_record.outputs.release_manifest_sha256 }}
      handoff_state:
        description: State of the bounded review-only Flux handoff request
        value: ${{ jobs.request_handoff_and_finalize.outputs.handoff_state }}
      request_id:
        description: Exact caller request identity
        value: ${{ jobs.request_handoff_and_finalize.outputs.request_id }}

permissions:
  actions: read
  contents: write

jobs:
  plan:
    name: Resolve exact release and publication plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      admitted_sha: ${{ steps.release.outputs.admitted_sha }}
      request_id: ${{ steps.release.outputs.request_id }}
      image_product_id: ${{ steps.release.outputs.image_product_id }}
      chart_product_id: ${{ steps.release.outputs.chart_product_id }}
      tag_object_sha: ${{ steps.authority.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.authority.outputs.tag_commit_sha }}
      image_workspace_profile: ${{ steps.image_plan.outputs.workspace_profile }}
      runs_on_json: ${{ steps.runner.outputs.runs_on_json }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ job.workflow_repository }}
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "${EXPECTED_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - id: release
        name: Resolve checked-in public release contract
        shell: bash
        env:
          PRODUCER_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py plan \
            --release-contract "${{ inputs.release_contract }}" \
            --repository "${PRODUCER_REPOSITORY}" \
            --admitted-sha "${{ inputs.admitted_sha }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --release-version "${{ inputs.release_version }}" \
            --request-id "${{ inputs.request_id }}" \
            --target-id "${{ inputs.target_id }}"

      - id: authority
        name: Resolve exact existing tag authority
        uses: ./.ciw/actions/resolve-release-tag
        with:
          release_mode: existing-tag
          release_version: ${{ steps.release.outputs.release_version }}
          release_source_sha: ${{ steps.release.outputs.admitted_sha }}

      - id: image_plan
        name: Resolve OCI product, destination, and runner
        uses: ./.ciw/actions/publish-oci
        with:
          phase: plan
          admitted_sha: ${{ steps.release.outputs.admitted_sha }}
          release_authority_sha: ${{ steps.authority.outputs.release_source_sha }}
          product_id: ${{ steps.release.outputs.image_product_id }}
          release_version: ${{ steps.release.outputs.release_version }}

      - id: runner
        name: Resolve shared publication runner
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py runner-plan \
            --image-runs-on-json '${{ steps.image_plan.outputs.runs_on_json }}' \
            --chart-runs-on-json '["linux","amd64","general"]'

  run_release_gates:
    name: Revalidate exact tag and source gate
    needs: plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 15
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Revalidate exact tag before publication
        uses: ./.ciw/actions/resolve-release-tag
        with:
          phase: revalidate
          release_mode: existing-tag
          release_version: ${{ needs.plan.outputs.release_version }}
          release_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - name: Check out exact admitted producer source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - name: Verify exact gated source remains clean
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

  publish_images:
    name: Publish and independently read back immutable images
    needs: [plan, run_release_gates]
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 180
    outputs:
      result: ${{ steps.verify.outcome == 'success' && steps.publication_cleanup.outcome == 'success' && steps.publication_residue.outcome == 'success' && steps.build_cleanup.outcome == 'success' && steps.build_residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      image_digest: ${{ steps.verify.outputs.image_digest }}
      platform_digests_json: ${{ steps.verify.outputs.platform_digests_json }}
      immutable_references_json: ${{ steps.verify.outputs.immutable_references_json }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Check out exact admitted producer source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - name: Prepare isolated OCI publication state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.image_workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ needs.plan.outputs.admitted_sha }}
          trust_mode: trusted-exact

      - id: revalidate
        name: Revalidate exact tag immediately before image publication
        uses: ./.ciw/actions/resolve-release-tag
        with:
          phase: revalidate
          release_mode: existing-tag
          release_version: ${{ needs.plan.outputs.release_version }}
          release_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - id: build
        name: Rebuild and inspect exact source through OCI build contract
        continue-on-error: true
        uses: ./.ciw/actions/validate-oci
        with:
          phase: execute
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: authenticate
        name: Authenticate with named registry credentials
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: authenticate
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}

      - id: publish
        name: Publish immutable image identities idempotently
        if: ${{ steps.authenticate.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: publish
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: readback
        name: Read back registry manifests independently
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: readback
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: verify
        name: Verify immutable image read-back evidence
        if: ${{ steps.readback.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: verify
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: publication_cleanup
        name: Remove OCI publication credential and layout state
        if: always()
        uses: ./.ciw/actions/publish-oci
        with:
          phase: cleanup
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ needs.plan.outputs.admitted_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: publication_residue
        name: Verify zero OCI publication residue
        if: always()
        uses: ./.ciw/actions/publish-oci
        with:
          phase: residue
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          release_authority_sha: ${{ needs.plan.outputs.admitted_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: build_cleanup
        name: Remove OCI build state
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: cleanup
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: build_residue
        name: Verify zero OCI build residue
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: residue
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          product_id: ${{ needs.plan.outputs.image_product_id }}
          release_version: ${{ needs.plan.outputs.release_version }}

      - id: workspace_cleanup
        name: Remove and verify registered OCI workspace state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Verify exact producer source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.plan.outputs.admitted_sha }}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Project terminal OCI publication status
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          AUTH: ${{ steps.authenticate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          READBACK: ${{ steps.readback.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CLEANUP: ${{ steps.publication_cleanup.outcome }}
          RESIDUE: ${{ steps.publication_residue.outcome }}
          BUILD_CLEANUP: ${{ steps.build_cleanup.outcome }}
          BUILD_RESIDUE: ${{ steps.build_residue.outcome }}
          WORKSPACE_CLEANUP: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${BUILD}" = success
          test "${AUTH}" = success
          test "${PUBLISH}" = success
          test "${READBACK}" = success
          test "${VERIFY}" = success
          test "${CLEANUP}" = success
          test "${RESIDUE}" = success
          test "${BUILD_CLEANUP}" = success
          test "${BUILD_RESIDUE}" = success
          test "${WORKSPACE_CLEANUP}" = success

  publish_charts_or_assets:
    name: Publish and independently read back immutable charts
    needs: [plan, run_release_gates, publish_images]
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 90
    outputs:
      result: ${{ steps.helm.outcome == 'success' && steps.helm_cleanup.outcome == 'success' && steps.helm_residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      chart_digest: ${{ steps.helm.outputs.chart_digest }}
      immutable_references_json: ${{ steps.helm.outputs.immutable_references_json }}
      image_digests_json: ${{ steps.bind.outputs.image_digests_json }}
      image_references_json: ${{ steps.bind.outputs.image_references_json }}
      canary_id: ${{ steps.bind.outputs.canary_id }}
      previous_known_good: ${{ steps.bind.outputs.previous_known_good }}
      rollback_id: ${{ steps.bind.outputs.rollback_id }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - id: bind
        name: Verify image evidence and derive digest-pinned bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py image-bindings \
            --image-digest-json '${{ needs.publish_images.outputs.image_digest }}' \
            --immutable-references-json '${{ needs.publish_images.outputs.immutable_references_json }}' \
            --expected-source-sha '${{ needs.plan.outputs.admitted_sha }}' \
            --expected-release-version '${{ needs.plan.outputs.release_version }}'

      - name: Check out exact admitted producer source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - name: Prepare isolated Helm publication state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: minimal
          cache_mode: disabled
          source_sha: ${{ needs.plan.outputs.admitted_sha }}
          trust_mode: trusted-exact

      - name: Revalidate exact tag immediately before chart publication
        uses: ./.ciw/actions/resolve-release-tag
        with:
          phase: revalidate
          release_mode: existing-tag
          release_version: ${{ needs.plan.outputs.release_version }}
          release_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - id: helm
        name: Package, publish, and independently read back Helm OCI chart
        continue-on-error: true
        shell: bash
        env:
          INPUT_ADMITTED_SHA: ${{ needs.plan.outputs.admitted_sha }}
          INPUT_PRODUCT_ID: ${{ needs.plan.outputs.chart_product_id }}
          INPUT_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          INPUT_SOURCE_TRUST: trusted-exact
          INPUT_IMAGE_DIGEST: ${{ needs.publish_images.outputs.image_digest }}
          INPUT_IMMUTABLE_REFERENCES_JSON: ${{ needs.publish_images.outputs.immutable_references_json }}
          INPUT_REGISTRY_USERNAME: ${{ secrets.registry_username }}
          INPUT_REGISTRY_TOKEN: ${{ secrets.registry_token }}
        run: |
          set -Eeuo pipefail
          PYTHONPATH=".ciw/src" python3 .ciw/scripts/ci/helm_release.py execute

      - id: helm_cleanup
        name: Remove Helm publication credential and package state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=".ciw/src" python3 -c 'import os; from pathlib import Path; from ci_workflows.ciw_helm import execute; execute(Path(".ciw").resolve(), os.environ, operation="publish", phase="cleanup", source_relative="source")'

      - id: helm_residue
        name: Verify zero Helm publication residue
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=".ciw/src" python3 -c 'import os; from pathlib import Path; from ci_workflows.ciw_helm import execute; execute(Path(".ciw").resolve(), os.environ, operation="publish", phase="residue", source_relative="source")'

      - id: workspace_cleanup
        name: Remove and verify registered Helm workspace state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Verify exact producer source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.plan.outputs.admitted_sha }}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Project terminal Helm publication status
        if: always()
        shell: bash
        env:
          HELM: ${{ steps.helm.outcome }}
          CLEANUP: ${{ steps.helm_cleanup.outcome }}
          RESIDUE: ${{ steps.helm_residue.outcome }}
          WORKSPACE_CLEANUP: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${HELM}" = success
          test "${CLEANUP}" = success
          test "${RESIDUE}" = success
          test "${WORKSPACE_CLEANUP}" = success

  verify_and_record:
    name: Verify release evidence and create exact GitHub Release
    needs: [plan, publish_images, publish_charts_or_assets]
    runs-on: [linux, amd64, general]
    timeout-minutes: 20
    outputs:
      immutable_references_json: ${{ steps.verify.outputs.immutable_references_json }}
      release_manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      github_release_url: ${{ steps.github_release.outputs.github_release_url }}
      flux_handoff_json: ${{ steps.handoff.outputs.flux_handoff_json }}
      flux_handoff_sha256: ${{ steps.handoff.outputs.flux_handoff_sha256 }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Check out exact admitted producer source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: evidence
        name: Normalize bounded independent read-back evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py evidence \
            --image-result '${{ needs.publish_images.outputs.result }}' \
            --image-digest-json '${{ needs.publish_images.outputs.image_digest }}' \
            --platform-digests-json '${{ needs.publish_images.outputs.platform_digests_json }}' \
            --immutable-references-json '${{ needs.publish_images.outputs.immutable_references_json }}' \
            --chart-result '${{ needs.publish_charts_or_assets.outputs.result }}' \
            --chart-references-json '${{ needs.publish_charts_or_assets.outputs.immutable_references_json }}'

      - id: verify
        name: Verify exact immutable product identities
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py verify-publications \
            --release-id '${{ needs.plan.outputs.release_id }}' \
            --repository '${{ github.repository }}' \
            --image-product-id '${{ needs.plan.outputs.image_product_id }}' \
            --image-digests-json '${{ needs.publish_charts_or_assets.outputs.image_digests_json }}' \
            --image-references-json '${{ needs.publish_charts_or_assets.outputs.image_references_json }}' \
            --image-evidence-json '${{ steps.evidence.outputs.image_evidence_json }}' \
            --chart-product-id '${{ needs.plan.outputs.chart_product_id }}' \
            --chart-digest '${{ needs.publish_charts_or_assets.outputs.chart_digest }}' \
            --chart-references-json '${{ needs.publish_charts_or_assets.outputs.immutable_references_json }}' \
            --chart-evidence-json '${{ steps.evidence.outputs.chart_evidence_json }}'

      - id: source_time
        name: Resolve exact source commit timestamp
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'source_timestamp=%s\n' "$(git -C source show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - id: manifest
        name: Create deterministic immutable release manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py manifest \
            --release-id '${{ needs.plan.outputs.release_id }}' \
            --repository '${{ github.repository }}' \
            --release-version '${{ needs.plan.outputs.release_version }}' \
            --source-sha '${{ needs.plan.outputs.admitted_sha }}' \
            --tag-object-sha '${{ needs.plan.outputs.tag_object_sha }}' \
            --tag-commit-sha '${{ needs.plan.outputs.tag_commit_sha }}' \
            --source-timestamp '${{ steps.source_time.outputs.source_timestamp }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --image-product-id '${{ needs.plan.outputs.image_product_id }}' \
            --image-digests-json '${{ needs.publish_charts_or_assets.outputs.image_digests_json }}' \
            --image-references-json '${{ needs.publish_charts_or_assets.outputs.image_references_json }}' \
            --image-evidence-json '${{ steps.evidence.outputs.image_evidence_json }}' \
            --chart-product-id '${{ needs.plan.outputs.chart_product_id }}' \
            --chart-digest '${{ needs.publish_charts_or_assets.outputs.chart_digest }}' \
            --chart-references-json '${{ needs.publish_charts_or_assets.outputs.immutable_references_json }}' \
            --chart-evidence-json '${{ steps.evidence.outputs.chart_evidence_json }}'

      - name: Revalidate exact tag immediately before GitHub Release write
        uses: ./.ciw/actions/resolve-release-tag
        with:
          phase: revalidate
          release_mode: existing-tag
          release_version: ${{ needs.plan.outputs.release_version }}
          release_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - id: github_release
        name: Create or verify exact GitHub Release replay
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py github-release \
            --release-id '${{ needs.plan.outputs.release_id }}' \
            --repository '${{ github.repository }}' \
            --release-tag '${{ needs.plan.outputs.release_tag }}' \
            --release-version '${{ needs.plan.outputs.release_version }}' \
            --source-sha '${{ needs.plan.outputs.admitted_sha }}' \
            --manifest-json '${{ steps.manifest.outputs.manifest_json }}' \
            --manifest-sha256 '${{ steps.manifest.outputs.manifest_sha256 }}'

      - id: handoff
        name: Construct sanitized immutable Flux review handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py handoff \
            --release-id '${{ needs.plan.outputs.release_id }}' \
            --repository '${{ github.repository }}' \
            --release-version '${{ needs.plan.outputs.release_version }}' \
            --source-sha '${{ needs.plan.outputs.admitted_sha }}' \
            --manifest-sha256 '${{ steps.manifest.outputs.manifest_sha256 }}' \
            --github-release-url '${{ steps.github_release.outputs.github_release_url }}' \
            --canary-id '${{ needs.publish_charts_or_assets.outputs.canary_id }}' \
            --previous-known-good '${{ needs.publish_charts_or_assets.outputs.previous_known_good }}' \
            --rollback-id '${{ needs.publish_charts_or_assets.outputs.rollback_id }}' \
            --image-product-id '${{ needs.plan.outputs.image_product_id }}' \
            --image-digests-json '${{ needs.publish_charts_or_assets.outputs.image_digests_json }}' \
            --image-references-json '${{ needs.publish_charts_or_assets.outputs.image_references_json }}' \
            --image-evidence-json '${{ steps.evidence.outputs.image_evidence_json }}' \
            --chart-product-id '${{ needs.plan.outputs.chart_product_id }}' \
            --chart-digest '${{ needs.publish_charts_or_assets.outputs.chart_digest }}' \
            --chart-references-json '${{ needs.publish_charts_or_assets.outputs.immutable_references_json }}' \
            --chart-evidence-json '${{ steps.evidence.outputs.chart_evidence_json }}'

  request_handoff_and_finalize:
    name: Release / Verified products
    needs: [plan, publish_images, publish_charts_or_assets, verify_and_record]
    if: ${{ always() }}
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      result: ${{ steps.final.outputs.result }}
      handoff_state: ${{ steps.final.outputs.handoff_state }}
      request_id: ${{ steps.final.outputs.request_id }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"

      - id: dispatch
        name: Submit bounded review-only Flux handoff request
        if: ${{ needs.verify_and_record.result == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          FLUX_HANDOFF_TOKEN: ${{ secrets.flux_handoff_token }}
        run: |
          set -Eeuo pipefail
          .ciw/scripts/ci/release.py dispatch-handoff \
            --request-id '${{ needs.plan.outputs.request_id }}' \
            --flux-handoff-json '${{ needs.verify_and_record.outputs.flux_handoff_json }}' \
            --flux-handoff-sha256 '${{ needs.verify_and_record.outputs.flux_handoff_sha256 }}'

      - id: final
        name: Finalize release status
        if: always()
        shell: bash
        env:
          VERIFY_JOB: ${{ needs.verify_and_record.result }}
          HANDOFF_OUTCOME: ${{ steps.dispatch.outcome }}
          HANDOFF_STATE: ${{ steps.dispatch.outputs.handoff_state }}
          REQUEST_ID: ${{ needs.plan.outputs.request_id }}
        run: |
          set -Eeuo pipefail
          result=failure
          state=skipped
          if [[ "${VERIFY_JOB}" == success && "${HANDOFF_OUTCOME}" == success ]]; then
            result=success
            state="${HANDOFF_STATE}"
          fi
          printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
          printf 'handoff_state=%s\n' "${state}" >> "${GITHUB_OUTPUT}"
          printf 'request_id=%s\n' "${REQUEST_ID}" >> "${GITHUB_OUTPUT}"
          test "${result}" = success
