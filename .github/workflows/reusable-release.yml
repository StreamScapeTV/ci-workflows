name: Reusable Git-tag product release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing caller-repository Git tag that is the release source of truth
        required: true
        type: string
      release_version:
        description: Caller-owned SemVer used for image and chart publication
        required: true
        type: string
      admitted_sha:
        description: Exact commit that the release tag must resolve to
        required: true
        type: string
      image_name:
        description: Caller-owned private image name below git.faruqi.dev/mimranfaruqi
        required: true
        type: string
      product_id:
        description: Caller-owned Helm product identity from .streamscape/helm-product.json
        required: true
        type: string
      dockerfile_path:
        description: Caller-repository Dockerfile path
        required: false
        default: Dockerfile
        type: string
      build_context:
        description: Caller-repository build context
        required: false
        default: .
        type: string
      values_profile:
        description: Optional caller-owned Helm values profile
        required: false
        default: ""
        type: string
      policy_path:
        description: Optional caller-owned Helm policy path
        required: false
        default: ""
        type: string
      operation:
        description: publish or publish-with-github-release
        required: false
        default: publish
        type: string
    secrets:
      registry_username:
        description: Private OCI registry username used only by publication jobs
        required: true
      registry_token:
        description: Private OCI registry token used only by publication jobs
        required: true
    outputs:
      result:
        description: Success after image, chart, optional GitHub Release, and terminal summary
        value: ${{ jobs.summary.outputs.result }}
      tag_name:
        description: Exact caller Git tag used as release authority
        value: ${{ jobs.summary.outputs.tag_name }}
      version:
        description: Caller-owned release version
        value: ${{ jobs.summary.outputs.version }}
      source_sha:
        description: Exact commit resolved from release_tag
        value: ${{ jobs.summary.outputs.source_sha }}
      image_reference:
        description: Published versioned image reference
        value: ${{ jobs.summary.outputs.image_reference }}
      chart_digest:
        description: Local normalized Helm package digest used for publication
        value: ${{ jobs.summary.outputs.chart_digest }}

permissions:
  actions: read
  contents: write

jobs:
  admit:
    name: Resolve caller Git tag
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      tag_name: ${{ steps.verify.outputs.tag_name }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Validate release request before checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          [[ "${ADMITTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          case "${OPERATION}" in
            publish|publish-with-github-release) ;;
            *) exit 1 ;;
          esac
      - name: Check out exact caller Git tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: source
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - id: verify
        name: Verify tag resolves to admitted source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
          printf 'source_sha=%s\n' "${ADMITTED_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'tag_name=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

  image:
    name: Release / Image publication
    needs: admit
    runs-on: [linux, amd64, buildah, high]
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      image_reference: ${{ steps.publish.outputs.image_reference }}
    steps:
      - name: Check out exact tagged caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.admit.outputs.source_sha }}
          path: source
          fetch_depth: "1"
      - id: publish
        name: Build and publish version image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          RELEASE_VERSION: ${{ needs.admit.outputs.version }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_TOKEN: ${{ secrets.registry_token }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          command -v buildah >/dev/null
          ! command -v docker >/dev/null 2>&1
          [[ "${IMAGE_NAME}" =~ ^[a-z][a-z0-9-]{1,63}$ ]]
          image_repository="git.faruqi.dev/mimranfaruqi/${IMAGE_NAME}"
          source_root="$(realpath source)"
          dockerfile="$(realpath -m "source/${DOCKERFILE_PATH}")"
          context="$(realpath -m "source/${BUILD_CONTEXT}")"
          case "${dockerfile}" in "${source_root}"/*) ;; *) exit 1 ;; esac
          case "${context}" in "${source_root}"|"${source_root}"/*) ;; *) exit 1 ;; esac
          test -f "${dockerfile}" && test ! -L "${dockerfile}"
          test -d "${context}" && test ! -L "${context}"
          state="$(mktemp -d "${RUNNER_TEMP}/release-image.XXXXXX")"
          chmod 700 "${state}"
          auth="${state}/auth.json"
          manifest="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'state=%s\nmanifest=%s\n' "${state}" "${manifest}" >> "${GITHUB_OUTPUT}"
          printf '%s' "${REGISTRY_TOKEN}" | buildah login --authfile "${auth}" --username "${REGISTRY_USERNAME}" --password-stdin git.faruqi.dev
          unset REGISTRY_TOKEN
          image_ref="${image_repository}:${RELEASE_VERSION}"
          buildah bud --pull=always --layers=false --platform linux/amd64,linux/arm64 --jobs 2 --manifest "${manifest}" -f "${dockerfile}" "${context}"
          buildah manifest push --all --authfile "${auth}" "${manifest}" "docker://${image_ref}"
          printf 'image_reference=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"
      - name: Remove image publication state
        if: always()
        shell: bash
        env:
          STATE: ${{ steps.publish.outputs.state }}
          MANIFEST: ${{ steps.publish.outputs.manifest }}
        run: |
          set -Eeuo pipefail
          test -z "${MANIFEST}" || buildah manifest rm "${MANIFEST}" >/dev/null 2>&1 || true
          buildah rmi -a -f >/dev/null 2>&1 || true
          test -z "${STATE}" || rm -rf "${STATE}"
          test -z "${STATE}" || test ! -e "${STATE}"
      - name: Verify exact image source remained clean
        if: always()
        shell: bash
        env:
          ADMITTED_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

  chart:
    name: Release / Helm publication
    needs: admit
    runs-on: [linux, amd64, buildah, tiny]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      chart_digest: ${{ steps.helm.outputs.chart_digest }}
    steps:
      - name: Check out exact tagged caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.admit.outputs.source_sha }}
          path: source
          fetch_depth: "1"
      - name: Prepare isolated Helm publication state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: minimal
          cache_mode: disabled
          source_sha: ${{ needs.admit.outputs.source_sha }}
          trust_mode: trusted-exact
      - id: helm
        name: Validate, package, and publish caller Helm chart
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@7b17879f21fbf029708d6a404a9dd12d75503a52 # issue #18 simplified Helm runtime checkpoint
        with:
          phase: execute
          admitted_sha: ${{ needs.admit.outputs.source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ needs.admit.outputs.version }}
          values_profile: ${{ inputs.values_profile }}
          policy_path: ${{ inputs.policy_path }}
          source_trust: trusted-exact
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}
      - id: helm_cleanup
        name: Remove Helm publication state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@7b17879f21fbf029708d6a404a9dd12d75503a52 # issue #18 simplified Helm runtime checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ needs.admit.outputs.source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ needs.admit.outputs.version }}
          source_trust: trusted-exact
      - id: residue
        name: Verify zero Helm publication residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@7b17879f21fbf029708d6a404a9dd12d75503a52 # issue #18 simplified Helm runtime checkpoint
        with:
          phase: residue
          admitted_sha: ${{ needs.admit.outputs.source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ needs.admit.outputs.version }}
          source_trust: trusted-exact
      - id: workspace_cleanup
        name: Remove registered Helm workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
      - name: Verify exact chart source remained clean
        if: always()
        shell: bash
        env:
          ADMITTED_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
      - name: Project terminal Helm publication status
        if: always()
        shell: bash
        env:
          HELM_OUTCOME: ${{ steps.helm.outcome }}
          HELM_CLEANUP_OUTCOME: ${{ steps.helm_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${HELM_OUTCOME}" = success
          test "${HELM_CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success

  github_release:
    name: Release / GitHub Release
    needs: [admit, image, chart]
    if: ${{ inputs.operation == 'publish-with-github-release' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create or update normal GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admit.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          response="${RUNNER_TEMP}/github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          code="$(curl --silent --show-error -o "${response}" -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${endpoint}/releases/tags/${RELEASE_TAG}")"
          if test "${code}" = 404; then
            payload="$(jq -nc --arg tag "${RELEASE_TAG}" --arg sha "${SOURCE_SHA}" '{tag_name:$tag,target_commitish:$sha,name:$tag,draft:false,prerelease:false,generate_release_notes:true}')"
            curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data "${payload}" -o "${response}" "${endpoint}/releases"
          elif test "${code}" = 200; then
            release_id="$(jq -er '.id | numbers' "${response}")"
            payload="$(jq -nc --arg tag "${RELEASE_TAG}" '{tag_name:$tag,name:$tag,draft:false}')"
            curl --fail-with-body --silent --show-error -X PATCH -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data "${payload}" -o "${response}" "${endpoint}/releases/${release_id}"
          else
            exit 1
          fi
          jq -e '.html_url | strings | startswith("https://")' "${response}" >/dev/null
      - name: Remove GitHub Release response state
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

  summary:
    name: Release / Summary
    needs: [admit, image, chart, github_release]
    if: always()
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.summary.outputs.result }}
      tag_name: ${{ steps.summary.outputs.tag_name }}
      version: ${{ steps.summary.outputs.version }}
      source_sha: ${{ steps.summary.outputs.source_sha }}
      image_reference: ${{ steps.summary.outputs.image_reference }}
      chart_digest: ${{ steps.summary.outputs.chart_digest }}
    steps:
      - id: summary
        name: Project requested publication results
        shell: bash
        env:
          ADMIT_RESULT: ${{ needs.admit.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          CHART_RESULT: ${{ needs.chart.result }}
          RELEASE_RESULT: ${{ needs.github_release.result }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ needs.admit.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.admit.outputs.version }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          IMAGE_REFERENCE: ${{ needs.image.outputs.image_reference }}
          CHART_DIGEST: ${{ needs.chart.outputs.chart_digest }}
        run: |
          set -Eeuo pipefail
          test "${ADMIT_RESULT}" = success
          test "${IMAGE_RESULT}" = success
          test "${CHART_RESULT}" = success
          if test "${OPERATION}" = publish-with-github-release; then
            test "${RELEASE_RESULT}" = success
          else
            test "${RELEASE_RESULT}" = skipped
          fi
          printf 'result=success\n' >> "${GITHUB_OUTPUT}"
          printf 'tag_name=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'image_reference=%s\n' "${IMAGE_REFERENCE}" >> "${GITHUB_OUTPUT}"
          printf 'chart_digest=%s\n' "${CHART_DIGEST}" >> "${GITHUB_OUTPUT}"
