name: Issue 800 Apple cache patch

"on":
  push:
    branches:
      - agent1/issue-800-apple-dependency-fingerprint
    paths:
      - .github/workflows/issue-800-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'StreamScapeTV/ci-workflows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact Apple dependency-cache patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/issue_800_apply.py
          rm -f scripts/ci/issue_800_apply.py .github/workflows/issue-800-apply.yml

      - name: Validate source-final patch
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_apple_workflow
          python3 -m unittest tests.test_ci_helpers_current
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/apple.yml').read_text(encoding='utf-8'))
          PY

      - name: Upload validated final source blobs
        id: blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          upload_blob() {
            local path="$1"
            local output="$2"
            local encoded response sha
            encoded="$(base64 -w0 "${path}")"
            response="$(jq -nc --arg content "${encoded}" '{content:$content,encoding:"base64"}' | curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @- \
              "https://api.github.com/repos/${REPOSITORY}/git/blobs")"
            sha="$(printf '%s' "${response}" | jq -r '.sha // empty')"
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Failed to create ${path} blob" >&2; exit 1; }
            printf '%s=%s\n' "${output}" "${sha}" >> "${GITHUB_OUTPUT}"
            printf '%s=%s\n' "${output}" "${sha}"
          }
          upload_blob .github/workflows/apple.yml apple_blob_sha
          upload_blob tests/test_apple_workflow.py test_blob_sha
