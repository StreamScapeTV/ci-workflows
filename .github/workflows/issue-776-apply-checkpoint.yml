name: Temporary #776 canonical checkpoint applicator

"on":
  push:
    branches:
      - issue/776-native-cache-default-branches

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'StreamScapeTV/ci-workflows' && github.ref == 'refs/heads/issue/776-native-cache-default-branches' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Resolve Google Drive access token
        id: drive
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          access_token="$(curl --fail --silent --show-error --request POST \
            --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)')"
          echo "::add-mask::${access_token}"
          printf 'access_token=%s\n' "${access_token}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify exact canonical checkpoint
        id: checkpoint
        shell: bash
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.drive.outputs.access_token }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/source-checkpoint.zip"
          manifest="${RUNNER_TEMP}/source-checkpoint-manifest.json"
          message="${RUNNER_TEMP}/source-checkpoint-message.txt"
          python3 scripts/ci/source_checkpoint_publish.py download \
            --repository StreamScapeTV/ci-workflows \
            --branch issue/776-native-cache-default-branches \
            --expected-head "${EXPECTED_HEAD}" \
            --archive "${archive}" \
            --manifest "${manifest}" \
            --message "${message}"
          printf 'archive=%s\nmanifest=%s\nmessage=%s\n' "${archive}" "${manifest}" "${message}" >> "${GITHUB_OUTPUT}"

      - name: Materialize and verify exact checkpoint tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          ARCHIVE: ${{ steps.checkpoint.outputs.archive }}
          MANIFEST: ${{ steps.checkpoint.outputs.manifest }}
        run: |
          set -Eeuo pipefail
          tree="$(python3 scripts/ci/source_checkpoint_publish.py materialize \
            --archive "${ARCHIVE}" \
            --manifest "${MANIFEST}" \
            --worktree . \
            --expected-head "${EXPECTED_HEAD}")"
          test "${tree}" = "626f9a6a559b20e5eec5a2172b1993c735bbb3ae"

      - name: Commit and fast-forward the exact checkpoint
        shell: bash
        env:
          MESSAGE: ${{ steps.checkpoint.outputs.message }}
        run: |
          set -Eeuo pipefail
          test "$(git write-tree)" = "626f9a6a559b20e5eec5a2172b1993c735bbb3ae"
          git config user.name "StreamScapeTV CI"
          git config user.email "ci@streamscape.invalid"
          git commit --file "${MESSAGE}"
          git push origin HEAD:refs/heads/issue/776-native-cache-default-branches
