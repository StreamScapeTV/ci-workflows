name: Reusable trusted Flux reconciliation

on:
  workflow_call:
    inputs:
      admitted_sha: {description: Exact trusted Flux policy source SHA, required: true, type: string}
      target_id: {description: Opaque Flux target id interpreted only by Flux-owned policy, required: true, type: string}
      product_id: {description: Opaque product id interpreted only by Flux-owned policy, required: true, type: string}
      operation: {description: Contract-bounded deploy or restart operation, required: true, type: string}
      policy_path: {description: Exact contract-matched Flux-owned policy adapter path, required: true, type: string}
      allowlist_path: {description: Exact contract-matched Flux-owned allowlist path, required: true, type: string}
      request_id: {description: Bounded request identifier, required: true, type: string}
      dry_run: {description: Resolve and verify policy without cluster mutation, required: false, default: true, type: boolean}
    secrets:
      flux_kubeconfig: {description: Environment-bound Flux caller kubeconfig, required: false}
      flux_sops_age_key: {description: Environment-bound Flux caller SOPS age key, required: false}
    outputs:
      result: {value: '${{ jobs.reconcile.outputs.result }}'}
      reconciliation_state: {value: '${{ jobs.reconcile.outputs.reconciliation_state }}'}
      request_id: {value: '${{ jobs.reconcile.outputs.request_id }}'}
permissions:
  actions: read
  contents: read
jobs:
  reconcile:
    name: Flux / Reconciliation
    runs-on: [linux, amd64, flux-control]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.reconcile.outputs.result }}
      reconciliation_state: ${{ steps.reconcile.outputs.reconciliation_state }}
      request_id: ${{ steps.reconcile.outputs.request_id }}
    steps:
      - name: Check out exact trusted Flux policy source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: StreamScapeTV/flux
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: '1'
      - name: Resolve and run trusted Flux reconciliation
        id: reconcile
        uses: StreamScapeTV/ci-workflows/actions/flux-reconcile@ac5b6be68ea2aa562ccc513103dbdd9b6c23d7ad # issue #20 immutable maintenance action checkpoint
        with:
          admitted_sha: ${{ inputs.admitted_sha }}
          target_id: ${{ inputs.target_id }}
          product_id: ${{ inputs.product_id }}
          operation: ${{ inputs.operation }}
          policy_path: ${{ inputs.policy_path }}
          allowlist_path: ${{ inputs.allowlist_path }}
          request_id: ${{ inputs.request_id }}
          dry_run: ${{ inputs.dry_run }}
          flux_kubeconfig: ${{ secrets.flux_kubeconfig }}
          flux_sops_age_key: ${{ secrets.flux_sops_age_key }}
      - name: Cleanup and verify exact Flux workflow state
        if: always()
        shell: bash
        run: |
          set -u
          cleanup_failed=0
          if [[ -d source && ! -L source ]]; then
            (
              cd source
              test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
              test -z "$(git status --porcelain --untracked-files=all)"
            ) || cleanup_failed=1
            rm -rf source || cleanup_failed=1
          elif [[ -e source || -L source ]]; then
            rm -f source || cleanup_failed=1
          fi
          state="${RUNNER_TEMP}/flux-reconcile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${state}" || cleanup_failed=1
          [[ ! -e source && ! -L source ]] || cleanup_failed=1
          [[ ! -e "${state}" && ! -L "${state}" ]] || cleanup_failed=1
          exit "${cleanup_failed}"
