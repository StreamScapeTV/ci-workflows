name: Apple physical device lock contract smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate Apple physical-device runner contract
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Require protected Central dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "StreamScapeTV/ci-workflows"
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify Apple and physical-device capacity remains consumer-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("contracts/runner-profiles.json").read_text(encoding="utf-8"))
          profiles = {item["id"]: item for item in contract["profiles"]}
          apple = profiles["apple"]
          physical = profiles["physical-device"]
          assert apple["default_internal_selector"] == ["macOS", "ARM64"]
          assert "validation.apple" in apple["allowed_workflow_apis"]
          assert "validation.device" in physical["allowed_workflow_apis"]
          assert physical["privilege"]["device_locked"] is True
          PY

      - name: Verify exact source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
