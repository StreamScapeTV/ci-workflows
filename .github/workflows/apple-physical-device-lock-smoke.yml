name: Apple physical device lock infrastructure smoke

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fence_smoke:
    name: Validate runner-owned Apple fencing backend with synthetic identity
    runs-on: [macOS, ARM64, ios]
    timeout-minutes: 20
    steps:
      - id: dispatch_guard
        name: Require protected main dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "StreamScapeTV/ci-workflows" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            printf '%s\n' 'Apple device-lock infrastructure smoke requires protected main.' >&2
            exit 1
          fi

      - id: backend_guard
        name: Require runner-owned fencing backend
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${CIW_DEVICE_LOCK_ROOT:-}" ]]; then
            printf '%s\n' 'Runner-owned device-lock backend is unavailable.' >&2
            exit 1
          fi

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact protected source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - id: acquire
        name: Acquire synthetic Apple infrastructure fence receipt
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: acquire
          device_family: ios
          device_capability: infrastructure-smoke
          device_identity_hash: 7d054eda67532b301dded6c800d129646403f37995c4a96c723f2016b7b4e6c3
          tested_source_sha: ${{ github.sha }}
          authorization_receipt: issue-216-synthetic-infrastructure-authorization
          request_id: issue-216-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"

      - id: verify
        name: Verify exact synthetic Apple fence receipt
        if: ${{ always() && steps.acquire.outputs.resource_lock_receipt != '' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: verify
          device_family: ios
          device_capability: infrastructure-smoke
          device_identity_hash: 7d054eda67532b301dded6c800d129646403f37995c4a96c723f2016b7b4e6c3
          tested_source_sha: ${{ github.sha }}
          authorization_receipt: issue-216-synthetic-infrastructure-authorization
          request_id: issue-216-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          minimum_remaining_seconds: "30"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: release
        name: Expected-state release exact synthetic Apple fence receipt
        if: ${{ always() && steps.acquire.outputs.resource_lock_receipt != '' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: release
          device_family: ios
          device_capability: infrastructure-smoke
          device_identity_hash: 7d054eda67532b301dded6c800d129646403f37995c4a96c723f2016b7b4e6c3
          tested_source_sha: ${{ github.sha }}
          authorization_receipt: issue-216-synthetic-infrastructure-authorization
          request_id: issue-216-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: residue
        name: Verify exact synthetic Apple fence left no active lease
        if: ${{ always() && steps.release.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/device-lock
        with:
          phase: residue
          device_family: ios
          device_capability: infrastructure-smoke
          device_identity_hash: 7d054eda67532b301dded6c800d129646403f37995c4a96c723f2016b7b4e6c3
          tested_source_sha: ${{ github.sha }}
          authorization_receipt: issue-216-synthetic-infrastructure-authorization
          request_id: issue-216-${{ github.run_id }}-${{ github.run_attempt }}
          lease_seconds: "300"
          resource_lock_receipt: ${{ steps.acquire.outputs.resource_lock_receipt }}

      - id: cleanup
        name: Remove only this synthetic release marker
        if: ${{ always() && steps.residue.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          RESOURCE_KEY_HASH: ${{ steps.acquire.outputs.resource_key_hash }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_CLEANUP'
          import os
          import re
          from pathlib import Path

          root = os.environ.get("CIW_DEVICE_LOCK_ROOT", "")
          resource_key_hash = os.environ.get("RESOURCE_KEY_HASH", "")
          if not root or re.fullmatch(r"[0-9a-f]{64}", resource_key_hash) is None:
              raise SystemExit("Synthetic device-lock cleanup inputs are unavailable.")

          marker = Path(root) / "released" / f"{resource_key_hash}.json"
          try:
              marker.unlink()
          except FileNotFoundError:
              pass
          except OSError:
              raise SystemExit("Synthetic device-lock cleanup failed.") from None

          if marker.exists() or marker.is_symlink():
              raise SystemExit("Synthetic device-lock cleanup residue remains.")
          PY_CLEANUP

      - id: zero_artifacts
        name: Verify infrastructure smoke retained zero Actions artifacts
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ARTIFACTS'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Apple device-lock infrastructure smoke retained Actions artifacts.")
          print("Routine Apple device-lock infrastructure smoke Actions artifacts verified: zero.")
          PY_ARTIFACTS

      - name: Project terminal synthetic Apple fencing result
        if: always()
        shell: bash
        env:
          DISPATCH_GUARD_OUTCOME: ${{ steps.dispatch_guard.outcome }}
          BACKEND_GUARD_OUTCOME: ${{ steps.backend_guard.outcome }}
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ZERO_ARTIFACTS_OUTCOME: ${{ steps.zero_artifacts.outcome }}
        run: |
          set -Eeuo pipefail
          test "${DISPATCH_GUARD_OUTCOME}" = success
          test "${BACKEND_GUARD_OUTCOME}" = success
          test "${ACQUIRE_OUTCOME}" = success
          test "${VERIFY_OUTCOME}" = success
          test "${RELEASE_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${CLEANUP_OUTCOME}" = success
          test "${ZERO_ARTIFACTS_OUTCOME}" = success
