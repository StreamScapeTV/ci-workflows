# Ecosystem workflow: Xcode and Swift. Dispatched directly by the agent runner, which finds
# the run by the request id in run-name. No Agent State, no broker. A project that follows the
# Xcode/Swift standard (docs/ci-conventions/xcode.md) needs no .ci directory; a tracked
# .ci/<stage>.sh is still honoured during the transition. All requested stages run in ONE job
# ('xcode / stages') on one macOS runner of the Central execution class the plan job resolves from the repository
# (scripts/ci/ci_execution_class.py; streamscape-media runs on the owner's macos-high-capacity Mac): build-for-testing once, test-without-building, lint alongside;
# lint never fails a build/test/release request. Operation release adds a 'release' job after it that runs the
# repository's .ci/release.sh from a tag (ci-xcode-release-stage.yml; App Store Connect credentials there only).
name: Central CI Xcode

run-name: CI xcode ${{ inputs.request_id }}

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id chosen by the agent runner (appears in run-name and the log prefix)
        type: string
        required: true
      repository:
        description: StreamScapeTV/<name>
        type: string
        required: true
      ref:
        description: Branch or tag name
        type: string
        required: true
      is_tag:
        description: "true or false"
        type: string
        required: true
      operation:
        description: Top operation lint, test, build or release; every operation below it runs first as a stage (lint < test < build < release)
        type: string
        required: true
      target:
        description: Profile target the runner may send; accepted for compatibility and ignored (this workflow is the target)
        type: string
        required: false
        default: ""
      options:
        description: JSON object of reviewed semantic options
        type: string
        required: false
        default: "{}"

permissions:
  contents: read

# Safety net only: one pipeline per project and branch at a time (the runner enforces this and
# cancels by request id; it never relies on concurrency to cancel). Never cancels another request.
concurrency:
  group: ci-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stages: ${{ steps.validate.outputs.stages }}
      options: ${{ steps.validate.outputs.options }}
      last_stage: ${{ steps.validate.outputs.last_stage }}
      job_stages: ${{ steps.validate.outputs.job_stages }}
      release_options: ${{ steps.validate.outputs.release_options }}
      execution_class: ${{ steps.execution.outputs.execution_class }}
    steps:
      - name: Check out Central CI contract and helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: central-ci
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            contracts

      - name: Validate request
        id: validate
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          IS_TAG: ${{ inputs.is_tag }}
          OPERATION: ${{ inputs.operation }}
          OPTIONS: ${{ inputs.options }}
        run: |
          set -Eeuo pipefail
          result="$(python3 central-ci/scripts/ci/ci_validate_inputs.py \
            --contract central-ci/contracts/repository-ci-v1.json --ecosystem xcode)"
          {
            printf 'stages=%s\n' "$(jq -c '.stages' <<<"${result}")"
            printf 'options=%s\n' "$(jq -c '.options' <<<"${result}")"
            printf 'job_stages=%s\n' "$(jq -c '.stages | map(select(. != "release"))' <<<"${result}")"
            printf 'release_options=%s\n' "$(jq -c '.release_options // {}' <<<"${result}")"
            # the last stage of the one stage job (release runs in its own job and never saves a cache)
            printf 'last_stage=%s\n' "$(jq -r '.stages | map(select(. != "release")) | .[-1]' <<<"${result}")"
          } >> "${GITHUB_OUTPUT}"

      # Central semantic execution class from the repository being built (reviewed allow-list in
      # scripts/ci/ci_execution_class.py): StreamScapeTV/streamscape-media -> macos-high-capacity (the owner's
      # persistent high-performance Mac), every other repository -> macos-hosted (macos-latest). No input selects it.
      - name: Resolve Central execution class
        id: execution
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: python3 central-ci/scripts/ci/ci_execution_class.py plan --repository "${REPOSITORY}"

  xcode:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.job_stages != '[]' }}
    uses: ./.github/workflows/ci-xcode-stage.yml
    with:
      request_id: ${{ inputs.request_id }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      is_tag: ${{ inputs.is_tag }}
      stages: ${{ needs.plan.outputs.job_stages }}
      top: ${{ inputs.operation }}
      options: ${{ needs.plan.outputs.options }}
      last_stage: ${{ needs.plan.outputs.last_stage }}
      execution_class: ${{ needs.plan.outputs.execution_class }}
    secrets:
      SOURCE_APP_ID: ${{ secrets.SOURCE_APP_ID }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      FORGEJO_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
      S3_GITHUB_TRANSPORT_ACCESS_KEY: ${{ secrets.S3_GITHUB_TRANSPORT_ACCESS_KEY }}
      S3_GITHUB_TRANSPORT_SECRET_KEY: ${{ secrets.S3_GITHUB_TRANSPORT_SECRET_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      STREAMSCAPE_API_BASE: ${{ secrets.STREAMSCAPE_API_BASE }}
      STREAMSCAPE_EMAIL: ${{ secrets.STREAMSCAPE_EMAIL }}
      STREAMSCAPE_PASSWORD: ${{ secrets.STREAMSCAPE_PASSWORD }}
      STREAMSCAPE_DEMO_EMAIL: ${{ secrets.STREAMSCAPE_DEMO_EMAIL }}
      STREAMSCAPE_DEMO_PASSWORD: ${{ secrets.STREAMSCAPE_DEMO_PASSWORD }}
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

  # Release (lint, test, build, then release; lint never gates it): the repository's .ci/release.sh from a tag,
  # in its own job, the only one that receives the App Store Connect credentials.
  release:
    needs: [plan, xcode]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.stages), 'release') && needs.xcode.result == 'success' }}
    uses: ./.github/workflows/ci-xcode-release-stage.yml
    with:
      request_id: ${{ inputs.request_id }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      is_tag: ${{ inputs.is_tag }}
      options: ${{ needs.plan.outputs.release_options }}
      execution_class: ${{ needs.plan.outputs.execution_class }}
    secrets:
      SOURCE_APP_ID: ${{ secrets.SOURCE_APP_ID }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      FORGEJO_REGISTRY_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
      S3_GITHUB_TRANSPORT_ACCESS_KEY: ${{ secrets.S3_GITHUB_TRANSPORT_ACCESS_KEY }}
      S3_GITHUB_TRANSPORT_SECRET_KEY: ${{ secrets.S3_GITHUB_TRANSPORT_SECRET_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
