name: Flutter CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      working_directory:
        type: string
        required: false
        default: "."
      test_profile:
        type: string
        required: false
        default: ""
      java_version:
        type: string
        required: false
        default: "25"
      flutter_version:
        type: string
        required: false
        default: "3.44.6"
      prepare_command:
        type: string
        required: false
        default: ""
      build_command:
        type: string
        required: false
        default: ""
      test_command:
        type: string
        required: false
        default: ""
      release_command:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_TEST_PROFILE: ${{ inputs.test_profile }}
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@62a783692dec6b4455adfb3435c8981176295acb
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: false

      - name: Run product commands
        id: commands
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          TEST_COMMAND: ${{ inputs.test_command }}
          RELEASE_COMMAND: ${{ inputs.release_command }}
          CI_GITHUB_TOKEN: ${{ steps.source.outputs.token || github.token }}
          GH_TOKEN: ${{ steps.source.outputs.token || github.token }}
        run: |
          set -Eeuo pipefail
          test -n "${PREPARE_COMMAND}${BUILD_COMMAND}${TEST_COMMAND}${RELEASE_COMMAND}"
          for phase in PREPARE BUILD TEST RELEASE; do
            variable="${phase}_COMMAND"
            command="${!variable}"
            test -z "${command}" && continue
            phase_name="$(printf '%s' "${phase}" | tr '[:upper:]' '[:lower:]')"
            printf '\n===== %s =====\n' "${phase_name}" >> "${CI_LOG}"
            if ! bash -lc "${command}" >> "${CI_LOG}" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "${phase_name}" >&2
              exit 1
            fi
          done

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@38bfe084cf9bfdedcaca1808c72693f9e657e988
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.log.gz
          gzip: 'true'
          mime_type: application/gzip

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@62a783692dec6b4455adfb3435c8981176295acb
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
