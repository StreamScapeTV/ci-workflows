name: Reusable Helm publication

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA selected by the caller release job
        required: true
        type: string
      product_id:
        description: Approved Helm product identity
        required: true
        type: string
      release_version:
        description: Exact SemVer used for the packaged chart
        required: true
        type: string
      values_profile:
        description: Optional caller-owned product values profile
        required: false
        type: string
      policy_path:
        description: Optional caller-owned product policy path
        required: false
        type: string
      image_digest:
        description: Legacy compatibility input; generic Helm publication does not require image digest evidence
        required: false
        type: string
      immutable_references_json:
        description: Legacy compatibility input; generic Helm publication does not require OCI read-back evidence
        required: false
        type: string
    secrets:
      registry_username:
        description: OCI registry username
        required: true
      registry_token:
        description: OCI registry token
        required: true
    outputs:
      result:
        description: Success after package publication and terminal cleanup
        value: ${{ jobs.publish.outputs.result }}
      chart_digest:
        description: SHA-256 of the normalized chart package that was published
        value: ${{ jobs.publish.outputs.chart_digest }}
      immutable_references_json:
        description: Published chart reference plus local normalized package digest
        value: ${{ jobs.publish.outputs.immutable_references_json }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded Helm publication plan
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - name: Require an exact product tag push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          test "${EVENT_NAME}" = push
          test "${REF_TYPE}" = tag
          test "${EVENT_SHA}" = "${ADMITTED_SHA}"
      - id: plan
        name: Resolve caller-owned Helm product metadata
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@2db6c709c3faa4e99a67fe029628284cf0e60f80 # issue #18 caller-owned Helm metadata checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          values_profile: ${{ inputs.values_profile }}
          policy_path: ${{ inputs.policy_path }}
          source_trust: trusted-exact

  publish:
    name: Release / Helm publication
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 90
    outputs:
      result: ${{ steps.helm.outcome == 'success' && steps.helm_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      chart_digest: ${{ steps.helm.outputs.chart_digest }}
      immutable_references_json: ${{ steps.helm.outputs.immutable_references_json }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
      - name: Prepare isolated Helm publication state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}
      - id: helm
        name: Lint, render, package, and publish caller Helm chart
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@2db6c709c3faa4e99a67fe029628284cf0e60f80 # issue #18 caller-owned Helm metadata checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          values_profile: ${{ inputs.values_profile }}
          policy_path: ${{ inputs.policy_path }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}
      - id: helm_cleanup
        name: Remove Helm package, registry, and credential state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@2db6c709c3faa4e99a67fe029628284cf0e60f80 # issue #18 caller-owned Helm metadata checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: residue
        name: Verify zero Helm publication residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-helm@2db6c709c3faa4e99a67fe029628284cf0e60f80 # issue #18 caller-owned Helm metadata checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: workspace_cleanup
        name: Remove and verify all registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
      - name: Verify exact caller source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}" && test -z "$(git status --porcelain --untracked-files=all)")
      - name: Project terminal Helm publication status
        if: always()
        shell: bash
        env:
          HELM_OUTCOME: ${{ steps.helm.outcome }}
          HELM_CLEANUP_OUTCOME: ${{ steps.helm_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${HELM_OUTCOME}" = success
          test "${HELM_CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
