name: Reusable exact-tag image and Helm release

on:
  workflow_call:
    inputs:
      release_mode:
        description: tag-push by default, or existing-tag with the complete exact tuple
        required: false
        default: tag-push
        type: string
      release_version:
        description: Exact canonical stable SemVer tag for existing-tag mode
        required: false
        type: string
      release_source_sha:
        description: Exact lowercase tagged commit for existing-tag mode
        required: false
        type: string
      image_name:
        description: Image repository slug under git.faruqi.dev/mimranfaruqi
        required: true
        type: string
      chart_name:
        description: Helm chart and OCI repository slug
        required: true
        type: string
      chart_path:
        description: Relative chart directory in the caller repository
        required: true
        type: string
      dockerfile_path:
        description: Relative Dockerfile path in the caller repository
        required: false
        default: Dockerfile
        type: string
      build_context:
        description: Relative image build context in the caller repository
        required: false
        default: .
        type: string
    secrets:
      registry_username:
        description: Private OCI registry username
        required: true
      registry_token:
        description: Private OCI registry token
        required: true
    outputs:
      version:
        description: Exact validated release version
        value: ${{ jobs.publish.outputs.version }}
      source_sha:
        description: Exact validated tagged source commit
        value: ${{ jobs.publish.outputs.source_sha }}
      image_reference:
        description: Published immutable image reference
        value: ${{ jobs.publish.outputs.image_reference }}
      image_digest:
        description: Verified remote image-index digest
        value: ${{ jobs.publish.outputs.image_digest }}
      chart_reference:
        description: Published immutable Helm OCI reference
        value: ${{ jobs.publish.outputs.chart_reference }}
      chart_digest:
        description: Verified remote Helm OCI manifest digest
        value: ${{ jobs.publish.outputs.chart_digest }}
      chart_package_sha256:
        description: Verified chart package SHA-256
        value: ${{ jobs.publish.outputs.chart_package_sha256 }}

permissions:
  actions: read
  contents: read

env:
  REGISTRY: git.faruqi.dev
  REGISTRY_NAMESPACE: mimranfaruqi
  CHART_NAMESPACE: mimranfaruqi/helm-charts
  HELM_VERSION: v3.18.6
  HELM_IMAGE: docker.io/alpine/helm:3.18.6@sha256:b158d7f0fe1fb84abb59a15973ef25adf66affa2028a8328c083046c5ca04e91

jobs:
  admit:
    name: Resolve exact release tag authority
    runs-on: [linux, amd64, buildah, high]
    timeout-minutes: 10
    outputs:
      release_mode: ${{ steps.authority.outputs.release_mode }}
      version: ${{ steps.authority.outputs.release_version }}
      source_sha: ${{ steps.authority.outputs.release_source_sha }}
      tag_object_sha: ${{ steps.authority.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.authority.outputs.tag_commit_sha }}
    steps:
      - id: authority
        name: Admit exact trusted release mode and tag tuple
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          release_mode: ${{ inputs.release_mode }}
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.release_source_sha }}

  publish:
    name: Publish exact tag image and chart
    needs: admit
    runs-on: [linux, amd64, buildah, high]
    timeout-minutes: 90
    concurrency:
      group: tag-image-chart-${{ github.repository }}-${{ needs.admit.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      image_reference: ${{ steps.image.outputs.reference }}
      image_digest: ${{ steps.image.outputs.digest }}
      chart_reference: ${{ steps.chart.outputs.reference }}
      chart_digest: ${{ steps.chart.outputs.digest }}
      chart_package_sha256: ${{ steps.chart.outputs.package_sha256 }}

    steps:
      - name: Revalidate exact release tag before checkout
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          phase: revalidate
          release_mode: ${{ needs.admit.outputs.release_mode }}
          release_version: ${{ needs.admit.outputs.version }}
          release_source_sha: ${{ needs.admit.outputs.source_sha }}
          expected_tag_object_sha: ${{ needs.admit.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.admit.outputs.tag_commit_sha }}

      - name: Check out exact validated caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact detached release source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git symbolic-ref -q HEAD || true)"

      - id: release
        name: Validate bounded product inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_PATH: ${{ inputs.chart_path }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          set -Eeuo pipefail
          test "${SOURCE_SHA}" = "$(git rev-parse HEAD)"

          VERSION="${VERSION}" \
          IMAGE_NAME="${IMAGE_NAME}" \
          CHART_NAME="${CHART_NAME}" \
          CHART_PATH="${CHART_PATH}" \
          DOCKERFILE_PATH="${DOCKERFILE_PATH}" \
          BUILD_CONTEXT="${BUILD_CONTEXT}" \
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path, PurePosixPath
          import re

          version = os.environ["VERSION"]
          version_pattern = re.compile(
              r"(?:0|[1-9][0-9]*)"
              r"\.(?:0|[1-9][0-9]*)"
              r"\.(?:0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          if version_pattern.fullmatch(version) is None:
              raise SystemExit(
                  "Release tag must be MAJOR.MINOR.PATCH with an optional "
                  "OCI-safe prerelease suffix."
              )

          slug_pattern = re.compile(r"[a-z0-9]+(?:[._-][a-z0-9]+)*")
          for name in ("IMAGE_NAME", "CHART_NAME"):
              value = os.environ[name]
              if slug_pattern.fullmatch(value) is None:
                  raise SystemExit(f"{name} is not an approved repository slug")

          def checked_relative(name: str, *, allow_dot: bool = False) -> Path:
              raw = os.environ[name]
              if allow_dot and raw == ".":
                  return Path(".")
              pure = PurePosixPath(raw)
              if (
                  not raw
                  or pure.is_absolute()
                  or ".." in pure.parts
                  or "." in pure.parts
                  or "\\" in raw
              ):
                  raise SystemExit(f"{name} must be a normalized relative path")
              return Path(*pure.parts)

          chart_path = checked_relative("CHART_PATH")
          dockerfile_path = checked_relative("DOCKERFILE_PATH")
          build_context = checked_relative("BUILD_CONTEXT", allow_dot=True)
          if not chart_path.is_dir():
              raise SystemExit("CHART_PATH does not exist or is not a directory")
          if not (chart_path / "Chart.yaml").is_file():
              raise SystemExit("CHART_PATH is missing Chart.yaml")
          if not dockerfile_path.is_file():
              raise SystemExit("DOCKERFILE_PATH does not exist")
          if not build_context.is_dir():
              raise SystemExit("BUILD_CONTEXT does not exist or is not a directory")
          PY

          image_reference="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}:${VERSION}"
          chart_reference="oci://${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}"
          {
            printf 'version=%s\n' "${VERSION}"
            printf 'source_sha=%s\n' "${SOURCE_SHA}"
            printf 'image_reference=%s\n' "${image_reference}"
            printf 'chart_reference=%s\n' "${chart_reference}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify daemonless publication runner and credentials
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_TOKEN: ${{ secrets.registry_token }}
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -eq 0
          ! command -v docker
          ! command -v dockerd
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          buildah --version
          skopeo --version
          podman --version
          test -n "${REGISTRY_USERNAME}"
          test -n "${REGISTRY_TOKEN}"

      - name: Stage pinned Helm from immutable OCI image
        shell: bash
        run: |
          set -Eeuo pipefail
          helm_root="${RUNNER_TEMP}/central-tag-release-helm-bin"
          helm_storage="${helm_root}/storage"
          helm_run_token="$(
            RUNROOT_KIND=central-tag-release-helm python3 - <<'PY_RUNROOT'
          import hashlib
          import os

          material = ":".join(
              (
                  os.environ["GITHUB_RUN_ID"],
                  os.environ["GITHUB_RUN_ATTEMPT"],
                  os.environ["RUNROOT_KIND"],
              )
          )
          print(hashlib.sha256(material.encode("utf-8")).hexdigest()[:12])
          PY_RUNROOT
          )"
          helm_runroot="${RUNNER_TEMP}/r/${helm_run_token}"
          helm_path="${helm_root}/helm"
          helm_source_container="central-tag-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-helm"
          rm -rf "${helm_root}" "${helm_runroot}"
          mkdir -p "${helm_storage}" "${helm_runroot}"
          chmod 0700 "${helm_root}" "${helm_storage}" "${helm_runroot}"

          podman_cmd=(
            podman
            --storage-driver vfs
            --root "${helm_storage}"
            --runroot "${helm_runroot}"
          )
          timeout --signal=TERM --kill-after=5s 60s "${podman_cmd[@]}" info
          "${podman_cmd[@]}" pull --platform linux/amd64 "${HELM_IMAGE}"
          helm_image_id="$("${podman_cmd[@]}" image inspect --format '{{.Id}}' "${HELM_IMAGE}")"
          test -n "${helm_image_id}"
          "${podman_cmd[@]}" create --platform linux/amd64 \
            --name "${helm_source_container}" \
            "${HELM_IMAGE}" version >/dev/null
          "${podman_cmd[@]}" cp \
            "${helm_source_container}:/usr/bin/helm" \
            "${helm_path}"
          test -x "${helm_path}"
          test "$("${helm_path}" version --template '{{.Version}}')" = "${HELM_VERSION}"

          cleanup_failed=0
          "${podman_cmd[@]}" rm -f "${helm_source_container}" >/dev/null 2>&1 || cleanup_failed=1
          "${podman_cmd[@]}" image rm -f "${helm_image_id}" >/dev/null 2>&1 || cleanup_failed=1
          "${podman_cmd[@]}" container exists "${helm_source_container}" && cleanup_failed=1
          "${podman_cmd[@]}" image exists "${HELM_IMAGE}" && cleanup_failed=1
          rm -rf "${helm_storage}" "${helm_runroot}" || cleanup_failed=1
          [[ ! -e "${helm_storage}" ]] || cleanup_failed=1
          [[ ! -e "${helm_runroot}" ]] || cleanup_failed=1
          test "${cleanup_failed}" -eq 0

          echo "${helm_root}" >> "${GITHUB_PATH}"
          echo "HELM_BIN=${helm_path}" >> "${GITHUB_ENV}"

      - name: Prepare isolated publication and authentication state
        shell: bash
        run: |
          set -Eeuo pipefail
          state_root="${RUNNER_TEMP}/central-tag-release"
          storage_root="${state_root}/containers/storage"
          run_token="$(
            RUNROOT_KIND=central-tag-release-containers python3 - <<'PY_RUNROOT'
          import hashlib
          import os

          material = ":".join(
              (
                  os.environ["GITHUB_RUN_ID"],
                  os.environ["GITHUB_RUN_ATTEMPT"],
                  os.environ["RUNROOT_KIND"],
              )
          )
          print(hashlib.sha256(material.encode("utf-8")).hexdigest()[:12])
          PY_RUNROOT
          )"
          run_root="${RUNNER_TEMP}/r/${run_token}"
          registry_auth="${state_root}/auth/containers.json"
          helm_auth="${state_root}/auth/helm.json"
          helm_repository_config="${state_root}/helm/repositories.yaml"
          helm_repository_cache="${state_root}/helm/repository-cache"
          oci_layout="${state_root}/image-oci"
          chart_source="${state_root}/chart-source"
          chart_local="${state_root}/chart-local"
          chart_remote="${state_root}/chart-remote"

          rm -rf "${state_root}" "${run_root}"
          mkdir -p \
            "${storage_root}" \
            "${run_root}" \
            "$(dirname "${registry_auth}")" \
            "$(dirname "${helm_repository_config}")" \
            "${helm_repository_cache}" \
            "${oci_layout}" \
            "${chart_source}" \
            "${chart_local}" \
            "${chart_remote}"
          chmod 0700 \
            "${state_root}" \
            "${storage_root}" \
            "${run_root}" \
            "$(dirname "${registry_auth}")" \
            "$(dirname "${helm_repository_config}")" \
            "${helm_repository_cache}" \
            "${oci_layout}" \
            "${chart_source}" \
            "${chart_local}" \
            "${chart_remote}"
          printf '{}\n' > "${registry_auth}"
          printf '{}\n' > "${helm_auth}"
          chmod 0600 "${registry_auth}" "${helm_auth}"

          {
            printf 'STATE_ROOT=%s\n' "${state_root}"
            printf 'CONTAINER_STORAGE_ROOT=%s\n' "${storage_root}"
            printf 'CONTAINER_RUN_ROOT=%s\n' "${run_root}"
            printf 'REGISTRY_AUTH_FILE=%s\n' "${registry_auth}"
            printf 'HELM_REGISTRY_CONFIG=%s\n' "${helm_auth}"
            printf 'HELM_REPOSITORY_CONFIG=%s\n' "${helm_repository_config}"
            printf 'HELM_REPOSITORY_CACHE=%s\n' "${helm_repository_cache}"
            printf 'OCI_LAYOUT=%s\n' "${oci_layout}"
            printf 'CHART_SOURCE=%s\n' "${chart_source}"
            printf 'CHART_LOCAL=%s\n' "${chart_local}"
            printf 'CHART_REMOTE=%s\n' "${chart_remote}"
          } >> "${GITHUB_ENV}"

          timeout --signal=TERM --kill-after=5s 60s \
            buildah \
              --storage-driver vfs \
              --root "${storage_root}" \
              --runroot "${run_root}" \
              info

      - name: Prepare locked Helm chart dependencies
        shell: bash
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -Eeuo pipefail
          cp -a "${CHART_PATH}/." "${CHART_SOURCE}/"

          source_metadata="${STATE_ROOT}/chart-source-metadata.yaml"
          "${HELM_BIN}" show chart "${CHART_SOURCE}" > "${source_metadata}"
          grep -Fqx "name: ${CHART_NAME}" "${source_metadata}"
          grep -Fqx "version: ${VERSION}" "${source_metadata}"
          grep -Eq "^appVersion: ['\"]?${VERSION}['\"]?$" "${source_metadata}"

          dependency_list="${STATE_ROOT}/chart-dependency-list.txt"
          dependency_repositories="${STATE_ROOT}/chart-dependency-repositories.txt"
          dependency_count_file="${STATE_ROOT}/chart-dependency-count.txt"
          "${HELM_BIN}" dependency list "${CHART_SOURCE}" > "${dependency_list}"

          CHART_SOURCE="${CHART_SOURCE}" \
          DEPENDENCY_LIST="${dependency_list}" \
          DEPENDENCY_REPOSITORIES="${dependency_repositories}" \
          DEPENDENCY_COUNT_FILE="${dependency_count_file}" \
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          chart_source = Path(os.environ["CHART_SOURCE"])
          dependency_list = Path(os.environ["DEPENDENCY_LIST"])
          repository_output = Path(os.environ["DEPENDENCY_REPOSITORIES"])
          count_output = Path(os.environ["DEPENDENCY_COUNT_FILE"])

          rows: list[tuple[str, str, str]] = []
          saw_header = False
          for raw_line in dependency_list.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("WARNING:"):
                  continue
              if line.startswith("NAME") and "VERSION" in line and "REPOSITORY" in line:
                  saw_header = True
                  continue
              if not saw_header:
                  raise SystemExit(f"Unexpected Helm dependency output: {line}")
              fields = line.split()
              if len(fields) < 4:
                  raise SystemExit(f"Malformed Helm dependency row: {line}")
              name, version, repository = fields[:3]
              if re.fullmatch(r"[A-Za-z0-9_.-]+", name) is None:
                  raise SystemExit(f"Unsafe Helm dependency name: {name}")
              if re.fullmatch(r"[0-9A-Za-z.+_-]+", version) is None:
                  raise SystemExit(f"Unsafe Helm dependency version: {version}")
              parsed = urlsplit(repository)
              if parsed.scheme not in {"https", "oci"}:
                  raise SystemExit(
                      f"Unsupported Helm dependency repository scheme: {repository}"
                  )
              if (
                  not parsed.netloc
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(
                      f"Unsafe Helm dependency repository URL: {repository}"
                  )
              rows.append((name, version, repository))

          lock_path = chart_source / "Chart.lock"
          if rows and not lock_path.is_file():
              raise SystemExit(
                  "Chart.lock is required when Chart.yaml declares dependencies"
              )
          if not rows and lock_path.exists():
              raise SystemExit(
                  "Chart.lock exists but Chart.yaml declares no dependencies"
              )

          repositories = sorted(
              {repository for _, _, repository in rows if repository.startswith("https://")}
          )
          repository_output.write_text(
              "".join(f"{repository}\n" for repository in repositories),
              encoding="utf-8",
          )
          count_output.write_text(f"{len(rows)}\n", encoding="utf-8")
          PY

          dependency_count="$(tr -d '[:space:]' < "${dependency_count_file}")"
          [[ "${dependency_count}" =~ ^[0-9]+$ ]]
          printf 'CHART_DEPENDENCY_COUNT=%s\n' "${dependency_count}" >> "${GITHUB_ENV}"

          if [[ "${dependency_count}" -gt 0 ]]; then
            lock_sha_before="$(sha256sum "${CHART_SOURCE}/Chart.lock" | awk '{print $1}')"
            repository_index=0
            while IFS= read -r repository; do
              [[ -n "${repository}" ]] || continue
              "${HELM_BIN}" repo add \
                "release-dependency-${repository_index}" \
                "${repository}" \
                --force-update \
                --repository-config "${HELM_REPOSITORY_CONFIG}" \
                --repository-cache "${HELM_REPOSITORY_CACHE}"
              repository_index=$((repository_index + 1))
            done < "${dependency_repositories}"

            rm -rf "${CHART_SOURCE}/charts"
            "${HELM_BIN}" dependency build "${CHART_SOURCE}" \
              --skip-refresh \
              --repository-config "${HELM_REPOSITORY_CONFIG}" \
              --repository-cache "${HELM_REPOSITORY_CACHE}"

            lock_sha_after="$(sha256sum "${CHART_SOURCE}/Chart.lock" | awk '{print $1}')"
            test "${lock_sha_after}" = "${lock_sha_before}"
            actual_dependencies="$(
              find "${CHART_SOURCE}/charts" \
                -mindepth 1 -maxdepth 1 -type f -name '*.tgz' -print \
                | wc -l \
                | tr -d '[:space:]'
            )"
            test "${actual_dependencies}" -eq "${dependency_count}"
          else
            test ! -e "${CHART_SOURCE}/charts"
          fi

          source_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          SOURCE_EPOCH="${source_epoch}" python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["CHART_SOURCE"])
          epoch = int(os.environ["SOURCE_EPOCH"])
          for path in [root, *root.rglob("*")]:
              os.utime(path, (epoch, epoch), follow_symlinks=False)
          PY

      - name: Revalidate exact release tag immediately before publication
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          phase: revalidate
          release_mode: ${{ needs.admit.outputs.release_mode }}
          release_version: ${{ needs.admit.outputs.version }}
          release_source_sha: ${{ needs.admit.outputs.source_sha }}
          expected_tag_object_sha: ${{ needs.admit.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.admit.outputs.tag_commit_sha }}

      - name: Authenticate to fixed private OCI registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_TOKEN: ${{ secrets.registry_token }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "${REGISTRY_TOKEN}" \
            | buildah login \
                --authfile "${REGISTRY_AUTH_FILE}" \
                --username "${REGISTRY_USERNAME}" \
                --password-stdin \
                "${REGISTRY}"
          test -s "${REGISTRY_AUTH_FILE}"
          chmod 0600 "${REGISTRY_AUTH_FILE}"

          printf '%s' "${REGISTRY_TOKEN}" \
            | "${HELM_BIN}" registry login "${REGISTRY}" \
                --registry-config "${HELM_REGISTRY_CONFIG}" \
                --username "${REGISTRY_USERNAME}" \
                --password-stdin
          test -s "${HELM_REGISTRY_CONFIG}"
          chmod 0600 "${HELM_REGISTRY_CONFIG}"

      - id: image
        name: Build publish and verify exact-tag image
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.image_reference }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          set -Eeuo pipefail
          buildah_cmd=(
            buildah
            --storage-driver vfs
            --root "${CONTAINER_STORAGE_ROOT}"
            --runroot "${CONTAINER_RUN_ROOT}"
          )
          local_manifest="localhost/central-tag-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:manifest"
          source_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          "${buildah_cmd[@]}" manifest rm "${local_manifest}" >/dev/null 2>&1 || true
          "${buildah_cmd[@]}" manifest create "${local_manifest}" >/dev/null

          for architecture in amd64 arm64; do
            "${buildah_cmd[@]}" bud \
              --isolation chroot \
              --format oci \
              --platform "linux/${architecture}" \
              --manifest "${local_manifest}" \
              --timestamp "${source_epoch}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              -f "${DOCKERFILE_PATH}" \
              "${BUILD_CONTEXT}"
          done

          "${buildah_cmd[@]}" manifest push --all \
            "${local_manifest}" \
            "oci:${OCI_LAYOUT}:${VERSION}"
          local_raw="${STATE_ROOT}/image-local-index.json"
          skopeo inspect --raw \
            "oci:${OCI_LAYOUT}:${VERSION}" > "${local_raw}"

          image_repository="${IMAGE_REFERENCE%:${VERSION}}"
          test "${image_repository}:${VERSION}" = "${IMAGE_REFERENCE}"
          remote_tags="${STATE_ROOT}/image-remote-tags.json"
          skopeo list-tags \
            --authfile "${REGISTRY_AUTH_FILE}" \
            "docker://${image_repository}" > "${remote_tags}"
          remote_exists="$(
            REMOTE_TAGS="${remote_tags}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["REMOTE_TAGS"]).read_text(encoding="utf-8")
          )
          tags = payload.get("Tags") if isinstance(payload, dict) else None
          if not isinstance(tags, list) or not all(
              isinstance(tag, str) for tag in tags
          ):
              raise SystemExit("registry tag listing is invalid")
          print("true" if os.environ["VERSION"] in tags else "false")
          PY
          )"

          remote_raw="${STATE_ROOT}/image-remote-index.json"
          if [[ "${remote_exists}" == "false" ]]; then
            skopeo copy --all \
              --authfile "${REGISTRY_AUTH_FILE}" \
              "oci:${OCI_LAYOUT}:${VERSION}" \
              "docker://${IMAGE_REFERENCE}"
          else
            test "${remote_exists}" = "true"
          fi
          skopeo inspect --raw \
            --authfile "${REGISTRY_AUTH_FILE}" \
            "docker://${IMAGE_REFERENCE}" > "${remote_raw}"
          remote_digest="sha256:$(sha256sum "${remote_raw}" | awk '{print $1}')"

          LOCAL_RAW="${local_raw}" REMOTE_RAW="${remote_raw}" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          expected = {("linux", "amd64"), ("linux", "arm64")}
          platform_indexes = {}

          for source in ("LOCAL_RAW", "REMOTE_RAW"):
              manifest = json.loads(
                  Path(os.environ[source]).read_text(encoding="utf-8")
              )
              items = manifest.get("manifests")
              if not isinstance(items, list):
                  raise SystemExit(f"{source.lower()} image index has no manifest list")
              platforms = {}
              for item in items:
                  platform = item.get("platform") if isinstance(item, dict) else None
                  if not isinstance(platform, dict):
                      raise SystemExit(
                          f"{source.lower()} image index has an invalid platform entry"
                      )
                  identity = (platform.get("os"), platform.get("architecture"))
                  if identity in platforms:
                      raise SystemExit(
                          f"{source.lower()} image has duplicate platform {identity}"
                      )
                  platforms[identity] = platform
              if len(platforms) != len(expected) or set(platforms) != expected:
                  raise SystemExit(
                      f"{source.lower()} image platforms {set(platforms)} "
                      f"do not equal {expected}"
                  )
              platform_indexes[source] = platforms
          if platform_indexes["LOCAL_RAW"] != platform_indexes["REMOTE_RAW"]:
              raise SystemExit("remote image platform metadata differs from local")
          if (
              platform_indexes["REMOTE_RAW"][("linux", "arm64")].get("variant")
              != "v8"
          ):
              raise SystemExit("remote linux/arm64 image variant is not v8")
          PY

          for architecture in amd64 arm64; do
            local_config="${STATE_ROOT}/image-local-${architecture}-config.json"
            remote_config="${STATE_ROOT}/image-remote-${architecture}-config.json"
            skopeo inspect \
              --override-os linux \
              --override-arch "${architecture}" \
              --config \
              --raw \
              "oci:${OCI_LAYOUT}:${VERSION}" > "${local_config}"
            skopeo inspect \
              --authfile "${REGISTRY_AUTH_FILE}" \
              --override-os linux \
              --override-arch "${architecture}" \
              --config \
              --raw \
              "docker://${IMAGE_REFERENCE}" > "${remote_config}"
            test -s "${local_config}"
            test -s "${remote_config}"
            if ! cmp -s "${local_config}" "${remote_config}"; then
              echo "Remote ${architecture} image config does not match the local build." >&2
              exit 1
            fi
            REMOTE_CONFIG="${remote_config}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path(os.environ["REMOTE_CONFIG"]).read_text(encoding="utf-8")
          )
          labels = config.get("config", {}).get("Labels", {})
          expected = {
              "org.opencontainers.image.source": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              ),
              "org.opencontainers.image.revision": os.environ["SOURCE_SHA"],
              "org.opencontainers.image.version": os.environ["VERSION"],
          }
          mismatches = {
              key: value
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"remote image labels do not match: {mismatches}")
          PY
          done

          {
            printf 'reference=%s\n' "${IMAGE_REFERENCE}"
            printf 'digest=%s\n' "${remote_digest}"
            printf 'replayed=%s\n' "${remote_exists}"
          } >> "${GITHUB_OUTPUT}"

      - id: chart
        name: Package publish and verify exact-tag Helm chart
        shell: bash
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_REFERENCE: ${{ steps.release.outputs.chart_reference }}
        run: |
          set -Eeuo pipefail
          "${HELM_BIN}" lint "${CHART_SOURCE}"
          render="${STATE_ROOT}/chart-render.yaml"
          "${HELM_BIN}" template "${CHART_NAME}" "${CHART_SOURCE}" \
            --namespace "${CHART_NAME}" \
            --set-string image.tag="${VERSION}" \
            > "${render}"
          if grep -Eq '(^|[^A-Za-z0-9_.-])latest([^A-Za-z0-9_.-]|$)' "${render}"; then
            echo "Rendered chart contains forbidden latest identity" >&2
            exit 1
          fi

          "${HELM_BIN}" package "${CHART_SOURCE}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination "${CHART_LOCAL}" >/dev/null
          package="${CHART_LOCAL}/${CHART_NAME}-${VERSION}.tgz"
          test -s "${package}"
          local_dependency_entries="$(
            tar -tzf "${package}" \
              | grep -Ec "^${CHART_NAME}/charts/[^/]+\\.tgz$" \
              || true
          )"
          test "${local_dependency_entries}" -eq "${CHART_DEPENDENCY_COUNT}"
          local_sha="$(sha256sum "${package}" | awk '{print $1}')"

          metadata="${STATE_ROOT}/chart-local-metadata.yaml"
          "${HELM_BIN}" show chart "${package}" > "${metadata}"
          grep -Fqx "name: ${CHART_NAME}" "${metadata}"
          grep -Fqx "version: ${VERSION}" "${metadata}"
          grep -Eq "^appVersion: ['\"]?${VERSION}['\"]?$" "${metadata}"

          remote_package="${CHART_REMOTE}/${CHART_NAME}-${VERSION}.tgz"
          chart_repository="${REGISTRY}/${CHART_NAMESPACE}/${CHART_NAME}"
          chart_tags="${STATE_ROOT}/chart-remote-tags.json"
          skopeo list-tags \
            --authfile "${REGISTRY_AUTH_FILE}" \
            "docker://${chart_repository}" > "${chart_tags}"
          remote_exists="$(
            REMOTE_TAGS="${chart_tags}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["REMOTE_TAGS"]).read_text(encoding="utf-8")
          )
          tags = payload.get("Tags") if isinstance(payload, dict) else None
          if not isinstance(tags, list) or not all(
              isinstance(tag, str) for tag in tags
          ):
              raise SystemExit("registry chart tag listing is invalid")
          if tags.count(os.environ["VERSION"]) > 1:
              raise SystemExit("registry chart tag listing contains a duplicate")
          print("true" if os.environ["VERSION"] in tags else "false")
          PY
          )"
          if [[ "${remote_exists}" == "false" ]]; then
            "${HELM_BIN}" push "${package}" \
              "oci://${REGISTRY}/${CHART_NAMESPACE}" \
              --registry-config "${HELM_REGISTRY_CONFIG}"
            post_push_tags="${STATE_ROOT}/chart-post-push-tags.json"
            skopeo list-tags \
              --authfile "${REGISTRY_AUTH_FILE}" \
              "docker://${chart_repository}" > "${post_push_tags}"
            POST_PUSH_TAGS="${post_push_tags}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["POST_PUSH_TAGS"]).read_text(encoding="utf-8")
          )
          tags = payload.get("Tags") if isinstance(payload, dict) else None
          if not isinstance(tags, list) or not all(
              isinstance(tag, str) for tag in tags
          ):
              raise SystemExit("post-push chart tag listing is invalid")
          if tags.count(os.environ["VERSION"]) != 1:
              raise SystemExit("published chart tag is absent or duplicated")
          PY
          else
            test "${remote_exists}" = "true"
          fi

          "${HELM_BIN}" pull "${CHART_REFERENCE}" \
            --version "${VERSION}" \
            --destination "${CHART_REMOTE}" \
            --registry-config "${HELM_REGISTRY_CONFIG}"
          test -s "${remote_package}"
          test "$(sha256sum "${remote_package}" | awk '{print $1}')" = "${local_sha}"

          chart_manifest="${STATE_ROOT}/chart-remote-manifest.json"
          skopeo inspect --raw \
            --authfile "${REGISTRY_AUTH_FILE}" \
            "docker://${chart_repository}:${VERSION}" > "${chart_manifest}"
          CHART_MANIFEST="${chart_manifest}" \
          LOCAL_CHART_SHA="${local_sha}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["CHART_MANIFEST"]).read_text(encoding="utf-8")
          )
          config = manifest.get("config") if isinstance(manifest, dict) else None
          layers = manifest.get("layers") if isinstance(manifest, dict) else None
          if not isinstance(config, dict) or config.get("mediaType") != (
              "application/vnd.cncf.helm.config.v1+json"
          ):
              raise SystemExit("remote chart config descriptor is invalid")
          if not isinstance(layers, list) or len(layers) != 1:
              raise SystemExit("remote chart must have exactly one content layer")
          layer = layers[0]
          if not isinstance(layer, dict) or layer.get("mediaType") != (
              "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          ):
              raise SystemExit("remote chart content layer type is invalid")
          if layer.get("digest") != f"sha256:{os.environ['LOCAL_CHART_SHA']}":
              raise SystemExit("remote chart content layer digest differs")
          PY

          chart_digest="sha256:$(sha256sum "${chart_manifest}" | awk '{print $1}')"
          [[ "${chart_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          remote_dependency_entries="$(
            tar -tzf "${remote_package}" \
              | grep -Ec "^${CHART_NAME}/charts/[^/]+\\.tgz$" \
              || true
          )"
          test "${remote_dependency_entries}" -eq "${CHART_DEPENDENCY_COUNT}"

          remote_metadata="${STATE_ROOT}/chart-remote-metadata.yaml"
          "${HELM_BIN}" show chart "${remote_package}" > "${remote_metadata}"
          grep -Fqx "name: ${CHART_NAME}" "${remote_metadata}"
          grep -Fqx "version: ${VERSION}" "${remote_metadata}"
          grep -Eq "^appVersion: ['\"]?${VERSION}['\"]?$" "${remote_metadata}"

          {
            printf 'reference=%s:%s\n' "${CHART_REFERENCE}" "${VERSION}"
            printf 'digest=%s\n' "${chart_digest}"
            printf 'package_sha256=%s\n' "${local_sha}"
            printf 'replayed=%s\n' "${remote_exists}"
          } >> "${GITHUB_OUTPUT}"

      - name: Confirm zero Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          count = int(payload.get("total_count", 0))
          if count:
              raise SystemExit(f"release uploaded {count} unexpected artifact(s)")
          print("Exact-tag release artifact policy passed: zero artifacts.")
          PY

      - name: Summarize immutable publication
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPLAYED: ${{ steps.image.outputs.replayed }}
          CHART_REFERENCE: ${{ steps.chart.outputs.reference }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          CHART_PACKAGE_SHA: ${{ steps.chart.outputs.package_sha256 }}
          CHART_REPLAYED: ${{ steps.chart.outputs.replayed }}
        run: |
          set -Eeuo pipefail
          {
            echo "## Exact-tag image and chart publication"
            echo
            echo "- Tag/version: \`${VERSION}\`"
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Image digest: \`${IMAGE_DIGEST}\`"
            echo "- Image replayed: \`${IMAGE_REPLAYED}\`"
            echo "- Chart: \`${CHART_REFERENCE}\`"
            echo "- Chart OCI digest: \`${CHART_DIGEST}\`"
            echo "- Chart package SHA-256: \`${CHART_PACKAGE_SHA}\`"
            echo "- Chart replayed: \`${CHART_REPLAYED}\`"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
            echo "- Actions artifacts: zero"
            echo "- Deployment/rollout: not performed"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean publication credentials and state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          run_token="$(
            RUNROOT_KIND=central-tag-release-containers python3 - <<'PY_RUNROOT'
          import hashlib
          import os

          material = ":".join(
              (
                  os.environ["GITHUB_RUN_ID"],
                  os.environ["GITHUB_RUN_ATTEMPT"],
                  os.environ["RUNROOT_KIND"],
              )
          )
          print(hashlib.sha256(material.encode("utf-8")).hexdigest()[:12])
          PY_RUNROOT
          )"
          run_root="${CONTAINER_RUN_ROOT:-${RUNNER_TEMP}/r/${run_token}}"
          storage_root="${CONTAINER_STORAGE_ROOT:-${RUNNER_TEMP}/central-tag-release/containers/storage}"
          registry_auth="${REGISTRY_AUTH_FILE:-${RUNNER_TEMP}/central-tag-release/auth/containers.json}"
          helm_auth="${HELM_REGISTRY_CONFIG:-${RUNNER_TEMP}/central-tag-release/auth/helm.json}"
          buildah_cmd=(
            buildah
            --storage-driver vfs
            --root "${storage_root}"
            --runroot "${run_root}"
          )

          if command -v buildah >/dev/null 2>&1; then
            "${buildah_cmd[@]}" rm --all >/dev/null 2>&1 || cleanup_failed=1
            "${buildah_cmd[@]}" rmi --all --force >/dev/null 2>&1 || cleanup_failed=1
            buildah logout --authfile "${registry_auth}" "${REGISTRY}" >/dev/null 2>&1 || true
            [[ -z "$("${buildah_cmd[@]}" containers -q 2>/dev/null)" ]] || cleanup_failed=1
            [[ -z "$("${buildah_cmd[@]}" images -q 2>/dev/null)" ]] || cleanup_failed=1
          fi
          if [[ -x "${HELM_BIN:-}" && -s "${helm_auth}" ]]; then
            "${HELM_BIN}" registry logout "${REGISTRY}" \
              --registry-config "${helm_auth}" >/dev/null 2>&1 || cleanup_failed=1
          fi

          rm -rf \
            "${STATE_ROOT:-${RUNNER_TEMP}/central-tag-release}" \
            "${RUNNER_TEMP}/central-tag-release-helm-bin" \
            "${run_root}" || cleanup_failed=1
          for path in \
            "${STATE_ROOT:-${RUNNER_TEMP}/central-tag-release}" \
            "${RUNNER_TEMP}/central-tag-release-helm-bin" \
            "${run_root}"; do
            [[ ! -e "${path}" ]] || cleanup_failed=1
          done
          exit "${cleanup_failed}"
