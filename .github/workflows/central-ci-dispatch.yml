      - cluster_inspector
      - maven
      - apple_binary
      - apple_swiftpm
      - library_package_release
      - public_native_image_chart
      - oci_reproducibility
      - ci_cancel
      - branch_delete
    if: >-
      ${{
        always() &&
        (
          needs.request.result != 'success' ||
          needs.repository.result == 'cancelled' ||
          needs.repository.result == 'failure' ||
          needs.repository_release.result == 'cancelled' ||
          needs.repository_release.result == 'failure' ||
          needs.apple_release.result == 'cancelled' ||
          needs.apple_release.result == 'failure' ||
          needs.android.result == 'cancelled' ||
          needs.android.result == 'failure' ||
          needs.android_release.result == 'cancelled' ||
          needs.android_release.result == 'failure' ||
          needs.cluster_inspector.result == 'cancelled' ||
          needs.cluster_inspector.result == 'failure' ||
          needs.maven.result == 'cancelled' ||
          needs.maven.result == 'failure' ||
          needs.apple_binary.result == 'cancelled' ||
          needs.apple_binary.result == 'failure' ||
          needs.apple_swiftpm.result == 'cancelled' ||
          needs.apple_swiftpm.result == 'failure' ||
          needs.library_package_release.result == 'cancelled' ||
          needs.library_package_release.result == 'failure' ||
          needs.public_native_image_chart.result == 'cancelled' ||
          needs.public_native_image_chart.result == 'failure' ||
          needs.oci_reproducibility.result == 'cancelled' ||
          needs.oci_reproducibility.result == 'failure' ||
          needs.ci_cancel.result == 'cancelled' ||
          needs.ci_cancel.result == 'failure' ||
          needs.branch_delete.result == 'cancelled' ||
          needs.branch_delete.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Central helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Settle cancelled Agent State run
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: cancel-if-active
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ (job.status == 'cancelled' || contains(needs.*.result, 'cancelled')) && 'cancelled' || 'failed' }}
          error_summary: >-
            ${{ needs.request.result == 'failure'
                && 'Central dispatch request failed before hosted execution completed.'
                || ((job.status == 'cancelled' || contains(needs.*.result, 'cancelled'))
                    && 'Central hosted execution was cancelled before terminal settlement.'
                    || 'Central hosted execution failed before terminal settlement.') }}
