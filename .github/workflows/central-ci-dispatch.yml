name: Central CI dispatch

"on":
  workflow_dispatch:
    inputs:
      active_key:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.claim.outputs.repository }}
      ref: ${{ steps.claim.outputs.ref }}
      is_tag: ${{ steps.claim.outputs.is_tag }}
      workflow_key: ${{ steps.claim.outputs.workflow_key }}
      test_profile: ${{ steps.claim.outputs.test_profile }}
      inputs_json: ${{ steps.claim.outputs.inputs_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: claim
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: claim
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate Maven release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.maven' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = publish || {
            echo "release.maven supports only the publish profile" >&2
            exit 2
          }
          python3 - <<'PY'
          import json
          import os
          import re

          try:
              inputs = json.loads(os.environ["INPUTS_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("release.maven inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"build_number"}:
              raise SystemExit("release.maven requires exactly inputs.build_number")
          build_number = inputs["build_number"]
          if not isinstance(build_number, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", build_number):
              raise SystemExit("release.maven build_number must be one non-empty bounded release identifier")
          PY

      - name: Validate container service request
        if: ${{ steps.claim.outputs.workflow_key == 'validation.container-service' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = conformance || {
            echo "validation.container-service supports only the conformance profile" >&2
            exit 2
          }
          python3 - <<'PY_VALIDATE'
          import json
          import os

          try:
              inputs = json.loads(os.environ["INPUTS_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("validation.container-service inputs must be one JSON object") from exc
          allowed = {"service_port", "dockerfile_path", "build_context"}
          if not isinstance(inputs, dict) or "service_port" not in inputs or not set(inputs) <= allowed:
              raise SystemExit("validation.container-service requires service_port and only bounded build-path inputs")
          port = inputs["service_port"]
          if isinstance(port, bool) or not isinstance(port, int) or not 1 <= port <= 65535:
              raise SystemExit("validation.container-service service_port must be an integer from 1 through 65535")
          for key in ("dockerfile_path", "build_context"):
              if key not in inputs:
                  continue
              value = inputs[key]
              if not isinstance(value, str) or not value or len(value) > 240 or "\\" in value or "\x00" in value:
                  raise SystemExit(f"validation.container-service {key} is invalid")
          PY_VALIDATE

      - name: Validate branch deletion request
        if: ${{ steps.claim.outputs.workflow_key == 'maintenance.branch-delete' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REQUEST_IS_TAG: ${{ steps.claim.outputs.is_tag }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = delete || {
            echo "maintenance.branch-delete supports only the delete profile" >&2
            exit 2
          }
          test "${REQUEST_IS_TAG}" = false || {
            echo "maintenance.branch-delete does not accept tag requests" >&2
            exit 2
          }
          python3 - <<'PY_VALIDATE_BRANCH_DELETE'
          import json
          import os
          import re

          try:
              inputs = json.loads(os.environ["INPUTS_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("maintenance.branch-delete inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"expected_head"}:
              raise SystemExit("maintenance.branch-delete requires exactly inputs.expected_head")
          expected_head = inputs["expected_head"]
          if not isinstance(expected_head, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_head):
              raise SystemExit("maintenance.branch-delete expected_head must be one lowercase 40-character Git SHA")
          PY_VALIDATE_BRANCH_DELETE

      - name: Validate Apple release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.apple' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = testflight || {
            echo "release.apple supports only the testflight profile" >&2
            exit 2
          }
          python3 - <<'PY'
          import json
          import os
          import re

          try:
              inputs = json.loads(os.environ["INPUTS_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("release.apple inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"build_number"}:
              raise SystemExit("release.apple requires exactly inputs.build_number")
          build_number = inputs["build_number"]
          if not isinstance(build_number, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", build_number):
              raise SystemExit("release.apple build_number must be one non-empty bounded release identifier")
          PY

  apple:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.apple' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/apple.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      source_is_tag: ${{ needs.request.outputs.is_tag == 'true' }}
      test_profile: ${{ needs.request.outputs.test_profile }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  apple_release:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'release.apple' && needs.request.outputs.test_profile == 'testflight' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/apple.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      source_is_tag: ${{ needs.request.outputs.is_tag == 'true' }}
      test_profile: testflight
      build_number: ${{ fromJSON(needs.request.outputs.inputs_json).build_number }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  android:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.android' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/android.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      test_profile: ${{ needs.request.outputs.test_profile }}
      project_directory: ${{ fromJSON(needs.request.outputs.inputs_json).project_directory || '.' }}
      test_filter: ${{ fromJSON(needs.request.outputs.inputs_json).test_filter || '' }}
      room_schema: ${{ fromJSON(needs.request.outputs.inputs_json).room_schema || false }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  python:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.python' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/python.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      test_profile: ${{ needs.request.outputs.test_profile }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  node:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.node' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/node.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      test_profile: ${{ needs.request.outputs.test_profile }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  flutter:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.flutter' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/flutter.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      test_profile: ${{ needs.request.outputs.test_profile }}
      flutter_version: ${{ fromJSON(needs.request.outputs.inputs_json).flutter_version || '3.44.6' }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  maven:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'release.maven' && needs.request.outputs.test_profile == 'publish' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/maven.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      build_number: ${{ fromJSON(needs.request.outputs.inputs_json).build_number }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  container_service:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.container-service' && needs.request.outputs.test_profile == 'conformance' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/container-service.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      service_port: ${{ fromJSON(needs.request.outputs.inputs_json).service_port }}
      dockerfile_path: ${{ fromJSON(needs.request.outputs.inputs_json).dockerfile_path || 'Dockerfile' }}
      build_context: ${{ fromJSON(needs.request.outputs.inputs_json).build_context || '.' }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  public_native_image_chart:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'release.public-native-image-chart' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/public-native-image-chart.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      image_name: ${{ fromJSON(needs.request.outputs.inputs_json).image_name }}
      chart_name: ${{ fromJSON(needs.request.outputs.inputs_json).chart_name }}
      chart_path: ${{ fromJSON(needs.request.outputs.inputs_json).chart_path }}
      dockerfile_path: ${{ fromJSON(needs.request.outputs.inputs_json).dockerfile_path }}
      build_context: ${{ fromJSON(needs.request.outputs.inputs_json).build_context }}
      publish_latest_image: ${{ fromJSON(needs.request.outputs.inputs_json).publish_latest_image }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  oci_reproducibility:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'oci.reproducibility' }}
    concurrency:
      group: central-ci-${{ inputs.active_key }}
      cancel-in-progress: true
    uses: ./.github/workflows/oci-reproducibility.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      ref: ${{ needs.request.outputs.ref }}
      dockerfile_path: ${{ fromJSON(needs.request.outputs.inputs_json).dockerfile_path }}
      build_context: ${{ fromJSON(needs.request.outputs.inputs_json).build_context }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  branch_delete:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'maintenance.branch-delete' && needs.request.outputs.test_profile == 'delete' }}
    concurrency:
      group: central-ci-maintenance-${{ inputs.active_key }}
      cancel-in-progress: false
    uses: ./.github/workflows/branch-delete.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      branch: ${{ needs.request.outputs.ref }}
      expected_head: ${{ fromJSON(needs.request.outputs.inputs_json).expected_head }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit

  source_snapshot:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'source.snapshot' }}
    concurrency:
      group: central-ci-snapshot-${{ inputs.active_key }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Central helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark Agent State run as running
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Resolve durable Drive repository folder
        id: drive_repository
        shell: bash
        run: |
          set -Eeuo pipefail
          folder_id="$(python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/AGENTS.md")
          if not path.is_file():
              print("")
              raise SystemExit(0)
          match = re.search(
              r"(?m)^- Google Drive repository folder ID: `([^`]+)`\s*$",
              path.read_text(encoding="utf-8"),
          )
          print(match.group(1) if match else "")
          PY
          )"
          printf 'folder_id=%s\n' "${folder_id}" >> "${GITHUB_OUTPUT}"

      - name: Create exact tracked-source snapshot
        id: snapshot
        shell: bash
        env:
          REQUESTED_REPOSITORY: ${{ needs.request.outputs.repository }}
          REQUESTED_REF: ${{ needs.request.outputs.ref }}
          REQUESTED_IS_TAG: ${{ needs.request.outputs.is_tag }}
          OBSERVED_SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          source_sha="${OBSERVED_SOURCE_SHA}"
          tree_sha="$(git -C source rev-parse 'HEAD^{tree}')"
          archive="${RUNNER_TEMP}/source.zip"
          manifest="${RUNNER_TEMP}/manifest.json"
          git -C source archive --format=zip --output="${archive}" HEAD
          archive_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          archive_size="$(wc -c < "${archive}" | tr -d '[:space:]')"
          python3 - "${manifest}" "${REQUESTED_REPOSITORY}" "${REQUESTED_REF}" "${REQUESTED_IS_TAG}" "${source_sha}" "${tree_sha}" "${archive_sha256}" "${archive_size}" <<'PY'
          from pathlib import Path
          import json, sys
          path, repository, ref, is_tag, source_sha, tree_sha, digest, size = sys.argv[1:]
          value = {
              "repository": repository,
              "repository_name": repository.rsplit("/", 1)[-1],
              "requested_ref": ref,
              "is_tag": is_tag == "true",
              "resolved_source_sha": source_sha,
              "tree_sha": tree_sha,
              "archive_format": "zip",
              "archive_format_version": 1,
              "source_zip_sha256": digest,
              "source_zip_size_bytes": int(size),
          }
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          {
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'tree_sha=%s\n' "${tree_sha}"
            printf 'archive_sha256=%s\n' "${archive_sha256}"
            printf 'archive_size=%s\n' "${archive_size}"
            printf 'archive=%s\n' "${archive}"
            printf 'manifest=%s\n' "${manifest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload source.zip
        id: source_upload
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.ref }}
          repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
          file_path: ${{ steps.snapshot.outputs.archive }}
          file_name: source.zip
          mime_type: application/zip

      - name: Write first manifest with source Drive identity
        shell: bash
        env:
          MANIFEST: ${{ steps.snapshot.outputs.manifest }}
          SOURCE_FILE_ID: ${{ steps.source_upload.outputs.file_id }}
          FOLDER_ID: ${{ steps.source_upload.outputs.folder_id }}
        run: |
          set -Eeuo pipefail
          python3 - "${MANIFEST}" "${SOURCE_FILE_ID}" "${FOLDER_ID}" <<'PY'
          from pathlib import Path
          import json, sys
          path, source_file_id, folder_id = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding="utf-8"))
          value["source_zip_file_id"] = source_file_id
          value["folder_id"] = folder_id
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Create manifest.json
        id: manifest_create
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.ref }}
          repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
          file_path: ${{ steps.snapshot.outputs.manifest }}
          file_name: manifest.json
          mime_type: application/json

      - name: Add stable manifest Drive identity
        shell: bash
        env:
          MANIFEST: ${{ steps.snapshot.outputs.manifest }}
          MANIFEST_FILE_ID: ${{ steps.manifest_create.outputs.file_id }}
        run: |
          set -Eeuo pipefail
          python3 - "${MANIFEST}" "${MANIFEST_FILE_ID}" <<'PY'
          from pathlib import Path
          import json, sys
          path, manifest_file_id = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding="utf-8"))
          value["manifest_file_id"] = manifest_file_id
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Update manifest.json in place
        id: manifest_update
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.ref }}
          repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
          file_path: ${{ steps.snapshot.outputs.manifest }}
          file_name: manifest.json
          mime_type: application/json

      - name: Verify stable manifest identity
        shell: bash
        env:
          CREATED_ID: ${{ steps.manifest_create.outputs.file_id }}
          UPDATED_ID: ${{ steps.manifest_update.outputs.file_id }}
          CREATED_FOLDER: ${{ steps.manifest_create.outputs.folder_id }}
          UPDATED_FOLDER: ${{ steps.manifest_update.outputs.folder_id }}
        run: |
          set -Eeuo pipefail
          test "${CREATED_ID}" = "${UPDATED_ID}"
          test "${CREATED_FOLDER}" = "${UPDATED_FOLDER}"

      - name: Clean snapshot workspace
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf source
          rm -f "${RUNNER_TEMP}/source.zip" "${RUNNER_TEMP}/manifest.json"

      - name: Finish Agent State run
        if: ${{ always() }}
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ job.status == 'success' && 'succeeded' || job.status == 'cancelled' && 'cancelled' || 'failed' }}

  settle_cancelled:
    needs:
      - request
      - apple
      - apple_release
      - android
      - python
      - node
      - flutter
      - maven
      - container_service
      - public_native_image_chart
      - oci_reproducibility
      - branch_delete
      - source_snapshot
    if: >-
      ${{
        always() &&
        (
          needs.request.result != 'success' ||
          needs.apple.result == 'cancelled' ||
          needs.apple_release.result == 'cancelled' ||
          needs.android.result == 'cancelled' ||
          needs.python.result == 'cancelled' ||
          needs.node.result == 'cancelled' ||
          needs.flutter.result == 'cancelled' ||
          needs.maven.result == 'cancelled' ||
          needs.container_service.result == 'cancelled' ||
          needs.public_native_image_chart.result == 'cancelled' ||
          needs.oci_reproducibility.result == 'cancelled' ||
          needs.branch_delete.result == 'cancelled' ||
          needs.source_snapshot.result == 'cancelled'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Central helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Settle cancelled Agent State run
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: cancel-if-active
          ci_run_id: ${{ inputs.ci_run_id }}
