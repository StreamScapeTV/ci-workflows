# LEGACY_MIGRATION_RESIDUE: Concrete consumer identity below is retained only for still-live compatibility; do not add new identity-coupled behavior, and remove it only after the private migration ledger proves zero callers.
name: Central CI dispatch

run-name: Central CI dispatch ${{ inputs.ci_run_id }}

"on":
  workflow_dispatch:
    inputs:
      active_key:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.claim.outputs.repository }}
      ref: ${{ steps.claim.outputs.ref }}
      is_tag: ${{ steps.claim.outputs.is_tag }}
      workflow_key: ${{ steps.claim.outputs.workflow_key }}
      test_profile: ${{ steps.claim.outputs.test_profile }}
      inputs_json: ${{ steps.tag_release.outputs.inputs_json || steps.claim.outputs.inputs_json }}
      release_version: ${{ steps.tag_release.outputs.release_version }}
      validation_concurrency_key: ${{ steps.validation_lane.outputs.concurrency_key }}
      validation_cancel_in_progress: ${{ steps.validation_lane.outputs.cancel_in_progress }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: claim
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: claim
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Resolve bounded validation concurrency lane
        id: validation_lane
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.claim.outputs.repository }}
          SOURCE_REF: ${{ steps.claim.outputs.ref }}
          SOURCE_IS_TAG: ${{ steps.claim.outputs.is_tag }}
          WORKFLOW_KEY: ${{ steps.claim.outputs.workflow_key }}
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
        run: |
          set -Eeuo pipefail
          case "${SOURCE_IS_TAG}" in
            true) source_namespace=refs/tags ;;
            false) source_namespace=refs/heads ;;
            *) echo "Central validation concurrency requires source_is_tag=true or false" >&2; exit 2 ;;
          esac
          git check-ref-format "${source_namespace}/${SOURCE_REF}" >/dev/null || {
            echo "Central validation concurrency requires one valid bounded source ref" >&2
            exit 2
          }
          python3 - <<'PY_VALIDATION_CONCURRENCY'
          from pathlib import Path
          import hashlib
          import os
          import re

          repository = os.environ.get("SOURCE_REPOSITORY", "")
          ref = os.environ.get("SOURCE_REF", "")
          is_tag = os.environ.get("SOURCE_IS_TAG", "")
          workflow = os.environ.get("WORKFLOW_KEY", "")
          profile = os.environ.get("TEST_PROFILE", "")

          repository_pattern = re.compile(r"[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}")
          lane_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}")
          if repository_pattern.fullmatch(repository) is None:
              raise SystemExit("Central validation concurrency repository is outside the reviewed bound")
          if not 1 <= len(ref) <= 255 or any(ord(ch) < 32 or ord(ch) == 127 for ch in ref):
              raise SystemExit("Central validation concurrency ref is outside the reviewed bound")
          if lane_pattern.fullmatch(workflow) is None or lane_pattern.fullmatch(profile) is None:
              raise SystemExit("Central validation concurrency workflow/profile is outside the reviewed bound")
          if is_tag not in {"true", "false"}:
              raise SystemExit("Central validation concurrency source kind is invalid")

          # Keep cheap lint/cache builds outside the required acceptance lane.
          # A moving branch still supersedes obsolete runs within its own lane.
          ordinary_profiles = {
              "validation.repository": frozenset(("lint", "build", "test", "full", "ui-test")),
          }
          cancel_in_progress = (
              is_tag == "false" and profile in ordinary_profiles.get(workflow, ())
          )
          if cancel_in_progress and profile in {"lint", "build"}:
              material = ("central-lightweight-branch-v1", repository, ref, profile)
          elif cancel_in_progress:
              material = ("central-ordinary-branch-validation-v2", repository, ref)
          else:
              # Preserve per-profile, non-cancelling serialization for physical
              # devices, tag operations, inspection and infrastructure. Two
              # physical runs on one branch must not overlap on one device.
              material = (
                  "central-validation-lane-v1", repository, ref, is_tag,
                  workflow, profile,
              )
          concurrency_key = hashlib.sha256("\0".join(material).encode("utf-8")).hexdigest()
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"concurrency_key={concurrency_key}\n")
              output.write(
                  f"cancel_in_progress={'true' if cancel_in_progress else 'false'}\n"
              )
          PY_VALIDATION_CONCURRENCY

      - name: Reject retired legacy validation workflow
        if: >-
          ${{
            steps.claim.outputs.workflow_key == 'validation.node' ||
            steps.claim.outputs.workflow_key == 'validation.flutter' ||
            steps.claim.outputs.workflow_key == 'validation.container-service' ||
            steps.claim.outputs.workflow_key == 'validation.python' ||
            steps.claim.outputs.workflow_key == 'validation.apple'
          }}
        shell: bash
        run: |
          echo "legacy validation workflow is retired; use validation.repository with the repository-owned .ci entrypoint" >&2
          exit 2

      - name: Validate retained legacy validation profile
        if: >-
          ${{ steps.claim.outputs.workflow_key == 'validation.android' }}
        shell: bash
        env:
          WORKFLOW_KEY: ${{ steps.claim.outputs.workflow_key }}
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
        run: |
          set -Eeuo pipefail
          case "${WORKFLOW_KEY}/${TEST_PROFILE}" in
            validation.android/physical-performance)
              ;;
            validation.android/*)
              echo "retired Android validation profile; use validation.repository for ordinary build/test/full/UI work" >&2
              exit 2
              ;;
          esac

      - name: Validate cluster inspection request
        if: ${{ steps.claim.outputs.workflow_key == 'inspection.cluster' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REQUEST_IS_TAG: ${{ steps.claim.outputs.is_tag }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_IS_TAG}" = false || {
            echo "inspection.cluster accepts branch source only" >&2
            exit 2
          }
          case "${TEST_PROFILE}" in
            longhorn|cnpg|flux) ;;
            *) echo "inspection.cluster supports only longhorn, cnpg, or flux" >&2; exit 2 ;;
          esac
          jq -e 'type == "object" and length == 0' <<<"${INPUTS_JSON}" >/dev/null || {
            echo "inspection.cluster accepts no semantic inputs" >&2
            exit 2
          }

      - name: Resolve tag-driven release identity
        id: tag_release
        if: >-
          ${{
            steps.claim.outputs.is_tag == 'true' &&
            (
              steps.claim.outputs.workflow_key == 'release.repository' ||
              steps.claim.outputs.workflow_key == 'release.android' ||
              steps.claim.outputs.workflow_key == 'release.apple' ||
              steps.claim.outputs.workflow_key == 'release.maven' ||
              steps.claim.outputs.workflow_key == 'release.library-package'
            )
          }}
        shell: bash
        env:
          WORKFLOW_KEY: ${{ steps.claim.outputs.workflow_key }}
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REQUEST_REF: ${{ steps.claim.outputs.ref }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_TAG_RELEASE'
          from pathlib import Path
          import json
          import os
          import re

          workflow = os.environ.get("WORKFLOW_KEY", "")
          profile = os.environ.get("TEST_PROFILE", "")
          ref = os.environ.get("REQUEST_REF", "")
          try:
              raw_inputs = json.loads(os.environ.get("INPUTS_JSON", "{}"))
          except json.JSONDecodeError as exc:
              raise SystemExit("tag-driven release inputs must be one JSON object") from exc
          if not isinstance(raw_inputs, dict):
              raise SystemExit("tag-driven release inputs must be one JSON object")
          if raw_inputs:
              raise SystemExit("tag-driven release accepts no semantic inputs; release identity comes only from the tag")

          normalized_inputs: dict[str, str] = {}
          release_version = ""
          mobile_pattern = re.compile(r"(?P<version>[0-9]+(?:\.[0-9]+){1,3})_(?P<build>[1-9][0-9]{0,9})")

          if workflow == "release.repository":
              if profile not in {"linux", "macos"}:
                  raise SystemExit("release.repository profile must be linux or macos")
              if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", ref) is None:
                  raise SystemExit("release.repository tag is outside the reviewed build_identity bound")
              semantic_inputs = json.dumps(
                  {"build_identity": ref, "release_kind": "publish"},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              normalized_inputs = {
                  "host_os": profile,
                  "semantic_inputs": semantic_inputs,
              }
          elif workflow == "release.android":
              if profile != "play":
                  raise SystemExit("release.android supports only the play profile")
              match = mobile_pattern.fullmatch(ref)
              if match is None:
                  raise SystemExit("release.android tag must match <marketing-version>_<positive-build> without a v prefix")
              release_version = match.group("version")
              build_number = match.group("build")
              if int(build_number) >= 2100000000:
                  raise SystemExit("release.android tag build must be below 2100000000 so the post-publication next versionCode remains valid")
              normalized_inputs = {"build_number": build_number}
          elif workflow == "release.apple":
              if profile == "testflight":
                  match = mobile_pattern.fullmatch(ref)
                  if match is None:
                      raise SystemExit("release.apple/testflight tag must match <marketing-version>_<positive-build> without a v prefix")
                  release_version = match.group("version")
                  build_number = match.group("build")
                  if int(build_number) >= 9999999999:
                      raise SystemExit("release.apple/testflight tag build must leave room for the next bounded build number")
                  normalized_inputs = {"build_number": build_number}
              elif profile in {"binary-package", "swiftpm-package"}:
                  normalized_inputs = {}
              else:
                  raise SystemExit("release.apple supports only testflight, binary-package and swiftpm-package profiles")
          elif workflow == "release.maven":
              if profile != "publish":
                  raise SystemExit("release.maven supports only the publish profile")
              if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", ref) is None:
                  raise SystemExit("release.maven tag must be one non-empty bounded release version")
              release_version = ref
              normalized_inputs = {"build_number": ref}
          elif workflow == "release.library-package":
              if profile != "publish":
                  raise SystemExit("release.library-package supports only the publish profile")
              if re.fullmatch(
                  r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
                  r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
                  r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?",
                  ref,
              ) is None:
                  raise SystemExit("release.library-package requires one plain semantic-version tag")
              release_version = ref
              normalized_inputs = {}
          else:
              raise SystemExit("unsupported tag-driven release workflow")

          normalized_json = json.dumps(normalized_inputs, sort_keys=True, separators=(",", ":"))
          Path(".central-tag-release-inputs.json").write_text(normalized_json + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"inputs_json={normalized_json}", file=output)
              print(f"release_version={release_version}", file=output)
          PY_TAG_RELEASE

      - name: Validate retained specialist validation request
        if: ${{ steps.claim.outputs.workflow_key == 'validation.android' }}
        shell: bash
        env:
          WORKFLOW_KEY: ${{ steps.claim.outputs.workflow_key }}
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REPOSITORY: ${{ steps.claim.outputs.repository }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_SPECIALIST_VALIDATION'
          import json, os, re
          workflow=os.environ.get("WORKFLOW_KEY","")
          profile=os.environ.get("TEST_PROFILE","")
          repository=os.environ.get("REPOSITORY","")
          try: inputs=json.loads(os.environ.get("INPUTS_JSON","{}"))
          except json.JSONDecodeError as exc: raise SystemExit("specialist validation inputs must be one JSON object") from exc
          if not isinstance(inputs,dict): raise SystemExit("specialist validation inputs must be one JSON object")
          if (workflow,profile)==("validation.android","physical-performance"):
              if repository!="StreamScapeTV/iptv-android" or inputs: raise SystemExit("Android physical-performance is fixed to iptv-android and accepts no semantic inputs")
          else:
              raise SystemExit("unsupported specialist validation profile")
          PY_SPECIALIST_VALIDATION

      - name: Validate generic repository-owned CI request
        if: ${{ steps.claim.outputs.workflow_key == 'validation.repository' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_VALIDATE_REPOSITORY'
          import json
          import os
          import re

          profile = os.environ.get("TEST_PROFILE", "")
          try:
              inputs = json.loads(os.environ.get("INPUTS_JSON", "{}"))
          except json.JSONDecodeError as exc:
              raise SystemExit("validation.repository inputs must be one JSON object") from exc
          if not isinstance(inputs, dict):
              raise SystemExit("validation.repository inputs must be one JSON object")
          if profile not in {"lint", "build", "test", "full", "ui-test", "device-test"}:
              raise SystemExit("validation.repository supports only lint, build, test, full, ui-test, or device-test")

          provider_operation_id = inputs.pop("provider_operation_id", None)
          if provider_operation_id is not None:
              if not isinstance(provider_operation_id, str) or re.fullmatch(
                  r"provider_[0-9a-f]{32}", provider_operation_id
              ) is None:
                  raise SystemExit(
                      "validation.repository provider_operation_id must match provider_<32 lowercase hex>"
                  )

          if set(inputs) - {"host_os", "semantic_inputs"} or "host_os" not in inputs:
              raise SystemExit("validation.repository accepts only host_os and semantic_inputs plus reserved provider_operation_id metadata")
          if inputs["host_os"] not in {"linux", "macos"}:
              raise SystemExit("validation.repository host_os must be linux or macos")

          raw = inputs.get("semantic_inputs", "{}")
          if not isinstance(raw, str) or len(raw.encode("utf-8")) > 2048:
              raise SystemExit("validation.repository semantic_inputs must be one bounded JSON string")
          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate semantic field: {key}")
                  result[key] = value
              return result

          try:
              semantic = json.loads(raw, object_pairs_hook=reject_duplicate_keys)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit("validation.repository semantic_inputs must encode one unambiguous JSON object") from exc
          if not isinstance(semantic, dict):
              raise SystemExit("validation.repository semantic_inputs must encode one JSON object")

          allowed = {
              "lint": {"product_target"},
              "build": {"product_target"},
              "test": {"product_target", "test_selectors"},
              "full": {"product_target"},
              "ui-test": {"product_target", "ui_mode", "test_selectors"},
              "device-test": {"device_platform", "test_selectors"},
          }[profile]
          if set(semantic) - allowed:
              raise SystemExit("validation.repository semantic_inputs contains an unknown field")

          target = semantic.get("product_target")
          if target is not None:
              if not isinstance(target, str) or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", target) is None:
                  raise SystemExit("validation.repository product_target is outside the reviewed bound")

          selectors = semantic.get("test_selectors")
          if selectors is not None:
              if profile not in {"test", "ui-test", "device-test"} or not isinstance(selectors, list) or len(selectors) > 64:
                  raise SystemExit("validation.repository test_selectors must be one bounded list for test, ui-test, or device-test")
              pattern = re.compile(r"[A-Za-z0-9_.$/:+#-]{1,240}")
              for selector in selectors:
                  if not isinstance(selector, str) or selector.startswith("-") or pattern.fullmatch(selector) is None:
                      raise SystemExit("validation.repository test_selectors contains an invalid selector")

          ui_mode = semantic.get("ui_mode")
          if ui_mode is not None:
              if (profile != "ui-test" or not isinstance(ui_mode, str)
                  or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", ui_mode) is None):
                  raise SystemExit("validation.repository ui_mode must be a product-owned identifier for ui-test")

          device_platform = semantic.get("device_platform")
          if profile == "device-test":
              if inputs["host_os"] != "macos":
                  raise SystemExit("validation.repository device-test requires host_os=macos")
              if device_platform != "ios" or not isinstance(selectors, list) or not selectors:
                  raise SystemExit("validation.repository device-test requires device_platform=ios and at least one bounded test selector")
          elif device_platform is not None:
              raise SystemExit("validation.repository device_platform is accepted only by device-test")
          PY_VALIDATE_REPOSITORY

      - name: Validate generic repository-owned release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.repository' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REQUEST_IS_TAG: ${{ steps.claim.outputs.is_tag }}
          REQUEST_REF: ${{ steps.claim.outputs.ref }}
          INPUTS_JSON: ${{ steps.tag_release.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_IS_TAG}" = true || {
            echo "release.repository requires an immutable tag source" >&2
            exit 2
          }
          case "${TEST_PROFILE}" in
            linux|macos) ;;
            *) echo "release.repository profile must be linux or macos" >&2; exit 2 ;;
          esac
          python3 - <<'PY_VALIDATE_REPOSITORY_RELEASE'
          import json
          import os

          ref = os.environ["REQUEST_REF"]
          profile = os.environ["TEST_PROFILE"]
          try:
              inputs = json.loads(os.environ.get("INPUTS_JSON", ""))
          except json.JSONDecodeError as exc:
              raise SystemExit("release.repository inputs must be Central-derived JSON") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"host_os", "semantic_inputs"}:
              raise SystemExit("release.repository accepts only Central-derived host_os and semantic_inputs")
          if inputs["host_os"] != profile:
              raise SystemExit("release.repository host_os must match the privately selected profile")
          try:
              semantic = json.loads(inputs["semantic_inputs"])
          except (TypeError, json.JSONDecodeError) as exc:
              raise SystemExit("release.repository semantic_inputs must be one JSON object") from exc
          expected = {"build_identity": ref, "release_kind": "publish"}
          if semantic != expected:
              raise SystemExit("release.repository semantics must be derived only from the immutable tag")
          PY_VALIDATE_REPOSITORY_RELEASE

      - name: Validate Maven release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.maven' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = publish || {
            echo "release.maven supports only the publish profile" >&2
            exit 2
          }
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          raw_inputs = Path(".central-tag-release-inputs.json").read_text(encoding="utf-8") if Path(".central-tag-release-inputs.json").is_file() else os.environ["INPUTS_JSON"]
          try:
              inputs = json.loads(raw_inputs)
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("release.maven inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"build_number"}:
              raise SystemExit("release.maven requires exactly inputs.build_number")
          build_number = inputs["build_number"]
          if not isinstance(build_number, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", build_number):
              raise SystemExit("release.maven build_number must be one non-empty bounded release identifier")
          PY

      - name: Validate branch deletion request
        if: ${{ steps.claim.outputs.workflow_key == 'maintenance.branch-delete' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          REQUEST_IS_TAG: ${{ steps.claim.outputs.is_tag }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = delete || {
            echo "maintenance.branch-delete supports only the delete profile" >&2
            exit 2
          }
          test "${REQUEST_IS_TAG}" = false || {
            echo "maintenance.branch-delete does not accept tag requests" >&2
            exit 2
          }
          python3 - <<'PY_VALIDATE_BRANCH_DELETE'
          import json
          import os
          import re

          try:
              inputs = json.loads(os.environ["INPUTS_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("maintenance.branch-delete inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"expected_head"}:
              raise SystemExit("maintenance.branch-delete requires exactly inputs.expected_head")
          expected_head = inputs["expected_head"]
          if not isinstance(expected_head, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_head):
              raise SystemExit("maintenance.branch-delete expected_head must be one lowercase 40-character Git SHA")
          PY_VALIDATE_BRANCH_DELETE

      - name: Validate Android release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.android' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          test "${TEST_PROFILE}" = play || {
            echo "release.android supports only the play profile" >&2
            exit 2
          }
          python3 - <<'PY_VALIDATE_ANDROID_RELEASE'
          from pathlib import Path
          import json
          import os
          import re

          raw_inputs = Path(".central-tag-release-inputs.json").read_text(encoding="utf-8") if Path(".central-tag-release-inputs.json").is_file() else os.environ["INPUTS_JSON"]
          try:
              inputs = json.loads(raw_inputs)
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("release.android inputs must be one JSON object") from exc
          if not isinstance(inputs, dict) or set(inputs) != {"build_number"}:
              raise SystemExit("release.android requires exactly inputs.build_number")
          build_number = inputs["build_number"]
          if not isinstance(build_number, str) or not re.fullmatch(r"[1-9][0-9]{0,9}", build_number):
              raise SystemExit("release.android build_number must be one positive decimal Android versionCode")
          if int(build_number) > 2100000000:
              raise SystemExit("release.android build_number exceeds the maximum Android versionCode 2100000000")
          PY_VALIDATE_ANDROID_RELEASE

      - name: Validate Apple release request
        if: ${{ steps.claim.outputs.workflow_key == 'release.apple' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.claim.outputs.test_profile }}
          INPUTS_JSON: ${{ steps.claim.outputs.inputs_json }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_VALIDATE_APPLE_RELEASE'
          from pathlib import Path
          import json
          import os
          import re

          profile = os.environ.get("TEST_PROFILE", "")
          raw_inputs = Path(".central-tag-release-inputs.json").read_text(encoding="utf-8") if Path(".central-tag-release-inputs.json").is_file() else os.environ["INPUTS_JSON"]
          try:
              inputs = json.loads(raw_inputs)
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("release.apple inputs must be one JSON object") from exc
          if not isinstance(inputs, dict):
              raise SystemExit("release.apple inputs must be one JSON object")
          if profile == "testflight":
              if set(inputs) != {"build_number"}:
                  raise SystemExit("release.apple/testflight requires exactly inputs.build_number")
              build_number = inputs["build_number"]
              if not isinstance(build_number, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,63}", build_number):
                  raise SystemExit("release.apple/testflight build_number must be one non-empty bounded release identifier")
          elif profile in {"binary-package", "swiftpm-package"}:
              if inputs:
                  raise SystemExit(f"release.apple/{profile} accepts no semantic inputs")
          else:
              raise SystemExit("release.apple supports only testflight, binary-package and swiftpm-package profiles")
          PY_VALIDATE_APPLE_RELEASE

  repository:
    needs: request
    if: ${{ needs.request.outputs.workflow_key == 'validation.repository' }}
    concurrency:
      group: central-ci-${{ needs.request.outputs.validation_concurrency_key }}
      cancel-in-progress: ${{ needs.request.outputs.validation_cancel_in_progress == 'true' }}
