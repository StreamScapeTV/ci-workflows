name: Reusable OCI build validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      product_id:
        description: Checked-in product identifier from contracts/oci-products.json
        required: true
        type: string
      release_version:
        description: Optional exact SemVer metadata value
        required: false
        type: string
      platform_set:
        description: Optional exact contract-owned platform set; no arbitrary matrix
        required: false
        type: string
      artifact_exception_id:
        description: Initial API requires empty because routine artifacts are forbidden
        required: false
        type: string
    outputs:
      result:
        description: Success only after build, inspection, smoke, cleanup, and residue checks
        value: ${{ jobs.build.outputs.result }}
      image_digest:
        description: Deterministic JSON map of local OCI index digests
        value: ${{ jobs.build.outputs.manifest_digests_json }}
      platform_digests_json:
        description: Exact local platform manifest, config, and layer identities
        value: ${{ jobs.build.outputs.platform_results_json }}
      resolved_inputs_json:
        description: Redacted JSON map of exact resolved build inputs keyed by target
        value: ${{ jobs.build.outputs.resolved_inputs_json }}
      artifact_exception_used:
        description: Always false for oci.build 1.0.0
        value: ${{ jobs.build.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded OCI build plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - id: plan
        name: Resolve contract-owned OCI product and runner
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@676aa6b1b4d5fb8d4c26531e1a181e37b33e3433 # issue #150 immutable OCI input checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

  build:
    name: CI / OCI build validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 180
    outputs:
      result: ${{ steps.execute.outcome == 'success' && steps.oci_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      manifest_digests_json: ${{ steps.execute.outputs.manifest_digests_json }}
      platform_results_json: ${{ steps.execute.outputs.platform_results_json }}
      resolved_inputs_json: ${{ steps.execute.outputs.resolved_inputs_json }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated marker-bound OCI build state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}

      - id: execute
        name: Build and inspect exact source without publication
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@676aa6b1b4d5fb8d4c26531e1a181e37b33e3433 # issue #150 immutable OCI input checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - name: Render deterministic redacted OCI evidence
        if: ${{ always() && !cancelled() }}
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: oci-build-1.0.0
          runner_profile: ${{ needs.plan.outputs.runner_profile }}
          toolchain_json: >-
            {"buildah":"1.33.7","publication":"false","registry_credentials":"false"}
          command_profile: ${{ inputs.product_id }}
          result: ${{ steps.execute.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: not-run
          cleanup_removed_paths: "0"

      - id: oci_cleanup
        name: Remove images, manifests, containers, layouts, caches, and temporary state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@676aa6b1b4d5fb8d4c26531e1a181e37b33e3433 # issue #150 immutable OCI input checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: residue
        name: Verify zero OCI-specific residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@676aa6b1b4d5fb8d4c26531e1a181e37b33e3433 # issue #150 immutable OCI input checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: workspace_cleanup
        name: Remove and verify registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - name: Verify exact caller source remained clean
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

      - name: Project terminal OCI build status
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          OCI_CLEANUP_OUTCOME: ${{ steps.oci_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${EXECUTE_OUTCOME}" = "success"
          test "${OCI_CLEANUP_OUTCOME}" = "success"
          test "${RESIDUE_OUTCOME}" = "success"
          test "${WORKSPACE_CLEANUP_OUTCOME}" = "success"
