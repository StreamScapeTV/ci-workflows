name: CI / Apple validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      source_repository:
        description: Optional exact source repository in owner/name form for Central-dispatched validation
        required: false
        default: ""
        type: string
      validation_scope:
        description: legacy, protected-full, or simulator-confidence
        required: false
        default: legacy
        type: string
      validation_plan_json:
        description: Strict bounded caller-owned Apple stage plan or simulator-confidence packet
        required: false
        default: ""
        type: string
      validation_profile:
        description: Legacy bounded Apple validation profile
        required: false
        default: ""
        type: string
      version_file:
        description: Legacy optional exact contract-matching version or resolution authority file
        required: false
        default: ""
        type: string
      working_directory:
        description: Legacy exact contract-matching source directory
        required: false
        default: "."
        type: string
      command_profile:
        description: Legacy reviewed product-neutral Apple consumer contract identifier
        required: false
        default: ""
        type: string
      script_path:
        description: Legacy optional exact contract-matching checked-in script
        required: false
        default: ""
        type: string
      platform:
        description: Legacy bounded Apple platform
        required: false
        default: ""
        type: string
      scheme:
        description: Legacy optional exact contract-matching scheme
        required: false
        default: ""
        type: string
      destination_profile:
        description: Legacy optional exact contract-matching destination profile identifier
        required: false
        default: ""
        type: string
      artifact_exception_id:
        description: Optional registered redacted diagnostic exception; absent by default
        required: false
        default: ""
        type: string
      private_dependency_repository:
        description: Optional exact private dependency repository for protected-full
        required: false
        default: ""
        type: string
      private_dependency_sha:
        description: Optional exact private dependency SHA for protected-full
        required: false
        default: ""
        type: string
      private_dependency_subdirectory:
        description: Optional bounded dependency subdirectory
        required: false
        default: "."
        type: string
      private_dependency_id:
        description: Optional bounded dependency identity
        required: false
        default: ""
        type: string
    secrets:
      repository_app_id:
        description: Optional fixed GitHub App id used only when source_repository selects a different repository
        required: false
      repository_app_private_key:
        description: Optional fixed GitHub App private key used only for transient contents-read repository tokens
        required: false
      private_dependency_token:
        description: Optional transient contents-read token used by caller-owned private source or release-asset dependencies
        required: false
    outputs:
      result:
        description: Success only after execution and all terminal cleanup checks succeed
        value: ${{ jobs.apple.outputs.result }}
      test_summary:
        description: Bounded machine-readable Apple stage summary
        value: ${{ jobs.apple.outputs.test_summary }}
      cleanup_result:
        description: Success only after Apple state, optional release asset, and workspace cleanup are residue-free
        value: ${{ jobs.apple.outputs.cleanup_result }}
      artifact_exception_used:
        description: Whether a registered legacy redacted artifact exception was used
        value: ${{ jobs.apple.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Validate bounded Apple request
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json || steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
      private_dependency_used: ${{ steps.plan.outputs.private_dependency_used }}
      private_dependency_repository: ${{ steps.plan.outputs.private_dependency_repository }}
      private_dependency_sha: ${{ steps.plan.outputs.private_dependency_sha }}
      private_dependency_subdirectory: ${{ steps.plan.outputs.private_dependency_subdirectory }}
      private_dependency_id: ${{ steps.plan.outputs.private_dependency_id }}
    steps:
      - id: plan
        name: Resolve one Apple executor plan
        uses: StreamScapeTV/ci-workflows/actions/validate-apple@main
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          source_repository: ${{ inputs.source_repository }}
          validation_scope: ${{ inputs.validation_scope }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          scheme: ${{ inputs.scheme }}
          destination_profile: ${{ inputs.destination_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

      - id: backend
        name: Resolve fixed hosted backend only for Central external source
        if: inputs.source_repository != '' && inputs.source_repository != github.repository && inputs.validation_scope != 'simulator-confidence'
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@main
        with:
          workflow_api: validation.apple
          source_trust: ${{ steps.plan.outputs.source_trust }}
          execution_backend: github-hosted
          runner_profile: ${{ steps.plan.outputs.runner_profile }}

  apple:
    name: Execute exact Apple validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      cleanup_result: ${{ steps.apple_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && (steps.release_plan.outputs.used != 'true' || (steps.release_cleanup.outcome == 'success' && steps.release_residue.outcome == 'success')) && steps.workspace_cleanup.outcome == 'success' && steps.source_cleanup.outcome == 'success' && 'success' || 'failure' }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Clear fixed admitted source root without following links
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported fixed source entry")

          remove_no_follow(Path("source"))
          if os.path.lexists("source"):
              raise SystemExit("fixed source root remains")
          PY

      - id: source_token
        name: Mint exact source repository token only for Central-dispatched source
        if: inputs.source_repository != '' && inputs.source_repository != github.repository
        uses: StreamScapeTV/ci-workflows/actions/github-app-repository-token@main
        env:
          CIW_GITHUB_APP_ID: ${{ secrets.repository_app_id }}
          CIW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.repository_app_private_key }}
        with:
          repository: ${{ inputs.source_repository }}

      - id: checkout
        name: Check out exact admitted caller source once
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@main
        with:
          repository: ${{ inputs.source_repository || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository) }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
          token: ${{ steps.source_token.outputs.token }}

      - id: release_config
        name: Detect checked-in private release configuration for legacy dependency source
        if: inputs.validation_scope == 'protected-full' && needs.plan.outputs.private_dependency_used == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -e source/.github/central-ci.json || test -L source/.github/central-ci.json; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - id: release_plan
        name: Resolve one product-owned private release asset
        if: inputs.validation_scope == 'protected-full' && (needs.plan.outputs.private_dependency_used != 'true' || steps.release_config.outputs.present == 'true')
        uses: StreamScapeTV/ci-workflows/actions/materialize-private-release-asset@main
        with:
          phase: "plan"
          config_workflow_key: validation.apple
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          source_root: source

      - id: workspace
        name: Prepare one isolated marker-bound Apple workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@main
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}

      - id: dependency_token
        name: Mint exact dependency token only for Central-dispatched source
        if: needs.plan.outputs.private_dependency_used == 'true' && inputs.source_repository != '' && inputs.source_repository != github.repository
        uses: StreamScapeTV/ci-workflows/actions/github-app-repository-token@main
        env:
          CIW_GITHUB_APP_ID: ${{ secrets.repository_app_id }}
          CIW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.repository_app_private_key }}
        with:
          repository: ${{ needs.plan.outputs.private_dependency_repository }}

      - id: dependency
        name: Check out exact private dependency at most once
        if: needs.plan.outputs.private_dependency_used == 'true'
        uses: StreamScapeTV/ci-workflows/actions/checkout-private-dependency@main
        with:
          repository: ${{ needs.plan.outputs.private_dependency_repository }}
          admitted_sha: ${{ needs.plan.outputs.private_dependency_sha }}
          dependency_id: ${{ needs.plan.outputs.private_dependency_id }}
          expected_subpath: ${{ needs.plan.outputs.private_dependency_subdirectory }}
          fetch_depth: "1"
          token: ${{ steps.dependency_token.outputs.token || secrets.private_dependency_token }}

      - id: release_token
        name: Mint exact release-asset token only for Central-dispatched source
        if: steps.release_plan.outputs.used == 'true' && inputs.source_repository != '' && inputs.source_repository != github.repository
        uses: StreamScapeTV/ci-workflows/actions/github-app-repository-token@main
        env:
          CIW_GITHUB_APP_ID: ${{ secrets.repository_app_id }}
          CIW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.repository_app_private_key }}
        with:
          repository: ${{ steps.release_plan.outputs.repository }}

      - id: release_asset
        name: Materialize exact verified private release asset
        if: steps.release_plan.outputs.used == 'true'
        uses: StreamScapeTV/ci-workflows/actions/materialize-private-release-asset@main
        env:
          PRIVATE_RELEASE_ASSET_TOKEN: ${{ steps.release_token.outputs.token || secrets.private_dependency_token }}
        with:
          phase: "execute"
          repository: ${{ steps.release_plan.outputs.repository }}
          tag: ${{ steps.release_plan.outputs.tag }}
          commit_sha: ${{ steps.release_plan.outputs.commit_sha }}
          asset_name: ${{ steps.release_plan.outputs.asset_name }}
          sha256: ${{ steps.release_plan.outputs.sha256 }}
          archive_subpath: ${{ steps.release_plan.outputs.archive_subpath }}
          destination: ${{ steps.release_plan.outputs.destination }}
          dependency_id: ${{ steps.release_plan.outputs.dependency_id }}
          source_root: source

      - id: execute
        name: Execute one sequential Apple validation plan
        uses: StreamScapeTV/ci-workflows/actions/validate-apple@main
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          source_repository: ${{ inputs.source_repository }}
          validation_scope: ${{ inputs.validation_scope }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          scheme: ${{ inputs.scheme }}
          destination_profile: ${{ inputs.destination_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
          private_dependency_verified: ${{ steps.dependency.outputs.verified }}
          private_dependency_remotes_erased: ${{ steps.dependency.outputs.remotes_erased }}
          private_dependency_credentials_erased: ${{ steps.dependency.outputs.credentials_erased }}
          private_dependency_head_sha: ${{ steps.dependency.outputs.head_sha }}
          private_dependency_checkout_repository: ${{ steps.dependency.outputs.repository }}
          private_dependency_checkout_id: ${{ steps.dependency.outputs.dependency_id }}
          private_dependency_expected_subpath: ${{ steps.dependency.outputs.expected_subpath }}

      - id: evidence
        name: Render bounded Apple validation evidence
        if: steps.execute.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@main
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: main
          runner_profile: ${{ inputs.source_repository != '' && inputs.source_repository != github.repository && 'github-hosted-macos' || (inputs.validation_scope == 'simulator-confidence' && 'github-hosted-macos' || 'apple') }}
          toolchain_json: '{}'
          command_profile: ${{ inputs.validation_scope }}
          result: ${{ steps.execute.outputs.result }}

      - id: apple_cleanup
        name: Remove Apple-specific state once
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-apple@main
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          source_repository: ${{ inputs.source_repository }}
          validation_scope: ${{ inputs.validation_scope }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          scheme: ${{ inputs.scheme }}
          destination_profile: ${{ inputs.destination_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

      - id: release_cleanup
        name: Remove materialized private release asset once
        if: always() && steps.release_plan.outputs.used == 'true' && steps.release_asset.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/materialize-private-release-asset@main
        with:
          phase: "cleanup"
          repository: ${{ steps.release_plan.outputs.repository }}
          tag: ${{ steps.release_plan.outputs.tag }}
          commit_sha: ${{ steps.release_plan.outputs.commit_sha }}
          asset_name: ${{ steps.release_plan.outputs.asset_name }}
          sha256: ${{ steps.release_plan.outputs.sha256 }}
          archive_subpath: ${{ steps.release_plan.outputs.archive_subpath }}
          destination: ${{ steps.release_plan.outputs.destination }}
          dependency_id: ${{ steps.release_plan.outputs.dependency_id }}
          source_root: source

      - id: release_residue
        name: Verify zero private release-asset residue
        if: always() && steps.release_plan.outputs.used == 'true' && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/materialize-private-release-asset@main
        with:
          phase: "residue"
          repository: ${{ steps.release_plan.outputs.repository }}
          tag: ${{ steps.release_plan.outputs.tag }}
          commit_sha: ${{ steps.release_plan.outputs.commit_sha }}
          asset_name: ${{ steps.release_plan.outputs.asset_name }}
          sha256: ${{ steps.release_plan.outputs.sha256 }}
          archive_subpath: ${{ steps.release_plan.outputs.archive_subpath }}
          destination: ${{ steps.release_plan.outputs.destination }}
          dependency_id: ${{ steps.release_plan.outputs.dependency_id }}
          source_root: source

      - id: residue
        name: Verify zero Apple-specific residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-apple@main
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          source_repository: ${{ inputs.source_repository }}
          validation_scope: ${{ inputs.validation_scope }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          scheme: ${{ inputs.scheme }}
          destination_profile: ${{ inputs.destination_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

      - id: clean
        name: Verify exact admitted source remained clean
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - id: source_cleanup
        name: Remove exact admitted source checkout once
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path

          def remove_no_follow(path: Path) -> None:
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or stat.S_ISREG(metadata.st_mode):
                  os.unlink(path)
              elif stat.S_ISDIR(metadata.st_mode):
                  with os.scandir(path) as entries:
                      children = [path / entry.name for entry in entries]
                  for child in children:
                      remove_no_follow(child)
                  os.rmdir(path)
              else:
                  raise SystemExit("unsupported fixed source entry")

          remove_no_follow(Path("source"))
          if os.path.lexists("source"):
            raise SystemExit("fixed source checkout remains")
          PY

      - id: workspace_cleanup
        name: Remove and verify the one registered Apple workspace
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@main

      - id: terminal
        name: Project terminal Apple validation status
        if: always()
        shell: bash
        env:
          PLAN_OUTCOME: ${{ needs.plan.result }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          DEPENDENCY_REQUIRED: ${{ needs.plan.outputs.private_dependency_used }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          RELEASE_REQUIRED: ${{ steps.release_plan.outputs.used }}
          RELEASE_OUTCOME: ${{ steps.release_asset.outcome }}
          RELEASE_CLEANUP_OUTCOME: ${{ steps.release_cleanup.outcome }}
          RELEASE_RESIDUE_OUTCOME: ${{ steps.release_residue.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          APPLE_CLEANUP_OUTCOME: ${{ steps.apple_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          SOURCE_CLEANUP_OUTCOME: ${{ steps.source_cleanup.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          dependency_ok=true
          if [[ "${DEPENDENCY_REQUIRED}" == "true" ]]; then
            test "${DEPENDENCY_OUTCOME}" = "success" || dependency_ok=false
          fi
          release_ok=true
          if [[ "${RELEASE_REQUIRED}" == "true" ]]; then
            if [[ "${RELEASE_OUTCOME}" != "success" ||
                  "${RELEASE_CLEANUP_OUTCOME}" != "success" ||
                  "${RELEASE_RESIDUE_OUTCOME}" != "success" ]]; then
              release_ok=false
            fi
          fi
          if [[ "${PLAN_OUTCOME}" == "success" &&
                "${CHECKOUT_OUTCOME}" == "success" &&
                "${WORKSPACE_OUTCOME}" == "success" &&
                "${dependency_ok}" == "true" &&
                "${release_ok}" == "true" &&
                "${EXECUTE_OUTCOME}" == "success" &&
                "${APPLE_CLEANUP_OUTCOME}" == "success" &&
                "${RESIDUE_OUTCOME}" == "success" &&
                "${CLEAN_OUTCOME}" == "success" &&
                "${SOURCE_CLEANUP_OUTCOME}" == "success" &&
                "${WORKSPACE_CLEANUP_OUTCOME}" == "success" ]]; then
            echo "result=success" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "result=failure" >> "${GITHUB_OUTPUT}"
          exit 1
