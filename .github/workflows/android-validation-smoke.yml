name: Android reusable-workflow smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/reusable-android.yml
      - .github/workflows/android-validation-smoke.yml
      - actions/validate-android/**
      - actions/warm-gradle-dependencies/**
      - src/ci_workflows/ciw.py
      - src/ci_workflows/ciw_android.py
      - src/ci_workflows/gradle_dependency_warm.py
      - src/ci_workflows/language_primitives.py
      - src/ci_workflows/runtime_primitives.py
      - contracts/ciw-commands.json
      - contracts/public-workflows.json
      - contracts/public-workflows/validation.json
      - contracts/public-workflow-types.json
      - docs/reference/ciw.md
      - docs/workflows/android.md
      - tests/fixtures/android-validation/smoke-project/**
      - tests/test_android_*.py
      - tests/test_android_validation_public_smoke_routing.py
      - tests/test_gradle_dependency_warm.py
      - tests/test_reusable_workflow_source_identity.py
  workflow_dispatch:

concurrency:
  group: android-reusable-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Validate Android reusable-workflow contracts
    if: >-
      ${{ github.event_name != 'pull_request' ||
          (github.event.pull_request.user.login == 'mimranfaruqi' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Stage exact candidate implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact candidate implementation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - id: plan
        name: Validate bounded protected-full plan
        uses: ./.ciw/actions/validate-android
        with:
          phase: plan
          admitted_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - id: reject_escape
        name: Reject arbitrary Gradle task injection before execution
        continue-on-error: true
        uses: ./.ciw/actions/validate-android
        with:
          phase: plan
          admitted_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help;arbitrary"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - name: Require bounded hosted planning outcomes
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          REJECT_ESCAPE_OUTCOME: ${{ steps.reject_escape.outcome }}
        run: |
          set -Eeuo pipefail
          test "${PLAN_OUTCOME}" = success
          test "${REJECT_ESCAPE_OUTCOME}" = failure
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

  android:
    name: Android reusable-workflow smoke
    needs: contracts
    if: >-
      ${{ needs.contracts.result == 'success' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login == 'mimranfaruqi' &&
            github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 45
    steps:
      - name: Admit exact same-repository smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -Eeuo pipefail
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Stage exact candidate implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact candidate implementation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          cd .ciw
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up exact hosted JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - id: plan
        name: Validate protected-full single-executor plan
        uses: ./.ciw/actions/validate-android
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - name: Check out exact admitted smoke source once
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated Gradle workspace
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: dependency_warm
        name: Resolve dependency graph before synthetic protected-full
        uses: ./.ciw/actions/warm-gradle-dependencies
        with:
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew

      - id: execute
        name: Execute protected-full in one mobile workspace
        uses: ./.ciw/actions/validate-android
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - id: android_cleanup
        name: Remove Android-specific copied source state once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-android
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full

      - id: residue
        name: Verify zero Android-specific residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-android
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          validation_scope: protected-full

      - id: workspace_cleanup
        name: Remove and verify the one registered workspace
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - id: clean
        name: Verify exact admitted smoke source remained clean
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Project terminal Android smoke status
        if: always()
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          WARM_OUTCOME: ${{ steps.dependency_warm.outcome }}
          WARM_CACHE_MODE: ${{ steps.dependency_warm.outputs.gradle_dependency_cache_mode }}
          WARM_WALL_MS: ${{ steps.dependency_warm.outputs.warm_wall_ms }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ANDROID_CLEANUP_OUTCOME: ${{ steps.android_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -Eeuo pipefail
          test "${PLAN_OUTCOME}" = "success"
          test "${WARM_OUTCOME}" = "success"
          [[ "${WARM_CACHE_MODE}" =~ ^(cold|read-only-seed)$ ]]
          [[ "${WARM_WALL_MS}" =~ ^[0-9]+$ ]]
          test "${EXECUTE_OUTCOME}" = "success"
          test "${ANDROID_CLEANUP_OUTCOME}" = "success"
          test "${RESIDUE_OUTCOME}" = "success"
          test "${WORKSPACE_CLEANUP_OUTCOME}" = "success"
          test "${CLEAN_OUTCOME}" = "success"

  terminal:
    name: Verify trusted Android reusable routing
    needs: [contracts, android]
    if: >-
      ${{ (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login == 'mimranfaruqi' &&
            github.event.pull_request.head.repo.full_name == github.repository)) &&
          always() && !cancelled() }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Require hosted contracts and Android success
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${CONTRACTS_RESULT}" = success
          test "${ANDROID_RESULT}" = success
