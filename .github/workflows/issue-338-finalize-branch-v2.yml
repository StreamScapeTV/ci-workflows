name: Issue 338 idempotent branch finalizer

on:
  push:
    branches:
      - agent1/issue-338-android-live-release

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == '[#338] Finalize Android completion branch v2' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 30
    steps:
      - name: Check out exact finalizer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Normalize artifact manifest catalog type locally
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          types_path = Path('contracts/public-workflow-types.json')
          data = json.loads(types_path.read_text(encoding='utf-8'))
          row = data['output_catalog']['artifact_manifest_json']
          if row == {'type': 'json-object', 'nullable': True}:
              row['type'] = 'json-array'
          elif row != {'type': 'json-array', 'nullable': True}:
              raise SystemExit(f'unexpected artifact_manifest_json catalog: {row!r}')
          types_path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')

          test_path = Path('tests/test_public_api_contract.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertEqual(\n            {"type": "json-object", "nullable": True},\n            self.data.types["output_catalog"]["artifact_manifest_json"],\n        )'''
          new = '''        self.assertEqual(\n            {"type": "json-array", "nullable": True},\n            self.data.types["output_catalog"]["artifact_manifest_json"],\n        )'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('artifact_manifest_json public API expectation not found')
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate final static candidate before remote mutation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py validate
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py render --check
          PYTHONPATH=src python3 -m unittest -v \
            tests.test_public_api_contract \
            tests.test_android_completion \
            tests.test_android_ciw_dispatch
          python3 -m py_compile src/ci_workflows/ciw_android_completion.py scripts/ci/android_completion.py
          test -z "$(git diff -- . ':!contracts/public-workflow-types.json' ':!tests/test_public_api_contract.py')"

      - name: Persist normalized files and remove every disposable #338 workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent1/issue-338-android-live-release
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['BRANCH_NAME']
          token = os.environ['GITHUB_TOKEN']

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return {} if not raw else json.loads(raw)

          def get(path):
              return request(
                  'GET',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}?ref={urllib.parse.quote(branch, safe="")}',
              )

          def delete(path):
              try:
                  current = get(path)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return
                  raise
              request(
                  'DELETE',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
                  {'message': f'[skip ci] #338 remove disposable {Path(path).name}', 'sha': current['sha'], 'branch': branch},
              )

          def put_if_changed(path, content, message):
              current = get(path)
              remote = base64.b64decode(current['content']).decode('utf-8')
              if remote == content:
                  return
              request(
                  'PUT',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
                  {
                      'message': message,
                      'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                      'sha': current['sha'],
                      'branch': branch,
                  },
              )

          for path in (
              '.github/workflows/issue-338-contract-validation.yml',
              '.github/workflows/issue-338-public-confirm.yml',
              '.github/workflows/issue-338-mobile-diagnostic.yml',
              '.github/workflows/issue-338-finalize-branch.yml',
          ):
              delete(path)

          put_if_changed(
              'contracts/public-workflow-types.json',
              Path('contracts/public-workflow-types.json').read_text(encoding='utf-8'),
              '[skip ci] #338 type release artifact manifest as array',
          )
          put_if_changed(
              'tests/test_public_api_contract.py',
              Path('tests/test_public_api_contract.py').read_text(encoding='utf-8'),
              '[skip ci] #338 align release artifact manifest contract test',
          )
          delete('.github/workflows/issue-338-finalize-branch-v2.yml')

          ref = request(
              'GET',
              f'{api}/repos/{repo}/git/ref/heads/{urllib.parse.quote(branch, safe="/")}',
          )
          final_sha = ref['object']['sha']
          request(
              'POST',
              f'{api}/repos/{repo}/issues/338/comments',
              {'body': (
                  '#338 idempotent branch finalizer: **PASS**. Public API validation/reference, '
                  'Android completion/public API tests, adapter compilation and clean-diff boundary passed; '
                  'artifact manifest typing is aligned and all disposable #338 workflows were removed. '
                  f'Finalized branch head: `{final_sha}`.'
              )},
          )
          PY
