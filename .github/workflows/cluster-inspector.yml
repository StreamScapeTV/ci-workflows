name: Cluster inspector

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      CLUSTER_INSPECTOR_KUBECONFIG_B64:
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize private inspection log
        shell: bash
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/central-cluster-inspector.log"
          : > "${log}"
          chmod 600 "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate fixed cluster inspection request
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
        run: |
          set -Eeuo pipefail
          case "${TEST_PROFILE}" in
            longhorn|cnpg|flux) ;;
            *) echo "cluster inspection supports only longhorn, cnpg, or flux" >&2; exit 2 ;;
          esac
          test -n "${SOURCE_REPOSITORY}" && test -n "${SOURCE_REF}" || {
            echo "cluster inspection requires one explicit repository and ref" >&2
            exit 2
          }
          test "${SOURCE_IS_TAG}" = false || {
            echo "cluster inspection accepts branch source only" >&2
            exit 2
          }
          case "${SOURCE_REF}" in
            refs/pull/*) echo "cluster inspection refuses pull-request refs" >&2; exit 2 ;;
          esac

      - name: Prepare source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Require repository default-branch source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -Eeuo pipefail
          test -n "${SOURCE_TOKEN}" || {
            echo "cluster inspection default-branch verification requires the fixed source token" >&2
            exit 1
          }
          case "${SOURCE_REF}" in
            refs/*) echo "cluster inspection requires one human default-branch ref" >&2; exit 2 ;;
          esac
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}")"
          default_branch="$(jq -r '.default_branch // empty' <<<"${response}")"
          test -n "${default_branch}" && test "${SOURCE_REF}" = "${default_branch}" || {
            echo "cluster inspection is restricted to the repository default branch" >&2
            exit 2
          }

      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.source.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Require private network credentials on GitHub-hosted runner
        if: ${{ runner.environment == 'github-hosted' }}
        shell: bash
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -Eeuo pipefail
          test -n "${TS_OAUTH_CLIENT_ID}" && test -n "${TS_OAUTH_SECRET}" || {
            echo "cluster inspection requires the reviewed private-network capability on GitHub-hosted runners" >&2
            exit 1
          }

      - name: Connect reviewed private network
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci

      - name: Prepare ephemeral cluster inspector kubeconfig
        id: kubeconfig
        shell: bash
        env:
          CLUSTER_INSPECTOR_KUBECONFIG_B64: ${{ secrets.CLUSTER_INSPECTOR_KUBECONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "${CLUSTER_INSPECTOR_KUBECONFIG_B64}" || {
            echo "cluster inspector kubeconfig secret is required" >&2
            exit 1
          }
          kubeconfig="${RUNNER_TEMP}/cluster-inspector-kubeconfig"
          rm -f -- "${kubeconfig}"
          umask 077
          printf '%s' "${CLUSTER_INSPECTOR_KUBECONFIG_B64}" | base64 --decode > "${kubeconfig}"
          test -s "${kubeconfig}" && test -f "${kubeconfig}" && test ! -L "${kubeconfig}" || {
            echo "cluster inspector kubeconfig decode failed" >&2
            exit 1
          }
          chmod 600 "${kubeconfig}"
          printf 'KUBECONFIG=%s\n' "${kubeconfig}" >> "${GITHUB_ENV}"
          printf 'path=%s\n' "${kubeconfig}" >> "${GITHUB_OUTPUT}"

      - name: Run fixed repository-owned cluster inspection profile
        id: inspect
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
        run: |
          set -Eeuo pipefail
          command -v kubectl >/dev/null 2>&1 || {
            echo "cluster inspection runner is missing kubectl" >&2
            exit 1
          }
          case "${TEST_PROFILE}" in
            longhorn) script=.ci/cluster-inspector/longhorn.sh ;;
            cnpg) script=.ci/cluster-inspector/cnpg.sh ;;
            flux) script=.ci/cluster-inspector/flux.sh ;;
            *) exit 2 ;;
          esac
          git -C source ls-files --error-unmatch -- "${script}" >/dev/null 2>&1 || {
            echo "cluster inspection profile script must be tracked by the requested source" >&2
            exit 2
          }
          mode="$(git -C source ls-files -s -- "${script}" | awk 'NR == 1 {print $1}')"
          case "${mode}" in
            100644|100755) ;;
            *) echo "cluster inspection profile script has unsupported Git mode" >&2; exit 2 ;;
          esac
          path="source/${script}"
          test -f "${path}" && test ! -L "${path}" || {
            echo "cluster inspection profile script must be one regular non-symlink file" >&2
            exit 2
          }
          printf '\n===== cluster-inspector/%s =====\n' "${TEST_PROFILE}" >> "${CI_LOG}"
          if ! bash "${path}" >> "${CI_LOG}" 2>&1; then
            echo "cluster inspection profile failed; inspect the private CI log" >&2
            exit 1
          fi

      - name: Remove ephemeral cluster inspector kubeconfig
        id: kubeconfig_cleanup
        if: ${{ always() }}
        shell: bash
        env:
          KUBECONFIG_PATH: ${{ steps.kubeconfig.outputs.path }}
        run: |
          set -Eeuo pipefail
          path="${KUBECONFIG_PATH:-${RUNNER_TEMP}/cluster-inspector-kubeconfig}"
          rm -f -- "${path}"
          printf 'KUBECONFIG=\n' >> "${GITHUB_ENV}"
          if test -e "${path}" || test -L "${path}"; then
            echo "cluster inspector kubeconfig cleanup failed" >&2
            exit 1
          fi

      - name: Scrub configured CI secrets from private inspection log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_CLUSTER_INSPECTOR_KUBECONFIG_B64: ${{ secrets.CLUSTER_INSPECTOR_KUBECONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("cluster inspection log must be one regular non-symlink file")
          if path.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("cluster inspection log exceeds the reviewed 16 MiB evidence bound")
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload cluster inspection evidence to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-cluster-inspector.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-cluster-inspector-${{ inputs.test_profile }}.txt
          mime_type: text/plain

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: >-
            ${{ steps.inspect.outcome == 'success'
                && steps.kubeconfig_cleanup.outcome == 'success'
                && steps.scrub.outcome == 'success'
                && steps.drive.outcome == 'success'
                && 'succeeded' || 'failed' }}
