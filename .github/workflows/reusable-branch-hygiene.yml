name: Reusable exact merged-branch hygiene

on:
  workflow_call:
    inputs:
      project_id: {description: Checked-in project identifier, required: true, type: string}
      pr_number: {description: Optional exact merged pull request number, required: false, type: number}
      expected_head_sha: {description: Exact unchanged issue-branch head SHA, required: true, type: string}
      dry_run: {description: Report the exact deletion without deleting, required: false, default: true, type: boolean}
      request_id: {description: Bounded request identifier, required: true, type: string}
    secrets:
      organization_maintenance_token: {description: Least-privilege branch maintenance token, required: true}
    outputs:
      result: {value: '${{ jobs.hygiene.outputs.result }}'}
      mutation_count: {value: '${{ jobs.hygiene.outputs.mutation_count }}'}
      request_id: {value: '${{ jobs.hygiene.outputs.request_id }}'}
permissions:
  contents: write
  pull-requests: read
jobs:
  hygiene:
    name: Maintenance / Branch hygiene
    runs-on: [linux, amd64, general]
    timeout-minutes: 30
    outputs:
      result: ${{ steps.hygiene.outputs.result }}
      mutation_count: ${{ steps.hygiene.outputs.mutation_count }}
      request_id: ${{ steps.hygiene.outputs.request_id }}
    steps:
      - name: Run exact merged-branch hygiene
        id: hygiene
        uses: StreamScapeTV/ci-workflows/actions/maintenance-branches@37f6309dff0fe6cae0b910df2ee427c55ced3684 # issue #20 immutable maintenance action checkpoint
        with:
          project_id: ${{ inputs.project_id }}
          pr_number: ${{ inputs.pr_number }}
          expected_head_sha: ${{ inputs.expected_head_sha }}
          dry_run: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
          token: ${{ secrets.organization_maintenance_token }}
      - name: Cleanup maintenance workflow state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/ci-workflows-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${state}"
          test ! -e "${state}"
