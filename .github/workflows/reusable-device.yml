name: CI / Physical device validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        required: true
        type: string
      device_family:
        required: true
        type: string
      device_capability:
        required: true
        type: string
      host_capacity:
        required: true
        type: string
      prepare_script_path:
        required: true
        type: string
      test_script_path:
        required: true
        type: string
      evidence_script_path:
        required: true
        type: string
      cleanup_script_path:
        required: true
        type: string
      arguments_json:
        required: false
        default: "[]"
        type: string
      environment_json:
        required: false
        default: "{}"
        type: string
      max_duration_minutes:
        required: false
        default: 60
        type: number
      evidence_exception_id:
        required: false
        default: ""
        type: string
      request_id:
        required: true
        type: string
    secrets:
      device_authorization_receipt:
        required: false
    outputs:
      result:
        value: ${{ jobs.device.outputs.result || jobs.authorization_denied.outputs.result }}
      device_evidence_id:
        value: ${{ jobs.device.outputs.device_evidence_id || jobs.authorization_denied.outputs.device_evidence_id }}
      artifact_exception_used:
        value: ${{ jobs.device.outputs.artifact_exception_used || jobs.authorization_denied.outputs.artifact_exception_used }}
      request_id:
        value: ${{ jobs.plan.outputs.request_id }}

permissions:
  contents: read

jobs:
  plan:
    name: Derive bounded device plan
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      admitted_sha: ${{ steps.plan.outputs.admitted_sha }}
      request_id: ${{ steps.plan.outputs.request_id }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      execution_authorized: ${{ steps.plan.outputs.execution_authorized }}
      authorization_failure: ${{ steps.plan.outputs.authorization_failure }}
      concurrency_group: ${{ steps.plan.outputs.concurrency_group }}
      validated_plan: ${{ steps.plan.outputs.validated_plan }}
      validated_plan_sha256: ${{ steps.plan.outputs.validated_plan_sha256 }}
    steps:
      - id: plan
        name: Resolve product-neutral typed device plan
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: ${{ secrets.device_authorization_receipt != '' && 'true' || 'false' }}
          CIW_DEVICE_AUTHORIZATION_RECEIPT: ${{ secrets.device_authorization_receipt }}
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}

  authorization_denied:
    name: Fail closed without physical authorization
    needs: plan
    if: ${{ needs.plan.outputs.execution_authorized != 'true' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 5
    outputs:
      result: ${{ steps.denied.outputs.result }}
      device_evidence_id: ${{ steps.denied.outputs.device_evidence_id }}
      artifact_exception_used: ${{ steps.denied.outputs.artifact_exception_used }}
    steps:
      - id: denied
        name: Report stable physical authorization denial
        shell: bash
        env:
          FAILURE: ${{ needs.plan.outputs.authorization_failure }}
        run: |
          set -Eeuo pipefail
          test "$FAILURE" = physical_authorization_required
          {
            echo 'result=failure'
            echo 'device_evidence_id='
            echo 'artifact_exception_used=false'
          } >> "$GITHUB_OUTPUT"
          exit 1

  device:
    name: Execute authorized physical-device validation
    needs: plan
    if: ${{ needs.plan.outputs.execution_authorized == 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 240
    concurrency:
      group: ${{ needs.plan.outputs.concurrency_group }}
      cancel-in-progress: false
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      device_evidence_id: ${{ steps.execute.outputs.device_evidence_id }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Clear fixed exact-source root
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        with:
          phase: cleanup-checkout
          source_root: source

      - name: Check out exact admitted source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ needs.plan.outputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - name: Verify exact admitted source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - id: workspace
        name: Prepare one isolated device workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ needs.plan.outputs.admitted_sha }}
          trust_mode: trusted-exact

      - id: discover
        name: Deterministically discover one eligible physical device
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
          CIW_DEVICE_AUTHORIZATION_RECEIPT: ${{ secrets.device_authorization_receipt }}
        with:
          phase: discover
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}
          validated_plan: ${{ needs.plan.outputs.validated_plan }}
          validated_plan_sha256: ${{ needs.plan.outputs.validated_plan_sha256 }}
          source_root: source

      - id: acquire_lock
        name: Acquire production cross-run device fencing receipt
        if: ${{ steps.discover.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/device-lock@599c82201e6da6ca51c4f6247f1526a4ba03d550 # issue #136 exact-head checkpoint
        with:
          phase: acquire
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          device_identity_hash: ${{ steps.discover.outputs.selected_device_hash }}
          tested_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          authorization_receipt: ${{ secrets.device_authorization_receipt }}
          request_id: ${{ inputs.request_id }}
          lease_seconds: "18000"

      - id: verify_lock
        name: Verify exact fencing receipt before mutation
        if: ${{ steps.acquire_lock.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/device-lock@599c82201e6da6ca51c4f6247f1526a4ba03d550 # issue #136 exact-head checkpoint
        with:
          phase: verify
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          device_identity_hash: ${{ steps.discover.outputs.selected_device_hash }}
          tested_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          authorization_receipt: ${{ secrets.device_authorization_receipt }}
          request_id: ${{ inputs.request_id }}
          lease_seconds: "18000"
          resource_lock_receipt: ${{ steps.acquire_lock.outputs.resource_lock_receipt }}
          minimum_remaining_seconds: "60"

      - id: execute
        name: Execute only the exact typed plan emitted by the planner
        if: ${{ steps.verify_lock.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
          CIW_DEVICE_AUTHORIZATION_RECEIPT: ${{ secrets.device_authorization_receipt }}
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}
          validated_plan: ${{ needs.plan.outputs.validated_plan }}
          validated_plan_sha256: ${{ needs.plan.outputs.validated_plan_sha256 }}
          selected_device_hash: ${{ steps.discover.outputs.selected_device_hash }}
          resource_lock_receipt: ${{ steps.acquire_lock.outputs.resource_lock_receipt }}
          source_root: source

      - id: restore
        name: Restore caller-owned device state exactly once
        if: ${{ always() && steps.acquire_lock.outcome == 'success' && steps.discover.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
          CIW_DEVICE_AUTHORIZATION_RECEIPT: ${{ secrets.device_authorization_receipt }}
        with:
          phase: restore
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}
          validated_plan: ${{ needs.plan.outputs.validated_plan }}
          validated_plan_sha256: ${{ needs.plan.outputs.validated_plan_sha256 }}
          selected_device_hash: ${{ steps.discover.outputs.selected_device_hash }}
          resource_lock_receipt: ${{ steps.acquire_lock.outputs.resource_lock_receipt }}
          source_root: source

      - id: release_lock
        name: Expected-state release exact fencing receipt
        if: ${{ always() && steps.acquire_lock.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/device-lock@599c82201e6da6ca51c4f6247f1526a4ba03d550 # issue #136 exact-head checkpoint
        with:
          phase: release
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          device_identity_hash: ${{ steps.discover.outputs.selected_device_hash }}
          tested_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          authorization_receipt: ${{ secrets.device_authorization_receipt }}
          request_id: ${{ inputs.request_id }}
          lease_seconds: "18000"
          resource_lock_receipt: ${{ steps.acquire_lock.outputs.resource_lock_receipt }}

      - id: lock_residue
        name: Verify production fencing receipt has no live residue
        if: ${{ always() && steps.acquire_lock.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/device-lock@599c82201e6da6ca51c4f6247f1526a4ba03d550 # issue #136 exact-head checkpoint
        with:
          phase: residue
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          device_identity_hash: ${{ steps.discover.outputs.selected_device_hash }}
          tested_source_sha: ${{ needs.plan.outputs.admitted_sha }}
          authorization_receipt: ${{ secrets.device_authorization_receipt }}
          request_id: ${{ inputs.request_id }}
          lease_seconds: "18000"
          resource_lock_receipt: ${{ steps.acquire_lock.outputs.resource_lock_receipt }}

      - id: device_cleanup
        name: Remove device-specific Central state
        if: always()
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}
          validated_plan: ${{ needs.plan.outputs.validated_plan }}
          validated_plan_sha256: ${{ needs.plan.outputs.validated_plan_sha256 }}

      - id: device_residue
        name: Verify zero device-specific Central residue
        if: always()
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        env:
          CIW_DEVICE_AUTHORIZATION_PRESENT: "true"
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          device_family: ${{ inputs.device_family }}
          device_capability: ${{ inputs.device_capability }}
          host_capacity: ${{ inputs.host_capacity }}
          prepare_script_path: ${{ inputs.prepare_script_path }}
          test_script_path: ${{ inputs.test_script_path }}
          evidence_script_path: ${{ inputs.evidence_script_path }}
          cleanup_script_path: ${{ inputs.cleanup_script_path }}
          arguments_json: ${{ inputs.arguments_json }}
          environment_json: ${{ inputs.environment_json }}
          max_duration_minutes: ${{ inputs.max_duration_minutes }}
          evidence_exception_id: ${{ inputs.evidence_exception_id }}
          request_id: ${{ inputs.request_id }}
          validated_plan: ${{ needs.plan.outputs.validated_plan }}
          validated_plan_sha256: ${{ needs.plan.outputs.validated_plan_sha256 }}

      - id: source_cleanup
        name: Remove exact admitted source
        if: always()
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-device@4a6c73fd7bf901c2db6b19330ba0b879bc2bb3ae # issue #481 semantic authorization receipt transport checkpoint
        with:
          phase: cleanup-checkout
          source_root: source

      - id: workspace_cleanup
        name: Remove and verify registered workflow state
        if: always()
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: terminal
        name: Project terminal physical-device result after restore, release, and cleanup
        if: always()
        shell: bash
        env:
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          ACQUIRE_LOCK_OUTCOME: ${{ steps.acquire_lock.outcome }}
          VERIFY_LOCK_OUTCOME: ${{ steps.verify_lock.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          RELEASE_LOCK_OUTCOME: ${{ steps.release_lock.outcome }}
          LOCK_RESIDUE_OUTCOME: ${{ steps.lock_residue.outcome }}
          DEVICE_CLEANUP_OUTCOME: ${{ steps.device_cleanup.outcome }}
          DEVICE_RESIDUE_OUTCOME: ${{ steps.device_residue.outcome }}
          SOURCE_CLEANUP_OUTCOME: ${{ steps.source_cleanup.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          result=success
          for outcome in "$DISCOVER_OUTCOME" "$ACQUIRE_LOCK_OUTCOME" "$VERIFY_LOCK_OUTCOME" "$EXECUTE_OUTCOME" "$RESTORE_OUTCOME" "$RELEASE_LOCK_OUTCOME" "$LOCK_RESIDUE_OUTCOME" "$DEVICE_CLEANUP_OUTCOME" "$DEVICE_RESIDUE_OUTCOME" "$SOURCE_CLEANUP_OUTCOME" "$WORKSPACE_CLEANUP_OUTCOME"; do
            test "$outcome" = success || result=failure
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          test "$result" = success
