name: Apply issue 811 emulator ordering patch

"on":
  push:
    branches: ["issue/811-android-emulator-install-order"]
    paths: [".github/workflows/issue-811-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'StreamScapeTV/ci-workflows' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/811-android-emulator-install-order

      - name: Apply exact bounded patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/android.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          adb="$(command -v adb || true)"
          emulator="$(command -v emulator || true)"
          test -n "${sdkmanager}" || sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -n "${avdmanager}" || avdmanager="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          test -n "${emulator}" || emulator="${sdk_root}/emulator/emulator"
          for tool in "${sdkmanager}" "${avdmanager}" "${adb}" "${emulator}"; do
            test -x "${tool}" || {
              printf 'Required Android emulator tool is unavailable: %s\\n' "${tool}" >&2
              exit 1
            }
          done

          image='system-images;android-36;google_apis;x86_64'
          avd_name='central-android-api36'
          serial='emulator-5554'
          "${sdkmanager}" --install platform-tools emulator "${image}" >> "${CI_LOG}" 2>&1
'''
          new = '''          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          test -n "${sdkmanager}" || sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -n "${avdmanager}" || avdmanager="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          for tool in "${sdkmanager}" "${avdmanager}"; do
            test -x "${tool}" || {
              printf 'Required Android emulator install tool is unavailable: %s\\n' "${tool}" >&2
              exit 1
            }
          done

          image='system-images;android-36;google_apis;x86_64'
          avd_name='central-android-api36'
          serial='emulator-5554'
          "${sdkmanager}" --install platform-tools emulator "${image}" >> "${CI_LOG}" 2>&1

          adb="$(command -v adb || true)"
          emulator="$(command -v emulator || true)"
          test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          test -n "${emulator}" || emulator="${sdk_root}/emulator/emulator"
          for tool in "${adb}" "${emulator}"; do
            test -x "${tool}" || {
              printf 'Required Android emulator runtime tool is unavailable after install: %s\\n' "${tool}" >&2
              exit 1
            }
          done
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one emulator preparation block, got {text.count(old)}')
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_native_targeted_profiles.py')
          source = tests.read_text(encoding='utf-8')
          marker = '''        self.assertIn("targeted-unit)", command)
        self.assertIn("Transitional compatibility for active Agent State callers", command)

'''
          replacement = '''        self.assertIn("targeted-unit)", command)
        self.assertIn("Transitional compatibility for active Agent State callers", command)

    def test_android_instrumentation_installs_emulator_before_runtime_tool_checks(self) -> None:
        workflow = yaml.safe_load((ROOT / ".github/workflows/android.yml").read_text(encoding="utf-8"))
        prepare = next(
            step for step in workflow["jobs"]["ci"]["steps"]
            if step.get("name") == "Prepare generic Android emulator"
        )["run"]
        install = '\"${sdkmanager}\" --install platform-tools emulator \"${image}\"'
        preinstall_tools = 'for tool in \"${sdkmanager}\" \"${avdmanager}\"; do'
        runtime_tools = 'for tool in \"${adb}\" \"${emulator}\"; do'
        self.assertIn(preinstall_tools, prepare)
        self.assertIn(install, prepare)
        self.assertIn(runtime_tools, prepare)
        self.assertLess(prepare.index(preinstall_tools), prepare.index(install))
        self.assertLess(prepare.index(install), prepare.index('adb=\"$(command -v adb || true)\"'))
        self.assertLess(prepare.index(install), prepare.index('emulator=\"$(command -v emulator || true)\"'))
        self.assertLess(prepare.index(install), prepare.index(runtime_tools))
        self.assertNotIn(
            'for tool in \"${sdkmanager}\" \"${avdmanager}\" \"${adb}\" \"${emulator}\"; do',
            prepare,
        )
        self.assertIn("system-images;android-36;google_apis;x86_64", prepare)
        self.assertIn("avd_name='central-android-api36'", prepare)
        self.assertIn("serial='emulator-5554'", prepare)
        self.assertIn("seq 1 180", prepare)

'''
          if source.count(marker) != 1:
              raise SystemExit(f'expected exactly one test insertion marker, got {source.count(marker)}')
          tests.write_text(source.replace(marker, replacement), encoding='utf-8')
          PY

      - name: Validate focused Central contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/android.yml').read_text(encoding='utf-8'))
          print('android-yaml-ok')
          PY
          python3 -m unittest tests.test_ci_helpers_current tests.test_native_targeted_profiles -v

      - name: Commit exact candidate and remove staging workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/issue-811-apply.yml
          git add .github/workflows/android.yml tests/test_native_targeted_profiles.py .github/workflows/issue-811-apply.yml
          git config user.name 'StreamScapeTV Orchestrator'
          git config user.email '44291943+mimranfaruqi@users.noreply.github.com'
          git commit -m '[#811] Install emulator before runtime checks'
          git push origin HEAD:refs/heads/issue/811-android-emulator-install-order
