name: Apply issue 811 emulator ordering patch

"on":
  push:
    branches: ["issue/811-android-emulator-install-order"]
    paths: [".github/workflows/issue-811-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'StreamScapeTV/ci-workflows' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/811-android-emulator-install-order

      - name: Apply exact bounded patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          workflow = Path(".github/workflows/android.yml")
          text = workflow.read_text(encoding="utf-8")
          old = base64.b64decode("").decode("utf-8")
          new = base64.b64decode("").decode("utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Android emulator block, got {text.count(old)}")
          workflow.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/test_native_targeted_profiles.py")
          source = tests.read_text(encoding="utf-8")
          marker = base64.b64decode("ICAgICAgICBzZWxmLmFzc2VydEluKCJ0YXJnZXRlZC11bml0KSIsIGNvbW1hbmQpCiAgICAgICAgc2VsZi5hc3NlcnRJbigiVHJhbnNpdGlvbmFsIGNvbXBhdGliaWxpdHkgZm9yIGFjdGl2ZSBBZ2VudCBTdGF0ZSBjYWxsZXJzIiwgY29tbWFuZCkKCg==").decode("utf-8")
          insertion = base64.b64decode(" ").decode("utf-8")
          if source.count(marker) != 1:
              raise SystemExit(f"expected exactly one test insertion marker, got {source.count(marker)}")
          tests.write_text(source.replace(marker, marker + insertion), encoding="utf-8")
          PY

      - name: Validate focused Central contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path(".github/workflows/android.yml").read_text(encoding="utf-8"))
          print("android-yaml-ok")
          PY
          python3 -m unittest tests.test_ci_helpers_current tests.test_native_targeted_profiles -v

      - name: Commit exact candidate and remove staging workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/issue-811-apply.yml
          git add .github/workflows/android.yml tests/test_native_targeted_profiles.py .github/workflows/issue-811-apply.yml
          git config user.name "StreamScapeTV Orchestrator"
          git config user.email "44291943+mimranfaruqi@users.noreply.github.com"
          git commit -m "[#811] Install emulator before runtime checks"
          git push origin HEAD:refs/heads/issue/811-android-emulator-install-order
