name: R2 diagnostics smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-diagnostics-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify private R2 diagnostic transport
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: Check out exact Central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact Central source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Create synthetic diagnostic
        shell: bash
        env:
          DIAGNOSTIC_PATH: ${{ runner.temp }}/r2-diagnostics-smoke.log
        run: |
          set -Eeuo pipefail
          rm -f "${DIAGNOSTIC_PATH}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["DIAGNOSTIC_PATH"])
          path.write_text("synthetic Central R2 diagnostic smoke\n", encoding="utf-8")
          PY
          test -f "${DIAGNOSTIC_PATH}"

      - id: upload
        name: Upload and verify private R2 diagnostic
        shell: bash
        env:
          DIAGNOSTIC_PATH: ${{ runner.temp }}/r2-diagnostics-smoke.log
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/r2_diagnostics.py \
            --diagnostic "${DIAGNOSTIC_PATH}" \
            --request-id "smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --github-output "${GITHUB_OUTPUT}"
          echo "Private R2 diagnostic upload/read-back passed."

      - name: Retrieve and verify decompressed diagnostic
        shell: bash
        env:
          PYTHONPATH: src
          DIAGNOSTIC_PATH: ${{ runner.temp }}/r2-diagnostics-smoke.log
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
          R2_SHA256: ${{ steps.upload.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from ci_workflows.ci_diagnostics import (
              DiagnosticReadConfig,
              DiagnosticReader,
              encode_receipt_capability,
          )

          receipt = f"r2:{os.environ['R2_OBJECT_KEY']}#sha256={os.environ['R2_SHA256']}"
          capability = encode_receipt_capability(receipt)
          reader = DiagnosticReader(DiagnosticReadConfig.from_environment(os.environ))
          actual = reader.retrieve(capability)
          expected = Path(os.environ["DIAGNOSTIC_PATH"]).read_bytes()
          if actual != expected:
              raise SystemExit("private R2 diagnostic round-trip mismatch")
          print("Private R2 diagnostic retrieval round trip passed.")
          PY

      - name: Remove local smoke diagnostic
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_PATH: ${{ runner.temp }}/r2-diagnostics-smoke.log
        run: |
          set -Eeuo pipefail
          rm -f "${DIAGNOSTIC_PATH}"
          test ! -e "${DIAGNOSTIC_PATH}"
