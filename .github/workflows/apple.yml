# LEGACY_MIGRATION_RESIDUE: Concrete consumer identity below is retained only for still-live compatibility; do not add new identity-coupled behavior, and remove it only after the private migration ledger proves zero callers.
name: Apple TestFlight

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      release_version:
        type: string
        required: false
        default: ""
      build_number:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      FORGEJO_REGISTRY_USERNAME:
        required: false
      CIW_MAVEN_PACKAGE_READ_TOKEN:
        required: false
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_BASE64:
        required: false
      APPLE_DISTRIBUTION_P12_BASE64:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Resolve fixed Apple execution lanes
        id: profile
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -Eeuo pipefail
          if test "${TEST_PROFILE}" = testflight; then
            case "${SOURCE_IS_TAG:-false}" in
              true) [[ "${RELEASE_VERSION:-}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Tag-driven TestFlight release requires a bounded dotted release_version" >&2; exit 2; } ;;
              false) test -z "${RELEASE_VERSION:-}" || { echo "Manual TestFlight release does not accept release_version" >&2; exit 2; } ;;
              *) echo "TestFlight source_is_tag must be true or false" >&2; exit 2 ;;
            esac
          else
            test -z "${RELEASE_VERSION:-}" || { echo "release_version is accepted only by testflight" >&2; exit 2; }
          fi
          case "${TEST_PROFILE}" in
            testflight)
              matrix='{"include":[{"lane":"testflight","cache_save":false}]}'
              ;;
            *) echo "Unsupported retained Apple test_profile: ${TEST_PROFILE}" >&2; exit 2 ;;
          esac
          printf 'matrix=%s
          ' "${matrix}" >> "${GITHUB_OUTPUT}"

  execute:
    needs: plan
    name: ${{ matrix.lane }}
    runs-on: macos-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Initialize CI log
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          log="${RUNNER_TEMP}/central-ci-${LANE}.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          permission-contents: read
          permission-metadata: read

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.source_is_tag && format('refs/tags/{0}', inputs.ref) || inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9A-Fa-f]{40}$ ]] || exit 2
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Check out Central Apple helpers
        if: ${{ inputs.test_profile == 'testflight' || inputs.ci_run_id != '' || inputs.upload_private_log }}
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.sha }}
          path: central-ci
          persist-credentials: false

      - name: Isolate Central Apple helpers from product source
        if: ${{ inputs.test_profile == 'testflight' || inputs.ci_run_id != '' || inputs.upload_private_log }}
        shell: bash
        run: |
          helper_root="$(mktemp -d "${RUNNER_TEMP}/central-apple-helpers.XXXXXX")"
          mv "${GITHUB_WORKSPACE}/central-ci" "${helper_root}/source"
          echo "CENTRAL_APPLE_HELPERS=${helper_root}/source" >> "${GITHUB_ENV}"

      - name: Resolve native Apple dependency cache
        id: apple_default_cache
        if: ${{ inputs.test_profile == 'testflight' }}
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: python3 "${CENTRAL_APPLE_HELPERS}/scripts/ci/apple_dependency_cache.py"

      - name: Restore native Apple binary artifacts
        id: apple_default_cache_restore
        if: ${{ steps.apple_default_cache.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.apple_default_cache.outputs.path }}
          key: ${{ steps.apple_default_cache.outputs.key }}

      - name: Record native Apple dependency cache
        if: ${{ steps.apple_default_cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apple_default_cache_restore.outputs.cache-hit }}
        run: printf '\n===== apple-binary-cache =====\ncache_hit=%s\n' "${CACHE_HIT:-false}" >> "${CI_LOG}"

      - name: Connect to private Git service for Apple dependency materialization
        if: >-
          ${{ (inputs.repository || github.repository) == 'StreamScapeTV/iptv-apple' }}
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Materialize fixed Streamscape Media Apple dependency
        if: >-
          ${{ (inputs.repository || github.repository) == 'StreamScapeTV/iptv-apple' && (inputs.test_profile == 'testflight' || hashFiles('scripts/bootstrap-streamscape-media-binary.sh') != '') }}
        shell: bash
        env:
          CI_APPLE_BINARY_PACKAGE_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CI_APPLE_BINARY_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_APPLE_BINARY_PACKAGE_HOST: git.faruqi.dev
          CI_APPLE_BINARY_PACKAGE_BASE_PATH: /api/packages/mimranfaruqi/generic
        run: |
          set -Eeuo pipefail
          test -n "${CI_APPLE_BINARY_PACKAGE_USERNAME}" || {
            echo 'Missing fixed Forgejo package username for Apple dependency materialization' >&2
            exit 1
          }
          test -n "${CI_APPLE_BINARY_PACKAGE_READ_TOKEN}" || {
            echo 'Missing fixed Forgejo package read token for Apple dependency materialization' >&2
            exit 1
          }

          helper="scripts/bootstrap-streamscape-media-binary.sh"
          test -f "${helper}" || {
            printf 'Missing required Apple bootstrap helper: %s\n' "${helper}" >&2
            exit 1
          }

          printf '\n===== prepare-media =====\n' >> "${CI_LOG}"
          if ! bash "${helper}" >> "${CI_LOG}" 2>&1; then
            echo 'prepare-media failed; inspect the private Google Drive CI log.' >&2
            exit 1
          fi

      - name: Prepare ephemeral Apple Distribution signing identity
        if: ${{ inputs.test_profile == 'testflight' }}
        shell: bash
        env:
          CI_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI_APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CI_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -Eeuo pipefail
          python3 "${CENTRAL_APPLE_HELPERS}/scripts/ci/apple_credential_preflight.py" distribution-setup

      - name: Prepare fixed TestFlight release context
        id: testflight_prepare
        if: ${{ inputs.test_profile == 'testflight' }}
        shell: bash
        env:
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "${BUILD_NUMBER}" || {
            printf 'TestFlight requires an explicit caller build_number.\n' >&2
            exit 2
          }
          if (( ${#BUILD_NUMBER} > 64 )) || [[ ! "${BUILD_NUMBER}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            printf 'TestFlight build_number must be a bounded scalar release identifier.\n' >&2
            exit 2
          fi
          case "${SOURCE_IS_TAG}" in
            true)
              [[ "${RELEASE_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || {
                printf 'Tag-driven TestFlight release requires a bounded dotted release_version.\n' >&2
                exit 2
              }
              [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]] || {
                printf 'Tag-driven TestFlight build_number must be a positive decimal build.\n' >&2
                exit 2
              }
              (( BUILD_NUMBER < 9999999999 )) || {
                printf 'Tag-driven TestFlight build_number must leave room for the next bounded build.\n' >&2
                exit 2
              }
              ;;
            false)
              test -z "${RELEASE_VERSION}" || {
                printf 'Manual TestFlight release does not accept release_version.\n' >&2
                exit 2
              }
              ;;
            *) printf 'TestFlight source_is_tag must be true or false.\n' >&2; exit 2 ;;
          esac
          test -n "${APP_STORE_CONNECT_KEY_ID}"
          test -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64}"

          release_root="${RUNNER_TEMP}/central-apple-testflight"
          key_path="${release_root}/AuthKey.p8"
          rm -rf -- "${release_root}"
          mkdir -p "${release_root}"
          chmod 700 "${release_root}"

          KEY_PATH="${key_path}" python3 - <<'PY_KEY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"]
          try:
              key = base64.b64decode(raw, validate=True)
          except Exception as error:
              raise SystemExit("App Store Connect API key is not valid base64") from error
          if not key.startswith(b"-----BEGIN PRIVATE KEY-----") or b"-----END PRIVATE KEY-----" not in key:
              raise SystemExit("decoded App Store Connect API key is not a PKCS#8 private key")
          path = Path(os.environ["KEY_PATH"])
          path.write_bytes(key)
          path.chmod(0o600)
          PY_KEY

          test "$(stat -f '%Lp' "${key_path}")" = 600
          {
            printf 'CI_APPLE_TESTFLIGHT_SOURCE_IS_TAG=%s\n' "${SOURCE_IS_TAG}"
            printf 'CI_APPLE_TESTFLIGHT_RELEASE_VERSION=%s\n' "${RELEASE_VERSION}"
            printf 'CI_APPLE_TESTFLIGHT_BUILD_NUMBER=%s\n' "${BUILD_NUMBER}"
            printf 'CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH=%s\n' "${key_path}"
            printf 'CI_APPLE_TESTFLIGHT_TEMP_DIR=%s\n' "${release_root}"
          } >> "${GITHUB_ENV}"

      - name: Preflight tag-driven Apple post-publication bump
        id: mobile_bump_contract
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag }}
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token || github.token }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_REPOSITORY}" =~ ^StreamScapeTV/[A-Za-z0-9_.-]{1,100}$ ]] || {
            echo "Tag-driven TestFlight release requires one bounded StreamScapeTV repository" >&2
            exit 2
          }
          wrapper="scripts/ci/advance-mobile-build.sh"
          test -f "${wrapper}" && test ! -L "${wrapper}" || {
            echo "Tag-driven TestFlight release requires the regular product-owned mobile build bump wrapper" >&2
            exit 2
          }
          git ls-files --error-unmatch -- "${wrapper}" >/dev/null 2>&1 || {
            echo "Mobile build bump wrapper must be tracked product source" >&2
            exit 2
          }
          test -n "${SOURCE_TOKEN}" || {
            echo "Tag-driven TestFlight release requires the fixed source token before publication" >&2
            exit 2
          }
          repository_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}")"
          default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))')"
          test -n "${default_branch}" && git check-ref-format --branch "${default_branch}" >/dev/null || {
            echo "Tag-driven TestFlight release could not resolve the product default development branch" >&2
            exit 2
          }
          printf 'repository_name=%s\n' "${SOURCE_REPOSITORY#StreamScapeTV/}" >> "${GITHUB_OUTPUT}"
          printf 'default_branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"

      - name: Prepare private Apple log checkpoint seed
        if: ${{ inputs.ci_run_id != '' || inputs.upload_private_log }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          EXECUTION_LANE: ${{ matrix.lane }}
        run: |
          set -Eeuo pipefail
          seed="${RUNNER_TEMP}/central-apple-log-seed.txt"
          printf 'Apple native execution run=%s attempt=%s lane=%s source=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${EXECUTION_LANE}" "${SOURCE_SHA}" > "${seed}"
          chmod 600 "${seed}"

      - name: Seed stable private Apple CI log object
        id: log_seed
        if: ${{ inputs.ci_run_id != '' || inputs.upload_private_log }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-apple-log-seed.txt
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}.txt
          mime_type: text/plain

      - name: Run fixed Apple lane
        id: commands
        shell: bash
        env:
          CHECKPOINT_ENABLED: ${{ (inputs.ci_run_id != '' || inputs.upload_private_log) && steps.log_seed.outcome == 'success' && 'true' || 'false' }}
          CHECKPOINT_FILE_ID: ${{ steps.log_seed.outputs.file_id }}
          CHECKPOINT_SEED_SHA256: ${{ steps.log_seed.outputs.file_sha256 }}
          CHECKPOINT_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CHECKPOINT_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CHECKPOINT_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_REPOSITORIES_FOLDER: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_FORGEJO_PACKAGE_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CI_SECRET_FORGEJO_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_APPLE_TEAM_ID: ${{ inputs.test_profile == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_KEY_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_API_KEY: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
          EXECUTION_LANE: ${{ matrix.lane }}
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          OBSERVED_SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          GH_TOKEN: ${{ steps.source.outputs.token || github.token }}
          CI_APPLE_TESTFLIGHT_SOURCE_IS_TAG: ${{ env.CI_APPLE_TESTFLIGHT_SOURCE_IS_TAG }}
          CI_APPLE_TESTFLIGHT_RELEASE_VERSION: ${{ env.CI_APPLE_TESTFLIGHT_RELEASE_VERSION }}
          CI_APPLE_TESTFLIGHT_TEAM_ID: ${{ inputs.test_profile == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
          CI_APPLE_TESTFLIGHT_KEY_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_APPLE_TESTFLIGHT_ISSUER_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
        run: |
          set -Eeuo pipefail
          printf '\n===== fixed Apple lane admission =====\n' >> "${CI_LOG}"
          checkpoint_pid=""
          stop_checkpoint() {
            if test -n "${checkpoint_pid}"; then
              kill -TERM "${checkpoint_pid}" 2>/dev/null || true
              if wait "${checkpoint_pid}"; then
                :
              else
                echo "::warning::Apple log checkpoint exited with a failure; native result and final upload are preserved" >&2
              fi
              checkpoint_pid=""
            fi
          }
          retain_lane_exit() {
            local result="$?"
            if test "${result}" -ne 0; then
              printf 'Fixed Apple lane failed before or during product execution; exit_code=%s\n' "${result}" >> "${CI_LOG}"
            fi
            stop_checkpoint
            exit "${result}"
          }
          trap retain_lane_exit EXIT
          trap 'exit 143' TERM INT
          if test "${CHECKPOINT_ENABLED:-false}" = true; then
            GOOGLE_DRIVE_CLIENT_ID="${CHECKPOINT_GOOGLE_DRIVE_CLIENT_ID}" \
            GOOGLE_DRIVE_CLIENT_SECRET="${CHECKPOINT_GOOGLE_DRIVE_CLIENT_SECRET}" \
            GOOGLE_DRIVE_REFRESH_TOKEN="${CHECKPOINT_GOOGLE_DRIVE_REFRESH_TOKEN}" \
            python3 "${CENTRAL_APPLE_HELPERS}/scripts/ci/repository_log_checkpoint.py" \
              --log-path "${CI_LOG}" \
              --file-id "${CHECKPOINT_FILE_ID}" \
              --seed-sha256 "${CHECKPOINT_SEED_SHA256}" \
              --status-path "${RUNNER_TEMP}/central-apple-log-checkpoint-status.json" &
            checkpoint_pid=$!
          fi
          run_logged() {
            local label="$1"
            shift
            local started_at="${SECONDS}"
            printf '\n===== %s =====\n' "${label}" >> "${CI_LOG}"
            if ! "$@" >> "${CI_LOG}" 2>&1; then
              printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "${CI_LOG}"
              printf '%s failed; inspect the private Google Drive CI log.\n' "${label}" >&2
              return 1
            fi
            printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "${CI_LOG}"
          }

          case "${TEST_PROFILE}" in
            testflight)
              wrapper="scripts/ci/run-apple-testflight.sh"
              test -f "${wrapper}" || {
                printf 'Missing fixed Apple TestFlight wrapper: %s\n' "${wrapper}" >&2
                exit 2
              }
              test ! -L "${wrapper}" || {
                printf 'Apple TestFlight wrapper must not be a symlink: %s\n' "${wrapper}" >&2
                exit 2
              }
              git ls-files --error-unmatch -- "${wrapper}" >/dev/null 2>&1 || {
                printf 'Apple TestFlight wrapper must be tracked source: %s\n' "${wrapper}" >&2
                exit 2
              }
              case "${CI_APPLE_TESTFLIGHT_SOURCE_IS_TAG:-}" in true|false) ;; *) echo "TestFlight source identity mode is unavailable" >&2; exit 2 ;; esac
              if test "${CI_APPLE_TESTFLIGHT_SOURCE_IS_TAG}" = true; then
                test -n "${CI_APPLE_TESTFLIGHT_RELEASE_VERSION:-}"
              else
                test -z "${CI_APPLE_TESTFLIGHT_RELEASE_VERSION:-}"
              fi
              test -n "${CI_APPLE_TESTFLIGHT_BUILD_NUMBER:-}"
              test -n "${CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH:-}"
              test -f "${CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH}"
              test -n "${CI_APPLE_TESTFLIGHT_TEMP_DIR:-}"
              test -n "${CI_APPLE_TESTFLIGHT_TEAM_ID}"
              test -n "${CI_APPLE_TESTFLIGHT_KEY_ID}"
              test -n "${CI_APPLE_TESTFLIGHT_ISSUER_ID}"
              run_logged apple-testflight bash "${wrapper}"
              exit 0
              ;;
          esac

      - name: Clean TestFlight credential and release state
        id: testflight_cleanup
        if: ${{ always() && inputs.test_profile == 'testflight' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/central-apple-testflight"
          rm -rf -- "${release_root}"
          test ! -e "${release_root}"

      - name: Restore and delete ephemeral Apple Distribution signing identity
        if: ${{ always() && inputs.test_profile == 'testflight' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "${CENTRAL_APPLE_HELPERS}/scripts/ci/apple_credential_preflight.py" distribution-cleanup

      - name: Check out Apple development branch for isolated bump staging
        id: mobile_bump_stage_checkout
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.commands.outcome == 'success' && steps.testflight_cleanup.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          path: central-mobile-build-bump-stage-source
          persist-credentials: false

      - name: Prepare Git-metadata-free Apple build bump staging
        id: mobile_bump_stage
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.mobile_bump_stage_checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_checkout="${GITHUB_WORKSPACE}/central-mobile-build-bump-stage-source"
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          expected_head="$(git -C "${source_checkout}" rev-parse HEAD)"
          [[ "${expected_head}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git -C "${source_checkout}" status --porcelain --untracked-files=all)" || {
            echo "Apple development branch staging checkout is not clean" >&2
            exit 1
          }
          rm -rf -- "${staging}"
          mkdir -p "${staging}"
          tar -C "${source_checkout}" --exclude='./.git' -cf - . | tar -C "${staging}" -xf -
          test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Apple mobile build staging copy unexpectedly contains Git metadata" >&2
            exit 1
          }
          printf 'expected_head=%s\n' "${expected_head}" >> "${GITHUB_OUTPUT}"
          rm -rf -- "${source_checkout}"
          test ! -e "${source_checkout}"

      - name: Run product-owned Apple build bump in isolated staging tree
        id: mobile_bump_product
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.mobile_bump_stage.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -Eeuo pipefail
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          wrapper="${GITHUB_WORKSPACE}/scripts/ci/advance-mobile-build.sh"
          test -d "${staging}" && test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Apple product build bump staging tree must remain Git-metadata-free" >&2
            exit 1
          }
          export CI_MOBILE_RELEASE_VERSION="${RELEASE_VERSION}"
          export CI_MOBILE_RELEASE_BUILD_NUMBER="${RELEASE_BUILD_NUMBER}"
          export CI_MOBILE_BUMP_WORKTREE="${staging}"
          printf '\n===== apple-mobile-build-bump-product =====\n' >> "${CI_LOG}"
          if ! env -u TARGET_TOKEN -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE bash "${wrapper}" >> "${CI_LOG}" 2>&1; then
            echo "TestFlight publication succeeded, but the isolated next development build-number mutation failed; rerun the same tag to repair without republishing" >&2
            exit 1
          fi
          test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Apple mobile build bump wrapper must not create Git metadata; Central owns repository transport" >&2
            exit 1
          }

      - name: Check out current Apple development branch for post-publication bump
        id: mobile_bump_checkout
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.mobile_bump_product.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          path: central-mobile-build-bump
          persist-credentials: false

      - name: Validate Apple staged build bump output
        id: mobile_bump_validate
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.mobile_bump_checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.mobile_bump_stage.outputs.expected_head }}
        run: |
          set -Eeuo pipefail
          target="${GITHUB_WORKSPACE}/central-mobile-build-bump"
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          baseline="${RUNNER_TEMP}/central-mobile-build-bump-baseline"
          diff_file="${RUNNER_TEMP}/central-mobile-build-bump.diff"
          test "$(git -C "${target}" rev-parse HEAD)" = "${EXPECTED_HEAD}" || {
            echo "Apple development branch moved while the isolated bump wrapper ran; rerun the same tag to repair without republishing" >&2
            exit 1
          }
          test -z "$(git -C "${target}" status --porcelain --untracked-files=all)" || {
            echo "Post-publication Apple build bump validation checkout is not clean" >&2
            exit 1
          }
          test -d "${staging}" && test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Apple staged build bump output contains forbidden Git metadata" >&2
            exit 1
          }
          rm -rf -- "${baseline}"
          mkdir -p "${baseline}"
          tar -C "${target}" --exclude='./.git' -cf - . | tar -C "${baseline}" -xf -
          set +e
          git diff --no-index --no-renames --name-status -- "${baseline}" "${staging}" > "${diff_file}"
          diff_status=$?
          set -e
          test "${diff_status}" -le 1 || {
            echo "Apple staged build bump comparison failed" >&2
            exit 1
          }
          if test "${diff_status}" = 0; then
            printf 'changed=false\ncanonical_path=\n' >> "${GITHUB_OUTPUT}"
            printf 'Apple mobile build already advanced after the accepted release; no source mutation is required.\n' >> "${CI_LOG}"
            exit 0
          fi
          test "$(wc -l < "${diff_file}" | tr -d '[:space:]')" = 1 || {
            echo "Apple mobile build bump changed more than one tracked product file" >&2
            exit 1
          }
          diff_line="$(cat "${diff_file}")"
          diff_kind="${diff_line%%$'\t'*}"
          candidate="${diff_line#*$'\t'}"
          test "${diff_kind}" = M || {
            echo "Apple mobile build bump must modify exactly one existing product file" >&2
            exit 1
          }
          case "${candidate}" in
            "${baseline}"/*) canonical_path="${candidate#${baseline}/}" ;;
            *) echo "Apple mobile build bump comparison returned an unexpected path" >&2; exit 1 ;;
          esac
          [[ "${canonical_path}" =~ ^[A-Za-z0-9._/-]{1,240}$ ]] || {
            echo "Apple mobile build bump target path is not bounded" >&2
            exit 1
          }
          case "/${canonical_path}/" in
            */../*|*/./*) echo "Apple mobile build bump target path is not canonical" >&2; exit 1 ;;
          esac
          test -f "${staging}/${canonical_path}" && test ! -L "${staging}/${canonical_path}" || {
            echo "Apple staged mobile build bump target is not one regular file" >&2
            exit 1
          }
          test -f "${target}/${canonical_path}" && test ! -L "${target}/${canonical_path}" || {
            echo "Apple mobile build bump target is not one regular tracked file" >&2
            exit 1
          }
          git -C "${target}" ls-files --error-unmatch -- "${canonical_path}" >/dev/null 2>&1 || {
            echo "Apple mobile build bump target must already be tracked" >&2
            exit 1
          }
          cp -- "${staging}/${canonical_path}" "${target}/${canonical_path}"
          git -C "${target}" diff --check -- "${canonical_path}"
          test -z "$(git -C "${target}" diff --cached --name-only)"
          test -z "$(git -C "${target}" ls-files --others --exclude-standard)"
          changed_paths="$(git -C "${target}" diff --name-only)"
          test "${changed_paths}" = "${canonical_path}" || {
            echo "Apple mobile build bump import did not produce exactly one trusted tracked-file delta" >&2
            exit 1
          }
          printf 'changed=true\ncanonical_path=%s\n' "${canonical_path}" >> "${GITHUB_OUTPUT}"

      - name: Create post-publication Apple build bump token
        id: mobile_bump_token
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.commands.outcome == 'success' && steps.testflight_cleanup.outcome == 'success' && steps.mobile_bump_validate.outcome == 'success' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.mobile_bump_contract.outputs.repository_name }}
          permission-contents: write
          permission-metadata: read

      - name: Advance and publish next Apple build number
        id: mobile_bump
        if: ${{ inputs.test_profile == 'testflight' && inputs.source_is_tag && steps.mobile_bump_token.outcome == 'success' }}
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.mobile_bump_token.outputs.token }}
          TARGET_BRANCH: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_HEAD: ${{ steps.mobile_bump_stage.outputs.expected_head }}
          CHANGED: ${{ steps.mobile_bump_validate.outputs.changed }}
          CANONICAL_PATH: ${{ steps.mobile_bump_validate.outputs.canonical_path }}
        run: |
          set -Eeuo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          CI_MOBILE_RELEASE_VERSION="${RELEASE_VERSION}"
          CI_MOBILE_RELEASE_BUILD_NUMBER="${RELEASE_BUILD_NUMBER}"
          CI_MOBILE_BUMP_WORKTREE="${GITHUB_WORKSPACE}/central-mobile-build-bump"
          target="${CI_MOBILE_BUMP_WORKTREE}"
          expected_head="${EXPECTED_HEAD}"
          if test "${CHANGED}" != true; then
            printf 'Apple mobile build already advanced after the accepted release; no source mutation is required.\n' >> "${CI_LOG}"
            exit 0
          fi
          canonical_path="${CANONICAL_PATH}"
          test "$(printf '%s\n' "${canonical_path}" | wc -l | tr -d '[:space:]')" = 1 || {
            echo "Apple mobile build bump changed more than one tracked product file" >&2
            exit 1
          }
          test "$(git -C "${target}" rev-parse HEAD)" = "${expected_head}" || {
            echo "Apple validated build bump checkout moved before Central transport" >&2
            exit 1
          }
          test "$(git -C "${target}" diff --name-only)" = "${canonical_path}"
          test -z "$(git -C "${target}" diff --cached --name-only)"
          test -z "$(git -C "${target}" ls-files --others --exclude-standard)"
          test -f "${target}/${canonical_path}" && test ! -L "${target}/${canonical_path}"
          git -C "${target}" ls-files --error-unmatch -- "${canonical_path}" >/dev/null 2>&1
          git -C "${target}" diff --check -- "${canonical_path}"
          git -C "${target}" add -- "${canonical_path}"
          test "$(git -C "${target}" diff --cached --name-only)" = "${canonical_path}"
          test -z "$(git -C "${target}" diff --name-only)"
          next_build="$((RELEASE_BUILD_NUMBER + 1))"
          auth="$(printf 'x-access-token:%s' "${TARGET_TOKEN}" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth}"
          remote_head="$(git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${expected_head}" || {
            echo "Apple development branch moved after TestFlight accepted the release; rerun the same tag to repair the bump without republishing" >&2
            exit 1
          }
          git -C "${target}" -c core.hooksPath=/dev/null -c user.name='StreamScapeTV CI' -c user.email='ci@streamscape.invalid' \
            commit --no-verify --no-gpg-sign -m "chore: advance mobile build to ${next_build}"
          commit_sha="$(git -C "${target}" rev-parse HEAD)"
          test "$(git -C "${target}" rev-parse HEAD^)" = "${expected_head}"
          git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --porcelain origin "${commit_sha}:refs/heads/${TARGET_BRANCH}"
          confirmed="$(git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${confirmed}" = "${commit_sha}" || {
            echo "Apple next-build push could not be read back exactly" >&2
            exit 1
          }

      - name: Clean post-publication Apple build bump workspace
        id: mobile_bump_cleanup
        if: ${{ always() && inputs.test_profile == 'testflight' && inputs.source_is_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- \
            "${GITHUB_WORKSPACE}/central-mobile-build-bump-stage-source" \
            "${GITHUB_WORKSPACE}/central-mobile-build-bump" \
            "${RUNNER_TEMP}/central-mobile-build-bump-stage" \
            "${RUNNER_TEMP}/central-mobile-build-bump-baseline"
          rm -f -- "${RUNNER_TEMP}/central-mobile-build-bump.diff"

      - name: Report post-publication TestFlight bump failure
        if: >-
          ${{
            always() && inputs.test_profile == 'testflight' && inputs.source_is_tag &&
            steps.commands.outcome == 'success' &&
            (
              steps.testflight_cleanup.outcome != 'success' ||
              steps.mobile_bump_stage_checkout.outcome != 'success' ||
              steps.mobile_bump_stage.outcome != 'success' ||
              steps.mobile_bump_product.outcome != 'success' ||
              steps.mobile_bump_checkout.outcome != 'success' ||
              steps.mobile_bump_validate.outcome != 'success' ||
              steps.mobile_bump_token.outcome != 'success' ||
              steps.mobile_bump.outcome != 'success' ||
              steps.mobile_bump_cleanup.outcome != 'success'
            )
          }}
        shell: bash
        run: |
          echo "TestFlight publication succeeded, but the development build-number advance is incomplete. Rerun the same tag after correcting the bump failure; the product release wrapper must reconcile the already-accepted version/build without re-uploading it." >&2
          exit 1

      - name: Save native Apple binary artifacts
        if: >-
          ${{ steps.apple_default_cache.outputs.enabled == 'true'
              && steps.apple_default_cache_restore.outputs.cache-hit != 'true'
              && steps.commands.outcome == 'success'
              && github.event_name != 'pull_request'
              && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.apple_default_cache.outputs.path }}
          key: ${{ steps.apple_default_cache.outputs.key }}

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_MOBILE_BUMP_TOKEN: ${{ steps.mobile_bump_token.outputs.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_REPOSITORIES_FOLDER: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_FORGEJO_PACKAGE_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          CI_SECRET_FORGEJO_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_APPLE_TEAM_ID: ${{ inputs.test_profile == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_KEY_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_API_KEY: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci-${{ matrix.lane }}.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}.txt
          mime_type: text/plain

      - name: Preserve log on private owning issue after Drive failure
        if: ${{ always() && steps.drive.outcome == 'failure' && steps.scrub.outcome == 'success' && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/private-log-fallback@main
        env:
          SOURCE_APP_ID: ${{ secrets.SOURCE_APP_ID }}
          SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          ci_run_id: ${{ inputs.ci_run_id }}
          lane: ${{ matrix.lane }}
          log_path: ${{ runner.temp }}/central-ci-${{ matrix.lane }}.log

  finish:
    needs:
      - plan
      - execute
    if: ${{ always() && inputs.ci_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Finish Agent State run
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ (needs.plan.result == 'cancelled' || needs.execute.result == 'cancelled') && 'cancelled' || (needs.plan.result == 'success' && needs.execute.result == 'success') && 'succeeded' || 'failed' }}
