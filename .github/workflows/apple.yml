name: Apple CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      test_selectors:
        type: string
        required: false
        default: "[]"
      test_platform:
        type: string
        required: false
        default: ""
      build_number:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_BASE64:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Resolve fixed Apple execution lanes
        id: profile
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          TEST_PLATFORM: ${{ inputs.test_platform }}
        run: |
          set -Eeuo pipefail
          case "${TEST_PROFILE}" in
            targeted-tests)
              ;;
            candidate)
              test -z "${TEST_PLATFORM}" || {
                echo "candidate fixes macOS test execution and does not accept test_platform" >&2
                exit 2
              }
              ;;
            *)
              test "${TEST_SELECTORS}" = "[]" || {
                echo "test_selectors is accepted only by targeted-tests or candidate" >&2
                exit 2
              }
              test -z "${TEST_PLATFORM}" || {
                echo "test_platform is accepted only by targeted-tests" >&2
                exit 2
              }
              ;;
          esac
          case "${TEST_PROFILE}" in
            build)
              matrix='{"include":[{"lane":"hosted-build","cache_save":false}]}'
              ;;
            test)
              matrix='{"include":[{"lane":"hosted-test","cache_save":false}]}'
              ;;
            simulator)
              matrix='{"include":[{"lane":"hosted-simulator","cache_save":false}]}'
              ;;
            host)
              matrix='{"include":[{"lane":"macos-test","cache_save":true}]}'
              ;;
            targeted-tests)
              case "${TEST_PLATFORM}" in
                macos) matrix='{"include":[{"lane":"macos-targeted-tests","cache_save":false}]}' ;;
                ios) matrix='{"include":[{"lane":"ios-targeted-tests","cache_save":false}]}' ;;
                tvos) matrix='{"include":[{"lane":"tvos-targeted-tests","cache_save":false}]}' ;;
                *) echo "targeted-tests requires test_platform=macos, ios, or tvos" >&2; exit 2 ;;
              esac
              ;;
            candidate)
              matrix='{"include":[{"lane":"ios-build","cache_save":false},{"lane":"tvos-build","cache_save":false},{"lane":"macos-targeted-tests","cache_save":true}]}'
              ;;
            full)
              matrix='{"include":[{"lane":"ios-build","cache_save":false},{"lane":"tvos-build","cache_save":false},{"lane":"macos-test","cache_save":true}]}'
              ;;
            release-build)
              matrix='{"include":[{"lane":"release-build","cache_save":true}]}'
              ;;
            testflight)
              matrix='{"include":[{"lane":"testflight","cache_save":false}]}'
              ;;
            swift-package)
              matrix='{"include":[{"lane":"swift-package","cache_save":false}]}'
              ;;
            *)
              printf 'Unsupported Apple test_profile: %s\n' "${TEST_PROFILE}" >&2
              exit 2
              ;;
          esac
          if test "${TEST_PROFILE}" = targeted-tests || test "${TEST_PROFILE}" = candidate; then
            TEST_SELECTORS_JSON="${TEST_SELECTORS}" TEST_PROFILE_NAME="${TEST_PROFILE}" python3 - <<'PY_TEST_SELECTORS'
          import json
          import os
          import re

          profile = os.environ.get("TEST_PROFILE_NAME", "targeted-tests")
          raw = os.environ.get("TEST_SELECTORS_JSON", "")
          if len(raw) > 2048:
              raise SystemExit(f"{profile} test_selectors payload is too large")
          try:
              values = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"{profile} test_selectors must be valid JSON") from exc
          if not isinstance(values, list) or not 1 <= len(values) <= 20:
              raise SystemExit(f"{profile} requires 1 through 20 test selectors")
          if any(not isinstance(value, str) for value in values):
              raise SystemExit(f"{profile} selectors must be strings")
          if len(values) != len(set(values)):
              raise SystemExit(f"{profile} test selectors must be unique")
          pattern = re.compile(r"[A-Za-z0-9_.$/-]{1,240}")
          for value in values:
              if (
                  not pattern.fullmatch(value)
                  or value.startswith("-")
                  or "/" not in value
              ):
                  raise SystemExit(f"{profile} contains an invalid Apple test selector")
          PY_TEST_SELECTORS
          fi
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  execute:
    needs: plan
    name: ${{ matrix.lane }}
    runs-on: ${{ fromJSON(((inputs.repository || github.repository) == 'StreamScapeTV/streamscape-media' && inputs.test_profile == 'build') && '["macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Initialize CI log
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          log="${RUNNER_TEMP}/central-ci-${LANE}.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9A-Fa-f]{40}$ ]] || exit 2
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Resolve Apple default-branch dependency cache scope
        id: apple_default_cache
        if: >-
          ${{ inputs.test_profile != 'build'
              && inputs.test_profile != 'test'
              && inputs.test_profile != 'simulator'
              && inputs.test_profile != 'testflight' }}
        shell: bash
        env:
          REQUEST_REPOSITORY: ${{ inputs.repository }}
          REQUEST_REF: ${{ inputs.ref }}
          REQUEST_IS_TAG: ${{ inputs.source_is_tag }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -Eeuo pipefail
          source_repository="${REQUEST_REPOSITORY:-${CALLER_REPOSITORY}}"
          source_ref="${REQUEST_REF:-${CALLER_REF}}"
          source_is_tag="${REQUEST_IS_TAG}"
          case "${source_ref}" in
            refs/heads/*) source_ref="${source_ref#refs/heads/}" ;;
            refs/tags/*) source_is_tag=true ;;
          esac
          source_is_pr=false
          case "${REQUEST_REF}" in
            refs/pull/*) source_is_pr=true ;;
          esac
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"

          restore_eligible=false
          if test "${source_repository}" = "StreamScapeTV/iptv-apple" &&
            test "${source_is_tag}" != "true"; then
            restore_eligible=true
          fi

          fingerprint_ready=false
          if test -f scripts/bootstrap-streamscape-media-binary.sh &&
            test -f streamscapetv.xcodeproj/project.pbxproj; then
            fingerprint_ready=true
          fi

          default_branch=""
          if test "${restore_eligible}" = "true" &&
            test "${fingerprint_ready}" = "true" &&
            test -n "${SOURCE_TOKEN}"; then
            repository_json="$(curl --fail --silent --show-error --header "Authorization: Bearer ${SOURCE_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${source_repository}" || true)"
            if test -n "${repository_json}"; then
              default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))' 2>/dev/null || true)"
            fi
          fi

          restore_enabled=false
          if test "${restore_eligible}" = "true" &&
            test "${fingerprint_ready}" = "true" &&
            test -n "${default_branch}"; then
            restore_enabled=true
          fi

          save_enabled=false
          if test "${restore_enabled}" = "true" &&
            test "${source_ref}" = "${default_branch}" &&
            test "${checkout_branch}" = "${default_branch}" &&
            test "${source_is_pr}" != "true"; then
            save_enabled=true
          fi

          swiftpm_clones_dir="${RUNNER_TEMP}/streamscapetv-swiftpm-clones"
          mkdir -p "${swiftpm_clones_dir}"
          {
            printf 'restore_eligible=%s\n' "${restore_eligible}"
            printf 'restore_enabled=%s\n' "${restore_enabled}"
            printf 'save_enabled=%s\n' "${save_enabled}"
            printf 'default_branch=%s\n' "${default_branch}"
            printf 'swiftpm_clones_dir=%s\n' "${swiftpm_clones_dir}"
          } >> "${GITHUB_OUTPUT}"
          {
            printf 'SWIFTPM_CLONES_DIR=%s\n' "${swiftpm_clones_dir}"
            printf 'APPLE_DEFAULT_CACHE_ENABLED=%s\n' "${restore_enabled}"
          } >> "${GITHUB_ENV}"

          if test "${restore_enabled}" = "true"; then
            dependency_fingerprint="$(python3 - \
              scripts/bootstrap-streamscape-media-binary.sh \
              streamscapetv.xcodeproj/project.pbxproj <<'PY_APPLE_DEPENDENCY_FINGERPRINT'
          from __future__ import annotations

          from pathlib import Path
          import hashlib
          import re
          import sys

          bootstrap_path = Path(sys.argv[1])
          project_path = Path(sys.argv[2])
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          project = project_path.read_text(encoding="utf-8")

          def section_body(name: str) -> str:
              match = re.search(
                  rf"/\* Begin {re.escape(name)} section \*/(?P<body>.*?)/\* End {re.escape(name)} section \*/",
                  project,
                  flags=re.S,
              )
              return match.group("body") if match is not None else ""

          def object_blocks(section: str) -> list[str]:
              blocks: list[str] = []
              current: list[str] = []
              depth = 0
              for line in section.splitlines():
                  if depth == 0:
                      if "= {" not in line:
                          continue
                      current = [line]
                      depth = line.count("{") - line.count("}")
                  else:
                      current.append(line)
                      depth += line.count("{") - line.count("}")
                  if current and depth == 0:
                      blocks.append("\n".join(current))
                      current = []
              if current or depth != 0:
                  raise SystemExit("Apple Swift package reference section is malformed")
              return blocks

          records: list[str] = []
          for name in (
              "RELEASE_REPOSITORY",
              "RELEASE_TAG",
              "RELEASE_COMMIT",
              "ASSET_NAME",
              "ASSET_SHA256",
          ):
              match = re.search(rf"(?m)^{re.escape(name)}=(?P<value>.+?)\s*$", bootstrap)
              if match is None:
                  raise SystemExit(f"Apple Streamscape Media bootstrap is missing {name}")
              records.append(f"media:{name}={match.group('value').strip()}")

          for block in object_blocks(section_body("XCLocalSwiftPackageReference")):
              path_match = re.search(r"(?m)^\s*relativePath\s*=\s*([^;]+);\s*$", block)
              if path_match is None:
                  raise SystemExit("Apple local Swift package reference has no relativePath")
              path_value = " ".join(path_match.group(1).split())
              records.append(f"local:{path_value}")

          for block in object_blocks(section_body("XCRemoteSwiftPackageReference")):
              fields = {
                  key: " ".join(value.split())
                  for key, value in re.findall(
                      r"(?m)^\s*([A-Za-z][A-Za-z0-9_]*)\s*=\s*([^;]+);\s*$",
                      block,
                  )
                  if key != "isa"
              }
              repository_url = fields.get("repositoryURL")
              if not repository_url:
                  raise SystemExit("Apple remote Swift package reference has no repositoryURL")
              records.append(
                  "remote:" + "|".join(f"{key}={fields[key]}" for key in sorted(fields))
              )

          digest = hashlib.sha256()
          for record in sorted(records):
              digest.update(b"\0package\0")
              digest.update(record.encode("utf-8"))
          print(digest.hexdigest())
          PY_APPLE_DEPENDENCY_FINGERPRINT
            )"
            xcode_fingerprint="$(xcodebuild -version | /usr/bin/shasum -a 256 | awk '{print $1}')"
            architecture="$(uname -m)"
            cache_key="iptv-apple-default-deps-v4-${architecture}-${xcode_fingerprint}-${dependency_fingerprint}"
            printf 'key=%s\n' "${cache_key}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore Apple default-branch dependency cache
        id: apple_default_cache_restore
        if: ${{ steps.apple_default_cache.outputs.restore_enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/StreamscapeMediaApple
            ${{ steps.apple_default_cache.outputs.swiftpm_clones_dir }}
          key: ${{ steps.apple_default_cache.outputs.key }}

      - name: Record Apple default-branch cache restore
        if: ${{ steps.apple_default_cache.outputs.restore_enabled == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apple_default_cache_restore.outputs.cache-hit }}
          DEFAULT_BRANCH: ${{ steps.apple_default_cache.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          {
            printf '\n===== apple-default-cache =====\n'
            printf 'default_branch=%s\n' "${DEFAULT_BRANCH}"
            printf 'cache_hit=%s\n' "${CACHE_HIT:-false}"
          } >> "${CI_LOG}"

      - name: Prepare fixed TestFlight release context
        id: testflight_prepare
        if: ${{ inputs.test_profile == 'testflight' }}
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "${BUILD_NUMBER}" || {
            printf 'TestFlight requires an explicit caller build_number.\n' >&2
            exit 2
          }
          if (( ${#BUILD_NUMBER} > 64 )) || [[ ! "${BUILD_NUMBER}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            printf 'TestFlight build_number must be a bounded scalar release identifier.\n' >&2
            exit 2
          fi
          test -n "${APP_STORE_CONNECT_KEY_ID}"
          test -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64}"

          release_root="${RUNNER_TEMP}/central-apple-testflight"
          key_path="${release_root}/AuthKey.p8"
          rm -rf -- "${release_root}"
          mkdir -p "${release_root}"
          chmod 700 "${release_root}"

          KEY_PATH="${key_path}" python3 - <<'PY_KEY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"]
          try:
              key = base64.b64decode(raw, validate=True)
          except Exception as error:
              raise SystemExit("App Store Connect API key is not valid base64") from error
          if not key.startswith(b"-----BEGIN PRIVATE KEY-----") or b"-----END PRIVATE KEY-----" not in key:
              raise SystemExit("decoded App Store Connect API key is not a PKCS#8 private key")
          path = Path(os.environ["KEY_PATH"])
          path.write_bytes(key)
          path.chmod(0o600)
          PY_KEY

          test "$(stat -f '%Lp' "${key_path}")" = 600
          {
            printf 'CI_APPLE_TESTFLIGHT_BUILD_NUMBER=%s\n' "${BUILD_NUMBER}"
            printf 'CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH=%s\n' "${key_path}"
            printf 'CI_APPLE_TESTFLIGHT_TEMP_DIR=%s\n' "${release_root}"
          } >> "${GITHUB_ENV}"

      - name: Run fixed Apple lane
        id: commands
        shell: bash
        env:
          EXECUTION_LANE: ${{ matrix.lane }}
          TEST_PROFILE: ${{ inputs.test_profile }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          GH_TOKEN: ${{ steps.source.outputs.token || github.token }}
          CI_GITHUB_TOKEN: ${{ steps.source.outputs.token || github.token }}
          CI_APPLE_TESTFLIGHT_TEAM_ID: ${{ inputs.test_profile == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
          CI_APPLE_TESTFLIGHT_KEY_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_APPLE_TESTFLIGHT_ISSUER_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            local started_at="${SECONDS}"
            printf '\n===== %s =====\n' "${label}" >> "${CI_LOG}"
            if ! "$@" >> "${CI_LOG}" 2>&1; then
              printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "${CI_LOG}"
              printf '%s failed; inspect the private Google Drive CI log.\n' "${label}" >&2
              return 1
            fi
            printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "${CI_LOG}"
          }

          historical_recovery_active=false

          materialize_historical_media_bootstrap() {
            local helper="scripts/bootstrap-streamscape-media-binary.sh"
            if test -f "${helper}"; then
              return 0
            fi

            local historical_sha="512db0f5b2513ad7d3a2b53bbc132ea29742bb63"
            local historical_tree="f610e568dabf621cf5e9e23d5541571e2feb7122"
            local approved_helper_ref="dbe258b0487b4dfe023bfda1f27bf2cc013c2490"
            local approved_helper_blob="492be28b492dd6bc3458cbd884893869e150818e"
            local source_sha source_tree actual_blob
            source_sha="$(git rev-parse HEAD)"
            source_tree="$(git rev-parse 'HEAD^{tree}')"

            if test "${SOURCE_REPOSITORY}" != "StreamScapeTV/iptv-apple" \
              || test "${source_sha}" != "${historical_sha}" \
              || test "${source_tree}" != "${historical_tree}"; then
              printf 'Missing required Apple bootstrap helper for source %s at %s/%s\n' \
                "${SOURCE_REPOSITORY}" "${source_sha}" "${source_tree}" >&2
              return 1
            fi

            mkdir -p "$(dirname "${helper}")"
            gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/StreamScapeTV/iptv-apple/contents/scripts/bootstrap-streamscape-media-binary.sh?ref=${approved_helper_ref}" \
              > "${helper}"
            actual_blob="$(git hash-object "${helper}")"
            if test "${actual_blob}" != "${approved_helper_blob}"; then
              rm -f "${helper}"
              printf 'Approved historical Apple bootstrap helper blob mismatch: expected %s, got %s\n' \
                "${approved_helper_blob}" "${actual_blob}" >&2
              return 1
            fi
            historical_recovery_active=true
            printf 'Materialized approved historical Apple bootstrap helper for exact recovery tree.\n' \
              >> "${CI_LOG}"
          }

          run_xcode_logged() {
            local label="$1"
            shift
            if test "${historical_recovery_active}" != "true"; then
              run_logged "${label}" "$@"
              return
            fi
            test -n "${CI_GITHUB_TOKEN}" || {
              printf 'Historical Apple recovery requires the fixed source GitHub token.\n' >&2
              return 1
            }
            local private_git_auth
            private_git_auth="$(
              printf 'x-access-token:%s' "${CI_GITHUB_TOKEN}" \
                | /usr/bin/base64 \
                | tr -d '\r\n'
            )"
            (
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0='http.https://github.com/StreamScapeTV/streamscape-media.git.extraheader'
              export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${private_git_auth}"
              run_logged "${label}" "$@"
            )
          }

          case "${TEST_PROFILE}" in
            testflight)
              wrapper="scripts/ci/run-apple-testflight.sh"
              test -f "${wrapper}" || {
                printf 'Missing fixed Apple TestFlight wrapper: %s\n' "${wrapper}" >&2
                exit 2
              }
              test ! -L "${wrapper}" || {
                printf 'Apple TestFlight wrapper must not be a symlink: %s\n' "${wrapper}" >&2
                exit 2
              }
              git ls-files --error-unmatch -- "${wrapper}" >/dev/null 2>&1 || {
                printf 'Apple TestFlight wrapper must be tracked source: %s\n' "${wrapper}" >&2
                exit 2
              }
              test -n "${CI_APPLE_TESTFLIGHT_BUILD_NUMBER:-}"
              test -n "${CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH:-}"
              test -f "${CI_APPLE_TESTFLIGHT_AUTH_KEY_PATH}"
              test -n "${CI_APPLE_TESTFLIGHT_TEMP_DIR:-}"
              test -n "${CI_APPLE_TESTFLIGHT_TEAM_ID}"
              test -n "${CI_APPLE_TESTFLIGHT_KEY_ID}"
              test -n "${CI_APPLE_TESTFLIGHT_ISSUER_ID}"
              run_logged apple-testflight bash "${wrapper}"
              exit 0
              ;;
            build|test|simulator)
              wrapper="scripts/ci/run-apple-hosted-validation.sh"
              test -f "${wrapper}" || {
                printf 'Missing fixed Apple hosted validation wrapper: %s\n' "${wrapper}" >&2
                exit 2
              }
              export CI_APPLE_HOSTED_PROFILE="${TEST_PROFILE}"
              run_logged "apple-${TEST_PROFILE}" bash "${wrapper}"
              exit 0
              ;;
          esac

          swiftpm_xcode_args=()
          if test "${APPLE_DEFAULT_CACHE_ENABLED:-false}" = "true"; then
            swiftpm_xcode_args=(-clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}")
          fi

          targeted_test_args=()
          if test "${TEST_PROFILE}" = targeted-tests || test "${TEST_PROFILE}" = candidate; then
            test_selectors=()
            while IFS= read -r selector; do
              test_selectors+=("${selector}")
            done < <(
              TEST_SELECTORS_JSON="${TEST_SELECTORS}" python3 - <<'PY_TEST_SELECTORS'
          import json
          import os
          import re

          values = json.loads(os.environ.get("TEST_SELECTORS_JSON", ""))
          if not isinstance(values, list) or not 1 <= len(values) <= 20:
              raise SystemExit("invalid targeted-tests selector list")
          if any(not isinstance(value, str) for value in values):
              raise SystemExit("invalid targeted-tests selector list")
          if len(values) != len(set(values)):
              raise SystemExit("invalid targeted-tests selector list")
          pattern = re.compile(r"[A-Za-z0-9_.$/-]{1,240}")
          for value in values:
              if (
                  not pattern.fullmatch(value)
                  or value.startswith("-")
                  or "/" not in value
              ):
                  raise SystemExit("invalid Apple targeted-tests selector")
              print(value)
          PY_TEST_SELECTORS
            )
            test "${#test_selectors[@]}" -ge 1
            for selector in "${test_selectors[@]}"; do
              targeted_test_args+=("-only-testing:${selector}")
            done
          fi

          case "${EXECUTION_LANE}" in
            macos-test)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged macos-test xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            macos-targeted-tests)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged macos-targeted-tests xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO \
                "${targeted_test_args[@]}"
              ;;
            ios-targeted-tests)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged ios-targeted-tests xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'platform=iOS Simulator,name=iPhone 17' \
                CODE_SIGNING_ALLOWED=NO \
                "${targeted_test_args[@]}"
              ;;
            tvos-targeted-tests)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged tvos-targeted-tests xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'platform=tvOS Simulator,name=Apple TV' \
                CODE_SIGNING_ALLOWED=NO \
                "${targeted_test_args[@]}"
              ;;
            ios-build)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged ios-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            tvos-build)
              materialize_historical_media_bootstrap
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_xcode_logged tvos-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            release-build)
              test -f scripts/bootstrap-streamscape-media-binary.sh
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_logged ios-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged tvos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]+"${swiftpm_xcode_args[@]}"}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            swift-package)
              run_logged swift-package swift test
              ;;
            *)
              printf 'Unsupported Apple execution lane: %s\n' "${EXECUTION_LANE}" >&2
              exit 2
              ;;
          esac

      - name: Clean TestFlight credential and release state
        id: testflight_cleanup
        if: ${{ always() && inputs.test_profile == 'testflight' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/central-apple-testflight"
          rm -rf -- "${release_root}"
          test ! -e "${release_root}"

      - name: Record Apple default-branch cache contents
        id: apple_default_cache_contents
        if: ${{ matrix.cache_save && steps.apple_default_cache.outputs.save_enabled == 'true' && steps.commands.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          size_bytes() {
            local path="$1"
            if test -e "${path}"; then
              /usr/bin/du -sk "${path}" | awk '{print $1 * 1024}'
            else
              printf '0\n'
            fi
          }
          media_bytes="$(size_bytes Vendor/StreamscapeMediaApple)"
          swiftpm_bytes="$(size_bytes "${SWIFTPM_CLONES_DIR}")"
          {
            printf 'media_bytes=%s\n' "${media_bytes}"
            printf 'swiftpm_clone_bytes=%s\n' "${swiftpm_bytes}"
            printf 'total_cache_bytes=%s\n' "$((media_bytes + swiftpm_bytes))"
          } >> "${CI_LOG}"

      - name: Save Apple default-branch dependency cache
        id: apple_default_cache_save
        if: ${{ matrix.cache_save && steps.apple_default_cache.outputs.save_enabled == 'true' && steps.commands.outcome == 'success' && steps.apple_default_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/StreamscapeMediaApple
            ${{ steps.apple_default_cache.outputs.swiftpm_clones_dir }}
          key: ${{ steps.apple_default_cache_restore.outputs.cache-primary-key }}

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_APPLE_TEAM_ID: ${{ inputs.test_profile == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_KEY_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_API_KEY: ${{ inputs.test_profile == 'testflight' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci-${{ matrix.lane }}.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}.txt
          mime_type: text/plain

  finish:
    needs:
      - plan
      - execute
    if: ${{ always() && inputs.ci_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Finish Agent State run
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ (needs.plan.result == 'cancelled' || needs.execute.result == 'cancelled') && 'cancelled' || (needs.plan.result == 'success' && needs.execute.result == 'success') && 'succeeded' || 'failed' }}
