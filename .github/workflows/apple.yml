name: Apple CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare Apple develop dependency cache
        id: apple_develop_cache
        shell: bash
        env:
          REQUEST_REPOSITORY: ${{ inputs.repository }}
          REQUEST_REF: ${{ inputs.ref }}
          REQUEST_IS_TAG: ${{ inputs.source_is_tag }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          source_repository="${REQUEST_REPOSITORY:-${CALLER_REPOSITORY}}"
          source_ref="${REQUEST_REF:-${CALLER_REF}}"
          source_is_tag="${REQUEST_IS_TAG}"
          case "${source_ref}" in
            refs/heads/*) source_ref="${source_ref#refs/heads/}" ;;
            refs/tags/*) source_is_tag=true ;;
          esac
          case "${CALLER_REF_TYPE}" in
            tag) source_is_tag=true ;;
          esac
          source_is_pr=false
          case "${CALLER_EVENT_NAME}" in
            pull_request|pull_request_target) source_is_pr=true ;;
          esac

          enabled=false
          if test "${source_repository}" = "StreamScapeTV/iptv-apple" \
            && test "${source_ref}" = "develop" \
            && test "${source_is_tag}" != "true" \
            && test "${source_is_pr}" != "true"; then
            enabled=true
          fi

          swiftpm_clones_dir="${RUNNER_TEMP}/streamscapetv-swiftpm-clones"
          mkdir -p "${swiftpm_clones_dir}"
          {
            printf 'enabled=%s\n' "${enabled}"
            printf 'swiftpm_clones_dir=%s\n' "${swiftpm_clones_dir}"
          } >> "${GITHUB_OUTPUT}"
          printf 'SWIFTPM_CLONES_DIR=%s\n' "${swiftpm_clones_dir}" >> "${GITHUB_ENV}"

          if test "${enabled}" = "true"; then
            test -f scripts/bootstrap-streamscape-media-binary.sh
            test -f streamscapetv.xcodeproj/project.pbxproj
            dependency_fingerprint="$(
              {
                /usr/bin/shasum -a 256 scripts/bootstrap-streamscape-media-binary.sh
                /usr/bin/shasum -a 256 streamscapetv.xcodeproj/project.pbxproj
              } | /usr/bin/shasum -a 256 | awk '{print $1}'
            )"
            xcode_fingerprint="$(xcodebuild -version | /usr/bin/shasum -a 256 | awk '{print $1}')"
            architecture="$(uname -m)"
            cache_key="iptv-apple-develop-deps-v1-${architecture}-${xcode_fingerprint}-${dependency_fingerprint}"
            {
              printf 'key=%s\n' "${cache_key}"
              printf 'restore_started_at=%s\n' "$(date +%s)"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore Apple develop dependency cache
        id: apple_develop_cache_restore
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/StreamscapeMediaApple
            ${{ steps.apple_develop_cache.outputs.swiftpm_clones_dir }}
          key: ${{ steps.apple_develop_cache.outputs.key }}

      - name: Record Apple develop cache restore
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apple_develop_cache_restore.outputs.cache-hit }}
          RESTORE_STARTED_AT: ${{ steps.apple_develop_cache.outputs.restore_started_at }}
        run: |
          set -Eeuo pipefail
          restore_seconds="$(( $(date +%s) - RESTORE_STARTED_AT ))"
          {
            printf '\n===== apple-develop-cache =====\n'
            printf 'cache_hit=%s\n' "${CACHE_HIT:-false}"
            printf 'restore_seconds=%s\n' "${restore_seconds}"
          } >> "${CI_LOG}"

      - name: Run fixed Apple profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          GH_TOKEN: ${{ steps.source.outputs.token || github.token }}
          CI_GITHUB_TOKEN: ${{ steps.source.outputs.token || github.token }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            local started_at="${SECONDS}"
            printf '\n===== %s =====\n' "$label" >> "$CI_LOG"
            if ! "$@" >> "$CI_LOG" 2>&1; then
              printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "$CI_LOG"
              printf '%s failed; inspect the private Google Drive CI log.\n' "$label" >&2
              return 1
            fi
            printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "$CI_LOG"
          }

          case "$TEST_PROFILE" in
            host)
              test -f scripts/bootstrap-streamscape-media-binary.sh
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_logged ios-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged tvos-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-test xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO \
                -only-testing:streamscapetvTests/SelectedBackendStateSyncRoutingIntegrationTests
              ;;
            release-build)
              test -f scripts/bootstrap-streamscape-media-binary.sh
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_logged ios-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged tvos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                -clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            swift-package)
              run_logged swift-package swift test
              ;;
            *)
              printf 'Unsupported Apple test_profile: %s\n' "$TEST_PROFILE" >&2
              exit 2
              ;;
          esac

      - name: Record Apple develop cache contents
        id: apple_develop_cache_contents
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' && steps.commands.outcome == 'success' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apple_develop_cache_restore.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          size_bytes() {
            local path="$1"
            if test -e "${path}"; then
              /usr/bin/du -sk "${path}" | awk '{print $1 * 1024}'
            else
              printf '0\n'
            fi
          }
          media_bytes="$(size_bytes Vendor/StreamscapeMediaApple)"
          swiftpm_bytes="$(size_bytes "${SWIFTPM_CLONES_DIR}")"
          {
            printf 'media_bytes=%s\n' "${media_bytes}"
            printf 'swiftpm_clone_bytes=%s\n' "${swiftpm_bytes}"
            printf 'total_cache_bytes=%s\n' "$((media_bytes + swiftpm_bytes))"
          } >> "${CI_LOG}"

      - name: Save Apple develop dependency cache
        id: apple_develop_cache_save
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' && steps.commands.outcome == 'success' && steps.apple_develop_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/StreamscapeMediaApple
            ${{ steps.apple_develop_cache.outputs.swiftpm_clones_dir }}
          key: ${{ steps.apple_develop_cache.outputs.key }}

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.log.gz
          gzip: 'true'
          mime_type: application/gzip

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && (steps.apple_develop_cache_save.outcome == 'success' || steps.apple_develop_cache_save.outcome == 'skipped') && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
