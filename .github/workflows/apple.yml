name: Apple CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare Apple develop dependency cache
        id: apple_develop_cache
        shell: bash
        env:
          REQUEST_REPOSITORY: ${{ inputs.repository }}
          REQUEST_REF: ${{ inputs.ref }}
          REQUEST_IS_TAG: ${{ inputs.source_is_tag }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          source_repository="${REQUEST_REPOSITORY:-${CALLER_REPOSITORY}}"
          source_ref="${REQUEST_REF:-${CALLER_REF}}"
          source_is_tag="${REQUEST_IS_TAG}"
          case "${source_ref}" in
            refs/heads/*) source_ref="${source_ref#refs/heads/}" ;;
            refs/tags/*) source_is_tag=true ;;
          esac
          case "${CALLER_REF_TYPE}" in
            tag) source_is_tag=true ;;
          esac
          source_is_pr=false
          case "${CALLER_EVENT_NAME}" in
            pull_request|pull_request_target) source_is_pr=true ;;
          esac

          eligible=false
          if test "${source_repository}" = "StreamScapeTV/iptv-apple" \
            && test "${source_ref}" = "develop" \
            && test "${source_is_tag}" != "true" \
            && test "${source_is_pr}" != "true"; then
            eligible=true
          fi
          transport_ready=false
          if test -n "${DRIVE_CLIENT_ID}" \
            && test -n "${DRIVE_CLIENT_SECRET}" \
            && test -n "${DRIVE_REFRESH_TOKEN}"; then
            transport_ready=true
          fi
          enabled=false
          if test "${eligible}" = "true" && test "${transport_ready}" = "true"; then
            enabled=true
          fi

          swiftpm_clones_dir="${RUNNER_TEMP}/streamscapetv-swiftpm-clones"
          mkdir -p "${swiftpm_clones_dir}"
          {
            printf 'eligible=%s\n' "${eligible}"
            printf 'enabled=%s\n' "${enabled}"
            printf 'swiftpm_clones_dir=%s\n' "${swiftpm_clones_dir}"
          } >> "${GITHUB_OUTPUT}"
          {
            printf 'SWIFTPM_CLONES_DIR=%s\n' "${swiftpm_clones_dir}"
            printf 'APPLE_DEVELOP_CACHE_ENABLED=%s\n' "${enabled}"
          } >> "${GITHUB_ENV}"

          if test "${enabled}" = "true"; then
            test -f scripts/bootstrap-streamscape-media-binary.sh
            test -f streamscapetv.xcodeproj/project.pbxproj
            dependency_fingerprint="$(
              {
                /usr/bin/shasum -a 256 scripts/bootstrap-streamscape-media-binary.sh
                /usr/bin/shasum -a 256 streamscapetv.xcodeproj/project.pbxproj
              } | /usr/bin/shasum -a 256 | awk '{print $1}'
            )"
            xcode_fingerprint="$(xcodebuild -version | /usr/bin/shasum -a 256 | awk '{print $1}')"
            architecture="$(uname -m)"
            cache_key="iptv-apple-develop-deps-v2-${architecture}-${xcode_fingerprint}-${dependency_fingerprint}"
            {
              printf 'key=%s\n' "${cache_key}"
              printf 'file_name=%s.tar.gz\n' "${cache_key}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore Apple develop dependency cache
        id: apple_develop_cache_restore
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CACHE_FILE_NAME: ${{ steps.apple_develop_cache.outputs.file_name }}
          SWIFTPM_CLONES_DIR: ${{ steps.apple_develop_cache.outputs.swiftpm_clones_dir }}
        run: |
          set -Eeuo pipefail
          started_at="${SECONDS}"
          archive="${RUNNER_TEMP}/apple-develop-cache-restore.tar.gz"
          restore_root="${RUNNER_TEMP}/apple-develop-cache-restore"
          cleanup() {
            rm -f "${archive}"
            rm -rf "${restore_root}"
          }
          trap cleanup EXIT

          access_token="$(
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token" \
              https://oauth2.googleapis.com/token \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)'
          )"
          echo "::add-mask::${access_token}"

          exact_child_id() {
            local parent="$1"
            local name="$2"
            local kind="$3"
            local query response
            query="'${parent}' in parents and name = '${name}' and trashed = false"
            if test "${kind}" = folder; then
              query="${query} and mimeType = 'application/vnd.google-apps.folder'"
            else
              query="${query} and mimeType != 'application/vnd.google-apps.folder'"
            fi
            response="$(curl --get --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode 'spaces=drive' \
              --data-urlencode 'fields=files(id,name,mimeType,size)' \
              --data-urlencode 'pageSize=100' \
              'https://www.googleapis.com/drive/v3/files')"
            printf '%s' "${response}" | python3 -c '
          import json, sys
          files = json.load(sys.stdin).get("files", [])
          if len(files) > 1:
              raise SystemExit("duplicate Google Drive entries for one exact parent/name")
          print(files[0]["id"] if files else "")
          '
          }

          cache_root_id="$(exact_child_id root dependency-cache folder)"
          repository_folder_id=""
          ref_folder_id=""
          cache_file_id=""
          if test -n "${cache_root_id}"; then
            repository_folder_id="$(exact_child_id "${cache_root_id}" iptv-apple folder)"
          fi
          if test -n "${repository_folder_id}"; then
            ref_folder_id="$(exact_child_id "${repository_folder_id}" develop folder)"
          fi
          if test -n "${ref_folder_id}"; then
            cache_file_id="$(exact_child_id "${ref_folder_id}" "${CACHE_FILE_NAME}" file)"
          fi

          cache_hit=false
          archive_bytes=0
          if test -n "${cache_file_id}"; then
            cache_hit=true
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              --output "${archive}" \
              "https://www.googleapis.com/drive/v3/files/${cache_file_id}?alt=media"
            archive_bytes="$(wc -c < "${archive}" | tr -d '[:space:]')"
            python3 - "${archive}" <<'PY_VALIDATE'
          import pathlib, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          allowed = ("Vendor/StreamscapeMediaApple", "streamscapetv-swiftpm-clones")
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("dependency cache archive is empty")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe cache entry: {member.name}")
                  normalized = member.name.rstrip("/")
                  if not any(normalized == root or normalized.startswith(root + "/") for root in allowed):
                      raise SystemExit(f"unexpected cache entry: {member.name}")
          PY_VALIDATE
            mkdir -p "${restore_root}"
            /usr/bin/tar -xzf "${archive}" -C "${restore_root}"
            test ! -e Vendor/StreamscapeMediaApple
            test -d "${restore_root}/Vendor/StreamscapeMediaApple"
            mkdir -p Vendor
            mv "${restore_root}/Vendor/StreamscapeMediaApple" Vendor/StreamscapeMediaApple
            rm -rf "${SWIFTPM_CLONES_DIR}"
            if test -d "${restore_root}/streamscapetv-swiftpm-clones"; then
              mv "${restore_root}/streamscapetv-swiftpm-clones" "${SWIFTPM_CLONES_DIR}"
            else
              mkdir -p "${SWIFTPM_CLONES_DIR}"
            fi
          fi
          {
            printf 'cache_hit=%s\n' "${cache_hit}"
            printf 'cache_root_id=%s\n' "${cache_root_id}"
            printf 'archive_bytes=%s\n' "${archive_bytes}"
            printf 'restore_seconds=%s\n' "$((SECONDS - started_at))"
          } >> "${GITHUB_OUTPUT}"

      - name: Record Apple develop cache restore
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apple_develop_cache_restore.outputs.cache_hit }}
          CACHE_ARCHIVE_BYTES: ${{ steps.apple_develop_cache_restore.outputs.archive_bytes }}
          RESTORE_SECONDS: ${{ steps.apple_develop_cache_restore.outputs.restore_seconds }}
        run: |
          set -Eeuo pipefail
          {
            printf '\n===== apple-develop-cache =====\n'
            printf 'cache_hit=%s\n' "${CACHE_HIT:-false}"
            printf 'cache_archive_bytes=%s\n' "${CACHE_ARCHIVE_BYTES:-0}"
            printf 'restore_seconds=%s\n' "${RESTORE_SECONDS:-0}"
          } >> "${CI_LOG}"

      - name: Run fixed Apple profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          GH_TOKEN: ${{ steps.source.outputs.token || github.token }}
          CI_GITHUB_TOKEN: ${{ steps.source.outputs.token || github.token }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            local started_at="${SECONDS}"
            printf '\n===== %s =====\n' "$label" >> "$CI_LOG"
            if ! "$@" >> "$CI_LOG" 2>&1; then
              printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "$CI_LOG"
              printf '%s failed; inspect the private Google Drive CI log.\n' "$label" >&2
              return 1
            fi
            printf 'duration_seconds=%s\n' "$((SECONDS - started_at))" >> "$CI_LOG"
          }
          swiftpm_xcode_args=()
          if test "${APPLE_DEVELOP_CACHE_ENABLED:-false}" = "true"; then
            swiftpm_xcode_args=(-clonedSourcePackagesDirPath "${SWIFTPM_CLONES_DIR}")
          fi

          case "$TEST_PROFILE" in
            host)
              test -f scripts/bootstrap-streamscape-media-binary.sh
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_logged ios-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged tvos-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-build xcodebuild build-for-testing \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-test xcodebuild test \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                "${swiftpm_xcode_args[@]}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO \
                -only-testing:streamscapetvTests/SelectedBackendStateSyncRoutingIntegrationTests
              ;;
            release-build)
              test -f scripts/bootstrap-streamscape-media-binary.sh
              run_logged prepare-media bash scripts/bootstrap-streamscape-media-binary.sh
              run_logged ios-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]}" \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged tvos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]}" \
                -destination 'generic/platform=tvOS Simulator' \
                CODE_SIGNING_ALLOWED=NO
              run_logged macos-release-build xcodebuild build \
                -workspace streamscapetv.xcworkspace \
                -scheme streamscapetv \
                -configuration Release \
                "${swiftpm_xcode_args[@]}" \
                -destination 'platform=macOS' \
                CODE_SIGNING_ALLOWED=NO
              ;;
            swift-package)
              run_logged swift-package swift test
              ;;
            *)
              printf 'Unsupported Apple test_profile: %s\n' "$TEST_PROFILE" >&2
              exit 2
              ;;
          esac

      - name: Record Apple develop cache contents
        id: apple_develop_cache_contents
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' && steps.commands.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          size_bytes() {
            local path="$1"
            if test -e "${path}"; then
              /usr/bin/du -sk "${path}" | awk '{print $1 * 1024}'
            else
              printf '0\n'
            fi
          }
          media_bytes="$(size_bytes Vendor/StreamscapeMediaApple)"
          swiftpm_bytes="$(size_bytes "${SWIFTPM_CLONES_DIR}")"
          {
            printf 'media_bytes=%s\n' "${media_bytes}"
            printf 'swiftpm_clone_bytes=%s\n' "${swiftpm_bytes}"
            printf 'total_cache_bytes=%s\n' "$((media_bytes + swiftpm_bytes))"
          } >> "${CI_LOG}"

      - name: Prepare Apple develop dependency cache archive
        id: apple_develop_cache_archive
        if: ${{ steps.apple_develop_cache.outputs.enabled == 'true' && steps.commands.outcome == 'success' && steps.apple_develop_cache_restore.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CACHE_ROOT_ID: ${{ steps.apple_develop_cache_restore.outputs.cache_root_id }}
          SWIFTPM_CLONES_DIR: ${{ steps.apple_develop_cache.outputs.swiftpm_clones_dir }}
        run: |
          set -Eeuo pipefail
          started_at="${SECONDS}"
          archive="${RUNNER_TEMP}/apple-develop-deps-cache.tar.gz"
          test -d Vendor/StreamscapeMediaApple
          test -d "${SWIFTPM_CLONES_DIR}"
          /usr/bin/tar -czf "${archive}" \
            -C "${GITHUB_WORKSPACE}" Vendor/StreamscapeMediaApple \
            -C "${RUNNER_TEMP}" streamscapetv-swiftpm-clones
          byte_size="$(wc -c < "${archive}" | tr -d '[:space:]')"

          cache_root_id="${CACHE_ROOT_ID}"
          if test -z "${cache_root_id}"; then
            access_token="$(
              curl --fail --silent --show-error \
                --request POST \
                --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
                --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
                --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
                --data-urlencode "grant_type=refresh_token" \
                https://oauth2.googleapis.com/token \
              | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)'
            )"
            echo "::add-mask::${access_token}"
            metadata='{"name":"dependency-cache","mimeType":"application/vnd.google-apps.folder","parents":["root"]}'
            cache_root_id="$(curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${access_token}" \
              --header 'Content-Type: application/json; charset=UTF-8' \
              --data "${metadata}" \
              'https://www.googleapis.com/drive/v3/files?fields=id' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          fi
          {
            printf 'archive=%s\n' "${archive}"
            printf 'cache_root_id=%s\n' "${cache_root_id}"
            printf 'archive_bytes=%s\n' "${byte_size}"
            printf 'prepare_seconds=%s\n' "$((SECONDS - started_at))"
          } >> "${GITHUB_OUTPUT}"
          {
            printf 'saved_archive_bytes=%s\n' "${byte_size}"
            printf 'archive_prepare_seconds=%s\n' "$((SECONDS - started_at))"
          } >> "${CI_LOG}"

      - name: Save Apple develop dependency cache
        id: apple_develop_cache_save
        if: ${{ steps.apple_develop_cache_archive.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ steps.apple_develop_cache_archive.outputs.cache_root_id }}
        with:
          repository: StreamScapeTV/iptv-apple
          ref: develop
          file_path: ${{ steps.apple_develop_cache_archive.outputs.archive }}
          file_name: ${{ steps.apple_develop_cache.outputs.file_name }}
          mime_type: application/gzip

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.log.gz
          gzip: 'true'
          mime_type: application/gzip

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && (steps.apple_develop_cache_archive.outcome == 'success' || steps.apple_develop_cache_archive.outcome == 'skipped') && (steps.apple_develop_cache_save.outcome == 'success' || steps.apple_develop_cache_save.outcome == 'skipped') && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
