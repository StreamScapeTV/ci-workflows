name: Android completion contract smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/reusable-android-live-service.yml
      - .github/workflows/reusable-android-release.yml
      - .github/workflows/android-completion-smoke.yml
      - .github/workflows/android-completion-contract-smoke.yml
      - actions/validate-android-live-service/**
      - actions/validate-android-release/**
      - scripts/ci/android_completion.py
      - src/ci_workflows/ciw_android_completion.py
      - src/ci_workflows/public_api_contract.py
      - contracts/action-tool-lock.json
      - contracts/bootstrap-public-workflows.json
      - contracts/permission-profiles.json
      - contracts/public-workflow-types.json
      - contracts/public-workflows.json
      - contracts/public-workflows/validation.json
      - docs/workflows/android-completion.md
      - docs/workflows/public-api-reference.md
      - tests/fixtures/android-validation/smoke-project/**
      - tests/test_android_completion.py
      - tests/test_android_completion_public_smoke_routing.py
      - tests/test_public_api_contract.py
  workflow_dispatch:

concurrency:
  group: android-completion-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  contracts:
    name: Validate Android completion contracts
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Stage exact candidate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact candidate implementation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - id: live_plan
        name: Validate bounded live-service plan
        uses: ./.ciw/actions/validate-android-live-service
        with:
          phase: plan
          admitted_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          working_directory: tests/fixtures/android-validation/smoke-project
          validation_plan_json: '{"script":{"interpreter":"python3","path":"ci/live-service-smoke.py","arguments":[]}}'

      - id: release_plan
        name: Validate bounded unsigned-release plan
        uses: ./.ciw/actions/validate-android-release
        with:
          phase: plan
          admitted_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"pre_scripts":[{"interpreter":"bash","path":"ci/release-pre-smoke.sh","arguments":[]}],"gradle_groups":[{"tasks":["verifyToolchainSmoke"]}],"post_scripts":[{"interpreter":"bash","path":"ci/release-post-smoke.sh","arguments":[]}],"size_budget":{"script_path":"ci/release-size-smoke.py","apk_glob":"build/outputs/release/*.apk","aab_glob":"build/outputs/release/*.aab","budget_path":"ci/release-size-budgets.json","baseline_path":"ci/release-size-baseline.json","output_path":"build/reports/release-size-metrics.json"},"artifacts":[{"path":"build/outputs/release/*.apk","kind":"apk","required":true,"max_files":1},{"path":"build/outputs/release/*.aab","kind":"aab","required":true,"max_files":1},{"path":"build/reports/release-policy-report.json","kind":"json","required":true,"max_files":1},{"path":"build/reports/release-size-metrics.json","kind":"json","required":true,"max_files":1}],"artifact_name":"android-completion-smoke","retention_days":1}'

      - id: reject_escape
        name: Reject release artifact traversal before execution
        continue-on-error: true
        uses: ./.ciw/actions/validate-android-release
        with:
          phase: plan
          admitted_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"pre_scripts":[],"gradle_groups":[{"tasks":["verifyToolchainSmoke"]}],"post_scripts":[],"size_budget":{"script_path":"ci/release-size-smoke.py","apk_glob":"build/outputs/release/*.apk","aab_glob":"build/outputs/release/*.aab","budget_path":"ci/release-size-budgets.json","baseline_path":"ci/release-size-baseline.json","output_path":"build/reports/release-size-metrics.json"},"artifacts":[{"path":"../escape.apk","kind":"apk","required":true,"max_files":1}],"artifact_name":"android-completion-smoke","retention_days":1}'

      - name: Require bounded planning outcomes
        shell: bash
        env:
          LIVE_PLAN: ${{ steps.live_plan.outcome }}
          RELEASE_PLAN: ${{ steps.release_plan.outcome }}
          REJECT_ESCAPE: ${{ steps.reject_escape.outcome }}
        run: |
          set -Eeuo pipefail
          test "${LIVE_PLAN}" = success
          test "${RELEASE_PLAN}" = success
          test "${REJECT_ESCAPE}" = failure
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

      - name: Verify zero Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Android completion contract smoke retained Actions artifacts")
          print("Android completion contract Actions artifacts verified: zero.")
          PY
