name: Apply issue 799 candidate patch

"on":
  push:
    branches:
      - issue/799-apple-candidate-profile

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create workflow-capable source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ci-workflows
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v4
        with:
          ref: issue/799-apple-candidate-profile
          fetch-depth: 1
          token: ${{ steps.source.outputs.token }}

      - name: Apply reviewed patch and remove bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/issue-799.patch
          git apply --check /tmp/issue-799.patch
          git apply /tmp/issue-799.patch
          rm -f .github/workflows/issue-799-apply.yml
          python3 -m unittest tests.test_native_targeted_profiles tests.test_apple_workflow -v
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('.github/workflows/apple.yml'), Path('.github/workflows/central-ci-dispatch.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[#799] Add bounded Apple candidate validation profile'
          git push origin HEAD:issue/799-apple-candidate-profile
