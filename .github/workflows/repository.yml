name: Repository-owned CI

# Generic adoption contract:
# - This workflow executes one fixed tracked .ci child on one reviewed generic host class.
# - repository-plan.yml may fan one semantic parent operation out to multiple OS children.
# - Product target, selector, UI-mode, toolchain and packaging behavior stays repository-owned.
# - Reviewed structured semantics arrive only through versioned CI_INPUTS_JSON; Central never
#   converts them into arbitrary argv, commands, executable paths, environment maps or runner labels.
# - Central owns exact-source checkout, bounded host selection, reviewed private infrastructure,
#   evidence/log transport, redaction/cleanup and Agent State lifecycle.
# - Private capability authorization is read from contracts/repository-ci-v1.json. The workflow
#   interprets generic capability names only; repository names do not select workflow code paths.
# - Release remains structurally gated by Central main + immutable tag + separate authorization.

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      source_is_tag:
        type: boolean
        required: false
        default: false
      expected_source_sha:
        type: string
        required: false
        default: ""
      trusted_capability_ci_run_id:
        type: string
        required: false
        default: ""
      operation:
        type: string
        required: true
      host_os:
        type: string
        required: true
      semantic_inputs_json:
        type: string
        required: false
        default: "{}"
      release_authorized:
        type: boolean
        required: false
        default: false
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_READ_TOKEN:
        required: false
      REGISTRY_WRITE_TOKEN:
        required: false
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_BASE64:
        required: false
      PROTECTED_DEPLOYED_HTTPS_TARGET:
        required: false
      PROTECTED_DEPLOYED_WSS_TARGET:
        required: false
      PROTECTED_DEPLOYED_HTTP_SCENARIO_GZIP_BASE64:
        required: false
      PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO_GZIP_BASE64:
        required: false
      PROTECTED_DEPLOYED_SETUP_CREDENTIAL:
        required: false
      BACKUP_S3_ENDPOINT:
        required: false
      BACKUP_S3_BUCKET:
        required: false
      BACKUP_S3_REGION:
        required: false
      BACKUP_S3_ACCESS_KEY_ID:
        required: false
      BACKUP_S3_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  resolve_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      host_class: ${{ steps.host.outputs.host_class }}
      host_os: ${{ steps.host.outputs.host_os }}
      runs_on: ${{ steps.host.outputs.runs_on }}
    steps:
      - name: Resolve trusted repository CI host class
        id: host
        shell: bash
        env:
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          OPERATION: ${{ inputs.operation }}
          LEGACY_HOST_OS: ${{ inputs.host_os }}
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          : "${AGENT_STATE_SUPABASE_URL:?Agent State URL is required for repository host resolution}"
          : "${AGENT_STATE_SUPABASE_SECRET_KEY:?Agent State secret is required for repository host resolution}"

          headers=(
            -H "apikey: ${AGENT_STATE_SUPABASE_SECRET_KEY}"
            -H "Content-Type: application/json"
            -H "Content-Profile: agent_api"
            -H "Accept-Profile: agent_api"
          )
          rpc() {
            curl --fail --silent --show-error \
              "${headers[@]}" \
              --data "$2" \
              "${AGENT_STATE_SUPABASE_URL%/}/rest/v1/rpc/$1"
          }
          emit_host() {
            local host_class="$1"
            local host_os runs_on
            case "${host_class}" in
              linux-hosted)
                host_os=linux
                runs_on='["ubuntu-24.04"]'
                ;;
              linux-high-capacity)
                host_os=linux
                runs_on='["self-hosted","linux","x64","ubuntu-latest-xl"]'
                ;;
              macos-hosted)
                host_os=macos
                runs_on='["macos-latest"]'
                ;;
              macos-high-capacity)
                host_os=macos
                runs_on='["macOS","ARM64"]'
                ;;
              *)
                echo "repository CI resolved an unsupported host class" >&2
                exit 2
                ;;
            esac
            {
              printf 'host_class=%s\n' "${host_class}"
              printf 'host_os=%s\n' "${host_os}"
              printf 'runs_on=%s\n' "${runs_on}"
            } >> "${GITHUB_OUTPUT}"
          }

          capability_run_id="${LIFECYCLE_CI_RUN_ID}"
          context=repository_lifecycle
          if test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
            test -z "${LIFECYCLE_CI_RUN_ID}" || {
              echo "repository trusted parent capability context cannot also own Agent State lifecycle" >&2
              exit 2
            }
            capability_run_id="${TRUSTED_CAPABILITY_CI_RUN_ID}"
            context=trusted_parent
          fi
          test -n "${capability_run_id}" || {
            echo "repository CI host resolution requires one trusted Agent State CI run" >&2
            exit 2
          }

          claim_response="$(rpc claim_ci_run "$(jq -cn --arg id "${capability_run_id}" '{p_ci_run_id:$id}')")"
          test "$(jq -r '.ok' <<<"${claim_response}")" = true || {
            echo "repository CI could not replay the trusted Agent State CI claim for host resolution" >&2
            exit 1
          }
          run="$(jq -c '.run' <<<"${claim_response}")"
          project_key="$(jq -r '.project_key // empty' <<<"${run}")"
          run_repository="$(jq -r '.repository // empty' <<<"${run}")"
          run_ref="$(jq -r '.ref // empty' <<<"${run}")"
          run_is_tag="$(jq -r '.is_tag | tostring' <<<"${run}")"
          run_workflow="$(jq -r '.workflow_key // empty' <<<"${run}")"
          run_profile="$(jq -r '.test_profile // empty' <<<"${run}")"
          run_host_os="$(jq -r '.inputs.host_os // empty' <<<"${run}")"
          test -n "${project_key}" \
            && test "${run_repository}" = "${SOURCE_REPOSITORY}" \
            && test "${run_ref}" = "${SOURCE_REF}" \
            && test "${run_is_tag}" = "${SOURCE_IS_TAG}" || {
            echo "repository CI host resolution is not bound to the exact Agent State request" >&2
            exit 1
          }

          if test "${context}" = trusted_parent; then
            case "${run_workflow}" in
              release.library-package)
                test "${run_profile}" = publish \
                  && test "${SOURCE_IS_TAG}" = true || {
                  echo "repository CI aggregate child is not bound to release.library-package/publish" >&2
                  exit 1
                }
                case "${OPERATION}" in
                  full|release) ;;
                  *)
                    echo "repository CI library-package aggregate supports only full readiness or release preparation" >&2
                    exit 2
                    ;;
                esac
                ;;
              validation.repository)
                test "${OPERATION}" != release \
                  && test "${run_profile}" = "${OPERATION}" || {
                  echo "repository CI planned child is not bound to the parent validation operation" >&2
                  exit 1
                }
                ;;
              release.repository)
                test "${OPERATION}" = release \
                  && test "${run_is_tag}" = true || {
                  echo "repository CI planned release child is not bound to the parent release operation" >&2
                  exit 1
                }
                ;;
              *)
                echo "repository CI trusted parent is not an approved repository parent operation" >&2
                exit 1
                ;;
            esac

            case "${LEGACY_HOST_OS}" in
              linux|macos) ;;
              *) echo "repository CI planned child OS must be linux or macos" >&2; exit 2 ;;
            esac
            resolution="$(rpc resolve_repository_ci_host_class_for_os "$(jq -cn \
              --arg project "${project_key}" \
              --arg repository "${SOURCE_REPOSITORY}" \
              --arg id "${capability_run_id}" \
              --arg operation "${OPERATION}" \
              --arg host_os "${LEGACY_HOST_OS}" \
              '{p_project_key:$project,p_repository:$repository,p_ci_run_id:$id,p_operation:$operation,p_host_os:$host_os}')")"
            test "$(jq -r '.ok' <<<"${resolution}")" = true || {
              code="$(jq -r '.code // "invalid_response"' <<<"${resolution}" 2>/dev/null || true)"
              echo "repository CI trusted planned-child host-class resolution failed closed: ${code}" >&2
              exit 1
            }
            test "$(jq -r '.project_key // empty' <<<"${resolution}")" = "${project_key}" \
              && test "$(jq -r '.repository // empty' <<<"${resolution}")" = "${SOURCE_REPOSITORY}" \
              && test "$(jq -r '.ci_run_id // empty' <<<"${resolution}")" = "${capability_run_id}" \
              && test "$(jq -r '.operation // empty' <<<"${resolution}")" = "${OPERATION}" \
              && test "$(jq -r '.host_os // empty' <<<"${resolution}")" = "${LEGACY_HOST_OS}" || {
              echo "repository CI trusted planned-child host-class resolution returned mismatched identity" >&2
              exit 1
            }
            emit_host "$(jq -r '.host_class // empty' <<<"${resolution}")"
            exit 0
          fi

          if test "${OPERATION}" = release; then
            test "${run_workflow}" = release.repository \
              && test "${run_profile}" = "${LEGACY_HOST_OS}" \
              && test "${SOURCE_IS_TAG}" = true || {
              echo "repository CI release host resolution is not bound to the exact Agent State request" >&2
              exit 1
            }
          else
            test "${run_workflow}" = validation.repository \
              && test "${run_profile}" = "${OPERATION}" \
              && test "${run_host_os}" = "${LEGACY_HOST_OS}" || {
              echo "repository CI validation host resolution is not bound to the exact Agent State request" >&2
              exit 1
            }
          fi

          resolution="$(rpc resolve_repository_ci_host_class "$(jq -cn \
            --arg project "${project_key}" \
            --arg repository "${SOURCE_REPOSITORY}" \
            --arg id "${capability_run_id}" \
            --arg operation "${OPERATION}" \
            '{p_project_key:$project,p_repository:$repository,p_ci_run_id:$id,p_operation:$operation}')")"
          if test "$(jq -r '.ok' <<<"${resolution}")" = true; then
            test "$(jq -r '.project_key // empty' <<<"${resolution}")" = "${project_key}" \
              && test "$(jq -r '.repository // empty' <<<"${resolution}")" = "${SOURCE_REPOSITORY}" \
              && test "$(jq -r '.ci_run_id // empty' <<<"${resolution}")" = "${capability_run_id}" \
              && test "$(jq -r '.operation // empty' <<<"${resolution}")" = "${OPERATION}" || {
              echo "repository CI trusted host-class resolution returned mismatched identity" >&2
              exit 1
            }
            emit_host "$(jq -r '.host_class // empty' <<<"${resolution}")"
            exit 0
          fi

          code="$(jq -r '.code // "invalid_response"' <<<"${resolution}" 2>/dev/null || true)"
          if test "${code}" = repository_ci_not_configured; then
            case "${LEGACY_HOST_OS}" in
              linux) emit_host linux-hosted ;;
              macos) emit_host macos-hosted ;;
              *) echo "repository CI compatibility host_os must be linux or macos" >&2; exit 2 ;;
            esac
            exit 0
          fi

          echo "repository CI trusted host-class resolution failed closed: ${code}" >&2
          exit 1

  execute:
    needs: resolve_host
    runs-on: ${{ fromJSON(needs.resolve_host.outputs.runs_on) }}
    timeout-minutes: 300
    steps:
      - name: Assert reviewed Linux high-capacity runner
        if: ${{ needs.resolve_host.outputs.host_class == 'linux-high-capacity' }}
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -Eeuo pipefail
          test "${RUNNER_ENVIRONMENT}" = self-hosted || {
            echo "linux-high-capacity must execute on a self-hosted runner" >&2
            exit 1
          }
          test "${RUNNER_OS}" = Linux || {
            echo "linux-high-capacity must execute on Linux" >&2
            exit 1
          }
          test "${RUNNER_ARCH}" = X64 || {
            echo "linux-high-capacity must execute on X64" >&2
            exit 1
          }
          echo "repository CI linux-high-capacity matched the reviewed self-hosted/linux/x64/ubuntu-latest-xl selector"

      - name: Initialize private execution paths
        shell: bash
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/central-repository-ci.log"
          log_dir="${RUNNER_TEMP}/repository-ci-logs"
          artifact_dir="${RUNNER_TEMP}/repository-ci-artifacts"
          progress="${RUNNER_TEMP}/repository-ci-progress.txt"
          checkpoint_seed="${RUNNER_TEMP}/central-repository-ci-log-checkpoint-seed.txt"
          mkdir -p "${log_dir}" "${artifact_dir}"
          : > "${log}"
          : > "${progress}"
          : > "${checkpoint_seed}"
          chmod 600 "${log}" "${progress}" "${checkpoint_seed}"
          chmod 700 "${log_dir}" "${artifact_dir}"
          {
            printf 'CI_LOG=%s\n' "${log}"
            printf 'CI_LOG_DIR=%s\n' "${log_dir}"
            printf 'CI_ARTIFACT_DIR=%s\n' "${artifact_dir}"
            printf 'CI_PROGRESS_FILE=%s\n' "${progress}"
          } >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Check out reviewed repository CI contract
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.sha }}
          path: central-ci
          fetch-depth: 1
          persist-credentials: false

      - name: Start bounded Central repository CI timeline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 central-ci/scripts/ci/repository_log_timeline.py start \
            --phase source-admission \
            --log-path "${CI_LOG}" \
            --state-path "${RUNNER_TEMP}/central-repository-ci-timeline.json"

      - name: Validate bounded repository operation
        id: request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ needs.resolve_host.outputs.host_os }}
          RAW_SEMANTIC_INPUTS: ${{ inputs.semantic_inputs_json }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CONTRACT: ${{ github.workspace }}/central-ci/contracts/repository-ci-v1.json
        run: |
          set -Eeuo pipefail
          case "${HOST_OS}" in
            linux|macos) ;;
            *) echo "repository operation host_os must be linux or macos" >&2; exit 2 ;;
          esac
          if test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
            test -z "${LIFECYCLE_CI_RUN_ID}" || {
              echo "repository trusted parent capability context cannot also own Agent State lifecycle" >&2
              exit 2
            }
            test "${CALLER_REPOSITORY}" = StreamScapeTV/ci-workflows && test "${CALLER_REF}" = refs/heads/main || {
              echo "repository trusted parent capability context requires reviewed Central main" >&2
              exit 2
            }
          fi
          case "${OPERATION}" in
            build) entrypoint=.ci/build.sh ;;
            test) entrypoint=.ci/test.sh ;;
            full) entrypoint=.ci/test-full.sh ;;
            ui-test) entrypoint=.ci/test-ui.sh ;;
            device-test) entrypoint=.ci/device-test.sh ;;
            release)
              entrypoint=.ci/release.sh
              test "${CALLER_REPOSITORY}" = StreamScapeTV/ci-workflows && test "${CALLER_REF}" = refs/heads/main || {
                echo "repository release requires a reviewed StreamScapeTV/ci-workflows main caller" >&2
                exit 2
              }
              test "${RELEASE_AUTHORIZED}" = true || {
                echo "repository release requires a separately authorized Central caller" >&2
                exit 2
              }
              test "${SOURCE_IS_TAG}" = true || {
                echo "repository release requires an admitted immutable tag source" >&2
                exit 2
              }
              ;;
            *) echo "unsupported repository semantic operation" >&2; exit 2 ;;
          esac
          if test "${OPERATION}" != release && test "${RELEASE_AUTHORIZED}" = true; then
            echo "release authorization is accepted only by the release operation" >&2
            exit 2
          fi
          export ENTRYPOINT="${entrypoint}"
          python3 - <<'PY_REPOSITORY_INPUTS'
          import json
          import os
          import re
          from pathlib import Path

          contract_path = Path(os.environ["CONTRACT"])
          if contract_path.is_symlink() or not contract_path.is_file():
              raise SystemExit("repository CI contract must be one regular file")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          if not isinstance(contract, dict) or contract.get("schemaVersion") != 1:
              raise SystemExit("repository CI contract schema is invalid")

          operation = os.environ["OPERATION"]
          host_os = os.environ["HOST_OS"]
          entrypoint = os.environ["ENTRYPOINT"]
          raw = os.environ.get("RAW_SEMANTIC_INPUTS", "{}")
          semantic = contract.get("semanticInputs")
          adoption = contract.get("adoption")
          if not isinstance(semantic, dict) or not isinstance(adoption, dict):
              raise SystemExit("repository CI contract is incomplete")
          max_raw = semantic.get("maxRawBytes")
          if not isinstance(max_raw, int) or isinstance(max_raw, bool) or not 1 <= max_raw <= 16384:
              raise SystemExit("repository CI semantic input bound is invalid")
          if len(raw.encode("utf-8")) > max_raw:
              raise SystemExit("repository CI semantic input payload exceeds the reviewed bound")
          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate semantic field: {key}")
                  result[key] = value
              return result

          try:
              values = json.loads(raw, object_pairs_hook=reject_duplicate_keys)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit("repository CI semantic inputs must be one unambiguous JSON object") from exc
          if not isinstance(values, dict):
              raise SystemExit("repository CI semantic inputs must be one JSON object")

          entrypoints = adoption.get("fixedEntrypoints")
          host_execution = adoption.get("hostExecution")
          if not isinstance(entrypoints, dict) or entrypoints.get(operation) != entrypoint:
              raise SystemExit("repository CI fixed entrypoint disagrees with the reviewed contract")
          if not isinstance(host_execution, dict) or host_os not in host_execution:
              raise SystemExit("repository CI host OS is not present in the reviewed contract")

          operations = semantic.get("operations")
          fields = semantic.get("fields")
          if not isinstance(operations, dict) or not isinstance(fields, dict) or operation not in operations:
              raise SystemExit("repository CI semantic operation schema is missing")
          spec = operations[operation]
          if not isinstance(spec, dict):
              raise SystemExit("repository CI semantic operation schema is invalid")
          allowed = spec.get("allowed")
          required = spec.get("required")
          if not isinstance(allowed, list) or not isinstance(required, list):
              raise SystemExit("repository CI semantic operation schema is invalid")
          if any(not isinstance(name, str) or name not in fields for name in allowed + required):
              raise SystemExit("repository CI semantic operation references an unknown field")
          if set(values) - set(allowed):
              raise SystemExit("repository CI semantic inputs contain an unknown field")
          if set(required) - set(values):
              raise SystemExit("repository CI semantic inputs omit a required field")

          def validate_field(name, value):
              field = fields[name]
              if not isinstance(field, dict):
                  raise SystemExit(f"repository CI semantic field {name} has an invalid schema")
              kind = field.get("type")
              if kind == "string":
                  if not isinstance(value, str):
                      raise SystemExit(f"repository CI semantic field {name} must be a string")
                  max_length = field.get("maxLength")
                  pattern = field.get("pattern")
                  if not isinstance(max_length, int) or isinstance(max_length, bool) or not 1 <= max_length <= 2048:
                      raise SystemExit(f"repository CI semantic field {name} has an invalid length bound")
                  if not 1 <= len(value) <= max_length or not isinstance(pattern, str) or re.fullmatch(pattern, value) is None:
                      raise SystemExit(f"repository CI semantic field {name} is outside the reviewed bound")
              elif kind == "enum":
                  choices = field.get("values")
                  if not isinstance(value, str) or not isinstance(choices, list) or value not in choices:
                      raise SystemExit(f"repository CI semantic field {name} is outside the reviewed enum")
              elif kind == "string-list":
                  max_items = field.get("maxItems")
                  max_length = field.get("itemMaxLength")
                  pattern = field.get("itemPattern")
                  reject_dash = field.get("rejectLeadingDash") is True
                  if not isinstance(value, list) or not isinstance(max_items, int) or isinstance(max_items, bool):
                      raise SystemExit(f"repository CI semantic field {name} must be a reviewed string list")
                  if not 0 <= len(value) <= max_items or max_items > 128:
                      raise SystemExit(f"repository CI semantic field {name} has too many items")
                  if not isinstance(max_length, int) or isinstance(max_length, bool) or not 1 <= max_length <= 2048 or not isinstance(pattern, str):
                      raise SystemExit(f"repository CI semantic field {name} has an invalid item schema")
                  for item in value:
                      if not isinstance(item, str) or not 1 <= len(item) <= max_length or re.fullmatch(pattern, item) is None:
                          raise SystemExit(f"repository CI semantic field {name} contains an invalid item")
                      if reject_dash and item.startswith("-"):
                          raise SystemExit(f"repository CI semantic field {name} contains a leading-dash item")
              else:
                  raise SystemExit(f"repository CI semantic field {name} has an unsupported type")

          for name, value in values.items():
              validate_field(name, value)

          normalized = json.dumps(
              {"schemaVersion": 1, "inputs": values},
              sort_keys=True,
              separators=(",", ":"),
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"entrypoint={entrypoint}\n")
              output.write(f"semantic_inputs_json={normalized}\n")
          PY_REPOSITORY_INPUTS

      - name: Prepare source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          permission-contents: read
          permission-metadata: read

      - name: Resolve exact repository source ref
        id: source_ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_IS_TAG: ${{ inputs.source_is_tag }}
        run: |
          set -Eeuo pipefail
          test -n "${REQUESTED_REF}" || {
            echo "repository-owned CI requires one non-empty branch or tag name" >&2
            exit 2
          }
          case "${REQUESTED_IS_TAG}" in
            false) namespace=refs/heads ;;
            true) namespace=refs/tags ;;
            *) echo "repository-owned CI source_is_tag must be true or false" >&2; exit 2 ;;
          esac
          full_ref="${namespace}/${REQUESTED_REF}"
          git check-ref-format "${full_ref}" >/dev/null || {
            echo "repository-owned CI requested branch/tag name is not a valid Git ref" >&2
            exit 2
          }
          printf 'full_ref=%s\n' "${full_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact repository source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.source_ref.outputs.full_ref }}
          token: ${{ steps.source.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and fixed tracked entrypoint
        id: source_identity
        shell: bash
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          if test -n "${EXPECTED_SOURCE_SHA}"; then
            [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "expected repository source SHA is invalid" >&2
              exit 2
            }
            test "${source_sha}" = "${EXPECTED_SOURCE_SHA}" || {
              echo "repository source moved after aggregate release admission" >&2
              exit 1
            }
          fi
          test -z "$(git -C source status --porcelain --untracked-files=all)" || {
            echo "repository source checkout is not clean" >&2
            exit 2
          }
          git -C source ls-files --error-unmatch -- "${ENTRYPOINT}" >/dev/null || {
            echo "requested fixed repository entrypoint is not tracked" >&2
            exit 2
          }
          mode="$(git -C source ls-files -s -- "${ENTRYPOINT}" | awk 'NR==1 {print $1}')"
          test "${mode}" = 100755 || {
            echo "requested fixed repository entrypoint must be tracked executable mode 100755" >&2
            exit 2
          }
          path="source/${ENTRYPOINT}"
          test -f "${path}" && test ! -L "${path}" && test -x "${path}" || {
            echo "requested fixed repository entrypoint must be a regular executable file" >&2
            exit 2
          }
          python3 - "${path}" "${GITHUB_WORKSPACE}/source" <<'PY_ENTRYPOINT'
          from pathlib import Path
          import os
          import sys
          path = Path(sys.argv[1]).resolve(strict=True)
          root = Path(sys.argv[2]).resolve(strict=True)
          if os.path.commonpath((str(path), str(root))) != str(root):
              raise SystemExit("fixed repository entrypoint escapes the exact checkout")
          PY_ENTRYPOINT
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Record source-admission completion
        shell: bash
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          python3 central-ci/scripts/ci/repository_log_timeline.py finish \
            --phase source-admission \
            --status complete \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"
          python3 central-ci/scripts/ci/repository_log_timeline.py start \
            --phase private-capabilities \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"

      - name: Resolve trusted private infrastructure capabilities
        id: capabilities
        shell: bash
        env:
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ needs.resolve_host.outputs.host_os }}
          HOST_CLASS: ${{ needs.resolve_host.outputs.host_class }}
          OBSERVED_SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          NORMALIZED_INPUTS: ${{ steps.request.outputs.semantic_inputs_json }}
          CONTRACT: ${{ github.workspace }}/central-ci/contracts/repository-ci-v1.json
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        run: |
          set -Eeuo pipefail

          known_capabilities="$(python3 - "${CONTRACT}" <<'PY_KNOWN_CAPABILITIES'
          from pathlib import Path
          import json
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          capability_types = value.get("capabilityTypes")
          trusted = value.get("trustedCapabilityGrant")
          if not isinstance(capability_types, dict) or not isinstance(trusted, dict):
              raise SystemExit("repository CI capability contract is incomplete")
          expected = {"private_network", "github_git", "registry_netrc", "gradle_maven", "registry_oci_publish", "backup_s3_read", "protected_deployed_conformance", "apple_physical_device"}
          if set(capability_types) != expected:
              raise SystemExit("repository CI capability type set is not the reviewed v1 set")
          if trusted.get("source") != "Agent State project configuration":
              raise SystemExit("repository CI trusted capability authority is invalid")
          if trusted.get("projectStateKey") != "repository_ci" or trusted.get("acceptedSchemaVersions") != [1, 2, 3]:
              raise SystemExit("repository CI trusted capability schema is invalid")
          if trusted.get("defaultCapabilities") != [] or trusted.get("failClosed") is not True:
              raise SystemExit("repository CI trusted capability default must fail closed")
          capability_configuration = trusted.get("capabilityConfiguration") or {}
          backup_config = capability_configuration.get("backup_s3_read")
          if backup_config != {
              "projectStateKey": "repository_ci_backup_s3_read_v1",
              "schemaVersion": 1,
              "binding": ["project_key", "ci_run_id", "repository", "ref", "source_is_tag", "source_sha", "operation"],
          }:
              raise SystemExit("repository CI backup S3 read capability configuration is invalid")
          physical_config = capability_configuration.get("apple_physical_device")
          if physical_config != {
              "projectStateKey": "repository_ci_apple_physical_device_v1",
              "schemaVersion": 1,
              "maximumAuthorizationSeconds": 86400,
              "binding": ["repository", "ref", "source_is_tag", "source_sha", "operation", "platform", "device_class", "semantic_inputs_sha256"],
          }:
              raise SystemExit("repository CI Apple physical-device capability configuration is invalid")
          print(",".join(sorted(expected)))
          PY_KNOWN_CAPABILITIES
          )"

          emit_none() {
            python3 - "${known_capabilities}" "${GITHUB_OUTPUT}" <<'PY_NONE'
          from pathlib import Path
          import sys

          known, output_path = sys.argv[1:3]
          with Path(output_path).open("a", encoding="utf-8") as output:
              for capability in known.split(","):
                  output.write(f"{capability}=false\n")
              output.write("auth_enabled=false\n")
              output.write("project_key=\n")
              output.write("progress_relay_allowed=false\n")
              output.write("progress_ci_run_id=\n")
          PY_NONE
          }

          capability_run_id="${LIFECYCLE_CI_RUN_ID}"
          capability_context=repository_lifecycle
          if test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
            capability_run_id="${TRUSTED_CAPABILITY_CI_RUN_ID}"
            capability_context=trusted_parent
          fi
          if test -z "${capability_run_id}"; then
            emit_none
            exit 0
          fi

          : "${AGENT_STATE_SUPABASE_URL:?Agent State URL is required for trusted repository capabilities}"
          : "${AGENT_STATE_SUPABASE_SECRET_KEY:?Agent State secret is required for trusted repository capabilities}"

          headers=(
            -H "apikey: ${AGENT_STATE_SUPABASE_SECRET_KEY}"
            -H "Content-Type: application/json"
            -H "Content-Profile: agent_api"
            -H "Accept-Profile: agent_api"
          )
          rpc() {
            curl --fail --silent --show-error               "${headers[@]}"               --data "$2"               "${AGENT_STATE_SUPABASE_URL%/}/rest/v1/rpc/$1"
          }

          claim_response="$(rpc claim_ci_run "$(jq -cn --arg id "${capability_run_id}" '{p_ci_run_id:$id}')")"
          test "$(jq -r '.ok' <<<"${claim_response}")" = true || {
            echo "repository CI could not replay the trusted Agent State CI claim" >&2
            exit 1
          }
          run="$(jq -c '.run' <<<"${claim_response}")"
          project_key="$(jq -r '.project_key // empty' <<<"${run}")"
          run_repository="$(jq -r '.repository // empty' <<<"${run}")"
          run_ref="$(jq -r '.ref // empty' <<<"${run}")"
          run_is_tag="$(jq -r '.is_tag | tostring' <<<"${run}")"
          run_workflow="$(jq -r '.workflow_key // empty' <<<"${run}")"
          run_profile="$(jq -r '.test_profile // empty' <<<"${run}")"

          test -n "${project_key}"             && test "${run_repository}" = "${SOURCE_REPOSITORY}"             && test "${run_ref}" = "${SOURCE_REF}"             && test "${run_is_tag}" = "${SOURCE_IS_TAG}" || {
              echo "repository CI trusted capability grant is not bound to the exact Agent State request" >&2
              exit 1
            }
          case "${capability_context}" in
            repository_lifecycle)
              if test "${OPERATION}" = release; then
                test "${run_workflow}" = release.repository \
                  && test "${run_profile}" = "${HOST_OS}" \
                  && test "${run_is_tag}" = true || {
                    echo "repository CI trusted release capability grant is not bound to the exact Agent State request" >&2
                    exit 1
                  }
              else
                test "${run_workflow}" = validation.repository \
                  && test "${run_profile}" = "${OPERATION}" || {
                    echo "repository CI trusted capability grant is not bound to the exact Agent State request" >&2
                    exit 1
                  }
              fi
              ;;
            trusted_parent)
              case "${run_workflow}" in
                release.library-package)
                  capability_context=library_package_parent
                  test "${run_profile}" = publish || {
                    echo "repository CI trusted aggregate capability parent is not release.library-package/publish" >&2
                    exit 1
                  }
                  ;;
                validation.repository)
                  capability_context=repository_parent
                  test "${OPERATION}" != release && test "${run_profile}" = "${OPERATION}" || {
                    echo "repository CI trusted planned capability parent is not the requested validation operation" >&2
                    exit 1
                  }
                  ;;
                release.repository)
                  capability_context=repository_parent
                  test "${OPERATION}" = release && test "${run_is_tag}" = true || {
                    echo "repository CI trusted planned release capability parent is invalid" >&2
                    exit 1
                  }
                  ;;
                *) echo "repository CI trusted capability parent is invalid" >&2; exit 1 ;;
              esac
              ;;
            *) echo "repository CI trusted capability context is invalid" >&2; exit 1 ;;
          esac

          project_response="$(rpc get_project_state "$(jq -cn --arg project "${project_key}" '{p_project_key:$project}')")"
          project_state="$(jq -c '.state // {}' <<<"${project_response}")"
          PROJECT_STATE="${project_state}" CAPABILITY_RUN_ID="${capability_run_id}" python3 - "${known_capabilities}" "${SOURCE_REPOSITORY}" "${OPERATION}" "${HOST_OS}" "${capability_context}" "${project_key}" "${GITHUB_OUTPUT}" <<'PY_CAPABILITIES'
          from pathlib import Path
          import json
          import os
          import sys

          known_raw, expected_repository, operation, host_os, capability_context, project_key, output_path = sys.argv[1:8]
          known = set(known_raw.split(","))
          host_class = os.environ.get("HOST_CLASS", "")
          observed_source_sha = os.environ.get("OBSERVED_SOURCE_SHA", "")
          capability_run_id = os.environ.get("CAPABILITY_RUN_ID", "")
          try:
              normalized_inputs = json.loads(os.environ.get("NORMALIZED_INPUTS", "{}"))
          except json.JSONDecodeError as exc:
              raise SystemExit("repository CI normalized inputs are invalid") from exc
          state = json.loads(os.environ["PROJECT_STATE"])
          if not isinstance(state, dict):
              raise SystemExit("Agent State project configuration must be one object")
          grant = state.get("repository_ci")
          if grant is None:
              capabilities = []
          else:
              if not isinstance(grant, dict):
                  raise SystemExit("trusted repository CI capability grant schema is invalid")
              version = grant.get("schemaVersion")
              expected_fields = {"schemaVersion", "repository", "capabilities"}
              if version in {2, 3}:
                  expected_fields.add("hostPolicy")
              if set(grant) != expected_fields or version not in {1, 2, 3}:
                  raise SystemExit("trusted repository CI capability grant version is invalid")
              if version in {2, 3} and not isinstance(grant.get("hostPolicy"), dict):
                  raise SystemExit("trusted repository CI host policy is invalid")
              if grant.get("repository") != expected_repository:
                  raise SystemExit("trusted repository CI capability grant is bound to a different repository")
              capabilities = grant.get("capabilities")
              if not isinstance(capabilities, list) or len(capabilities) != len(set(capabilities)):
                  raise SystemExit("trusted repository CI capability grant must be one unique list")
              if any(not isinstance(value, str) or value not in known for value in capabilities):
                  raise SystemExit("trusted repository CI capability grant contains an unknown capability")

          enabled_capabilities = set(capabilities)
          if (
              operation != "release"
              or host_os != "linux"
              or capability_context not in {"repository_lifecycle", "repository_parent"}
          ):
              enabled_capabilities.discard("registry_oci_publish")
          if (
              operation != "release"
              or capability_context not in {"repository_lifecycle", "repository_parent"}
          ):
              enabled_capabilities.discard("backup_s3_read")
          if (
              operation != "full"
              or host_os != "linux"
              or capability_context not in {"repository_lifecycle", "repository_parent"}
          ):
              enabled_capabilities.discard("protected_deployed_conformance")
          if (
              operation != "device-test"
              or host_os != "macos"
              or capability_context not in {"repository_lifecycle", "repository_parent"}
          ):
              enabled_capabilities.discard("apple_physical_device")

          if "backup_s3_read" in enabled_capabilities:
              descriptor = state.get("repository_ci_backup_s3_read_v1")
              expected_descriptor_fields = {
                  "schemaVersion", "projectKey", "ciRunId", "repository", "ref",
                  "sourceIsTag", "sourceSha", "operation",
              }
              if not isinstance(descriptor, dict) or set(descriptor) != expected_descriptor_fields:
                  raise SystemExit("backup S3 read authorization descriptor is missing or invalid")
              if (
                  descriptor.get("schemaVersion") != 1
                  or descriptor.get("projectKey") != project_key
                  or descriptor.get("ciRunId") != capability_run_id
                  or descriptor.get("repository") != expected_repository
                  or descriptor.get("ref") != os.environ.get("SOURCE_REF", "")
                  or descriptor.get("sourceIsTag") != (os.environ.get("SOURCE_IS_TAG", "") == "true")
                  or descriptor.get("sourceSha") != observed_source_sha
                  or descriptor.get("operation") != "release"
              ):
                  raise SystemExit("backup S3 read authorization descriptor does not match this exact release run")

          physical_authorized_at = ""
          physical_expires_at = ""
          if "apple_physical_device" in enabled_capabilities:
              from datetime import datetime, timezone
              if host_class != "macos-high-capacity":
                  raise SystemExit("Apple physical-device capability requires the reviewed high-capacity macOS host")
              if not isinstance(normalized_inputs, dict) or normalized_inputs.get("schemaVersion") != 1:
                  raise SystemExit("Apple physical-device capability requires normalized repository inputs")
              device_inputs = normalized_inputs.get("inputs")
              if not isinstance(device_inputs, dict) or device_inputs.get("device_platform") != "ios":
                  raise SystemExit("Apple physical-device capability requires device_platform=ios")
              descriptor = state.get("repository_ci_apple_physical_device_v1")
              expected_descriptor_fields = {
                  "schemaVersion", "repository", "ref", "sourceIsTag", "sourceSha",
                  "operation", "platform", "deviceClass", "semanticInputsSha256", "authorizedAt", "expiresAt",
              }
              if not isinstance(descriptor, dict) or set(descriptor) != expected_descriptor_fields:
                  raise SystemExit("Apple physical-device authorization descriptor is missing or invalid")
              semantic_inputs_sha256 = __import__("hashlib").sha256(
                  json.dumps(normalized_inputs, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest()
              if (
                  descriptor.get("schemaVersion") != 1
                  or descriptor.get("repository") != expected_repository
                  or descriptor.get("ref") != os.environ.get("SOURCE_REF", "")
                  or descriptor.get("sourceIsTag") != (os.environ.get("SOURCE_IS_TAG", "") == "true")
                  or descriptor.get("sourceSha") != observed_source_sha
                  or descriptor.get("operation") != "device-test"
                  or descriptor.get("platform") != "ios"
                  or descriptor.get("deviceClass") != "iphone"
                  or descriptor.get("semanticInputsSha256") != semantic_inputs_sha256
              ):
                  raise SystemExit("Apple physical-device authorization descriptor does not match this exact request")
              def parse_utc(value, label):
                  if not isinstance(value, str) or not value.endswith("Z"):
                      raise SystemExit(f"Apple physical-device {label} must be UTC")
                  try:
                      parsed = datetime.fromisoformat(value[:-1] + "+00:00")
                  except ValueError as exc:
                      raise SystemExit(f"Apple physical-device {label} must be UTC") from exc
                  return parsed.astimezone(timezone.utc)
              authorized = parse_utc(descriptor.get("authorizedAt"), "authorization start")
              expires = parse_utc(descriptor.get("expiresAt"), "authorization expiry")
              now = datetime.now(timezone.utc)
              if expires <= authorized or (expires - authorized).total_seconds() > 86400:
                  raise SystemExit("Apple physical-device authorization window is outside the reviewed bound")
              if now < authorized or now >= expires:
                  raise SystemExit("Apple physical-device authorization is not currently active")
              physical_authorized_at = descriptor["authorizedAt"]
              physical_expires_at = descriptor["expiresAt"]

          if "protected_deployed_conformance" in enabled_capabilities and "private_network" not in enabled_capabilities:
              raise SystemExit("protected deployed conformance requires the reviewed private_network capability")

          with Path(output_path).open("a", encoding="utf-8") as output:
              for capability in sorted(known):
                  output.write(f"{capability}={'true' if capability in enabled_capabilities else 'false'}\n")
              output.write(f"apple_physical_device_authorized_at={physical_authorized_at}\n")
              output.write(f"apple_physical_device_expires_at={physical_expires_at}\n")
              auth_enabled = any(
                  value in enabled_capabilities
                  for value in ("github_git", "registry_netrc", "gradle_maven")
              )
              output.write(f"auth_enabled={'true' if auth_enabled else 'false'}\n")
              output.write(f"project_key={project_key}\n")
          PY_CAPABILITIES
          case "${capability_context}" in
            repository_lifecycle|repository_parent)
              {
                printf 'progress_relay_allowed=true\n'
                printf 'progress_ci_run_id=%s\n' "${capability_run_id}"
              } >> "${GITHUB_OUTPUT}"
              ;;
            *)
              {
                printf 'progress_relay_allowed=false\n'
                printf 'progress_ci_run_id=\n'
              } >> "${GITHUB_OUTPUT}"
              ;;
          esac


      - name: Connect reviewed private network capability
        if: ${{ steps.capabilities.outputs.private_network == 'true' }}
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Configure ephemeral generic package-manager authentication
        id: registry_auth
        if: ${{ steps.capabilities.outputs.auth_enabled == 'true' }}
        shell: bash
        env:
          USE_GITHUB_GIT: ${{ steps.capabilities.outputs.github_git }}
          USE_REGISTRY_NETRC: ${{ steps.capabilities.outputs.registry_netrc }}
          USE_GRADLE_MAVEN: ${{ steps.capabilities.outputs.gradle_maven }}
          GITHUB_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "${USE_GITHUB_GIT}:${USE_REGISTRY_NETRC}:${USE_GRADLE_MAVEN}" in
            true:*:*|false:true:*|false:false:true) ;;
            *) echo "repository CI authentication capability outputs are invalid" >&2; exit 2 ;;
          esac
          if test "${USE_REGISTRY_NETRC}" = true || test "${USE_GRADLE_MAVEN}" = true; then
            test -n "${REGISTRY_USERNAME}" && test -n "${REGISTRY_READ_TOKEN}" || {
              echo "reviewed private registry capability is missing its fixed read credential" >&2
              exit 1
            }
          fi
          auth_root="${RUNNER_TEMP}/central-registry-auth"
          auth_home="${auth_root}/home"
          git_config="${auth_root}/gitconfig"
          helper="${auth_root}/git-credential-central"
          rm -rf -- "${auth_root}"
          mkdir -p "${auth_home}"
          chmod 700 "${auth_root}" "${auth_home}"
          if test "${USE_GITHUB_GIT}" = true; then
            test -n "${GITHUB_SOURCE_TOKEN}" || exit 1
            printf '%s' "${GITHUB_SOURCE_TOKEN}" > "${auth_root}/github-token"
            chmod 600 "${auth_root}/github-token"
          fi
          if test "${USE_REGISTRY_NETRC}" = true || test "${USE_GRADLE_MAVEN}" = true; then
            printf '%s' "${REGISTRY_USERNAME}" > "${auth_root}/registry-user"
            printf '%s' "${REGISTRY_READ_TOKEN}" > "${auth_root}/registry-token"
            chmod 600 "${auth_root}/registry-user" "${auth_root}/registry-token"
          fi
          cat > "${helper}" <<'SH_CREDENTIAL_HELPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          protocol=""
          host=""
          while IFS='=' read -r key value; do
            case "${key}" in
              protocol) protocol="${value}" ;;
              host) host="${value}" ;;
            esac
          done
          test "${protocol}" = https || exit 0
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          case "${host}" in
            github.com)
              test -f "${root}/github-token" || exit 0
              printf 'username=x-access-token\npassword=%s\n' "$(cat "${root}/github-token")"
              ;;
            git.faruqi.dev)
              test -f "${root}/registry-user" && test -f "${root}/registry-token" || exit 0
              printf 'username=%s\npassword=%s\n' "$(cat "${root}/registry-user")" "$(cat "${root}/registry-token")"
              ;;
          esac
          SH_CREDENTIAL_HELPER
          chmod 700 "${helper}"
          git config --file "${git_config}" credential.helper "${helper}"
          git config --file "${git_config}" credential.useHttpPath false
          : > "${auth_home}/.netrc"
          if test "${USE_GITHUB_GIT}" = true; then
            cat >> "${auth_home}/.netrc" <<EOF_GITHUB_NETRC
          machine github.com
            login x-access-token
            password ${GITHUB_SOURCE_TOKEN}
          EOF_GITHUB_NETRC
          fi
          if test "${USE_REGISTRY_NETRC}" = true; then
            cat >> "${auth_home}/.netrc" <<EOF_REGISTRY_NETRC
          machine git.faruqi.dev
            login ${REGISTRY_USERNAME}
            password ${REGISTRY_READ_TOKEN}
          EOF_REGISTRY_NETRC
          fi
          chmod 600 "${auth_home}/.netrc"
          if test "${USE_GRADLE_MAVEN}" = true; then
            mkdir -p "${auth_home}/.gradle"
            chmod 700 "${auth_home}/.gradle"
            cat > "${auth_home}/.gradle/gradle.properties" <<EOF_GRADLE
          centralRegistryUsername=${REGISTRY_USERNAME}
          centralRegistryReadToken=${REGISTRY_READ_TOKEN}
          EOF_GRADLE
            chmod 600 "${auth_home}/.gradle/gradle.properties"
          fi
          {
            printf 'auth_home=%s\n' "${auth_home}"
            printf 'git_config=%s\n' "${git_config}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve bounded Gradle cache identity
        id: gradle_cache_identity
        if: >-
          ${{ inputs.operation == 'test'
              && needs.resolve_host.outputs.host_os == 'linux'
              && steps.capabilities.outputs.gradle_maven == 'true' }}
        shell: bash
        env:
          AUTH_HOME: ${{ steps.registry_auth.outputs.auth_home }}
          OBSERVED_SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -Eeuo pipefail
          test -n "${AUTH_HOME}" && test -d "${AUTH_HOME}/.gradle" \
            && test -f "${AUTH_HOME}/.gradle/gradle.properties" \
            && test ! -L "${AUTH_HOME}/.gradle/gradle.properties" || {
            echo "bounded Gradle cache requires the reviewed ephemeral Gradle authentication home" >&2
            exit 1
          }
          [[ "${OBSERVED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "bounded Gradle cache requires one exact observed source SHA" >&2
            exit 1
          }
          python3 - "${GITHUB_WORKSPACE}/source" "${OBSERVED_SOURCE_SHA}" "${GITHUB_OUTPUT}" <<'PY_GRADLE_CACHE_IDENTITY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import subprocess
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          source_sha = sys.argv[2]
          output_path = Path(sys.argv[3])
          raw = subprocess.run(
              ["git", "-C", str(root), "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          tracked = [item.decode("utf-8") for item in raw.split(b"\0") if item]

          def is_cache_identity_input(relative: str) -> bool:
              path = PurePosixPath(relative)
              if relative.startswith("gradle/"):
                  return True
              if relative.endswith((".gradle", ".gradle.kts")):
                  return True
              if path.name in {"gradle.properties", "versions.properties"}:
                  return True
              if path.parts and path.parts[0] in {"buildSrc", "build-logic", ".ci"}:
                  return True
              return len(path.parts) >= 2 and path.parts[0] == "scripts" and path.parts[1] == "ci"

          selected = sorted(relative for relative in tracked if is_cache_identity_input(relative))
          if "gradle/wrapper/gradle-wrapper.properties" not in selected:
              raise SystemExit("bounded Gradle cache requires one tracked Gradle wrapper")
          if not 1 <= len(selected) <= 512:
              raise SystemExit("bounded Gradle cache identity exceeds the reviewed 512-file limit")

          digest = hashlib.sha256(b"repository-gradle-cache-v1\0")
          total = 0
          for relative in selected:
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"bounded Gradle cache identity input must be one regular tracked file: {relative}")
              data = path.read_bytes()
              if len(data) > 1024 * 1024:
                  raise SystemExit(f"bounded Gradle cache identity input exceeds 1 MiB: {relative}")
              total += len(data)
              if total > 8 * 1024 * 1024:
                  raise SystemExit("bounded Gradle cache identity exceeds the reviewed 8 MiB total")
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(data)
              digest.update(b"\0")

          fingerprint = digest.hexdigest()
          source_repository = __import__("os").environ.get("SOURCE_REPOSITORY", "")
          if (
              not 3 <= len(source_repository) <= 200
              or source_repository.count("/") != 1
              or any(ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-/" for ch in source_repository)
          ):
              raise SystemExit("bounded Gradle cache requires one valid trusted source repository")
          repository_digest = hashlib.sha256(source_repository.encode("utf-8")).hexdigest()
          prefix = (
              f"repository-gradle-v1-{__import__('os').environ['RUNNER_OS']}-"
              f"{__import__('os').environ['RUNNER_ARCH']}-{repository_digest}-{fingerprint}-"
          )
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"fingerprint={fingerprint}\n")
              output.write(f"input_count={len(selected)}\n")
              output.write(f"input_bytes={total}\n")
              output.write(f"restore_key={prefix}\n")
              output.write(f"cache_key={prefix}{source_sha}\n")
          PY_GRADLE_CACHE_IDENTITY

      - name: Restore bounded Gradle user-home cache
        id: gradle_cache_restore
        if: ${{ steps.gradle_cache_identity.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/modules-2/files-2.1
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/transforms-*
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/jars-*
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/*/generated-gradle-jars
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/*/kotlin-dsl
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/wrapper/dists
          key: ${{ steps.gradle_cache_identity.outputs.cache_key }}
          restore-keys: |
            ${{ steps.gradle_cache_identity.outputs.restore_key }}

      - name: Record bounded Gradle cache restoration
        if: ${{ steps.gradle_cache_identity.outcome == 'success' }}
        shell: bash
        env:
          GRADLE_CACHE_HIT: ${{ steps.gradle_cache_restore.outputs.cache-hit }}
          GRADLE_CACHE_MATCHED_KEY: ${{ steps.gradle_cache_restore.outputs.cache-matched-key }}
          GRADLE_CACHE_FINGERPRINT: ${{ steps.gradle_cache_identity.outputs.fingerprint }}
          GRADLE_CACHE_INPUT_COUNT: ${{ steps.gradle_cache_identity.outputs.input_count }}
          GRADLE_CACHE_INPUT_BYTES: ${{ steps.gradle_cache_identity.outputs.input_bytes }}
        run: |
          set -Eeuo pipefail
          {
            printf '\n===== gradle-cache =====\n'
            printf 'cache_hit=%s\n' "${GRADLE_CACHE_HIT:-false}"
            printf 'matched_key=%s\n' "${GRADLE_CACHE_MATCHED_KEY:-none}"
            printf 'fingerprint=%s\n' "${GRADLE_CACHE_FINGERPRINT}"
            printf 'identity_files=%s\n' "${GRADLE_CACHE_INPUT_COUNT}"
            printf 'identity_bytes=%s\n' "${GRADLE_CACHE_INPUT_BYTES}"
          } >> "${CI_LOG}"

      - name: Configure ephemeral OCI publication authentication
        id: oci_publish_auth
        if: ${{ steps.capabilities.outputs.registry_oci_publish == 'true' }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ needs.resolve_host.outputs.host_os }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_WRITE_TOKEN: ${{ secrets.REGISTRY_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "${OPERATION}" = release && test "${HOST_OS}" = linux || {
            echo "OCI publication capability is bounded to authorized Linux repository release" >&2
            exit 2
          }
          test -n "${REGISTRY_USERNAME}" && test -n "${REGISTRY_WRITE_TOKEN}" || {
            echo "reviewed OCI publication capability is missing its fixed write credential" >&2
            exit 1
          }
          for tool in buildah skopeo helm; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "OCI publication host is missing required tool: ${tool}" >&2
              exit 1
            }
          done

          state_root="${RUNNER_TEMP}/central-oci-publish"
          auth_file="${state_root}/auth.json"
          helm_registry="${state_root}/helm-registry.json"
          helm_repositories="${state_root}/helm-repositories.yaml"
          helm_cache="${state_root}/helm-repository-cache"
          rm -rf -- "${state_root}"
          mkdir -m 0700 "${state_root}" "${helm_cache}"
          printf '{}\n' > "${auth_file}"
          chmod 0600 "${auth_file}"

          printf '%s' "${REGISTRY_WRITE_TOKEN}" |
            buildah login --authfile "${auth_file}" --username "${REGISTRY_USERNAME}" --password-stdin git.faruqi.dev >/dev/null
          printf '%s' "${REGISTRY_WRITE_TOKEN}" |
            HELM_REGISTRY_CONFIG="${helm_registry}" helm registry login git.faruqi.dev --username "${REGISTRY_USERNAME}" --password-stdin >/dev/null
          test -f "${auth_file}" && test ! -L "${auth_file}" || exit 1
          test -f "${helm_registry}" && test ! -L "${helm_registry}" || exit 1
          chmod 0600 "${helm_registry}"

          {
            printf 'auth_file=%s\n' "${auth_file}"
            printf 'helm_registry_config=%s\n' "${helm_registry}"
            printf 'helm_repository_config=%s\n' "${helm_repositories}"
            printf 'helm_repository_cache=%s\n' "${helm_cache}"
            printf 'registry_host=%s\n' 'git.faruqi.dev'
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve bounded progress relay owner
        id: progress_owner
        shell: bash
        env:
          RELAY_ALLOWED: ${{ steps.capabilities.outputs.progress_relay_allowed }}
          CAPABILITY_RUN_ID: ${{ steps.capabilities.outputs.progress_ci_run_id }}
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ needs.resolve_host.outputs.host_os }}
        run: |
          set -Eeuo pipefail
          owner_id=
          if test "${RELAY_ALLOWED:-false}" = true && test -n "${CAPABILITY_RUN_ID:-}"; then
            if test -n "${LIFECYCLE_CI_RUN_ID}"; then
              test "${CAPABILITY_RUN_ID}" = "${LIFECYCLE_CI_RUN_ID}" || {
                echo "repository progress relay lifecycle identity mismatch" >&2
                exit 2
              }
              owner_id="${CAPABILITY_RUN_ID}"
            elif test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
              test "${CAPABILITY_RUN_ID}" = "${TRUSTED_CAPABILITY_CI_RUN_ID}" || {
                echo "repository progress relay trusted parent identity mismatch" >&2
                exit 2
              }
              plan_rel=.ci/execution-plan.json
              plan_path="source/${plan_rel}"
              args=(--operation "${OPERATION}" --legacy-host-os "${HOST_OS}")
              if git -C source ls-files --error-unmatch -- "${plan_rel}" >/dev/null 2>&1; then
                mode="$(git -C source ls-files -s -- "${plan_rel}" | awk 'NR==1 {print $1}')"
                test "${mode}" = 100644 || { echo "repository progress execution plan must be tracked mode 100644" >&2; exit 2; }
                test -f "${plan_path}" && test ! -L "${plan_path}" || {
                  echo "repository progress execution plan must be a regular non-symlink file" >&2
                  exit 2
                }
                args+=(--plan "${plan_path}")
              else
                test ! -e "${plan_path}" && test ! -L "${plan_path}" || {
                  echo "repository progress execution plan must be tracked" >&2
                  exit 2
                }
              fi
              selection="$(python3 central-ci/scripts/ci/repository_execution_plan.py "${args[@]}")"
              child_count="$(jq '.operatingSystems | length' <<<"${selection}")"
              selected_os="$(jq -r '.operatingSystems[0] // empty' <<<"${selection}")"
              if test "${child_count}" = 1 && test "${selected_os}" = "${HOST_OS}"; then
                owner_id="${CAPABILITY_RUN_ID}"
              fi
            fi
          fi
          printf 'ci_run_id=%s\n' "${owner_id}" >> "${GITHUB_OUTPUT}"

      - name: Record private-capabilities completion and start repository entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          seed="${RUNNER_TEMP}/central-repository-ci-log-checkpoint-seed.txt"
          python3 central-ci/scripts/ci/repository_log_timeline.py finish \
            --phase private-capabilities \
            --status complete \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"
          python3 central-ci/scripts/ci/repository_log_timeline.py start \
            --phase repository-entrypoint \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"
          cp -- "${CI_LOG}" "${seed}"
          chmod 600 "${seed}"

      - name: Start bounded Agent State progress relay
        id: progress_relay_start
        if: ${{ steps.progress_owner.outputs.ci_run_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          PROGRESS_CI_RUN_ID: ${{ steps.progress_owner.outputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          credentials="$(jq -cn \
            --arg url "${AGENT_STATE_SUPABASE_URL}" \
            --arg key "${AGENT_STATE_SUPABASE_SECRET_KEY}" \
            '{url:$url,key:$key}')"
          relay_pid_file="${RUNNER_TEMP}/central-repository-progress-relay.pid"
          relay_state="${RUNNER_TEMP}/central-repository-progress-relay-state.json"
          relay_stdout="${RUNNER_TEMP}/central-repository-progress-relay.stdout"
          relay_stderr="${RUNNER_TEMP}/central-repository-progress-relay.stderr"
          rm -f -- "${relay_pid_file}" "${relay_state}" "${relay_stdout}" "${relay_stderr}"
          env -i \
            PATH="${PATH}" \
            HOME="${HOME}" \
            RUNNER_TRACKING_ID="${RUNNER_TRACKING_ID:-}" \
            python3 central-ci/scripts/ci/repository_progress_relay.py watch \
              --ci-run-id "${PROGRESS_CI_RUN_ID}" \
              --progress-path "${CI_PROGRESS_FILE}" \
              --timeline-state-path "${RUNNER_TEMP}/central-repository-ci-timeline.json" \
              --log-path "${CI_LOG}" \
              --state-path "${relay_state}" \
              --heartbeat-seconds 60 \
              < <(printf '%s\n' "${credentials}") \
              >"${relay_stdout}" 2>"${relay_stderr}" &
          relay_pid=$!
          printf '%s\n' "${relay_pid}" > "${relay_pid_file}"
          chmod 600 "${relay_pid_file}"
          sleep 1
          if ! kill -0 "${relay_pid}" 2>/dev/null; then
            echo "::warning::repository CI progress relay did not remain active; product execution will continue" >&2
          fi

      - name: Seed stable private repository CI log object
        id: log_seed
        if: ${{ inputs.ci_run_id != '' || inputs.upload_private_log }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-repository-ci-log-checkpoint-seed.txt
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-repository-${{ inputs.operation }}-${{ needs.resolve_host.outputs.host_os }}.txt
          mime_type: text/plain

      - name: Execute fixed repository-owned entrypoint
        id: execute_contract
        shell: bash
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ needs.resolve_host.outputs.host_os }}
          HOST_CLASS: ${{ needs.resolve_host.outputs.host_class }}
          NORMALIZED_INPUTS: ${{ steps.request.outputs.semantic_inputs_json }}
          AUTH_ENABLED: ${{ steps.capabilities.outputs.auth_enabled }}
          AUTH_HOME: ${{ steps.registry_auth.outputs.auth_home }}
          AUTH_GIT_CONFIG: ${{ steps.registry_auth.outputs.git_config }}
          OCI_PUBLISH_ENABLED: ${{ steps.capabilities.outputs.registry_oci_publish }}
          OCI_AUTH_FILE: ${{ steps.oci_publish_auth.outputs.auth_file }}
          OCI_HELM_REGISTRY_CONFIG: ${{ steps.oci_publish_auth.outputs.helm_registry_config }}
          OCI_HELM_REPOSITORY_CONFIG: ${{ steps.oci_publish_auth.outputs.helm_repository_config }}
          OCI_HELM_REPOSITORY_CACHE: ${{ steps.oci_publish_auth.outputs.helm_repository_cache }}
          OCI_REGISTRY_HOST: ${{ steps.oci_publish_auth.outputs.registry_host }}
          PROTECTED_CONFORMANCE_ENABLED: ${{ steps.capabilities.outputs.protected_deployed_conformance }}
          PROTECTED_CONFORMANCE_PROJECT_KEY: ${{ steps.capabilities.outputs.project_key }}
          APPLE_PHYSICAL_DEVICE_ENABLED: ${{ steps.capabilities.outputs.apple_physical_device }}
          APPLE_PHYSICAL_DEVICE_AUTHORIZED_AT: ${{ steps.capabilities.outputs.apple_physical_device_authorized_at }}
          APPLE_PHYSICAL_DEVICE_EXPIRES_AT: ${{ steps.capabilities.outputs.apple_physical_device_expires_at }}
          BACKUP_S3_READ_ENABLED: ${{ steps.capabilities.outputs.backup_s3_read }}
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          CHECKPOINT_ENABLED: ${{ inputs.operation != 'device-test' && steps.capabilities.outputs.backup_s3_read != 'true' && (inputs.ci_run_id != '' || inputs.upload_private_log) && steps.log_seed.outcome == 'success' && 'true' || 'false' }}
          CHECKPOINT_FILE_ID: ${{ steps.log_seed.outputs.file_id }}
          CHECKPOINT_SEED_SHA256: ${{ steps.log_seed.outputs.file_sha256 }}
          CHECKPOINT_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CHECKPOINT_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CHECKPOINT_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_APPLE_TEAM_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          CI_APP_STORE_CONNECT_KEY_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
          CI_SECRET_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          CI_SECRET_REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
          CI_SECRET_REGISTRY_WRITE_TOKEN: ${{ secrets.REGISTRY_WRITE_TOKEN }}
          CI_SECRET_BACKUP_S3_ENDPOINT: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_ENDPOINT || '' }}
          CI_SECRET_BACKUP_S3_BUCKET: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_BUCKET || '' }}
          CI_SECRET_BACKUP_S3_REGION: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_REGION || '' }}
          CI_SECRET_BACKUP_S3_ACCESS_KEY_ID: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_ACCESS_KEY_ID || '' }}
          CI_SECRET_BACKUP_S3_SECRET_ACCESS_KEY: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_SECRET_ACCESS_KEY || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_HTTPS_TARGET: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_HTTPS_TARGET || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_WSS_TARGET: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_WSS_TARGET || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_HTTP_SCENARIO: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_HTTP_SCENARIO_GZIP_BASE64 || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO_GZIP_BASE64 || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_SETUP_CREDENTIAL: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_SETUP_CREDENTIAL || '' }}
          CI_SECRET_APPLE_TEAM_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_KEY_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_API_KEY: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
        run: |
          set -Eeuo pipefail
          protected_agent_state_url="${CI_SECRET_AGENT_STATE_URL:-}"
          protected_agent_state_key="${CI_SECRET_AGENT_STATE_KEY:-}"
          protected_https_target="${CI_SECRET_PROTECTED_DEPLOYED_HTTPS_TARGET:-}"
          protected_wss_target="${CI_SECRET_PROTECTED_DEPLOYED_WSS_TARGET:-}"
          protected_http_scenario="${CI_SECRET_PROTECTED_DEPLOYED_HTTP_SCENARIO:-}"
          protected_websocket_scenario="${CI_SECRET_PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO:-}"
          protected_setup_credential="${CI_SECRET_PROTECTED_DEPLOYED_SETUP_CREDENTIAL:-}"
          backup_s3_endpoint="${CI_SECRET_BACKUP_S3_ENDPOINT:-}"
          backup_s3_bucket="${CI_SECRET_BACKUP_S3_BUCKET:-}"
          backup_s3_region="${CI_SECRET_BACKUP_S3_REGION:-}"
          backup_s3_access_key_id="${CI_SECRET_BACKUP_S3_ACCESS_KEY_ID:-}"
          backup_s3_secret_access_key="${CI_SECRET_BACKUP_S3_SECRET_ACCESS_KEY:-}"
          if test "${BACKUP_S3_READ_ENABLED}" = true; then
            test "${OPERATION}" = release || { echo "backup S3 read capability is bounded to repository release" >&2; exit 2; }
            test -n "${backup_s3_endpoint}" && test -n "${backup_s3_bucket}" \
              && test -n "${backup_s3_access_key_id}" && test -n "${backup_s3_secret_access_key}" || {
                echo "reviewed backup S3 read capability is missing its fixed connection bundle" >&2
                exit 1
              }
          fi
          runner_home="${HOME}"
          if test "${AUTH_ENABLED}" = true; then
            if test "${HOST_OS}" = macos && test "${OPERATION}" = device-test; then
              export HOME="${runner_home}"
            else
              export HOME="${AUTH_HOME}"
            fi
            export GIT_CONFIG_GLOBAL="${AUTH_GIT_CONFIG}"
            export GIT_TERMINAL_PROMPT=0
          fi
          export CI_HOST_OS="${HOST_OS}"
          export CI_HOST_CLASS="${HOST_CLASS}"
          export CI_OPERATION="${OPERATION}"
          export CI_INPUTS_JSON="${NORMALIZED_INPUTS}"
          export CI_PROTECTED_DEPLOYED_CONFORMANCE="${PROTECTED_CONFORMANCE_ENABLED}"
          export CI_APPLE_PHYSICAL_DEVICE_AUTHORIZED="${APPLE_PHYSICAL_DEVICE_ENABLED}"
          export CI_APPLE_PHYSICAL_DEVICE_AUTHORIZED_AT="${APPLE_PHYSICAL_DEVICE_AUTHORIZED_AT}"
          export CI_APPLE_PHYSICAL_DEVICE_EXPIRES_AT="${APPLE_PHYSICAL_DEVICE_EXPIRES_AT}"
          if test "${OPERATION}" = device-test && test "${APPLE_PHYSICAL_DEVICE_ENABLED}" != true; then
            echo "repository device-test requires the reviewed Apple physical-device capability" >&2
            exit 2
          fi
          if test "${OCI_PUBLISH_ENABLED}" = true; then
            test -n "${OCI_AUTH_FILE}" && test -n "${OCI_HELM_REGISTRY_CONFIG}" \
              && test -n "${OCI_REGISTRY_HOST}" || {
                echo "OCI publication capability setup is incomplete" >&2
                exit 1
              }
            export REGISTRY_AUTH_FILE="${OCI_AUTH_FILE}"
            export HELM_REGISTRY_CONFIG="${OCI_HELM_REGISTRY_CONFIG}"
            export HELM_REPOSITORY_CONFIG="${OCI_HELM_REPOSITORY_CONFIG}"
            export HELM_REPOSITORY_CACHE="${OCI_HELM_REPOSITORY_CACHE}"
            export CI_OCI_REGISTRY="${OCI_REGISTRY_HOST}"
          fi

          checkpoint_pid=""
          runtime_probe_pid=""
          runtime_probe_path=""
          stop_runtime_probe() {
            if test -n "${runtime_probe_pid}"; then
              if kill -0 "${runtime_probe_pid}" 2>/dev/null; then
                kill -TERM "${runtime_probe_pid}" 2>/dev/null || true
              fi
              set +e
              wait "${runtime_probe_pid}"
              runtime_probe_status=$?
              set -e
              if test "${runtime_probe_status}" -ne 0; then
                echo "::warning::repository runtime probe exited with status ${runtime_probe_status}; product execution result is preserved" >&2
              fi
            fi
            runtime_probe_pid=""
          }
          stop_checkpoint() {
            if test -n "${checkpoint_pid}"; then
              if kill -0 "${checkpoint_pid}" 2>/dev/null; then
                kill -TERM "${checkpoint_pid}" 2>/dev/null || true
              fi
              set +e
              wait "${checkpoint_pid}"
              checkpoint_status=$?
              set -e
              if test "${checkpoint_status}" -ne 0; then
                echo "::warning::repository log checkpoint helper exited with status ${checkpoint_status}; product execution continues and final Drive upload will retry" >&2
              fi
            fi
            checkpoint_pid=""
          }
          finish_entrypoint_timeline() {
            local phase_status="$1"
            if ! python3 central-ci/scripts/ci/repository_log_timeline.py finish \
              --phase repository-entrypoint \
              --status "${phase_status}" \
              --log-path "${CI_LOG}" \
              --state-path "${RUNNER_TEMP}/central-repository-ci-timeline.json" \
              --progress-path "${CI_PROGRESS_FILE}"; then
              echo "::warning::repository CI timeline finalization failed; product result is preserved" >&2
            fi
          }
          terminate_with_checkpoint() {
            stop_runtime_probe
            finish_entrypoint_timeline cancelled
            stop_checkpoint
            exit 143
          }
          trap terminate_with_checkpoint TERM INT
          trap 'stop_runtime_probe; stop_checkpoint' EXIT

          if test "${HOST_OS}" = macos && test "${OPERATION}" = ui-test; then
            runtime_probe_path="${CI_LOG_DIR}/central-runtime-probe.txt"
            : > "${runtime_probe_path}"
            chmod 600 "${runtime_probe_path}"
            python3 central-ci/scripts/ci/repository_runtime_probe.py run \
              --output-path "${runtime_probe_path}" &
            runtime_probe_pid=$!
          fi

          if test "${CHECKPOINT_ENABLED}" = true; then
            runtime_probe_options=()
            if test -n "${runtime_probe_path}"; then
              runtime_probe_options=(--runtime-probe-path "${runtime_probe_path}")
            fi
            GOOGLE_DRIVE_CLIENT_ID="${CHECKPOINT_GOOGLE_DRIVE_CLIENT_ID}" \
            GOOGLE_DRIVE_CLIENT_SECRET="${CHECKPOINT_GOOGLE_DRIVE_CLIENT_SECRET}" \
            GOOGLE_DRIVE_REFRESH_TOKEN="${CHECKPOINT_GOOGLE_DRIVE_REFRESH_TOKEN}" \
            python3 central-ci/scripts/ci/repository_log_checkpoint.py \
              --log-path "${CI_LOG}" \
              --file-id "${CHECKPOINT_FILE_ID}" \
              --seed-sha256 "${CHECKPOINT_SEED_SHA256}" \
              --status-path "${RUNNER_TEMP}/central-repository-ci-log-checkpoint-status.json" \
              --timeline-state-path "${RUNNER_TEMP}/central-repository-ci-timeline.json" \
              --progress-path "${CI_PROGRESS_FILE}" \
              "${runtime_probe_options[@]+"${runtime_probe_options[@]}"}" &
            checkpoint_pid=$!
          fi

          capture_overlap_bytes="$(python3 - <<'PY_CAPTURE_OVERLAP'
          import os

          maximum = 0
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              escaped = raw.replace(b"\n", b"\\n")
              maximum = max(maximum, len(raw), len(escaped))
          if maximum > 1024 * 1024:
              raise SystemExit("repository CI configured secret exceeds the reviewed capture overlap bound")
          print(maximum)
          PY_CAPTURE_OVERLAP
          )"

          unset \
            CHECKPOINT_GOOGLE_DRIVE_CLIENT_ID \
            CHECKPOINT_GOOGLE_DRIVE_CLIENT_SECRET \
            CHECKPOINT_GOOGLE_DRIVE_REFRESH_TOKEN \
            CI_SECRET_SOURCE_TOKEN \
            CI_SECRET_SOURCE_PRIVATE_KEY \
            CI_SECRET_AGENT_STATE_URL \
            CI_SECRET_AGENT_STATE_KEY \
            CI_SECRET_DRIVE_FOLDER \
            CI_SECRET_DRIVE_CLIENT_ID \
            CI_SECRET_DRIVE_CLIENT_SECRET \
            CI_SECRET_DRIVE_REFRESH_TOKEN \
            CI_SECRET_TAILSCALE_ID \
            CI_SECRET_TAILSCALE_SECRET \
            CI_SECRET_REGISTRY_USERNAME \
            CI_SECRET_REGISTRY_READ_TOKEN \
            CI_SECRET_REGISTRY_WRITE_TOKEN \
            CI_SECRET_BACKUP_S3_ENDPOINT \
            CI_SECRET_BACKUP_S3_BUCKET \
            CI_SECRET_BACKUP_S3_REGION \
            CI_SECRET_BACKUP_S3_ACCESS_KEY_ID \
            CI_SECRET_BACKUP_S3_SECRET_ACCESS_KEY \
            CI_SECRET_PROTECTED_DEPLOYED_HTTPS_TARGET \
            CI_SECRET_PROTECTED_DEPLOYED_WSS_TARGET \
            CI_SECRET_PROTECTED_DEPLOYED_HTTP_SCENARIO \
            CI_SECRET_PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO \
            CI_SECRET_PROTECTED_DEPLOYED_SETUP_CREDENTIAL \
            CI_SECRET_APPLE_TEAM_ID \
            CI_SECRET_APP_STORE_CONNECT_KEY_ID \
            CI_SECRET_APP_STORE_CONNECT_ISSUER_ID \
            CI_SECRET_APP_STORE_CONNECT_API_KEY

          set +e
          (
            cd source
            if test "${OPERATION}" = device-test; then
              python3 ../central-ci/scripts/ci/repository_apple_physical_device.py execute
            elif test "${BACKUP_S3_READ_ENABLED}" = true; then
              CI_BACKUP_S3_ENDPOINT="${backup_s3_endpoint}" \
              CI_BACKUP_S3_BUCKET="${backup_s3_bucket}" \
              CI_BACKUP_S3_REGION="${backup_s3_region}" \
              CI_BACKUP_S3_ACCESS_KEY_ID="${backup_s3_access_key_id}" \
              CI_BACKUP_S3_SECRET_ACCESS_KEY="${backup_s3_secret_access_key}" \
                "./${ENTRYPOINT}"
            else
              "./${ENTRYPOINT}"
            fi
            product_status=$?
            if test "${product_status}" -eq 0 && test "${PROTECTED_CONFORMANCE_ENABLED}" = true; then
              capability_run_id="${TRUSTED_CAPABILITY_CI_RUN_ID:-${LIFECYCLE_CI_RUN_ID}}"
              test -n "${PROTECTED_CONFORMANCE_PROJECT_KEY}" && test -n "${capability_run_id}" || {
                echo "protected deployed conformance requires one exact Agent State binding" >&2
                exit 2
              }
              test -n "${protected_agent_state_url}" && test -n "${protected_agent_state_key}" || {
                echo "protected deployed conformance requires Agent State access" >&2
                exit 2
              }
              protected_state_file="${RUNNER_TEMP}/central-protected-deployed-project-state.json"
              protected_root="${RUNNER_TEMP}/central-protected-deployed-conformance"
              rm -rf -- "${protected_root}"
              rm -f -- "${protected_state_file}"
              project_response="$(curl --fail --silent --show-error \
                -H "apikey: ${protected_agent_state_key}" \
                -H "Content-Type: application/json" \
                -H "Content-Profile: agent_api" \
                -H "Accept-Profile: agent_api" \
                --data "$(jq -cn --arg project "${PROTECTED_CONFORMANCE_PROJECT_KEY}" '{p_project_key:$project}')" \
                "${protected_agent_state_url%/}/rest/v1/rpc/get_project_state")" || exit 1
              PROJECT_RESPONSE="${project_response}" EXPECTED_PROJECT="${PROTECTED_CONFORMANCE_PROJECT_KEY}" \
                python3 - "${protected_state_file}" <<'PY_PROTECTED_STATE'
          from pathlib import Path
          import json
          import os
          import sys

          try:
              value = json.loads(os.environ["PROJECT_RESPONSE"])
          except json.JSONDecodeError as exc:
              raise SystemExit("protected deployed conformance received invalid Agent State JSON") from exc
          if not isinstance(value, dict) or value.get("project_key") != os.environ["EXPECTED_PROJECT"]:
              raise SystemExit("protected deployed conformance received mismatched Agent State project configuration")
          state = value.get("state")
          if not isinstance(state, dict):
              raise SystemExit("protected deployed conformance requires object-shaped Agent State project configuration")
          path = Path(sys.argv[1])
          path.write_text(json.dumps(state, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY_PROTECTED_STATE
              CI_PROTECTED_DEPLOYED_HTTPS_TARGET="${protected_https_target}" \
              CI_PROTECTED_DEPLOYED_WSS_TARGET="${protected_wss_target}" \
              CI_PROTECTED_DEPLOYED_HTTP_SCENARIO_GZIP_BASE64="${protected_http_scenario}" \
              CI_PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO_GZIP_BASE64="${protected_websocket_scenario}" \
              CI_PROTECTED_DEPLOYED_SETUP_CREDENTIAL="${protected_setup_credential}" \
                python3 ../central-ci/scripts/ci/protected_deployed_conformance.py materialize \
                  --project-state "${protected_state_file}" \
                  --repository "${SOURCE_REPOSITORY}" \
                  --operation "${OPERATION}" \
                  --run-id "${capability_run_id}" \
                  --output-root "${protected_root}" >/dev/null
              rm -f -- "${protected_state_file}"
              python3 ../central-ci/scripts/ci/protected_deployed_conformance.py run \
                --source-root . \
                --config-root "${protected_root}" \
                --repository "${SOURCE_REPOSITORY}" \
                --operation "${OPERATION}" \
                --run-id "${capability_run_id}" \
                --log-dir "${CI_LOG_DIR}" \
                --artifact-dir "${CI_ARTIFACT_DIR}"
              product_status=$?
            fi
            exit "${product_status}"
          ) 2>&1 | python3 central-ci/scripts/ci/repository_log_capture.py \
            --log-path "${CI_LOG}" \
            --overlap-bytes "${capture_overlap_bytes}"
          pipeline_status=("${PIPESTATUS[@]}")
          status="${pipeline_status[0]}"
          capture_status="${pipeline_status[1]}"
          set -e
          unset backup_s3_endpoint backup_s3_bucket backup_s3_region backup_s3_access_key_id backup_s3_secret_access_key
          stop_runtime_probe
          if test -n "${runtime_probe_path}" && test -s "${runtime_probe_path}"; then
            if ! python3 central-ci/scripts/ci/repository_runtime_probe.py summary \
              --probe-path "${runtime_probe_path}" \
              --log-path "${CI_LOG}"; then
              echo "::warning::repository runtime probe summary failed; raw bounded probe evidence is still retained" >&2
            fi
          fi
          if test "${status}" -eq 0; then
            finish_entrypoint_timeline complete
          else
            finish_entrypoint_timeline failed
          fi
          stop_checkpoint
          trap - TERM INT EXIT
          {
            printf 'exit_code=%s\n' "${status}"
            printf 'capture_exit_code=%s\n' "${capture_status}"
          } >> "${GITHUB_OUTPUT}"
          if test "${status}" -ne 0; then
            echo "repository-owned ${OPERATION} operation failed; inspect the private CI log" >&2
            exit "${status}"
          fi
          if test "${capture_status}" -ne 0; then
            echo "repository-owned ${OPERATION} operation completed but bounded private-log capture failed" >&2
            exit "${capture_status}"
          fi

      - name: Prepare bounded Gradle cache save
        id: gradle_cache_save_prepare
        if: >-
          ${{ always()
              && steps.gradle_cache_identity.outcome == 'success'
              && steps.execute_contract.outcome == 'success'
              && steps.gradle_cache_restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          AUTH_HOME: ${{ steps.registry_auth.outputs.auth_home }}
          CACHE_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CACHE_SECRET_REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - "${AUTH_HOME}/.gradle" "${GITHUB_OUTPUT}" <<'PY_GRADLE_CACHE_SAVE'
          from pathlib import Path
          import os
          import sys

          root = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          patterns = (
              "caches/modules-2/files-2.1",
              "caches/transforms-*",
              "caches/jars-*",
              "caches/*/generated-gradle-jars",
              "caches/*/kotlin-dsl",
              "wrapper/dists",
          )
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("bounded Gradle cache root must remain one real directory")
          resolved_root = root.resolve(strict=True)
          credentials = root / "gradle.properties"
          if credentials.is_symlink() or not credentials.is_file():
              raise SystemExit("bounded Gradle cache credential file must remain one regular file outside cached paths")

          secret_values = [
              value.encode()
              for name, value in os.environ.items()
              if name.startswith("CACHE_SECRET_") and value
          ]
          files = []
          seen = set()
          unsafe_reason = ""
          if any(len(secret) > 1024 * 1024 for secret in secret_values):
              unsafe_reason = "configured credential exceeds the reviewed 1 MiB scan bound"

          def contains_secret(path: Path) -> bool:
              if not secret_values:
                  return False
              overlap = max(len(secret) for secret in secret_values) - 1
              tail = b""
              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)
                      if not chunk:
                          return False
                      window = tail + chunk
                      if any(secret in window for secret in secret_values):
                          return True
                      tail = window[-overlap:] if overlap else b""

          total = 0
          for pattern in patterns:
              for base in sorted(root.glob(pattern)):
                  if base.is_symlink():
                      unsafe_reason = "cache path contains a symlink"
                      break
                  if not base.exists():
                      continue
                  for path in sorted(base.rglob("*")):
                      if path.is_symlink():
                          unsafe_reason = "cache path contains a symlink"
                          break
                      if not path.is_file():
                          continue
                      resolved = path.resolve(strict=True)
                      if os.path.commonpath((str(resolved), str(resolved_root))) != str(resolved_root):
                          unsafe_reason = "cache path escapes the reviewed Gradle user home"
                          break
                      if resolved in seen:
                          continue
                      seen.add(resolved)
                      if path.name.endswith(".lock") or path.name == "gc.properties":
                          path.unlink(missing_ok=True)
                          continue
                      size = path.stat().st_size
                      total += size
                      if len(seen) > 100000:
                          unsafe_reason = "cache exceeds the reviewed 100000-file limit"
                          break
                      if total > 2 * 1024 * 1024 * 1024:
                          unsafe_reason = "cache exceeds the reviewed 2 GiB limit"
                          break
                      if contains_secret(path):
                          unsafe_reason = "cache contains a configured credential value"
                          break
                      files.append(path)
                  if unsafe_reason:
                      break
              if unsafe_reason:
                  break

          allowed = not unsafe_reason and bool(files)
          if unsafe_reason:
              print(f"::warning::bounded Gradle cache save skipped: {unsafe_reason}")
          elif not files:
              print("::warning::bounded Gradle cache save skipped: no reviewed cache files were produced")
          else:
              print(f"bounded Gradle cache save prepared {len(files)} file(s), {total} bytes")
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"save_allowed={'true' if allowed else 'false'}\n")
              output.write(f"cache_files={len(files)}\n")
              output.write(f"cache_bytes={total}\n")
          PY_GRADLE_CACHE_SAVE

      - name: Save bounded Gradle user-home cache
        if: ${{ steps.gradle_cache_save_prepare.outputs.save_allowed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/modules-2/files-2.1
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/transforms-*
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/jars-*
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/*/generated-gradle-jars
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/caches/*/kotlin-dsl
            ${{ steps.registry_auth.outputs.auth_home }}/.gradle/wrapper/dists
          key: ${{ steps.gradle_cache_identity.outputs.cache_key }}

      - name: Reconcile bounded Central timeline after early exit
        if: ${{ always() }}
        shell: bash
        env:
          TIMELINE_STATUS: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          if test -f "${timeline}"; then
            if ! python3 central-ci/scripts/ci/repository_log_timeline.py finish-active \
              --status "${TIMELINE_STATUS}" \
              --log-path "${CI_LOG}" \
              --state-path "${timeline}" \
              --progress-path "${CI_PROGRESS_FILE}"; then
              echo "::warning::repository CI timeline reconciliation failed; evidence handling continues" >&2
            fi
            if ! python3 central-ci/scripts/ci/repository_log_timeline.py fill-skipped \
              --through repository-entrypoint \
              --log-path "${CI_LOG}" \
              --state-path "${timeline}"; then
              echo "::warning::repository CI timeline skip reconciliation failed; evidence handling continues" >&2
            fi
          fi

      - name: Start bounded Central evidence timeline phase
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          if test -f "${timeline}"; then
            python3 central-ci/scripts/ci/repository_log_timeline.py start \
              --phase evidence \
              --log-path "${CI_LOG}" \
              --state-path "${timeline}"
          fi

      - name: Scrub configured CI secrets from private text evidence
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          CI_SECRET_REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
          CI_SECRET_REGISTRY_WRITE_TOKEN: ${{ secrets.REGISTRY_WRITE_TOKEN }}
          CI_SECRET_BACKUP_S3_ENDPOINT: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_ENDPOINT || '' }}
          CI_SECRET_BACKUP_S3_BUCKET: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_BUCKET || '' }}
          CI_SECRET_BACKUP_S3_REGION: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_REGION || '' }}
          CI_SECRET_BACKUP_S3_ACCESS_KEY_ID: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_ACCESS_KEY_ID || '' }}
          CI_SECRET_BACKUP_S3_SECRET_ACCESS_KEY: ${{ steps.capabilities.outputs.backup_s3_read == 'true' && secrets.BACKUP_S3_SECRET_ACCESS_KEY || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_HTTPS_TARGET: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_HTTPS_TARGET || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_WSS_TARGET: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_WSS_TARGET || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_HTTP_SCENARIO: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_HTTP_SCENARIO_GZIP_BASE64 || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_WEBSOCKET_SCENARIO_GZIP_BASE64 || '' }}
          CI_SECRET_PROTECTED_DEPLOYED_SETUP_CREDENTIAL: ${{ steps.capabilities.outputs.protected_deployed_conformance == 'true' && secrets.PROTECTED_DEPLOYED_SETUP_CREDENTIAL || '' }}
          CI_SECRET_APPLE_TEAM_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_KEY_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          CI_SECRET_APP_STORE_CONNECT_API_KEY: ${{ inputs.operation == 'release' && needs.resolve_host.outputs.host_os == 'macos' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '' }}
          CI_DYNAMIC_SECRET_FILE: ${{ runner.temp }}/central-apple-physical-device-secrets.txt
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [Path(os.environ["CI_LOG"]), Path(os.environ["CI_PROGRESS_FILE"])]
          log_root = Path(os.environ["CI_LOG_DIR"])
          artifact_root = Path(os.environ["CI_ARTIFACT_DIR"])
          artifact_selection_path = Path(os.environ["RUNNER_TEMP"]) / "central-repository-ci-artifact-selection.json"
          if artifact_selection_path.exists() or artifact_selection_path.is_symlink():
              artifact_selection_path.unlink()
          for name, root in (("CI_LOG_DIR", log_root), ("CI_ARTIFACT_DIR", artifact_root)):
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit(f"repository CI {name} must remain one real directory before scrub")
          resolved_log_root = log_root.resolve(strict=True)
          for path in sorted(log_root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"repository CI text evidence must not contain symlinks: {path.name}")
              if not path.is_file():
                  continue
              resolved = path.resolve(strict=True)
              if os.path.commonpath((str(resolved), str(resolved_log_root))) != str(resolved_log_root):
                  raise SystemExit(f"repository CI text evidence escapes its Central-owned root: {path.name}")
              paths.append(path)
          secrets = [value.encode() for name, value in os.environ.items() if name.startswith("CI_SECRET_") and value]
          dynamic_secret_path = Path(os.environ.get("CI_DYNAMIC_SECRET_FILE", str(Path(os.environ["RUNNER_TEMP"]) / "central-apple-physical-device-secrets.txt")))
          if dynamic_secret_path.exists() or dynamic_secret_path.is_symlink():
              if dynamic_secret_path.is_symlink() or not dynamic_secret_path.is_file():
                  raise SystemExit("repository CI dynamic secret evidence must be one regular non-symlink file")
              if dynamic_secret_path.stat().st_size > 8192:
                  raise SystemExit("repository CI dynamic secret evidence exceeds the reviewed bound")
              for line in dynamic_secret_path.read_bytes().splitlines():
                  if line:
                      secrets.append(line)
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"repository CI text evidence must remain one regular non-symlink file: {path.name}")
              if path.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit(f"repository CI text evidence file exceeds 16 MiB before scrub: {path.name}")
              data = path.read_bytes()
              for raw in secrets:
                  data = data.replace(raw, b"[REDACTED]")
                  escaped = raw.replace(b"\n", b"\\n")
                  if escaped != raw:
                      data = data.replace(escaped, b"[REDACTED]")
              path.write_bytes(data)

          def contains_configured_secret(data: bytes) -> bool:
              for raw in secrets:
                  if raw in data:
                      return True
                  escaped = raw.replace(b"\n", b"\\n")
                  if escaped != raw and escaped in data:
                      return True
              return False

          resolved_artifact_root = artifact_root.resolve(strict=True)
          retained_artifacts: list[dict[str, object]] = []
          quarantined_secret_count = 0
          excluded_oversized_count = 0
          for path in sorted(artifact_root.rglob("*")):
              relative_path = path.relative_to(artifact_root).as_posix()
              if path.is_symlink():
                  raw_target = os.readlink(path)
                  data = os.fsencode(raw_target)
                  if not data or len(data) > 4096:
                      raise SystemExit("repository CI artifact evidence symlink target is outside the reviewed bound")
                  lexical_target = Path(raw_target)
                  if not lexical_target.is_absolute():
                      lexical_target = path.parent / lexical_target
                  lexical_target = Path(os.path.abspath(lexical_target))
                  if os.path.commonpath((str(lexical_target), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                  resolved_target = path.resolve(strict=False)
                  if os.path.commonpath((str(resolved_target), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                  kind = "symlink"
              elif path.is_file():
                  resolved = path.resolve(strict=True)
                  if os.path.commonpath((str(resolved), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit(f"repository CI artifact evidence escapes its Central-owned root: {path.name}")
                  if path.stat().st_size > 16 * 1024 * 1024:
                      excluded_oversized_count += 1
                      continue
                  data = path.read_bytes()
                  kind = "file"
              else:
                  continue
              if contains_configured_secret(data):
                  quarantined_secret_count += 1
                  continue
              retained_artifacts.append(
                  {
                      "kind": kind,
                      "path": relative_path,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  }
              )

          artifact_selection_bytes = (
              json.dumps(
                  {"schema_version": 1, "artifacts": retained_artifacts},
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
          ).encode("utf-8")
          artifact_selection_path.write_bytes(artifact_selection_bytes)
          os.chmod(artifact_selection_path, 0o600)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "artifact_selection_sha256="
                  f"{hashlib.sha256(artifact_selection_bytes).hexdigest()}\n"
              )
          print(
              "repository CI artifact selection retained "
              f"{len(retained_artifacts)} artifact(s); quarantined "
              f"{quarantined_secret_count} secret-bearing and excluded "
              f"{excluded_oversized_count} oversized artifact(s)"
          )
          PY_REDACT
          rm -f -- "${CI_DYNAMIC_SECRET_FILE:-${RUNNER_TEMP}/central-apple-physical-device-secrets.txt}"

      - name: Package bounded repository CI evidence
        id: evidence
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_SELECTION_SHA256: ${{ steps.scrub.outputs.artifact_selection_sha256 }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/central-repository-ci-evidence.zip"
          rm -f -- "${archive}"
          python3 - "${archive}" <<'PY_EVIDENCE'
          from pathlib import Path
          import hashlib
          import json
          import os
          import stat
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          log_root = Path(os.environ["CI_LOG_DIR"])
          artifact_root = Path(os.environ["CI_ARTIFACT_DIR"])
          artifact_selection_path = Path(os.environ["RUNNER_TEMP"]) / "central-repository-ci-artifact-selection.json"
          if artifact_selection_path.is_symlink() or not artifact_selection_path.is_file():
              raise SystemExit("repository CI artifact selection must remain one regular non-symlink file")
          expected_selection_sha256 = os.environ.get("ARTIFACT_SELECTION_SHA256", "")
          if (
              len(expected_selection_sha256) != 64
              or any(ch not in "0123456789abcdef" for ch in expected_selection_sha256)
          ):
              raise SystemExit("repository CI artifact selection digest is invalid")
          try:
              artifact_selection_bytes = artifact_selection_path.read_bytes()
          except OSError as exc:
              raise SystemExit("repository CI artifact selection is unreadable") from exc
          if hashlib.sha256(artifact_selection_bytes).hexdigest() != expected_selection_sha256:
              raise SystemExit("repository CI artifact selection changed after scrub")
          try:
              artifact_selection = json.loads(artifact_selection_bytes.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit("repository CI artifact selection is unreadable") from exc
          if (
              not isinstance(artifact_selection, dict)
              or set(artifact_selection) != {"schema_version", "artifacts"}
              or artifact_selection.get("schema_version") != 1
              or not isinstance(artifact_selection.get("artifacts"), list)
          ):
              raise SystemExit("repository CI artifact selection schema is invalid")

          entries: list[tuple[str, Path | None, bytes | None, bool]] = []
          total = 0
          if log_root.is_symlink() or not log_root.is_dir():
              raise SystemExit("repository CI logs root must remain one real directory")
          resolved_log_root = log_root.resolve(strict=True)
          for path in sorted(log_root.rglob("*")):
              archive_name = f"logs/{path.relative_to(log_root).as_posix()}"
              if path.is_symlink():
                  raise SystemExit("repository CI logs evidence must not contain symlinks")
              if not path.is_file():
                  continue
              resolved = path.resolve(strict=True)
              if os.path.commonpath((str(resolved), str(resolved_log_root))) != str(resolved_log_root):
                  raise SystemExit("repository CI logs evidence escapes its Central-owned root")
              size = path.stat().st_size
              if size > 16 * 1024 * 1024:
                  raise SystemExit("repository CI logs evidence file exceeds 16 MiB")
              total += size
              entries.append((archive_name, path, None, False))

          if artifact_root.is_symlink() or not artifact_root.is_dir():
              raise SystemExit("repository CI artifacts root must remain one real directory")
          resolved_artifact_root = artifact_root.resolve(strict=True)
          selected_paths: list[str] = []
          for item in artifact_selection["artifacts"]:
              if (
                  not isinstance(item, dict)
                  or set(item) != {"kind", "path", "sha256", "size"}
                  or item.get("kind") not in {"file", "symlink"}
                  or not isinstance(item.get("path"), str)
                  or not isinstance(item.get("sha256"), str)
                  or len(item["sha256"]) != 64
                  or any(ch not in "0123456789abcdef" for ch in item["sha256"])
                  or not isinstance(item.get("size"), int)
                  or isinstance(item.get("size"), bool)
                  or item["size"] < 0
              ):
                  raise SystemExit("repository CI artifact selection entry is invalid")
              relative = Path(item["path"])
              if relative.is_absolute() or not relative.parts or any(part in ("", ".", "..") for part in relative.parts):
                  raise SystemExit("repository CI artifact selection path is invalid")
              relative_text = relative.as_posix()
              selected_paths.append(relative_text)
              path = artifact_root / relative
              if item["kind"] == "symlink":
                  if not path.is_symlink():
                      raise SystemExit("repository CI artifact selection changed after scrub")
                  raw_target = os.readlink(path)
                  data = os.fsencode(raw_target)
                  if not data or len(data) > 4096:
                      raise SystemExit("repository CI artifact evidence symlink target is outside the reviewed bound")
                  lexical_target = Path(raw_target)
                  if not lexical_target.is_absolute():
                      lexical_target = path.parent / lexical_target
                  lexical_target = Path(os.path.abspath(lexical_target))
                  if os.path.commonpath((str(lexical_target), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                  resolved_target = path.resolve(strict=False)
                  if os.path.commonpath((str(resolved_target), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                  is_symlink = True
              else:
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit("repository CI artifact selection changed after scrub")
                  resolved = path.resolve(strict=True)
                  if os.path.commonpath((str(resolved), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit("repository CI artifact evidence escapes its Central-owned root")
                  if path.stat().st_size > 16 * 1024 * 1024:
                      raise SystemExit("repository CI artifact selection changed after scrub")
                  data = path.read_bytes()
                  is_symlink = False
              if len(data) != item["size"] or hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit("repository CI artifact selection changed after scrub")
              total += len(data)
              entries.append((f"artifacts/{relative_text}", None, data, is_symlink))
          if selected_paths != sorted(set(selected_paths)):
              raise SystemExit("repository CI artifact selection paths must be unique and sorted")

          progress = Path(os.environ["CI_PROGRESS_FILE"])
          if progress.is_symlink() or not progress.is_file():
              raise SystemExit("repository CI progress evidence must remain one regular file")
          if progress.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit("repository CI progress evidence file exceeds 16 MiB")
          total += progress.stat().st_size
          entries.append(("progress.txt", progress, None, False))
          if len(entries) > 256:
              raise SystemExit("repository CI evidence exceeds 256 files")
          if total > 64 * 1024 * 1024:
              raise SystemExit("repository CI evidence exceeds 64 MiB")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
              for name, path, payload, is_symlink in entries:
                  if path is not None:
                      output.write(path, arcname=name)
                      continue
                  if not is_symlink:
                      output.writestr(name, payload)
                      continue
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.external_attr = (stat.S_IFLNK | 0o777) << 16
                  info.compress_type = zipfile.ZIP_STORED
                  output.writestr(info, payload)
          PY_EVIDENCE
          test -f "${archive}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload private repository CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-repository-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-repository-${{ inputs.operation }}-${{ needs.resolve_host.outputs.host_os }}.txt
          mime_type: text/plain

      - name: Upload bounded repository CI evidence to Google Drive
        id: evidence_drive
        if: ${{ always() && steps.evidence.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ steps.evidence.outputs.archive }}
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-repository-${{ inputs.operation }}-${{ needs.resolve_host.outputs.host_os }}-evidence.zip
          mime_type: application/zip

      - name: Finalize evidence timeline and start cleanup settlement
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          SCRUB_OUTCOME: ${{ steps.scrub.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
          EVIDENCE_DRIVE_OUTCOME: ${{ steps.evidence_drive.outcome }}
          REQUIRES_UPLOAD: ${{ (inputs.ci_run_id != '' || inputs.upload_private_log) && 'true' || 'false' }}
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          if test ! -f "${timeline}"; then
            exit 0
          fi
          status=failed
          if test "${SCRUB_OUTCOME}" = success \
             && test "${EVIDENCE_OUTCOME}" = success \
             && { test "${REQUIRES_UPLOAD}" != true \
                  || { test "${DRIVE_OUTCOME}" = success && test "${EVIDENCE_DRIVE_OUTCOME}" = success; }; }; then
            status=complete
          fi
          if ! python3 central-ci/scripts/ci/repository_log_timeline.py finish \
            --phase evidence \
            --status "${status}" \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"; then
            echo "::warning::repository CI evidence timeline finalization failed; cleanup continues" >&2
            python3 central-ci/scripts/ci/repository_log_timeline.py fill-skipped \
              --through evidence \
              --log-path "${CI_LOG}" \
              --state-path "${timeline}" || true
          fi
          python3 central-ci/scripts/ci/repository_log_timeline.py start \
            --phase cleanup-settlement \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"

      - name: Cleanup ephemeral registry and repository evidence
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- \
            "${RUNNER_TEMP}/central-registry-auth" \
            "${RUNNER_TEMP}/central-oci-publish" \
            "${RUNNER_TEMP}/central-protected-deployed-conformance" \
            "${RUNNER_TEMP}/repository-ci-logs" \
            "${RUNNER_TEMP}/repository-ci-artifacts"
          rm -f -- \
            "${RUNNER_TEMP}/central-repository-ci-log-checkpoint-seed.txt" \
            "${RUNNER_TEMP}/central-repository-ci-log-checkpoint-status.json" \
            "${RUNNER_TEMP}/central-protected-deployed-project-state.json" \
            "${RUNNER_TEMP}/central-repository-ci-artifact-selection.json" \
            "${RUNNER_TEMP}/central-repository-ci-evidence.zip" \
            "${RUNNER_TEMP}/central-apple-physical-device-context.json" \
            "${RUNNER_TEMP}/central-apple-physical-device-secrets.txt" \
            "${RUNNER_TEMP}/central-apple-physical-device-inventory.json"
          for private_device_path in \
            "${RUNNER_TEMP}/central-apple-physical-device-context.json" \
            "${RUNNER_TEMP}/central-apple-physical-device-secrets.txt" \
            "${RUNNER_TEMP}/central-apple-physical-device-inventory.json"; do
            if test -e "${private_device_path}" || test -L "${private_device_path}"; then
              echo "repository CI physical-device private residue cleanup failed" >&2
              exit 1
            fi
          done

      - name: Finalize cleanup settlement timeline
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute_contract.outcome }}
          SCRUB_OUTCOME: ${{ steps.scrub.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
          EVIDENCE_DRIVE_OUTCOME: ${{ steps.evidence_drive.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          timeline="${RUNNER_TEMP}/central-repository-ci-timeline.json"
          if test ! -f "${timeline}"; then
            exit 0
          fi
          status=failed
          if test "${REQUEST_OUTCOME}" = success \
             && test "${SOURCE_IDENTITY_OUTCOME}" = success \
             && test "${EXECUTE_OUTCOME}" = success \
             && test "${SCRUB_OUTCOME}" = success \
             && test "${EVIDENCE_OUTCOME}" = success \
             && test "${DRIVE_OUTCOME}" = success \
             && test "${EVIDENCE_DRIVE_OUTCOME}" = success \
             && test "${CLEANUP_OUTCOME}" = success; then
            status=complete
          fi
          if ! python3 central-ci/scripts/ci/repository_log_timeline.py finish \
            --phase cleanup-settlement \
            --status "${status}" \
            --log-path "${CI_LOG}" \
            --state-path "${timeline}"; then
            echo "::warning::repository CI cleanup-settlement timeline finalization failed" >&2
          fi

      - name: Finalize bounded Agent State progress relay
        id: progress_relay_finish
        if: ${{ always() && steps.progress_owner.outputs.ci_run_id != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          pid_file="${RUNNER_TEMP}/central-repository-progress-relay.pid"
          stderr_file="${RUNNER_TEMP}/central-repository-progress-relay.stderr"
          if test -f "${pid_file}" && test ! -L "${pid_file}"; then
            relay_pid="$(cat "${pid_file}")"
            if [[ "${relay_pid}" =~ ^[1-9][0-9]*$ ]] && kill -0 "${relay_pid}" 2>/dev/null; then
              kill -TERM "${relay_pid}" 2>/dev/null || true
              for _ in $(seq 1 50); do
                kill -0 "${relay_pid}" 2>/dev/null || break
                sleep 0.2
              done
              if kill -0 "${relay_pid}" 2>/dev/null; then
                echo "::warning::repository CI progress relay did not stop after final flush window" >&2
                kill -KILL "${relay_pid}" 2>/dev/null || true
              fi
            fi
          fi
          if test -f "${stderr_file}" && test ! -L "${stderr_file}"; then
            while IFS= read -r warning; do
              test -z "${warning}" || echo "::warning::${warning}" >&2
            done < "${stderr_file}"
          fi

      - name: Cleanup retained repository progress evidence
        id: progress_cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            "${RUNNER_TEMP}/central-repository-ci.log" \
            "${RUNNER_TEMP}/repository-ci-progress.txt" \
            "${RUNNER_TEMP}/central-repository-ci-timeline.json"
          for path in \
            "${RUNNER_TEMP}/central-repository-ci.log" \
            "${RUNNER_TEMP}/repository-ci-progress.txt" \
            "${RUNNER_TEMP}/central-repository-ci-timeline.json"; do
            if test -e "${path}" || test -L "${path}"; then
              echo "repository CI retained progress evidence cleanup failed" >&2
              exit 1
            fi
          done

      - name: Cleanup bounded progress relay control state
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            "${RUNNER_TEMP}/central-repository-progress-relay.pid" \
            "${RUNNER_TEMP}/central-repository-progress-relay-state.json" \
            "${RUNNER_TEMP}/central-repository-progress-relay.stdout" \
            "${RUNNER_TEMP}/central-repository-progress-relay.stderr"

      - name: Cleanup persistent runner workspace
        id: workspace_cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/central-ci"; do
            rm -rf -- "${path}"
            if test -e "${path}" || test -L "${path}"; then
              echo "repository CI persistent workspace cleanup failed: ${path}" >&2
              exit 1
            fi
          done

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: >-
            ${{ steps.request.outcome == 'success'
                && steps.source_identity.outcome == 'success'
                && steps.execute_contract.outcome == 'success'
                && steps.scrub.outcome == 'success'
                && steps.evidence.outcome == 'success'
                && steps.drive.outcome == 'success'
                && steps.evidence_drive.outcome == 'success'
                && steps.cleanup.outcome == 'success'
                && steps.progress_cleanup.outcome == 'success'
                && steps.workspace_cleanup.outcome == 'success'
                && 'succeeded' || 'failed' }}
