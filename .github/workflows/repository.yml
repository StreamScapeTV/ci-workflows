name: Repository-owned CI

# Generic adoption contract:
# - Central selects only one fixed tracked .ci entrypoint and one host OS (linux/macos).
# - Product target, selector, UI-mode, toolchain and packaging behavior stays repository-owned.
# - Reviewed structured semantics arrive only through versioned CI_INPUTS_JSON; Central never
#   converts them into arbitrary argv, commands, executable paths, environment maps or runner labels.
# - Central owns exact-source checkout, bounded host selection, reviewed private infrastructure,
#   evidence/log transport, redaction/cleanup and Agent State lifecycle.
# - Private capability authorization is read from contracts/repository-ci-v1.json. The workflow
#   interprets generic capability names only; repository names do not select workflow code paths.
# - Release remains structurally gated by Central main + immutable tag + separate authorization.

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      source_is_tag:
        type: boolean
        required: false
        default: false
      expected_source_sha:
        type: string
        required: false
        default: ""
      trusted_capability_ci_run_id:
        type: string
        required: false
        default: ""
      operation:
        type: string
        required: true
      host_os:
        type: string
        required: true
      semantic_inputs_json:
        type: string
        required: false
        default: "{}"
      release_authorized:
        type: boolean
        required: false
        default: false
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  execute:
    runs-on: ${{ inputs.host_os == 'linux' && 'ubuntu-24.04' || 'macos-latest' }}
    timeout-minutes: 300
    steps:
      - name: Initialize private execution paths
        shell: bash
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/central-repository-ci.log"
          log_dir="${RUNNER_TEMP}/repository-ci-logs"
          artifact_dir="${RUNNER_TEMP}/repository-ci-artifacts"
          progress="${RUNNER_TEMP}/repository-ci-progress.txt"
          mkdir -p "${log_dir}" "${artifact_dir}"
          : > "${log}"
          : > "${progress}"
          chmod 600 "${log}" "${progress}"
          chmod 700 "${log_dir}" "${artifact_dir}"
          {
            printf 'CI_LOG=%s\n' "${log}"
            printf 'CI_LOG_DIR=%s\n' "${log_dir}"
            printf 'CI_ARTIFACT_DIR=%s\n' "${artifact_dir}"
            printf 'CI_PROGRESS_FILE=%s\n' "${progress}"
          } >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Check out reviewed repository CI contract
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.sha }}
          path: central-ci
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded repository operation
        id: request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ inputs.host_os }}
          RAW_SEMANTIC_INPUTS: ${{ inputs.semantic_inputs_json }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CONTRACT: ${{ github.workspace }}/central-ci/contracts/repository-ci-v1.json
        run: |
          set -Eeuo pipefail
          case "${HOST_OS}" in
            linux|macos) ;;
            *) echo "repository operation host_os must be linux or macos" >&2; exit 2 ;;
          esac
          if test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
            test -z "${LIFECYCLE_CI_RUN_ID}" || {
              echo "repository trusted aggregate capability context cannot also own Agent State lifecycle" >&2
              exit 2
            }
            test "${CALLER_REPOSITORY}" = StreamScapeTV/ci-workflows && test "${CALLER_REF}" = refs/heads/main || {
              echo "repository trusted aggregate capability context requires reviewed Central main" >&2
              exit 2
            }
            test "${SOURCE_IS_TAG}" = true || {
              echo "repository trusted aggregate capability context requires an immutable tag source" >&2
              exit 2
            }
            case "${OPERATION}" in
              full|release) ;;
              *) echo "repository trusted aggregate capability context is accepted only by full/release operations" >&2; exit 2 ;;
            esac
          fi
          case "${OPERATION}" in
            build) entrypoint=.ci/build.sh ;;
            test) entrypoint=.ci/test.sh ;;
            full) entrypoint=.ci/test-full.sh ;;
            ui-test) entrypoint=.ci/test-ui.sh ;;
            release)
              entrypoint=.ci/release.sh
              test "${CALLER_REPOSITORY}" = StreamScapeTV/ci-workflows && test "${CALLER_REF}" = refs/heads/main || {
                echo "repository release requires a reviewed StreamScapeTV/ci-workflows main caller" >&2
                exit 2
              }
              test "${RELEASE_AUTHORIZED}" = true || {
                echo "repository release requires a separately authorized Central caller" >&2
                exit 2
              }
              test "${SOURCE_IS_TAG}" = true || {
                echo "repository release requires an admitted immutable tag source" >&2
                exit 2
              }
              ;;
            *) echo "unsupported repository semantic operation" >&2; exit 2 ;;
          esac
          if test "${OPERATION}" != release && test "${RELEASE_AUTHORIZED}" = true; then
            echo "release authorization is accepted only by the release operation" >&2
            exit 2
          fi
          export ENTRYPOINT="${entrypoint}"
          python3 - <<'PY_REPOSITORY_INPUTS'
          import json
          import os
          import re
          from pathlib import Path

          contract_path = Path(os.environ["CONTRACT"])
          if contract_path.is_symlink() or not contract_path.is_file():
              raise SystemExit("repository CI contract must be one regular file")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          if not isinstance(contract, dict) or contract.get("schemaVersion") != 1:
              raise SystemExit("repository CI contract schema is invalid")

          operation = os.environ["OPERATION"]
          host_os = os.environ["HOST_OS"]
          entrypoint = os.environ["ENTRYPOINT"]
          raw = os.environ.get("RAW_SEMANTIC_INPUTS", "{}")
          semantic = contract.get("semanticInputs")
          adoption = contract.get("adoption")
          if not isinstance(semantic, dict) or not isinstance(adoption, dict):
              raise SystemExit("repository CI contract is incomplete")
          max_raw = semantic.get("maxRawBytes")
          if not isinstance(max_raw, int) or isinstance(max_raw, bool) or not 1 <= max_raw <= 16384:
              raise SystemExit("repository CI semantic input bound is invalid")
          if len(raw.encode("utf-8")) > max_raw:
              raise SystemExit("repository CI semantic input payload exceeds the reviewed bound")
          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate semantic field: {key}")
                  result[key] = value
              return result

          try:
              values = json.loads(raw, object_pairs_hook=reject_duplicate_keys)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit("repository CI semantic inputs must be one unambiguous JSON object") from exc
          if not isinstance(values, dict):
              raise SystemExit("repository CI semantic inputs must be one JSON object")

          entrypoints = adoption.get("fixedEntrypoints")
          host_execution = adoption.get("hostExecution")
          if not isinstance(entrypoints, dict) or entrypoints.get(operation) != entrypoint:
              raise SystemExit("repository CI fixed entrypoint disagrees with the reviewed contract")
          if not isinstance(host_execution, dict) or host_os not in host_execution:
              raise SystemExit("repository CI host OS is not present in the reviewed contract")

          operations = semantic.get("operations")
          fields = semantic.get("fields")
          if not isinstance(operations, dict) or not isinstance(fields, dict) or operation not in operations:
              raise SystemExit("repository CI semantic operation schema is missing")
          spec = operations[operation]
          if not isinstance(spec, dict):
              raise SystemExit("repository CI semantic operation schema is invalid")
          allowed = spec.get("allowed")
          required = spec.get("required")
          if not isinstance(allowed, list) or not isinstance(required, list):
              raise SystemExit("repository CI semantic operation schema is invalid")
          if any(not isinstance(name, str) or name not in fields for name in allowed + required):
              raise SystemExit("repository CI semantic operation references an unknown field")
          if set(values) - set(allowed):
              raise SystemExit("repository CI semantic inputs contain an unknown field")
          if set(required) - set(values):
              raise SystemExit("repository CI semantic inputs omit a required field")

          def validate_field(name, value):
              field = fields[name]
              if not isinstance(field, dict):
                  raise SystemExit(f"repository CI semantic field {name} has an invalid schema")
              kind = field.get("type")
              if kind == "string":
                  if not isinstance(value, str):
                      raise SystemExit(f"repository CI semantic field {name} must be a string")
                  max_length = field.get("maxLength")
                  pattern = field.get("pattern")
                  if not isinstance(max_length, int) or isinstance(max_length, bool) or not 1 <= max_length <= 2048:
                      raise SystemExit(f"repository CI semantic field {name} has an invalid length bound")
                  if not 1 <= len(value) <= max_length or not isinstance(pattern, str) or re.fullmatch(pattern, value) is None:
                      raise SystemExit(f"repository CI semantic field {name} is outside the reviewed bound")
              elif kind == "enum":
                  choices = field.get("values")
                  if not isinstance(value, str) or not isinstance(choices, list) or value not in choices:
                      raise SystemExit(f"repository CI semantic field {name} is outside the reviewed enum")
              elif kind == "string-list":
                  max_items = field.get("maxItems")
                  max_length = field.get("itemMaxLength")
                  pattern = field.get("itemPattern")
                  reject_dash = field.get("rejectLeadingDash") is True
                  if not isinstance(value, list) or not isinstance(max_items, int) or isinstance(max_items, bool):
                      raise SystemExit(f"repository CI semantic field {name} must be a reviewed string list")
                  if not 0 <= len(value) <= max_items or max_items > 128:
                      raise SystemExit(f"repository CI semantic field {name} has too many items")
                  if not isinstance(max_length, int) or isinstance(max_length, bool) or not 1 <= max_length <= 2048 or not isinstance(pattern, str):
                      raise SystemExit(f"repository CI semantic field {name} has an invalid item schema")
                  for item in value:
                      if not isinstance(item, str) or not 1 <= len(item) <= max_length or re.fullmatch(pattern, item) is None:
                          raise SystemExit(f"repository CI semantic field {name} contains an invalid item")
                      if reject_dash and item.startswith("-"):
                          raise SystemExit(f"repository CI semantic field {name} contains a leading-dash item")
              else:
                  raise SystemExit(f"repository CI semantic field {name} has an unsupported type")

          for name, value in values.items():
              validate_field(name, value)

          normalized = json.dumps(
              {"schemaVersion": 1, "inputs": values},
              sort_keys=True,
              separators=(",", ":"),
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"entrypoint={entrypoint}\n")
              output.write(f"semantic_inputs_json={normalized}\n")
          PY_REPOSITORY_INPUTS

      - name: Prepare source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          permission-contents: read
          permission-metadata: read

      - name: Resolve exact repository source ref
        id: source_ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_IS_TAG: ${{ inputs.source_is_tag }}
        run: |
          set -Eeuo pipefail
          test -n "${REQUESTED_REF}" || {
            echo "repository-owned CI requires one non-empty branch or tag name" >&2
            exit 2
          }
          case "${REQUESTED_IS_TAG}" in
            false) namespace=refs/heads ;;
            true) namespace=refs/tags ;;
            *) echo "repository-owned CI source_is_tag must be true or false" >&2; exit 2 ;;
          esac
          full_ref="${namespace}/${REQUESTED_REF}"
          git check-ref-format "${full_ref}" >/dev/null || {
            echo "repository-owned CI requested branch/tag name is not a valid Git ref" >&2
            exit 2
          }
          printf 'full_ref=%s\n' "${full_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact repository source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.source_ref.outputs.full_ref }}
          token: ${{ steps.source.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and fixed tracked entrypoint
        id: source_identity
        shell: bash
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          if test -n "${EXPECTED_SOURCE_SHA}"; then
            [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "expected repository source SHA is invalid" >&2
              exit 2
            }
            test "${source_sha}" = "${EXPECTED_SOURCE_SHA}" || {
              echo "repository source moved after aggregate release admission" >&2
              exit 1
            }
          fi
          test -z "$(git -C source status --porcelain --untracked-files=all)" || {
            echo "repository source checkout is not clean" >&2
            exit 2
          }
          git -C source ls-files --error-unmatch -- "${ENTRYPOINT}" >/dev/null || {
            echo "requested fixed repository entrypoint is not tracked" >&2
            exit 2
          }
          mode="$(git -C source ls-files -s -- "${ENTRYPOINT}" | awk 'NR==1 {print $1}')"
          test "${mode}" = 100755 || {
            echo "requested fixed repository entrypoint must be tracked executable mode 100755" >&2
            exit 2
          }
          path="source/${ENTRYPOINT}"
          test -f "${path}" && test ! -L "${path}" && test -x "${path}" || {
            echo "requested fixed repository entrypoint must be a regular executable file" >&2
            exit 2
          }
          python3 - "${path}" "${GITHUB_WORKSPACE}/source" <<'PY_ENTRYPOINT'
          from pathlib import Path
          import os
          import sys
          path = Path(sys.argv[1]).resolve(strict=True)
          root = Path(sys.argv[2]).resolve(strict=True)
          if os.path.commonpath((str(path), str(root))) != str(root):
              raise SystemExit("fixed repository entrypoint escapes the exact checkout")
          PY_ENTRYPOINT
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Resolve trusted private infrastructure capabilities
        id: capabilities
        shell: bash
        env:
          LIFECYCLE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          TRUSTED_CAPABILITY_CI_RUN_ID: ${{ inputs.trusted_capability_ci_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          OPERATION: ${{ inputs.operation }}
          CONTRACT: ${{ github.workspace }}/central-ci/contracts/repository-ci-v1.json
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        run: |
          set -Eeuo pipefail

          known_capabilities="$(python3 - "${CONTRACT}" <<'PY_KNOWN_CAPABILITIES'
          from pathlib import Path
          import json
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          capability_types = value.get("capabilityTypes")
          trusted = value.get("trustedCapabilityGrant")
          if not isinstance(capability_types, dict) or not isinstance(trusted, dict):
              raise SystemExit("repository CI capability contract is incomplete")
          expected = {"private_network", "github_git", "registry_netrc", "gradle_maven"}
          if set(capability_types) != expected:
              raise SystemExit("repository CI capability type set is not the reviewed v1 set")
          if trusted.get("source") != "Agent State project configuration":
              raise SystemExit("repository CI trusted capability authority is invalid")
          if trusted.get("projectStateKey") != "repository_ci" or trusted.get("schemaVersion") != 1:
              raise SystemExit("repository CI trusted capability schema is invalid")
          if trusted.get("defaultCapabilities") != [] or trusted.get("failClosed") is not True:
              raise SystemExit("repository CI trusted capability default must fail closed")
          print(",".join(sorted(expected)))
          PY_KNOWN_CAPABILITIES
          )"

          emit_none() {
            python3 - "${known_capabilities}" "${GITHUB_OUTPUT}" <<'PY_NONE'
          from pathlib import Path
          import sys

          known, output_path = sys.argv[1:3]
          with Path(output_path).open("a", encoding="utf-8") as output:
              for capability in known.split(","):
                  output.write(f"{capability}=false\n")
              output.write("auth_enabled=false\n")
          PY_NONE
          }

          capability_run_id="${LIFECYCLE_CI_RUN_ID}"
          capability_context=validation_repository
          if test -n "${TRUSTED_CAPABILITY_CI_RUN_ID}"; then
            capability_run_id="${TRUSTED_CAPABILITY_CI_RUN_ID}"
            capability_context=library_package_parent
          fi
          if test -z "${capability_run_id}"; then
            emit_none
            exit 0
          fi

          : "${AGENT_STATE_SUPABASE_URL:?Agent State URL is required for trusted repository capabilities}"
          : "${AGENT_STATE_SUPABASE_SECRET_KEY:?Agent State secret is required for trusted repository capabilities}"

          headers=(
            -H "apikey: ${AGENT_STATE_SUPABASE_SECRET_KEY}"
            -H "Content-Type: application/json"
            -H "Content-Profile: agent_api"
            -H "Accept-Profile: agent_api"
          )
          rpc() {
            curl --fail --silent --show-error               "${headers[@]}"               --data "$2"               "${AGENT_STATE_SUPABASE_URL%/}/rest/v1/rpc/$1"
          }

          claim_response="$(rpc claim_ci_run "$(jq -cn --arg id "${capability_run_id}" '{p_ci_run_id:$id}')")"
          test "$(jq -r '.ok' <<<"${claim_response}")" = true || {
            echo "repository CI could not replay the trusted Agent State CI claim" >&2
            exit 1
          }
          run="$(jq -c '.run' <<<"${claim_response}")"
          project_key="$(jq -r '.project_key // empty' <<<"${run}")"
          run_repository="$(jq -r '.repository // empty' <<<"${run}")"
          run_ref="$(jq -r '.ref // empty' <<<"${run}")"
          run_is_tag="$(jq -r '.is_tag | tostring' <<<"${run}")"
          run_workflow="$(jq -r '.workflow_key // empty' <<<"${run}")"
          run_profile="$(jq -r '.test_profile // empty' <<<"${run}")"

          test -n "${project_key}"             && test "${run_repository}" = "${SOURCE_REPOSITORY}"             && test "${run_ref}" = "${SOURCE_REF}"             && test "${run_is_tag}" = "${SOURCE_IS_TAG}" || {
              echo "repository CI trusted capability grant is not bound to the exact Agent State request" >&2
              exit 1
            }
          case "${capability_context}" in
            validation_repository)
              test "${run_workflow}" = validation.repository && test "${run_profile}" = "${OPERATION}" || {
                echo "repository CI trusted capability grant is not bound to the exact Agent State request" >&2
                exit 1
              }
              ;;
            library_package_parent)
              test "${run_workflow}" = release.library-package && test "${run_profile}" = publish || {
                echo "repository CI trusted aggregate capability parent is not release.library-package/publish" >&2
                exit 1
              }
              ;;
            *) echo "repository CI trusted capability context is invalid" >&2; exit 1 ;;
          esac

          project_response="$(rpc get_project_state "$(jq -cn --arg project "${project_key}" '{p_project_key:$project}')")"
          project_state="$(jq -c '.state // {}' <<<"${project_response}")"
          PROJECT_STATE="${project_state}" python3 - "${known_capabilities}" "${SOURCE_REPOSITORY}" "${GITHUB_OUTPUT}" <<'PY_CAPABILITIES'
          from pathlib import Path
          import json
          import os
          import sys

          known_raw, expected_repository, output_path = sys.argv[1:4]
          known = set(known_raw.split(","))
          state = json.loads(os.environ["PROJECT_STATE"])
          if not isinstance(state, dict):
              raise SystemExit("Agent State project configuration must be one object")
          grant = state.get("repository_ci")
          if grant is None:
              capabilities = []
          else:
              if not isinstance(grant, dict) or set(grant) != {"schemaVersion", "repository", "capabilities"}:
                  raise SystemExit("trusted repository CI capability grant schema is invalid")
              if grant.get("schemaVersion") != 1:
                  raise SystemExit("trusted repository CI capability grant version is invalid")
              if grant.get("repository") != expected_repository:
                  raise SystemExit("trusted repository CI capability grant is bound to a different repository")
              capabilities = grant.get("capabilities")
              if not isinstance(capabilities, list) or len(capabilities) != len(set(capabilities)):
                  raise SystemExit("trusted repository CI capability grant must be one unique list")
              if any(not isinstance(value, str) or value not in known for value in capabilities):
                  raise SystemExit("trusted repository CI capability grant contains an unknown capability")

          with Path(output_path).open("a", encoding="utf-8") as output:
              for capability in sorted(known):
                  output.write(f"{capability}={'true' if capability in capabilities else 'false'}\n")
              auth_enabled = any(
                  value in capabilities
                  for value in ("github_git", "registry_netrc", "gradle_maven")
              )
              output.write(f"auth_enabled={'true' if auth_enabled else 'false'}\n")
          PY_CAPABILITIES

      - name: Connect reviewed private network capability
        if: ${{ steps.capabilities.outputs.private_network == 'true' }}
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Configure ephemeral generic package-manager authentication
        id: registry_auth
        if: ${{ steps.capabilities.outputs.auth_enabled == 'true' }}
        shell: bash
        env:
          USE_GITHUB_GIT: ${{ steps.capabilities.outputs.github_git }}
          USE_REGISTRY_NETRC: ${{ steps.capabilities.outputs.registry_netrc }}
          USE_GRADLE_MAVEN: ${{ steps.capabilities.outputs.gradle_maven }}
          GITHUB_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "${USE_GITHUB_GIT}:${USE_REGISTRY_NETRC}:${USE_GRADLE_MAVEN}" in
            true:*:*|false:true:*|false:false:true) ;;
            *) echo "repository CI authentication capability outputs are invalid" >&2; exit 2 ;;
          esac
          if test "${USE_REGISTRY_NETRC}" = true || test "${USE_GRADLE_MAVEN}" = true; then
            test -n "${REGISTRY_USERNAME}" && test -n "${REGISTRY_READ_TOKEN}" || {
              echo "reviewed private registry capability is missing its fixed read credential" >&2
              exit 1
            }
          fi
          auth_root="${RUNNER_TEMP}/central-registry-auth"
          auth_home="${auth_root}/home"
          git_config="${auth_root}/gitconfig"
          helper="${auth_root}/git-credential-central"
          rm -rf -- "${auth_root}"
          mkdir -p "${auth_home}"
          chmod 700 "${auth_root}" "${auth_home}"
          if test "${USE_GITHUB_GIT}" = true; then
            test -n "${GITHUB_SOURCE_TOKEN}" || exit 1
            printf '%s' "${GITHUB_SOURCE_TOKEN}" > "${auth_root}/github-token"
            chmod 600 "${auth_root}/github-token"
          fi
          if test "${USE_REGISTRY_NETRC}" = true || test "${USE_GRADLE_MAVEN}" = true; then
            printf '%s' "${REGISTRY_USERNAME}" > "${auth_root}/registry-user"
            printf '%s' "${REGISTRY_READ_TOKEN}" > "${auth_root}/registry-token"
            chmod 600 "${auth_root}/registry-user" "${auth_root}/registry-token"
          fi
          cat > "${helper}" <<'SH_CREDENTIAL_HELPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          protocol=""
          host=""
          while IFS='=' read -r key value; do
            case "${key}" in
              protocol) protocol="${value}" ;;
              host) host="${value}" ;;
            esac
          done
          test "${protocol}" = https || exit 0
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          case "${host}" in
            github.com)
              test -f "${root}/github-token" || exit 0
              printf 'username=x-access-token\npassword=%s\n' "$(cat "${root}/github-token")"
              ;;
            git.faruqi.dev)
              test -f "${root}/registry-user" && test -f "${root}/registry-token" || exit 0
              printf 'username=%s\npassword=%s\n' "$(cat "${root}/registry-user")" "$(cat "${root}/registry-token")"
              ;;
          esac
          SH_CREDENTIAL_HELPER
          chmod 700 "${helper}"
          git config --file "${git_config}" credential.helper "${helper}"
          git config --file "${git_config}" credential.useHttpPath false
          : > "${auth_home}/.netrc"
          if test "${USE_GITHUB_GIT}" = true; then
            cat >> "${auth_home}/.netrc" <<EOF_GITHUB_NETRC
          machine github.com
            login x-access-token
            password ${GITHUB_SOURCE_TOKEN}
          EOF_GITHUB_NETRC
          fi
          if test "${USE_REGISTRY_NETRC}" = true; then
            cat >> "${auth_home}/.netrc" <<EOF_REGISTRY_NETRC
          machine git.faruqi.dev
            login ${REGISTRY_USERNAME}
            password ${REGISTRY_READ_TOKEN}
          EOF_REGISTRY_NETRC
          fi
          chmod 600 "${auth_home}/.netrc"
          if test "${USE_GRADLE_MAVEN}" = true; then
            mkdir -p "${auth_home}/.gradle"
            chmod 700 "${auth_home}/.gradle"
            cat > "${auth_home}/.gradle/gradle.properties" <<EOF_GRADLE
          centralRegistryUsername=${REGISTRY_USERNAME}
          centralRegistryReadToken=${REGISTRY_READ_TOKEN}
          EOF_GRADLE
            chmod 600 "${auth_home}/.gradle/gradle.properties"
          fi
          {
            printf 'auth_home=%s\n' "${auth_home}"
            printf 'git_config=%s\n' "${git_config}"
          } >> "${GITHUB_OUTPUT}"

      - name: Execute fixed repository-owned entrypoint
        id: execute_contract
        shell: bash
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          OPERATION: ${{ inputs.operation }}
          HOST_OS: ${{ inputs.host_os }}
          NORMALIZED_INPUTS: ${{ steps.request.outputs.semantic_inputs_json }}
          AUTH_ENABLED: ${{ steps.capabilities.outputs.auth_enabled }}
          AUTH_HOME: ${{ steps.registry_auth.outputs.auth_home }}
          AUTH_GIT_CONFIG: ${{ steps.registry_auth.outputs.git_config }}
        run: |
          set -Eeuo pipefail
          if test "${AUTH_ENABLED}" = true; then
            export HOME="${AUTH_HOME}"
            export GIT_CONFIG_GLOBAL="${AUTH_GIT_CONFIG}"
            export GIT_TERMINAL_PROMPT=0
          fi
          export CI_HOST_OS="${HOST_OS}"
          export CI_OPERATION="${OPERATION}"
          export CI_INPUTS_JSON="${NORMALIZED_INPUTS}"
          set +e
          (
            cd source
            "./${ENTRYPOINT}"
          ) >> "${CI_LOG}" 2>&1
          status=$?
          set -e
          printf 'exit_code=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          if test "${status}" -ne 0; then
            echo "repository-owned ${OPERATION} operation failed; inspect the private CI log" >&2
            exit "${status}"
          fi

      - name: Scrub configured CI secrets from private text evidence
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_TAILSCALE_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SECRET_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          CI_SECRET_REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          paths = [Path(os.environ["CI_LOG"]), Path(os.environ["CI_PROGRESS_FILE"])]
          log_root = Path(os.environ["CI_LOG_DIR"])
          artifact_root = Path(os.environ["CI_ARTIFACT_DIR"])
          for name, root in (("CI_LOG_DIR", log_root), ("CI_ARTIFACT_DIR", artifact_root)):
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit(f"repository CI {name} must remain one real directory before scrub")
          resolved_log_root = log_root.resolve(strict=True)
          for path in sorted(log_root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"repository CI text evidence must not contain symlinks: {path.name}")
              if not path.is_file():
                  continue
              resolved = path.resolve(strict=True)
              if os.path.commonpath((str(resolved), str(resolved_log_root))) != str(resolved_log_root):
                  raise SystemExit(f"repository CI text evidence escapes its Central-owned root: {path.name}")
              paths.append(path)
          secrets = [value.encode() for name, value in os.environ.items() if name.startswith("CI_SECRET_") and value]
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"repository CI text evidence must remain one regular non-symlink file: {path.name}")
              if path.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit(f"repository CI text evidence file exceeds 16 MiB before scrub: {path.name}")
              data = path.read_bytes()
              for raw in secrets:
                  data = data.replace(raw, b"[REDACTED]")
                  escaped = raw.replace(b"\n", b"\\n")
                  if escaped != raw:
                      data = data.replace(escaped, b"[REDACTED]")
              path.write_bytes(data)

          resolved_artifact_root = artifact_root.resolve(strict=True)
          for path in sorted(artifact_root.rglob("*")):
              if path.is_symlink():
                  data = os.fsencode(os.readlink(path))
              elif path.is_file():
                  resolved = path.resolve(strict=True)
                  if os.path.commonpath((str(resolved), str(resolved_artifact_root))) != str(resolved_artifact_root):
                      raise SystemExit(f"repository CI artifact evidence escapes its Central-owned root: {path.name}")
                  if path.stat().st_size > 16 * 1024 * 1024:
                      continue
                  data = path.read_bytes()
              else:
                  continue
              for raw in secrets:
                  if raw in data:
                      raise SystemExit(f"repository CI artifact evidence contains configured secret bytes: {path.name}")
                  escaped = raw.replace(b"\n", b"\\n")
                  if escaped != raw and escaped in data:
                      raise SystemExit(f"repository CI artifact evidence contains escaped configured secret bytes: {path.name}")
          PY_REDACT

      - name: Package bounded repository CI evidence
        id: evidence
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/central-repository-ci-evidence.zip"
          rm -f -- "${archive}"
          python3 - "${archive}" <<'PY_EVIDENCE'
          from pathlib import Path
          import os
          import stat
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          roots = (
              ("logs", Path(os.environ["CI_LOG_DIR"])),
              ("artifacts", Path(os.environ["CI_ARTIFACT_DIR"])),
          )
          entries: list[tuple[str, Path, bytes | None]] = []
          total = 0
          for prefix, root in roots:
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit(f"repository CI {prefix} root must remain one real directory")
              resolved_root = root.resolve(strict=True)
              for path in sorted(root.rglob("*")):
                  archive_name = f"{prefix}/{path.relative_to(root).as_posix()}"
                  if path.is_symlink():
                      if prefix != "artifacts":
                          raise SystemExit(f"repository CI {prefix} evidence must not contain symlinks")
                      raw_target = os.readlink(path)
                      target_bytes = os.fsencode(raw_target)
                      if not target_bytes or len(target_bytes) > 4096:
                          raise SystemExit("repository CI artifact evidence symlink target is outside the reviewed bound")
                      lexical_target = Path(raw_target)
                      if not lexical_target.is_absolute():
                          lexical_target = path.parent / lexical_target
                      lexical_target = Path(os.path.abspath(lexical_target))
                      if os.path.commonpath((str(lexical_target), str(resolved_root))) != str(resolved_root):
                          raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                      resolved_target = path.resolve(strict=False)
                      if os.path.commonpath((str(resolved_target), str(resolved_root))) != str(resolved_root):
                          raise SystemExit("repository CI artifact evidence symlink escapes its Central-owned root")
                      total += len(target_bytes)
                      entries.append((archive_name, path, target_bytes))
                      continue
                  if not path.is_file():
                      continue
                  resolved = path.resolve(strict=True)
                  if os.path.commonpath((str(resolved), str(resolved_root))) != str(resolved_root):
                      raise SystemExit(f"repository CI {prefix} evidence escapes its Central-owned root")
                  size = path.stat().st_size
                  if size > 16 * 1024 * 1024:
                      if prefix == "artifacts":
                          continue
                      raise SystemExit(f"repository CI {prefix} evidence file exceeds 16 MiB")
                  total += size
                  entries.append((archive_name, path, None))
          progress = Path(os.environ["CI_PROGRESS_FILE"])
          if progress.is_symlink() or not progress.is_file():
              raise SystemExit("repository CI progress evidence must remain one regular file")
          total += progress.stat().st_size
          entries.append(("progress.txt", progress, None))
          if len(entries) > 256:
              raise SystemExit("repository CI evidence exceeds 256 files")
          if total > 64 * 1024 * 1024:
              raise SystemExit("repository CI evidence exceeds 64 MiB")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
              for name, path, symlink_target in entries:
                  if symlink_target is None:
                      output.write(path, arcname=name)
                      continue
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.external_attr = (stat.S_IFLNK | 0o777) << 16
                  info.compress_type = zipfile.ZIP_STORED
                  output.writestr(info, symlink_target)
          PY_EVIDENCE
          test -f "${archive}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload private repository CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-repository-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-repository-${{ inputs.operation }}.txt
          mime_type: text/plain

      - name: Upload bounded repository CI evidence to Google Drive
        id: evidence_drive
        if: ${{ always() && steps.evidence.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ steps.evidence.outputs.archive }}
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-repository-${{ inputs.operation }}-evidence.zip
          mime_type: application/zip

      - name: Cleanup ephemeral registry and repository evidence
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- \
            "${RUNNER_TEMP}/central-registry-auth" \
            "${RUNNER_TEMP}/repository-ci-logs" \
            "${RUNNER_TEMP}/repository-ci-artifacts"
          rm -f -- \
            "${RUNNER_TEMP}/repository-ci-progress.txt" \
            "${RUNNER_TEMP}/central-repository-ci.log" \
            "${RUNNER_TEMP}/central-repository-ci-evidence.zip"

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: >-
            ${{ steps.request.outcome == 'success'
                && steps.source_identity.outcome == 'success'
                && steps.execute_contract.outcome == 'success'
                && steps.scrub.outcome == 'success'
                && steps.evidence.outcome == 'success'
                && steps.drive.outcome == 'success'
                && steps.evidence_drive.outcome == 'success'
                && steps.cleanup.outcome == 'success'
                && 'succeeded' || 'failed' }}
