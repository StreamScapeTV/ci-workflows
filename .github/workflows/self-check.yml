name: CI workflows self-check

"on":
  push:
    branches: [main, "issue/**", "orchestrator/**", "agent*/**", "codex*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow and action YAML
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [*Path('.github/workflows').glob('*.yml'), *Path('actions').glob('*/action.yml')]:
              yaml.safe_load(path.read_text())
          print('yaml-ok')
          PY
      - name: Run focused helper tests
        run: python3 -m unittest tests.test_ci_helpers -v
      - name: Smoke broker
        run: |
          python3 ci-broker/app.py self-check
          python3 ci-broker/smoke_test.py

  e2e-android:
    if: ${{ github.ref == 'refs/heads/orchestrator/issue-610-minimal-ci' }}
    uses: ./.github/workflows/android.yml
    with:
      repository: StreamScapeTV/iptv-android
      ref: develop
      test_profile: unit-lint-room
      java_version: '25'
      upload_private_log: true
      prepare_command: >-
        git clone https://x-access-token:${GH_TOKEN}@github.com/StreamScapeTV/streamscape-media.git ../streamscape-media &&
        git -C ../streamscape-media checkout 85b3c7ed9711fa6ac53059e5d3e474d791c45d26
      build_command: >-
        ./gradlew --no-daemon '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' :app:testDebugUnitTest :app:lintDebug
      test_command: python3 scripts/ci/validate-room-schemas.py --repo-root . --report build/reports/room-schema-json-integrity.json
    secrets: inherit

  source-snapshot:
    if: ${{ github.ref == 'refs/heads/orchestrator/issue-610-minimal-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Central helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source token
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
      - name: Check out exact Apple source
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/iptv-apple
          ref: develop
          token: ${{ steps.source-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Create exact tracked-source archive and manifest
        id: snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          tree_sha="$(git -C source rev-parse 'HEAD^{tree}')"
          archive="${RUNNER_TEMP}/source.zip"
          manifest="${RUNNER_TEMP}/manifest.json"
          git -C source archive --format=zip --output="${archive}" HEAD
          archive_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          archive_size="$(wc -c < "${archive}" | tr -d '[:space:]')"
          python3 - "${manifest}" "${source_sha}" "${tree_sha}" "${archive_sha256}" "${archive_size}" <<'PY'
          from pathlib import Path
          import json, sys
          path, source_sha, tree_sha, digest, size = sys.argv[1:]
          value = {
              "repository": "StreamScapeTV/iptv-apple",
              "repository_name": "iptv-apple",
              "requested_ref": "develop",
              "is_tag": False,
              "resolved_source_sha": source_sha,
              "tree_sha": tree_sha,
              "archive_format": "zip",
              "archive_format_version": 1,
              "source_zip_sha256": digest,
              "source_zip_size_bytes": int(size),
          }
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          printf 'archive=%s\nmanifest=%s\n' "${archive}" "${manifest}" >> "${GITHUB_OUTPUT}"
      - name: Upload source.zip
        id: source-upload
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-apple
          ref: develop
          file_path: ${{ steps.snapshot.outputs.archive }}
          file_name: source.zip
          mime_type: application/zip
      - name: Add source Drive identity
        shell: bash
        env:
          MANIFEST: ${{ steps.snapshot.outputs.manifest }}
          SOURCE_FILE_ID: ${{ steps.source-upload.outputs.file_id }}
          FOLDER_ID: ${{ steps.source-upload.outputs.folder_id }}
        run: |
          python3 - "${MANIFEST}" "${SOURCE_FILE_ID}" "${FOLDER_ID}" <<'PY'
          from pathlib import Path
          import json, sys
          path, source_file_id, folder_id = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding="utf-8"))
          value["source_zip_file_id"] = source_file_id
          value["folder_id"] = folder_id
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
      - name: Create or update manifest.json
        id: manifest-create
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-apple
          ref: develop
          file_path: ${{ steps.snapshot.outputs.manifest }}
          file_name: manifest.json
          mime_type: application/json
      - name: Add manifest Drive identity
        shell: bash
        env:
          MANIFEST: ${{ steps.snapshot.outputs.manifest }}
          MANIFEST_FILE_ID: ${{ steps.manifest-create.outputs.file_id }}
        run: |
          python3 - "${MANIFEST}" "${MANIFEST_FILE_ID}" <<'PY'
          from pathlib import Path
          import json, sys
          path, manifest_file_id = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding="utf-8"))
          value["manifest_file_id"] = manifest_file_id
          Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
      - name: Update manifest.json with final metadata
        id: manifest-update
        uses: ./actions/google-drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-apple
          ref: develop
          file_path: ${{ steps.snapshot.outputs.manifest }}
          file_name: manifest.json
          mime_type: application/json
      - name: Verify in-place manifest update
        shell: bash
        env:
          CREATED_ID: ${{ steps.manifest-create.outputs.file_id }}
          UPDATED_ID: ${{ steps.manifest-update.outputs.file_id }}
        run: test "${CREATED_ID}" = "${UPDATED_ID}"
