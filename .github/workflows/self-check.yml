name: Central workflow self-check

on:
  push:
    branches:
      - agent1/issue-593-policy-simplification

permissions:
  contents: write

jobs:
  migrate:
    name: Apply issue 593 component-reference migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Rewrite owned workflow references
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/bootstrap_validation_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[skip ci] #593 migrate Central components to main'
          git push origin HEAD:agent1/issue-593-policy-simplification
