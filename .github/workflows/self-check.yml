name: CI workflows self-check

"on":
  push:
    branches: [main, "issue/**", "orchestrator/**", "agent*/**", "codex*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse workflow and action YAML
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [*Path('.github/workflows').glob('*.yml'), *Path('actions').glob('*/action.yml')]:
              yaml.safe_load(path.read_text())
          print('yaml-ok')
          PY

      - name: Validate dispatcher GitHub expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -shellcheck='' .github/workflows/central-ci-dispatch.yml .github/workflows/ci-cancel.yml

      - name: Run focused helper tests
        run: >-
          python3 -m unittest
          tests.test_ci_helpers_current
          tests.test_agent_state_settlement
          tests.test_ci_cancel
          tests.test_bash_portability
          tests.test_repository_workflow
          tests.test_dockerhub_pull
          tests.test_repository_apple_physical_device
          tests.test_repository_macos_netrc
          tests.test_apple_credential_preflight
          tests.test_protected_deployed_conformance
          tests.test_repository_host_classes
          tests.test_repository_execution_plan
          tests.test_repository_log_checkpoint
          tests.test_repository_progress_relay
          tests.test_repository_log_capture
          tests.test_repository_runtime_probe
          tests.test_public_identity_boundary
          tests.test_ci_log_issue_fallback
          tests.test_ci_log_reconcile
          tests.test_github_issue_dependency_projection
          tests.test_cluster_inspector_workflow
          tests.test_cluster_inspector_credentials
          tests.test_android_search_performance_profile
          tests.test_android_physical_performance_profile
          tests.test_android_screenshot_review
          tests.test_oci_reproducibility
          tests.test_apple_workflow
          tests.test_apple_log_checkpoint
          tests.test_apple_dependency_cache
          tests.test_google_drive_media_put
          tests.test_google_drive_retry_policy
          tests.test_google_drive_oauth_exchange
          tests.test_private_network_readiness
          tests.test_tailscale_source_isolation
          tests.test_source_snapshot_delete
          tests.test_source_snapshot_delete_namespace
          tests.test_source_snapshot_lifecycle
          tests.test_source_snapshot_fresh_object_contract
          tests.test_source_checkpoint_publish
          tests.test_maven_workflow
          tests.test_apple_binary_workflow
          tests.test_apple_swiftpm_workflow
          tests.test_library_package_release_workflow
          tests.test_swiftpm_binary
          tests.test_release_observability
          tests.test_main_ref_release
          tests.test_tag_driven_release
          -v
