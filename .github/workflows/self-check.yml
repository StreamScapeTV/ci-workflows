name: CI workflows self-check

"on":
  push:
    branches: [main, "issue/**", "orchestrator/**", "agent*/**", "codex*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse workflow and action YAML
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [*Path('.github/workflows').glob('*.yml'), *Path('actions').glob('*/action.yml')]:
              yaml.safe_load(path.read_text())
          print('yaml-ok')
          PY

      - name: Validate the entry workflow expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -shellcheck='' .github/workflows/ci-gradle.yml .github/workflows/ci-xcode.yml .github/workflows/ci-node.yml .github/workflows/ci-python.yml .github/workflows/ci-gradle-stage.yml .github/workflows/ci-xcode-stage.yml .github/workflows/ci-node-stage.yml .github/workflows/ci-python-stage.yml .github/workflows/ci-xcode-release-stage.yml .github/workflows/ci-gradle-release-stage.yml

      - name: Run focused helper tests
        run: >-
          python3 -m unittest
          tests.test_apple_credential_preflight
          tests.test_bash_portability
          tests.test_ci_gradle_job
          tests.test_ci_per_purpose_workflows
          tests.test_ci_release
          tests.test_ci_run_job
          tests.test_ci_xcode_job
          tests.test_dockerhub_pull
          tests.test_github_issue_dependency_projection
          tests.test_private_network_readiness
          tests.test_public_identity_boundary
          tests.test_repository_apple_physical_device
          tests.test_repository_macos_netrc
          tests.test_s3_put
          tests.test_tailscale_source_isolation
          -v
