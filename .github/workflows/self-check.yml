name: CI workflows self-check

"on":
  push:
    branches: [main, "issue/**", "orchestrator/**", "agent*/**", "codex*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue-536-backend-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse workflow and action YAML
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [*Path('.github/workflows').glob('*.yml'), *Path('actions').glob('*/action.yml')]:
              yaml.safe_load(path.read_text())
          print('yaml-ok')
          PY

      - name: Run focused helper tests
        run: >-
          python3 -m unittest
          tests.test_ci_helpers
          tests.test_android_search_performance_profile
          tests.test_oci_reproducibility
          tests.test_apple_workflow
          tests.test_node_flutter_observed_source
          -v

  backend_full_exact_head_proof:
    uses: ./.github/workflows/python.yml
    with:
      repository: StreamScapeTV/iptv-backend
      ref: 1cf2b3259bc679b416c68332c4e5905ceaf47a40
      test_profile: backend-full
      upload_private_log: true
    secrets: inherit
