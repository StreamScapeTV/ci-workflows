name: CI workflows self-check

"on":
  push:
    branches: [main, "issue/**", "orchestrator/**", "agent*/**", "codex*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse workflow and action YAML
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [*Path('.github/workflows').glob('*.yml'), *Path('actions').glob('*/action.yml')]:
              yaml.safe_load(path.read_text())
          print('yaml-ok')
          PY

      - name: Run focused helper tests
        run: python3 -m unittest tests.test_ci_helpers -v

      - name: Build and smoke broker
        run: |
          docker build -f ci-broker/Containerfile -t ci-broker:self-check ci-broker
          python3 ci-broker/smoke_test.py

  backend_full_merge_ref_proof:
    if: ${{ github.ref == 'refs/heads/agent1/issue-536-python-postgres' }}
    uses: ./.github/workflows/python.yml
    with:
      repository: StreamScapeTV/iptv-backend
      ref: refs/pull/450/merge
      test_profile: backend-full
    secrets: inherit
