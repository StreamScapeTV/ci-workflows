name: Central workflow self-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: central-self-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and reusable workflow contracts
    runs-on: macOS
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Admit trusted workflow source
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              if [[ -z "${PR_HEAD_REPOSITORY}" || "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
                echo '::error::Central self-check rejects fork pull-request source before checkout.' >&2
                exit 1
              fi
              test "${SOURCE_SHA}" = "${PR_HEAD_SHA}"
              ;;
            push|workflow_dispatch)
              test "${SOURCE_SHA}" = "${GITHUB_SHA}"
              ;;
            *)
              echo "::error::Unsupported self-check event ${GITHUB_EVENT_NAME}." >&2
              exit 1
              ;;
          esac

      - name: Inspect preinstalled macOS Python candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          candidates=(
            /opt/homebrew/bin/python3.12
            /opt/homebrew/bin/python3
            /usr/local/bin/python3.12
            /usr/local/bin/python3
            /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
            /usr/bin/python3
          )
          command -v python3.12 >/dev/null 2>&1 && candidates+=("$(command -v python3.12)")
          command -v python3 >/dev/null 2>&1 && candidates+=("$(command -v python3)")

          seen=':'
          found=0
          for candidate in "${candidates[@]}"; do
            [[ -x "${candidate}" ]] || continue
            resolved="$(cd "$(dirname "${candidate}")" && pwd -P)/$(basename "${candidate}")"
            [[ "${seen}" != *":${resolved}:"* ]] || continue
            seen+="${resolved}:"
            found=1
            "${resolved}" - <<'PY'
          import platform
          import sys

          print(
              "preinstalled-python "
              f"implementation={sys.implementation.name} "
              f"version={sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro} "
              f"system={platform.system()} machine={platform.machine()}"
          )
          PY
          done
          test "${found}" -eq 1

      - name: Set up pinned CPython 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify pinned macOS Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import platform
          import sys

          machine = platform.machine().lower()
          if machine in {"amd64", "x64"}:
              machine = "x86_64"
          elif machine == "aarch64":
              machine = "arm64"
          expected = ("cpython", (3, 12, 10), "Darwin", {"x86_64", "arm64"})
          actual = (sys.implementation.name, sys.version_info[:3], platform.system(), machine)
          if actual[0] != expected[0] or actual[1] != expected[1] or actual[2] != expected[2] or actual[3] not in expected[3]:
              raise SystemExit(f"unsupported self-check Python host: {actual!r}")
          PY

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare pinned validation runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          validation_root="${RUNNER_TEMP}/ci-workflows-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${validation_root}"
          mkdir -p "${validation_root}/python"
          python3 scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${validation_root}/python"
          test -f "${validation_root}/python/yaml/__init__.py"
          PYTHONPATH="${validation_root}/python" python3 - <<'PY'
          import yaml

          if yaml.__version__ != "6.0.3":
              raise SystemExit(f"unexpected PyYAML version: {yaml.__version__}")
          if yaml.__with_libyaml__:
              raise SystemExit("validation runtime unexpectedly loaded LibYAML")
          PY
          {
            printf 'VALIDATION_ROOT=%s\n' "${validation_root}"
            printf 'PYTHONPATH=%s:%s/src\n' "${validation_root}/python" "${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

      - name: Run canonical validation harness
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/validation_harness.py \
            --root . \
            --summary "${VALIDATION_ROOT}/summary.json"

      - name: Verify bootstrap and generated inventory contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/bootstrap_check.py
          python3 scripts/ci/inventory_contract.py validate
          python3 scripts/ci/inventory_contract.py render --check

      - name: Verify public API agreement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/public_api_contract.py validate
          python3 scripts/ci/public_api_contract.py render
          cat docs/workflows/public-api-reference.md

      - name: Run automatically discovered unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Verify clean tracked tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$({ git status --porcelain --untracked-files=all || true; } | grep -v '^?? docs/workflows/public-api-reference.md$' || true)"
          test -z "${unexpected}"

      - name: Remove validation state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          rm -f docs/workflows/public-api-reference.md || cleanup_failed=1
          if [[ -n "${VALIDATION_ROOT:-}" ]]; then
            rm -rf "${VALIDATION_ROOT}" || cleanup_failed=1
            [[ ! -e "${VALIDATION_ROOT}" ]] || cleanup_failed=1
          fi
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || cleanup_failed=1
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || cleanup_failed=1
          test -z "$(find . -type d -name __pycache__ -print -quit)" || cleanup_failed=1
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)" || cleanup_failed=1
          test -z "$(git status --porcelain --untracked-files=all)" || cleanup_failed=1
          exit "${cleanup_failed}"

      - name: Confirm zero Actions artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          count = int(payload.get("total_count", 0))
          if count:
              raise SystemExit(f"self-check uploaded {count} unexpected artifact(s)")
          print("Central self-check artifact policy passed: zero artifacts.")
          PY
