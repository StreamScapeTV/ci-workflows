name: Central workflow self-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: central-self-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and reusable workflow contracts
    runs-on: homelab-portable-linux-x64
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Prepare pinned validation runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          validation_root="${RUNNER_TEMP}/ci-workflows-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${validation_root}"
          mkdir -p "${validation_root}/python"
          python3 scripts/ci/bootstrap_validation_runtime.py \
            --lock contracts/action-tool-lock.json \
            --target "${validation_root}/python"
          {
            printf 'VALIDATION_ROOT=%s\n' "${validation_root}"
            printf 'PYTHONPATH=%s:%s/src\n' "${validation_root}/python" "${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

      - name: Run canonical validation and discovered tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/validation_harness.py \
            --root . \
            --summary "${VALIDATION_ROOT}/summary.json"
          python3 scripts/ci/bootstrap_check.py
          python3 scripts/ci/inventory_contract.py validate
          python3 scripts/ci/inventory_contract.py render --check
          python3 scripts/ci/public_api_contract.py validate
          python3 scripts/ci/public_api_contract.py render
          cat docs/workflows/public-api-reference.md
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Verify clean tracked tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$({ git status --porcelain --untracked-files=all || true; } | grep -v '^?? docs/workflows/public-api-reference.md$' || true)"
          test -z "${unexpected}"

      - name: Remove validation state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          rm -f docs/workflows/public-api-reference.md || cleanup_failed=1
          if [[ -n "${VALIDATION_ROOT:-}" ]]; then
            rm -rf "${VALIDATION_ROOT}" || cleanup_failed=1
            [[ ! -e "${VALIDATION_ROOT}" ]] || cleanup_failed=1
          fi
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || cleanup_failed=1
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || cleanup_failed=1
          test -z "$(find . -type d -name __pycache__ -print -quit)" || cleanup_failed=1
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)" || cleanup_failed=1
          test -z "$(git status --porcelain --untracked-files=all)" || cleanup_failed=1
          exit "${cleanup_failed}"

      - name: Confirm zero Actions artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          count = int(payload.get("total_count", 0))
          if count:
              raise SystemExit(f"self-check uploaded {count} unexpected artifact(s)")
          print("Central self-check artifact policy passed: zero artifacts.")
          PY
