name: Reusable Python validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      validation_profile:
        description: audit, host, podman, or podman-postgres
        required: true
        type: string
      version_file:
        description: Optional contract-matched relative Python version file
        required: false
        type: string
      working_directory:
        description: Contract-matched relative working directory
        required: false
        default: .
        type: string
      command_profile:
        description: Checked-in reviewed Python command profile
        required: true
        type: string
      script_path:
        description: Optional contract-matched reviewed script path
        required: false
        type: string
      artifact_exception_id:
        description: Optional named central artifact exception; empty by default
        required: false
        type: string
    outputs:
      result:
        description: Success only after bounded validation and terminal cleanup
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded machine-readable validation summary
        value: ${{ jobs.validate.outputs.test_summary }}
      artifact_exception_used:
        description: False for the initial zero-artifact Python API
        value: ${{ jobs.validate.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded Python validation plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - id: plan
        name: Resolve contract-owned command and runner plan
        uses: StreamScapeTV/ci-workflows/actions/validate-python@d060c275570e07222969546acf988a2616a3bcc6 # issue #229 immutable portable host runtime checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          working_directory: ${{ inputs.working_directory }}
          version_file: ${{ inputs.version_file }}
          script_path: ${{ inputs.script_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

  validate:
    name: CI / Python validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.python.outcome == 'success' && steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.python.outputs.test_summary }}
      source_sha: ${{ steps.python.outputs.source_sha }}
      resolved_python_version: ${{ steps.python.outputs.resolved_python_version }}
      validation_profile: ${{ steps.python.outputs.validation_profile }}
      command_profile: ${{ steps.python.outputs.command_profile }}
      cleanup_result: ${{ steps.cleanup.outputs.cleanup_verified }}
      failure_code: ${{ steps.python.outputs.failure_code }}
      artifact_exception_used: ${{ steps.python.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated marker-bound Python state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}

      - id: tools
        name: Verify contract-selected host toolchain
        uses: StreamScapeTV/ci-workflows/actions/verify-toolchain@70e08d4ddf8930046632a7135950e924b82e22bf # issue #125 immutable private-action checkpoint
        with:
          operation: verify-set
          tool_set: baseline
          capability_profile: linux

      - id: python
        name: Execute bounded Python validation
        uses: StreamScapeTV/ci-workflows/actions/validate-python@d060c275570e07222969546acf988a2616a3bcc6 # issue #229 immutable portable host runtime checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          working_directory: ${{ inputs.working_directory }}
          version_file: ${{ inputs.version_file }}
          script_path: ${{ inputs.script_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - name: Render deterministic redacted Python evidence
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: validation-python-1.0.0
          runner_profile: ${{ needs.plan.outputs.runner_profile }}
          toolchain_json: ${{ steps.tools.outputs.toolchain_json }}
          command_profile: ${{ inputs.command_profile }}
          result: ${{ steps.python.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: not-run
          cleanup_removed_paths: "0"

      - id: cleanup
        name: Remove and verify all registered Python state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - name: Verify exact source remained clean after cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )