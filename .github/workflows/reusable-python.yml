name: Reusable Python validation

on:
  workflow_call:
    inputs:
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      validation_profile:
        description: audit, host, podman, or podman-postgres
        required: true
        type: string
      python_version:
        description: Reviewed Python family for host execution or exact reviewed container version
        required: true
        type: string
      version_file:
        description: Optional repository-relative Python version file
        required: false
        type: string
      dependency_file:
        description: Optional repository-relative exact requirements file
        required: false
        type: string
      working_directory:
        description: Repository-relative working directory
        required: false
        default: .
        type: string
      script_path:
        description: Repository-relative executable validation script owned by the caller
        required: true
        type: string
      artifact_exception_id:
        description: Reserved zero-artifact exception id; must remain empty
        required: false
        type: string
    outputs:
      result:
        description: Success only after bounded validation and terminal cleanup
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded machine-readable validation summary
        value: ${{ jobs.validate.outputs.test_summary }}
      artifact_exception_used:
        description: False for the zero-artifact Python API
        value: ${{ jobs.validate.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve product-neutral Python validation plan
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - id: plan
        name: Resolve bounded runtime and execution plan
        uses: StreamScapeTV/ci-workflows/actions/validate-python@3d3689fda11b03a188789f03d6d64cab50f1873a # issue #473 product-neutral Python checkpoint
        with:
          phase: plan
          execution_backend: ${{ inputs.execution_backend }}
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          version_file: ${{ inputs.version_file }}
          dependency_file: ${{ inputs.dependency_file }}
          script_path: ${{ inputs.script_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

  validate:
    name: CI / Python validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.python.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.clean.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.python.outputs.test_summary }}
      source_sha: ${{ steps.python.outputs.source_sha }}
      resolved_python_version: ${{ steps.python.outputs.resolved_python_version }}
      validation_profile: ${{ steps.python.outputs.validation_profile }}
      cleanup_result: ${{ steps.cleanup.outputs.cleanup_verified }}
      failure_code: ${{ steps.python.outputs.failure_code }}
      artifact_exception_used: ${{ steps.python.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated marker-bound Python state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}

      - id: python
        name: Execute consumer-owned Python validation script
        uses: StreamScapeTV/ci-workflows/actions/validate-python@3d3689fda11b03a188789f03d6d64cab50f1873a # issue #473 product-neutral Python checkpoint
        with:
          phase: execute
          execution_backend: ${{ inputs.execution_backend }}
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          version_file: ${{ inputs.version_file }}
          dependency_file: ${{ inputs.dependency_file }}
          script_path: ${{ inputs.script_path }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - id: cleanup
        name: Remove and verify all registered Python state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: clean
        name: Verify exact source remained clean after cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )
