name: Issue 338 public contract validation

on:
  push:
    branches:
      - agent1/issue-338-android-live-release

permissions:
  contents: read

concurrency:
  group: issue-338-public-contract-validation
  cancel-in-progress: true

jobs:
  contracts:
    name: Android completion public contract
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Validate contract rows below the generated-doc check
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import base64
          from pathlib import Path
          from ci_workflows import public_api as contract

          root = Path.cwd()
          stage = 'load_contract'
          try:
              data = contract.load_contract(root)
              stage = 'validate_reference_policy'
              contract.validate_reference_policy(data.types)
              stage = 'permission_profiles'
              profiles = contract.permission_profiles(data)
              stage = 'validate_workflows'
              workflows = contract.validate_workflows(data, profiles)
              stage = 'new_api_presence'
              assert 'validation.android-live-service' in workflows
              assert 'validation.android-release' in workflows
              stage = 'render'
              rendered = contract.render(data)
              print('CIW_PUBLIC_REFERENCE_BASE64=' + base64.b64encode(rendered.encode('utf-8')).decode('ascii'))
          except Exception as error:
              message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Public contract {stage}::{message}')
              raise
          PY

      - name: Run completion contract tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m unittest -v tests.test_android_completion
