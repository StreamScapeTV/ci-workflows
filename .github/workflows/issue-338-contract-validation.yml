name: Issue 338 one-shot final fix

on:
  push:
    branches:
      - agent1/issue-338-android-live-release

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == '[#338] Apply final branch fixes' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 30
    steps:
      - name: Check out exact fix head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Apply exact public-contract corrections locally
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('src/ci_workflows/public_api_contract.py')
          source = source_path.read_text(encoding='utf-8')
          old = 'require(len(by_api) == 20, f"public API registry must contain 20 workflows, found {len(by_api)}")'
          new = 'require(len(by_api) == 22, f"public API registry must contain 22 workflows, found {len(by_api)}")'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('public API workflow-count invariant not found')
          source_path.write_text(source, encoding='utf-8')

          types_path = Path('contracts/public-workflow-types.json')
          data = json.loads(types_path.read_text(encoding='utf-8'))
          row = data['output_catalog']['artifact_manifest_json']
          if row.get('nullable') is not True or row.get('type') not in {'json-object', 'json-array'}:
              raise SystemExit(f'unexpected artifact_manifest_json catalog: {row!r}')
          row['type'] = 'json-array'
          types_path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')

          test_path = Path('tests/test_public_api_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        self.assertEqual(\n            {"type": "json-object", "nullable": True},\n            self.data.types["output_catalog"]["artifact_manifest_json"],\n        )'''
          new_test = '''        self.assertEqual(\n            {"type": "json-array", "nullable": True},\n            self.data.types["output_catalog"]["artifact_manifest_json"],\n        )'''
          if old_test in tests:
              tests = tests.replace(old_test, new_test, 1)
          elif new_test not in tests:
              raise SystemExit('artifact manifest public API expectation not found')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate complete static candidate before remote mutation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py validate
          PYTHONPATH=src python3 scripts/ci/public_api_contract.py render --check
          PYTHONPATH=src python3 -m unittest -v \
            tests.test_public_api_contract \
            tests.test_android_completion \
            tests.test_android_ciw_dispatch
          python3 -m py_compile \
            src/ci_workflows/ciw_android_completion.py \
            src/ci_workflows/public_api_contract.py \
            scripts/ci/android_completion.py
          test -z "$(git diff -- . ':!src/ci_workflows/public_api_contract.py' ':!contracts/public-workflow-types.json' ':!tests/test_public_api_contract.py')"

      - name: Persist corrections and remove disposable workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent1/issue-338-android-live-release
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ['GITHUB_API_URL'].rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['BRANCH_NAME']
          token = os.environ['GITHUB_TOKEN']

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return {} if not raw else json.loads(raw)

          def get(path):
              return request(
                  'GET',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}?ref={urllib.parse.quote(branch, safe="")}',
              )

          def put_if_changed(path, content, message):
              current = get(path)
              remote = base64.b64decode(current['content']).decode('utf-8')
              if remote == content:
                  return
              request(
                  'PUT',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
                  {
                      'message': message,
                      'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                      'sha': current['sha'],
                      'branch': branch,
                  },
              )

          def delete_if_present(path):
              try:
                  current = get(path)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return
                  raise
              request(
                  'DELETE',
                  f'{api}/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}',
                  {
                      'message': f'[skip ci] #338 remove disposable {Path(path).name}',
                      'sha': current['sha'],
                      'branch': branch,
                  },
              )

          put_if_changed(
              'src/ci_workflows/public_api_contract.py',
              Path('src/ci_workflows/public_api_contract.py').read_text(encoding='utf-8'),
              '[skip ci] #338 accept 22 public workflows',
          )
          put_if_changed(
              'contracts/public-workflow-types.json',
              Path('contracts/public-workflow-types.json').read_text(encoding='utf-8'),
              '[skip ci] #338 type release artifact manifest as array',
          )
          put_if_changed(
              'tests/test_public_api_contract.py',
              Path('tests/test_public_api_contract.py').read_text(encoding='utf-8'),
              '[skip ci] #338 align artifact manifest public API test',
          )

          for path in (
              '.github/workflows/issue-338-finalize-branch.yml',
              '.github/workflows/issue-338-finalize-branch-v2.yml',
              '.github/workflows/issue-338-public-confirm.yml',
              '.github/workflows/issue-338-mobile-diagnostic.yml',
              '.github/workflows/issue-338-contract-validation.yml',
          ):
              delete_if_present(path)
          PY
