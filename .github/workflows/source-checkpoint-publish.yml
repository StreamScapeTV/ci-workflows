name: Publish latest numbered Drive source checkpoint

"on":
  workflow_call:
    inputs:
      repository: {type: string, required: true}
      branch: {type: string, required: true}
      expected_head: {type: string, required: true}
      expected_tree: {type: string, required: true}
      archive_sha256: {type: string, required: true}
      archive_size_bytes: {type: number, required: true}
      commit_message: {type: string, required: true}
      ci_run_id: {type: string, required: true}
    secrets:
      SOURCE_APP_ID: {required: true}
      SOURCE_APP_PRIVATE_KEY: {required: true}
      GOOGLE_DRIVE_CLIENT_ID: {required: true}
      GOOGLE_DRIVE_CLIENT_SECRET: {required: true}
      GOOGLE_DRIVE_REFRESH_TOKEN: {required: true}
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID: {required: true}
      AGENT_STATE_SUPABASE_URL: {required: true}
      AGENT_STATE_SUPABASE_SECRET_KEY: {required: true}

permissions: {contents: read}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Central publisher
        uses: actions/checkout@v4
        with: {persist-credentials: false}

      - name: Mark Agent State run as running
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with: {phase: start, ci_run_id: "${{ inputs.ci_run_id }}"}

      - id: request
        name: Validate bounded checkpoint request
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_SIZE_BYTES: ${{ inputs.archive_size_bytes }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/source_checkpoint_publish.py validate \
            --repository "${TARGET_REPOSITORY}" \
            --branch "${TARGET_BRANCH}" \
            --expected-head "${EXPECTED_HEAD}" \
            --expected-tree "${EXPECTED_TREE}" \
            --archive-sha256 "${ARCHIVE_SHA256}" \
            --archive-size-bytes "${ARCHIVE_SIZE_BYTES}" \
            --commit-message "${COMMIT_MESSAGE}"
          git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null 2>&1 || {
            echo "source checkpoint branch is not a valid Git branch" >&2
            exit 2
          }
          python3 - "${TARGET_REPOSITORY}" <<'PY' >> "${GITHUB_OUTPUT}"
          import sys
          print("repository_name=" + sys.argv[1].split("/", 1)[1])
          PY

      - name: Create exact target repository token
        id: target_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.request.outputs.repository_name }}
          permission-contents: write
          permission-metadata: read

      - id: remote
        name: Classify exact target branch
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target_token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail
          result="$(python3 scripts/ci/source_checkpoint_publish.py classify-remote \
            --repository "${TARGET_REPOSITORY}" --branch "${TARGET_BRANCH}" \
            --expected-head "${EXPECTED_HEAD}" --expected-tree "${EXPECTED_TREE}" \
            --commit-message "${COMMIT_MESSAGE}")"
          python3 - "${result}" <<'PY' >> "${GITHUB_OUTPUT}"
          import json,sys
          value=json.loads(sys.argv[1])
          print("action=" + value["action"])
          print("observed_head=" + value["observed_head"])
          PY

      - name: Resolve Google Drive access token
        id: drive
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          access_token="$(curl --fail --silent --show-error --request POST \
            --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)')"
          echo "::add-mask::${access_token}"
          printf 'access_token=%s\n' "${access_token}" >> "${GITHUB_OUTPUT}"

      - id: checkpoint
        name: Select and download unique latest numbered Drive checkpoint
        shell: bash
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.drive.outputs.access_token }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_SIZE_BYTES: ${{ inputs.archive_size_bytes }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/source-checkpoint.zip"
          result="$(python3 scripts/ci/source_checkpoint_publish.py download-latest \
            --repository "${TARGET_REPOSITORY}" --branch "${TARGET_BRANCH}" \
            --archive-sha256 "${ARCHIVE_SHA256}" --archive-size-bytes "${ARCHIVE_SIZE_BYTES}" \
            --archive "${archive}")"
          python3 - "${result}" <<'PY' >> "${GITHUB_OUTPUT}"
          import json,sys
          value=json.loads(sys.argv[1])
          for key in ("checkpoint_sequence","checkpoint_filename","archive_sha256","archive_size_bytes"):
              print(f"{key}={value[key]}")
          PY
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact expected base commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.expected_head }}
          token: ${{ steps.target_token.outputs.token }}
          fetch-depth: 1
          path: target
          persist-credentials: false

      - name: Materialize latest full-tree checkpoint and verify exact tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          ARCHIVE: ${{ steps.checkpoint.outputs.archive }}
        run: >-
          python3 scripts/ci/source_checkpoint_publish.py materialize
          --archive "${ARCHIVE}"
          --worktree target
          --expected-head "${EXPECTED_HEAD}"
          --expected-tree "${EXPECTED_TREE}"

      - id: workflow_scope
        name: Detect workflow-file checkpoint changes
        shell: bash
        run: |
          set -Eeuo pipefail
          if git -C target diff --cached --quiet HEAD -- .github/workflows; then
            printf 'required=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'required=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Create workflow-write target token when publication requires it
        id: target_workflow_token
        if: ${{ steps.remote.outputs.action == 'publish' && steps.workflow_scope.outputs.required == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.request.outputs.repository_name }}
          permission-contents: write
          permission-workflows: write
          permission-metadata: read

      - id: commit
        name: Create one normal Git commit from checkpoint
        if: ${{ steps.remote.outputs.action == 'publish' }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git -C target write-tree)" = "${EXPECTED_TREE}"
          message_file="${RUNNER_TEMP}/source-checkpoint-message.txt"
          printf '%s\n' "${COMMIT_MESSAGE}" > "${message_file}"
          export GIT_AUTHOR_NAME='StreamScapeTV CI'
          export GIT_AUTHOR_EMAIL='ci@streamscape.invalid'
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          git -C target -c core.hooksPath=/dev/null commit --no-verify --no-gpg-sign --file "${message_file}"
          commit_sha="$(git -C target rev-parse HEAD)"
          test "$(git -C target rev-parse HEAD^)" = "${EXPECTED_HEAD}"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          printf 'commit_sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish non-force fast-forward branch update
        if: ${{ steps.remote.outputs.action == 'publish' }}
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target_workflow_token.outputs.token || steps.target_token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PUBLISHED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "${TARGET_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          remote_head="$(git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}" || { echo 'GitHub branch moved before publication' >&2; exit 3; }
          git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --porcelain origin "${PUBLISHED_COMMIT}:refs/heads/${TARGET_BRANCH}"

      - id: published
        name: Verify exact GitHub head and remote tree readback
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target_token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          ACTION: ${{ steps.remote.outputs.action }}
          CREATED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
          OBSERVED_HEAD: ${{ steps.remote.outputs.observed_head }}
        run: |
          set -Eeuo pipefail
          if test "${ACTION}" = publish; then
            published_head="${CREATED_COMMIT}"
          else
            published_head="${OBSERVED_HEAD}"
          fi
          test -n "${published_head}"
          auth="$(printf 'x-access-token:%s' "${TARGET_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          confirmed=''
          for delay in 0 1 2 3 5 8; do
            test "${delay}" = 0 || sleep "${delay}"
            confirmed="$(git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            test "${confirmed}" = "${published_head}" && break
          done
          test "${confirmed}" = "${published_head}" || { echo 'GitHub branch readback did not confirm published commit' >&2; exit 4; }
          git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${published_head}"
          remote_tree="$(git -C target rev-parse 'FETCH_HEAD^{tree}')"
          test "${remote_tree}" = "${EXPECTED_TREE}" || { echo 'GitHub remote tree does not equal checkpoint tree' >&2; exit 5; }
          printf 'commit_sha=%s\nremote_tree=%s\n' "${published_head}" "${remote_tree}" >> "${GITHUB_OUTPUT}"

      - id: record_source
        name: Record published source SHA
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.published.outputs.commit_sha }}

      - name: Record checkpoint publication result
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PUBLISHED_COMMIT: ${{ steps.published.outputs.commit_sha }}
          PUBLISHED_TREE: ${{ steps.published.outputs.remote_tree }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          CHECKPOINT_SEQUENCE: ${{ steps.checkpoint.outputs.checkpoint_sequence }}
          CHECKPOINT_FILENAME: ${{ steps.checkpoint.outputs.checkpoint_filename }}
          PUBLICATION_ACTION: ${{ steps.remote.outputs.action }}
        run: |
          {
            printf 'Published latest numbered Drive full-tree checkpoint.\n'
            printf -- '- target: `%s@%s`\n' "${TARGET_REPOSITORY}" "${TARGET_BRANCH}"
            printf -- '- previous head: `%s`\n' "${EXPECTED_HEAD}"
            printf -- '- action: `%s`\n' "${PUBLICATION_ACTION}"
            printf -- '- checkpoint: `%s` (`%s`)\n' "${CHECKPOINT_SEQUENCE}" "${CHECKPOINT_FILENAME}"
            printf -- '- published commit: `%s`\n' "${PUBLISHED_COMMIT}"
            printf -- '- published tree: `%s`\n' "${PUBLISHED_TREE}"
            printf -- '- Drive archive SHA-256: `%s`\n' "${ARCHIVE_SHA256}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - id: cleanup
        name: Clean checkpoint workspace
        if: ${{ always() }}
        shell: bash
        run: 'rm -rf target; rm -f "${RUNNER_TEMP}/source-checkpoint.zip" "${RUNNER_TEMP}/source-checkpoint-message.txt"'

      - name: Finish Agent State run
        if: ${{ always() }}
        uses: ./actions/agent-state
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ job.status == 'success' && steps.record_source.outcome == 'success' && steps.cleanup.outcome == 'success' && 'succeeded' || 'failed' }}
