name: Issue 814 source snapshot patch

"on":
  push:
    branches:
      - agent2/issue-814-published-ancestor
    paths:
      - .github/workflows/issue-814-apply.yml

permissions:
  contents: write

jobs:
  build-final-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04dbc497733ed765243623361c0ac9c367a80f7b
          fetch-depth: 1
          persist-credentials: false

      - name: Apply exact published-ancestor classification patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${RUNNER_TEMP}/issue814.patch.gz.b64" <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode "${RUNNER_TEMP}/issue814.patch.gz.b64" | gzip -d > "${RUNNER_TEMP}/issue814.patch"
          git apply --check "${RUNNER_TEMP}/issue814.patch"
          git apply "${RUNNER_TEMP}/issue814.patch"

      - name: Validate final source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet PyYAML
          python3 -m unittest \
            tests.test_ci_helpers_current \
            tests.test_native_targeted_profiles \
            tests.test_android_search_performance_profile \
            tests.test_oci_reproducibility \
            tests.test_apple_workflow \
            tests.test_node_flutter_observed_source \
            tests.test_python_workflow \
            tests.test_google_drive_media_put \
            tests.test_source_snapshot_delete \
            tests.test_source_checkpoint_publish \
            tests.test_maven_workflow \
            tests.test_apple_binary_workflow \
            tests.test_runner_images_workflow
          python3 -m py_compile scripts/ci/source_checkpoint_publish.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          path = Path('.github/workflows/central-ci-dispatch.yml')
          value = yaml.safe_load(path.read_text(encoding='utf-8'))
          for job in value['jobs'].values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script or step.get('shell', 'bash') != 'bash':
                      continue
                  checked = subprocess.run(['bash', '-n'], input=script, text=True, capture_output=True)
                  if checked.returncode:
                      raise SystemExit(f"{step.get('name')} bash -n failed: {checked.stderr}")
          PY
          git diff --check

      - name: Upload validated final source blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          upload_blob() {
            local path="$1"
            local label="$2"
            local encoded response sha
            encoded="$(base64 -w0 "${path}")"
            response="$(jq -nc --arg content "${encoded}" '{content:$content,encoding:"base64"}' | curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @- \
              "https://api.github.com/repos/${REPOSITORY}/git/blobs")"
            sha="$(printf '%s' "${response}" | jq -r '.sha // empty')"
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            printf '%s=%s\n' "${label}" "${sha}"
          }
          upload_blob .github/workflows/central-ci-dispatch.yml dispatch_blob_sha
          upload_blob scripts/ci/source_checkpoint_publish.py script_blob_sha
          upload_blob tests/test_source_checkpoint_publish.py test_blob_sha
