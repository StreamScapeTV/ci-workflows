name: Apple test pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-test-pilot
  cancel-in-progress: false

jobs:
  apple_test:
    name: Test configured private Apple branch
    runs-on: [macos-latest]
    timeout-minutes: 120
    env:
      TARGET_REPOSITORY_NAME: ${{ secrets.APPLE_TEST_REPOSITORY }}
      TARGET_BRANCH: ${{ secrets.APPLE_TEST_BRANCH }}
      CHECKOUT_TOKEN: ${{ secrets.TOKEN }}
    steps:
      - name: Validate fixed Central configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TARGET_REPOSITORY_NAME}"
          test -n "${TARGET_BRANCH}"
          test -n "${CHECKOUT_TOKEN}"
          [[ "${TARGET_REPOSITORY_NAME}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${TARGET_BRANCH}" != refs/* ]]
          [[ "${TARGET_BRANCH}" != -* ]]
          [[ "${TARGET_BRANCH}" != *$'\n'* ]]
          [[ "${TARGET_BRANCH}" != *$'\r'* ]]

      - id: resolve
        name: Resolve configured branch to one exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["TARGET_REPOSITORY_NAME"].strip()
          branch = os.environ["TARGET_BRANCH"].strip()
          token = os.environ["CHECKOUT_TOKEN"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+", repository):
              raise SystemExit("configured repository name is invalid")
          if not branch or len(branch.encode("utf-8")) > 255:
              raise SystemExit("configured branch is invalid")

          repository_path = urllib.parse.quote(repository, safe="")
          branch_path = urllib.parse.quote(branch, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/StreamScapeTV/{repository_path}/commits/{branch_path}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"configured branch resolution failed with HTTP {error.code}"
              ) from None
          except urllib.error.URLError:
              raise SystemExit("configured branch resolution failed") from None

          sha = payload.get("sha")
          if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("configured branch did not resolve to an exact commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          print("Configured private branch resolved to one exact commit.")
          PY

      - id: checkout
        name: Check out the exact private Apple commit
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@a1b98b45464dbe00c606a0b9514f73a98cd722b6
        with:
          repository: ${{ format('StreamScapeTV/{0}', secrets.APPLE_TEST_REPOSITORY) }}
          admitted_sha: ${{ steps.resolve.outputs.sha }}
          path: source
          fetch_depth: "1"
          token: ${{ secrets.TOKEN }}

      - name: Run one real host-capable Apple integration test
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"

          derived_data="${RUNNER_TEMP}/apple-test-derived-data"
          packages="${RUNNER_TEMP}/apple-test-packages"
          diagnostic="${RUNNER_TEMP}/apple-test.log"
          rm -rf "${derived_data}" "${packages}" "${diagnostic}"

          basic_auth="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 | tr -d '\r\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}"
          export GIT_TERMINAL_PROMPT=0

          if xcodebuild test \
            -workspace source/streamscapetv.xcworkspace \
            -scheme streamscapetv \
            -destination 'platform=macOS' \
            -derivedDataPath "${derived_data}" \
            -clonedSourcePackagesDirPath "${packages}" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:streamscapetvTests/SelectedBackendStateSyncRoutingIntegrationTests \
            >"${diagnostic}" 2>&1; then
            echo "Apple host integration test passed."
          else
            echo "Apple host integration test failed; detailed private-source diagnostics were intentionally withheld from this public workflow log." >&2
            exit 1
          fi

      - name: Verify exact private checkout remained clean
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Remove private source and Apple test residue
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          targets = (
              workspace / "source",
              runner_temp / "apple-test-derived-data",
              runner_temp / "apple-test-packages",
              runner_temp / "apple-test.log",
          )
          for target in targets:
              try:
                  target.relative_to(workspace if target == workspace / "source" else runner_temp)
              except ValueError as error:
                  raise SystemExit("cleanup target escaped its fixed root") from error
              if target.is_symlink() or target.is_file():
                  target.unlink(missing_ok=True)
              elif target.exists():
                  shutil.rmtree(target)
          for target in targets:
              if target.exists() or target.is_symlink():
                  raise SystemExit("Apple test residue remains after cleanup")
          PY
