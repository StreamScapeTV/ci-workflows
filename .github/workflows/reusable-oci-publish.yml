name: Reusable trusted OCI publication

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted for the release
        required: true
        type: string
      product_id:
        description: Checked-in product identifier from contracts/oci-products.json
        required: true
        type: string
      release_version:
        description: Exact stable SemVer tag without refs or a v prefix
        required: true
        type: string
    secrets:
      registry_username:
        description: Least-privilege username for the fixed checked-in registry destination
        required: true
      registry_token:
        description: Least-privilege write token for the fixed checked-in registry destination
        required: true
    outputs:
      repositories_json:
        description: Canonical checked-in registry repositories by target
        value: ${{ jobs.publish.outputs.repositories_json }}
      version_references_json:
        description: Immutable release-version references by target
        value: ${{ jobs.publish.outputs.version_references_json }}
      source_references_json:
        description: Immutable source-SHA references by target
        value: ${{ jobs.publish.outputs.source_references_json }}
      manifest_digests_json:
        description: Independently read-back registry manifest digests by target
        value: ${{ jobs.publish.outputs.manifest_digests_json }}
      platform_digests_json:
        description: Independently read-back platform/config/layer digest evidence
        value: ${{ jobs.publish.outputs.platform_digests_json }}
      replayed:
        description: True when one or more matching immutable references already existed
        value: ${{ jobs.publish.outputs.replayed }}
      evidence_id:
        description: Deterministic redacted publication/read-back evidence identity
        value: ${{ jobs.publish.outputs.evidence_id }}
      canary_id:
        description: Contract-owned Flux canary identity when the product is a Flux asset
        value: ${{ jobs.publish.outputs.canary_id }}
      previous_known_good:
        description: Contract-owned previous-known-good policy identity for Flux assets
        value: ${{ jobs.publish.outputs.previous_known_good }}
      rollback_id:
        description: Contract-owned rollback identity for Flux assets
        value: ${{ jobs.publish.outputs.rollback_id }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve trusted immutable publication plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      release_source_sha: ${{ steps.release.outputs.release_source_sha }}
      tag_object_sha: ${{ steps.release.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.release.outputs.tag_commit_sha }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
          )

      - id: release
        name: Resolve exact existing release tag authority
        uses: ./.ciw/actions/resolve-release-tag
        with:
          release_mode: existing-tag
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.admitted_sha }}

      - id: plan
        name: Resolve contract-owned product, destination, and runner
        uses: ./.ciw/actions/publish-oci
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.release.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

  publish:
    name: CI / OCI trusted publication
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 180
    outputs:
      repositories_json: ${{ steps.verify.outputs.repositories_json }}
      version_references_json: ${{ steps.verify.outputs.version_references_json }}
      source_references_json: ${{ steps.verify.outputs.source_references_json }}
      manifest_digests_json: ${{ steps.verify.outputs.manifest_digests_json }}
      platform_digests_json: ${{ steps.verify.outputs.platform_digests_json }}
      replayed: ${{ steps.verify.outputs.replayed }}
      evidence_id: ${{ steps.verify.outputs.evidence_id }}
      canary_id: ${{ steps.verify.outputs.canary_id }}
      previous_known_good: ${{ steps.verify.outputs.previous_known_good }}
      rollback_id: ${{ steps.verify.outputs.rollback_id }}
    steps:
      - name: Check out exact central workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact central workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
          )

      - name: Check out exact admitted caller source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated publication workspace
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: trusted-exact

      - id: revalidate
        name: Revalidate release authority immediately before privileged work
        uses: ./.ciw/actions/resolve-release-tag
        with:
          phase: revalidate
          release_mode: existing-tag
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - id: build
        name: Rebuild and inspect exact source through OCI build contract
        continue-on-error: true
        uses: ./.ciw/actions/validate-oci
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: authenticate
        name: Authenticate with workflow-scoped named registry credentials
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: authenticate
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}

      - id: publish
        name: Publish immutable version and source identities idempotently
        if: ${{ steps.authenticate.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: publish
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: readback
        name: Read back registry manifests through independent Skopeo inspection
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: readback
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: verify
        name: Verify exact manifest, platform, metadata, and assertion parity
        if: ${{ steps.readback.outcome == 'success' }}
        continue-on-error: true
        uses: ./.ciw/actions/publish-oci
        with:
          phase: verify
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.revalidate.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - name: Render deterministic redacted publication evidence
        if: ${{ always() && !cancelled() }}
        uses: ./.ciw/actions/render-evidence
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: oci-publish-1.0.0
          runner_profile: ${{ needs.plan.outputs.runner_profile }}
          toolchain_json: >-
            {"buildah":"1.33.7","skopeo":"1.13.3","publication":"immutable"}
          command_profile: ${{ inputs.product_id }}
          result: ${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: not-run
          cleanup_removed_paths: "0"

      - id: publication_cleanup
        name: Remove registry auth, read-back layouts, and publication state
        if: always()
        uses: ./.ciw/actions/publish-oci
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: publication_residue
        name: Verify zero publication credential or layout residue
        if: always()
        uses: ./.ciw/actions/publish-oci
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: build_cleanup
        name: Remove images, manifests, builders, local layouts, and caches
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: build_residue
        name: Verify zero OCI build residue
        if: always()
        uses: ./.ciw/actions/validate-oci
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}

      - id: workspace_cleanup
        name: Remove and verify registered workspace state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Verify exact caller source remained clean
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

      - name: Project terminal trusted publication status
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUTH_OUTCOME: ${{ steps.authenticate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLICATION_CLEANUP_OUTCOME: ${{ steps.publication_cleanup.outcome }}
          PUBLICATION_RESIDUE_OUTCOME: ${{ steps.publication_residue.outcome }}
          BUILD_CLEANUP_OUTCOME: ${{ steps.build_cleanup.outcome }}
          BUILD_RESIDUE_OUTCOME: ${{ steps.build_residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${BUILD_OUTCOME}" = success
          test "${AUTH_OUTCOME}" = success
          test "${PUBLISH_OUTCOME}" = success
          test "${READBACK_OUTCOME}" = success
          test "${VERIFY_OUTCOME}" = success
          test "${PUBLICATION_CLEANUP_OUTCOME}" = success
          test "${PUBLICATION_RESIDUE_OUTCOME}" = success
          test "${BUILD_CLEANUP_OUTCOME}" = success
          test "${BUILD_RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
