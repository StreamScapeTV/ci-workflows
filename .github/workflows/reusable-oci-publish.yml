name: Reusable trusted OCI publication

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted for the release
        required: true
        type: string
      product_id:
        description: Checked-in product identifier from contracts/oci-products.json
        required: true
        type: string
      release_version:
        description: Exact stable SemVer tag without refs or a v prefix
        required: true
        type: string
      platform_set:
        description: Optional exact checked-in platform set confirmation; no arbitrary matrix
        required: false
        type: string
    secrets:
      registry_username:
        description: Least-privilege username for the fixed checked-in registry destination
        required: true
      registry_token:
        description: Least-privilege registry token; verify-only never writes
        required: true
    outputs:
      result:
        description: Success only after exact build, immutable publication/read-back, and cleanup
        value: ${{ jobs.publish.outputs.result }}
      manifest_digests_json:
        description: Deterministic JSON map of independently read-back registry manifest digests
        value: ${{ jobs.publish.outputs.manifest_digests_json }}
      platform_digests_json:
        description: Exact read-back platform manifest, config, layer, and assertion identities
        value: ${{ jobs.publish.outputs.platform_digests_json }}
      immutable_references_json:
        description: Canonical repositories, immutable version/source identities, and Flux handoff identities
        value: ${{ jobs.publish.outputs.immutable_references_json }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve trusted immutable publication plan
    runs-on: [linux, amd64, general]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      release_mode: ${{ steps.authority.outputs.release_mode }}
      release_source_sha: ${{ steps.authority.outputs.release_source_sha }}
      tag_object_sha: ${{ steps.authority.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.authority.outputs.tag_commit_sha }}
    steps:
      - id: authority
        name: Resolve exact caller release authority
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          release_mode: ${{ github.event_name == 'workflow_dispatch' && 'existing-tag' || 'tag-push' }}
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          release_source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.admitted_sha || '' }}

      - name: Verify authority matches the public release request
        shell: bash
        env:
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          AUTHORITY_SHA: ${{ steps.authority.outputs.release_source_sha }}
          AUTHORITY_VERSION: ${{ steps.authority.outputs.release_version }}
        run: |
          set -Eeuo pipefail
          test "${AUTHORITY_SHA}" = "${ADMITTED_SHA}"
          test "${AUTHORITY_VERSION}" = "${RELEASE_VERSION}"

      - id: plan
        name: Resolve contract-owned product, destination, and runner
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.authority.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

  publish:
    name: Release / OCI publication
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 180
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      manifest_digests_json: ${{ steps.terminal.outputs.manifest_digests_json }}
      platform_digests_json: ${{ steps.terminal.outputs.platform_digests_json }}
      immutable_references_json: ${{ steps.terminal.outputs.immutable_references_json }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare isolated publication workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: trusted-exact

      - id: tools
        name: Verify exact OCI builder host toolchain
        uses: StreamScapeTV/ci-workflows/actions/verify-toolchain@70e08d4ddf8930046632a7135950e924b82e22bf # issue #125 immutable private-action checkpoint
        with:
          operation: verify-set
          tool_set: oci-builder
          capability_profile: linux

      - id: revalidate
        name: Revalidate exact release authority immediately before privileged work
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          phase: revalidate
          release_mode: ${{ needs.plan.outputs.release_mode }}
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - name: Verify revalidated release authority stayed exact
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          ACTUAL_SHA: ${{ steps.revalidate.outputs.release_source_sha }}
          ACTUAL_VERSION: ${{ steps.revalidate.outputs.release_version }}
        run: |
          set -Eeuo pipefail
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"

      - id: build
        name: Rebuild and inspect exact source through OCI build contract
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@29cb88e406a0490834bd556bb825d0e227c862ac # issue #125 immutable private-action checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: credential_authority
        name: Revalidate exact release authority before registry authentication
        if: ${{ steps.build.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          phase: revalidate
          release_mode: ${{ needs.plan.outputs.release_mode }}
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - name: Verify pre-authentication release authority stayed exact
        if: ${{ steps.build.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          ACTUAL_SHA: ${{ steps.credential_authority.outputs.release_source_sha }}
          ACTUAL_VERSION: ${{ steps.credential_authority.outputs.release_version }}
        run: |
          set -Eeuo pipefail
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"

      - id: authenticate
        name: Authenticate with workflow-scoped named registry credentials
        if: ${{ steps.build.outcome == 'success' && steps.credential_authority.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: authenticate
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.credential_authority.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}

      - id: publication_authority
        name: Revalidate exact release authority immediately before publication
        if: ${{ steps.authenticate.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/resolve-release-tag@2b0443fdad002d47625386a959ebe68545cfe022 # issue #59 immutable helper checkpoint
        with:
          phase: revalidate
          release_mode: ${{ needs.plan.outputs.release_mode }}
          release_version: ${{ inputs.release_version }}
          release_source_sha: ${{ inputs.admitted_sha }}
          expected_tag_object_sha: ${{ needs.plan.outputs.tag_object_sha }}
          expected_tag_commit_sha: ${{ needs.plan.outputs.tag_commit_sha }}

      - name: Verify pre-publication release authority stayed exact
        if: ${{ steps.authenticate.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          ACTUAL_SHA: ${{ steps.publication_authority.outputs.release_source_sha }}
          ACTUAL_VERSION: ${{ steps.publication_authority.outputs.release_version }}
        run: |
          set -Eeuo pipefail
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"

      - id: publish
        name: Publish or verify immutable version and source identities
        if: ${{ steps.authenticate.outcome == 'success' && steps.publication_authority.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: publish
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.publication_authority.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: build_cleanup
        name: Remove built images and local layouts before independent read-back
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@29cb88e406a0490834bd556bb825d0e227c862ac # issue #125 immutable private-action checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: build_residue
        name: Verify zero OCI build residue before independent read-back
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-oci@29cb88e406a0490834bd556bb825d0e227c862ac # issue #125 immutable private-action checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: readback
        name: Read back registry manifests through independent Skopeo inspection
        if: ${{ steps.publish.outcome == 'success' && steps.build_cleanup.outcome == 'success' && steps.build_residue.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: readback
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.publication_authority.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: verify
        name: Verify exact manifest, platform, metadata, and assertion parity
        if: ${{ steps.readback.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: verify
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ steps.publication_authority.outputs.release_source_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: publication_cleanup
        name: Remove registry auth, read-back layouts, and publication state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: publication_residue
        name: Verify zero publication credential or layout residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}

      - id: evidence
        name: Render deterministic redacted publication evidence after OCI cleanup
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: oci-publish-1.0.0
          runner_profile: ${{ needs.plan.outputs.runner_profile }}
          toolchain_json: ${{ steps.tools.outputs.toolchain_json }}
          command_profile: ${{ inputs.product_id }}
          result: ${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: ${{ steps.publication_cleanup.outcome == 'success' && steps.publication_residue.outcome == 'success' && steps.build_cleanup.outcome == 'success' && steps.build_residue.outcome == 'success' && 'success' || 'failure' }}
          cleanup_removed_paths: "0"

      - id: evidence_summary
        name: Persist redacted toolchain and cleanup evidence in the run summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_JSON: ${{ steps.evidence.outputs.evidence_json }}
        run: |
          set -Eeuo pipefail
          test -n "${EVIDENCE_JSON}"
          {
            echo "## OCI publication execution evidence"
            echo
            echo '```json'
            printf '%s\n' "${EVIDENCE_JSON}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - id: source_clean
        name: Verify exact caller source remained clean
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

      - id: workspace_cleanup
        name: Remove and verify registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: final_supply_evidence
        name: Append canonical terminal OCI supply evidence after workspace cleanup
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/publish-oci@1661da705cac03206ba7f41598457bb7726c0dc9 # issue #17 immutable publication helper checkpoint
        with:
          phase: final-evidence
          admitted_sha: ${{ inputs.admitted_sha }}
          release_authority_sha: ${{ inputs.admitted_sha }}
          product_id: ${{ inputs.product_id }}
          release_version: ${{ inputs.release_version }}
          platform_set: ${{ inputs.platform_set }}
          central_workflow_sha: ${{ job.workflow_sha }}
          publication_helper_sha: 1661da705cac03206ba7f41598457bb7726c0dc9
          verified_toolchain_json: ${{ steps.tools.outputs.toolchain_json }}
          publication_evidence_id: ${{ steps.verify.outputs.evidence_id }}
          foundation_evidence_id: ${{ steps.evidence.outputs.evidence_id }}
          execution_result: ${{ steps.verify.outcome == 'success' && steps.verify.outputs.result == 'success' && 'success' || 'failure' }}
          build_cleanup_outcome: ${{ steps.build_cleanup.outcome }}
          build_residue_outcome: ${{ steps.build_residue.outcome }}
          publication_cleanup_outcome: ${{ steps.publication_cleanup.outcome }}
          publication_residue_outcome: ${{ steps.publication_residue.outcome }}
          workspace_cleanup_outcome: ${{ steps.workspace_cleanup.outcome }}

      - id: terminal
        name: Project terminal trusted publication status
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          AUTH_OUTCOME: ${{ steps.authenticate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLICATION_CLEANUP_OUTCOME: ${{ steps.publication_cleanup.outcome }}
          PUBLICATION_RESIDUE_OUTCOME: ${{ steps.publication_residue.outcome }}
          BUILD_CLEANUP_OUTCOME: ${{ steps.build_cleanup.outcome }}
          BUILD_RESIDUE_OUTCOME: ${{ steps.build_residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          EVIDENCE_SUMMARY_OUTCOME: ${{ steps.evidence_summary.outcome }}
          FINAL_SUPPLY_EVIDENCE_OUTCOME: ${{ steps.final_supply_evidence.outcome }}
          SOURCE_CLEAN_OUTCOME: ${{ steps.source_clean.outcome }}
          RESULT: ${{ steps.verify.outputs.result }}
          MANIFEST_DIGESTS_JSON: ${{ steps.verify.outputs.manifest_digests_json }}
          PLATFORM_DIGESTS_JSON: ${{ steps.verify.outputs.platform_digests_json }}
          IMMUTABLE_REFERENCES_JSON: ${{ steps.verify.outputs.immutable_references_json }}
        run: |
          set -Eeuo pipefail
          test "${BUILD_OUTCOME}" = success
          test "${TOOLS_OUTCOME}" = success
          test "${AUTH_OUTCOME}" = success
          test "${PUBLISH_OUTCOME}" = success
          test "${READBACK_OUTCOME}" = success
          test "${VERIFY_OUTCOME}" = success
          test "${PUBLICATION_CLEANUP_OUTCOME}" = success
          test "${PUBLICATION_RESIDUE_OUTCOME}" = success
          test "${BUILD_CLEANUP_OUTCOME}" = success
          test "${BUILD_RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
          test "${EVIDENCE_OUTCOME}" = success
          test "${EVIDENCE_SUMMARY_OUTCOME}" = success
          test "${FINAL_SUPPLY_EVIDENCE_OUTCOME}" = success
          test "${SOURCE_CLEAN_OUTCOME}" = success
          test "${RESULT}" = success
          {
            printf 'result=%s\n' "${RESULT}"
            printf 'manifest_digests_json=%s\n' "${MANIFEST_DIGESTS_JSON}"
            printf 'platform_digests_json=%s\n' "${PLATFORM_DIGESTS_JSON}"
            printf 'immutable_references_json=%s\n' "${IMMUTABLE_REFERENCES_JSON}"
          } >> "${GITHUB_OUTPUT}"
