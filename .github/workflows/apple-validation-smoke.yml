name: Apple validation smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-apple.yml
      - .github/workflows/apple-validation-smoke.yml
      - actions/validate-apple/**
      - scripts/ci/apple.py
      - src/ci_workflows/apple.py
      - src/ci_workflows/apple_contract.py
      - src/ci_workflows/apple_execution.py
      - src/ci_workflows/apple_types.py
      - src/ci_workflows/ciw_apple.py
      - contracts/apple-validation.json
      - tests/fixtures/apple-validation/**
      - tests/test_apple_validation.py
      - tests/test_apple_workflow_contract.py
permissions:
  actions: read
  contents: read

concurrency:
  group: apple-validation-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ios:
    name: Real iOS simulator smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-apple.yml
    with:
      admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      validation_profile: ios-simulator
      command_profile: ciw-apple-smoke
      working_directory: tests/fixtures/apple-validation/smoke-project
      project_path: tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj
      scheme: AppleValidationSmoke
      configuration: Debug

  tvos:
    name: Real tvOS simulator smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-apple.yml
    with:
      admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      validation_profile: tvos-simulator
      command_profile: ciw-apple-smoke
      working_directory: tests/fixtures/apple-validation/smoke-project
      project_path: tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj
      scheme: AppleValidationSmoke
      configuration: Debug

  macos:
    name: Real unsigned macOS smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-apple.yml
    with:
      admitted_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      validation_profile: macos
      command_profile: ciw-apple-smoke
      working_directory: tests/fixtures/apple-validation/smoke-project
      project_path: tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj
      scheme: AppleValidationSmoke
      configuration: Debug

  zero_artifacts:
    name: Verify Apple routine artifacts remain zero
    needs: [ios, tvos, macos]
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require all Apple smoke paths and zero Actions artifacts
        env:
          IOS_RESULT: ${{ needs.ios.result }}
          TVOS_RESULT: ${{ needs.tvos.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${IOS_RESULT}" = success
          test "${TVOS_RESULT}" = success
          test "${MACOS_RESULT}" = success
          python3 - <<'PY_ARTIFACTS'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Apple validation smoke retained Actions artifacts")
          print("Routine Apple Actions artifacts verified: zero.")
          PY_ARTIFACTS
