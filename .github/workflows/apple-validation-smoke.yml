name: Apple validation smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-apple.yml
      - .github/workflows/apple-validation-smoke.yml
      - actions/validate-apple/**
      - scripts/ci/apple.py
      - scripts/ci/apple_checkout_cleanup.py
      - src/ci_workflows/apple.py
      - src/ci_workflows/apple_contract.py
      - src/ci_workflows/apple_contract_fragments.py
      - src/ci_workflows/apple_execution.py
      - src/ci_workflows/apple_multistage.py
      - src/ci_workflows/apple_types.py
      - src/ci_workflows/ciw.py
      - src/ci_workflows/ciw_apple.py
      - contracts/apple-validation.json
      - contracts/apple-validation-*.json
      - contracts/bootstrap-public-workflows.json
      - contracts/ciw-commands.json
      - contracts/public-workflows.json
      - contracts/public-workflows/validation.json
      - docs/reference/ciw.md
      - docs/workflows/apple.md
      - docs/workflows/public-api-reference.md
      - tests/fixtures/apple-validation/**
      - tests/test_apple_*.py
      - tests/test_apple_contract_fragments.py
      - tests/test_apple_contract_fragment_path_safety.py
      - tests/test_apple_fragment_loader_isolation.py
      - tests/test_apple_smoke_trigger_contract.py
      - tests/test_bootstrap.py
      - tests/test_ciw_cli.py
      - tests/test_ciw_contracts.py
      - tests/test_public_api_contract.py

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-validation-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validate protected-full Apple smoke plan
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
    steps:
      - name: Check out exact pull request implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact pull request implementation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C .ciw status --porcelain=v1 --untracked-files=all)"

      - id: plan
        name: Resolve one sequential Apple smoke executor
        uses: ./.ciw/actions/validate-apple
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_scope: protected-full
          source_trust: trusted-pr
          validation_plan_json: >-
            {"stages":[{"id":"ios-build","platform":"ios","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"tvos-build","platform":"tvos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"macos-build","platform":"macos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]}]}

      - name: Require one Apple executor and compile-only stage plan
        shell: bash
        env:
          RUNS_ON_JSON: ${{ steps.plan.outputs.runs_on_json }}
          TEST_SUMMARY: ${{ steps.plan.outputs.test_summary }}
        run: |
          set -Eeuo pipefail
          test "${RUNS_ON_JSON}" = '["macOS","ARM64"]'
          python3 - <<'PY'
          import json
          import os
          stages = json.loads(os.environ["TEST_SUMMARY"])
          assert [row["platform"] for row in stages] == ["ios", "tvos", "macos"]
          assert all(row["operation"] == "build" for row in stages)
          PY

      - name: Run branch-exclusive Apple contract tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            PYTHONPATH=src python3 -m unittest -v \
              tests.test_apple_protected_full \
              tests.test_apple_validation \
              tests.test_apple_simulator_ownership \
              tests.test_apple_terminal_cleanup \
              tests.test_apple_workflow_contract
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

  apple:
    name: Real protected-full Apple smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Clear fixed admitted source checkout root
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .ciw/scripts/ci/apple_checkout_cleanup.py source

      - id: checkout
        name: Check out exact admitted smoke source once
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated Apple workspace
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr

      - id: execute
        name: Execute iOS, tvOS, and macOS builds sequentially
        uses: ./.ciw/actions/validate-apple
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_scope: protected-full
          source_trust: trusted-pr
          validation_plan_json: >-
            {"stages":[{"id":"ios-build","platform":"ios","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"tvos-build","platform":"tvos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"macos-build","platform":"macos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]}]}

      - id: apple_cleanup
        name: Remove Apple-specific state once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-apple
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_scope: protected-full
          source_trust: trusted-pr
          validation_plan_json: >-
            {"stages":[{"id":"ios-build","platform":"ios","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"tvos-build","platform":"tvos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"macos-build","platform":"macos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]}]}

      - id: residue
        name: Verify zero Apple-specific residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-apple
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_scope: protected-full
          source_trust: trusted-pr
          validation_plan_json: >-
            {"stages":[{"id":"ios-build","platform":"ios","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"tvos-build","platform":"tvos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"macos-build","platform":"macos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]}]}

      - id: clean
        name: Verify exact admitted source remained clean
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - id: source_cleanup
        name: Remove exact admitted smoke source once
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .ciw/scripts/ci/apple_checkout_cleanup.py source

      - id: workspace_cleanup
        name: Remove and verify the one registered Apple workspace
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - id: central_cleanup
        name: Remove exact validation implementation checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .ciw/scripts/ci/apple_checkout_cleanup.py central

      - name: Project terminal protected-full smoke status
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          APPLE_CLEANUP_OUTCOME: ${{ steps.apple_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          SOURCE_CLEANUP_OUTCOME: ${{ steps.source_cleanup.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
          CENTRAL_CLEANUP_OUTCOME: ${{ steps.central_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${EXECUTE_OUTCOME}" = success
          test "${APPLE_CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${CLEAN_OUTCOME}" = success
          test "${SOURCE_CLEANUP_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
          test "${CENTRAL_CLEANUP_OUTCOME}" = success

  zero_artifacts:
    name: Verify Apple routine artifacts remain zero
    needs: [plan, apple]
    if: ${{ always() && !cancelled() }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    steps:
      - name: Require real protected-full smoke success
        shell: bash
        env:
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          set -Eeuo pipefail
          test "${APPLE_RESULT}" = success

      - name: Verify zero workflow artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("routine Apple Actions artifacts are not zero")
          print("Routine Apple Actions artifacts verified: zero")
          PY
