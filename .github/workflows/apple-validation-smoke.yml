name: Apple validation smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-apple.yml
      - .github/workflows/apple-validation-smoke.yml
      - actions/validate-apple/**
      - actions/cleanup-apple-checkout/**
      - scripts/ci/apple.py
      - scripts/ci/apple_checkout_cleanup.py
      - src/ci_workflows/apple.py
      - src/ci_workflows/apple_contract.py
      - src/ci_workflows/apple_execution.py
      - src/ci_workflows/apple_types.py
      - src/ci_workflows/ciw_apple.py
      - contracts/apple-validation.json
      - tests/fixtures/apple-validation/**
      - tests/test_apple_simulator_ownership.py
      - tests/test_apple_terminal_cleanup.py
      - tests/test_apple_validation.py
      - tests/test_apple_workflow_contract.py

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-validation-smoke-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve exact Apple smoke selectors
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: portable
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.ios.outputs.runs_on_json }}
      workspace_profile: ${{ steps.ios.outputs.workspace_profile }}
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")

      - id: ios
        name: Resolve exact iOS simulator smoke plan
        uses: ./.ciw/actions/validate-apple
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: ios
          scheme: AppleValidationSmoke
          destination_profile: ios-simulator-default
          source_trust: trusted-pr

      - id: tvos
        name: Resolve exact tvOS simulator smoke plan
        uses: ./.ciw/actions/validate-apple
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: tvos-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: tvos
          scheme: AppleValidationSmoke
          destination_profile: tvos-simulator-default
          source_trust: trusted-pr

      - id: macos
        name: Resolve exact unsigned macOS smoke plan
        uses: ./.ciw/actions/validate-apple
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: macos
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: macos
          scheme: AppleValidationSmoke
          destination_profile: macos-unsigned
          source_trust: trusted-pr

      - name: Run branch-exclusive Apple repair checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            PYTHONPATH=src python3 -m unittest -v \
              tests.test_apple_validation \
              tests.test_apple_simulator_ownership \
              tests.test_apple_terminal_cleanup \
              tests.test_apple_workflow_contract
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

  ios:
    name: Real iOS simulator smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Clear fixed admitted source checkout root
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Check out exact admitted smoke source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - name: Verify exact admitted smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
          (cd source && test -z "$(git status --porcelain=v1 --untracked-files=all)")

      - name: Prepare isolated Apple state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr

      - id: execute
        name: Execute exact iOS simulator validation
        uses: ./.ciw/actions/validate-apple
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: ios
          scheme: AppleValidationSmoke
          destination_profile: ios-simulator-default
          source_trust: trusted-pr

      - name: Remove Apple-specific iOS state
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: ios
          scheme: AppleValidationSmoke
          destination_profile: ios-simulator-default
          source_trust: trusted-pr

      - name: Verify zero Apple-specific iOS residue
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: ios
          scheme: AppleValidationSmoke
          destination_profile: ios-simulator-default
          source_trust: trusted-pr

      - name: Remove exact admitted iOS smoke source
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Remove and verify registered iOS workflow state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Remove exact iOS validation implementation checkout
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: central

  tvos:
    name: Real tvOS simulator smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Clear fixed admitted source checkout root
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Check out exact admitted smoke source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - name: Verify exact admitted smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
          (cd source && test -z "$(git status --porcelain=v1 --untracked-files=all)")

      - name: Prepare isolated Apple state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr

      - id: execute
        name: Execute exact tvOS simulator validation
        uses: ./.ciw/actions/validate-apple
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: tvos-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: tvos
          scheme: AppleValidationSmoke
          destination_profile: tvos-simulator-default
          source_trust: trusted-pr

      - name: Remove Apple-specific tvOS state
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: tvos-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: tvos
          scheme: AppleValidationSmoke
          destination_profile: tvos-simulator-default
          source_trust: trusted-pr

      - name: Verify zero Apple-specific tvOS residue
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: tvos-simulator
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: tvos
          scheme: AppleValidationSmoke
          destination_profile: tvos-simulator-default
          source_trust: trusted-pr

      - name: Remove exact admitted tvOS smoke source
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Remove and verify registered tvOS workflow state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Remove exact tvOS validation implementation checkout
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: central

  macos:
    name: Real unsigned macOS smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Clear fixed admitted source checkout root
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Check out exact admitted smoke source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch_depth: "1"

      - name: Verify exact admitted smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
          (cd source && test -z "$(git status --porcelain=v1 --untracked-files=all)")

      - name: Prepare isolated Apple state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr

      - id: execute
        name: Execute exact unsigned macOS validation
        uses: ./.ciw/actions/validate-apple
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: macos
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: macos
          scheme: AppleValidationSmoke
          destination_profile: macos-unsigned
          source_trust: trusted-pr

      - name: Remove Apple-specific macOS state
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: macos
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: macos
          scheme: AppleValidationSmoke
          destination_profile: macos-unsigned
          source_trust: trusted-pr

      - name: Verify zero Apple-specific macOS residue
        if: always()
        uses: ./.ciw/actions/validate-apple
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: macos
          working_directory: tests/fixtures/apple-validation/smoke-project
          command_profile: ciw-apple-smoke
          platform: macos
          scheme: AppleValidationSmoke
          destination_profile: macos-unsigned
          source_trust: trusted-pr

      - name: Remove exact admitted macOS smoke source
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: source

      - name: Remove and verify registered macOS workflow state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

      - name: Remove exact macOS validation implementation checkout
        if: always()
        uses: ./.ciw/actions/cleanup-apple-checkout
        with:
          target: central

  zero_artifacts:
    name: Verify Apple routine artifacts remain zero
    needs: [plan, ios, tvos, macos]
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require all Apple smoke paths and zero Actions artifacts
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          TVOS_RESULT: ${{ needs.tvos.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${PLAN_RESULT}" = success
          test "${IOS_RESULT}" = success
          test "${TVOS_RESULT}" = success
          test "${MACOS_RESULT}" = success
          python3 - <<'PY_ARTIFACTS'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Apple validation smoke retained Actions artifacts")
          print("Routine Apple Actions artifacts verified: zero.")
          PY_ARTIFACTS
