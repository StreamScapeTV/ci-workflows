name: Issue 813 strict-shell correction

"on":
  push:
    branches:
      - agent2/issue-813-media-native-mac
    paths:
      - .github/workflows/issue-813-apply.yml

permissions:
  contents: write

jobs:
  correct:
    if: ${{ github.repository == 'StreamScapeTV/ci-workflows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply strict-shell-safe caller fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apple.yml')
          text = path.read_text(encoding='utf-8')
          old = '          source_repository="${SOURCE_REPOSITORY:-${CALLER_REPOSITORY}}"\n'
          new = '          source_repository="${SOURCE_REPOSITORY:-${CALLER_REPOSITORY:-}}"\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Apple runner repository fallback')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/issue-813-apply.yml

      - name: Validate canonical self-check surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_ci_helpers_current tests.test_native_targeted_profiles tests.test_android_search_performance_profile tests.test_oci_reproducibility tests.test_apple_workflow tests.test_node_flutter_observed_source tests.test_python_workflow tests.test_google_drive_media_put tests.test_source_snapshot_delete tests.test_source_checkpoint_publish tests.test_maven_workflow tests.test_apple_binary_workflow tests.test_runner_images_workflow
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          path = Path('.github/workflows/apple.yml')
          value = yaml.safe_load(path.read_text(encoding='utf-8'))
          for job in value['jobs'].values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script or step.get('shell', 'bash') != 'bash':
                      continue
                  checked = subprocess.run(['bash', '-n'], input=script, text=True, capture_output=True)
                  if checked.returncode:
                      raise SystemExit(f"{step.get('name')} bash -n failed: {checked.stderr}")
          PY

      - name: Upload corrected Apple workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          encoded="$(base64 -w0 .github/workflows/apple.yml)"
          response="$(jq -nc --arg content "${encoded}" '{content:$content,encoding:"base64"}' | curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @- \
            "https://api.github.com/repos/${REPOSITORY}/git/blobs")"
          sha="$(printf '%s' "${response}" | jq -r '.sha // empty')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'apple_blob_sha=%s\n' "${sha}"
