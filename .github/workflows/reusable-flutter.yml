name: Reusable Flutter validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      validation_profile:
        description: Bounded Flutter validation profile
        required: true
        type: string
      version_file:
        description: Optional exact contract-matching Flutter pin file
        required: false
        default: ""
        type: string
      working_directory:
        description: Optional exact contract-matching source directory
        required: false
        default: "."
        type: string
      command_profile:
        description: Reviewed product-neutral Flutter consumer contract identifier
        required: true
        type: string
      script_path:
        description: Optional exact contract-matching checked-in gate
        required: false
        default: ""
        type: string
      platform:
        description: Optional exact contract-matching platform boundary
        required: false
        default: ""
        type: string
      artifact_exception_id:
        description: Reserved zero-artifact field; non-empty values are rejected
        required: false
        default: ""
        type: string
    outputs:
      result:
        description: Success only after selected semantic runner validation and cleanup
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Deterministic bounded stage summary
        value: ${{ jobs.validate.outputs.test_summary }}
      artifact_exception_used:
        description: Always false for Flutter validation 1.0.0
        value: ${{ jobs.validate.outputs.artifact_exception_used }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve bounded Flutter validation plan
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
      dart_version: ${{ steps.plan.outputs.dart_version }}
      gradle_version: ${{ steps.plan.outputs.gradle_version }}
      jdk_distribution: ${{ steps.plan.outputs.jdk_distribution }}
      jdk_version: ${{ steps.plan.outputs.jdk_version }}
    steps:
      - id: plan
        name: Resolve contract-owned Flutter Dart Gradle and JDK tuple
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

  portable:
    name: Execute portable Flutter source or handoff validation
    needs: plan
    if: ${{ needs.plan.outputs.runner_profile == 'portable' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 30
    outputs:
      result: ${{ steps.execute.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
      - name: Verify exact admitted caller source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Flutter state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}
      - id: execute
        name: Execute bounded Flutter validation
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: flutter_cleanup
        name: Remove Flutter-specific state and preserve primary failure
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          primary_failure_code: ${{ steps.execute.outputs.primary_failure_code || steps.execute.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: workspace_cleanup
        name: Remove and verify all registered workflow state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

  mobile:
    name: Execute mobile Flutter quality or Android validation
    needs: plan
    if: ${{ needs.plan.outputs.runner_profile == 'mobile' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 100
    outputs:
      result: ${{ steps.execute.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
      - name: Verify exact admitted caller source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Flutter state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}
      - id: persistent_cache_snapshot
        name: Snapshot persistent host pub cache before Flutter setup
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: persistent-cache-snapshot
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - name: Set up exact contract-owned compatible JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ needs.plan.outputs.jdk_distribution }}
          java-version: ${{ needs.plan.outputs.jdk_version }}
      - name: Set up exact immutable Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-{1}', env.CI_TOOL_ROOT, needs.plan.outputs.flutter_version) }}
          pub-cache-path: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
      - id: pub_cache_bind
        name: Force Flutter pub cache beneath registered workflow state
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: pub-cache-bind
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: toolchain
        name: Verify exact Java Javac Flutter and Dart identities
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: verify-toolchain
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: execute
        name: Execute bounded Flutter validation
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: persistent_cache_verify
        name: Prove persistent host pub cache is unchanged
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: persistent-cache-verify
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: flutter_cleanup
        name: Remove registered Flutter and pub state and preserve primary failure
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          primary_failure_code: ${{ steps.execute.outputs.primary_failure_code || steps.execute.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific and pub-cache residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: workspace_cleanup
        name: Remove and verify all registered workflow state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

  apple:
    name: Execute Apple Flutter iOS simulator validation
    needs: plan
    if: ${{ needs.plan.outputs.runner_profile == 'apple' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 100
    outputs:
      result: ${{ steps.execute.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      artifact_exception_used: ${{ steps.execute.outputs.artifact_exception_used }}
    steps:
      - name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"
      - name: Verify exact admitted caller source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          (cd source && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Flutter state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust }}
      - id: persistent_cache_snapshot
        name: Snapshot persistent host pub cache before Flutter setup
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: persistent-cache-snapshot
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - name: Set up exact immutable Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-{1}', env.CI_TOOL_ROOT, needs.plan.outputs.flutter_version) }}
          pub-cache-path: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
      - id: pub_cache_bind
        name: Force Flutter pub cache beneath registered workflow state
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: pub-cache-bind
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: toolchain
        name: Verify exact Flutter and Dart identities
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: verify-toolchain
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: execute
        name: Execute bounded Flutter validation
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          version_file: ${{ inputs.version_file }}
          working_directory: ${{ inputs.working_directory }}
          command_profile: ${{ inputs.command_profile }}
          script_path: ${{ inputs.script_path }}
          platform: ${{ inputs.platform }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: persistent_cache_verify
        name: Prove persistent host pub cache is unchanged
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: persistent-cache-verify
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: flutter_cleanup
        name: Remove registered Flutter and pub state and preserve primary failure
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
          primary_failure_code: ${{ steps.execute.outputs.primary_failure_code || steps.execute.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific and pub-cache residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-flutter@70ce13b2b9edaea8e30ff4db9b5fa3c02551b06e # issue #27 Finance Node authority checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          command_profile: ${{ inputs.command_profile }}
          source_trust: ${{ needs.plan.outputs.source_trust }}
      - id: workspace_cleanup
        name: Remove and verify all registered workflow state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

  validate:
    name: CI / Flutter validation
    needs: [plan, portable, mobile, apple]
    if: always()
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      result: ${{ steps.result.outputs.result }}
      test_summary: ${{ steps.result.outputs.test_summary }}
      artifact_exception_used: ${{ steps.result.outputs.artifact_exception_used }}
    steps:
      - id: result
        name: Require selected semantic execution and zero skipped-path authority
        env:
          SELECTED: ${{ needs.plan.outputs.runner_profile }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          PORTABLE_STATUS: ${{ needs.portable.outputs.result }}
          MOBILE_STATUS: ${{ needs.mobile.outputs.result }}
          APPLE_STATUS: ${{ needs.apple.outputs.result }}
          TEST_SUMMARY: ${{ needs.portable.outputs.test_summary || needs.mobile.outputs.test_summary || needs.apple.outputs.test_summary }}
          ARTIFACT_EXCEPTION_USED: ${{ needs.portable.outputs.artifact_exception_used || needs.mobile.outputs.artifact_exception_used || needs.apple.outputs.artifact_exception_used }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${SELECTED}" in
            portable) test "${PORTABLE_RESULT}" = success; test "${PORTABLE_STATUS}" = success ;;
            mobile) test "${MOBILE_RESULT}" = success; test "${MOBILE_STATUS}" = success ;;
            apple) test "${APPLE_RESULT}" = success; test "${APPLE_STATUS}" = success ;;
            *) exit 1 ;;
          esac
          test "${ARTIFACT_EXCEPTION_USED}" = false
          {
            echo "result=success"
            echo "test_summary=${TEST_SUMMARY}"
            echo "artifact_exception_used=false"
          } >> "${GITHUB_OUTPUT}"
