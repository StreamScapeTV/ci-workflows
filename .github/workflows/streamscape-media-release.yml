name: Streamscape Media release publication

"on":
  workflow_call:
    inputs:
      repository: {type: string, required: true}
      ref: {type: string, required: true}
      source_is_tag: {type: boolean, required: true}
      ci_run_id: {type: string, required: true}
    secrets: inherit
    outputs:
      version: {value: "${{ jobs.finalize.outputs.version }}"}
      source_sha: {value: "${{ jobs.finalize.outputs.source_sha }}"}
      manifest_sha256: {value: "${{ jobs.finalize.outputs.manifest_sha256 }}"}

permissions: {contents: read}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: "${{ steps.identity.outputs.version }}"
      source_sha: "${{ steps.identity.outputs.source_sha }}"
    steps:
      - name: Mark parent Agent State run as running
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: "${{ secrets.AGENT_STATE_SUPABASE_URL }}"
          AGENT_STATE_SUPABASE_SECRET_KEY: "${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}"
        with: {phase: start, ci_run_id: "${{ inputs.ci_run_id }}"}
      - name: Validate stable Streamscape Media tag request
        env:
          REPOSITORY: "${{ inputs.repository }}"
          TAG: "${{ inputs.ref }}"
          IS_TAG: "${{ inputs.source_is_tag }}"
        run: |
          set -Eeuo pipefail
          test "${REPOSITORY}" = StreamScapeTV/streamscape-media
          test "${IS_TAG}" = true
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: "${{ secrets.SOURCE_APP_ID }}"
          private-key: "${{ secrets.SOURCE_APP_PRIVATE_KEY }}"
          owner: StreamScapeTV
          repositories: streamscape-media
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          repository: "${{ inputs.repository }}"
          ref: "${{ inputs.ref }}"
          token: "${{ steps.source.outputs.token }}"
          fetch-depth: 1
          persist-credentials: false
      - id: identity
        name: Resolve tag-derived release identity
        env: {RELEASE_TAG: "${{ inputs.ref }}"}
        run: |
          set -Eeuo pipefail
          version="${RELEASE_TAG#v}"; source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "${version}"
          printf 'version=%s\nsource_sha=%s\n' "${version}" "${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Record tag-resolved source provenance
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: "${{ secrets.AGENT_STATE_SUPABASE_URL }}"
          AGENT_STATE_SUPABASE_SECRET_KEY: "${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}"
        with:
          phase: observe-source
          ci_run_id: "${{ inputs.ci_run_id }}"
          observed_source_sha: "${{ steps.identity.outputs.source_sha }}"

  android_maven:
    needs: prepare
    uses: ./.github/workflows/maven.yml
    with:
      repository: "${{ inputs.repository }}"
      ref: "${{ needs.prepare.outputs.source_sha }}"
      build_number: "${{ needs.prepare.outputs.version }}"
      ci_run_id: ""
      upload_private_log: true
    secrets: inherit

  apple_binary:
    needs: prepare
    uses: ./.github/workflows/streamscape-media-apple-binary.yml
    with:
      repository: "${{ inputs.repository }}"
      ref: "${{ needs.prepare.outputs.source_sha }}"
      version: "${{ needs.prepare.outputs.version }}"
    secrets: inherit

  finalize:
    needs: [prepare, android_maven, apple_binary]
    if: "${{ always() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: "${{ needs.prepare.outputs.version }}"
      source_sha: "${{ needs.prepare.outputs.source_sha }}"
      manifest_sha256: "${{ steps.publish.outputs.manifest_sha256 }}"
    steps:
      - name: Require both bounded publication children
        run: |
          test '${{ needs.prepare.result }}' = success
          test '${{ needs.android_maven.result }}' = success
          test '${{ needs.apple_binary.result }}' = success
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Connect to fixed private package service
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: "${{ secrets.TS_OAUTH_CLIENT_ID }}"
          TS_OAUTH_SECRET: "${{ secrets.TS_OAUTH_SECRET }}"
      - id: publish
        name: Create and publish immutable cross-platform publication manifest
        env:
          PACKAGE_USERNAME: "${{ secrets.MAVEN_PUBLISH_USERNAME }}"
          PACKAGE_TOKEN: "${{ secrets.MAVEN_PUBLISH_TOKEN }}"
        run: >-
          python3 scripts/ci/streamscape_media_release.py final
          --version '${{ needs.prepare.outputs.version }}'
          --source-sha '${{ needs.prepare.outputs.source_sha }}'
          --maven-source-sha '${{ needs.android_maven.outputs.source_sha }}'
          --apple-source-sha '${{ needs.apple_binary.outputs.source_sha }}'
          --maven-publication-id '${{ needs.android_maven.outputs.publication_id }}'
          --maven-archive-sha256 '${{ needs.android_maven.outputs.archive_sha256 }}'
          --maven-manifest-sha256 '${{ needs.android_maven.outputs.manifest_sha256 }}'
          --apple-archive-sha256 '${{ needs.apple_binary.outputs.archive_sha256 }}'
          --apple-compatibility-sha256 '${{ needs.apple_binary.outputs.compatibility_sha256 }}'
          --apple-manifest-sha256 '${{ needs.apple_binary.outputs.manifest_sha256 }}'
          --apple-platforms-json '${{ needs.apple_binary.outputs.included_platforms_json }}'
          --apple-boundary-json '${{ needs.apple_binary.outputs.native_runtime_boundary_json }}'
          --manifest '${{ runner.temp }}/streamscape-media-release-manifest.json'
      - id: cleanup
        if: "${{ always() }}"
        run: 'rm -f "${RUNNER_TEMP}/streamscape-media-release-manifest.json"'
      - name: Finish parent Agent State run
        if: "${{ always() }}"
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: "${{ secrets.AGENT_STATE_SUPABASE_URL }}"
          AGENT_STATE_SUPABASE_SECRET_KEY: "${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}"
        with:
          phase: finish
          ci_run_id: "${{ inputs.ci_run_id }}"
          status: "${{ needs.prepare.result == 'success' && needs.android_maven.result == 'success' && needs.apple_binary.result == 'success' && steps.publish.outcome == 'success' && steps.cleanup.outcome == 'success' && 'succeeded' || 'failed' }}"
