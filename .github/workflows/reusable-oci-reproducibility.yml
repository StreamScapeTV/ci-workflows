name: Reusable OCI two-clean-build reproducibility

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact already-admitted lowercase 40-character caller source SHA
        required: true
        type: string
      dockerfile_path:
        description: Caller-repository-relative Dockerfile path
        required: false
        default: Dockerfile
        type: string
      build_context:
        description: Caller-repository-relative image build context
        required: false
        default: .
        type: string
    outputs:
      result:
        description: Success after both isolated builds have byte-identical required raw configs
        value: ${{ jobs.reproducibility.outputs.result }}
      source_sha:
        description: Exact caller source SHA proven by both clean builds
        value: ${{ jobs.reproducibility.outputs.source_sha }}
      platform_digests_json:
        description: JSON object mapping required platform names to raw OCI config SHA-256 identities
        value: ${{ jobs.reproducibility.outputs.platform_digests_json }}

permissions:
  contents: read

jobs:
  reproducibility:
    name: CI / OCI reproducibility
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 180
    outputs:
      result: ${{ steps.proof.outputs.result }}
      source_sha: ${{ steps.proof.outputs.source_sha }}
      platform_digests_json: ${{ steps.proof.outputs.platform_digests_json }}
    env:
      ADMITTED_SHA: ${{ inputs.admitted_sha }}
      DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
      BUILD_CONTEXT: ${{ inputs.build_context }}
      SOURCE_ROOT: source
    steps:
      - name: Check out exact Central reusable-workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact Central workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${{ job.workflow_sha }}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - name: Check out exact admitted caller source
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - name: Verify fixed daemonless multi-platform tool contract
        shell: bash
        run: |
          set -Eeuo pipefail
          buildah --version
          skopeo --version
          command -v qemu-aarch64-static >/dev/null
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          ! command -v docker
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock

      - id: proof
        name: Build twice and compare raw per-platform OCI config blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .ciw/scripts/ci/oci_reproducibility.py run

      - name: Reverify exact caller source after both builds
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d source/.git
          test "$(git -C source rev-parse HEAD)" = "${ADMITTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Remove all run-owned OCI reproducibility state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state_root="${RUNNER_TEMP}/ciw-oci-repro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -f .ciw/scripts/ci/oci_reproducibility.py; then
            python3 .ciw/scripts/ci/oci_reproducibility.py cleanup
          else
            rm -rf "${state_root}"
          fi
          test ! -e "${state_root}"

      - name: Verify zero routine Actions artifact behavior
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'ciw-oci-repro-*' -print -quit)"
