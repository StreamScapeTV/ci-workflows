name: Container service conformance

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      service_port:
        type: number
        required: true
      dockerfile_path:
        type: string
        required: false
        default: Dockerfile
      build_context:
        type: string
        required: false
        default: "."
      ci_run_id:
        type: string
        required: true
    secrets:
      SOURCE_APP_ID:
        required: true
      SOURCE_APP_PRIVATE_KEY:
        required: true
      AGENT_STATE_SUPABASE_URL:
        required: true
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: true
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_ID:
        required: true
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: true
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: true

permissions:
  contents: read

env:
  POSTGRES_IMAGE: postgres:17-alpine
  PRODUCT_WRAPPER: scripts/ci/run-container-service-conformance.sh

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Initialize private conformance state
        id: initialize
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_root="${RUNNER_TEMP}/container-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log="${RUNNER_TEMP}/central-container-service.log"
          test ! -e "${runtime_root}"
          mkdir -m 0700 "${runtime_root}"
          : > "${runtime_root}/service.env"
          chmod 0600 "${runtime_root}/service.env"
          : > "${log}"
          chmod 0600 "${log}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'CI_LOG=%s\n' "${log}"
            printf 'RUNTIME_ROOT=%s\n' "${runtime_root}"
            printf 'SERVICE_ENV_FILE=%s\n' "${runtime_root}/service.env"
            printf 'SERVICE_NETWORK=ciw-service-%s\n' "${suffix}"
            printf 'POSTGRES_CONTAINER=ciw-postgres-%s\n' "${suffix}"
            printf 'POSTGRES_VOLUME=ciw-postgres-%s\n' "${suffix}"
            printf 'SERVICE_CONTAINER=ciw-app-%s\n' "${suffix}"
          } >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        id: agent_start
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact requested source
        id: source_checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact source and fixed conformance wrapper
        id: source_identity
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          SERVICE_PORT: ${{ inputs.service_port }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SERVICE_PORT}" =~ ^[0-9]+$ ]]
          (( SERVICE_PORT >= 1 && SERVICE_PORT <= 65535 ))
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          python3 - "${PWD}/source" "${DOCKERFILE_PATH}" "${BUILD_CONTEXT}" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys

          root = Path(sys.argv[1]).resolve()
          values = (("dockerfile_path", sys.argv[2], "file"), ("build_context", sys.argv[3], "directory"))
          for name, raw, kind in values:
              if not raw or len(raw) > 240 or "\\" in raw or "\x00" in raw:
                  raise SystemExit(f"invalid {name}")
              relative = PurePosixPath(raw)
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"invalid {name}")
              target = root.joinpath(*relative.parts).resolve()
              try:
                  target.relative_to(root)
              except ValueError as exc:
                  raise SystemExit(f"{name} escapes source checkout") from exc
              if kind == "file" and not target.is_file():
                  raise SystemExit(f"{name} is not a file")
              if kind == "directory" and not target.is_dir():
                  raise SystemExit(f"{name} is not a directory")

          wrapper = root / "scripts/ci/run-container-service-conformance.sh"
          if not wrapper.is_file() or wrapper.is_symlink():
              raise SystemExit("fixed container-service conformance wrapper is missing or invalid")
          PY
          git -C source ls-files --error-unmatch -- "${PRODUCT_WRAPPER}" >/dev/null 2>&1 || {
            echo "fixed container-service conformance wrapper must be tracked by the source repository" >&2
            exit 2
          }
          test -x "source/${PRODUCT_WRAPPER}" || {
            echo "fixed container-service conformance wrapper must be executable" >&2
            exit 2
          }
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'SOURCE_SHA=%s\n' "${source_sha}" >> "${GITHUB_ENV}"
          printf 'Exact source SHA %s admitted for container-service conformance.\n' "${source_sha}" >> "${CI_LOG}"

      - name: Record exact requested source SHA
        id: observe_source
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Verify fixed hosted container toolchain
        id: toolchain
        shell: bash
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          test "${CI_RUNNER_ENVIRONMENT}" = github-hosted
          test "${RUNNER_OS}" = Linux
          test "$(uname -m)" = x86_64
          buildah --version >> "${CI_LOG}" 2>&1
          docker --version >> "${CI_LOG}" 2>&1
          docker info >/dev/null 2>&1

      - name: Build exact local service image
        id: image
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          set -Eeuo pipefail
          state_root="${RUNTIME_ROOT}/buildah"
          mkdir -m 0700 "${state_root}"
          mkdir -m 0700 \
            "${state_root}/graphroot" \
            "${state_root}/runroot" \
            "${state_root}/tmp" \
            "${state_root}/home" \
            "${state_root}/cache"
          printf '{}\n' > "${state_root}/auth.json"
          chmod 0600 "${state_root}/auth.json"
          build_reference="localhost/ciw-container-service:${SOURCE_SHA}"
          service_tag="ciw-container-service:${SOURCE_SHA}"
          buildah_cmd=(
            buildah
            --root "${state_root}/graphroot"
            --runroot "${state_root}/runroot"
            --storage-driver vfs
          )
          if ! (
            export TMPDIR="${state_root}/tmp"
            export HOME="${state_root}/home"
            export XDG_CACHE_HOME="${state_root}/cache"
            export REGISTRY_AUTH_FILE="${state_root}/auth.json"
            cd source
            "${buildah_cmd[@]}" build \
              --layers=false \
              --pull=always \
              --format oci \
              --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --tag "${build_reference}" \
              --file "${DOCKERFILE_PATH}" \
              "${BUILD_CONTEXT}" \
              >> "${CI_LOG}" 2>&1
            "${buildah_cmd[@]}" push \
              "${build_reference}" \
              "docker-daemon:${service_tag}" \
              >> "${CI_LOG}" 2>&1
          ); then
            echo "Exact local service image build failed; inspect the private Google Drive CI log." >&2
            exit 1
          fi
          "${buildah_cmd[@]}" unmount --all >> "${CI_LOG}" 2>&1 || true
          "${buildah_cmd[@]}" rm --all >> "${CI_LOG}" 2>&1 || true
          "${buildah_cmd[@]}" rmi --all --force >> "${CI_LOG}" 2>&1 || true
          rm -rf "${state_root}"
          test ! -e "${state_root}"

          image_id="$(docker image inspect --format '{{.Id}}' "${service_tag}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${service_tag}")"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${revision}" = "${SOURCE_SHA}"
          {
            printf 'image_id=%s\n' "${image_id}"
            printf 'service_tag=%s\n' "${service_tag}"
          } >> "${GITHUB_OUTPUT}"
          printf 'Exact local image ID %s verified for source SHA %s.\n' "${image_id}" "${SOURCE_SHA}" >> "${CI_LOG}"

      - name: Start isolated PostgreSQL
        id: postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          docker network create "${SERVICE_NETWORK}" >/dev/null
          docker volume create "${POSTGRES_VOLUME}" >/dev/null
          docker run --detach \
            --name "${POSTGRES_CONTAINER}" \
            --network "${SERVICE_NETWORK}" \
            --network-alias postgres \
            --volume "${POSTGRES_VOLUME}:/var/lib/postgresql/data" \
            --env POSTGRES_USER=ciw \
            --env POSTGRES_DB=ciw \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1::5432 \
            "${POSTGRES_IMAGE}" >/dev/null
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "${POSTGRES_CONTAINER}" pg_isready -U ciw -d ciw >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true
          postgres_port="$(docker port "${POSTGRES_CONTAINER}" 5432/tcp | sed -n 's/^127\.0\.0\.1:\([0-9][0-9]*\)$/\1/p')"
          [[ "${postgres_port}" =~ ^[0-9]+$ ]]
          {
            printf 'CIW_POSTGRES_URL=postgresql://ciw@127.0.0.1:%s/ciw\n' "${postgres_port}"
            printf 'CIW_POSTGRES_NETWORK_URL=postgresql://ciw@postgres:5432/ciw\n'
          } >> "${GITHUB_ENV}"
          printf 'Isolated PostgreSQL is ready on the job-local network.\n' >> "${CI_LOG}"

      - name: Run fixed product prepare phase
        id: prepare
        shell: bash
        env:
          CIW_CONTAINER_CONFORMANCE_PHASE: prepare
          CIW_SERVICE_IMAGE: ${{ steps.image.outputs.image_id }}
          CIW_SERVICE_NETWORK: ${{ env.SERVICE_NETWORK }}
          CIW_SERVICE_ENV_FILE: ${{ env.SERVICE_ENV_FILE }}
          CIW_POSTGRES_URL: ${{ env.CIW_POSTGRES_URL }}
          CIW_POSTGRES_NETWORK_URL: ${{ env.CIW_POSTGRES_NETWORK_URL }}
        run: |
          set -Eeuo pipefail
          (
            cd source
            "./${PRODUCT_WRAPPER}"
          ) >> "${CI_LOG}" 2>&1
          test -f "${SERVICE_ENV_FILE}"
          test ! -L "${SERVICE_ENV_FILE}"
          test "$(wc -c < "${SERVICE_ENV_FILE}")" -le 65536
          chmod 0600 "${SERVICE_ENV_FILE}"

      - name: Start exact built service image
        id: service
        shell: bash
        env:
          SERVICE_IMAGE_ID: ${{ steps.image.outputs.image_id }}
          SERVICE_PORT: ${{ inputs.service_port }}
        run: |
          set -Eeuo pipefail
          docker run --detach \
            --name "${SERVICE_CONTAINER}" \
            --network "${SERVICE_NETWORK}" \
            --env-file "${SERVICE_ENV_FILE}" \
            --env "CIW_POSTGRES_URL=${CIW_POSTGRES_NETWORK_URL}" \
            --env "CIW_SERVICE_PORT=${SERVICE_PORT}" \
            --publish "127.0.0.1::${SERVICE_PORT}" \
            "${SERVICE_IMAGE_ID}" >/dev/null
          test "$(docker inspect --format '{{.Image}}' "${SERVICE_CONTAINER}")" = "${SERVICE_IMAGE_ID}"
          service_host_port="$(docker port "${SERVICE_CONTAINER}" "${SERVICE_PORT}/tcp" | sed -n 's/^127\.0\.0\.1:\([0-9][0-9]*\)$/\1/p')"
          [[ "${service_host_port}" =~ ^[0-9]+$ ]]
          printf 'CIW_SERVICE_URL=http://127.0.0.1:%s\n' "${service_host_port}" >> "${GITHUB_ENV}"
          printf 'Started exact built service image %s.\n' "${SERVICE_IMAGE_ID}" >> "${CI_LOG}"

      - name: Wait for fixed product readiness contract
        id: readiness
        shell: bash
        env:
          CIW_CONTAINER_CONFORMANCE_PHASE: ready
          CIW_SERVICE_IMAGE: ${{ steps.image.outputs.image_id }}
          CIW_SERVICE_NETWORK: ${{ env.SERVICE_NETWORK }}
          CIW_SERVICE_ENV_FILE: ${{ env.SERVICE_ENV_FILE }}
          CIW_SERVICE_URL: ${{ env.CIW_SERVICE_URL }}
          CIW_POSTGRES_URL: ${{ env.CIW_POSTGRES_URL }}
          CIW_POSTGRES_NETWORK_URL: ${{ env.CIW_POSTGRES_NETWORK_URL }}
        run: |
          set -Eeuo pipefail
          ready=false
          for _ in $(seq 1 60); do
            test "$(docker inspect --format '{{.State.Running}}' "${SERVICE_CONTAINER}")" = true || break
            if (
              cd source
              "./${PRODUCT_WRAPPER}"
            ) >> "${CI_LOG}" 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true || {
            echo "Product service did not satisfy the fixed readiness contract." >&2
            exit 1
          }

      - name: Run fixed external product conformance
        id: conformance
        shell: bash
        env:
          CIW_CONTAINER_CONFORMANCE_PHASE: conformance
          CIW_SERVICE_IMAGE: ${{ steps.image.outputs.image_id }}
          CIW_SERVICE_NETWORK: ${{ env.SERVICE_NETWORK }}
          CIW_SERVICE_ENV_FILE: ${{ env.SERVICE_ENV_FILE }}
          CIW_SERVICE_URL: ${{ env.CIW_SERVICE_URL }}
          CIW_POSTGRES_URL: ${{ env.CIW_POSTGRES_URL }}
          CIW_POSTGRES_NETWORK_URL: ${{ env.CIW_POSTGRES_NETWORK_URL }}
        run: |
          set -Eeuo pipefail
          (
            cd source
            "./${PRODUCT_WRAPPER}"
          ) >> "${CI_LOG}" 2>&1

      - name: Reverify exact source and image identity
        id: reverify
        shell: bash
        env:
          SERVICE_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          test "$(docker inspect --format '{{.Image}}' "${SERVICE_CONTAINER}")" = "${SERVICE_IMAGE_ID}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${SERVICE_IMAGE_ID}")" = "${SOURCE_SHA}"

      - name: Clean all ephemeral service state
        id: cleanup
        if: always()
        shell: bash
        env:
          SERVICE_IMAGE_ID: ${{ steps.image.outputs.image_id }}
          SERVICE_TAG: ${{ steps.image.outputs.service_tag }}
        run: |
          set -Eeuo pipefail
          log="${CI_LOG:-${RUNNER_TEMP}/central-container-service.log}"
          runtime_root="${RUNTIME_ROOT:-${RUNNER_TEMP}/container-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          touch "${log}"
          chmod 0600 "${log}"
          docker info >/dev/null 2>&1 || {
            printf 'Docker daemon unavailable during required cleanup.\n' >> "${log}"
            exit 1
          }
          docker rm -f "${SERVICE_CONTAINER:-ciw-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "${log}" 2>&1 || true
          docker rm -f "${POSTGRES_CONTAINER:-ciw-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "${log}" 2>&1 || true
          docker volume rm -f "${POSTGRES_VOLUME:-ciw-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "${log}" 2>&1 || true
          docker network rm "${SERVICE_NETWORK:-ciw-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "${log}" 2>&1 || true
          if test -n "${SERVICE_IMAGE_ID:-}"; then
            docker image rm --force "${SERVICE_IMAGE_ID}" >> "${log}" 2>&1 || true
          fi
          if test -n "${SERVICE_TAG:-}"; then
            docker image rm --force "${SERVICE_TAG}" >> "${log}" 2>&1 || true
          fi
          state_root="${runtime_root}/buildah"
          if test -d "${state_root}/graphroot" || test -d "${state_root}/runroot"; then
            buildah --root "${state_root}/graphroot" --runroot "${state_root}/runroot" --storage-driver vfs unmount --all >> "${log}" 2>&1 || true
            buildah --root "${state_root}/graphroot" --runroot "${state_root}/runroot" --storage-driver vfs rm --all >> "${log}" 2>&1 || true
            buildah --root "${state_root}/graphroot" --runroot "${state_root}/runroot" --storage-driver vfs rmi --all --force >> "${log}" 2>&1 || true
          fi
          rm -rf "${runtime_root}"

          service_container="${SERVICE_CONTAINER:-ciw-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          postgres_container="${POSTGRES_CONTAINER:-ciw-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          postgres_volume="${POSTGRES_VOLUME:-ciw-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          service_network="${SERVICE_NETWORK:-ciw-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          ! docker container inspect "${service_container}" >/dev/null 2>&1
          ! docker container inspect "${postgres_container}" >/dev/null 2>&1
          ! docker volume inspect "${postgres_volume}" >/dev/null 2>&1
          ! docker network inspect "${service_network}" >/dev/null 2>&1
          if test -n "${SERVICE_IMAGE_ID:-}"; then
            ! docker image inspect "${SERVICE_IMAGE_ID}" >/dev/null 2>&1
          fi
          test ! -e "${runtime_root}"
          printf 'Verified zero run-owned container, network, volume, image, build and private-file residue.\n' >> "${log}"

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: always()
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ.get("CI_LOG", Path(os.environ["RUNNER_TEMP"]) / "central-container-service.log"))
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload private conformance log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-container-service.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          mime_type: text/plain

      - name: Finish Agent State run
        id: agent_finish
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.source_identity.outcome == 'success' && steps.observe_source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.image.outcome == 'success' && steps.postgres.outcome == 'success' && steps.prepare.outcome == 'success' && steps.service.outcome == 'success' && steps.readiness.outcome == 'success' && steps.conformance.outcome == 'success' && steps.reverify.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
