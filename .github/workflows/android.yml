# LEGACY_MIGRATION_RESIDUE: Concrete consumer identity below is retained only for still-live compatibility; do not add new identity-coupled behavior, and remove it only after the private migration ledger proves zero callers.
name: Android CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      source_is_tag:
        type: boolean
        required: false
        default: false
      test_profile:
        type: string
        required: true
      test_selectors:
        type: string
        required: false
        default: "[]"
      release_version:
        type: string
        required: false
        default: ""
      build_number:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      CIW_MAVEN_PACKAGE_READ_TOKEN:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:
        required: false
      ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_PLAY_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_PLAY_UPLOAD_KEY_PASSWORD:
        required: false
      STREAMSCAPE_API_BASE:
        required: false
      STREAMSCAPE_EMAIL:
        required: false
      STREAMSCAPE_PASSWORD:
        required: false
      STREAMSCAPE_DEMO_EMAIL:
        required: false
      STREAMSCAPE_DEMO_PASSWORD:
        required: false
      XTREAM_URL:
        required: false
      XTREAM_USERNAME:
        required: false
      XTREAM_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  physical_performance:
    if: ${{ inputs.test_profile == 'physical-performance' }}
    runs-on: macos-latest-xl
    timeout-minutes: 300
    concurrency:
      group: central-android-physical-performance
      cancel-in-progress: false
    steps:
      - name: Initialize Android physical-performance evidence paths
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/central-android-physical-performance.log"
          evidence="$RUNNER_TEMP/central-android-physical-performance-evidence"
          rm -rf -- "$evidence" "$RUNNER_TEMP/central-owner-attached-physical"
          mkdir -p "$evidence"
          : > "$log"
          chmod 600 "$log"
          chmod 700 "$evidence"
          {
            printf 'CI_LOG=%s\n' "$log"
            printf 'PHYSICAL_EVIDENCE_DIR=%s\n' "$evidence"
          } >> "$GITHUB_ENV"

      - name: Check out Central physical-performance helpers
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/ci-workflows
          ref: main
          path: central-physical-performance
          persist-credentials: false

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate fixed owner-attached physical-performance request
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE_REPOSITORY" = StreamScapeTV/iptv-android || { echo "Android physical-performance is bounded to StreamScapeTV/iptv-android" >&2; exit 2; }
          test -n "$SOURCE_REF" || { echo "Android physical-performance requires an explicit product ref" >&2; exit 2; }
          test "$TEST_SELECTORS" = '[]' || { echo "Android physical-performance does not accept test_selectors" >&2; exit 2; }
          test -z "$RELEASE_VERSION" || { echo "Android physical-performance does not accept release_version" >&2; exit 2; }
          test -z "$BUILD_NUMBER" || { echo "Android physical-performance does not accept build_number" >&2; exit 2; }

      - name: Prepare Android physical-performance source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact Android physical-performance source
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ inputs.ref }}
          token: ${{ steps.source.outputs.token }}
          path: physical-performance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 25 for Android physical-performance
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Record Android physical-performance source identity
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C physical-performance-source rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git -C physical-performance-source status --porcelain --untracked-files=all)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Record Android physical-performance source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Run bounded owner-attached physical-performance device
        id: physical
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          python3 central-physical-performance/scripts/ci/android_physical_attached.py \
            --source-dir physical-performance-source \
            --source-sha "$SOURCE_SHA" \
            --evidence-dir "$PHYSICAL_EVIDENCE_DIR" \
            --private-log "$CI_LOG"

      - name: Scrub owner-attached physical-performance evidence
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - "$CI_LOG" "$PHYSICAL_EVIDENCE_DIR" <<'PY_ANDROID_PHYSICAL_REDACT'
          from pathlib import Path
          import os
          import sys

          log = Path(sys.argv[1])
          root = Path(sys.argv[2])
          paths = [log]
          if root.is_dir() and not root.is_symlink():
              paths.extend(sorted(path for path in root.iterdir() if path.is_file() and not path.is_symlink()))
          secrets = [value.encode() for name, value in os.environ.items() if name.startswith("CI_SECRET_") and value]
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Android physical-performance evidence must be regular non-symlink files")
              if path.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit("Android physical-performance evidence exceeds the pre-scrub bound")
              data = path.read_bytes()
              for raw in secrets:
                  data = data.replace(raw, b"[REDACTED]")
                  escaped = raw.replace(b"\n", b"\\n")
                  if escaped != raw:
                      data = data.replace(escaped, b"[REDACTED]")
              path.write_bytes(data)
          PY_ANDROID_PHYSICAL_REDACT

      - name: Package bounded Android physical-performance evidence
        id: evidence
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/central-android-physical-performance-evidence.zip"
          rm -f -- "$archive"
          python3 - "$PHYSICAL_EVIDENCE_DIR" "$archive" <<'PY_ANDROID_PHYSICAL_EVIDENCE'
          from pathlib import Path
          import sys
          import zipfile

          root = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("Android physical-performance evidence root is invalid")
          files = []
          total = 0
          for path in sorted(root.iterdir()):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Android physical-performance evidence contains an unsupported entry")
              size = path.stat().st_size
              if size > 4 * 1024 * 1024:
                  raise SystemExit("Android physical-performance evidence file exceeds 4 MiB")
              total += size
              files.append(path)
          if not 1 <= len(files) <= 8 or total > 16 * 1024 * 1024:
              raise SystemExit("Android physical-performance evidence set is outside the reviewed bound")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
              for path in files:
                  bundle.write(path, arcname=path.name)
          print(archive)
          PY_ANDROID_PHYSICAL_EVIDENCE
          test -f "$archive" && test ! -L "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Android physical-performance private log
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-android-physical-performance.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-android-physical-performance.txt
          mime_type: text/plain

      - name: Upload bounded Android physical-performance evidence
        id: evidence_drive
        if: ${{ always() && steps.evidence.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ inputs.ref }}
          file_path: ${{ steps.evidence.outputs.archive }}
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-android-physical-performance-evidence.zip
          mime_type: application/zip

      - name: Cleanup Android physical-performance state
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- \
            "$GITHUB_WORKSPACE/physical-performance-source" \
            "$GITHUB_WORKSPACE/central-physical-performance" \
            "$RUNNER_TEMP/central-owner-attached-physical" \
            "$RUNNER_TEMP/central-android-physical-performance-evidence" \
            "$RUNNER_TEMP/central-android-physical-performance-evidence.zip"

      - name: Classify Android physical-performance terminal diagnostic
        id: terminal
        if: ${{ always() }}
        shell: bash
        env:
          PHYSICAL_OUTCOME: ${{ steps.physical.outcome }}
          PHYSICAL_SUCCESS: ${{ steps.physical.outputs.success }}
          FAILURE_CODE: ${{ steps.physical.outputs.failure_code }}
          SCRUB_OUTCOME: ${{ steps.scrub.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
          EVIDENCE_DRIVE_OUTCOME: ${{ steps.evidence_drive.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          success=false
          error_summary=""
          if test "$PHYSICAL_OUTCOME" = success && test "$PHYSICAL_SUCCESS" = true \
            && test "$SCRUB_OUTCOME" = success && test "$EVIDENCE_OUTCOME" = success \
            && test "$DRIVE_OUTCOME" = success && test "$EVIDENCE_DRIVE_OUTCOME" = success \
            && test "$CLEANUP_OUTCOME" = success; then
            success=true
          else
            code="$FAILURE_CODE"
            test -n "$code" || code=central_post_processing_failed
            error_summary="Android owner-attached physical-performance failed closed: $code"
          fi
          diagnostic_key=""
          diagnostic_status="unavailable"
          if test "$DRIVE_OUTCOME" = success; then
            diagnostic_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-android-physical-performance.txt"
            diagnostic_status="available"
          fi
          {
            printf 'success=%s\n' "$success"
            printf 'error_summary=%s\n' "$error_summary"
            printf 'diagnostic_key=%s\n' "$diagnostic_key"
            printf 'diagnostic_status=%s\n' "$diagnostic_status"
          } >> "$GITHUB_OUTPUT"

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.terminal.outputs.success == 'true' && 'succeeded' || 'failed' }}
          error_summary: ${{ steps.terminal.outputs.error_summary }}
          diagnostic_key: ${{ steps.terminal.outputs.diagnostic_key }}
          diagnostic_status: ${{ steps.terminal.outputs.diagnostic_status }}

      - name: Require Android physical-performance acceptance
        if: ${{ always() }}
        shell: bash
        env:
          SUCCESS: ${{ steps.terminal.outputs.success }}
        run: |
          test "$SUCCESS" = true || {
            echo "Android owner-attached physical-performance did not complete on the attached real device; inspect the private diagnostic." >&2
            exit 1
          }

  ci:
    if: ${{ inputs.test_profile == 'play' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Connect to private Git service
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          permission-contents: read
          permission-metadata: read

      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.source_is_tag && format('refs/tags/{0}', inputs.ref) || inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed product source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Android source checkout did not resolve to one exact lowercase commit SHA" >&2
            exit 2
          }
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed product source SHA
        id: source_observe
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve IPTV Android default-branch cache scope
        id: android_default_cache_scope
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -Eeuo pipefail
          source_ref="${REQUESTED_REF}"
          if test -z "${source_ref}" && test "${CURRENT_REF_TYPE}" = branch; then
            source_ref="${CURRENT_REF_NAME}"
          fi
          source_ref="${source_ref#refs/heads/}"
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          default_branch=""
          enabled=false
          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android &&
            test -n "${SOURCE_TOKEN}"; then
            repository_json="$(curl --fail --silent --show-error --header "Authorization: Bearer ${SOURCE_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${SOURCE_REPOSITORY}" || true)"
            if test -n "${repository_json}"; then
              default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))' 2>/dev/null || true)"
            fi
            if test "${source_ref}" = "${default_branch}" &&
              test "${checkout_branch}" = "${default_branch}"; then
              enabled=true
            fi
          fi
          source_sha="$(git rev-parse HEAD)"
          dependency_fingerprint=""
          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android; then
            dependency_fingerprint="$(python3 - <<'PY_ANDROID_DEPENDENCY_FINGERPRINT'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path(".")
          records: list[str] = []

          def add_file(path: Path) -> None:
              if path.is_file():
                  records.append(f"FILE {path.as_posix()}\n{path.read_text(encoding='utf-8')}\n")

          def add_dependency_blocks(path: Path) -> None:
              if not path.is_file():
                  return
              lines = path.read_text(encoding="utf-8").splitlines()
              block_name = ""
              depth = 0
              captured: list[str] = []
              for line in lines:
                  if not block_name:
                      match = re.match(r"^\s*(plugins|dependencies)\s*\{", line)
                      if match:
                          block_name = match.group(1)
                          depth = line.count("{") - line.count("}")
                          captured = [line.strip()]
                          if depth <= 0:
                              records.append(f"BLOCK {path.as_posix()}:{block_name}\n" + "\n".join(captured) + "\n")
                              block_name = ""
                              captured = []
                      continue
                  stripped = line.strip()
                  if stripped and not stripped.startswith("//"):
                      captured.append(" ".join(stripped.split()))
                  depth += line.count("{") - line.count("}")
                  if depth <= 0:
                      records.append(f"BLOCK {path.as_posix()}:{block_name}\n" + "\n".join(captured) + "\n")
                      block_name = ""
                      captured = []

          add_file(root / "gradle" / "wrapper" / "gradle-wrapper.properties")
          for path in sorted((root / "gradle").glob("**/*.toml")):
              add_file(path)
          for path in sorted(root.glob("settings.gradle*")):
              if path.is_file():
                  settings = "\n".join(
                      line for line in path.read_text(encoding="utf-8").splitlines()
                      if not re.match(r"^\s*rootProject\.name\s*=", line)
                  )
                  records.append(f"SETTINGS {path.as_posix()}\n{settings}\n")
          for path in sorted(root.glob("**/build.gradle*")):
              add_dependency_blocks(path)

          if not records:
              raise SystemExit("Android dependency fingerprint has no inputs")
          digest = hashlib.sha256("\n".join(records).encode("utf-8")).hexdigest()
          print(digest)
          PY_ANDROID_DEPENDENCY_FINGERPRINT
            )"
          fi
          printf 'enabled=%s\n' "${enabled}" >> "${GITHUB_OUTPUT}"
          printf 'default_branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'dependency_fingerprint=%s\n' "${dependency_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore IPTV Android default-branch dependency cache
        id: gradle_dependency_cache
        if: ${{ steps.android_default_cache_scope.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: >-
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_default_cache_scope.outputs.dependency_fingerprint }}

      - name: Resolve IPTV Android non-default cache reader scope
        id: android_branch_cache_scope
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ steps.android_default_cache_scope.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          source_ref="${REQUESTED_REF}"
          normalized_ref="${source_ref#refs/heads/}"
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          enabled=false

          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android &&
            test -n "${DEFAULT_BRANCH}"; then
            if [[ "${source_ref}" == refs/pull/* ]]; then
              enabled=true
            elif test -n "${checkout_branch}" &&
              test "${checkout_branch}" != "${DEFAULT_BRANCH}" &&
              test "${normalized_ref}" != "${DEFAULT_BRANCH}"; then
              enabled=true
            fi
          fi

          printf 'enabled=%s\n' "${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Restore IPTV Android non-default dependency cache
        id: gradle_branch_dependency_cache
        if: ${{ steps.android_branch_cache_scope.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: >-
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_default_cache_scope.outputs.dependency_fingerprint }}
          restore-keys: |
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare fixed Google Play draft release context
        id: play_prepare
        if: ${{ inputs.test_profile == 'play' }}
        shell: bash
        env:
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "Google Play build_number must be a positive decimal Android versionCode" >&2
            exit 2
          }
          (( BUILD_NUMBER <= 2100000000 )) || {
            echo "Google Play build_number exceeds the maximum Android versionCode 2100000000" >&2
            exit 2
          }
          case "${SOURCE_IS_TAG}" in
            true)
              [[ "${RELEASE_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || {
                echo "Tag-driven Google Play release requires a bounded dotted release_version" >&2
                exit 2
              }
              (( BUILD_NUMBER < 2100000000 )) || {
                echo "Tag-driven Google Play release must leave room for the next Android versionCode" >&2
                exit 2
              }
              ;;
            false)
              test -z "${RELEASE_VERSION}" || {
                echo "Manual Google Play release does not accept release_version" >&2
                exit 2
              }
              ;;
            *) echo "Google Play source_is_tag must be true or false" >&2; exit 2 ;;
          esac
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}" || {
            echo "Google Play release credential is unavailable" >&2
            exit 2
          }
          for name in ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD ANDROID_PLAY_UPLOAD_KEY_ALIAS ANDROID_PLAY_UPLOAD_KEY_PASSWORD; do
            test -n "${!name}" || {
              printf 'Google Play release signing secret is unavailable: %s\n' "${name}" >&2
              exit 2
            }
          done
          release_root="${RUNNER_TEMP}/central-android-play"
          credential_path="${release_root}/service-account.json"
          keystore_path="${release_root}/upload-key.jks"
          rm -rf -- "${release_root}"
          mkdir -p "${release_root}"
          chmod 700 "${release_root}"
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}" | base64 --decode > "${credential_path}"
          printf '%s' "${ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${credential_path}" "${keystore_path}"
          test -s "${keystore_path}"
          python3 - "${credential_path}" <<'PY_PLAY_JSON'
          from pathlib import Path
          import json, sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("type") != "service_account":
              raise SystemExit("Google Play credential must be a service-account JSON key")
          for field in ("client_email", "private_key", "token_uri"):
              if not isinstance(value.get(field), str) or not value[field]:
                  raise SystemExit(f"Google Play service-account JSON is missing {field}")
          PY_PLAY_JSON
          test "$(stat -c '%a' "${credential_path}")" = 600
          test "$(stat -c '%a' "${keystore_path}")" = 600
          keytool -list -keystore "${keystore_path}" -storepass "${ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD}" -alias "${ANDROID_PLAY_UPLOAD_KEY_ALIAS}" >/dev/null
          {
            printf 'CI_ANDROID_PLAY_SOURCE_IS_TAG=%s\n' "${SOURCE_IS_TAG}"
            printf 'CI_ANDROID_PLAY_RELEASE_VERSION=%s\n' "${RELEASE_VERSION}"
            printf 'CI_ANDROID_PLAY_BUILD_NUMBER=%s\n' "${BUILD_NUMBER}"
            printf 'CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH=%s\n' "${credential_path}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH=%s\n' "${keystore_path}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD=%s\n' "${ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS=%s\n' "${ANDROID_PLAY_UPLOAD_KEY_ALIAS}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD=%s\n' "${ANDROID_PLAY_UPLOAD_KEY_PASSWORD}"
            printf 'CI_ANDROID_PLAY_TRACK=internal\n'
            printf 'CI_ANDROID_PLAY_RELEASE_STATUS=draft\n'
          } >> "${GITHUB_ENV}"

      - name: Preflight tag-driven Android post-publication bump
        id: mobile_bump_contract
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag }}
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token || github.token }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_REPOSITORY}" =~ ^StreamScapeTV/[A-Za-z0-9_.-]{1,100}$ ]] || {
            echo "Tag-driven Android release requires one bounded StreamScapeTV repository" >&2
            exit 2
          }
          wrapper="scripts/ci/advance-mobile-build.sh"
          test -f "${wrapper}" && test ! -L "${wrapper}" || {
            echo "Tag-driven Android release requires the regular product-owned mobile build bump wrapper" >&2
            exit 2
          }
          git ls-files --error-unmatch -- "${wrapper}" >/dev/null 2>&1 || {
            echo "Mobile build bump wrapper must be tracked product source" >&2
            exit 2
          }
          test -n "${SOURCE_TOKEN}" || {
            echo "Tag-driven Android release requires the fixed source token before publication" >&2
            exit 2
          }
          repository_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}")"
          default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))')"
          test -n "${default_branch}" && git check-ref-format --branch "${default_branch}" >/dev/null || {
            echo "Tag-driven Android release could not resolve the product default development branch" >&2
            exit 2
          }
          printf 'repository_name=%s\n' "${SOURCE_REPOSITORY#StreamScapeTV/}" >> "${GITHUB_OUTPUT}"
          printf 'default_branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"

      - name: Run fixed Android profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_ANDROID_PLAY_SOURCE_IS_TAG: ${{ env.CI_ANDROID_PLAY_SOURCE_IS_TAG }}
          CI_ANDROID_PLAY_RELEASE_VERSION: ${{ env.CI_ANDROID_PLAY_RELEASE_VERSION }}
          CI_ANDROID_PLAY_BUILD_NUMBER: ${{ env.CI_ANDROID_PLAY_BUILD_NUMBER }}
          CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH: ${{ env.CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH }}
          CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH }}
          CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS }}
          CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD }}
          CI_ANDROID_PLAY_TRACK: ${{ env.CI_ANDROID_PLAY_TRACK }}
          CI_ANDROID_PLAY_RELEASE_STATUS: ${{ env.CI_ANDROID_PLAY_RELEASE_STATUS }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "${label}" >> "${CI_LOG}"
            if ! "$@" >> "${CI_LOG}" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "${label}" >&2
              return 1
            fi
          }

          test "${TEST_PROFILE}" = play || { echo "Android release workflow supports only play" >&2; exit 2; }
          wrapper="${PWD}/scripts/ci/run-android-play-release.sh"
          test -f "${wrapper}" || { printf 'Missing fixed Android Play release wrapper: %s\n' "${wrapper}" >&2; exit 2; }
          git ls-files --error-unmatch -- "${wrapper#${PWD}/}" >/dev/null 2>&1 || { printf 'Android Play release wrapper must be tracked source: %s\n' "${wrapper}" >&2; exit 2; }
          case "${CI_ANDROID_PLAY_SOURCE_IS_TAG:-}" in true|false) ;; *) echo "Android Play source identity mode is unavailable" >&2; exit 2 ;; esac
          if test "${CI_ANDROID_PLAY_SOURCE_IS_TAG}" = true; then test -n "${CI_ANDROID_PLAY_RELEASE_VERSION:-}"; else test -z "${CI_ANDROID_PLAY_RELEASE_VERSION:-}"; fi
          test -n "${CI_ANDROID_PLAY_BUILD_NUMBER:-}"
          test -n "${CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH:-}" && test -f "${CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH}"
          test -f "${CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH}"
          test -n "${CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD:-}"
          test -n "${CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS:-}"
          test -n "${CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD:-}"
          test "${CI_ANDROID_PLAY_TRACK:-}" = internal
          test "${CI_ANDROID_PLAY_RELEASE_STATUS:-}" = draft
          run_logged android-play-draft bash "${wrapper}"

      - name: Clean Google Play credential and release state
        id: play_cleanup
        if: ${{ always() && inputs.test_profile == 'play' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/central-android-play"
          rm -rf -- "${release_root}"
          test ! -e "${release_root}"

      - name: Check out Android development branch for isolated bump staging
        id: mobile_bump_stage_checkout
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.commands.outcome == 'success' && steps.play_cleanup.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          path: central-mobile-build-bump-stage-source
          persist-credentials: false

      - name: Prepare Git-metadata-free Android build bump staging
        id: mobile_bump_stage
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.mobile_bump_stage_checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_checkout="${GITHUB_WORKSPACE}/central-mobile-build-bump-stage-source"
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          expected_head="$(git -C "${source_checkout}" rev-parse HEAD)"
          [[ "${expected_head}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git -C "${source_checkout}" status --porcelain --untracked-files=all)" || {
            echo "Android development branch staging checkout is not clean" >&2
            exit 1
          }
          rm -rf -- "${staging}"
          mkdir -p "${staging}"
          tar -C "${source_checkout}" --exclude='./.git' -cf - . | tar -C "${staging}" -xf -
          test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Android mobile build staging copy unexpectedly contains Git metadata" >&2
            exit 1
          }
          printf 'expected_head=%s\n' "${expected_head}" >> "${GITHUB_OUTPUT}"
          rm -rf -- "${source_checkout}"
          test ! -e "${source_checkout}"

      - name: Run product-owned Android build bump in isolated staging tree
        id: mobile_bump_product
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.mobile_bump_stage.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -Eeuo pipefail
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          wrapper="${GITHUB_WORKSPACE}/scripts/ci/advance-mobile-build.sh"
          test -d "${staging}" && test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Android product build bump staging tree must remain Git-metadata-free" >&2
            exit 1
          }
          export CI_MOBILE_RELEASE_VERSION="${RELEASE_VERSION}"
          export CI_MOBILE_RELEASE_BUILD_NUMBER="${RELEASE_BUILD_NUMBER}"
          export CI_MOBILE_BUMP_WORKTREE="${staging}"
          printf '\n===== android-mobile-build-bump-product =====\n' >> "${CI_LOG}"
          if ! env -u TARGET_TOKEN -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE bash "${wrapper}" >> "${CI_LOG}" 2>&1; then
            echo "Google Play publication succeeded, but the isolated next development build-number mutation failed; rerun the same tag to repair without republishing" >&2
            exit 1
          fi
          test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Android mobile build bump wrapper must not create Git metadata; Central owns repository transport" >&2
            exit 1
          }

      - name: Check out current Android development branch for post-publication bump
        id: mobile_bump_checkout
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.mobile_bump_product.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          path: central-mobile-build-bump
          persist-credentials: false

      - name: Validate Android staged build bump output
        id: mobile_bump_validate
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.mobile_bump_checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.mobile_bump_stage.outputs.expected_head }}
        run: |
          set -Eeuo pipefail
          target="${GITHUB_WORKSPACE}/central-mobile-build-bump"
          staging="${RUNNER_TEMP}/central-mobile-build-bump-stage"
          baseline="${RUNNER_TEMP}/central-mobile-build-bump-baseline"
          diff_file="${RUNNER_TEMP}/central-mobile-build-bump.diff"
          test "$(git -C "${target}" rev-parse HEAD)" = "${EXPECTED_HEAD}" || {
            echo "Android development branch moved while the isolated bump wrapper ran; rerun the same tag to repair without republishing" >&2
            exit 1
          }
          test -z "$(git -C "${target}" status --porcelain --untracked-files=all)" || {
            echo "Post-publication Android build bump validation checkout is not clean" >&2
            exit 1
          }
          test -d "${staging}" && test -z "$(find "${staging}" -name .git -print -quit)" || {
            echo "Android staged build bump output contains forbidden Git metadata" >&2
            exit 1
          }
          rm -rf -- "${baseline}"
          mkdir -p "${baseline}"
          tar -C "${target}" --exclude='./.git' -cf - . | tar -C "${baseline}" -xf -
          set +e
          git diff --no-index --no-renames --name-status -- "${baseline}" "${staging}" > "${diff_file}"
          diff_status=$?
          set -e
          test "${diff_status}" -le 1 || {
            echo "Android staged build bump comparison failed" >&2
            exit 1
          }
          if test "${diff_status}" = 0; then
            printf 'changed=false\ncanonical_path=\n' >> "${GITHUB_OUTPUT}"
            printf 'Android mobile build already advanced after the accepted release; no source mutation is required.\n' >> "${CI_LOG}"
            exit 0
          fi
          test "$(wc -l < "${diff_file}" | tr -d '[:space:]')" = 1 || {
            echo "Android mobile build bump changed more than one tracked product file" >&2
            exit 1
          }
          diff_line="$(cat "${diff_file}")"
          diff_kind="${diff_line%%$'\t'*}"
          candidate="${diff_line#*$'\t'}"
          test "${diff_kind}" = M || {
            echo "Android mobile build bump must modify exactly one existing product file" >&2
            exit 1
          }
          case "${candidate}" in
            "${baseline}"/*) canonical_path="${candidate#${baseline}/}" ;;
            *) echo "Android mobile build bump comparison returned an unexpected path" >&2; exit 1 ;;
          esac
          [[ "${canonical_path}" =~ ^[A-Za-z0-9._/-]{1,240}$ ]] || {
            echo "Android mobile build bump target path is not bounded" >&2
            exit 1
          }
          case "/${canonical_path}/" in
            */../*|*/./*) echo "Android mobile build bump target path is not canonical" >&2; exit 1 ;;
          esac
          test -f "${staging}/${canonical_path}" && test ! -L "${staging}/${canonical_path}" || {
            echo "Android staged mobile build bump target is not one regular file" >&2
            exit 1
          }
          test -f "${target}/${canonical_path}" && test ! -L "${target}/${canonical_path}" || {
            echo "Android mobile build bump target is not one regular tracked file" >&2
            exit 1
          }
          git -C "${target}" ls-files --error-unmatch -- "${canonical_path}" >/dev/null 2>&1 || {
            echo "Android mobile build bump target must already be tracked" >&2
            exit 1
          }
          cp -- "${staging}/${canonical_path}" "${target}/${canonical_path}"
          git -C "${target}" diff --check -- "${canonical_path}"
          test -z "$(git -C "${target}" diff --cached --name-only)"
          test -z "$(git -C "${target}" ls-files --others --exclude-standard)"
          changed_paths="$(git -C "${target}" diff --name-only)"
          test "${changed_paths}" = "${canonical_path}" || {
            echo "Android mobile build bump import did not produce exactly one trusted tracked-file delta" >&2
            exit 1
          }
          printf 'changed=true\ncanonical_path=%s\n' "${canonical_path}" >> "${GITHUB_OUTPUT}"

      - name: Create post-publication Android build bump token
        id: mobile_bump_token
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.commands.outcome == 'success' && steps.play_cleanup.outcome == 'success' && steps.mobile_bump_validate.outcome == 'success' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV
          repositories: ${{ steps.mobile_bump_contract.outputs.repository_name }}
          permission-contents: write
          permission-metadata: read

      - name: Advance and publish next Android build number
        id: mobile_bump
        if: ${{ inputs.test_profile == 'play' && inputs.source_is_tag && steps.mobile_bump_token.outcome == 'success' }}
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.mobile_bump_token.outputs.token }}
          TARGET_BRANCH: ${{ steps.mobile_bump_contract.outputs.default_branch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_HEAD: ${{ steps.mobile_bump_stage.outputs.expected_head }}
          CHANGED: ${{ steps.mobile_bump_validate.outputs.changed }}
          CANONICAL_PATH: ${{ steps.mobile_bump_validate.outputs.canonical_path }}
        run: |
          set -Eeuo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          CI_MOBILE_RELEASE_VERSION="${RELEASE_VERSION}"
          CI_MOBILE_RELEASE_BUILD_NUMBER="${RELEASE_BUILD_NUMBER}"
          CI_MOBILE_BUMP_WORKTREE="${GITHUB_WORKSPACE}/central-mobile-build-bump"
          target="${CI_MOBILE_BUMP_WORKTREE}"
          expected_head="${EXPECTED_HEAD}"
          if test "${CHANGED}" != true; then
            printf 'Android mobile build already advanced after the accepted release; no source mutation is required.\n' >> "${CI_LOG}"
            exit 0
          fi
          canonical_path="${CANONICAL_PATH}"
          test "$(printf '%s\n' "${canonical_path}" | wc -l | tr -d '[:space:]')" = 1 || {
            echo "Android mobile build bump changed more than one tracked product file" >&2
            exit 1
          }
          test "$(git -C "${target}" rev-parse HEAD)" = "${expected_head}" || {
            echo "Android validated build bump checkout moved before Central transport" >&2
            exit 1
          }
          test "$(git -C "${target}" diff --name-only)" = "${canonical_path}"
          test -z "$(git -C "${target}" diff --cached --name-only)"
          test -z "$(git -C "${target}" ls-files --others --exclude-standard)"
          test -f "${target}/${canonical_path}" && test ! -L "${target}/${canonical_path}"
          git -C "${target}" ls-files --error-unmatch -- "${canonical_path}" >/dev/null 2>&1
          git -C "${target}" diff --check -- "${canonical_path}"
          git -C "${target}" add -- "${canonical_path}"
          test "$(git -C "${target}" diff --cached --name-only)" = "${canonical_path}"
          test -z "$(git -C "${target}" diff --name-only)"
          next_build="$((RELEASE_BUILD_NUMBER + 1))"
          auth="$(printf 'x-access-token:%s' "${TARGET_TOKEN}" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth}"
          remote_head="$(git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${expected_head}" || {
            echo "Android development branch moved after Google Play accepted the release; rerun the same tag to repair the bump without republishing" >&2
            exit 1
          }
          git -C "${target}" -c core.hooksPath=/dev/null -c user.name='StreamScapeTV CI' -c user.email='ci@streamscape.invalid' \
            commit --no-verify --no-gpg-sign -m "chore: advance mobile build to ${next_build}"
          commit_sha="$(git -C "${target}" rev-parse HEAD)"
          test "$(git -C "${target}" rev-parse HEAD^)" = "${expected_head}"
          git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --porcelain origin "${commit_sha}:refs/heads/${TARGET_BRANCH}"
          confirmed="$(git -C "${target}" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --refs origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${confirmed}" = "${commit_sha}" || {
            echo "Android next-build push could not be read back exactly" >&2
            exit 1
          }

      - name: Clean post-publication Android build bump workspace
        id: mobile_bump_cleanup
        if: ${{ always() && inputs.test_profile == 'play' && inputs.source_is_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- \
            "${GITHUB_WORKSPACE}/central-mobile-build-bump-stage-source" \
            "${GITHUB_WORKSPACE}/central-mobile-build-bump" \
            "${RUNNER_TEMP}/central-mobile-build-bump-stage" \
            "${RUNNER_TEMP}/central-mobile-build-bump-baseline"
          rm -f -- "${RUNNER_TEMP}/central-mobile-build-bump.diff"

      - name: Record IPTV Android cache measurements
        id: android_cache_measurements
        if: >-
          ${{
            steps.android_default_cache_scope.outputs.enabled == 'true'
            || steps.android_branch_cache_scope.outputs.enabled == 'true'
          }}
        shell: bash
        env:
          DEVELOP_DEPENDENCY_HIT: ${{ steps.gradle_dependency_cache.outputs.cache-hit }}
          BRANCH_DEPENDENCY_HIT: ${{ steps.gradle_branch_dependency_cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          measure_bytes() {
            local label="$1"
            local path="$2"
            local bytes=0
            if test -e "${path}"; then
              bytes="$(du -sb "${path}" | awk '{print $1}')"
            fi
            printf '%s_bytes=%s\n' "${label}" "${bytes}" >> "${CI_LOG}"
          }

          {
            printf '\n===== android-cache =====\n'
            printf 'source_sha=%s\n' "${{ steps.android_default_cache_scope.outputs.source_sha }}"
            printf 'default_writer=%s\n' "${{ steps.android_default_cache_scope.outputs.enabled }}"
            printf 'branch_reader=%s\n' "${{ steps.android_branch_cache_scope.outputs.enabled }}"
            printf 'default_dependency_hit=%s\n' "${DEVELOP_DEPENDENCY_HIT}"
            printf 'branch_dependency_hit=%s\n' "${BRANCH_DEPENDENCY_HIT}"
          } >> "${CI_LOG}"
          measure_bytes gradle_wrapper "${HOME}/.gradle/wrapper"
          measure_bytes gradle_modules "${HOME}/.gradle/caches/modules-2"

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_MOBILE_BUMP_TOKEN: ${{ steps.mobile_bump_token.outputs.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.test_profile == 'play' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEY_ALIAS || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEY_PASSWORD || '' }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Classify public-safe Android product failure
        id: product_failure
        if: ${{ always() && inputs.ci_run_id != '' && steps.scrub.outcome == 'success' && (steps.commands.outcome == 'failure' || steps.commands.outcome == 'cancelled' || steps.commands.outcome == 'skipped') }}
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          COMMANDS_OUTCOME: ${{ steps.commands.outcome }}
        run: |
          set -Eeuo pipefail
          classification=product_validation_failure
          remediation="Google Play product-owned release validation failed; inspect the bounded private diagnostic and repair the release wrapper/input contract before retry."
          if test "${COMMANDS_OUTCOME}" = cancelled || test "${COMMANDS_OUTCOME}" = skipped; then
            classification=infrastructure_failure
            remediation="Google Play product execution did not complete; retry after the Central prerequisite or cancellation cause is resolved."
          fi
          summary="Android ${TEST_PROFILE} failure [${classification%_failure}]: ${remediation}"
          test "${#summary}" -le 480
          {
            printf 'failure_class=%s\n' "${classification}"
            printf 'error_summary=%s\n' "${summary}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          mime_type: text/plain

      - name: Classify Android terminal diagnostic
        id: terminal_diagnostic
        if: ${{ always() && inputs.ci_run_id != '' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_IS_TAG: ${{ inputs.source_is_tag }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          SOURCE_OBSERVE_OUTCOME: ${{ steps.source_observe.outcome }}
          COMMANDS_OUTCOME: ${{ steps.commands.outcome }}
          PRODUCT_FAILURE_OUTCOME: ${{ steps.product_failure.outcome }}
          PRODUCT_FAILURE_CLASS: ${{ steps.product_failure.outputs.failure_class }}
          PRODUCT_ERROR_SUMMARY: ${{ steps.product_failure.outputs.error_summary }}
          MOBILE_BUMP_CONTRACT_OUTCOME: ${{ steps.mobile_bump_contract.outcome }}
          MOBILE_BUMP_STAGE_CHECKOUT_OUTCOME: ${{ steps.mobile_bump_stage_checkout.outcome }}
          MOBILE_BUMP_STAGE_OUTCOME: ${{ steps.mobile_bump_stage.outcome }}
          MOBILE_BUMP_PRODUCT_OUTCOME: ${{ steps.mobile_bump_product.outcome }}
          MOBILE_BUMP_CHECKOUT_OUTCOME: ${{ steps.mobile_bump_checkout.outcome }}
          MOBILE_BUMP_VALIDATE_OUTCOME: ${{ steps.mobile_bump_validate.outcome }}
          MOBILE_BUMP_TOKEN_OUTCOME: ${{ steps.mobile_bump_token.outcome }}
          MOBILE_BUMP_OUTCOME: ${{ steps.mobile_bump.outcome }}
          MOBILE_BUMP_CLEANUP_OUTCOME: ${{ steps.mobile_bump_cleanup.outcome }}
          PLAY_CLEANUP_OUTCOME: ${{ steps.play_cleanup.outcome }}
          SCRUB_OUTCOME: ${{ steps.scrub.outcome }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
          CACHE_MEASUREMENTS_OUTCOME: ${{ steps.android_cache_measurements.outcome }}
        run: |
          set -Eeuo pipefail
          success=false
          mobile_release_ok=true
          if test "${TEST_PROFILE}" = play && test "${SOURCE_IS_TAG}" = true; then
            mobile_release_ok=false
            if test "${MOBILE_BUMP_CONTRACT_OUTCOME}" = success \
              && test "${PLAY_CLEANUP_OUTCOME}" = success \
              && test "${MOBILE_BUMP_STAGE_CHECKOUT_OUTCOME}" = success \
              && test "${MOBILE_BUMP_STAGE_OUTCOME}" = success \
              && test "${MOBILE_BUMP_PRODUCT_OUTCOME}" = success \
              && test "${MOBILE_BUMP_CHECKOUT_OUTCOME}" = success \
              && test "${MOBILE_BUMP_VALIDATE_OUTCOME}" = success \
              && test "${MOBILE_BUMP_TOKEN_OUTCOME}" = success \
              && test "${MOBILE_BUMP_OUTCOME}" = success \
              && test "${MOBILE_BUMP_CLEANUP_OUTCOME}" = success; then
              mobile_release_ok=true
            fi
          fi
          if test "${COMMANDS_OUTCOME}" = success \
            && test "${mobile_release_ok}" = true \
            && { test "${PLAY_CLEANUP_OUTCOME}" = success || test "${PLAY_CLEANUP_OUTCOME}" = skipped; } \
            && test "${SCRUB_OUTCOME}" = success \
            && test "${DRIVE_OUTCOME}" = success \
            && { test "${CACHE_MEASUREMENTS_OUTCOME}" = success || test "${CACHE_MEASUREMENTS_OUTCOME}" = skipped; }; then
            success=true
          fi

          error_summary=""
          if test "${success}" != true; then
            if test "${CHECKOUT_OUTCOME}" != success; then
              error_summary="Android source checkout failed before product source identity could be recorded."
            elif test "${SOURCE_IDENTITY_OUTCOME}" != success || test "${SOURCE_OBSERVE_OUTCOME}" != success; then
              error_summary="Android source checkout succeeded, but exact product source observation failed."
            elif test "${COMMANDS_OUTCOME}" = failure || test "${COMMANDS_OUTCOME}" = cancelled || test "${COMMANDS_OUTCOME}" = skipped; then
              if test "${PRODUCT_FAILURE_OUTCOME}" = success && test -n "${PRODUCT_FAILURE_CLASS}" && test -n "${PRODUCT_ERROR_SUMMARY}"; then
                error_summary="${PRODUCT_ERROR_SUMMARY}"
              elif test "${SCRUB_OUTCOME}" != success; then
                error_summary="Android ${TEST_PROFILE} failure [infrastructure]: product validation failed and safe diagnostic scrubbing also failed; repair Central evidence handling before product triage."
              elif test "${COMMANDS_OUTCOME}" = cancelled; then
                error_summary="Android ${TEST_PROFILE} failure [infrastructure]: product execution was cancelled before a reviewed public-safe failure signature could be emitted; retry unless intentionally superseded."
              else
                error_summary="Android ${TEST_PROFILE} failure [product_validation]: product validation failed after exact source observation, but no reviewed public-safe signature matched; route to the product owner with the diagnostic key."
              fi
            elif test "${TEST_PROFILE}" = play && test "${SOURCE_IS_TAG}" = true && test "${COMMANDS_OUTCOME}" = success && test "${mobile_release_ok}" != true; then
              error_summary="Google Play publication succeeded, but the development build-number advance is incomplete. Rerun the same tag after correcting the bump failure; the product wrapper must reconcile the already-accepted version/build without republishing it."
            elif test "${SCRUB_OUTCOME}" != success; then
              error_summary="Android validation reached terminal evidence handling, but private log scrubbing failed."
            elif test "${DRIVE_OUTCOME}" != success; then
              error_summary="Android validation failed or completed, but private CI log upload did not succeed."
            else
              error_summary="Android ${TEST_PROFILE} validation failed during bounded Central post-processing; see the private CI log diagnostic when available."
            fi
          fi

          diagnostic_key=""
          diagnostic_status="unavailable"
          if test "${DRIVE_OUTCOME}" = success; then
            diagnostic_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            diagnostic_status="available"
          fi
          {
            printf 'success=%s\n' "${success}"
            printf 'error_summary=%s\n' "${error_summary}"
            printf 'diagnostic_key=%s\n' "${diagnostic_key}"
            printf 'diagnostic_status=%s\n' "${diagnostic_status}"
          } >> "${GITHUB_OUTPUT}"

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.terminal_diagnostic.outputs.success == 'true' && 'succeeded' || 'failed' }}
          error_summary: ${{ steps.terminal_diagnostic.outputs.error_summary }}
          diagnostic_key: ${{ steps.terminal_diagnostic.outputs.diagnostic_key }}
          diagnostic_status: ${{ steps.terminal_diagnostic.outputs.diagnostic_status }}
