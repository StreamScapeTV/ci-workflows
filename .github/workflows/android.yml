name: Android CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      test_profile:
        type: string
        required: true
      project_directory:
        type: string
        required: false
        default: "."
      test_filter:
        type: string
        required: false
        default: ""
      room_schema:
        type: boolean
        required: false
        default: false
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      CIW_MAVEN_PACKAGE_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Connect to private Git service
        if: ${{ inputs.test_profile != 'smoke' }}
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Run fixed Android profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          PROJECT_DIRECTORY: ${{ inputs.project_directory }}
          TEST_FILTER: ${{ inputs.test_filter }}
          ROOM_SCHEMA: ${{ inputs.room_schema }}
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "${PROJECT_DIRECTORY}" in
            .|android) ;;
            *) echo "Unsupported Android project_directory" >&2; exit 2 ;;
          esac

          repository_root="${PWD}"
          cd "${PROJECT_DIRECTORY}"
          test -x gradlew

          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "${label}" >> "${CI_LOG}"
            if ! "$@" >> "${CI_LOG}" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "${label}" >&2
              return 1
            fi
          }

          run_gradle() {
            local started="${SECONDS}"
            if ! run_logged "gradle-${TEST_PROFILE}" ./gradlew --no-daemon "$@"; then
              return 1
            fi
            local elapsed=$((SECONDS - started))
            {
              printf '\n===== gradle-wall-time =====\n'
              printf 'profile=%s\n' "${TEST_PROFILE}"
              printf 'seconds=%s\n' "${elapsed}"
            } >> "${CI_LOG}"
            printf 'Android %s Gradle wall time: %ss\n' "${TEST_PROFILE}" "${elapsed}"
          }

          policy_root="${repository_root}/scripts/ci"

          case "${TEST_PROFILE}" in
            smoke)
              run_gradle help
              ;;
            compile)
              run_gradle compileDebugKotlin compileDebugUnitTestKotlin
              ;;
            unit)
              run_gradle testDebugUnitTest
              ;;
            targeted-unit)
              [[ "${TEST_FILTER}" =~ ^[A-Za-z0-9_.$*?-]{1,240}$ ]] || {
                echo "targeted-unit requires a bounded test_filter" >&2
                exit 2
              }
              run_gradle testDebugUnitTest --tests "${TEST_FILTER}"
              ;;
            lint)
              run_gradle lintDebug
              ;;
            assemble)
              run_gradle assembleDebug
              ;;
            full)
              run_gradle compileDebugKotlin testDebugUnitTest lintDebug assembleDebug
              ;;
            release)
              run_release_policy=false
              if [[ -e "${policy_root}/verify-lint-policy.sh" ||
                    -e "${policy_root}/verify-gradle-property-policy.sh" ||
                    -e "${policy_root}/verify-release-policy.sh" ||
                    -e "${policy_root}/verify-release-size.py" ]]; then
                test "${PROJECT_DIRECTORY}" = "." || {
                  echo "Release policy convention is supported only at the repository root" >&2
                  exit 2
                }
                test -x "${policy_root}/verify-lint-policy.sh"
                test -x "${policy_root}/verify-gradle-property-policy.sh"
                test -x "${policy_root}/verify-release-policy.sh"
                test -f "${policy_root}/verify-release-size.py"
                test -f "${policy_root}/release-size-budgets.json"
                test -f "${policy_root}/release-size-baseline.json"
                run_release_policy=true
              fi

              if [[ "${run_release_policy}" == true ]]; then
                run_logged release-lint-policy bash "${policy_root}/verify-lint-policy.sh"
                run_logged release-gradle-property-policy bash "${policy_root}/verify-gradle-property-policy.sh"
              fi

              run_gradle testDebugUnitTest lintDebug assembleRelease bundleRelease lintRelease

              if [[ "${run_release_policy}" == true ]]; then
                run_logged release-policy bash "${policy_root}/verify-release-policy.sh"

                mapfile -t apk_files < <(
                  find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort
                )
                mapfile -t aab_files < <(
                  find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print | sort
                )
                test "${#apk_files[@]}" -eq 1 || {
                  echo "Expected exactly one release APK for size validation" >&2
                  exit 1
                }
                test "${#aab_files[@]}" -eq 1 || {
                  echo "Expected exactly one release AAB for size validation" >&2
                  exit 1
                }

                run_logged release-size python3 "${policy_root}/verify-release-size.py" \
                  --apk "${apk_files[0]}" \
                  --aab "${aab_files[0]}" \
                  --budget "${policy_root}/release-size-budgets.json" \
                  --baseline "${policy_root}/release-size-baseline.json" \
                  --output app/build/reports/release-size-metrics.json
              fi
              ;;
            *)
              echo "Unsupported Android test_profile: ${TEST_PROFILE}" >&2
              exit 2
              ;;
          esac

          if [[ "${ROOM_SCHEMA}" == true ]]; then
            cd "${repository_root}"
            test "${PROJECT_DIRECTORY}" = "." || {
              echo "room_schema is supported only at the repository root" >&2
              exit 2
            }
            printf '\n===== room-schema =====\n' >> "${CI_LOG}"
            if ! python3 scripts/ci/validate-room-schemas.py \
              --repo-root . \
              --report build/reports/room-schema-json-integrity.json \
              >> "${CI_LOG}" 2>&1; then
              echo "Android room schema validation failed; inspect the private Google Drive CI log." >&2
              exit 1
            fi
          fi

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.log.gz
          gzip: 'true'
          mime_type: application/gzip

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
