name: Android CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      test_profile:
        type: string
        required: true
      project_directory:
        type: string
        required: false
        default: "."
      test_filter:
        type: string
        required: false
        default: ""
      test_selectors:
        type: string
        required: false
        default: "[]"
      test_platform:
        type: string
        required: false
        default: ""
      room_schema:
        type: boolean
        required: false
        default: false
      build_number:
        type: string
        required: false
        default: ""
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false
      CIW_MAVEN_PACKAGE_READ_TOKEN:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:
        required: false
      ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_PLAY_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_PLAY_UPLOAD_KEY_PASSWORD:
        required: false
      STREAMSCAPE_API_BASE:
        required: false
      STREAMSCAPE_EMAIL:
        required: false
      STREAMSCAPE_PASSWORD:
        required: false
      STREAMSCAPE_DEMO_EMAIL:
        required: false
      STREAMSCAPE_DEMO_PASSWORD:
        required: false
      XTREAM_URL:
        required: false
      XTREAM_USERNAME:
        required: false
      XTREAM_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  screenshot_plan:
    if: ${{ inputs.test_profile == 'screenshot-review' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source_identity.outputs.source_sha }}
      selectors_json: ${{ steps.screenshot_selectors.outputs.selectors_json }}
      selection_mode: ${{ steps.screenshot_selectors.outputs.selection_mode }}
    steps:
      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Validate fixed Android screenshot-review request
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          PROJECT_DIRECTORY: ${{ inputs.project_directory }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          TEST_PLATFORM: ${{ inputs.test_platform }}
          ROOM_SCHEMA: ${{ inputs.room_schema }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -Eeuo pipefail
          test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android || { echo "Android screenshot-review is bounded to StreamScapeTV/iptv-android" >&2; exit 2; }
          test -n "${SOURCE_REF}" || { echo "Android screenshot-review requires an explicit product branch ref" >&2; exit 2; }
          test "${PROJECT_DIRECTORY}" = . || { echo "Android screenshot-review does not accept project_directory" >&2; exit 2; }
          test -z "${TEST_FILTER}" || { echo "Android screenshot-review does not accept test_filter" >&2; exit 2; }
          test -z "${TEST_PLATFORM}" || { echo "Android screenshot-review does not accept test_platform" >&2; exit 2; }
          test "${ROOM_SCHEMA}" = false || { echo "Android screenshot-review does not accept room_schema" >&2; exit 2; }
          test -z "${BUILD_NUMBER}" || { echo "Android screenshot-review does not accept build_number" >&2; exit 2; }

      - name: Normalize bounded Android screenshot selectors
        id: screenshot_selectors
        shell: bash
        env:
          TEST_SELECTORS: ${{ inputs.test_selectors }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ANDROID_SCREENSHOT_SELECTORS'
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("TEST_SELECTORS", "[]")
          if len(raw) > 2048:
              raise SystemExit("Android screenshot-review test_selectors exceeds the bounded payload size")
          try:
              values = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit("Android screenshot-review test_selectors must be valid JSON") from exc
          if not isinstance(values, list) or len(values) > 20:
              raise SystemExit("Android screenshot-review accepts zero through 20 canonical screen ids")
          seen = set()
          for value in values:
              if (
                  not isinstance(value, str)
                  or re.fullmatch(r"[a-z0-9][a-z0-9.-]{0,127}", value) is None
                  or not value.startswith(("mobile.", "tv."))
              ):
                  raise SystemExit("Android screenshot-review selectors must be bounded mobile.* or tv.* canonical ids")
              if value in seen:
                  raise SystemExit(f"Android screenshot-review selector is duplicated: {value}")
              seen.add(value)
          normalized = json.dumps(values, separators=(",", ":"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"selectors_json={normalized}\n")
              stream.write(f"selection_mode={'default' if not values else 'explicit'}\n")
          PY_ANDROID_SCREENSHOT_SELECTORS

      - name: Prepare Android screenshot-review source token
        id: source_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Resolve Android screenshot-review source identity
        id: source_identity
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
          SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          set -Eeuo pipefail
          test -n "${SOURCE_TOKEN}" || { echo "Android screenshot-review source identity requires the fixed source token" >&2; exit 2; }
          case "${SOURCE_REF}" in
            refs/heads/*) source_ref="${SOURCE_REF#refs/heads/}" ;;
            refs/tags/*|refs/pull/*) echo "Android screenshot-review accepts a branch ref, not a tag or pull ref" >&2; exit 2 ;;
            *) source_ref="${SOURCE_REF}" ;;
          esac
          encoded_ref="$(SOURCE_REF_VALUE="${source_ref}" python3 - <<'PY_ANDROID_SCREENSHOT_REF'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['SOURCE_REF_VALUE'], safe=''))
          PY_ANDROID_SCREENSHOT_REF
          )"
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/StreamScapeTV/iptv-android/commits/${encoded_ref}")"
          source_sha="$(printf '%s' "${response}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Android screenshot-review source ref did not resolve to one exact lowercase commit SHA" >&2; exit 2; }
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record Android screenshot-review source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

  screenshot_cache:
    needs: screenshot_plan
    if: ${{ inputs.test_profile == 'screenshot-review' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      cache_sha256: ${{ steps.cache_identity.outputs.cache_sha256 }}
    steps:
      - name: Initialize Android screenshot-cache log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci-screenshot-cache.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Prepare Android screenshot-cache source token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact Android screenshot-cache source
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ needs.screenshot_plan.outputs.source_sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Android screenshot-cache source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.screenshot_plan.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXPECTED_SOURCE_SHA}" || { echo "Android screenshot-cache checkout moved from the plan-pinned source SHA" >&2; exit 1; }
          [[ "${observed}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "Android screenshot-cache requires a clean exact-source checkout" >&2; exit 1; }

      - name: Set up Java 25 for Android screenshot-cache bootstrap
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Probe fixed private Android screenshot cache
        id: cache_probe
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          operation: download
          destination_kind: repository-screenshot-cache
          allow_missing_download: true
          file_path: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
          file_name: xtream-screenshot-cache.zip
          mime_type: application/zip

      - name: Validate existing private Android screenshot cache
        id: cache_validation
        if: ${{ steps.cache_probe.outputs.file_found == 'true' }}
        shell: bash
        env:
          CACHE_PATH: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
          CACHE_SHA256: ${{ steps.cache_probe.outputs.file_sha256 }}
        run: |
          set -Eeuo pipefail
          helper=scripts/ci/android-screenshot-review/review.py
          test -f "${helper}" && test ! -L "${helper}" || { echo "Android screenshot cache validator is unavailable" >&2; exit 1; }
          git ls-files --error-unmatch "${helper}" >/dev/null 2>&1 || { echo "Android screenshot cache validator must be tracked source" >&2; exit 1; }
          rm -rf -- "${RUNNER_TEMP}/central-android-screenshot-cache/inspect"
          mkdir -p "${RUNNER_TEMP}/central-android-screenshot-cache/inspect"
          if python3 "${helper}" inspect-cache \
            --cache "${CACHE_PATH}" \
            --expected-sha "${CACHE_SHA256}" \
            --extract-dir "${RUNNER_TEMP}/central-android-screenshot-cache/inspect" \
            --meta-output "${RUNNER_TEMP}/central-android-screenshot-cache/cache-meta.json" >> "${CI_LOG}" 2>&1; then
            printf 'cache_usable=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'cache_usable=false\n' >> "${GITHUB_OUTPUT}"
            printf 'Existing private Android screenshot cache is incompatible; one bounded refresh will run.\n' >> "${CI_LOG}"
          fi

      - name: Prepare one-shot Android screenshot-cache emulator
        id: cache_emulator
        if: ${{ steps.cache_probe.outputs.file_found != 'true' || steps.cache_validation.outputs.cache_usable != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${sdk_root}" || { echo "Android SDK root is unavailable for screenshot-cache bootstrap" >&2; exit 1; }
          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          test -n "${sdkmanager}" || sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -n "${avdmanager}" || avdmanager="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          test -x "${sdkmanager}" && test -x "${avdmanager}" || { echo "Android screenshot-cache SDK tools are unavailable" >&2; exit 1; }
          image='system-images;android-36;google_apis;x86_64'
          avd_name='central-screenshot-cache-bootstrap'
          avd_home="${RUNNER_TEMP}/central-android-screenshot-cache-avd"
          avd_path="${avd_home}/${avd_name}.avd"
          "${sdkmanager}" --install platform-tools emulator "${image}" >> "${CI_LOG}" 2>&1
          adb="$(command -v adb || true)"; test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          emulator="$(command -v emulator || true)"; test -n "${emulator}" || emulator="${sdk_root}/emulator/emulator"
          test -x "${adb}" && test -x "${emulator}" || { echo "Android screenshot-cache emulator runtime is unavailable" >&2; exit 1; }
          printf '%s\n' "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          rm -rf -- "${avd_home}"
          mkdir -p "${avd_home}"
          export ANDROID_AVD_HOME="${avd_home}"
          printf 'ANDROID_AVD_HOME=%s\n' "${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          printf 'no\n' | "${avdmanager}" create avd --force --name "${avd_name}" --package "${image}" --device pixel -p "${avd_path}" >> "${CI_LOG}" 2>&1
          if test -e /dev/kvm && test ! -w /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          "${adb}" start-server >> "${CI_LOG}" 2>&1
          "${emulator}" -avd "${avd_name}" -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot-save -wipe-data -gpu swiftshader_indirect >> "${CI_LOG}" 2>&1 &
          emulator_pid=$!
          printf 'pid=%s\n' "${emulator_pid}" >> "${GITHUB_OUTPUT}"
          printf 'ANDROID_SERIAL=emulator-5554\n' >> "${GITHUB_ENV}"
          booted=false
          for _ in $(seq 1 180); do
            if "${adb}" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -qx 1; then booted=true; break; fi
            kill -0 "${emulator_pid}" 2>/dev/null || { echo "Android screenshot-cache emulator exited before boot" >&2; exit 1; }
            sleep 2
          done
          test "${booted}" = true || { echo "Android screenshot-cache emulator did not boot within the bounded timeout" >&2; exit 1; }

      - name: Bootstrap fixed private Android screenshot cache once
        id: cache_bootstrap
        if: ${{ steps.cache_probe.outputs.file_found != 'true' || steps.cache_validation.outputs.cache_usable != 'true' }}
        shell: bash
        env:
          STREAMSCAPE_API_BASE: ${{ secrets.STREAMSCAPE_API_BASE }}
          STREAMSCAPE_EMAIL: ${{ secrets.STREAMSCAPE_EMAIL }}
          STREAMSCAPE_PASSWORD: ${{ secrets.STREAMSCAPE_PASSWORD }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CACHE_PATH: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
        run: |
          set -Eeuo pipefail
          bootstrap=scripts/ci/android-screenshot-review/bootstrap-private-cache.sh
          test -f "${bootstrap}" || { echo "Missing fixed Android screenshot-cache bootstrap wrapper" >&2; exit 1; }
          test ! -L "${bootstrap}" || { echo "Android screenshot-cache bootstrap wrapper must not be a symlink" >&2; exit 1; }
          git ls-files --error-unmatch "${bootstrap}" >/dev/null 2>&1 || { echo "Android screenshot-cache bootstrap wrapper must be tracked source" >&2; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "Android screenshot-cache bootstrap requires a clean exact-source checkout" >&2; exit 1; }
          mkdir -p "$(dirname "${CACHE_PATH}")"
          printf '\n===== android-screenshot-cache-bootstrap =====\n' >> "${CI_LOG}"
          if ! bash "${bootstrap}" "${CACHE_PATH}" >> "${CI_LOG}" 2>&1; then
            echo "Android screenshot-cache product bootstrap failed; inspect the private Google Drive CI log." >&2
            exit 1
          fi
          test -s "${CACHE_PATH}" || { echo "Android screenshot-cache bootstrap produced no cache package" >&2; exit 1; }

      - name: Upload refreshed private Android screenshot cache
        id: cache_upload
        if: ${{ steps.cache_bootstrap.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          operation: upload
          destination_kind: repository-screenshot-cache
          file_path: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
          file_name: xtream-screenshot-cache.zip
          mime_type: application/zip

      - name: Resolve exact Android screenshot cache identity
        id: cache_identity
        shell: bash
        env:
          PROBE_FOUND: ${{ steps.cache_probe.outputs.file_found }}
          PROBE_USABLE: ${{ steps.cache_validation.outputs.cache_usable }}
          PROBE_SHA256: ${{ steps.cache_probe.outputs.file_sha256 }}
          UPLOAD_SHA256: ${{ steps.cache_upload.outputs.file_sha256 }}
        run: |
          set -Eeuo pipefail
          if test "${PROBE_FOUND}" = true && test "${PROBE_USABLE}" = true; then
            cache_sha256="${PROBE_SHA256}"
          else
            cache_sha256="${UPLOAD_SHA256}"
          fi
          [[ "${cache_sha256}" =~ ^[0-9a-f]{64}$ ]] || { echo "Android screenshot-cache preparation produced no exact SHA-256 identity" >&2; exit 1; }
          printf 'cache_sha256=%s\n' "${cache_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Stop Android screenshot-cache emulator
        if: ${{ always() }}
        shell: bash
        env:
          EMULATOR_PID: ${{ steps.cache_emulator.outputs.pid }}
        run: |
          set -Eeuo pipefail
          adb -s "${ANDROID_SERIAL:-emulator-5554}" emu kill >/dev/null 2>&1 || true
          if test -n "${EMULATOR_PID}" && kill -0 "${EMULATOR_PID}" 2>/dev/null; then
            kill "${EMULATOR_PID}" 2>/dev/null || true
            wait "${EMULATOR_PID}" 2>/dev/null || true
          fi

      - name: Scrub configured CI secrets from Android screenshot-cache log
        id: cache_scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_DRIVE_REPOSITORIES_FOLDER: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_STREAMSCAPE_API_BASE: ${{ secrets.STREAMSCAPE_API_BASE }}
          CI_SECRET_STREAMSCAPE_EMAIL: ${{ secrets.STREAMSCAPE_EMAIL }}
          CI_SECRET_STREAMSCAPE_PASSWORD: ${{ secrets.STREAMSCAPE_PASSWORD }}
          CI_SECRET_XTREAM_URL: ${{ secrets.XTREAM_URL }}
          CI_SECRET_XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          CI_SECRET_XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ANDROID_SCREENSHOT_CACHE_REDACT'
          import os
          from pathlib import Path
          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_ANDROID_SCREENSHOT_CACHE_REDACT

      - name: Upload Android screenshot-cache private log
        if: ${{ always() && steps.cache_scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-ci-screenshot-cache.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-screenshot-cache.txt
          mime_type: text/plain

      - name: Clean Android screenshot-cache state
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/central-android-screenshot-cache" "${RUNNER_TEMP}/central-android-screenshot-cache-avd"

  screenshot:
    needs:
      - screenshot_plan
      - screenshot_cache
    if: ${{ inputs.test_profile == 'screenshot-review' }}
    name: screenshot-${{ matrix.capture_profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - capture_profile: phone-portrait
            system_image: system-images;android-36;google_apis;x86_64
            avd_device: pixel
            width: 1080
            height: 2400
            density: 420
            rotation: 0
          - capture_profile: phone-landscape
            system_image: system-images;android-36;google_apis;x86_64
            avd_device: pixel
            width: 1080
            height: 2400
            density: 420
            rotation: 1
          - capture_profile: tablet-portrait
            system_image: system-images;android-36;google_apis;x86_64
            avd_device: pixel_c
            width: 1600
            height: 2560
            density: 320
            rotation: 0
          - capture_profile: tablet-landscape
            system_image: system-images;android-36;google_apis;x86_64
            avd_device: pixel_c
            width: 1600
            height: 2560
            density: 320
            rotation: 1
          - capture_profile: tv
            system_image: system-images;android-36;android-tv;x86_64
            avd_device: tv_1080p
            width: 1920
            height: 1080
            density: 320
            rotation: 0
    steps:
      - name: Initialize Android screenshot-review log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci-screenshot-${{ matrix.capture_profile }}.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Resolve Android screenshot selectors for capture profile
        id: screenshot_selection
        shell: bash
        env:
          NORMALIZED_SELECTORS: ${{ needs.screenshot_plan.outputs.selectors_json }}
          CAPTURE_PROFILE: ${{ matrix.capture_profile }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ANDROID_SCREENSHOT_PROFILE_SELECTORS'
          import json
          import os
          from pathlib import Path

          values = json.loads(os.environ["NORMALIZED_SELECTORS"])
          profile = os.environ["CAPTURE_PROFILE"]
          if not values:
              selected = []
              should_run = True
          else:
              prefix = "tv." if profile == "tv" else "mobile."
              selected = [value for value in values if value.startswith(prefix)]
              should_run = bool(selected)
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"selectors_json={json.dumps(selected,separators=(',',':'))}\n")
              stream.write(f"should_run={'true' if should_run else 'false'}\n")
          if not should_run:
              print(f"Android screenshot-review profile {profile} has no requested canonical screens; skipping its hosted capture lane.")
          PY_ANDROID_SCREENSHOT_PROFILE_SELECTORS

      - name: Prepare source token
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out exact Android screenshot source
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ needs.screenshot_plan.outputs.source_sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Android screenshot source
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.screenshot_plan.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXPECTED_SOURCE_SHA}" || { echo "Android screenshot-review checkout moved from the plan-pinned source SHA" >&2; exit 1; }
          [[ "${observed}" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Java 25
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download fixed private Android screenshot cache
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        id: screenshot_cache
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          operation: download
          destination_kind: repository-screenshot-cache
          file_path: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
          file_name: xtream-screenshot-cache.zip
          mime_type: application/zip

      - name: Verify shared Android screenshot cache identity
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        shell: bash
        env:
          EXPECTED_CACHE_SHA256: ${{ needs.screenshot_cache.outputs.cache_sha256 }}
          OBSERVED_CACHE_SHA256: ${{ steps.screenshot_cache.outputs.file_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_CACHE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${OBSERVED_CACHE_SHA256}" = "${EXPECTED_CACHE_SHA256}" || { echo "Android screenshot lane did not consume the pre-matrix cache identity" >&2; exit 1; }

      - name: Prepare fixed Android screenshot emulator
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        id: screenshot_emulator
        shell: bash
        env:
          SYSTEM_IMAGE: ${{ matrix.system_image }}
          AVD_DEVICE: ${{ matrix.avd_device }}
          CAPTURE_PROFILE: ${{ matrix.capture_profile }}
          DISPLAY_WIDTH: ${{ matrix.width }}
          DISPLAY_HEIGHT: ${{ matrix.height }}
          DISPLAY_DENSITY: ${{ matrix.density }}
          DISPLAY_ROTATION: ${{ matrix.rotation }}
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${sdk_root}" || { echo "Android SDK root is unavailable on the hosted screenshot runner" >&2; exit 1; }
          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          test -n "${sdkmanager}" || sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -n "${avdmanager}" || avdmanager="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          test -x "${sdkmanager}" && test -x "${avdmanager}" || { echo "Android screenshot-review SDK tools are unavailable" >&2; exit 1; }
          "${sdkmanager}" --install platform-tools emulator "${SYSTEM_IMAGE}" >> "${CI_LOG}" 2>&1
          adb="$(command -v adb || true)"; test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          emulator="$(command -v emulator || true)"; test -n "${emulator}" || emulator="${sdk_root}/emulator/emulator"
          test -x "${adb}" && test -x "${emulator}" || { echo "Android screenshot-review emulator runtime is unavailable" >&2; exit 1; }
          avd_name="central-screenshot-${CAPTURE_PROFILE}"
          avd_home="${RUNNER_TEMP}/central-android-screenshot-avd"
          avd_path="${avd_home}/${avd_name}.avd"
          rm -rf -- "${avd_home}"
          mkdir -p "${avd_home}"
          export ANDROID_AVD_HOME="${avd_home}"
          printf 'ANDROID_AVD_HOME=%s\n' "${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          printf 'no\n' | "${avdmanager}" create avd --force --name "${avd_name}" --package "${SYSTEM_IMAGE}" --device "${AVD_DEVICE}" -p "${avd_path}" >> "${CI_LOG}" 2>&1
          test -f "${ANDROID_AVD_HOME}/${avd_name}.ini" && test -d "${avd_path}"
          if test -e /dev/kvm && test ! -w /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          "${adb}" start-server >> "${CI_LOG}" 2>&1
          "${emulator}" -avd "${avd_name}" -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot-save -wipe-data -gpu swiftshader_indirect >> "${CI_LOG}" 2>&1 &
          emulator_pid=$!
          printf 'pid=%s\n' "${emulator_pid}" >> "${GITHUB_OUTPUT}"
          serial=emulator-5554
          printf 'ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"
          booted=false
          for _ in $(seq 1 180); do
            if "${adb}" -s "${serial}" shell getprop sys.boot_completed 2>/dev/null | grep -qx 1; then booted=true; break; fi
            kill -0 "${emulator_pid}" 2>/dev/null || { echo "Android screenshot emulator exited before boot" >&2; exit 1; }
            sleep 2
          done
          test "${booted}" = true || { echo "Android screenshot emulator did not boot within the bounded timeout" >&2; exit 1; }
          "${adb}" -s "${serial}" shell wm size "${DISPLAY_WIDTH}x${DISPLAY_HEIGHT}" >> "${CI_LOG}" 2>&1
          "${adb}" -s "${serial}" shell wm density "${DISPLAY_DENSITY}" >> "${CI_LOG}" 2>&1
          "${adb}" -s "${serial}" shell settings put system accelerometer_rotation 0 >> "${CI_LOG}" 2>&1 || true
          "${adb}" -s "${serial}" shell settings put system user_rotation "${DISPLAY_ROTATION}" >> "${CI_LOG}" 2>&1 || true
          for key in window_animation_scale transition_animation_scale animator_duration_scale; do
            "${adb}" -s "${serial}" shell settings put global "${key}" 0 >> "${CI_LOG}" 2>&1 || true
          done
          "${adb}" -s "${serial}" shell input keyevent 82 >/dev/null 2>&1 || true
          {
            printf '\n===== android-screenshot-runtime =====\n'
            printf 'capture_profile=%s\n' "${CAPTURE_PROFILE}"
            printf 'system_image=%s\n' "${SYSTEM_IMAGE}"
            printf 'avd_device=%s\n' "${AVD_DEVICE}"
            "${adb}" -s "${serial}" shell wm size
            "${adb}" -s "${serial}" shell wm density
          } >> "${CI_LOG}" 2>&1

      - name: Run fixed Android screenshot-review wrapper
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' }}
        id: screenshot_commands
        shell: bash
        env:
          CI_ANDROID_SCREENSHOT_PROFILE: ${{ matrix.capture_profile }}
          CI_ANDROID_SCREENSHOT_SOURCE_SHA: ${{ needs.screenshot_plan.outputs.source_sha }}
          CI_ANDROID_SCREENSHOT_CACHE_PATH: ${{ runner.temp }}/central-android-screenshot-cache/xtream-screenshot-cache.zip
          CI_ANDROID_SCREENSHOT_CACHE_SHA256: ${{ steps.screenshot_cache.outputs.file_sha256 }}
          CI_ANDROID_SCREENSHOT_CANONICAL_IDS_JSON: ${{ steps.screenshot_selection.outputs.selectors_json }}
          CI_ANDROID_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/central-android-screenshot-review/raw
          CI_ANDROID_SCREENSHOT_PACKAGE_PATH: ${{ runner.temp }}/central-android-screenshot-review/${{ matrix.capture_profile }}.zip
          STREAMSCAPE_API_BASE: ${{ secrets.STREAMSCAPE_API_BASE }}
          STREAMSCAPE_DEMO_EMAIL: ${{ secrets.STREAMSCAPE_DEMO_EMAIL }}
          STREAMSCAPE_DEMO_PASSWORD: ${{ secrets.STREAMSCAPE_DEMO_PASSWORD }}
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          wrapper=scripts/ci/run-android-screenshot-review.sh
          test -f "${wrapper}" || { echo "Missing fixed Android screenshot-review wrapper" >&2; exit 1; }
          test ! -L "${wrapper}" || { echo "Android screenshot-review wrapper must not be a symlink" >&2; exit 1; }
          git ls-files --error-unmatch "${wrapper}" >/dev/null 2>&1 || { echo "Android screenshot-review wrapper must be tracked source" >&2; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "Android screenshot-review requires a clean exact-source checkout" >&2; exit 1; }
          mkdir -p "${CI_ANDROID_SCREENSHOT_OUTPUT_DIR}" "$(dirname "${CI_ANDROID_SCREENSHOT_PACKAGE_PATH}")"
          printf '\n===== android-screenshot-review:%s =====\n' "${CI_ANDROID_SCREENSHOT_PROFILE}" >> "${CI_LOG}"
          if ! bash "${wrapper}" >> "${CI_LOG}" 2>&1; then
            echo "Android screenshot-review product wrapper failed; inspect the private Google Drive CI log." >&2
            exit 1
          fi
          test -f "${CI_ANDROID_SCREENSHOT_PACKAGE_PATH}" || { echo "Android screenshot-review wrapper produced no package" >&2; exit 1; }

      - name: Validate Android screenshot-review package and extract direct evidence
        id: screenshot_package
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' && steps.screenshot_commands.outcome == 'success' }}
        shell: bash
        env:
          PACKAGE_PATH: ${{ runner.temp }}/central-android-screenshot-review/${{ matrix.capture_profile }}.zip
          CAPTURE_PROFILE: ${{ matrix.capture_profile }}
          SOURCE_SHA: ${{ needs.screenshot_plan.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          python3 - "${PACKAGE_PATH}" "${CAPTURE_PROFILE}" "${SOURCE_SHA}" "${GITHUB_OUTPUT}" <<'PY_ANDROID_SCREENSHOT_PACKAGE'
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          package = Path(sys.argv[1])
          profile = sys.argv[2]
          source_sha = sys.argv[3]
          github_output = Path(sys.argv[4])
          expected_root = "repositories/iptv-android/screenshots"
          expected_name = f"{profile}.zip"
          expected_path = f"{expected_root}/{expected_name}"
          if profile not in {"phone-portrait", "phone-landscape", "tablet-portrait", "tablet-landscape", "tv"}:
              raise SystemExit("Android screenshot-review has an unsupported capture profile")
          if len(source_sha) != 40 or any(c not in "0123456789abcdef" for c in source_sha):
              raise SystemExit("Android screenshot-review has invalid source provenance")

          direct_dir = package.parent / "direct-evidence"
          direct_dir.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(package) as archive:
              names = archive.namelist()
              if names.count("index.json") != 1 or names.count("routes.json") != 1:
                  raise SystemExit("Android screenshot-review package must contain exactly one index.json and routes.json")
              if any(info.is_dir() is False and info.file_size < 0 for info in archive.infolist()):
                  raise SystemExit("Android screenshot-review ZIP contains invalid member metadata")
              if archive.testzip() is not None:
                  raise SystemExit("Android screenshot-review ZIP contains a corrupt member")
              index = json.loads(archive.read("index.json"))
              if not isinstance(index, dict):
                  raise SystemExit("Android screenshot-review index must be one object")
              expected = {
                  "source_sha": source_sha,
                  "platform": "android",
                  "capture_profile": profile,
                  "drive_root": expected_root,
                  "drive_package_path": expected_path,
              }
              for key, value in expected.items():
                  if index.get(key) != value:
                      raise SystemExit(f"Android screenshot-review {key} mismatch")
              if Path(index["drive_package_path"]).name != expected_name:
                  raise SystemExit("Android screenshot-review package filename mismatch")
              if source_sha in index["drive_package_path"].split("/"):
                  raise SystemExit("Android screenshot-review must not encode source SHA as a Drive folder")

              captures = index.get("captures")
              if not isinstance(captures, list) or not 1 <= len(captures) <= 20:
                  raise SystemExit("Android screenshot-review index must contain 1 through 20 captures")
              seen = set()
              for capture in captures:
                  if not isinstance(capture, dict):
                      raise SystemExit("Android screenshot-review capture identity is malformed")
                  screen_id = capture.get("canonical_id")
                  member = capture.get("package_member")
                  expected_prefix = "tv." if profile == "tv" else "mobile."
                  if (
                      not isinstance(screen_id, str)
                      or not screen_id.startswith(expected_prefix)
                      or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,191}", screen_id) is None
                      or screen_id in seen
                  ):
                      raise SystemExit("Android screenshot-review canonical screen identity is invalid")
                  seen.add(screen_id)
                  if not isinstance(member, str) or member not in names:
                      raise SystemExit("Android screenshot-review screenshot member is missing")
                  pure = PurePosixPath(member)
                  if pure.is_absolute() or ".." in pure.parts or pure.suffix != ".png":
                      raise SystemExit("Android screenshot-review screenshot member path is unsafe")
                  image = archive.read(member)
                  if len(image) < 64 or not image.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise SystemExit("Android screenshot-review capture is not a valid PNG payload")

                  metadata = {
                      "schema_version": 1,
                      "source_sha": source_sha,
                      "platform": "android",
                      "capture_profile": profile,
                      "screen_id": screen_id,
                      "canonical_path": capture.get("canonical_path"),
                      "title": capture.get("title"),
                      "presentation": capture.get("presentation"),
                      "shared_logic_family": capture.get("shared_logic_family"),
                      "target": capture.get("target"),
                      "variant": capture.get("variant"),
                      "navigation_plan": capture.get("navigation_plan"),
                      "mounted_route": capture.get("mounted_route"),
                      "width": capture.get("width"),
                      "height": capture.get("height"),
                      "captured_at_utc": capture.get("captured_at_utc"),
                      "cache": index.get("cache"),
                      "normalization": index.get("normalization"),
                  }
                  if metadata["canonical_path"] is None or metadata["navigation_plan"] is None:
                      raise SystemExit("Android screenshot-review capture lacks direct-review provenance")
                  (direct_dir / f"{screen_id}.png").write_bytes(image)
                  (direct_dir / f"{screen_id}.json").write_text(
                      json.dumps(metadata, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )

          with github_output.open("a", encoding="utf-8") as output:
              output.write(f"evidence_dir={direct_dir}\n")
              output.write(f"capture_profile={profile}\n")
          PY_ANDROID_SCREENSHOT_PACKAGE

      - name: Upload direct Android screenshot-review evidence
        id: screenshot_upload
        if: ${{ steps.screenshot_selection.outputs.should_run == 'true' && steps.screenshot_package.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          operation: upload-directory
          destination_kind: repository-screenshots
          subdirectory: review/${{ steps.screenshot_package.outputs.capture_profile }}
          file_path: ${{ steps.screenshot_package.outputs.evidence_dir }}

      - name: Stop Android screenshot emulator
        if: ${{ always() }}
        shell: bash
        env:
          EMULATOR_PID: ${{ steps.screenshot_emulator.outputs.pid }}
        run: |
          set -Eeuo pipefail
          adb -s "${ANDROID_SERIAL:-emulator-5554}" emu kill >/dev/null 2>&1 || true
          if test -n "${EMULATOR_PID}" && kill -0 "${EMULATOR_PID}" 2>/dev/null; then
            kill "${EMULATOR_PID}" 2>/dev/null || true
            wait "${EMULATOR_PID}" 2>/dev/null || true
          fi

      - name: Clean Android screenshot-review package/cache state
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/central-android-screenshot-review" "${RUNNER_TEMP}/central-android-screenshot-cache" "${RUNNER_TEMP}/central-android-screenshot-avd"

      - name: Scrub configured CI secrets from Android screenshot log
        id: screenshot_scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_DRIVE_REPOSITORIES_FOLDER: ${{ secrets.GOOGLE_DRIVE_REPOSITORIES_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_SCREENSHOT_STREAMSCAPE_API_BASE: ${{ secrets.STREAMSCAPE_API_BASE }}
          CI_SECRET_SCREENSHOT_DEMO_EMAIL: ${{ secrets.STREAMSCAPE_DEMO_EMAIL }}
          CI_SECRET_SCREENSHOT_DEMO_PASSWORD: ${{ secrets.STREAMSCAPE_DEMO_PASSWORD }}
          CI_SECRET_UNUSED_REAL_EMAIL: ${{ secrets.STREAMSCAPE_EMAIL }}
          CI_SECRET_UNUSED_REAL_PASSWORD: ${{ secrets.STREAMSCAPE_PASSWORD }}
          CI_SECRET_UNUSED_XTREAM_URL: ${{ secrets.XTREAM_URL }}
          CI_SECRET_UNUSED_XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          CI_SECRET_UNUSED_XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_ANDROID_SCREENSHOT_REDACT'
          import os
          from pathlib import Path
          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_ANDROID_SCREENSHOT_REDACT

      - name: Upload Android screenshot-review private log
        id: screenshot_log_upload
        if: ${{ always() && steps.screenshot_scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: StreamScapeTV/iptv-android
          ref: ${{ inputs.ref }}
          file_path: ${{ runner.temp }}/central-ci-screenshot-${{ matrix.capture_profile }}.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}-screenshot-${{ matrix.capture_profile }}.txt
          mime_type: text/plain

  screenshot_finish:
    needs:
      - screenshot_plan
      - screenshot_cache
      - screenshot
    if: ${{ always() && inputs.test_profile == 'screenshot-review' && inputs.ci_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Finish Agent State run
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ (needs.screenshot_plan.result == 'cancelled' || needs.screenshot_cache.result == 'cancelled' || needs.screenshot.result == 'cancelled') && 'cancelled' || (needs.screenshot_plan.result == 'success' && needs.screenshot_cache.result == 'success' && needs.screenshot.result == 'success') && 'succeeded' || 'failed' }}

  ci:
    if: ${{ inputs.test_profile != 'screenshot-review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Connect to private Git service
        if: >-
          ${{ inputs.test_profile != 'smoke'
              && inputs.test_profile != 'build'
              && inputs.test_profile != 'test'
              && inputs.test_profile != 'emulator' }}
        uses: StreamScapeTV/ci-workflows/actions/private-git@main
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed product source SHA
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Android source checkout did not resolve to one exact lowercase commit SHA" >&2
            exit 2
          }
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed product source SHA
        id: source_observe
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve IPTV Android default-branch cache scope
        id: android_default_cache_scope
        if: >-
          ${{ inputs.test_profile != 'build'
              && inputs.test_profile != 'test'
              && inputs.test_profile != 'emulator' }}
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -Eeuo pipefail
          source_ref="${REQUESTED_REF}"
          if test -z "${source_ref}" && test "${CURRENT_REF_TYPE}" = branch; then
            source_ref="${CURRENT_REF_NAME}"
          fi
          source_ref="${source_ref#refs/heads/}"
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          default_branch=""
          enabled=false
          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android &&
            test -n "${SOURCE_TOKEN}"; then
            repository_json="$(curl --fail --silent --show-error --header "Authorization: Bearer ${SOURCE_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${SOURCE_REPOSITORY}" || true)"
            if test -n "${repository_json}"; then
              default_branch="$(printf '%s' "${repository_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch", ""))' 2>/dev/null || true)"
            fi
            if test "${source_ref}" = "${default_branch}" &&
              test "${checkout_branch}" = "${default_branch}"; then
              enabled=true
            fi
          fi
          source_sha="$(git rev-parse HEAD)"
          dependency_fingerprint=""
          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android; then
            dependency_fingerprint="$(python3 - <<'PY_ANDROID_DEPENDENCY_FINGERPRINT'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path(".")
          records: list[str] = []

          def add_file(path: Path) -> None:
              if path.is_file():
                  records.append(f"FILE {path.as_posix()}\n{path.read_text(encoding='utf-8')}\n")

          def add_dependency_blocks(path: Path) -> None:
              if not path.is_file():
                  return
              lines = path.read_text(encoding="utf-8").splitlines()
              block_name = ""
              depth = 0
              captured: list[str] = []
              for line in lines:
                  if not block_name:
                      match = re.match(r"^\s*(plugins|dependencies)\s*\{", line)
                      if match:
                          block_name = match.group(1)
                          depth = line.count("{") - line.count("}")
                          captured = [line.strip()]
                          if depth <= 0:
                              records.append(f"BLOCK {path.as_posix()}:{block_name}\n" + "\n".join(captured) + "\n")
                              block_name = ""
                              captured = []
                      continue
                  stripped = line.strip()
                  if stripped and not stripped.startswith("//"):
                      captured.append(" ".join(stripped.split()))
                  depth += line.count("{") - line.count("}")
                  if depth <= 0:
                      records.append(f"BLOCK {path.as_posix()}:{block_name}\n" + "\n".join(captured) + "\n")
                      block_name = ""
                      captured = []

          add_file(root / "gradle" / "wrapper" / "gradle-wrapper.properties")
          for path in sorted((root / "gradle").glob("**/*.toml")):
              add_file(path)
          for path in sorted(root.glob("settings.gradle*")):
              if path.is_file():
                  settings = "\n".join(
                      line for line in path.read_text(encoding="utf-8").splitlines()
                      if not re.match(r"^\s*rootProject\.name\s*=", line)
                  )
                  records.append(f"SETTINGS {path.as_posix()}\n{settings}\n")
          for path in sorted(root.glob("**/build.gradle*")):
              add_dependency_blocks(path)

          if not records:
              raise SystemExit("Android dependency fingerprint has no inputs")
          digest = hashlib.sha256("\n".join(records).encode("utf-8")).hexdigest()
          print(digest)
          PY_ANDROID_DEPENDENCY_FINGERPRINT
            )"
          fi
          printf 'enabled=%s\n' "${enabled}" >> "${GITHUB_OUTPUT}"
          printf 'default_branch=%s\n' "${default_branch}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'dependency_fingerprint=%s\n' "${dependency_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore IPTV Android default-branch dependency cache
        id: gradle_dependency_cache
        if: ${{ steps.android_default_cache_scope.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: >-
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_default_cache_scope.outputs.dependency_fingerprint }}

      - name: Resolve IPTV Android non-default cache reader scope
        id: android_branch_cache_scope
        if: >-
          ${{ inputs.test_profile != 'build'
              && inputs.test_profile != 'test'
              && inputs.test_profile != 'emulator' }}
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ steps.android_default_cache_scope.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          source_ref="${REQUESTED_REF}"
          normalized_ref="${source_ref#refs/heads/}"
          checkout_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          enabled=false

          if test "${SOURCE_REPOSITORY}" = StreamScapeTV/iptv-android &&
            test -n "${DEFAULT_BRANCH}"; then
            if [[ "${source_ref}" == refs/pull/* ]]; then
              enabled=true
            elif test -n "${checkout_branch}" &&
              test "${checkout_branch}" != "${DEFAULT_BRANCH}" &&
              test "${normalized_ref}" != "${DEFAULT_BRANCH}"; then
              enabled=true
            fi
          fi

          printf 'enabled=%s\n' "${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Restore IPTV Android non-default dependency cache
        id: gradle_branch_dependency_cache
        if: ${{ steps.android_branch_cache_scope.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: >-
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android_default_cache_scope.outputs.dependency_fingerprint }}
          restore-keys: |
            iptv-android-default-gradle-deps-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate generic Android hosted request
        if: >-
          ${{ inputs.test_profile == 'build'
              || inputs.test_profile == 'test'
              || inputs.test_profile == 'emulator' }}
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ inputs.project_directory }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          TEST_PLATFORM: ${{ inputs.test_platform }}
          ROOM_SCHEMA: ${{ inputs.room_schema }}
        run: |
          set -Eeuo pipefail
          test "${PROJECT_DIRECTORY}" = "." || {
            echo "Generic Android hosted profiles require project_directory=." >&2
            exit 2
          }
          test -z "${TEST_FILTER}" || {
            echo "Generic Android hosted profiles do not accept test_filter" >&2
            exit 2
          }
          test "${TEST_SELECTORS}" = "[]" || {
            echo "Generic Android hosted profiles do not accept test_selectors" >&2
            exit 2
          }
          test -z "${TEST_PLATFORM}" || {
            echo "Generic Android hosted profiles do not accept test_platform" >&2
            exit 2
          }
          test "${ROOM_SCHEMA}" = "false" || {
            echo "Generic Android hosted profiles do not accept room_schema" >&2
            exit 2
          }
          test -f scripts/ci/run-android-hosted-validation.sh || {
            echo "Missing fixed Android hosted validation wrapper: scripts/ci/run-android-hosted-validation.sh" >&2
            exit 2
          }

      - name: Prepare fixed Google Play draft release context
        id: play_prepare
        if: ${{ inputs.test_profile == 'play' }}
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "Google Play build_number must be a positive decimal Android versionCode" >&2
            exit 2
          }
          (( BUILD_NUMBER <= 2100000000 )) || {
            echo "Google Play build_number exceeds the maximum Android versionCode 2100000000" >&2
            exit 2
          }
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}" || {
            echo "Google Play release credential is unavailable" >&2
            exit 2
          }
          for name in ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD ANDROID_PLAY_UPLOAD_KEY_ALIAS ANDROID_PLAY_UPLOAD_KEY_PASSWORD; do
            test -n "${!name}" || {
              printf 'Google Play release signing secret is unavailable: %s\n' "${name}" >&2
              exit 2
            }
          done
          release_root="${RUNNER_TEMP}/central-android-play"
          credential_path="${release_root}/service-account.json"
          keystore_path="${release_root}/upload-key.jks"
          rm -rf -- "${release_root}"
          mkdir -p "${release_root}"
          chmod 700 "${release_root}"
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}" | base64 --decode > "${credential_path}"
          printf '%s' "${ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${credential_path}" "${keystore_path}"
          test -s "${keystore_path}"
          python3 - "${credential_path}" <<'PY_PLAY_JSON'
          from pathlib import Path
          import json, sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("type") != "service_account":
              raise SystemExit("Google Play credential must be a service-account JSON key")
          for field in ("client_email", "private_key", "token_uri"):
              if not isinstance(value.get(field), str) or not value[field]:
                  raise SystemExit(f"Google Play service-account JSON is missing {field}")
          PY_PLAY_JSON
          test "$(stat -c '%a' "${credential_path}")" = 600
          test "$(stat -c '%a' "${keystore_path}")" = 600
          keytool -list -keystore "${keystore_path}" -storepass "${ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD}" -alias "${ANDROID_PLAY_UPLOAD_KEY_ALIAS}" >/dev/null
          {
            printf 'CI_ANDROID_PLAY_BUILD_NUMBER=%s\n' "${BUILD_NUMBER}"
            printf 'CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH=%s\n' "${credential_path}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH=%s\n' "${keystore_path}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD=%s\n' "${ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS=%s\n' "${ANDROID_PLAY_UPLOAD_KEY_ALIAS}"
            printf 'CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD=%s\n' "${ANDROID_PLAY_UPLOAD_KEY_PASSWORD}"
            printf 'CI_ANDROID_PLAY_TRACK=internal\n'
            printf 'CI_ANDROID_PLAY_RELEASE_STATUS=draft\n'
          } >> "${GITHUB_ENV}"

      - name: Prepare generic Android emulator
        id: android_emulator
        if: ${{ inputs.test_profile == 'emulator' || (inputs.test_profile == 'targeted-tests' && inputs.test_platform == 'instrumentation') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${sdk_root}" || {
            echo "Android SDK root is unavailable on the hosted runner" >&2
            exit 1
          }
          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          test -n "${sdkmanager}" || sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -n "${avdmanager}" || avdmanager="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          for tool in "${sdkmanager}" "${avdmanager}"; do
            test -x "${tool}" || {
              printf 'Required Android emulator install tool is unavailable: %s\n' "${tool}" >&2
              exit 1
            }
          done

          image='system-images;android-36;google_apis;x86_64'
          avd_name='central-android-api36'
          serial='emulator-5554'
          "${sdkmanager}" --install platform-tools emulator "${image}" >> "${CI_LOG}" 2>&1

          adb="$(command -v adb || true)"
          emulator="$(command -v emulator || true)"
          test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          test -n "${emulator}" || emulator="${sdk_root}/emulator/emulator"
          for tool in "${adb}" "${emulator}"; do
            test -x "${tool}" || {
              printf 'Required Android emulator runtime tool is unavailable after install: %s\n' "${tool}" >&2
              exit 1
            }
          done
          avd_home="${RUNNER_TEMP}/central-android-avd"
          avd_path="${avd_home}/${avd_name}.avd"
          rm -rf -- "${avd_home}"
          mkdir -p "${avd_home}"
          export ANDROID_AVD_HOME="${avd_home}"
          printf 'ANDROID_AVD_HOME=%s\n' "${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          printf 'no\n' | "${avdmanager}" create avd --force \
            --name "${avd_name}" --package "${image}" --device pixel \
            -p "${avd_path}" >> "${CI_LOG}" 2>&1
          test -f "${ANDROID_AVD_HOME}/${avd_name}.ini" || {
            printf 'Android AVD descriptor was not created in the fixed AVD home: %s\n' "${ANDROID_AVD_HOME}" >&2
            exit 1
          }
          test -d "${avd_path}" || {
            printf 'Android AVD data directory was not created: %s\n' "${avd_path}" >&2
            exit 1
          }
          if ! "${emulator}" -list-avds 2>> "${CI_LOG}" | grep -Fx "${avd_name}" >> "${CI_LOG}"; then
            printf 'Android emulator cannot resolve fixed AVD %s from %s\n' "${avd_name}" "${ANDROID_AVD_HOME}" >&2
            exit 1
          fi
          if test -e /dev/kvm && test ! -w /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi
          "${adb}" start-server >> "${CI_LOG}" 2>&1
          "${emulator}" -avd "${avd_name}" -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot-save -wipe-data \
            -gpu swiftshader_indirect >> "${CI_LOG}" 2>&1 &
          emulator_pid=$!
          printf 'pid=%s\n' "${emulator_pid}" >> "${GITHUB_OUTPUT}"
          printf 'ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"

          booted=false
          for _ in $(seq 1 180); do
            if "${adb}" -s "${serial}" shell getprop sys.boot_completed 2>/dev/null | grep -qx '1'; then
              booted=true
              break
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              exit 1
            fi
            sleep 2
          done
          test "${booted}" = true || {
            echo "Android emulator did not boot within the bounded timeout" >&2
            exit 1
          }
          "${adb}" -s "${serial}" shell input keyevent 82 >/dev/null 2>&1 || true

      - name: Run fixed Android profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          PROJECT_DIRECTORY: ${{ inputs.project_directory }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_SELECTORS: ${{ inputs.test_selectors }}
          TEST_PLATFORM: ${{ inputs.test_platform }}
          ROOM_SCHEMA: ${{ inputs.room_schema }}
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_ANDROID_PLAY_BUILD_NUMBER: ${{ env.CI_ANDROID_PLAY_BUILD_NUMBER }}
          CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH: ${{ env.CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH }}
          CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH }}
          CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS }}
          CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ env.CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD }}
          CI_ANDROID_PLAY_TRACK: ${{ env.CI_ANDROID_PLAY_TRACK }}
          CI_ANDROID_PLAY_RELEASE_STATUS: ${{ env.CI_ANDROID_PLAY_RELEASE_STATUS }}
        run: |
          set -Eeuo pipefail
          repository_root="${PWD}"

          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "${label}" >> "${CI_LOG}"
            if ! "$@" >> "${CI_LOG}" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "${label}" >&2
              return 1
            fi
          }

          case "${TEST_PROFILE}" in
            targeted-tests)
              test -z "${TEST_FILTER}" || {
                echo "targeted-tests does not accept legacy test_filter" >&2
                exit 2
              }
              case "${TEST_PLATFORM}" in
                jvm|instrumentation) ;;
                *) echo "targeted-tests requires test_platform=jvm or instrumentation" >&2; exit 2 ;;
              esac
              ;;
            targeted-unit)
              test "${TEST_SELECTORS}" = "[]" || {
                echo "legacy targeted-unit does not accept test_selectors" >&2
                exit 2
              }
              test -z "${TEST_PLATFORM}" || {
                echo "legacy targeted-unit does not accept test_platform" >&2
                exit 2
              }
              ;;
            *)
              test -z "${TEST_FILTER}" || {
                echo "test_filter is accepted only by the legacy targeted-unit profile" >&2
                exit 2
              }
              test "${TEST_SELECTORS}" = "[]" || {
                echo "test_selectors is accepted only by the targeted-tests profile" >&2
                exit 2
              }
              test -z "${TEST_PLATFORM}" || {
                echo "test_platform is accepted only by the targeted-tests profile" >&2
                exit 2
              }
              ;;
          esac

          case "${TEST_PROFILE}" in
            build|test|emulator)
              wrapper="${repository_root}/scripts/ci/run-android-hosted-validation.sh"
              export CI_ANDROID_HOSTED_PROFILE="${TEST_PROFILE}"
              run_logged "android-${TEST_PROFILE}" bash "${wrapper}"
              exit 0
              ;;
            play)
              wrapper="${repository_root}/scripts/ci/run-android-play-release.sh"
              test -f "${wrapper}" || {
                printf 'Missing fixed Android Play release wrapper: %s\n' "${wrapper}" >&2
                exit 2
              }
              git ls-files --error-unmatch -- "${wrapper#${repository_root}/}" >/dev/null 2>&1 || {
                printf 'Android Play release wrapper must be tracked source: %s\n' "${wrapper}" >&2
                exit 2
              }
              test -n "${CI_ANDROID_PLAY_BUILD_NUMBER:-}"
              test -n "${CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH:-}"
              test -f "${CI_ANDROID_PLAY_SERVICE_ACCOUNT_PATH}"
              test -f "${CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PATH}"
              test -n "${CI_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD:-}"
              test -n "${CI_ANDROID_PLAY_UPLOAD_KEY_ALIAS:-}"
              test -n "${CI_ANDROID_PLAY_UPLOAD_KEY_PASSWORD:-}"
              test "${CI_ANDROID_PLAY_TRACK:-}" = internal
              test "${CI_ANDROID_PLAY_RELEASE_STATUS:-}" = draft
              run_logged android-play-draft bash "${wrapper}"
              exit 0
              ;;
          esac

          case "${PROJECT_DIRECTORY}" in
            .|android) ;;
            *) echo "Unsupported Android project_directory" >&2; exit 2 ;;
          esac
          cd "${PROJECT_DIRECTORY}"
          test -x gradlew

          append_instrumentation_failure_evidence() {
            python3 - "${CI_LOG}" <<'PY_ANDROID_INSTRUMENTATION_RESULTS'
          from pathlib import Path
          import sys

          log_path = Path(sys.argv[1])
          root = Path.cwd()
          connected_result_marker = "/build/outputs/androidTest-results/connected/"
          max_files = 20
          max_result_bytes = 262144

          candidates = []
          connected_roots = sorted(
              path
              for path in root.glob("**/build/outputs/androidTest-results/connected")
              if path.is_dir() and not path.is_symlink()
          )
          for connected_root in connected_roots:
              for path in connected_root.rglob("*.xml"):
                  if path.is_symlink() or not path.is_file():
                      continue
                  relative = path.relative_to(root).as_posix()
                  if connected_result_marker not in f"/{relative}":
                      continue
                  candidates.append((relative, path))
          candidates.sort(key=lambda item: item[0])

          captured_files = 0
          captured_result_bytes = 0
          truncated = False
          with log_path.open("ab") as log:
              log.write(b"\n===== android-instrumentation-failure-evidence =====\n")
              log.write(f"max_files={max_files}\n".encode())
              log.write(f"max_result_bytes={max_result_bytes}\n".encode())
              if not candidates:
                  log.write(b"result_files=0\n")
                  log.write(b"no connected-test XML result files found\n")
                  raise SystemExit(0)

              for relative, result_path in candidates:
                  if captured_files >= max_files or captured_result_bytes >= max_result_bytes:
                      truncated = True
                      break
                  data = result_path.read_bytes()
                  remaining = max_result_bytes - captured_result_bytes
                  chunk = data[:remaining]
                  log.write(
                      f"\n--- android-instrumentation-result path={relative} size={len(data)} ---\n".encode()
                  )
                  log.write(chunk)
                  if not chunk.endswith(b"\n"):
                      log.write(b"\n")
                  captured_files += 1
                  captured_result_bytes += len(chunk)
                  if len(chunk) < len(data):
                      truncated = True
                      break

              if captured_files < len(candidates):
                  truncated = True
              log.write(f"captured_files={captured_files}\n".encode())
              log.write(f"result_files={len(candidates)}\n".encode())
              log.write(f"captured_result_bytes={captured_result_bytes}\n".encode())
              if truncated:
                  log.write(
                      b"[TRUNCATED android instrumentation failure evidence at reviewed file/byte cap]\n"
                  )
          PY_ANDROID_INSTRUMENTATION_RESULTS
          }

          run_gradle() {
            local started="${SECONDS}"
            if ! run_logged "gradle-${TEST_PROFILE}" ./gradlew --no-daemon "$@"; then
              return 1
            fi
            local elapsed=$((SECONDS - started))
            {
              printf '\n===== gradle-wall-time =====\n'
              printf 'profile=%s\n' "${TEST_PROFILE}"
              printf 'seconds=%s\n' "${elapsed}"
            } >> "${CI_LOG}"
            printf 'Android %s Gradle wall time: %ss\n' "${TEST_PROFILE}" "${elapsed}"
          }

          policy_root="${repository_root}/scripts/ci"
          performance_test_class='com.streamscapetv.app.foundation.performance.testing.PerformanceBudgetTest'

          load_test_selectors() {
            test_selectors=()
            while IFS= read -r selector; do
              test_selectors+=("${selector}")
            done < <(
              TEST_SELECTORS_JSON="${TEST_SELECTORS}" TEST_PLATFORM_VALUE="${TEST_PLATFORM}" python3 - <<'PY_TEST_SELECTORS'
          import json
          import os
          import re

          raw = os.environ.get("TEST_SELECTORS_JSON", "")
          platform = os.environ.get("TEST_PLATFORM_VALUE", "")
          if len(raw) > 2048:
              raise SystemExit("targeted-tests test_selectors payload is too large")
          try:
              values = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit("targeted-tests test_selectors must be valid JSON") from exc
          if not isinstance(values, list) or not 1 <= len(values) <= 20:
              raise SystemExit("targeted-tests requires 1 through 20 test selectors")
          if any(not isinstance(value, str) for value in values):
              raise SystemExit("targeted-tests selectors must be strings")
          if len(values) != len(set(values)):
              raise SystemExit("targeted-tests test selectors must be unique")
          if platform == "jvm":
              pattern = re.compile(r"[A-Za-z0-9_.$*?-]{1,240}")
          elif platform == "instrumentation":
              pattern = re.compile(r"(?:[A-Za-z_][A-Za-z0-9_$]*\.)+[A-Za-z_][A-Za-z0-9_$]*(?:#[A-Za-z_][A-Za-z0-9_$]*)?")
          else:
              raise SystemExit("targeted-tests has an unsupported Android test_platform")
          for value in values:
              if not pattern.fullmatch(value) or value.startswith("-"):
                  raise SystemExit("targeted-tests contains an invalid Android test selector")
              print(value)
          PY_TEST_SELECTORS
            )
            test "${#test_selectors[@]}" -ge 1
          }

          case "${TEST_PROFILE}" in
            smoke)
              run_gradle help
              ;;
            compile)
              run_gradle compileDebugKotlin compileDebugUnitTestKotlin
              ;;
            unit)
              run_gradle testDebugUnitTest
              ;;
            targeted-unit)
              # Transitional compatibility for active Agent State callers. New requests should use targeted-tests.
              [[ "${TEST_FILTER}" =~ ^[A-Za-z0-9_.$*?-]{1,240}$ ]] || {
                echo "targeted-unit requires a bounded test_filter" >&2
                exit 2
              }
              run_gradle testDebugUnitTest --tests "${TEST_FILTER}"
              ;;
            targeted-tests)
              test "${ROOM_SCHEMA}" = false || {
                echo "targeted-tests does not accept room_schema" >&2
                exit 2
              }
              load_test_selectors
              case "${TEST_PLATFORM}" in
                jvm)
                  targeted_args=(testDebugUnitTest)
                  for selector in "${test_selectors[@]}"; do
                    targeted_args+=(--tests "${selector}")
                  done
                  run_gradle "${targeted_args[@]}"
                  ;;
                instrumentation)
                  instrumentation_selector="$(IFS=,; printf '%s' "${test_selectors[*]}")"
                  if ! run_gradle connectedDebugAndroidTest \
                    "-Pandroid.testInstrumentationRunnerArguments.class=${instrumentation_selector}"; then
                    append_instrumentation_failure_evidence
                    exit 1
                  fi
                  ;;
              esac
              ;;
            lint)
              run_gradle lintDebug
              ;;
            assemble)
              run_gradle assembleDebug
              ;;
            full)
              correctness_init_script="${RUNNER_TEMP}/android-full-correctness.init.gradle"
              printf '%s\n' \
                'allprojects {' \
                '  tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {' \
                '    filter {' \
                "      excludeTestsMatching \"${performance_test_class}\"" \
                '    }' \
                '  }' \
                '}' > "${correctness_init_script}"
              run_gradle --init-script "${correctness_init_script}" compileDebugKotlin testDebugUnitTest lintDebug assembleDebug
              ;;
            search-performance)
              run_gradle testDebugUnitTest --tests "${performance_test_class}"
              ;;
            release)
              run_release_policy=false
              if [[ -e "${policy_root}/verify-lint-policy.sh" ||
                    -e "${policy_root}/verify-gradle-property-policy.sh" ||
                    -e "${policy_root}/verify-release-policy.sh" ||
                    -e "${policy_root}/verify-release-size.py" ]]; then
                test "${PROJECT_DIRECTORY}" = "." || {
                  echo "Release policy convention is supported only at the repository root" >&2
                  exit 2
                }
                test -x "${policy_root}/verify-lint-policy.sh"
                test -x "${policy_root}/verify-gradle-property-policy.sh"
                test -x "${policy_root}/verify-release-policy.sh"
                test -f "${policy_root}/verify-release-size.py"
                test -f "${policy_root}/release-size-budgets.json"
                test -f "${policy_root}/release-size-baseline.json"
                run_release_policy=true
              fi

              if [[ "${run_release_policy}" == true ]]; then
                run_logged release-lint-policy bash "${policy_root}/verify-lint-policy.sh"
                run_logged release-gradle-property-policy bash "${policy_root}/verify-gradle-property-policy.sh"
              fi

              run_gradle testDebugUnitTest lintDebug assembleRelease bundleRelease lintRelease

              if [[ "${run_release_policy}" == true ]]; then
                run_logged release-policy bash "${policy_root}/verify-release-policy.sh"

                mapfile -t apk_files < <(
                  find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort
                )
                mapfile -t aab_files < <(
                  find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print | sort
                )
                test "${#apk_files[@]}" -eq 1 || {
                  echo "Expected exactly one release APK for size validation" >&2
                  exit 1
                }
                test "${#aab_files[@]}" -eq 1 || {
                  echo "Expected exactly one release AAB for size validation" >&2
                  exit 1
                }

                run_logged release-size python3 "${policy_root}/verify-release-size.py" \
                  --apk "${apk_files[0]}" \
                  --aab "${aab_files[0]}" \
                  --budget "${policy_root}/release-size-budgets.json" \
                  --baseline "${policy_root}/release-size-baseline.json" \
                  --output app/build/reports/release-size-metrics.json
              fi
              ;;
            *)
              echo "Unsupported Android test_profile: ${TEST_PROFILE}" >&2
              exit 2
              ;;
          esac

          if [[ "${ROOM_SCHEMA}" == true ]]; then
            cd "${repository_root}"
            test "${PROJECT_DIRECTORY}" = "." || {
              echo "room_schema is supported only at the repository root" >&2
              exit 2
            }
            printf '\n===== room-schema =====\n' >> "${CI_LOG}"
            if ! python3 scripts/ci/validate-room-schemas.py \
              --repo-root . \
              --report build/reports/room-schema-json-integrity.json \
              >> "${CI_LOG}" 2>&1; then
              echo "Android room schema validation failed; inspect the private Google Drive CI log." >&2
              exit 1
            fi
          fi

      - name: Clean Google Play credential and release state
        id: play_cleanup
        if: ${{ always() && inputs.test_profile == 'play' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/central-android-play"
          rm -rf -- "${release_root}"
          test ! -e "${release_root}"

      - name: Stop generic Android emulator
        if: ${{ always() && (inputs.test_profile == 'emulator' || (inputs.test_profile == 'targeted-tests' && inputs.test_platform == 'instrumentation')) }}
        shell: bash
        env:
          EMULATOR_PID: ${{ steps.android_emulator.outputs.pid }}
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          adb="$(command -v adb || true)"
          test -n "${adb}" || adb="${sdk_root}/platform-tools/adb"
          serial="${ANDROID_SERIAL:-emulator-5554}"
          if test -x "${adb}"; then
            "${adb}" -s "${serial}" emu kill >/dev/null 2>&1 || true
          fi
          if test -n "${EMULATOR_PID}" && kill -0 "${EMULATOR_PID}" 2>/dev/null; then
            kill "${EMULATOR_PID}" 2>/dev/null || true
          fi
          if test -n "${ANDROID_AVD_HOME:-}"; then
            test "${ANDROID_AVD_HOME}" = "${RUNNER_TEMP}/central-android-avd" || {
              printf 'Refusing to clean unexpected Android AVD home: %s\n' "${ANDROID_AVD_HOME}" >&2
              exit 1
            }
            rm -rf -- "${ANDROID_AVD_HOME}"
            test ! -e "${ANDROID_AVD_HOME}"
          fi

      - name: Record IPTV Android cache measurements
        id: android_cache_measurements
        if: >-
          ${{
            steps.android_default_cache_scope.outputs.enabled == 'true'
            || steps.android_branch_cache_scope.outputs.enabled == 'true'
          }}
        shell: bash
        env:
          DEVELOP_DEPENDENCY_HIT: ${{ steps.gradle_dependency_cache.outputs.cache-hit }}
          BRANCH_DEPENDENCY_HIT: ${{ steps.gradle_branch_dependency_cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          measure_bytes() {
            local label="$1"
            local path="$2"
            local bytes=0
            if test -e "${path}"; then
              bytes="$(du -sb "${path}" | awk '{print $1}')"
            fi
            printf '%s_bytes=%s\n' "${label}" "${bytes}" >> "${CI_LOG}"
          }

          {
            printf '\n===== android-cache =====\n'
            printf 'source_sha=%s\n' "${{ steps.android_default_cache_scope.outputs.source_sha }}"
            printf 'default_writer=%s\n' "${{ steps.android_default_cache_scope.outputs.enabled }}"
            printf 'branch_reader=%s\n' "${{ steps.android_branch_cache_scope.outputs.enabled }}"
            printf 'default_dependency_hit=%s\n' "${DEVELOP_DEPENDENCY_HIT}"
            printf 'branch_dependency_hit=%s\n' "${BRANCH_DEPENDENCY_HIT}"
          } >> "${CI_LOG}"
          measure_bytes gradle_wrapper "${HOME}/.gradle/wrapper"
          measure_bytes gradle_modules "${HOME}/.gradle/caches/modules-2"

      - name: Save IPTV Android default-branch dependency cache
        id: gradle_dependency_cache_save
        if: >-
          ${{
            steps.android_default_cache_scope.outputs.enabled == 'true'
            && steps.commands.outcome == 'success'
            && (inputs.test_profile == 'full' || inputs.test_profile == 'release')
            && steps.gradle_dependency_cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle_dependency_cache.outputs.cache-primary-key }}

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CI_SECRET_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.CIW_MAVEN_PACKAGE_READ_TOKEN }}
          CI_SECRET_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.test_profile == 'play' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_PASSWORD || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEY_ALIAS: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEY_ALIAS || '' }}
          CI_SECRET_ANDROID_PLAY_UPLOAD_KEY_PASSWORD: ${{ inputs.test_profile == 'play' && secrets.ANDROID_PLAY_UPLOAD_KEY_PASSWORD || '' }}
          CI_SECRET_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CI_SECRET_TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          mime_type: text/plain

      - name: Classify Android terminal diagnostic
        id: terminal_diagnostic
        if: ${{ always() && inputs.ci_run_id != '' }}
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          SOURCE_OBSERVE_OUTCOME: ${{ steps.source_observe.outcome }}
          COMMANDS_OUTCOME: ${{ steps.commands.outcome }}
          PLAY_CLEANUP_OUTCOME: ${{ steps.play_cleanup.outcome }}
          SCRUB_OUTCOME: ${{ steps.scrub.outcome }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
          CACHE_MEASUREMENTS_OUTCOME: ${{ steps.android_cache_measurements.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.gradle_dependency_cache_save.outcome }}
        run: |
          set -Eeuo pipefail
          success=false
          if test "${COMMANDS_OUTCOME}" = success \
            && { test "${PLAY_CLEANUP_OUTCOME}" = success || test "${PLAY_CLEANUP_OUTCOME}" = skipped; } \
            && test "${SCRUB_OUTCOME}" = success \
            && test "${DRIVE_OUTCOME}" = success \
            && { test "${CACHE_MEASUREMENTS_OUTCOME}" = success || test "${CACHE_MEASUREMENTS_OUTCOME}" = skipped; } \
            && { test "${CACHE_SAVE_OUTCOME}" = success || test "${CACHE_SAVE_OUTCOME}" = skipped; }; then
            success=true
          fi

          error_summary=""
          if test "${success}" != true; then
            if test "${CHECKOUT_OUTCOME}" != success; then
              error_summary="Android source checkout failed before product source identity could be recorded."
            elif test "${SOURCE_IDENTITY_OUTCOME}" != success || test "${SOURCE_OBSERVE_OUTCOME}" != success; then
              error_summary="Android source checkout succeeded, but exact product source observation failed."
            elif test "${COMMANDS_OUTCOME}" = failure; then
              error_summary="Android ${TEST_PROFILE} product validation failed after exact source observation; see the private CI log diagnostic."
            elif test "${SCRUB_OUTCOME}" != success; then
              error_summary="Android validation reached terminal evidence handling, but private log scrubbing failed."
            elif test "${DRIVE_OUTCOME}" != success; then
              error_summary="Android validation failed or completed, but private CI log upload did not succeed."
            else
              error_summary="Android ${TEST_PROFILE} validation failed during bounded Central post-processing; see the private CI log diagnostic when available."
            fi
          fi

          diagnostic_key=""
          diagnostic_status="unavailable"
          if test "${DRIVE_OUTCOME}" = success; then
            diagnostic_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            diagnostic_status="available"
          fi
          {
            printf 'success=%s\n' "${success}"
            printf 'error_summary=%s\n' "${error_summary}"
            printf 'diagnostic_key=%s\n' "${diagnostic_key}"
            printf 'diagnostic_status=%s\n' "${diagnostic_status}"
          } >> "${GITHUB_OUTPUT}"

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.terminal_diagnostic.outputs.success == 'true' && 'succeeded' || 'failed' }}
          error_summary: ${{ steps.terminal_diagnostic.outputs.error_summary }}
          diagnostic_key: ${{ steps.terminal_diagnostic.outputs.diagnostic_key }}
          diagnostic_status: ${{ steps.terminal_diagnostic.outputs.diagnostic_status }}
