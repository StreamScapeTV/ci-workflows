name: Runner image release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ci-workflows Git tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runner-images-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact repository release tag
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      images_json: ${{ steps.release.outputs.images_json }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - id: release
        name: Bind the human-readable tag to its exact commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_sha}"
          python3 scripts/ci/runner_images.py release \
            --tag "${RELEASE_TAG}" \
            --source-sha "${source_sha}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify release checkout remained clean
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"

  release:
    name: Publish ${{ matrix.image }} runner image to public GHCR
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - general
          - mobile
          - buildah
          - service
          - docker
          - flux-control
    runs-on: [ubuntu-latest]
    timeout-minutes: 180
    steps:
      - name: Check out exact tagged runner-image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact tagged source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - id: image
        name: Build smoke and publish the exact local image
        uses: ./actions/runner-image
        with:
          image: ${{ matrix.image }}
          source_sha: ${{ needs.resolve.outputs.source_sha }}
          release_tag: ${{ needs.resolve.outputs.release_tag }}
          publish: "true"

      - name: Record hosted feasibility and public GHCR identity
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          HOSTED_METRICS_JSON: ${{ steps.image.outputs.hosted_metrics_json }}
        run: |
          set -Eeuo pipefail
          test -n "${IMAGE_REFERENCE}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "${HOSTED_METRICS_JSON}"
          printf '### Runner image `%s` release\n\n- Reference: `%s`\n- Digest: `%s`\n\n```json\n%s\n```\n' \
            "${IMAGE}" "${IMAGE_REFERENCE}" "${IMAGE_DIGEST}" "${HOSTED_METRICS_JSON}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove runner-image release residue
        if: always()
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set +e
          cleanup_failed=0
          docker_config="${RUNNER_TEMP}/ciw-runner-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}"
          build_inputs="${GITHUB_WORKSPACE}/runner-images/${IMAGE}/.ciw-build-inputs"
          rm -rf -- "${docker_config}" "${build_inputs}" || cleanup_failed=1
          test ! -e "${docker_config}" || cleanup_failed=1
          test ! -L "${docker_config}" || cleanup_failed=1
          test ! -e "${build_inputs}" || cleanup_failed=1
          test ! -L "${build_inputs}" || cleanup_failed=1
          exit "${cleanup_failed}"

      - name: Verify exact tagged source remained clean
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
