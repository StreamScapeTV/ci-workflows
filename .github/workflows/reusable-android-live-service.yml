name: CI / Android live-service acceptance

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase Android source SHA admitted by source.resolve
        required: true
        type: string
      working_directory:
        description: Bounded relative Android project directory
        required: false
        default: .
        type: string
      validation_plan_json:
        description: Strict caller-owned checked-in live-service script plan
        required: true
        type: string
      private_dependency_repository:
        required: false
        default: ""
        type: string
      private_dependency_sha:
        required: false
        default: ""
        type: string
      private_dependency_subdirectory:
        required: false
        default: .
        type: string
      private_dependency_id:
        required: false
        default: ""
        type: string
    secrets:
      service_username:
        description: Generic transient service username
        required: false
      service_password:
        description: Generic transient service password
        required: false
      private_dependency_token:
        description: Optional transient contents-read dependency token
        required: false
      maven_package_read_token:
        description: Optional transient package-read token forwarded only to bounded product execution
        required: false
    outputs:
      result:
        value: ${{ jobs.live.outputs.result }}
      test_summary:
        value: ${{ jobs.live.outputs.test_summary }}
      cleanup_result:
        value: ${{ jobs.live.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  plan:
    name: Validate Android live-service request
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      private_dependency_used: ${{ steps.plan.outputs.private_dependency_used }}
      private_dependency_repository: ${{ steps.plan.outputs.private_dependency_repository }}
      private_dependency_sha: ${{ steps.plan.outputs.private_dependency_sha }}
      private_dependency_subdirectory: ${{ steps.plan.outputs.private_dependency_subdirectory }}
      private_dependency_id: ${{ steps.plan.outputs.private_dependency_id }}
    steps:
      - id: plan
        name: Resolve bounded Android live-service plan
        uses: StreamScapeTV/ci-workflows/actions/validate-android-live-service@8d8f72c41901e1f1d8fd257e6f7ce71d6c9a0bef # issue #443 package-read runtime checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          working_directory: ${{ inputs.working_directory }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

  live:
    name: Execute credentialed Android live-service acceptance
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      cleanup_result: ${{ steps.android_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - id: checkout
        name: Check out exact admitted Android source once
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated Gradle workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}

      - id: dependency
        name: Check out exact private dependency at most once
        if: needs.plan.outputs.private_dependency_used == 'true'
        uses: StreamScapeTV/ci-workflows/actions/checkout-private-dependency@70e08d4ddf8930046632a7135950e924b82e22bf # issue #104 immutable private-action checkpoint
        with:
          repository: ${{ needs.plan.outputs.private_dependency_repository }}
          admitted_sha: ${{ needs.plan.outputs.private_dependency_sha }}
          dependency_id: ${{ needs.plan.outputs.private_dependency_id }}
          expected_subpath: ${{ needs.plan.outputs.private_dependency_subdirectory }}
          fetch_depth: "1"
          token: ${{ secrets.private_dependency_token }}

      - id: execute
        name: Execute only the checked-in live-service gate
        uses: StreamScapeTV/ci-workflows/actions/validate-android-live-service@8d8f72c41901e1f1d8fd257e6f7ce71d6c9a0bef # issue #443 package-read runtime checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          working_directory: ${{ inputs.working_directory }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
          private_dependency_verified: ${{ steps.dependency.outputs.verified }}
          private_dependency_remotes_erased: ${{ steps.dependency.outputs.remotes_erased }}
          private_dependency_credentials_erased: ${{ steps.dependency.outputs.credentials_erased }}
          private_dependency_head_sha: ${{ steps.dependency.outputs.head_sha }}
          private_dependency_checkout_repository: ${{ steps.dependency.outputs.repository }}
          private_dependency_checkout_id: ${{ steps.dependency.outputs.dependency_id }}
          private_dependency_expected_subpath: ${{ steps.dependency.outputs.expected_subpath }}
          service_username: ${{ secrets.service_username }}
          service_password: ${{ secrets.service_password }}
          maven_package_read_token: ${{ secrets.maven_package_read_token }}

      - id: android_cleanup
        name: Remove live-service copied source state once
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-android-live-service@8d8f72c41901e1f1d8fd257e6f7ce71d6c9a0bef # issue #443 package-read runtime checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_plan_json: ${{ inputs.validation_plan_json }}

      - id: residue
        name: Verify zero live-service copied-source residue
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-android-live-service@8d8f72c41901e1f1d8fd257e6f7ce71d6c9a0bef # issue #443 package-read runtime checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_plan_json: ${{ inputs.validation_plan_json }}

      - id: workspace_cleanup
        name: Remove and verify the registered Gradle workspace
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: clean
        name: Verify admitted Android source remained exact and clean
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - id: terminal
        name: Project terminal live-service result
        if: always()
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          WORKSPACE: ${{ steps.workspace.outcome }}
          DEPENDENCY_REQUIRED: ${{ needs.plan.outputs.private_dependency_used }}
          DEPENDENCY: ${{ steps.dependency.outcome }}
          EXECUTE: ${{ steps.execute.outcome }}
          ANDROID_CLEANUP: ${{ steps.android_cleanup.outcome }}
          RESIDUE: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP: ${{ steps.workspace_cleanup.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          set -Eeuo pipefail
          dependency_ok=true
          if [[ "${DEPENDENCY_REQUIRED}" == true ]]; then
            test "${DEPENDENCY}" = success || dependency_ok=false
          fi
          if [[ "${PLAN}" == success && "${CHECKOUT}" == success && "${WORKSPACE}" == success && "${dependency_ok}" == true && "${EXECUTE}" == success && "${ANDROID_CLEANUP}" == success && "${RESIDUE}" == success && "${WORKSPACE_CLEANUP}" == success && "${CLEAN}" == success ]]; then
            echo 'result=success' >> "${GITHUB_OUTPUT}"
          else
            echo 'result=failure' >> "${GITHUB_OUTPUT}"
            exit 1
          fi
