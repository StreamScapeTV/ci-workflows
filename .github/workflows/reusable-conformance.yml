name: Reusable organization conformance report

on:
  workflow_call:
    inputs:
      repository_scope: {description: Optional checked-in project identifier; empty means every allowlisted project, required: false, type: string}
      shared_reference_target_sha: {description: Optional exact ci-workflows SHA used only to report reviewable shared-workflow repin proposals, required: false, type: string}
      dry_run: {description: Return findings without creating or updating the report issue, required: false, default: true, type: boolean}
      request_id: {description: Bounded request identifier, required: true, type: string}
    secrets:
      organization_read_token: {description: Least-privilege organization read token, required: false}
      organization_update_token: {description: Least-privilege issue-report update token, required: false}
    outputs:
      result: {value: '${{ jobs.report.outputs.result }}'}
      mutation_count: {value: '${{ jobs.report.outputs.mutation_count }}'}
      report_issue_url: {value: '${{ jobs.report.outputs.report_issue_url }}'}
      request_id: {value: '${{ jobs.report.outputs.request_id }}'}
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  report:
    name: Maintenance / Organization conformance
    runs-on: [linux, amd64, general]
    timeout-minutes: 90
    outputs:
      result: ${{ steps.report_read.outputs.result || steps.report_update.outputs.result }}
      mutation_count: ${{ steps.report_read.outputs.mutation_count || steps.report_update.outputs.mutation_count }}
      report_issue_url: ${{ steps.report_read.outputs.report_issue_url || steps.report_update.outputs.report_issue_url }}
      request_id: ${{ steps.report_read.outputs.request_id || steps.report_update.outputs.request_id }}
    steps:
      - name: Run read-only organization conformance
        id: report_read
        if: ${{ inputs.dry_run }}
        uses: StreamScapeTV/ci-workflows/actions/maintenance-conformance@d8d02c46c7abf7134786baa90c53f50db898d683 # issue #20 immutable maintenance action checkpoint
        with:
          repository_scope: ${{ inputs.repository_scope }}
          shared_reference_target_sha: ${{ inputs.shared_reference_target_sha }}
          dry_run: true
          request_id: ${{ inputs.request_id }}
          token: ${{ secrets.organization_read_token }}
      - name: Update organization conformance report
        id: report_update
        if: ${{ !inputs.dry_run }}
        uses: StreamScapeTV/ci-workflows/actions/maintenance-conformance@d8d02c46c7abf7134786baa90c53f50db898d683 # issue #20 immutable maintenance action checkpoint
        with:
          repository_scope: ${{ inputs.repository_scope }}
          shared_reference_target_sha: ${{ inputs.shared_reference_target_sha }}
          dry_run: false
          request_id: ${{ inputs.request_id }}
          token: ${{ secrets.organization_update_token }}
      - name: Cleanup maintenance workflow state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/ci-workflows-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${state}"
          test ! -e "${state}"
