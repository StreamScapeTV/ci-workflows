name: Reusable organization conformance report

on:
  workflow_call:
    inputs:
      repository_scope: {description: Optional checked-in project identifier; empty means every allowlisted project, required: false, type: string}
      dry_run: {description: Return findings without creating or updating the report issue, required: false, default: true, type: boolean}
      request_id: {description: Bounded request identifier, required: true, type: string}
    secrets:
      organization_read_token: {description: Least-privilege organization read token, required: false}
      organization_update_token: {description: Least-privilege issue-report update token, required: false}
    outputs:
      result: {value: '${{ jobs.report.outputs.result }}'}
      mutation_count: {value: '${{ jobs.report.outputs.mutation_count }}'}
      report_issue_url: {value: '${{ jobs.report.outputs.report_issue_url }}'}
      request_id: {value: '${{ jobs.report.outputs.request_id }}'}
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  report:
    name: Maintenance / Organization conformance
    runs-on: [linux, amd64, general]
    timeout-minutes: 90
    outputs:
      result: ${{ steps.report.outputs.result }}
      mutation_count: ${{ steps.report.outputs.mutation_count }}
      report_issue_url: ${{ steps.report.outputs.report_issue_url }}
      request_id: ${{ steps.report.outputs.request_id }}
    steps:
      - name: Run bounded organization conformance
        id: report
        uses: StreamScapeTV/ci-workflows/actions/maintenance-conformance@60881e6c2e673f1a80c1c78101f4610f9e05210c # issue #20 immutable maintenance action checkpoint
        with:
          repository_scope: ${{ inputs.repository_scope }}
          dry_run: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
          token: ${{ inputs.dry_run && secrets.organization_read_token || secrets.organization_update_token }}
      - name: Cleanup maintenance workflow state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/ci-workflows-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${state}"
          test ! -e "${state}"
