name: Flutter validation smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/reusable-flutter.yml"
      - ".github/workflows/flutter-validation-smoke.yml"
      - "actions/validate-flutter/**"
      - "contracts/flutter-validation.json"
      - "scripts/ci/flutter.py"
      - "src/ci_workflows/flutter*.py"
      - "src/ci_workflows/ciw_flutter.py"
      - "tests/fixtures/flutter-validation/**"
      - "tests/test_flutter_validation.py"
      - "tests/test_flutter_workflow_contract.py"
      - "docs/workflows/flutter.md"
      - "docs/architecture/flutter-validation.md"

concurrency:
  group: flutter-validation-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  source_audit:
    name: Flutter portable source-audit smoke
    runs-on: portable
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - name: Prepare synthetic source without installing Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -R .ciw/tests/fixtures/flutter-validation/smoke source
      - id: workspace
        name: Prepare isolated state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: minimal
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - id: flutter
        name: Execute no-install source audit
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          platform: flutter
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove Flutter-specific source-audit state
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_residue
        name: Verify zero Flutter-specific source-audit residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: workspace_cleanup
        name: Cleanup source audit
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  focused_tests:
    name: Flutter focused contract tests
    runs-on: portable
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - name: Compile and run all focused Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            python3 -m py_compile \
              scripts/ci/flutter.py \
              src/ci_workflows/flutter.py \
              src/ci_workflows/flutter_contract.py \
              src/ci_workflows/flutter_execution.py \
              src/ci_workflows/flutter_types.py \
              src/ci_workflows/ciw_flutter.py \
              tests/test_flutter_validation.py \
              tests/test_flutter_workflow_contract.py
            PYTHONPATH=src python3 -m unittest -v \
              tests.test_flutter_validation \
              tests.test_flutter_workflow_contract
            test -z "$(git status --porcelain --untracked-files=all)"
          )

  android:
    name: Flutter mobile Android debug smoke
    runs-on: mobile
    timeout-minutes: 100
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Android smoke state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - name: Set up exact smoke Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: "3.41.4"
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-3.41.4', env.CI_TOOL_ROOT) }}
          pub-cache-path: ${{ format('{0}/.pub-cache', env.HOME) }}
      - name: Create disposable contract-owned Android smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter create --no-pub --platforms=android --project-name ciw_flutter_smoke source
          (cd source && flutter pub get --enforce-lockfile)
          test -f source/pubspec.lock
      - id: flutter
        name: Execute real Android debug smoke
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          platform: android
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove Flutter-specific Android state
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_residue
        name: Verify zero Flutter-specific Android residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: workspace_cleanup
        name: Remove all Android smoke state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  ios:
    name: Flutter Apple iOS simulator smoke
    runs-on: apple
    timeout-minutes: 100
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated Apple smoke state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: apple
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - name: Set up exact smoke Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: "3.41.4"
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-3.41.4', env.CI_TOOL_ROOT) }}
          pub-cache-path: ${{ format('{0}/.pub-cache', env.HOME) }}
      - name: Create disposable contract-owned iOS smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter create --no-pub --platforms=ios --project-name ciw_flutter_smoke source
          (cd source && flutter pub get --enforce-lockfile)
          test -f source/pubspec.lock
      - id: flutter
        name: Execute real unsigned iOS simulator smoke
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          platform: ios-simulator
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove Flutter-specific Apple state
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_residue
        name: Verify zero Flutter-specific Apple residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: ios-simulator
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: workspace_cleanup
        name: Remove all Apple smoke state
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  zero_artifacts:
    name: Verify routine artifacts remain zero
    needs: [source_audit, focused_tests, android, ios]
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require all smoke paths and zero Actions artifacts
        env:
          SOURCE_RESULT: ${{ needs.source_audit.result }}
          FOCUSED_RESULT: ${{ needs.focused_tests.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${SOURCE_RESULT}" = success
          test "${FOCUSED_RESULT}" = success
          test "${ANDROID_RESULT}" = success
          test "${IOS_RESULT}" = success
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Flutter smoke retained Actions artifacts")
          print("Routine Flutter Actions artifacts verified: zero.")
          PY
