name: Flutter validation smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/reusable-flutter.yml"
      - ".github/workflows/flutter-validation-smoke.yml"
      - ".github/workflows/flutter-apple-validation-smoke.yml"
      - "actions/validate-flutter/**"
      - "contracts/flutter-validation.json"
      - "scripts/ci/flutter.py"
      - "src/ci_workflows/flutter*.py"
      - "src/ci_workflows/ciw_flutter.py"
      - "tests/fixtures/flutter-validation/**"
      - "tests/test_flutter_validation.py"
      - "tests/test_flutter_workflow_contract.py"
      - "docs/workflows/flutter.md"
      - "docs/architecture/flutter-validation.md"

concurrency:
  group: flutter-validation-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  source_audit:
    name: Flutter portable source-audit smoke
    runs-on: portable
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - name: Prepare synthetic source without installing Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -R .ciw/tests/fixtures/flutter-validation/smoke source
      - id: workspace
        name: Prepare isolated state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: minimal
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - id: flutter
        name: Execute no-install source audit
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          platform: flutter
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove Flutter-specific source-audit state
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          source_trust: trusted-pr
          primary_failure_code: ${{ steps.flutter.outputs.primary_failure_code || steps.flutter.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific source-audit residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: source-audit
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: workspace_cleanup
        name: Cleanup source audit
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  focused_tests:
    name: Flutter focused contract tests
    runs-on: portable
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - name: Compile, parse, check generated bytes, and run focused Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            python3 -m py_compile \
              scripts/ci/flutter.py \
              src/ci_workflows/flutter.py \
              src/ci_workflows/flutter_contract.py \
              src/ci_workflows/flutter_execution.py \
              src/ci_workflows/flutter_types.py \
              src/ci_workflows/ciw_flutter.py \
              tests/test_flutter_validation.py \
              tests/test_flutter_workflow_contract.py
            python3 scripts/ci/flutter.py generate --check
            python3 -m json.tool contracts/flutter-validation.json >/dev/null
            python3 -m json.tool tests/fixtures/flutter-validation/runtime-3.41.4.json >/dev/null
            python3 -m json.tool tests/fixtures/flutter-validation/runtime-3.44.6.json >/dev/null
            PYTHONPATH=src python3 -m unittest -v \
              tests.test_flutter_validation \
              tests.test_flutter_workflow_contract
            test -z "$(git status --porcelain --untracked-files=all)"
          )

  plan:
    name: Resolve Flutter mobile smoke selector and toolchain tuple
    runs-on: portable
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
      gradle_version: ${{ steps.plan.outputs.gradle_version }}
      jdk_distribution: ${{ steps.plan.outputs.jdk_distribution }}
      jdk_version: ${{ steps.plan.outputs.jdk_version }}
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: plan
        name: Resolve contract-owned mobile selector and immutable tuple
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: plan
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          platform: android
          source_trust: trusted-pr

  android:
    name: Flutter mobile Android debug smoke
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 100
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact pull request source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          (cd .ciw && test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}")
      - id: workspace
        name: Prepare isolated mobile state
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ github.event.pull_request.head.sha }}
          trust_mode: trusted-pr
      - id: persistent_cache_snapshot
        name: Snapshot persistent host pub cache before Flutter setup
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: persistent-cache-snapshot
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Set up exact contract-owned compatible JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ needs.plan.outputs.jdk_distribution }}
          java-version: ${{ needs.plan.outputs.jdk_version }}
      - name: Set up exact immutable Flutter runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # reviewed 2026-03-25
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: false
          cache-path: ${{ format('{0}/flutter-sdk-{1}', env.CI_TOOL_ROOT, needs.plan.outputs.flutter_version) }}
          pub-cache-path: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
      - id: pub_cache_bind
        name: Force Flutter pub cache beneath registered state
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: pub-cache-bind
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: toolchain
        name: Verify exact Java Javac Flutter and Dart before project generation
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: verify-toolchain
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - name: Create contract-owned Android smoke source with isolated pub state
        shell: bash
        env:
          EXPECTED_PUB_CACHE: ${{ format('{0}/tmp/flutter-validation/pub-cache', env.CI_WORKFLOW_ROOT) }}
          EXPECTED_GRADLE: ${{ needs.plan.outputs.gradle_version }}
        run: |
          set -Eeuo pipefail
          test "${PUB_CACHE}" = "${EXPECTED_PUB_CACHE}"
          test -d "${PUB_CACHE}"
          test ! -L "${PUB_CACHE}"
          flutter create --no-pub --platforms=android --project-name ciw_flutter_smoke source
          test "${PUB_CACHE}" = "${EXPECTED_PUB_CACHE}"
          test -d "${PUB_CACHE}"
          test ! -L "${PUB_CACHE}"
          (cd source && flutter pub get)
          test -f source/pubspec.lock
          grep -F "gradle-${EXPECTED_GRADLE}-all.zip" \
            source/android/gradle/wrapper/gradle-wrapper.properties
      - id: flutter
        name: Execute bounded Android debug validation
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: execute
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          platform: android
          source_trust: trusted-pr
      - id: persistent_cache_verify
        name: Prove persistent host pub cache is unchanged
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: persistent-cache-verify
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: flutter_cleanup
        name: Remove registered Flutter and pub state and preserve primary failure
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: cleanup
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
          primary_failure_code: ${{ steps.flutter.outputs.primary_failure_code || steps.flutter.outputs.failure_code }}
      - id: flutter_residue
        name: Verify zero Flutter-specific and pub-cache residue
        if: always()
        uses: ./.ciw/actions/validate-flutter
        with:
          phase: residue
          admitted_sha: ${{ github.event.pull_request.head.sha }}
          validation_profile: android-debug
          command_profile: synthetic-smoke
          source_trust: trusted-pr
      - id: workspace_cleanup
        name: Cleanup mobile workspace
        if: always()
        uses: ./.ciw/actions/cleanup-workspace

  zero_artifacts:
    name: Verify mobile routine artifacts remain zero
    needs: [source_audit, focused_tests, plan, android]
    if: always()
    runs-on: portable
    timeout-minutes: 10
    steps:
      - name: Require mobile smoke paths and zero Actions artifacts
        env:
          SOURCE_RESULT: ${{ needs.source_audit.result }}
          FOCUSED_RESULT: ${{ needs.focused_tests.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${SOURCE_RESULT}" = success
          test "${FOCUSED_RESULT}" = success
          test "${PLAN_RESULT}" = success
          test "${ANDROID_RESULT}" = success
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get("total_count") != 0 or payload.get("artifacts"):
              raise SystemExit("Flutter mobile smoke retained Actions artifacts")
          print("Routine Flutter mobile Actions artifacts verified: zero.")
          PY
