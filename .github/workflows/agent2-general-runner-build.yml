name: Agent 2 general image proof
on: pull_request
permissions:
  contents: read
jobs:
  validate:
    runs-on: [linux, amd64, buildah, medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 runner-images/general/trace_inputs.py
