name: Reusable network download

on:
  workflow_call:
    inputs:
      url:
        description: HTTPS URL for the dependency object
        required: true
        type: string
      relative_path:
        description: Relative download path beneath registered dependency state
        required: false
        default: dependency.bin
        type: string
      expected_sha256:
        description: Optional exact SHA-256 for the downloaded object
        required: false
        default: ""
        type: string
      expected_size:
        description: Optional exact byte size; empty disables the exact-size check
        required: false
        default: ""
        type: string
      expected_content_type:
        description: Optional exact HTTP media type without parameters
        required: false
        default: ""
        type: string
      maximum_bytes:
        description: Maximum accepted download size in bytes
        required: false
        default: 536870912
        type: number
      archive_format:
        description: none, zip, or tar
        required: false
        default: none
        type: string
      relative_destination:
        description: Relative extraction directory beneath registered generated state
        required: false
        default: extracted
        type: string
    outputs:
      result:
        description: Success only when the requested operation and terminal cleanup succeed
        value: ${{ jobs.network.outputs.result }}
      download_result_json:
        description: Bounded machine-readable download result
        value: ${{ jobs.network.outputs.download_result_json }}
      extraction_result_json:
        description: Bounded extraction result, or empty when extraction was not requested
        value: ${{ jobs.network.outputs.extraction_result_json }}
      cleanup_result:
        description: Terminal registered-workspace cleanup result
        value: ${{ jobs.network.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  network:
    name: CI / Network download
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 15
    outputs:
      result: ${{ steps.download.outcome == 'success' && (inputs.archive_format == 'none' || steps.extract.outcome == 'success') && steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
      download_result_json: ${{ steps.download.outputs.network_result_json }}
      extraction_result_json: ${{ steps.extract.outputs.network_result_json }}
      cleanup_result: ${{ steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - id: workspace
        name: Prepare isolated marker-bound network state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: minimal
          cache_mode: disabled

      - id: download
        name: Download and verify bounded dependency
        uses: StreamScapeTV/ci-workflows/actions/network@d090f1e37acc5b75ba3abd7928721ac993c9e6fd # issue #363 immutable network checkpoint
        with:
          operation: download
          url: ${{ inputs.url }}
          relative_path: ${{ inputs.relative_path }}
          expected_sha256: ${{ inputs.expected_sha256 }}
          expected_size: ${{ inputs.expected_size }}
          expected_content_type: ${{ inputs.expected_content_type }}
          maximum_bytes: ${{ inputs.maximum_bytes }}

      - id: extract
        name: Extract verified dependency archive
        if: inputs.archive_format != 'none'
        uses: StreamScapeTV/ci-workflows/actions/network@d090f1e37acc5b75ba3abd7928721ac993c9e6fd # issue #363 immutable network checkpoint
        with:
          operation: extract
          relative_path: ${{ inputs.relative_path }}
          archive_format: ${{ inputs.archive_format }}
          relative_destination: ${{ inputs.relative_destination }}

      - id: cleanup
        name: Remove and verify all registered network state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
