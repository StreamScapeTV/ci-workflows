name: Reusable service and Compose validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase caller source SHA to validate
        required: true
        type: string
      working_directory:
        description: Repository-relative Compose project root
        required: false
        default: .
        type: string
      compose_file:
        description: Compose YAML path beneath the working directory
        required: true
        type: string
      services_json:
        description: JSON array of Compose service names; empty selects the whole project
        required: false
        default: "[]"
        type: string
      env_files_json:
        description: JSON array of checked-in Compose env-file paths
        required: false
        default: "[]"
        type: string
      readiness_json:
        description: Bounded JSON array of typed service readiness checks
        required: true
        type: string
      validation_script_path:
        description: Repository-relative executable validation script
        required: true
        type: string
      validation_timeout_seconds:
        description: Validation-script timeout in seconds
        required: false
        default: "900"
        type: string
    outputs:
      result:
        description: Success only after validation and all cleanup checks succeed
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded non-secret service/readiness summary
        value: ${{ jobs.validate.outputs.test_summary }}
      cleanup_result:
        description: Success only after Compose and workspace cleanup succeed
        value: ${{ jobs.validate.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  plan:
    name: Admit exact source and select Compose capacity
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 5
    outputs:
      runs_on_json: ${{ steps.capacity.outputs.runs_on_json }}
    steps:
      - name: Admit exact same-repository source for container validation
        shell: bash
        env:
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -Eeuo pipefail
          [[ "${ADMITTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::admitted_sha must be an exact lowercase commit SHA' >&2
            exit 2
          }
          case "${EVENT_NAME}" in
            pull_request)
              [[ -n "${PR_HEAD_REPOSITORY}" && "${PR_HEAD_REPOSITORY}" == "${CALLER_REPOSITORY}" ]] || {
                echo '::error::service/Compose validation rejects fork pull requests' >&2
                exit 2
              }
              ;;
            push|workflow_dispatch|workflow_call) ;;
            *)
              echo '::error::service/Compose validation requires an exact trusted repository source' >&2
              exit 2
              ;;
          esac

      - id: capacity
        name: Select the bounded daemonless Compose runner
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'runs_on_json=%s\n' '["linux","amd64","buildah","small"]' >> "${GITHUB_OUTPUT}"

  validate:
    name: CI / Service Compose validation
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.execute.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.clean.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      cleanup_result: ${{ steps.execute.outputs.cleanup_result == 'success' && steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - name: Check out exact admitted caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.admitted_sha }}
          path: source
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact admitted caller source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - name: Check out exact Central reusable-workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ github.workflow_sha }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact Central workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd .ciw
            test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

      - name: Prepare one isolated container workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable checkpoint
        with:
          profile: container
          cache_mode: disabled

      - name: Verify pre-provisioned daemonless Compose runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          podman --version
          podman-compose --version
          podman compose version

      - id: execute
        name: Start services, wait, validate, diagnose failures, and tear down
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/.ciw/src
          INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_COMPOSE_FILE: ${{ inputs.compose_file }}
          INPUT_COMPOSE_TOOL: podman
          INPUT_SERVICES_JSON: ${{ inputs.services_json }}
          INPUT_ENV_FILES_JSON: ${{ inputs.env_files_json }}
          INPUT_READINESS_JSON: ${{ inputs.readiness_json }}
          INPUT_VALIDATION_SCRIPT_PATH: ${{ inputs.validation_script_path }}
          INPUT_VALIDATION_TIMEOUT_SECONDS: ${{ inputs.validation_timeout_seconds }}
        run: |
          set -Eeuo pipefail
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE}/source" \
            python3 .ciw/scripts/ci/ciw.py compose validate

      - id: cleanup
        name: Remove and verify all registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable checkpoint

      - name: Remove exact Central helper checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .ciw
          test ! -e .ciw

      - id: clean
        name: Verify exact caller source remained clean after cleanup
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.admitted_sha }}
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )
