name: Reusable service and Compose validation

on:
  workflow_call:
    inputs:
      admitted_sha:
        description: Exact lowercase caller source SHA to validate
        required: true
        type: string
      working_directory:
        description: Repository-relative Compose project root
        required: false
        default: .
        type: string
      validation_plan_json:
        description: Bounded product-owned Compose topology, readiness and validation plan
        required: true
        type: string
    outputs:
      result:
        description: Success only after validation and all cleanup checks succeed
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded non-secret service/readiness summary
        value: ${{ jobs.validate.outputs.test_summary }}
      cleanup_result:
        description: Success only after Compose and workspace cleanup succeed
        value: ${{ jobs.validate.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  plan:
    name: Admit exact source before Compose capacity
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 5
    steps:
      - name: Admit exact same-repository source for container validation
        shell: bash
        env:
          ADMITTED_SHA: ${{ inputs.admitted_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -Eeuo pipefail
          [[ "${ADMITTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::admitted_sha must be an exact lowercase commit SHA' >&2
            exit 2
          }
          case "${EVENT_NAME}" in
            pull_request)
              [[ -n "${PR_HEAD_REPOSITORY}" && "${PR_HEAD_REPOSITORY}" == "${CALLER_REPOSITORY}" ]] || {
                echo '::error::service/Compose validation rejects fork pull requests' >&2
                exit 2
              }
              ;;
            push|workflow_dispatch|workflow_call) ;;
            *)
              echo '::error::service/Compose validation requires an exact trusted repository source' >&2
              exit 2
              ;;
          esac

  validate:
    name: CI / Service Compose validation
    needs: plan
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.compose.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.clean.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.compose.outputs.test_summary }}
      cleanup_result: ${{ steps.compose.outputs.cleanup_result == 'success' && steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - name: Verify pre-provisioned daemonless Compose runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          podman --version
          podman-compose --version
          podman compose version

      - name: Check out exact admitted caller source once
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated container workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: container
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}

      - id: compose
        name: Start services, wait, validate, diagnose failures, and tear down
        uses: StreamScapeTV/ci-workflows/actions/validate-service-compose@8b4d61b8ce0863e0d5efa806c1b39922d145402a # issue #359 Compose adapter checkpoint
        with:
          admitted_sha: ${{ inputs.admitted_sha }}
          working_directory: ${{ inputs.working_directory }}
          validation_plan_json: ${{ inputs.validation_plan_json }}

      - id: cleanup
        name: Remove and verify all registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: clean
        name: Verify exact caller source remained clean after cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )
