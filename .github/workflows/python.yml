name: Python CI

"on":
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      test_profile:
        type: string
        required: true
      ci_run_id:
        type: string
        required: false
        default: ""
      upload_private_log:
        type: boolean
        required: false
        default: false
    secrets:
      SOURCE_APP_ID:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
      AGENT_STATE_SUPABASE_URL:
        required: false
      AGENT_STATE_SUPABASE_SECRET_KEY:
        required: false
      GOOGLE_DRIVE_CI_LOGS_FOLDER_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_ID:
        required: false
      GOOGLE_DRIVE_CLIENT_SECRET:
        required: false
      GOOGLE_DRIVE_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Initialize CI log
        shell: bash
        run: |
          log="${RUNNER_TEMP}/central-ci.log"
          : > "${log}"
          printf 'CI_LOG=%s\n' "${log}" >> "${GITHUB_ENV}"

      - name: Mark Agent State run as running
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: start
          ci_run_id: ${{ inputs.ci_run_id }}

      - name: Prepare source token
        id: source
        if: ${{ inputs.repository != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: StreamScapeTV

      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.source.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve observed source SHA
        id: source_identity
        if: ${{ inputs.ci_run_id != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record observed source SHA
        if: ${{ inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: observe-source
          ci_run_id: ${{ inputs.ci_run_id }}
          observed_source_sha: ${{ steps.source_identity.outputs.source_sha }}

      - name: Resolve source Python version
        id: python_version
        shell: bash
        run: |
          set -Eeuo pipefail
          version='3.x'
          if test -f .python-version; then
            test "$(wc -l < .python-version | tr -d '[:space:]')" = '1'
            version="$(tr -d '\r\n' < .python-version)"
            [[ "${version}" =~ ^3\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || {
              echo '.python-version must contain exactly one bounded CPython 3.x.y version' >&2
              exit 2
            }
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up source Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python_version.outputs.version }}

      - name: Run fixed Python profile
        id: commands
        shell: bash
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_REF: ${{ inputs.ref || github.ref_name }}
          GITHUB_TOKEN: ${{ inputs.test_profile == 'agent-state-issue-reconcile' && inputs.repository == 'StreamScapeTV/agent-state-supabase' && inputs.ref == 'main' && steps.source.outputs.token || '' }}
          SUPABASE_URL: ${{ inputs.test_profile == 'agent-state-issue-reconcile' && inputs.repository == 'StreamScapeTV/agent-state-supabase' && inputs.ref == 'main' && secrets.AGENT_STATE_SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.test_profile == 'agent-state-issue-reconcile' && inputs.repository == 'StreamScapeTV/agent-state-supabase' && inputs.ref == 'main' && secrets.AGENT_STATE_SUPABASE_SECRET_KEY || '' }}
        run: |
          set -Eeuo pipefail
          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "$label" >> "$CI_LOG"
            if ! "$@" >> "$CI_LOG" 2>&1; then
              printf '%s failed; inspect the private Google Drive CI log.\n' "$label" >&2
              return 1
            fi
          }

          run_backend_postgres() {
            printf '\n===== backend-postgres =====\n' >> "$CI_LOG"
            if ! (
              set -Eeuo pipefail
              local container="ciw-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              cleanup_postgres() {
                docker rm -f "$container" >/dev/null 2>&1 || true
              }
              trap cleanup_postgres EXIT

              docker run --detach --rm \
                --name "$container" \
                --env POSTGRES_USER=ciw \
                --env POSTGRES_DB=ciw \
                --env POSTGRES_HOST_AUTH_METHOD=trust \
                --publish 127.0.0.1:55432:5432 \
                postgres:17-alpine >/dev/null

              ready=false
              for _ in $(seq 1 60); do
                if docker exec "$container" pg_isready -U ciw -d ciw >/dev/null 2>&1; then
                  ready=true
                  break
                fi
                sleep 1
              done
              test "$ready" = true
              test -x scripts/run_backend_postgres_validation.sh
              export CIW_POSTGRES_URL="postgresql://ciw@127.0.0.1:55432/ciw"
              ./scripts/run_backend_postgres_validation.sh

              docker rm -f "$container" >/dev/null
              trap - EXIT
              ! docker inspect "$container" >/dev/null 2>&1
            ) >> "$CI_LOG" 2>&1; then
              printf 'backend-postgres failed; inspect the private Google Drive CI log.\n' >&2
              return 1
            fi
          }

          if [[ -f requirements.txt ]]; then
            run_logged dependencies python -m pip install --disable-pip-version-check -r requirements.txt
          fi
          case "$TEST_PROFILE" in
            compile) run_logged compile python -m compileall -q . ;;
            unit) run_logged unit python -m pytest ;;
            valkey)
              valkey_container="ciw-valkey-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              cleanup_valkey() {
                docker rm -f "$valkey_container" >/dev/null 2>&1 || true
              }
              trap cleanup_valkey EXIT
              docker run --detach --rm \
                --name "$valkey_container" \
                --publish 127.0.0.1:16379:6379 \
                valkey/valkey:8-alpine >> "$CI_LOG" 2>&1
              valkey_ready=false
              for _ in {1..30}; do
                if docker exec "$valkey_container" valkey-cli ping 2>/dev/null | grep -qx PONG; then
                  valkey_ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$valkey_ready" != true ]]; then
                echo "Valkey test service did not become ready." >&2
                exit 1
              fi
              export CIW_VALKEY_URL="redis://127.0.0.1:16379/0"
              run_logged valkey python -m pytest
              cleanup_valkey
              trap - EXIT
              if docker ps -a --filter "name=^/${valkey_container}$" --format '{{.Names}}' | grep -q .; then
                echo "Valkey test service cleanup failed." >&2
                exit 1
              fi
              ;;
            release-gates)
              test -f scripts/run_release_gates.sh
              run_logged release-gates bash scripts/run_release_gates.sh
              ;;
            backend-full)
              test -x scripts/run_backend_validation.sh
              run_logged backend-full ./scripts/run_backend_validation.sh
              ;;
            backend-postgres)
              run_backend_postgres
              ;;
            agent-state-issue-reconcile)
              test "${SOURCE_REPOSITORY}" = "StreamScapeTV/agent-state-supabase" || {
                echo "agent-state-issue-reconcile is restricted to StreamScapeTV/agent-state-supabase" >&2
                exit 2
              }
              test "${SOURCE_REF}" = "main" || {
                echo "agent-state-issue-reconcile is restricted to protected main" >&2
                exit 2
              }
              test -n "${GITHUB_TOKEN}" && test -n "${SUPABASE_URL}" && test -n "${SUPABASE_SERVICE_ROLE_KEY}" || {
                echo "agent-state-issue-reconcile requires the existing Central source-app and Agent State service credentials" >&2
                exit 2
              }
              test -f scripts/reconcile_github_issue_inventory.py
              run_logged agent-state-issue-reconcile-dry-run \
                python scripts/reconcile_github_issue_inventory.py --owner StreamScapeTV

              apply_result="${RUNNER_TEMP}/agent-state-issue-reconcile-apply.jsonl"
              printf '\n===== agent-state-issue-reconcile-apply =====\n' >> "$CI_LOG"
              if ! python scripts/reconcile_github_issue_inventory.py \
                --owner StreamScapeTV --apply > "$apply_result" 2>&1; then
                cat "$apply_result" >> "$CI_LOG"
                echo "agent-state-issue-reconcile apply failed; inspect the private Google Drive CI log." >&2
                exit 1
              fi
              cat "$apply_result" >> "$CI_LOG"
              python3 - "$apply_result" <<'PY_ASSERT_RECONCILE' >> "$CI_LOG"
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          after_rows = [row for row in rows if isinstance(row, dict) and isinstance(row.get("after"), dict)]
          if not after_rows:
              raise SystemExit("agent-state-issue-reconcile produced no authoritative post-apply repository reads")
          violations = []
          for row in after_rows:
              after = row["after"]
              for key in ("missing", "extra", "github_navigation_mismatches"):
                  values = after.get(key)
                  if values:
                      violations.append({"repository": row.get("repository"), key: values})
          summaries = [row for row in rows if row.get("mode") == "apply"]
          if not summaries or summaries[-1].get("ok") is not True:
              violations.append({"summary": "missing or unsuccessful apply summary"})
          if violations:
              raise SystemExit("post-apply GitHub/Agent State equality failed: " + json.dumps(violations, sort_keys=True))
          print(json.dumps({"ok": True, "exact_post_apply_repositories": len(after_rows)}, sort_keys=True))
          PY_ASSERT_RECONCILE
              ;;
            *) echo "Unsupported Python test_profile: $TEST_PROFILE" >&2; exit 2 ;;
          esac

      - name: Scrub configured CI secrets from private log
        id: scrub
        if: ${{ always() }}
        shell: bash
        env:
          CI_SECRET_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
          CI_SECRET_SOURCE_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          CI_SECRET_AGENT_STATE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          CI_SECRET_AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
          CI_SECRET_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
          CI_SECRET_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CI_SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          CI_SECRET_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_REDACT'
          import os
          from pathlib import Path

          path = Path(os.environ["CI_LOG"])
          data = path.read_bytes()
          for name, value in os.environ.items():
              if not name.startswith("CI_SECRET_") or not value:
                  continue
              raw = value.encode()
              data = data.replace(raw, b"[REDACTED]")
              escaped = value.replace("\n", "\\n").encode()
              if escaped != raw:
                  data = data.replace(escaped, b"[REDACTED]")
          path.write_bytes(data)
          PY_REDACT

      - name: Upload CI log to Google Drive
        id: drive
        if: ${{ always() && steps.scrub.outcome == 'success' && (inputs.ci_run_id != '' || inputs.upload_private_log) }}
        uses: StreamScapeTV/ci-workflows/actions/google-drive@main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CI_LOGS_FOLDER_ID }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          file_path: ${{ runner.temp }}/central-ci.log
          file_name: ${{ github.run_id }}-${{ github.run_attempt }}.txt
          mime_type: text/plain

      - name: Finish Agent State run
        if: ${{ always() && inputs.ci_run_id != '' }}
        uses: StreamScapeTV/ci-workflows/actions/agent-state@main
        env:
          AGENT_STATE_SUPABASE_URL: ${{ secrets.AGENT_STATE_SUPABASE_URL }}
          AGENT_STATE_SUPABASE_SECRET_KEY: ${{ secrets.AGENT_STATE_SUPABASE_SECRET_KEY }}
        with:
          phase: finish
          ci_run_id: ${{ inputs.ci_run_id }}
          status: ${{ steps.commands.outcome == 'success' && steps.scrub.outcome == 'success' && steps.drive.outcome == 'success' && 'succeeded' || 'failed' }}
