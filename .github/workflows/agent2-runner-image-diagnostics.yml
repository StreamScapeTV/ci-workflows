name: Agent 2 general runner OCI validation

on:
  pull_request:
    paths:
      - .github/workflows/agent2-runner-image-diagnostics.yml
      - runner-images/general/**
      - .ciw/oci-build-inputs/runner-general-linux-amd64.json
      - contracts/oci-products.json
      - generated/oci-engine-mapping.json

permissions:
  contents: read

jobs:
  validate-general-runner:
    name: Validate general runner through central OCI engine
    runs-on: [linux, amd64, buildah, medium]
    timeout-minutes: 120
    env:
      INPUT_ADMITTED_SHA: ${{ github.event.pull_request.head.sha }}
      INPUT_PRODUCT_ID: runner-general
      INPUT_PLATFORM_SET: linux-amd64
      INPUT_RELEASE_VERSION: 0.1.0
      INPUT_ARTIFACT_EXCEPTION_ID: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${INPUT_ADMITTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate product plan and generated mapping
        shell: bash
        run: python3 scripts/ci/ciw.py oci validate --phase plan --source-root .

      - id: execute
        name: Build and inspect exact source without publication
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci/ciw.py oci validate --phase execute --source-root .

      - id: cleanup
        name: Remove OCI build state
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci/ciw.py oci validate --phase cleanup --source-root .

      - id: residue
        name: Verify zero OCI residue
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci/ciw.py oci validate --phase residue --source-root .

      - name: Project terminal validation status
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
        run: |
          set -Eeuo pipefail
          test "${EXECUTE_OUTCOME}" = success
          test "${CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
