name: Agent 2 runner image diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/agent2-runner-image-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect-zstd-source:
    name: Inspect zstd source input
    runs-on: [linux, amd64, buildah, tiny]
    timeout-minutes: 10
    steps:
      - name: Hash public zstd source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          file="${RUNNER_TEMP}/zstd-1.5.7.tar.gz"
          curl --fail --silent --show-error --location https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz --output "${file}"
          sha256sum "${file}"
          wc -c "${file}"
          rm -f "${file}"
