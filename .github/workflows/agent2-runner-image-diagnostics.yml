name: Agent 2 runner image diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/agent2-runner-image-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect-kubectl-input:
    name: Inspect kubectl input checksum
    runs-on: [linux, amd64, buildah, tiny]
    timeout-minutes: 10
    steps:
      - name: Read published kubectl v1.36.3 SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          checksum="$(curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl.sha256)"
          printf 'KUBECTL_SHA256=%s\n' "${checksum}"
