name: Agent 2 runner image diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/agent2-runner-image-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect-runner-bases:
    name: Inspect general runner OCI identities
    runs-on: [linux, amd64, buildah, tiny]
    timeout-minutes: 10
    steps:
      - name: Resolve runner base
        shell: bash
        run: |
          set -Eeuo pipefail
          skopeo inspect --raw docker://ghcr.io/actions/actions-runner:2.336.0 > "${RUNNER_TEMP}/index.json"
          root="$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/actions/actions-runner:2.336.0)"
          child="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${RUNNER_TEMP}/index.json")"
          skopeo inspect --raw "docker://ghcr.io/actions/actions-runner@${child}" > "${RUNNER_TEMP}/manifest.json"
          config="$(jq -er '.config.digest' "${RUNNER_TEMP}/manifest.json")"
          printf 'RUNNER_ROOT_DIGEST=%s\nRUNNER_AMD64_MANIFEST_DIGEST=%s\nRUNNER_AMD64_CONFIG_DIGEST=%s\n' "${root}" "${child}" "${config}"
      - name: Resolve Node base
        shell: bash
        run: |
          set -Eeuo pipefail
          skopeo inspect --raw docker://docker.io/library/node:24.18.0-bookworm-slim > "${RUNNER_TEMP}/index.json"
          root="$(skopeo inspect --format '{{.Digest}}' docker://docker.io/library/node:24.18.0-bookworm-slim)"
          child="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${RUNNER_TEMP}/index.json")"
          skopeo inspect --raw "docker://docker.io/library/node@${child}" > "${RUNNER_TEMP}/manifest.json"
          config="$(jq -er '.config.digest' "${RUNNER_TEMP}/manifest.json")"
          printf 'NODE_ROOT_DIGEST=%s\nNODE_AMD64_MANIFEST_DIGEST=%s\nNODE_AMD64_CONFIG_DIGEST=%s\n' "${root}" "${child}" "${config}"
      - name: Resolve Python base
        shell: bash
        run: |
          set -Eeuo pipefail
          skopeo inspect --raw docker://docker.io/library/python:3.14.7-slim-bookworm > "${RUNNER_TEMP}/index.json"
          root="$(skopeo inspect --format '{{.Digest}}' docker://docker.io/library/python:3.14.7-slim-bookworm)"
          child="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${RUNNER_TEMP}/index.json")"
          skopeo inspect --raw "docker://docker.io/library/python@${child}" > "${RUNNER_TEMP}/manifest.json"
          config="$(jq -er '.config.digest' "${RUNNER_TEMP}/manifest.json")"
          printf 'PYTHON_ROOT_DIGEST=%s\nPYTHON_AMD64_MANIFEST_DIGEST=%s\nPYTHON_AMD64_CONFIG_DIGEST=%s\n' "${root}" "${child}" "${config}"
      - name: Resolve GCC base
        shell: bash
        run: |
          set -Eeuo pipefail
          skopeo inspect --raw docker://docker.io/library/gcc:13.4.0-bookworm > "${RUNNER_TEMP}/index.json"
          root="$(skopeo inspect --format '{{.Digest}}' docker://docker.io/library/gcc:13.4.0-bookworm)"
          child="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${RUNNER_TEMP}/index.json")"
          skopeo inspect --raw "docker://docker.io/library/gcc@${child}" > "${RUNNER_TEMP}/manifest.json"
          config="$(jq -er '.config.digest' "${RUNNER_TEMP}/manifest.json")"
          printf 'GCC_ROOT_DIGEST=%s\nGCC_AMD64_MANIFEST_DIGEST=%s\nGCC_AMD64_CONFIG_DIGEST=%s\n' "${root}" "${child}" "${config}"
