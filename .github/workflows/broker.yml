name: Broker release

"on":
  push:
    tags: ["ci-broker-*"]
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: git.faruqi.dev
  IMAGE: git.faruqi.dev/mimranfaruqi/ci-workflows/ci-broker
  CHART_REGISTRY: oci://git.faruqi.dev/mimranfaruqi/ci-workflows/helm-charts

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.release_tag) }}
          persist-credentials: false

      - name: Resolve exact broker release
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          case "${TAG}" in ci-broker-*) version="${TAG#ci-broker-}" ;; *) exit 2 ;; esac
          source_sha="$(git rev-parse HEAD)"
          test -n "${version}"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

  image:
    needs: resolve
    runs-on: [linux, amd64, buildah, small]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      REGISTRY_USER: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - name: Connect to private Git service
        uses: StreamScapeTV/ci-workflows/actions/private-git@orchestrator/issue-577-tailscale-android
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Prepare isolated Buildah auth state
        shell: bash
        run: |
          set -Eeuo pipefail
          authfile="${RUNNER_TEMP}/ci-broker-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          test ! -e "${authfile}"
          umask 077
          printf '{}\n' > "${authfile}"
          chmod 0600 "${authfile}"
          printf 'BROKER_REGISTRY_AUTH=%s\n' "${authfile}" >> "${GITHUB_ENV}"

      - name: Build smoke and publish broker image
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${REGISTRY_USER}"
          test -n "${REGISTRY_TOKEN}"
          test -f "${BROKER_REGISTRY_AUTH}"
          local_ref="localhost/ci-broker:${SOURCE_SHA}"
          remote_ref="${IMAGE}:${VERSION}"
          buildah bud --authfile "${BROKER_REGISTRY_AUTH}" --layers=false --isolation chroot --file ci-broker/Containerfile --tag "${local_ref}" ci-broker
          container="ci-broker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildah from --authfile "${BROKER_REGISTRY_AUTH}" --name "${container}" "${local_ref}" >/dev/null
          buildah copy "${container}" ci-broker/smoke_test.py /opt/ci-broker/smoke_test.py >/dev/null
          buildah run "${container}" -- python3 /opt/ci-broker/app.py self-check
          buildah run "${container}" -- python3 /opt/ci-broker/smoke_test.py
          buildah rm "${container}" >/dev/null
          printf '%s' "${REGISTRY_TOKEN}" | buildah login --authfile "${BROKER_REGISTRY_AUTH}" --username "${REGISTRY_USER}" --password-stdin "${REGISTRY}" >/dev/null
          buildah push --authfile "${BROKER_REGISTRY_AUTH}" "${local_ref}" "docker://${remote_ref}"

      - name: Remove private registry and image state
        if: always()
        shell: bash
        run: |
          set +e
          container="ci-broker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_ref="localhost/ci-broker:${SOURCE_SHA}"
          buildah rm "${container}" >/dev/null 2>&1 || true
          if test -n "${BROKER_REGISTRY_AUTH:-}"; then
            buildah logout --authfile "${BROKER_REGISTRY_AUTH}" "${REGISTRY}" >/dev/null 2>&1 || true
          fi
          buildah rmi "${local_ref}" >/dev/null 2>&1 || true
          if test -n "${BROKER_REGISTRY_AUTH:-}"; then
            rm -f -- "${BROKER_REGISTRY_AUTH}"
            test ! -e "${BROKER_REGISTRY_AUTH}"
          fi

  chart:
    needs: [resolve, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      REGISTRY_USER: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - name: Connect to private Git service
        uses: StreamScapeTV/ci-workflows/actions/private-git@orchestrator/issue-577-tailscale-android
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Package and publish Helm chart
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${REGISTRY_USER}"
          test -n "${REGISTRY_TOKEN}"
          helm lint ci-broker/chart --set "image.tag=${VERSION}"
          helm package ci-broker/chart --version "${VERSION}" --app-version "${VERSION}" --destination "${RUNNER_TEMP}"
          printf '%s' "${REGISTRY_TOKEN}" | helm registry login "${REGISTRY}" --username "${REGISTRY_USER}" --password-stdin >/dev/null
          helm push "${RUNNER_TEMP}/ci-broker-${VERSION}.tgz" "${CHART_REGISTRY}"

      - name: Logout from private registry
        if: always()
        shell: bash
        run: helm registry logout "${REGISTRY}" >/dev/null 2>&1 || true
