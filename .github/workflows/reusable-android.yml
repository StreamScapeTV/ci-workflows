name: Reusable Android validation

on:
  workflow_call:
    inputs:
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      validation_scope:
        description: protected-full, compile, unit, assemble, lint, targeted-unit, gradle, or script
        required: true
        type: string
      working_directory:
        description: Bounded relative Android project directory
        required: false
        default: .
        type: string
      gradle_wrapper_path:
        description: Bounded checked-in Gradle wrapper path relative to the project directory
        required: false
        default: gradlew
        type: string
      validation_plan_json:
        description: Strict bounded JSON plan of caller-owned Gradle tasks, selector, or checked-in script data
        required: true
        type: string
      dependency_prebuild_plan_json:
        description: Optional strict protected-full Gradle plan used only to process-isolate private dependency preparation before authoritative validation
        required: false
        default: ""
        type: string
      private_dependency_repository:
        description: Optional exact private dependency repository
        required: false
        default: ""
        type: string
      private_dependency_sha:
        description: Optional exact private dependency SHA
        required: false
        default: ""
        type: string
      private_dependency_subdirectory:
        description: Optional bounded dependency subdirectory
        required: false
        default: .
        type: string
      private_dependency_id:
        description: Optional bounded dependency identity
        required: false
        default: ""
        type: string
    secrets:
      private_dependency_token:
        description: Optional transient contents-read token used only by exact private dependency checkout
        required: false
      maven_package_read_token:
        description: Optional transient package-read token forwarded only to bounded product execution
        required: false
    outputs:
      result:
        description: Success only after execution and all terminal cleanup checks succeed
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded machine-readable Android validation summary
        value: ${{ jobs.validate.outputs.test_summary }}
      cleanup_result:
        description: Success only after Android state and workspace cleanup are residue-free
        value: ${{ jobs.validate.outputs.cleanup_result }}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve hosted Android validation plan
    if: ${{ inputs.execution_backend == 'github-hosted' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
    steps:
      - id: plan
        name: Validate technology-level Android request
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
      - id: backend
        name: Resolve bounded hosted Android capacity
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@5b3093056bd77d18bf094e1ba8d8d1613ccc472b # issue #577 hosted Android backend checkpoint
        with:
          workflow_api: validation.android
          source_trust: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'trusted-pr' || github.event_name == 'pull_request' && 'untrusted-fork' || 'trusted-exact' }}
          execution_backend: ${{ inputs.execution_backend }}
          runner_profile: mobile

  plan_organization:
    name: Resolve organization Android validation plan
    if: ${{ inputs.execution_backend != 'github-hosted' }}
    runs-on: [linux, amd64, mobile]
    timeout-minutes: 10
    outputs:
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
    steps:
      - id: plan
        name: Validate technology-level Android request
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
      - id: backend
        name: Preserve bounded organization Android capacity
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@5b3093056bd77d18bf094e1ba8d8d1613ccc472b # issue #577 hosted Android backend checkpoint
        with:
          workflow_api: validation.android
          source_trust: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'trusted-pr' || github.event_name == 'pull_request' && 'untrusted-fork' || 'trusted-exact' }}
          execution_backend: ${{ inputs.execution_backend }}
          runner_profile: mobile

  validate:
    name: CI / Android validation
    needs: [plan, plan_organization]
    if: ${{ always() && (needs.plan.result == 'success' || needs.plan_organization.result == 'success') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json || needs.plan_organization.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      cleanup_result: ${{ (inputs.dependency_prebuild_plan_json == '' || (steps.prebuild_cleanup.outcome == 'success' && steps.prebuild_residue.outcome == 'success')) && steps.android_cleanup.outcome == 'success' && steps.residue.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
    steps:
      - id: plan
        name: Validate technology-level Android request
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

      - id: prebuild_plan
        name: Validate optional private dependency prebuild plan
        if: ${{ inputs.validation_scope != 'gradle' && inputs.dependency_prebuild_plan_json != '' && steps.plan.outputs.private_dependency_used == 'true' }}
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: protected-full
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.dependency_prebuild_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}

      - name: Set up exact hosted JDK 25
        if: ${{ inputs.execution_backend == 'github-hosted' }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - id: checkout
        name: Check out exact admitted caller source once
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated marker-bound Gradle state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}

      - id: dependency
        name: Check out exact private dependency at most once
        if: steps.plan.outputs.private_dependency_used == 'true'
        uses: StreamScapeTV/ci-workflows/actions/checkout-private-dependency@70e08d4ddf8930046632a7135950e924b82e22bf # issue #104 immutable private-action checkpoint
        with:
          repository: ${{ steps.plan.outputs.private_dependency_repository }}
          admitted_sha: ${{ steps.plan.outputs.private_dependency_sha }}
          dependency_id: ${{ steps.plan.outputs.private_dependency_id }}
          expected_subpath: ${{ steps.plan.outputs.private_dependency_subdirectory }}
          fetch_depth: "1"
          token: ${{ secrets.private_dependency_token }}

      - id: dependency_warm
        name: Resolve Gradle dependency graph for cache maintenance
        if: ${{ inputs.validation_scope == 'gradle' && inputs.dependency_prebuild_plan_json == '' && steps.plan.outputs.private_dependency_used == 'true' && steps.dependency.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/warm-gradle-dependencies@13de46c51efcf65df798dfec82a620c484350dfa # issue #346 dependency warm checkpoint
        with:
          admitted_sha: ${{ inputs.admitted_sha }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          private_dependency_subdirectory: ${{ steps.plan.outputs.private_dependency_subdirectory }}

      - id: dependency_warm_seed
        name: Publish cache-maintenance Gradle dependency delta
        if: ${{ steps.dependency_warm.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/upload-gradle-seed@fa67b6a1580ff2eb7386a9e58de09896b9990696 # issue #346 bounded Gradle cache sync diagnostics checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}

      - id: prebuild_execute
        name: Process-isolate optional private dependency Gradle prebuild
        if: ${{ inputs.validation_scope != 'gradle' && inputs.dependency_prebuild_plan_json != '' && steps.prebuild_plan.outcome == 'success' && steps.dependency.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: protected-full
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.dependency_prebuild_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
          private_dependency_verified: ${{ steps.dependency.outputs.verified }}
          private_dependency_remotes_erased: ${{ steps.dependency.outputs.remotes_erased }}
          private_dependency_credentials_erased: ${{ steps.dependency.outputs.credentials_erased }}
          private_dependency_head_sha: ${{ steps.dependency.outputs.head_sha }}
          private_dependency_checkout_repository: ${{ steps.dependency.outputs.repository }}
          private_dependency_checkout_id: ${{ steps.dependency.outputs.dependency_id }}
          private_dependency_expected_subpath: ${{ steps.dependency.outputs.expected_subpath }}

      - id: prebuild_cleanup
        name: Remove optional dependency-prebuild copied source state
        if: ${{ always() && inputs.validation_scope != 'gradle' && inputs.dependency_prebuild_plan_json != '' && steps.workspace.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: protected-full

      - id: prebuild_residue
        name: Verify zero optional dependency-prebuild residue
        if: ${{ always() && inputs.validation_scope != 'gradle' && inputs.dependency_prebuild_plan_json != '' && steps.workspace.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: protected-full

      - id: execute
        name: Execute one primitive-backed Android validation plan
        if: ${{ success() && (inputs.validation_scope != 'gradle' || steps.plan.outputs.private_dependency_used != 'true') && (inputs.dependency_prebuild_plan_json == '' || (steps.prebuild_plan.outcome == 'success' && steps.prebuild_execute.outcome == 'success' && steps.prebuild_cleanup.outcome == 'success' && steps.prebuild_residue.outcome == 'success')) }}
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        env:
          CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ secrets.maven_package_read_token }}
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          validation_plan_json: ${{ inputs.validation_plan_json }}
          private_dependency_repository: ${{ inputs.private_dependency_repository }}
          private_dependency_sha: ${{ inputs.private_dependency_sha }}
          private_dependency_subdirectory: ${{ inputs.private_dependency_subdirectory }}
          private_dependency_id: ${{ inputs.private_dependency_id }}
          private_dependency_verified: ${{ steps.dependency.outputs.verified }}
          private_dependency_remotes_erased: ${{ steps.dependency.outputs.remotes_erased }}
          private_dependency_credentials_erased: ${{ steps.dependency.outputs.credentials_erased }}
          private_dependency_head_sha: ${{ steps.dependency.outputs.head_sha }}
          private_dependency_checkout_repository: ${{ steps.dependency.outputs.repository }}
          private_dependency_checkout_id: ${{ steps.dependency.outputs.dependency_id }}
          private_dependency_expected_subpath: ${{ steps.dependency.outputs.expected_subpath }}

      - id: evidence
        name: Render bounded Android validation evidence
        if: ${{ steps.execute.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: validation-android-v2
          runner_profile: mobile
          toolchain_json: '{}'
          command_profile: ${{ inputs.validation_scope }}
          result: ${{ steps.execute.outputs.result }}

      - id: android_cleanup
        name: Remove Android-specific copied source state once
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}

      - id: residue
        name: Verify zero Android-specific residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: StreamScapeTV/ci-workflows/actions/validate-android@91e5ba5af11ec717f829000edad062c664fb86f7 # issue #534 prefix-isolated protected-full checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_scope: ${{ inputs.validation_scope }}

      - id: gradle_seed
        name: Sync newly resolved Gradle dependencies to the internal cache
        if: ${{ steps.execute.outcome == 'success' && steps.android_cleanup.outcome == 'success' && steps.residue.outcome == 'success' }}
        continue-on-error: true
        uses: StreamScapeTV/ci-workflows/actions/upload-gradle-seed@fa67b6a1580ff2eb7386a9e58de09896b9990696 # issue #346 bounded Gradle cache sync diagnostics checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}

      - id: workspace_cleanup
        name: Remove and verify the one registered Android workspace
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: clean
        name: Verify exact admitted source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - id: terminal
        name: Project terminal Android validation status
        if: always()
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          MAINTENANCE_MODE: ${{ inputs.validation_scope == 'gradle' && steps.plan.outputs.private_dependency_used == 'true' && 'true' || 'false' }}
          WARM_OUTCOME: ${{ steps.dependency_warm.outcome }}
          WARM_SEED_OUTCOME: ${{ steps.dependency_warm_seed.outcome }}
          WARM_CACHE_MODE: ${{ steps.dependency_warm.outputs.gradle_dependency_cache_mode }}
          WARM_WALL_MS: ${{ steps.dependency_warm.outputs.warm_wall_ms }}
          PREBUILD_REQUIRED: ${{ inputs.validation_scope != 'gradle' && inputs.dependency_prebuild_plan_json != '' && 'true' || 'false' }}
          PREBUILD_PLAN_OUTCOME: ${{ steps.prebuild_plan.outcome }}
          PREBUILD_EXECUTE_OUTCOME: ${{ steps.prebuild_execute.outcome }}
          PREBUILD_CLEANUP_OUTCOME: ${{ steps.prebuild_cleanup.outcome }}
          PREBUILD_RESIDUE_OUTCOME: ${{ steps.prebuild_residue.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          DEPENDENCY_REQUIRED: ${{ steps.plan.outputs.private_dependency_used }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          EXECUTE_REQUIRED: ${{ inputs.validation_scope == 'gradle' && steps.plan.outputs.private_dependency_used == 'true' && 'false' || 'true' }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ANDROID_TEST_SUMMARY: ${{ steps.execute.outputs.test_summary }}
          ANDROID_CLEANUP_OUTCOME: ${{ steps.android_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${ANDROID_TEST_SUMMARY}" ]]; then printf 'android-test-summary=%s\n' "${ANDROID_TEST_SUMMARY}"; fi
          warm_ok=true
          if [[ "${MAINTENANCE_MODE}" == "true" ]]; then
            test "${WARM_OUTCOME}" = "success" || warm_ok=false
            test "${WARM_SEED_OUTCOME}" = "success" || warm_ok=false
            if [[ -n "${WARM_CACHE_MODE}" && -n "${WARM_WALL_MS}" ]]; then printf 'gradle-dependency-warm cache_mode=%s wall_ms=%s\n' "${WARM_CACHE_MODE}" "${WARM_WALL_MS}"; fi
          fi
          dependency_ok=true; if [[ "${DEPENDENCY_REQUIRED}" == "true" ]]; then test "${DEPENDENCY_OUTCOME}" = "success" || dependency_ok=false; fi
          prebuild_ok=true
          if [[ "${PREBUILD_REQUIRED}" == "true" ]]; then
            test "${DEPENDENCY_REQUIRED}" = "true" && test "${PREBUILD_PLAN_OUTCOME}" = "success" && test "${PREBUILD_EXECUTE_OUTCOME}" = "success" && test "${PREBUILD_CLEANUP_OUTCOME}" = "success" && test "${PREBUILD_RESIDUE_OUTCOME}" = "success" || prebuild_ok=false
          fi
          execute_ok=true; if [[ "${EXECUTE_REQUIRED}" == "true" ]]; then test "${EXECUTE_OUTCOME}" = "success" || execute_ok=false; fi
          if [[ "${PLAN_OUTCOME}" == "success" &&
                "${CHECKOUT_OUTCOME}" == "success" &&
                "${WORKSPACE_OUTCOME}" == "success" &&
                "${warm_ok}" == "true" &&
                "${dependency_ok}" == "true" &&
                "${prebuild_ok}" == "true" &&
                "${execute_ok}" == "true" &&
                "${ANDROID_CLEANUP_OUTCOME}" == "success" &&
                "${RESIDUE_OUTCOME}" == "success" &&
                "${WORKSPACE_CLEANUP_OUTCOME}" == "success" &&
                "${CLEAN_OUTCOME}" == "success" ]]; then
            echo "result=success" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "result=failure" >> "${GITHUB_OUTPUT}"
          exit 1
