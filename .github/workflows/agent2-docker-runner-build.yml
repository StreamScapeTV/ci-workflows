name: Agent 2 Docker runner build validation
on: pull_request
permissions:
  contents: read
jobs:
  validate:
    runs-on: [linux, amd64, buildah, small]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull Docker CLI base
        run: podman pull docker.io/library/docker@sha256:000bb62ff495f986c9f5578eb67cc2cb98b91138eda81d7762d5371eb8a497fe
      - name: Check Docker CLI plugin paths
        run: podman run --rm --entrypoint /bin/sh docker.io/library/docker@sha256:000bb62ff495f986c9f5578eb67cc2cb98b91138eda81d7762d5371eb8a497fe -c 'test -x /usr/local/bin/docker && test -x /usr/local/libexec/docker/cli-plugins/docker-buildx && test -x /usr/local/libexec/docker/cli-plugins/docker-compose'
      - name: Pull Actions runner base
        run: podman pull ghcr.io/actions/actions-runner@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
      - name: Build image
        run: buildah bud --pull=never -f runner-images/docker/Dockerfile -t docker-proof runner-images/docker
      - name: Smoke image
        run: podman run --rm --entrypoint /usr/local/bin/runner-image-smoke docker-proof
