name: Issue 336 branch validation

on:
  push:
    branches:
      - agent1/issue-336-apple-single-executor

permissions:
  contents: read

concurrency:
  group: issue-336-branch-validation
  cancel-in-progress: true

env:
  APPLE_PLAN_JSON: >-
    {"stages":[{"id":"ios-build","platform":"ios","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"tvos-build","platform":"tvos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]},{"id":"macos-build","platform":"macos","operation":"build","working_directory":"tests/fixtures/apple-validation/smoke-project","container":{"kind":"project","path":"tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj"},"scheme":"AppleValidationSmoke","configuration":"Debug","test_plan":"","package_resolution_mode":"disabled","resolved_files":[],"script":null,"xcodebuild_arguments":["ENABLE_TESTABILITY=YES"],"test_selectors":[],"expected_outputs":[],"cleanup_paths":["tests/fixtures/apple-validation/smoke-project/build","tests/fixtures/apple-validation/smoke-project/.swiftpm","tests/fixtures/apple-validation/smoke-project/xcuserdata","tests/fixtures/apple-validation/smoke-project/AppleValidationSmoke.xcodeproj/xcuserdata"]}]}

jobs:
  contracts:
    name: Focused Apple contracts
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Run focused Apple tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python3 -m unittest -v \
            tests.test_apple_protected_full \
            tests.test_apple_workflow_contract \
            tests.test_apple_validation \
            tests.test_apple_simulator_ownership \
            tests.test_apple_terminal_cleanup
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate protected-full planner through the composite action
        uses: ./actions/validate-apple
        with:
          phase: plan
          admitted_sha: ${{ github.sha }}
          validation_scope: protected-full
          source_trust: trusted-exact
          validation_plan_json: ${{ env.APPLE_PLAN_JSON }}

  apple:
    name: Real single-executor Apple diagnostic
    runs-on: [macOS, ARM64]
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Clear fixed admitted source checkout root
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apple_checkout_cleanup.py source

      - id: checkout
        name: Check out exact admitted source once
        uses: ./actions/exact-checkout
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ github.sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one Apple workspace
        uses: ./actions/prepare-workspace
        with:
          profile: apple
          cache_mode: disabled
          source_sha: ${{ github.sha }}
          trust_mode: trusted-exact

      - id: execute
        name: Execute iOS tvOS macOS sequentially
        uses: ./actions/validate-apple
        with:
          phase: execute
          admitted_sha: ${{ github.sha }}
          validation_scope: protected-full
          source_trust: trusted-exact
          validation_plan_json: ${{ env.APPLE_PLAN_JSON }}

      - id: apple_cleanup
        name: Remove Apple state once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./actions/validate-apple
        with:
          phase: cleanup
          admitted_sha: ${{ github.sha }}
          validation_scope: protected-full
          source_trust: trusted-exact
          validation_plan_json: ${{ env.APPLE_PLAN_JSON }}

      - id: residue
        name: Verify Apple residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./actions/validate-apple
        with:
          phase: residue
          admitted_sha: ${{ github.sha }}
          validation_scope: protected-full
          source_trust: trusted-exact
          validation_plan_json: ${{ env.APPLE_PLAN_JSON }}

      - id: clean
        name: Verify admitted source remained clean
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - id: source_cleanup
        name: Remove admitted source once
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apple_checkout_cleanup.py source

      - id: workspace_cleanup
        name: Remove registered Apple workspace once
        if: always()
        uses: ./actions/cleanup-workspace

      - name: Require terminal diagnostic success
        if: always()
        shell: bash
        env:
          EXECUTE: ${{ steps.execute.outcome }}
          APPLE_CLEANUP: ${{ steps.apple_cleanup.outcome }}
          RESIDUE: ${{ steps.residue.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
          SOURCE_CLEANUP: ${{ steps.source_cleanup.outcome }}
          WORKSPACE_CLEANUP: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          test "${EXECUTE}" = success
          test "${APPLE_CLEANUP}" = success
          test "${RESIDUE}" = success
          test "${CLEAN}" = success
          test "${SOURCE_CLEANUP}" = success
          test "${WORKSPACE_CLEANUP}" = success
