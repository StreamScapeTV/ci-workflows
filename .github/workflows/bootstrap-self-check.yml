name: CI Workflows Bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflows-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository bootstrap policy
    runs-on: homelab-portable-linux-x64
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run bootstrap checks
        shell: bash
        run: python3 scripts/ci/bootstrap_check.py

      - name: Run bootstrap tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify clean tracked tree
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
