name: Reusable Gradle Maven publication

on:
  workflow_call:
    inputs:
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
      admitted_sha:
        description: Exact lowercase caller source SHA
        required: true
        type: string
      expected_branch:
        description: Expected caller branch; Gradle Maven publication accepts develop only
        required: true
        type: string
      working_directory:
        description: Repository-relative Gradle project directory
        required: false
        default: .
        type: string
      gradle_wrapper_path:
        description: Checked-in Gradle wrapper path relative to working_directory
        required: false
        default: gradlew
        type: string
      version_file:
        description: Repository-relative stable VERSION file
        required: false
        default: VERSION
        type: string
      arguments_json:
        description: Bounded JSON array of Gradle Maven publication tasks
        required: true
        type: string
    secrets:
      registry_username:
        description: Private Maven registry username
        required: true
      registry_token:
        description: Private Maven registry token
        required: true
    outputs:
      result:
        description: Success only after publication and terminal cleanup succeed
        value: ${{ jobs.publish.outputs.result }}
      release_version:
        description: Exact Maven version published
        value: ${{ jobs.publish.outputs.release_version }}

permissions:
  contents: read

jobs:
  reject_hosted:
    name: Reject unsupported hosted Maven publication
    if: ${{ inputs.execution_backend == 'github-hosted' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    steps:
      - name: Reject hosted private-registry publication authority
        shell: bash
        run: |
          echo '::error::release.gradle-maven does not support github-hosted execution because private Maven publication authority is organization-only.' >&2
          exit 2

  reject_invalid:
    name: Reject invalid Maven execution backend
    if: ${{ inputs.execution_backend != 'organization' && inputs.execution_backend != 'github-hosted' }}
    runs-on: [linux, amd64, general, tiny]
    timeout-minutes: 5
    steps:
      - name: Reject invalid bounded execution backend
        shell: bash
        run: |
          echo '::error::execution_backend must be organization or github-hosted.' >&2
          exit 2

  publish:
    name: Release / Gradle Maven publication
    if: ${{ inputs.execution_backend == 'organization' }}
    runs-on: [linux, amd64, mobile]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      release_version: ${{ steps.maven.outputs.release_version }}
    steps:
      - id: checkout
        name: Check out exact admitted caller source
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one private Gradle publication workspace
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}

      - id: maven_plan
        name: Validate bounded Maven publication plan
        if: ${{ steps.checkout.outcome == 'success' && steps.workspace.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/publish-gradle-maven@c4b85851ac650906103f116c95d9d16c546dd538 # issue #418 immutable action checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          source_root: source
          expected_branch: ${{ inputs.expected_branch }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          version_file: ${{ inputs.version_file }}
          arguments_json: ${{ inputs.arguments_json }}

      - id: maven
        name: Publish Maven packages in one Gradle invocation
        if: ${{ steps.maven_plan.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/publish-gradle-maven@c4b85851ac650906103f116c95d9d16c546dd538 # issue #418 immutable action checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          source_root: source
          expected_branch: ${{ inputs.expected_branch }}
          working_directory: ${{ inputs.working_directory }}
          gradle_wrapper_path: ${{ inputs.gradle_wrapper_path }}
          version_file: ${{ inputs.version_file }}
          arguments_json: ${{ inputs.arguments_json }}
          registry_username: ${{ secrets.registry_username }}
          registry_token: ${{ secrets.registry_token }}

      - id: source_cleanup
        name: Remove ignored Maven publication build state
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/publish-gradle-maven@c4b85851ac650906103f116c95d9d16c546dd538 # issue #418 immutable action checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          source_root: source

      - id: source_residue
        name: Verify zero Maven publication source residue
        if: ${{ always() && steps.source_cleanup.outcome == 'success' }}
        uses: StreamScapeTV/ci-workflows/actions/publish-gradle-maven@c4b85851ac650906103f116c95d9d16c546dd538 # issue #418 immutable action checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          source_root: source

      - id: workspace_cleanup
        name: Remove and verify private Gradle publication workspace
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - id: terminal
        name: Project terminal Maven publication status
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          MAVEN_PLAN_OUTCOME: ${{ steps.maven_plan.outcome }}
          MAVEN_OUTCOME: ${{ steps.maven.outcome }}
          SOURCE_CLEANUP_OUTCOME: ${{ steps.source_cleanup.outcome }}
          SOURCE_RESIDUE_OUTCOME: ${{ steps.source_residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHECKOUT_OUTCOME}" == "success" &&
                "${WORKSPACE_OUTCOME}" == "success" &&
                "${MAVEN_PLAN_OUTCOME}" == "success" &&
                "${MAVEN_OUTCOME}" == "success" &&
                "${SOURCE_CLEANUP_OUTCOME}" == "success" &&
                "${SOURCE_RESIDUE_OUTCOME}" == "success" &&
                "${WORKSPACE_CLEANUP_OUTCOME}" == "success" ]]; then
            echo "result=success" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "result=failure" >> "${GITHUB_OUTPUT}"
          exit 1
