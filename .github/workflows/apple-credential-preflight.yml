name: Central Apple Credential Preflight

# Manually admitted trusted Central-only secret proof. Never a PR, caller,
# scheduled, product, or release operation. Credentials remain in this job.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-apple-credential-preflight-main
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'StreamScapeTV/ci-workflows' && github.ref == 'refs/heads/main' }}
    runs-on: [macos-latest-xl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify reviewed protected source and host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = StreamScapeTV/ci-workflows
          test "${RUNNER_OS}" = macOS
          test "${RUNNER_ENVIRONMENT}" = self-hosted
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet
          git diff --cached --quiet

      - name: Verify configured Central Apple credentials without a device
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PREFLIGHT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          PREFLIGHT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          PREFLIGHT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PREFLIGHT_ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          PREFLIGHT_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PREFLIGHT_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apple_credential_preflight.py run

      - name: Always restore the isolated signing context and delete credentials
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          if test -f scripts/ci/apple_credential_preflight.py; then
            python3 scripts/ci/apple_credential_preflight.py cleanup
          fi
