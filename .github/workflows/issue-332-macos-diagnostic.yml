name: Issue 332 macOS Android diagnostic

on:
  push:
    branches: [orchestrator/issue-332-macos-diagnostic]

permissions:
  actions: read
  contents: read

jobs:
  android:
    name: macOS Android protected-full diagnostic
    runs-on: [macOS, ARM64, android]
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 0c8b39e09942eda80efa807f9dc249b56bb22bf2
    steps:
      - name: Stage exact candidate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: StreamScapeTV/ci-workflows
          ref: ${{ env.CANDIDATE_SHA }}
          path: .ciw
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify exact candidate implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Resolve macOS JDK 25 and Android SDK 37
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_home="${HOME}"

          java_home=""
          for candidate in \
            "$(/usr/libexec/java_home -v 25 2>/dev/null || true)" \
            "/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home" \
            "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home"; do
            test -n "${candidate}" || continue
            test -x "${candidate}/bin/java" || continue
            major="$("${candidate}/bin/java" -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')"
            if test "${major}" = "25"; then
              java_home="${candidate}"
              break
            fi
          done
          if test -z "${java_home}"; then
            echo "JDK 25 not found on macOS Android runner" >&2
            /usr/libexec/java_home -V 2>&1 || true
            exit 1
          fi

          sdk_root=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}" \
            "${ANDROID_HOME:-}" \
            "${runner_home}/Library/Android/sdk" \
            "/Users/mimranfaruqi/Library/Android/sdk" \
            "/opt/android-sdk"; do
            test -n "${candidate}" || continue
            if test -f "${candidate}/platforms/android-37/android.jar" \
              && test -f "${candidate}/build-tools/37.0.0/aapt2"; then
              sdk_root="${candidate}"
              break
            fi
          done
          if test -z "${sdk_root}"; then
            echo "Android API 37 / Build Tools 37.0.0 not found on macOS Android runner" >&2
            for root in "${runner_home}/Library/Android/sdk" "/Users/mimranfaruqi/Library/Android/sdk" "/opt/android-sdk"; do
              test -d "${root}" || continue
              echo "SDK candidate: ${root}" >&2
              ls -1 "${root}/platforms" 2>/dev/null | tail -n 10 >&2 || true
              ls -1 "${root}/build-tools" 2>/dev/null | tail -n 10 >&2 || true
            done
            exit 1
          fi

          echo "Resolved JDK 25: ${java_home}"
          echo "Resolved Android SDK: ${sdk_root}"
          {
            echo "JAVA_HOME=${java_home}"
            echo "ANDROID_HOME=${sdk_root}"
            echo "ANDROID_SDK_ROOT=${sdk_root}"
          } >> "${GITHUB_ENV}"

      - id: plan
        name: Validate protected-full single-executor plan
        uses: ./.ciw/actions/validate-android
        with:
          phase: plan
          admitted_sha: ${{ env.CANDIDATE_SHA }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - name: Check out exact admitted smoke source once
        uses: ./.ciw/actions/exact-checkout
        with:
          repository: StreamScapeTV/ci-workflows
          admitted_sha: ${{ env.CANDIDATE_SHA }}
          path: source
          fetch_depth: "1"

      - id: workspace
        name: Prepare one isolated Gradle workspace
        uses: ./.ciw/actions/prepare-workspace
        with:
          profile: gradle
          cache_mode: disabled
          source_sha: ${{ env.CANDIDATE_SHA }}

      - id: execute
        name: Execute protected-full in one macOS Android workspace
        uses: ./.ciw/actions/validate-android
        with:
          phase: execute
          admitted_sha: ${{ env.CANDIDATE_SHA }}
          validation_scope: protected-full
          working_directory: tests/fixtures/android-validation/smoke-project
          gradle_wrapper_path: gradlew
          validation_plan_json: '{"unit_tasks":["help"],"lint_tasks":["tasks"],"assemble_tasks":["verifyToolchainSmoke"],"schema":{"mode":"none"}}'

      - id: android_cleanup
        name: Remove Android-specific copied source state once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-android
        with:
          phase: cleanup
          admitted_sha: ${{ env.CANDIDATE_SHA }}
          validation_scope: protected-full

      - id: residue
        name: Verify zero Android-specific residue once
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/validate-android
        with:
          phase: residue
          admitted_sha: ${{ env.CANDIDATE_SHA }}
          validation_scope: protected-full

      - id: workspace_cleanup
        name: Remove and verify the one registered workspace
        if: always() && steps.workspace.outcome == 'success'
        uses: ./.ciw/actions/cleanup-workspace

      - id: clean
        name: Verify exact admitted smoke source remained clean
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .ciw rev-parse HEAD)" = "${CANDIDATE_SHA}"
          if test -d source/.git; then
            test "$(git -C source rev-parse HEAD)" = "${CANDIDATE_SHA}"
            test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          fi

      - name: Project terminal macOS Android diagnostic status
        if: always()
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ANDROID_CLEANUP_OUTCOME: ${{ steps.android_cleanup.outcome }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          WORKSPACE_CLEANUP_OUTCOME: ${{ steps.workspace_cleanup.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -Eeuo pipefail
          test "${PLAN_OUTCOME}" = success
          test "${EXECUTE_OUTCOME}" = success
          test "${ANDROID_CLEANUP_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${WORKSPACE_CLEANUP_OUTCOME}" = success
          test "${CLEAN_OUTCOME}" = success
