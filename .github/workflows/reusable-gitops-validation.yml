name: Reusable GitOps source validation

on:
  workflow_call:
    inputs:
      execution_backend:
        description: organization or github-hosted
        required: false
        default: organization
        type: string
      admitted_sha:
        description: Exact lowercase source SHA admitted by source.resolve
        required: true
        type: string
      validation_profile:
        description: source-audit, yaml, helm-render, kustomize-render, changed-tree, or full
        required: true
        type: string
      consumer_contract:
        description: Checked-in reviewed GitOps consumer contract
        required: true
        type: string
      change_base_sha:
        description: Exact base SHA required only by changed-tree
        required: false
        default: ""
        type: string
      policy_script_profile:
        description: Optional exact contract-owned checked-in policy profile
        required: false
        default: ""
        type: string
      artifact_exception_id:
        description: Reserved zero-artifact field; non-empty values are rejected
        required: false
        default: ""
        type: string
    outputs:
      result:
        description: Success only after bounded validation and terminal cleanup
        value: ${{ jobs.validate.outputs.result }}
      test_summary:
        description: Bounded deterministic source validation summary
        value: ${{ jobs.validate.outputs.test_summary }}
      render_digest:
        description: SHA-256 over normalized rendered objects
        value: ${{ jobs.validate.outputs.render_digest }}
      cleanup_result:
        description: Terminal cleanup result
        value: ${{ jobs.validate.outputs.cleanup_result }}
      evidence_id:
        description: Deterministic redacted evidence identifier
        value: ${{ jobs.validate.outputs.evidence_id }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Resolve bounded hosted GitOps validation plan
    if: ${{ inputs.execution_backend == 'github-hosted' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - id: plan
        name: Resolve contract-owned GitOps plan
        uses: StreamScapeTV/ci-workflows/actions/validate-gitops@b99c4296fe7cad06ef6c5956b1b0eb86a49f0145 # issue #475 bounded GitOps source validation checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          consumer_contract: ${{ inputs.consumer_contract }}
          change_base_sha: ${{ inputs.change_base_sha }}
          policy_script_profile: ${{ inputs.policy_script_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - id: backend
        name: Resolve bounded hosted execution backend
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@83084efecc597d3bedacfe5f8628f1890b9bcd90 # issue #495 hosted Apple backend checkpoint
        with:
          workflow_api: validation.gitops
          source_trust: ${{ steps.plan.outputs.source_trust }}
          execution_backend: ${{ inputs.execution_backend }}
          runner_profile: ${{ steps.plan.outputs.runner_profile }}

  plan_organization:
    name: Resolve bounded organization GitOps validation plan
    if: ${{ inputs.execution_backend != 'github-hosted' }}
    runs-on: [linux, amd64, general, small]
    timeout-minutes: 10
    outputs:
      runner_profile: ${{ steps.plan.outputs.runner_profile }}
      runs_on_json: ${{ steps.backend.outputs.runs_on_json }}
      workspace_profile: ${{ steps.plan.outputs.workspace_profile }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      source_trust: ${{ steps.plan.outputs.source_trust }}
    steps:
      - id: plan
        name: Resolve contract-owned GitOps plan
        uses: StreamScapeTV/ci-workflows/actions/validate-gitops@b99c4296fe7cad06ef6c5956b1b0eb86a49f0145 # issue #475 bounded GitOps source validation checkpoint
        with:
          phase: plan
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          consumer_contract: ${{ inputs.consumer_contract }}
          change_base_sha: ${{ inputs.change_base_sha }}
          policy_script_profile: ${{ inputs.policy_script_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - id: backend
        name: Resolve bounded organization execution backend
        uses: StreamScapeTV/ci-workflows/actions/resolve-execution-backend@83084efecc597d3bedacfe5f8628f1890b9bcd90 # issue #495 hosted Apple backend checkpoint
        with:
          workflow_api: validation.gitops
          source_trust: ${{ steps.plan.outputs.source_trust }}
          execution_backend: ${{ inputs.execution_backend }}
          runner_profile: ${{ steps.plan.outputs.runner_profile }}

  validate:
    name: CI / GitOps validation
    needs: [plan, plan_organization]
    if: ${{ always() && (needs.plan.result == 'success' || needs.plan_organization.result == 'success') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on_json || needs.plan_organization.outputs.runs_on_json) }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.execute.outcome == 'success' && steps.gitops_cleanup.outcome == 'success' && steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      test_summary: ${{ steps.execute.outputs.test_summary }}
      render_digest: ${{ steps.execute.outputs.render_digest }}
      cleanup_result: ${{ steps.workspace_cleanup.outcome == 'success' && 'success' || 'failure' }}
      evidence_id: ${{ steps.execute.outputs.evidence_id }}
    steps:
      - name: Check out exact admitted caller source with bounded GitOps history
        uses: StreamScapeTV/ci-workflows/actions/exact-checkout@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          admitted_sha: ${{ inputs.admitted_sha }}
          path: source
          fetch_depth: "1000"

      - id: workspace
        name: Prepare isolated marker-bound GitOps state
        uses: StreamScapeTV/ci-workflows/actions/prepare-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          profile: ${{ needs.plan.outputs.workspace_profile || needs.plan_organization.outputs.workspace_profile }}
          cache_mode: disabled
          source_sha: ${{ inputs.admitted_sha }}
          trust_mode: ${{ needs.plan.outputs.source_trust || needs.plan_organization.outputs.source_trust }}

      - id: execute
        name: Execute pinned source-only GitOps validation
        uses: StreamScapeTV/ci-workflows/actions/validate-gitops@b99c4296fe7cad06ef6c5956b1b0eb86a49f0145 # issue #475 bounded GitOps source validation checkpoint
        with:
          phase: execute
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          consumer_contract: ${{ inputs.consumer_contract }}
          change_base_sha: ${{ inputs.change_base_sha }}
          policy_script_profile: ${{ inputs.policy_script_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - name: Render deterministic redacted GitOps evidence
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/render-evidence@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint
        with:
          source_sha: ${{ inputs.admitted_sha }}
          workflow_release: validation-gitops-1.0.0
          runner_profile: portable
          toolchain_json: ${{ steps.execute.outputs.tool_versions_json || '{}' }}
          command_profile: ${{ inputs.validation_profile }}
          result: ${{ steps.execute.outcome == 'success' && 'success' || 'failure' }}
          cleanup_state: not-run
          cleanup_removed_paths: "0"

      - id: gitops_cleanup
        name: Remove exact GitOps downloads, tools, caches, logs, and results
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-gitops@b99c4296fe7cad06ef6c5956b1b0eb86a49f0145 # issue #475 bounded GitOps source validation checkpoint
        with:
          phase: cleanup
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          consumer_contract: ${{ inputs.consumer_contract }}
          change_base_sha: ${{ inputs.change_base_sha }}
          policy_script_profile: ${{ inputs.policy_script_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - name: Verify zero GitOps issue-owned residue
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/validate-gitops@b99c4296fe7cad06ef6c5956b1b0eb86a49f0145 # issue #475 bounded GitOps source validation checkpoint
        with:
          phase: residue
          admitted_sha: ${{ inputs.admitted_sha }}
          validation_profile: ${{ inputs.validation_profile }}
          consumer_contract: ${{ inputs.consumer_contract }}
          change_base_sha: ${{ inputs.change_base_sha }}
          policy_script_profile: ${{ inputs.policy_script_profile }}
          artifact_exception_id: ${{ inputs.artifact_exception_id }}

      - id: workspace_cleanup
        name: Remove and verify all registered workspace state
        if: always()
        uses: StreamScapeTV/ci-workflows/actions/cleanup-workspace@70e08d4ddf8930046632a7135950e924b82e22bf # issue #116 immutable private-action checkpoint

      - name: Verify exact source remained clean after cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source
            test "$(git rev-parse HEAD)" = "${{ inputs.admitted_sha }}"
            test -z "$(git status --porcelain --untracked-files=all)"
          )

      - name: Confirm zero Actions artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if int(payload.get("total_count", 0)) != 0 or payload.get("artifacts") != []:
              raise SystemExit("GitOps validation retained an Actions artifact")
          PY
