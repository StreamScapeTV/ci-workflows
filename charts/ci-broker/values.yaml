replicaCount: 1

fullnameOverride: ci-broker

image:
  repository: git.faruqi.dev/mimranfaruqi/ci-workflows/ci-broker
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - private-registry

existingSecret:
  name: ci-broker-secrets

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
