# Target architecture is intentionally small and portfolio-driven. The complete
# inventory will record all existing files underneath these or explicitly
# justified additional domains, then consolidation will migrate callers toward
# the target modules rather than creating another compatibility layer.
domains:
  r2:
    target_module: src/ci_workflows/r2.py
    responsibility: >-
      Cloudflare R2/S3-compatible authentication, object naming, upload,
      download/read-back, compression, digest verification, and bounded log
      receipt helpers used by any CI family.
    files:
      - path: src/ci_workflows/r2_diagnostics.py
        responsibility: Current low-level R2 private diagnostic transport and verification.
        status: consolidate
        classes:
          - name: R2DiagnosticError
            purpose: Stable fail-closed R2 transport error.
          - name: R2DiagnosticResult
            purpose: Immutable uploaded-object receipt metadata.
        functions:
          - name: upload_private_diagnostic
            purpose: Compress, upload, read back, and digest-verify one private diagnostic.
          - name: download_private_diagnostic
            purpose: Download one exact private diagnostic and verify compressed digest.
          - name: is_capability_object_key
            purpose: Validate whether an R2 object key uses the capability-bound format.
      - path: src/ci_workflows/ci_private_apple.py
        responsibility: Current Apple-specific private CI executor; contains infrastructure helpers that generic CI imports.
        status: consolidate
        classes:
          - name: PrivateAppleCiError
            purpose: Stable Apple-private-executor error code wrapper.
        functions:
          - name: _r2_upload
            purpose: Apple-local wrapper around generic R2 diagnostic upload; should move behind the R2/private-CI domain boundary.
          - name: execute_private_apple
            purpose: Legacy Apple-specific opaque private CI lifecycle/execution.
          - name: recover_private_apple
            purpose: Legacy Apple-specific interrupted-run recovery.
      - path: src/ci_workflows/ci_private.py
        responsibility: Current product-neutral opaque private CI executor, presently dependent on Apple-private helper internals.
        status: consolidate
        classes:
          - name: PrivateCiError
            purpose: Stable generic opaque-private-CI error wrapper.
        functions:
          - name: execute_private_ci
            purpose: Execute one opaque private CI request through a technology adapter.
          - name: recover_private_ci
            purpose: Recover/terminalize an interrupted generic private CI request.
          - name: plan_private_ci
            purpose: Resolve the coarse hosted executor family for an opaque request.

