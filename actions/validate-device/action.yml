name: Validate exact physical-device request
description: Derive, plan, synthetically validate, or fail closed for one reviewed device profile

inputs:
  phase:
    description: Bounded internal phase
    required: false
    default: plan
  admitted_sha:
    description: Exact admitted lowercase source SHA
    required: false
    default: ""
  device_family:
    description: Android, iOS, or tvOS family
    required: false
    default: ""
  device_capability:
    description: Reviewed bounded capability
    required: false
    default: ""
  device_alias:
    description: Opaque contract alias resolved on the trusted host
    required: false
    default: ""
  command_profile:
    description: Reviewed command-profile identifier
    required: false
    default: ""
  script_path:
    description: Exact contract-matching checked-in test script
    required: false
    default: ""
  max_duration_minutes:
    description: Bounded duration
    required: false
    default: "60"
  evidence_exception_id:
    description: Optional named redacted evidence exception
    required: false
    default: ""
  request_id:
    description: Exact issue-scoped request identity
    required: false
    default: ""
  validated_plan:
    description: Internal canonical typed plan emitted by the planner
    required: false
    default: ""
  validated_plan_sha256:
    description: Internal canonical typed-plan digest
    required: false
    default: ""
  source_root:
    description: Fixed internal exact checkout root
    required: false
    default: source
  inventory_fixture:
    description: Internal synthetic inventory fixture used only by contract smoke
    required: false
    default: ""
  synthetic_mode:
    description: Internal same-repository contract-smoke gate
    required: false
    default: "false"

outputs:
  result:
    value: ${{ steps.device.outputs.result }}
  admitted_sha:
    value: ${{ steps.device.outputs.admitted_sha }}
  request_id:
    value: ${{ steps.device.outputs.request_id }}
  device_evidence_id:
    value: ${{ steps.device.outputs.device_evidence_id }}
  artifact_exception_used:
    value: ${{ steps.device.outputs.artifact_exception_used }}
  selected_device_hash:
    value: ${{ steps.device.outputs.selected_device_hash }}
  runner_profile:
    value: ${{ steps.device.outputs.runner_profile }}
  base_runner_profile:
    value: ${{ steps.device.outputs.base_runner_profile }}
  runs_on_json:
    value: ${{ steps.device.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.device.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.device.outputs.timeout_minutes }}
  derived_source_trust:
    value: ${{ steps.device.outputs.derived_source_trust }}
  execution_authorized:
    value: ${{ steps.device.outputs.execution_authorized }}
  authorization_failure:
    value: ${{ steps.device.outputs.authorization_failure }}
  concurrency_group:
    value: ${{ steps.device.outputs.concurrency_group }}
  cancel_in_progress:
    value: ${{ steps.device.outputs.cancel_in_progress }}
  validated_plan:
    value: ${{ steps.device.outputs.validated_plan }}
  validated_plan_sha256:
    value: ${{ steps.device.outputs.validated_plan_sha256 }}
  test_summary:
    value: ${{ steps.device.outputs.test_summary }}
  cleanup_result:
    value: ${{ steps.device.outputs.cleanup_result }}
  failure_code:
    value: ${{ steps.device.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: device
      name: Dispatch bounded physical-device validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_DEVICE_FAMILY: ${{ inputs.device_family }}
        INPUT_DEVICE_CAPABILITY: ${{ inputs.device_capability }}
        INPUT_DEVICE_ALIAS: ${{ inputs.device_alias }}
        INPUT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUT_MAX_DURATION_MINUTES: ${{ inputs.max_duration_minutes }}
        INPUT_EVIDENCE_EXCEPTION_ID: ${{ inputs.evidence_exception_id }}
        INPUT_REQUEST_ID: ${{ inputs.request_id }}
        INPUT_VALIDATED_PLAN: ${{ inputs.validated_plan }}
        INPUT_VALIDATED_PLAN_SHA256: ${{ inputs.validated_plan_sha256 }}
        CIW_DEVICE_SYNTHETIC_MODE: ${{ inputs.synthetic_mode }}
        CIW_DEVICE_EVENT_REPOSITORY: ${{ github.event.repository.full_name || github.repository }}
        CIW_DEVICE_EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        CIW_DEVICE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        CIW_DEVICE_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork && 'true' || 'false' }}
      run: |
        set -Eeuo pipefail
        if [[ "${{ inputs.phase }}" == "cleanup-checkout" ]]; then
          python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/device.py" \
            cleanup-checkout \
            --source-root "${{ inputs.source_root }}"
          exit 0
        fi
        arguments=(
          device validate
          --phase "${{ inputs.phase }}"
          --source-root "${{ inputs.source_root }}"
        )
        if [[ -n "${{ inputs.inventory_fixture }}" ]]; then
          arguments+=(--inventory-fixture "${{ inputs.inventory_fixture }}")
        fi
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" "${arguments[@]}"
