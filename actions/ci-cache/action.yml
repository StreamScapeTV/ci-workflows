name: Central CI toolchain cache
description: >-
  Restore or save one toolchain cache (Gradle or SwiftPM) with narrow keys. Only the integration
  branch (develop, or main when the repository has no develop) saves; every other ref, pull request
  and tag restores only. Run phase restore before the stage and phase save after a successful
  stage. Central must be checked out at ./central-ci and the repository checked out at ./source.

inputs:
  phase:
    description: restore or save
    required: true
  kind:
    description: gradle or swiftpm
    required: true
  repository:
    required: true
  ref:
    required: true
  is_tag:
    required: true
  home:
    description: GRADLE_USER_HOME for gradle, the native user home for swiftpm
    required: true
  token:
    description: Read-only source token used to check whether the repository has a develop branch
    required: true
  log_path:
    description: Stage log file the restore result line is appended to (so it reaches the S3 log)
    required: false
    default: ""
  slot:
    description: Last stage of the request (lint, test or build); part of the exact key so a build request warms a build cache
    required: false
    default: ""
  secrets_to_guard:
    description: Newline separated credential values that must not appear in a saved cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Note the cache phase start
      id: clock
      shell: bash
      run: printf 'start=%s\n' "$(date +%s)" >> "${GITHUB_OUTPUT}"

    - name: Resolve cache identity
      id: identity
      shell: bash
      env:
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_REF: ${{ inputs.ref }}
        SOURCE_IS_TAG: ${{ inputs.is_tag }}
        CACHE_KIND: ${{ inputs.kind }}
        CACHE_HOME: ${{ inputs.home }}
        CACHE_SLOT: ${{ inputs.slot }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -Eeuo pipefail
        # develop if it exists, main only on an explicit 404, anything else fails closed (restore only).
        integration=none
        if output="$(gh api "repos/${SOURCE_REPOSITORY}/git/ref/heads/develop" 2>&1)"; then
          integration=develop
        elif grep -q "HTTP 404" <<<"${output}"; then
          integration=main
        else
          echo "::warning::cannot determine the integration branch; this run only restores caches" >&2
        fi
        export INTEGRATION_BRANCH="${integration}"
        python3 central-ci/scripts/ci/ci_cache.py identity --kind "${CACHE_KIND}" --source source --home "${CACHE_HOME}"
        printf 'integration_branch=%s\n' "${integration}" >> "${GITHUB_OUTPUT}"

    - name: Restore cache
      id: restore
      if: ${{ inputs.phase == 'restore' && steps.identity.outputs.enabled == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.identity.outputs.paths }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore_keys }}

    - name: Record cache restoration
      if: ${{ inputs.phase == 'restore' && steps.identity.outputs.enabled == 'true' }}
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        TRUST: ${{ steps.identity.outputs.trust }}
        INTEGRATION: ${{ steps.identity.outputs.integration_branch }}
        LOG_PATH: ${{ inputs.log_path }}
      run: |
        line="$(printf '== %s-cache: exact_hit=%s matched_key=%s ref_trust=%s integration_branch=%s ==' \
          "${KIND}" "${CACHE_HIT:-false}" "${MATCHED_KEY:-none}" "${TRUST}" "${INTEGRATION}")"
        printf '%s\n' "${line}"
        if test -n "${LOG_PATH}"; then printf '%s\n' "${line}" >> "${LOG_PATH}"; fi

    - name: Record cache restore duration
      if: ${{ inputs.phase == 'restore' && steps.identity.outputs.enabled == 'true' }}
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        STARTED: ${{ steps.clock.outputs.start }}
        LOG_PATH: ${{ inputs.log_path }}
      run: |
        line="$(printf '== %s-cache-restore: seconds=%s ==' "${KIND}" "$(( $(date +%s) - STARTED ))")"
        printf '%s\n' "${line}"
        if test -n "${LOG_PATH}"; then printf '%s\n' "${line}" >> "${LOG_PATH}"; fi

    - name: Check whether this exact key already exists
      id: exists
      if: ${{ inputs.phase == 'save' && steps.identity.outputs.save_allowed == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.identity.outputs.paths }}
        key: ${{ steps.identity.outputs.key }}
        lookup-only: true

    - name: Check cache is safe to save
      id: guard
      if: ${{ steps.exists.outcome == 'success' && steps.exists.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        CACHE_PATHS: ${{ steps.identity.outputs.paths }}
        CI_SECRET_GUARD: ${{ inputs.secrets_to_guard }}
      run: |
        set -Eeuo pipefail
        args=()
        while IFS= read -r cache_path; do
          test -z "${cache_path}" || args+=(--path "${cache_path}")
        done <<< "${CACHE_PATHS}"
        python3 central-ci/scripts/ci/ci_cache.py guard "${args[@]+"${args[@]}"}"

    - name: Save cache (integration branch only)
      if: ${{ steps.guard.outputs.save_allowed == 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.identity.outputs.paths }}
        key: ${{ steps.identity.outputs.key }}

    - name: Record cache save duration
      if: ${{ always() && inputs.phase == 'save' && steps.identity.outputs.enabled == 'true' }}
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        STARTED: ${{ steps.clock.outputs.start }}
        SAVED: ${{ steps.guard.outputs.save_allowed == 'true' && 'true' || 'false' }}
        LOG_PATH: ${{ inputs.log_path }}
      run: |
        line="$(printf '== %s-cache-save: seconds=%s saved=%s ==' "${KIND}" "$(( $(date +%s) - STARTED ))" "${SAVED}")"
        printf '%s\n' "${line}"
        if test -n "${LOG_PATH}"; then printf '%s\n' "${line}" >> "${LOG_PATH}"; fi
