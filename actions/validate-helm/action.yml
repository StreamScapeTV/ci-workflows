name: Validate bounded Helm chart
description: Resolve, validate, and package one caller-owned Helm chart

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  product_id:
    description: Caller-owned Helm product identity
    required: true
  release_version:
    description: Optional exact release version to bind in the isolated package copy
    required: false
  values_profile:
    description: Optional caller-owned product-manifest values profile
    required: false
  policy_path:
    description: Optional caller-owned product policy file path
    required: false
  artifact_exception_id:
    description: Must remain empty because package artifacts are never retained
    required: false
  source_trust:
    description: Explicit admitted source trust classification
    required: true

outputs:
  result:
    value: ${{ steps.helm.outputs.result }}
  chart_digest:
    value: ${{ steps.helm.outputs.chart_digest }}
  artifact_exception_used:
    value: ${{ steps.helm.outputs.artifact_exception_used }}
  chart_package_sha256:
    value: ${{ steps.helm.outputs.chart_package_sha256 }}
  runner_profile:
    value: ${{ steps.helm.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.helm.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.helm.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.helm.outputs.timeout_minutes }}

runs:
  using: composite
  steps:
    - id: helm
      name: Dispatch bounded Helm validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_PRODUCT_ID: ${{ inputs.product_id }}
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUT_VALUES_PROFILE: ${{ inputs.values_profile }}
        INPUT_POLICY_PATH: ${{ inputs.policy_path }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
      run: |
        set -Eeuo pipefail
        PYTHONPATH="${GITHUB_ACTION_PATH}/../../src" \
          python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
            helm validate --phase "${{ inputs.phase }}" --source-root source
