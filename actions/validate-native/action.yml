name: Validate exact native CMake source
description: Execute one bounded product-neutral CMake configure/build/test flow

inputs:
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  working_directory:
    description: Relative CMake source directory within the exact checkout
    required: false
    default: .
  cmake_definitions_json:
    description: Bounded JSON object of CMake -D definitions
    required: false
    default: "{}"
  configure_options_json:
    description: Bounded JSON array of additional CMake configure options
    required: false
    default: "[]"
  cmake_generator:
    description: Optional bounded CMake generator name
    required: false
    default: ""
  build_target:
    description: Optional bounded primary CMake build target
    required: false
    default: ""
  build_configuration:
    description: Optional bounded CMake configuration
    required: false
    default: ""
  build_options_json:
    description: Bounded JSON array passed after cmake --build --
    required: false
    default: "[]"
  test_target:
    description: Bounded CMake target used for tests
    required: false
    default: test
  test_options_json:
    description: Bounded JSON array passed after the test-target build command
    required: false
    default: "[]"
  jobs:
    description: Bounded CMake parallelism from 1 through 64
    required: false
    default: "2"

outputs:
  result:
    value: ${{ steps.native.outputs.result }}
  source_sha:
    value: ${{ steps.native.outputs.source_sha }}
  test_summary:
    value: ${{ steps.native.outputs.test_summary }}
  failure_code:
    value: ${{ steps.native.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: native
      name: Dispatch bounded native validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_CMAKE_DEFINITIONS_JSON: ${{ inputs.cmake_definitions_json }}
        INPUT_CONFIGURE_OPTIONS_JSON: ${{ inputs.configure_options_json }}
        INPUT_CMAKE_GENERATOR: ${{ inputs.cmake_generator }}
        INPUT_BUILD_TARGET: ${{ inputs.build_target }}
        INPUT_BUILD_CONFIGURATION: ${{ inputs.build_configuration }}
        INPUT_BUILD_OPTIONS_JSON: ${{ inputs.build_options_json }}
        INPUT_TEST_TARGET: ${{ inputs.test_target }}
        INPUT_TEST_OPTIONS_JSON: ${{ inputs.test_options_json }}
        INPUT_JOBS: ${{ inputs.jobs }}
      run: |
        set -Eeuo pipefail
        interpreter="$(type -P python3.12 || true)"
        if [[ -z "${interpreter}" ]]; then
          interpreter="$(type -P python3 || true)"
        fi
        if [[ -z "${interpreter}" || "${interpreter}" != /* || ! -x "${interpreter}" ]]; then
          echo '::error::Runner-provided CPython is unavailable.' >&2
          exit 2
        fi
        PYTHONPATH="${GITHUB_ACTION_PATH}/../../src" \
          "${interpreter}" -m ci_workflows.ciw_native \
          --root "${GITHUB_ACTION_PATH}/../.." \
          --workspace "${GITHUB_WORKSPACE}"
