name: Persist normalized CI diagnostics
description: Persist bounded warning/error diagnostics to the fixed Cloudflare D1 sink

inputs:
  ci_run_id:
    description: Agent State CI run UUID
    required: true
  project_key:
    description: Agent State project key
    required: true
  repository:
    description: Full source repository in owner/name form
    required: true
  ref:
    description: Human branch or tag reference
    required: true
  is_tag:
    description: Explicit true/false tag discriminator
    required: true
  workflow_key:
    description: Canonical Central workflow API key
    required: true
  profile:
    description: Bounded product validation profile
    required: true
  status:
    description: Intended terminal CI status
    required: true
  diagnostics_json:
    description: Bounded normalized warning/error diagnostic array
    required: true

outputs:
  diagnostic_key:
    description: Stable D1 diagnostic lookup key
    value: ${{ steps.persist.outputs.diagnostic_key }}
  diagnostic_status:
    description: uploaded only after D1 read-back verification
    value: ${{ steps.persist.outputs.diagnostic_status }}
  diagnostic_sha256:
    description: SHA-256 of canonical normalized diagnostic JSON
    value: ${{ steps.persist.outputs.diagnostic_sha256 }}
  diagnostic_count:
    description: Number of normalized diagnostic rows persisted
    value: ${{ steps.persist.outputs.diagnostic_count }}

runs:
  using: composite
  steps:
    - id: persist
      name: Persist one bounded diagnostic record
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
        INPUT_PROJECT_KEY: ${{ inputs.project_key }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_IS_TAG: ${{ inputs.is_tag }}
        INPUT_WORKFLOW_KEY: ${{ inputs.workflow_key }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_DIAGNOSTICS_JSON: ${{ inputs.diagnostics_json }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" diagnostics persist
