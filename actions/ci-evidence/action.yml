name: Central CI evidence
description: >-
  Scrub configured credentials from the private CI log, upload it through the shared uploader, and
  keep it on the private owning issue when that upload fails. Every step runs even when the product
  failed. The caller must have checked out Central at ./central-ci and passes, in the env of the
  step that uses this action: CI_SECRET_* (values to redact), GOOGLE_DRIVE_CLIENT_ID,
  GOOGLE_DRIVE_CLIENT_SECRET, GOOGLE_DRIVE_REFRESH_TOKEN, GOOGLE_DRIVE_ROOT_FOLDER_ID,
  SOURCE_APP_ID, SOURCE_APP_PRIVATE_KEY, AGENT_STATE_SUPABASE_URL, AGENT_STATE_SUPABASE_SECRET_KEY.

inputs:
  repository:
    required: true
  ref:
    required: true
  ci_run_id:
    required: true
  lane:
    description: Stable lane name, for example android-build
    required: true
  log_path:
    required: true
  file_name:
    required: true

outputs:
  scrub_outcome:
    value: ${{ steps.scrub.outcome }}
  upload_outcome:
    value: ${{ steps.drive.outcome }}

runs:
  using: composite
  steps:
    - name: Scrub configured CI secrets from the private log
      id: scrub
      if: ${{ always() }}
      shell: bash
      env:
        LOG_PATH: ${{ inputs.log_path }}
      run: python3 central-ci/scripts/ci/ci_scrub_log.py "${LOG_PATH}"

    - name: Upload private CI log
      id: drive
      if: ${{ always() && steps.scrub.outcome == 'success' }}
      uses: ./central-ci/actions/google-drive
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        file_path: ${{ inputs.log_path }}
        file_name: ${{ inputs.file_name }}
        mime_type: text/plain

    - name: Preserve log on the private owning issue after upload failure
      if: ${{ always() && steps.drive.outcome == 'failure' && steps.scrub.outcome == 'success' }}
      uses: ./central-ci/actions/private-log-fallback
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        ci_run_id: ${{ inputs.ci_run_id }}
        lane: ${{ inputs.lane }}
        log_path: ${{ inputs.log_path }}
