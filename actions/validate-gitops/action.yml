name: Validate exact GitOps source
description: Plan, execute, clean, or inspect one checked-in source-only GitOps validation profile

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  validation_profile:
    description: Bounded GitOps validation profile
    required: true
  consumer_contract:
    description: Reviewed product-neutral consumer contract identifier
    required: true
  change_base_sha:
    description: Exact base SHA required only by changed-tree
    required: false
    default: ""
  policy_script_profile:
    description: Optional exact contract-owned checked-in policy profile
    required: false
    default: ""
  artifact_exception_id:
    description: Reserved zero-artifact field; non-empty values are rejected
    required: false
    default: ""

outputs:
  result:
    value: ${{ steps.gitops.outputs.result }}
  source_sha:
    value: ${{ steps.gitops.outputs.source_sha }}
  consumer_contract:
    value: ${{ steps.gitops.outputs.consumer_contract }}
  validation_profile:
    value: ${{ steps.gitops.outputs.validation_profile }}
  runner_profile:
    value: ${{ steps.gitops.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.gitops.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.gitops.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.gitops.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.gitops.outputs.source_trust }}
  test_summary:
    value: ${{ steps.gitops.outputs.test_summary }}
  target_ids_json:
    value: ${{ steps.gitops.outputs.target_ids_json }}
  selected_targets_json:
    value: ${{ steps.gitops.outputs.selected_targets_json }}
  validated_files:
    value: ${{ steps.gitops.outputs.validated_files }}
  rendered_objects:
    value: ${{ steps.gitops.outputs.rendered_objects }}
  render_digest:
    value: ${{ steps.gitops.outputs.render_digest }}
  policy_result:
    value: ${{ steps.gitops.outputs.policy_result }}
  tool_versions_json:
    value: ${{ steps.gitops.outputs.tool_versions_json }}
  clean_tree:
    value: ${{ steps.gitops.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.gitops.outputs.cleanup_result }}
  artifact_exception_used:
    value: ${{ steps.gitops.outputs.artifact_exception_used }}
  evidence_id:
    value: ${{ steps.gitops.outputs.evidence_id }}
  failure_code:
    value: ${{ steps.gitops.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: gitops
      name: Dispatch bounded GitOps validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_CONSUMER_CONTRACT: ${{ inputs.consumer_contract }}
        INPUT_CHANGE_BASE_SHA: ${{ inputs.change_base_sha }}
        INPUT_POLICY_SCRIPT_PROFILE: ${{ inputs.policy_script_profile }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/gitops.py" \
          "${{ inputs.phase }}" \
          --source-root source
