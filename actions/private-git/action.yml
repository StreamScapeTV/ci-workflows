name: Connect private Git service
description: Establish hosted Tailscale access or verify persistent self-hosted access to the fixed private Git/Forgejo service

runs:
  using: composite
  steps:
    - name: Require fixed Central Tailscale credentials
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        test -n "${TS_OAUTH_CLIENT_ID:-}" || {
          echo "Missing fixed Central Tailscale OAuth client ID" >&2
          exit 1
        }
        test -n "${TS_OAUTH_SECRET:-}" || {
          echo "Missing fixed Central Tailscale OAuth secret" >&2
          exit 1
        }

    - name: Connect to private Git service
      if: ${{ runner.environment == 'github-hosted' }}
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ env.TS_OAUTH_SECRET }}
        tags: tag:github-ci

    - name: Verify private Git service reachability
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'PY'
        import subprocess
        import sys
        import time

        # A successful Tailscale connection does not prove that the runner's
        # resolver has received the tailnet's private DNS configuration yet.
        # Each probe uses a separate bounded process because getaddrinfo()
        # may ignore the socket connection timeout entirely.
        probe = (
            'import socket; '
            'connection = socket.create_connection(("git.faruqi.dev", 443), timeout=8); '
            'connection.close()'
        )
        for attempt in range(4):
            try:
                subprocess.run(
                    [sys.executable, '-c', probe],
                    check=True, stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL, timeout=12,
                )
                print("private Git service tcp/443 reachable")
                break
            except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                if attempt == 3:
                    print("private Git service unavailable after bounded network readiness probes", file=sys.stderr)
                    raise SystemExit(1)
                time.sleep(3)
        PY
