name: Connect private Git service
description: Establish hosted Tailscale access or verify persistent self-hosted access to the fixed private Git/Forgejo service

runs:
  using: composite
  steps:
    - name: Require fixed Central Tailscale credentials
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        test -n "${TS_OAUTH_CLIENT_ID:-}" || {
          echo "Missing fixed Central Tailscale OAuth client ID" >&2
          exit 1
        }
        test -n "${TS_OAUTH_SECRET:-}" || {
          echo "Missing fixed Central Tailscale OAuth secret" >&2
          exit 1
        }

    - name: Save hosted macOS DNS settings
      id: runner_dns
      if: ${{ runner.environment == 'github-hosted' && runner.os == 'macOS' }}
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/macos_dns.py" capture

    - name: Connect to private Git service
      if: ${{ runner.environment == 'github-hosted' }}
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ env.TS_OAUTH_SECRET }}
        tags: tag:github-ci
        args: ${{ runner.os == 'macOS' && '--accept-dns=false' || '' }}

    - name: Restore hosted macOS DNS settings
      if: ${{ always() && runner.environment == 'github-hosted' && runner.os == 'macOS' && steps.runner_dns.outcome == 'success' }}
      shell: bash
      env:
        DNS_STATE: ${{ steps.runner_dns.outputs.state_path }}
      run: python3 "${GITHUB_ACTION_PATH}/macos_dns.py" restore

    - name: Isolate owned macOS Tailscale build source
      if: ${{ runner.environment == 'github-hosted' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'PYCODE'
        import os
        from pathlib import Path
        import subprocess
        import tempfile

        # Upstream v4 builds on macOS in ./tailscale, then copies both clients
        # into /usr/local/bin. Keep that build source outside product admission;
        # installed clients, tool cache and daemon remain alive through logout.
        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        source = workspace / 'tailscale'
        if source.exists() or source.is_symlink():
            def git(*args):
                return subprocess.check_output(['git', '-C', str(source), *args],
                    stderr=subprocess.DEVNULL, text=True, timeout=15).strip()
            try:
                if source.is_symlink() or not source.is_dir():
                    raise ValueError()
                tracked = subprocess.check_output(['git', '-C', str(workspace),
                    'ls-files', '--', 'tailscale'], stderr=subprocess.DEVNULL,
                    text=True, timeout=15)
                if tracked or Path(git('rev-parse', '--show-toplevel')).resolve() != source:
                    raise ValueError()
                if git('remote', 'get-url', 'origin') not in (
                    'https://github.com/tailscale/tailscale.git',
                    'https://github.com/tailscale/tailscale'):
                    raise ValueError()
                if git('status', '--porcelain', '--untracked-files=all'):
                    raise ValueError()
                for name in ('tailscale', 'tailscaled'):
                    installed = Path('/usr/local/bin') / name
                    if installed.is_symlink() or not installed.is_file() or not os.access(installed, os.X_OK):
                        raise ValueError()
                temporary = Path(os.environ['RUNNER_TEMP']).resolve()
                if temporary == workspace or workspace in temporary.parents:
                    raise ValueError()
                destination = Path(tempfile.mkdtemp(prefix='central-tailscale-build-', dir=temporary)) / 'source'
                source.rename(destination)
            except (ValueError, OSError, subprocess.SubprocessError):
                raise SystemExit('Private network build-source isolation refused unsafe runtime state')
            print('Private network build source isolated; installed clients retained')
        PYCODE

    - name: Verify private Git service reachability
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'PY'
        import subprocess
        import sys
        import time

        # A successful Tailscale connection does not prove that the runner's
        # resolver and private route are ready yet.
        # Each probe uses a separate bounded process because getaddrinfo()
        # may ignore the socket connection timeout entirely.
        probe = (
            'import socket; '
            'connection = socket.create_connection(("git.faruqi.dev", 443), timeout=8); '
            'connection.close()'
        )
        for attempt in range(4):
            try:
                subprocess.run(
                    [sys.executable, '-c', probe],
                    check=True, stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL, timeout=12,
                )
                print("private Git service tcp/443 reachable")
                break
            except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                if attempt == 3:
                    print("private Git service unavailable after bounded network readiness probes", file=sys.stderr)
                    raise SystemExit(1)
                time.sleep(3)
        PY
