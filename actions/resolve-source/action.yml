name: Resolve exact source metadata
description: Internal immutable adapter for the named source-admission function library

inputs:
  source_mode:
    description: Bounded source mode
    required: true
  requested_sha:
    description: Optional exact requested SHA
    required: false
  requested_ref:
    description: Optional human branch or tag name for requested-ref mode
    required: false
    default: ""
  is_tag:
    description: Explicit true/false tag discriminator for requested-ref mode
    required: false
    default: ""
  source_token:
    description: Optional fixed private-repository contents-read token; never emitted
    required: false
    default: ""
  expected_branch:
    description: Optional expected integration branch
    required: false
  release_contract:
    description: Optional bounded release contract
    required: false
  history_depth:
    description: Bounded history depth
    required: false
    default: "1"
  caller_repository:
    description: Optional caller repository assertion
    required: false
  caller_default_branch:
    description: Optional caller default-branch assertion
    required: false
  caller_integration_branch:
    description: Optional caller integration-branch assertion
    required: false
  pr_number:
    description: Optional PR number for freshness revalidation
    required: false
  expected_pr_head_sha:
    description: Optional exact previously admitted PR head SHA
    required: false
  expected_pr_base_sha:
    description: Optional exact previously admitted PR base SHA
    required: false
  expected_pr_merge_sha:
    description: Optional exact previously admitted PR merge SHA
    required: false

outputs:
  caller_repository:
    value: ${{ steps.resolve.outputs.caller_repository }}
  caller_default_branch:
    value: ${{ steps.resolve.outputs.caller_default_branch }}
  caller_integration_branch:
    value: ${{ steps.resolve.outputs.caller_integration_branch }}
  trust_mode:
    value: ${{ steps.resolve.outputs.trust_mode }}
  source_repository:
    value: ${{ steps.resolve.outputs.source_repository }}
  source_sha:
    value: ${{ steps.resolve.outputs.source_sha }}
  requested_sha:
    value: ${{ steps.resolve.outputs.requested_sha }}
  resolved_sha:
    value: ${{ steps.resolve.outputs.resolved_sha }}
  pr_number:
    value: ${{ steps.resolve.outputs.pr_number }}
  pr_head_repository:
    value: ${{ steps.resolve.outputs.pr_head_repository }}
  pr_head_sha:
    value: ${{ steps.resolve.outputs.pr_head_sha }}
  pr_base_branch:
    value: ${{ steps.resolve.outputs.pr_base_branch }}
  pr_base_sha:
    value: ${{ steps.resolve.outputs.pr_base_sha }}
  pr_merge_sha:
    value: ${{ steps.resolve.outputs.pr_merge_sha }}
  tag_name:
    value: ${{ steps.resolve.outputs.tag_name }}
  tag_object_sha:
    value: ${{ steps.resolve.outputs.tag_object_sha }}
  tag_commit_sha:
    value: ${{ steps.resolve.outputs.tag_commit_sha }}
  requires_freshness:
    value: ${{ steps.resolve.outputs.requires_freshness }}
  history_depth:
    value: ${{ steps.resolve.outputs.history_depth }}
  request_id:
    value: ${{ steps.resolve.outputs.request_id }}
  evidence_id:
    value: ${{ steps.resolve.outputs.evidence_id }}

runs:
  using: composite
  steps:
    - id: resolve
      name: Resolve and validate exact source metadata
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        GITHUB_TOKEN: ${{ inputs.source_token || github.token }}
        INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
        INPUT_REQUESTED_SHA: ${{ inputs.requested_sha }}
        INPUT_REQUESTED_REF: ${{ inputs.requested_ref }}
        INPUT_IS_TAG: ${{ inputs.is_tag }}
        INPUT_EXPECTED_BRANCH: ${{ inputs.expected_branch }}
        INPUT_RELEASE_CONTRACT: ${{ inputs.release_contract }}
        INPUT_HISTORY_DEPTH: ${{ inputs.history_depth }}
        INPUT_CALLER_REPOSITORY: ${{ inputs.caller_repository }}
        INPUT_CALLER_DEFAULT_BRANCH: ${{ inputs.caller_default_branch }}
        INPUT_CALLER_INTEGRATION_BRANCH: ${{ inputs.caller_integration_branch }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_EXPECTED_PR_HEAD_SHA: ${{ inputs.expected_pr_head_sha }}
        INPUT_EXPECTED_PR_BASE_SHA: ${{ inputs.expected_pr_base_sha }}
        INPUT_EXPECTED_PR_MERGE_SHA: ${{ inputs.expected_pr_merge_sha }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          source resolve
