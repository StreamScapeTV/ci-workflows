name: Validate exact Apple source
description: Plan, execute, clean, or inspect legacy, protected-full, and simulator-confidence Apple validation

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  source_repository:
    description: Optional exact source repository in owner/name form; defaults to the caller repository
    required: false
    default: ""
  validation_scope:
    description: legacy, protected-full, or simulator-confidence
    required: false
    default: legacy
  validation_plan_json:
    description: Strict bounded caller-owned protected-full stage plan or simulator-confidence packet
    required: false
    default: ""
  validation_profile:
    description: Legacy bounded Apple validation profile
    required: false
    default: ""
  version_file:
    description: Legacy optional exact contract-matching version or resolution authority file
    required: false
    default: ""
  working_directory:
    description: Legacy exact contract-matching working directory
    required: false
    default: "."
  command_profile:
    description: Legacy reviewed product-neutral Apple consumer contract identifier
    required: false
    default: ""
  script_path:
    description: Legacy optional exact contract-matching checked-in script
    required: false
    default: ""
  platform:
    description: Legacy exact bounded Apple platform selected by the reviewed profile
    required: false
    default: ""
  scheme:
    description: Legacy optional exact contract-matching scheme
    required: false
    default: ""
  destination_profile:
    description: Legacy optional exact contract-matching destination profile identifier
    required: false
    default: ""
  artifact_exception_id:
    description: Optional registered redacted diagnostic exception; absent by default
    required: false
    default: ""
  source_trust:
    description: Internal exact admitted source trust class
    required: false
    default: ""
  private_dependency_repository:
    description: Optional exact private dependency repository for protected-full
    required: false
    default: ""
  private_dependency_sha:
    description: Optional exact private dependency SHA for protected-full
    required: false
    default: ""
  private_dependency_subdirectory:
    description: Optional bounded private dependency subdirectory
    required: false
    default: "."
  private_dependency_id:
    description: Optional bounded private dependency identity
    required: false
    default: ""
  private_dependency_verified:
    description: Internal exact-checkout verification receipt
    required: false
    default: ""
  private_dependency_remotes_erased:
    description: Internal exact-checkout remote-erasure receipt
    required: false
    default: ""
  private_dependency_credentials_erased:
    description: Internal exact-checkout credential-erasure receipt
    required: false
    default: ""
  private_dependency_head_sha:
    description: Internal exact-checkout observed dependency SHA
    required: false
    default: ""
  private_dependency_checkout_repository:
    description: Internal exact-checkout repository receipt
    required: false
    default: ""
  private_dependency_checkout_id:
    description: Internal exact-checkout identity receipt
    required: false
    default: ""
  private_dependency_expected_subpath:
    description: Internal exact-checkout expected subpath receipt
    required: false
    default: ""

outputs:
  result:
    value: ${{ steps.apple.outputs.result }}
  source_sha:
    value: ${{ steps.apple.outputs.source_sha }}
  consumer_contract:
    value: ${{ steps.apple.outputs.consumer_contract }}
  validation_profile:
    value: ${{ steps.apple.outputs.validation_profile }}
  task_profile:
    value: ${{ steps.apple.outputs.task_profile }}
  runner_profile:
    value: ${{ steps.apple.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.apple.outputs.runs_on_json }}
  planner_runner_profile:
    value: ${{ steps.apple.outputs.planner_runner_profile }}
  workspace_profile:
    value: ${{ steps.apple.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.apple.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.apple.outputs.source_trust }}
  xcode_version:
    value: ${{ steps.apple.outputs.xcode_version }}
  xcode_build:
    value: ${{ steps.apple.outputs.xcode_build }}
  swift_version:
    value: ${{ steps.apple.outputs.swift_version }}
  sdk_versions_json:
    value: ${{ steps.apple.outputs.sdk_versions_json }}
  destination_family:
    value: ${{ steps.apple.outputs.destination_family }}
  simulator_identity:
    value: ${{ steps.apple.outputs.simulator_identity }}
  test_summary:
    value: ${{ steps.apple.outputs.test_summary }}
  output_verified:
    value: ${{ steps.apple.outputs.output_verified }}
  artifact_exception_used:
    value: ${{ steps.apple.outputs.artifact_exception_used }}
  clean_tree:
    value: ${{ steps.apple.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.apple.outputs.cleanup_result }}
  evidence_id:
    value: ${{ steps.apple.outputs.evidence_id }}
  failure_code:
    value: ${{ steps.apple.outputs.failure_code }}
  private_dependency_used:
    value: ${{ steps.apple.outputs.private_dependency_used }}
  private_dependency_repository:
    value: ${{ steps.apple.outputs.private_dependency_repository }}
  private_dependency_sha:
    value: ${{ steps.apple.outputs.private_dependency_sha }}
  private_dependency_subdirectory:
    value: ${{ steps.apple.outputs.private_dependency_subdirectory }}
  private_dependency_id:
    value: ${{ steps.apple.outputs.private_dependency_id }}

runs:
  using: composite
  steps:
    - id: apple
      name: Dispatch bounded Apple validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        INPUT_VALIDATION_SCOPE: ${{ inputs.validation_scope }}
        INPUT_VALIDATION_PLAN_JSON: ${{ inputs.validation_plan_json }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_SCHEME: ${{ inputs.scheme }}
        INPUT_DESTINATION_PROFILE: ${{ inputs.destination_profile }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
        INPUT_PRIVATE_DEPENDENCY_REPOSITORY: ${{ inputs.private_dependency_repository }}
        INPUT_PRIVATE_DEPENDENCY_SHA: ${{ inputs.private_dependency_sha }}
        INPUT_PRIVATE_DEPENDENCY_SUBDIRECTORY: ${{ inputs.private_dependency_subdirectory }}
        INPUT_PRIVATE_DEPENDENCY_ID: ${{ inputs.private_dependency_id }}
        INPUT_PRIVATE_DEPENDENCY_VERIFIED: ${{ inputs.private_dependency_verified }}
        INPUT_PRIVATE_DEPENDENCY_REMOTES_ERASED: ${{ inputs.private_dependency_remotes_erased }}
        INPUT_PRIVATE_DEPENDENCY_CREDENTIALS_ERASED: ${{ inputs.private_dependency_credentials_erased }}
        INPUT_PRIVATE_DEPENDENCY_HEAD_SHA: ${{ inputs.private_dependency_head_sha }}
        INPUT_PRIVATE_DEPENDENCY_CHECKOUT_REPOSITORY: ${{ inputs.private_dependency_checkout_repository }}
        INPUT_PRIVATE_DEPENDENCY_CHECKOUT_ID: ${{ inputs.private_dependency_checkout_id }}
        INPUT_PRIVATE_DEPENDENCY_EXPECTED_SUBPATH: ${{ inputs.private_dependency_expected_subpath }}
      run: |
        set -Eeuo pipefail
        if [[ "${{ inputs.validation_scope }}" == "simulator-confidence" ]]; then
          python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/apple_simulator_confidence.py" \
            --phase "${{ inputs.phase }}" \
            --source-root source
          exit 0
        fi
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          apple validate \
          --phase "${{ inputs.phase }}" \
          --source-root source
