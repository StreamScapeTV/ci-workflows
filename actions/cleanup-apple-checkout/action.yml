name: Remove fixed Apple checkout
description: Remove only the central or admitted checkout through the Apple no-follow cleanup adapter

inputs:
  target:
    description: Bounded checkout selector
    required: true

runs:
  using: composite
  steps:
    - name: Remove fixed checkout without following links
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -Eeuo pipefail
        case "${TARGET}" in
          central|source) ;;
          *) exit 2 ;;
        esac
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/apple_checkout_cleanup.py" \
          "${TARGET}"
