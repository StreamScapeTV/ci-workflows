name: Validate OCI build
description: Plan, execute, clean, or verify one checked-in non-publishing OCI product through ciw

inputs:
  phase:
    description: Bounded internal phase
    required: false
    default: execute
  admitted_sha:
    description: Exact lowercase source SHA admitted by source.resolve
    required: true
  product_id:
    description: Checked-in OCI product identifier
    required: true
  release_version:
    description: Optional exact SemVer metadata value
    required: false
  platform_set:
    description: Optional exact contract-owned platform set
    required: false
  artifact_exception_id:
    description: Initial API requires empty because routine artifacts are forbidden
    required: false

outputs:
  result:
    value: ${{ steps.oci.outputs.result }}
  source_sha:
    value: ${{ steps.oci.outputs.source_sha }}
  product_id:
    value: ${{ steps.oci.outputs.product_id }}
  release_version:
    value: ${{ steps.oci.outputs.release_version }}
  manifest_digests_json:
    value: ${{ steps.oci.outputs.manifest_digests_json }}
  publication_manifest_digests_json:
    value: ${{ steps.oci.outputs.publication_manifest_digests_json }}
  platform_results_json:
    value: ${{ steps.oci.outputs.platform_results_json }}
  resolved_inputs_json:
    value: ${{ steps.oci.outputs.resolved_inputs_json }}
  clean_tree:
    value: ${{ steps.oci.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.oci.outputs.cleanup_result }}
  artifact_exception_used:
    value: ${{ steps.oci.outputs.artifact_exception_used }}
  evidence_id:
    value: ${{ steps.oci.outputs.evidence_id }}
  canary_id:
    value: ${{ steps.oci.outputs.canary_id }}
  previous_known_good:
    value: ${{ steps.oci.outputs.previous_known_good }}
  rollback_id:
    value: ${{ steps.oci.outputs.rollback_id }}
  runner_profile:
    value: ${{ steps.oci.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.oci.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.oci.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.oci.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.oci.outputs.source_trust }}
  failure_code:
    value: ${{ steps.oci.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: oci
      name: Dispatch bounded OCI build operation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_PRODUCT_ID: ${{ inputs.product_id }}
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUT_PLATFORM_SET: ${{ inputs.platform_set }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          oci validate \
          --phase "${{ inputs.phase }}" \
          --source-root source
