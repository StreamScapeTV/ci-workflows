name: Publish bounded Helm chart
description: Validate, package, and publish one product-owned Helm chart with normal OCI registry credentials

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact caller source SHA
    required: true
  product_id:
    description: Registered Helm product identity whose chart metadata lives in caller source
    required: true
  release_version:
    description: Exact SemVer used for the packaged chart
    required: true
  release_mode:
    description: Legacy compatibility input; publication policy is owned by the caller
    required: false
    default: ""
  values_profile:
    description: Optional caller-owned product-manifest values profile
    required: false
  policy_path:
    description: Optional caller-owned product policy path
    required: false
  image_digest:
    description: Legacy compatibility input; generic Helm publication does not require image evidence
    required: false
  immutable_references_json:
    description: Legacy compatibility input; generic Helm publication does not require OCI read-back evidence
    required: false
  source_trust:
    description: Explicit admitted source trust classification
    required: true
  registry_username:
    description: Named OCI registry username
    required: false
  registry_token:
    description: Named OCI registry token
    required: false

outputs:
  result:
    value: ${{ steps.helm.outputs.result }}
  chart_digest:
    value: ${{ steps.helm.outputs.chart_digest }}
  immutable_references_json:
    value: ${{ steps.helm.outputs.immutable_references_json }}
  chart_package_sha256:
    value: ${{ steps.helm.outputs.chart_package_sha256 }}
  published:
    value: ${{ steps.helm.outputs.published }}
  runner_profile:
    value: ${{ steps.helm.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.helm.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.helm.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.helm.outputs.timeout_minutes }}

runs:
  using: composite
  steps:
    - id: helm
      name: Dispatch bounded Helm publication
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_PRODUCT_ID: ${{ inputs.product_id }}
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUT_VALUES_PROFILE: ${{ inputs.values_profile }}
        INPUT_POLICY_PATH: ${{ inputs.policy_path }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry_token }}
      run: |
        set -Eeuo pipefail
        runtime_root="${RUNNER_TEMP}/ciw-helm-publication-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        case "${runtime_root}" in "${RUNNER_TEMP}"/*) ;; *) exit 2 ;; esac
        rm -rf -- "${runtime_root}"
        mkdir -p -- "${runtime_root}"
        cleanup_runtime() { rm -rf -- "${runtime_root}"; }
        trap cleanup_runtime EXIT
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/bootstrap_validation_runtime.py" \
          --lock "${GITHUB_ACTION_PATH}/../../contracts/action-tool-lock.json" \
          --target "${runtime_root}"
        export PYTHONPATH="${runtime_root}:${GITHUB_ACTION_PATH}/../../src"
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          helm publish --phase "${{ inputs.phase }}" --source-root source
