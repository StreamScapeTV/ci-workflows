name: Publish bounded Helm chart
description: Publish a product-contract Helm chart once or verify an existing immutable version and prove an OCI pull read-back

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact tagged caller source SHA
    required: true
  product_id:
    description: Central product-contract identifier
    required: true
  release_version:
    description: Exact immutable release version
    required: true
  release_mode:
    description: Exact internal release authority mode: tag-push or existing-tag
    required: true
  values_profile:
    description: Optional product-manifest values profile
    required: false
  policy_path:
    description: Optional product-manifest policy file path
    required: false
  image_digest:
    description: Exact image_digest output from reusable-oci-publish; required only when the chart binds a published image
    required: false
  immutable_references_json:
    description: Exact immutable_references_json output from reusable-oci-publish; required only when the chart binds a published image
    required: false
  source_trust:
    description: Explicit admitted source trust classification
    required: true
  registry_username:
    description: Named OCI registry username
    required: false
  registry_token:
    description: Named OCI registry token
    required: false

outputs:
  result:
    value: ${{ steps.helm.outputs.result }}
  chart_digest:
    value: ${{ steps.helm.outputs.chart_digest }}
  immutable_references_json:
    value: ${{ steps.helm.outputs.immutable_references_json }}
  chart_package_sha256:
    value: ${{ steps.helm.outputs.chart_package_sha256 }}
  published:
    value: ${{ steps.helm.outputs.published }}
  runner_profile:
    value: ${{ steps.helm.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.helm.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.helm.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.helm.outputs.timeout_minutes }}

runs:
  using: composite
  steps:
    - id: helm
      name: Dispatch bounded Helm publication
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_PRODUCT_ID: ${{ inputs.product_id }}
        INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
        INPUT_VALUES_PROFILE: ${{ inputs.values_profile }}
        INPUT_POLICY_PATH: ${{ inputs.policy_path }}
        INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
        INPUT_IMMUTABLE_REFERENCES_JSON: ${{ inputs.immutable_references_json }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry_token }}
      run: |
        set -Eeuo pipefail
        case "${{ inputs.phase }}" in
          plan)
            python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/helm_release.py" validate-input
            python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
              helm publish --phase plan --source-root source
            ;;
          execute)
            python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/helm_release.py" execute
            ;;
          cleanup|residue)
            python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
              helm publish --phase "${{ inputs.phase }}" --source-root source
            ;;
          *)
            echo "unsupported Helm publication phase" >&2
            exit 2
            ;;
        esac
