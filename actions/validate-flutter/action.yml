name: Validate exact Flutter source
description: Plan, execute, clean, or inspect one checked-in Flutter validation profile

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  consumer_contract:
    description: Reviewed product-neutral Flutter consumer contract identifier
    required: true
  validation_profile:
    description: source-audit, quality, canonical-gate, android-debug, ios-simulator, compatibility-smoke, or device-handoff
    required: true
  source_trust:
    description: Exact admitted source trust class
    required: false
    default: trusted-pr

outputs:
  result:
    value: ${{ steps.flutter.outputs.result }}
  source_sha:
    value: ${{ steps.flutter.outputs.source_sha }}
  consumer_contract:
    value: ${{ steps.flutter.outputs.consumer_contract }}
  validation_profile:
    value: ${{ steps.flutter.outputs.validation_profile }}
  runner_profile:
    value: ${{ steps.flutter.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.flutter.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.flutter.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.flutter.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.flutter.outputs.source_trust }}
  flutter_version:
    value: ${{ steps.flutter.outputs.flutter_version }}
  dart_version:
    value: ${{ steps.flutter.outputs.dart_version }}
  framework_revision:
    value: ${{ steps.flutter.outputs.framework_revision }}
  engine_revision:
    value: ${{ steps.flutter.outputs.engine_revision }}
  lockfile_sha256:
    value: ${{ steps.flutter.outputs.lockfile_sha256 }}
  stage_summary_json:
    value: ${{ steps.flutter.outputs.stage_summary_json }}
  clean_tree:
    value: ${{ steps.flutter.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.flutter.outputs.cleanup_result }}
  output_verified:
    value: ${{ steps.flutter.outputs.output_verified }}
  artifact_exception_used:
    value: ${{ steps.flutter.outputs.artifact_exception_used }}
  device_handoff_json:
    value: ${{ steps.flutter.outputs.device_handoff_json }}
  evidence_id:
    value: ${{ steps.flutter.outputs.evidence_id }}
  install_required:
    value: ${{ steps.flutter.outputs.install_required }}
  node_composition:
    value: ${{ steps.flutter.outputs.node_composition }}
  failure_code:
    value: ${{ steps.flutter.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: flutter
      name: Dispatch bounded Flutter validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_CONSUMER_CONTRACT: ${{ inputs.consumer_contract }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/flutter.py" \
          "${{ inputs.phase }}" \
          --source-root source
