name: Validate exact Flutter source
description: Plan, isolate, verify, execute, clean, or inspect one checked-in Flutter validation profile

inputs:
  phase:
    description: "Bounded internal phase: plan, persistent-cache-snapshot, pub-cache-bind, verify-toolchain, execute, persistent-cache-verify, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  validation_profile:
    description: Bounded Flutter validation profile
    required: true
  version_file:
    description: Optional exact contract-matching pin file
    required: false
    default: ""
  working_directory:
    description: Optional exact contract-matching working directory
    required: false
    default: "."
  command_profile:
    description: Reviewed product-neutral Flutter consumer contract identifier
    required: true
  script_path:
    description: Optional exact contract-matching checked-in gate
    required: false
    default: ""
  platform:
    description: Optional exact contract-matching platform boundary
    required: false
    default: ""
  artifact_exception_id:
    description: Reserved zero-artifact field; non-empty values are rejected
    required: false
    default: ""
  source_trust:
    description: Internal exact admitted source trust class
    required: false
    default: ""
  primary_failure_code:
    description: Internal primary execution failure preserved across always-run cleanup
    required: false
    default: ""

outputs:
  result:
    value: ${{ steps.flutter.outputs.result }}
  source_sha:
    value: ${{ steps.flutter.outputs.source_sha }}
  consumer_contract:
    value: ${{ steps.flutter.outputs.consumer_contract }}
  validation_profile:
    value: ${{ steps.flutter.outputs.validation_profile }}
  runner_profile:
    value: ${{ steps.flutter.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.flutter.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.flutter.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.flutter.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.flutter.outputs.source_trust }}
  flutter_version:
    value: ${{ steps.flutter.outputs.flutter_version }}
  dart_version:
    value: ${{ steps.flutter.outputs.dart_version }}
  framework_revision:
    value: ${{ steps.flutter.outputs.framework_revision }}
  engine_revision:
    value: ${{ steps.flutter.outputs.engine_revision }}
  gradle_version:
    value: ${{ steps.flutter.outputs.gradle_version }}
  jdk_distribution:
    value: ${{ steps.flutter.outputs.jdk_distribution }}
  jdk_version:
    value: ${{ steps.flutter.outputs.jdk_version }}
  java_version:
    value: ${{ steps.flutter.outputs.java_version }}
  java_runtime_version:
    value: ${{ steps.flutter.outputs.java_runtime_version }}
  java_vendor:
    value: ${{ steps.flutter.outputs.java_vendor }}
  javac_version:
    value: ${{ steps.flutter.outputs.javac_version }}
  jdk_setup_action:
    value: ${{ steps.flutter.outputs.jdk_setup_action }}
  lockfile_sha256:
    value: ${{ steps.flutter.outputs.lockfile_sha256 }}
  stage_summary_json:
    value: ${{ steps.flutter.outputs.stage_summary_json }}
  test_summary:
    value: ${{ steps.flutter.outputs.stage_summary_json }}
  clean_tree:
    value: ${{ steps.flutter.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.flutter.outputs.cleanup_result }}
  output_verified:
    value: ${{ steps.flutter.outputs.output_verified }}
  artifact_exception_used:
    value: ${{ steps.flutter.outputs.artifact_exception_used }}
  device_handoff_json:
    value: ${{ steps.flutter.outputs.device_handoff_json }}
  evidence_id:
    value: ${{ steps.flutter.outputs.evidence_id }}
  install_required:
    value: ${{ steps.flutter.outputs.install_required }}
  node_composition:
    value: ${{ steps.flutter.outputs.node_composition }}
  pub_cache_path:
    value: ${{ steps.flutter.outputs.pub_cache_path }}
  persistent_pub_cache_path:
    value: ${{ steps.flutter.outputs.persistent_pub_cache_path }}
  persistent_pub_cache_unchanged:
    value: ${{ steps.flutter.outputs.persistent_pub_cache_unchanged }}
  failure_code:
    value: ${{ steps.flutter.outputs.failure_code }}
  primary_failure_code:
    value: ${{ steps.flutter.outputs.primary_failure_code }}
  cleanup_failure_code:
    value: ${{ steps.flutter.outputs.cleanup_failure_code }}

runs:
  using: composite
  steps:
    - id: flutter
      name: Dispatch bounded Flutter validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
        INPUT_SOURCE_TRUST: ${{ inputs.source_trust }}
        INPUT_PRIMARY_FAILURE_CODE: ${{ inputs.primary_failure_code }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/flutter.py" \
          "${{ inputs.phase }}" \
          --source-root source
