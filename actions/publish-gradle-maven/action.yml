name: Publish Gradle Maven packages
description: Validate, publish, and clean one bounded Gradle Maven package set

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact lowercase caller source SHA
    required: true
  source_root:
    description: Exact caller checkout root
    required: false
    default: source
  expected_branch:
    description: Expected caller branch; Maven publication accepts develop only
    required: false
    default: develop
  working_directory:
    description: Repository-relative Gradle project directory
    required: false
    default: .
  gradle_wrapper_path:
    description: Checked-in Gradle wrapper path relative to working_directory
    required: false
    default: gradlew
  version_file:
    description: Repository-relative stable VERSION file
    required: false
    default: VERSION
  arguments_json:
    description: Bounded JSON list of Maven-publication Gradle tasks
    required: false
    default: ""
  registry_username:
    description: Workflow-scoped private Maven registry username
    required: false
  registry_token:
    description: Workflow-scoped private Maven registry token
    required: false

outputs:
  release_version:
    description: Exact Maven version derived from VERSION and caller ref
    value: ${{ steps.publish.outputs.release_version }}
  gradle_wall_ms:
    description: One Gradle publication process wall time in milliseconds
    value: ${{ steps.publish.outputs.gradle_wall_ms }}

runs:
  using: composite
  steps:
    - id: publish
      name: Dispatch bounded Gradle Maven publication phase
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONPATH: ${{ github.action_path }}/../../src
        INPUT_PHASE: ${{ inputs.phase }}
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_SOURCE_ROOT: ${{ inputs.source_root }}
        INPUT_EXPECTED_BRANCH: ${{ inputs.expected_branch }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_GRADLE_WRAPPER_PATH: ${{ inputs.gradle_wrapper_path }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_ARGUMENTS_JSON: ${{ inputs.arguments_json }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry_token }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/gradle_maven_publish.py"
