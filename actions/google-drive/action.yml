name: Upload file to Google Drive

description: Upload one file under a fixed Drive root at <repository>/<ref>[/<subdirectory>]/<file-name>, updating the exact file in place unless immutable mode is requested.

inputs:
  repository:
    description: Full GitHub repository name (owner/name)
    required: true
  ref:
    description: Exact requested Git ref name or fixed logical folder name
    required: true
  subdirectory:
    description: Optional single bounded child folder below ref
    required: false
    default: ""
  repository_folder_id:
    description: Optional pre-existing durable Drive folder ID for the repository directly below the configured root
    required: false
    default: ""
  file_path:
    description: Local file to upload
    required: true
  file_name:
    description: Exact Google Drive filename
    required: true
  previous_file_name:
    description: Optional exact legacy filename to rename/update in place only when the new filename is absent
    required: false
    default: ""
  gzip:
    description: Gzip the local file before upload
    required: false
    default: "false"
  mime_type:
    description: MIME type of the uploaded bytes
    required: false
    default: application/octet-stream
  immutable:
    description: When true, an existing exact file must have byte-identical content and is never overwritten
    required: false
    default: "false"

outputs:
  file_id:
    value: ${{ steps.upload.outputs.file_id }}
  folder_id:
    value: ${{ steps.upload.outputs.folder_id }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      env:
        DRIVE_REPOSITORY: ${{ inputs.repository }}
        DRIVE_REF: ${{ inputs.ref }}
        DRIVE_SUBDIRECTORY: ${{ inputs.subdirectory }}
        DRIVE_REPOSITORY_FOLDER_ID: ${{ inputs.repository_folder_id }}
        DRIVE_FILE_PATH: ${{ inputs.file_path }}
        DRIVE_FILE_NAME: ${{ inputs.file_name }}
        DRIVE_PREVIOUS_FILE_NAME: ${{ inputs.previous_file_name }}
        DRIVE_GZIP: ${{ inputs.gzip }}
        DRIVE_MIME_TYPE: ${{ inputs.mime_type }}
        DRIVE_IMMUTABLE: ${{ inputs.immutable }}
      run: |
        set -Eeuo pipefail
        : "${GOOGLE_DRIVE_CLIENT_ID:?GOOGLE_DRIVE_CLIENT_ID is required}"
        : "${GOOGLE_DRIVE_CLIENT_SECRET:?GOOGLE_DRIVE_CLIENT_SECRET is required}"
        : "${GOOGLE_DRIVE_REFRESH_TOKEN:?GOOGLE_DRIVE_REFRESH_TOKEN is required}"
        : "${GOOGLE_DRIVE_ROOT_FOLDER_ID:?GOOGLE_DRIVE_ROOT_FOLDER_ID is required}"
        : "${DRIVE_REPOSITORY:?repository is required}"
        : "${DRIVE_REF:?ref is required}"
        : "${DRIVE_FILE_PATH:?file_path is required}"
        : "${DRIVE_FILE_NAME:?file_name is required}"
        test -f "${DRIVE_FILE_PATH}"
        case "${DRIVE_GZIP}" in
          true|false) ;;
          *) echo "gzip must be true or false" >&2; exit 2 ;;
        esac
        case "${DRIVE_IMMUTABLE}" in
          true|false) ;;
          *) echo "immutable must be true or false" >&2; exit 2 ;;
        esac
        if test "${DRIVE_IMMUTABLE}" = "true" && test "${DRIVE_GZIP}" = "true"; then
          echo "immutable uploads require caller-supplied deterministic bytes" >&2
          exit 2
        fi
        if test -n "${DRIVE_PREVIOUS_FILE_NAME}"; then
          test "${DRIVE_PREVIOUS_FILE_NAME}" != "${DRIVE_FILE_NAME}" || {
            echo "previous_file_name must differ from file_name" >&2
            exit 2
          }
          test "${DRIVE_IMMUTABLE}" != "true" || {
            echo "previous_file_name is not supported for immutable uploads" >&2
            exit 2
          }
        fi
        case "${DRIVE_REPOSITORY}" in
          */*) ;;
          *) echo "repository must be owner/name" >&2; exit 2 ;;
        esac
        test "${DRIVE_REF#refs/heads/}" = "${DRIVE_REF}" || { echo "ref must be the requested logical ref name" >&2; exit 2; }
        test "${DRIVE_REF#refs/tags/}" = "${DRIVE_REF}" || { echo "ref must be the requested logical ref name" >&2; exit 2; }
        if test -n "${DRIVE_SUBDIRECTORY}"; then
          [[ "${DRIVE_SUBDIRECTORY}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]] || {
            echo "subdirectory must be one bounded child folder" >&2
            exit 2
          }
        fi

        repository_name="${DRIVE_REPOSITORY##*/}"
        upload_path="${DRIVE_FILE_PATH}"
        temp_archive=""
        headers_file="${RUNNER_TEMP}/drive-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.headers"
        media_headers_file="${RUNNER_TEMP}/drive-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.media.headers"
        media_response_file="${RUNNER_TEMP}/drive-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.media.json"
        existing_download_file="${RUNNER_TEMP}/drive-existing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"
        cleanup() {
          rm -f "${headers_file}" "${media_headers_file}" "${media_response_file}" "${existing_download_file}"
          test -z "${temp_archive}" || rm -f "${temp_archive}"
        }
        trap cleanup EXIT

        if test "${DRIVE_GZIP}" = "true"; then
          temp_archive="${RUNNER_TEMP}/drive-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.gz"
          gzip -c "${DRIVE_FILE_PATH}" > "${temp_archive}"
          upload_path="${temp_archive}"
        fi

        access_token="$(
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token \
          | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)'
        )"
        echo "::add-mask::${access_token}"

        drive_list_url() {
          python3 - "$1" "$2" "$3" "${4:-}" <<'PY'
        import sys
        import urllib.parse

        parent, name, kind, page_token = sys.argv[1:5]
        def literal(value: str) -> str:
            return value.replace("\\", "\\\\").replace("'", "\\'")

        clauses = [
            f"'{literal(parent)}' in parents",
            f"name = '{literal(name)}'",
            "trashed = false",
        ]
        if kind == "folder":
            clauses.append("mimeType = 'application/vnd.google-apps.folder'")
        else:
            clauses.append("mimeType != 'application/vnd.google-apps.folder'")
        params = {
            "q": " and ".join(clauses),
            "spaces": "drive",
            "fields": (
                "nextPageToken,files(id,name,mimeType,createdTime)"
                if kind == "folder"
                else "files(id,name,mimeType,createdTime)"
            ),
            "pageSize": "100",
        }
        if page_token:
            params["pageToken"] = page_token
        query = urllib.parse.urlencode(params)
        print("https://www.googleapis.com/drive/v3/files?" + query)
        PY
        }

        unique_id() {
          python3 -c '
        import json, sys
        files = json.load(sys.stdin).get("files", [])
        if len(files) > 1:
            raise SystemExit("duplicate Google Drive entries for one exact parent/name")
        print(files[0]["id"] if files else "")
        '
        }

        resolve_existing_file() {
          current_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "$(drive_list_url "${target_folder_id}" "${DRIVE_FILE_NAME}" file)")"
          current_id="$(printf '%s' "${current_response}" | unique_id)"
          previous_id=""
          if test -n "${DRIVE_PREVIOUS_FILE_NAME}"; then
            previous_response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "$(drive_list_url "${target_folder_id}" "${DRIVE_PREVIOUS_FILE_NAME}" file)")"
            previous_id="$(printf '%s' "${previous_response}" | unique_id)"
          fi
          if test -n "${current_id}" && test -n "${previous_id}" && test "${current_id}" != "${previous_id}"; then
            echo "both current and previous Google Drive filenames exist; refusing ambiguous migration" >&2
            return 1
          fi
          if test -n "${current_id}"; then
            printf '%s' "${current_id}"
          else
            printf '%s' "${previous_id}"
          fi
        }

        merge_folder_candidates() {
          python3 - "$1" "$2" <<'PY'
        import json, sys

        merged = {}
        for raw in sys.argv[1:3]:
            payload = json.loads(raw)
            files = payload.get("files", [])
            if not isinstance(files, list):
                raise SystemExit("Google Drive folder lookup returned invalid files metadata")
            for value in files:
                folder_id = value.get("id")
                created_time = value.get("createdTime")
                if not folder_id or not created_time:
                    raise SystemExit("Google Drive folder lookup returned incomplete canonical metadata")
                previous = merged.get(folder_id)
                if previous is not None and previous["createdTime"] != created_time:
                    raise SystemExit("Google Drive folder lookup returned inconsistent canonical metadata")
                merged[folder_id] = {"id": folder_id, "createdTime": created_time}
        print(json.dumps({"files": list(merged.values())}, separators=(",", ":")))
        PY
        }

        drive_list_folders() {
          parent="$1"
          name="$2"
          page_token=""
          page_count=0
          accumulated='{"files":[]}'
          while :; do
            page_count=$((page_count + 1))
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "$(drive_list_url "${parent}" "${name}" folder "${page_token}")")"
            accumulated="$(merge_folder_candidates "${accumulated}" "${response}")"
            next_page_token="$(printf '%s' "${response}" | python3 -c '
        import json, sys
        token = json.load(sys.stdin).get("nextPageToken", "")
        if not isinstance(token, str):
            raise SystemExit("Google Drive folder lookup returned invalid pagination metadata")
        print(token)
        ')"
            if test -z "${next_page_token}"; then
              break
            fi
            if test "${page_count}" -ge 100; then
              echo "Google Drive exact folder lookup exceeded bounded pagination limit" >&2
              return 1
            fi
            page_token="${next_page_token}"
          done
          printf '%s' "${accumulated}"
        }

        folder_selection() {
          python3 -c '
        import datetime, json, sys
        files = json.load(sys.stdin).get("files", [])
        for value in files:
            if not value.get("id") or not value.get("createdTime"):
                raise SystemExit("Google Drive folder lookup returned incomplete canonical metadata")
        def created_at(value):
            return datetime.datetime.fromisoformat(value["createdTime"].replace("Z", "+00:00"))
        files.sort(key=lambda value: (created_at(value), value["id"]))
        if files:
            print(files[0]["id"], len(files))
        else:
            print("- 0")
        '
        }

        drive_children_url() {
          python3 - "$1" <<'PY'
        import sys
        import urllib.parse

        parent = sys.argv[1]
        literal = parent.replace("\\", "\\\\").replace("'", "\\'")
        query = urllib.parse.urlencode(
            {
                "q": f"'{literal}' in parents and trashed = false",
                "spaces": "drive",
                "fields": "files(id)",
                "pageSize": "1",
            }
        )
        print("https://www.googleapis.com/drive/v3/files?" + query)
        PY
        }

        folder_is_empty() {
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "$(drive_children_url "$1")")"
          printf '%s' "${response}" | python3 -c '
        import json, sys
        raise SystemExit(0 if not json.load(sys.stdin).get("files", []) else 1)
        '
        }

        trash_folder() {
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --data '{"trashed":true}' \
            --output /dev/null \
            "https://www.googleapis.com/drive/v3/files/$1?fields=id,trashed"
        }

        drive_backoff_sleep() {
          python3 - "$1" <<'PY'
        import sys
        import time
        time.sleep(float(sys.argv[1]))
        PY
        }

        ensure_folder() {
          parent="$1"
          name="$2"
          response="$(drive_list_folders "${parent}" "${name}")"
          selection="$(printf '%s' "${response}" | folder_selection)"
          folder_id="${selection%% *}"
          folder_count="${selection##* }"
          test "${folder_id}" != "-" || folder_id=""

          if test -n "${folder_id}"; then
            if test "${folder_count}" -gt 1; then
              echo "::warning::Google Drive has ${folder_count} existing folders for one exact parent/name; using canonical folder ${folder_id} and preserving every non-canonical folder." >&2
            fi
            printf '%s' "${folder_id}"
            return 0
          fi

          metadata="$(python3 - "${parent}" "${name}" <<'PY'
        import json, sys
        parent, name = sys.argv[1:3]
        print(json.dumps({"name": name, "mimeType": "application/vnd.google-apps.folder", "parents": [parent]}))
        PY
        )"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --data "${metadata}" \
            'https://www.googleapis.com/drive/v3/files?fields=id,createdTime')"
          read -r created_folder_id created_folder_created_time <<< "$(printf '%s' "${response}" | python3 -c 'import json,sys; value=json.load(sys.stdin); folder_id=value.get("id", ""); created=value.get("createdTime", ""); assert folder_id and created; print(folder_id, created)')"
          observed_folders="$(python3 - "${created_folder_id}" "${created_folder_created_time}" <<'PY'
        import json, sys
        folder_id, created_time = sys.argv[1:3]
        print(json.dumps({"files": [{"id": folder_id, "createdTime": created_time}]}, separators=(",", ":")))
        PY
        )"

          for delay in 0 0.2 0.5 1.0; do
            if test "${delay}" != 0; then
              drive_backoff_sleep "${delay}"
            fi
            response="$(drive_list_folders "${parent}" "${name}")"
            observed_folders="$(merge_folder_candidates "${observed_folders}" "${response}")"
          done

          selection="$(printf '%s' "${observed_folders}" | folder_selection)"
          folder_id="${selection%% *}"
          folder_count="${selection##* }"
          test "${folder_id}" != "-" || folder_id=""
          test -n "${folder_id}" || {
            echo "Google Drive folder reconciliation produced no canonical candidate" >&2
            return 1
          }

          if test "${created_folder_id}" != "${folder_id}"; then
            if folder_is_empty "${created_folder_id}" && drive_backoff_sleep 0.2 && folder_is_empty "${created_folder_id}"; then
              trash_folder "${created_folder_id}"
            else
              echo "::warning::This upload created a non-canonical Drive folder whose emptiness could not be confirmed twice; preserving it instead of risking data loss." >&2
            fi
          elif test "${folder_count}" -gt 1; then
            echo "::warning::Concurrent Google Drive folder candidates converged on canonical folder ${folder_id}; other candidates are preserved for their creating invocations to reconcile safely." >&2
          fi

          printf '%s' "${folder_id}"
        }

        verify_repository_folder() {
          folder_id="$1"
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "https://www.googleapis.com/drive/v3/files/${folder_id}?fields=id,name,mimeType,parents,trashed")"
          python3 - "${repository_name}" "${GOOGLE_DRIVE_ROOT_FOLDER_ID}" "${response}" <<'PY'
        import json, sys
        expected_name, expected_parent, raw = sys.argv[1:4]
        value = json.loads(raw)
        if value.get("trashed"):
            raise SystemExit("configured repository folder is trashed")
        if value.get("mimeType") != "application/vnd.google-apps.folder":
            raise SystemExit("configured repository folder id is not a folder")
        if value.get("name") != expected_name:
            raise SystemExit("configured repository folder name does not match repository")
        if expected_parent not in value.get("parents", []):
            raise SystemExit("configured repository folder is not directly below the configured root")
        PY
        }

        verify_immutable_existing() {
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${access_token}" \
            --output "${existing_download_file}" \
            "https://www.googleapis.com/drive/v3/files/${existing_id}?alt=media"
          if cmp -s "${upload_path}" "${existing_download_file}"; then
            return 0
          fi
          echo "immutable Google Drive file already exists with different bytes" >&2
          return 1
        }

        if test -n "${DRIVE_REPOSITORY_FOLDER_ID}"; then
          verify_repository_folder "${DRIVE_REPOSITORY_FOLDER_ID}"
          repository_folder_id="${DRIVE_REPOSITORY_FOLDER_ID}"
        else
          repository_folder_id="$(ensure_folder "${GOOGLE_DRIVE_ROOT_FOLDER_ID}" "${repository_name}")"
        fi
        ref_folder_id="$(ensure_folder "${repository_folder_id}" "${DRIVE_REF}")"
        target_folder_id="${ref_folder_id}"
        if test -n "${DRIVE_SUBDIRECTORY}"; then
          target_folder_id="$(ensure_folder "${ref_folder_id}" "${DRIVE_SUBDIRECTORY}")"
        fi

        existing_id="$(resolve_existing_file)"
        byte_size="$(python3 -c 'import os,sys; print(os.path.getsize(sys.argv[1]))' "${upload_path}")"

        if test -n "${existing_id}" && test "${DRIVE_IMMUTABLE}" = "true"; then
          verify_immutable_existing || exit 1
          printf 'file_id=%s\n' "${existing_id}" >> "${GITHUB_OUTPUT}"
          printf 'folder_id=%s\n' "${target_folder_id}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if test -n "${existing_id}"; then
          metadata="$(python3 - "${DRIVE_FILE_NAME}" <<'PY'
        import json, sys
        print(json.dumps({"name": sys.argv[1]}))
        PY
        )"
          curl --fail --silent --show-error \
            --request PATCH \
            --dump-header "${headers_file}" \
            --output /dev/null \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --header "X-Upload-Content-Type: ${DRIVE_MIME_TYPE}" \
            --header "X-Upload-Content-Length: ${byte_size}" \
            --data "${metadata}" \
            "https://www.googleapis.com/upload/drive/v3/files/${existing_id}?uploadType=resumable&fields=id,name,size"
        else
          metadata="$(python3 - "${DRIVE_FILE_NAME}" "${target_folder_id}" <<'PY'
        import json, sys
        name, parent = sys.argv[1:3]
        print(json.dumps({"name": name, "parents": [parent]}))
        PY
        )"
          curl --fail --silent --show-error \
            --request POST \
            --dump-header "${headers_file}" \
            --output /dev/null \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --header "X-Upload-Content-Type: ${DRIVE_MIME_TYPE}" \
            --header "X-Upload-Content-Length: ${byte_size}" \
            --data "${metadata}" \
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size'
        fi

        session_url="$(python3 - "${headers_file}" <<'PY'
        from pathlib import Path
        import sys
        for line in Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines():
            if line.lower().startswith("location:"):
                print(line.split(":", 1)[1].strip())
                break
        else:
            raise SystemExit("Google Drive resumable upload returned no Location header")
        PY
        )"
        echo "::add-mask::${session_url}"

        retryable_media_failure() {
          if test "$1" -ne 0; then
            return 0
          fi
          case "$2" in
            408|429|5??) return 0 ;;
            *) return 1 ;;
          esac
        }

        response_file_id() {
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); file_id=value.get("id", ""); file_id or sys.exit("Google Drive upload completion returned no file id"); print(file_id)' "$1"
        }

        received_offset() {
          python3 - "$1" "$2" <<'PY'
        from pathlib import Path
        import re, sys
        total = int(sys.argv[2])
        matches = [int(m.group(1)) for line in Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines() if (m := re.match(r"(?i)^range:\s*bytes=0-(\d+)\s*$", line))]
        if not matches:
            print(0)
        elif matches[-1] >= total:
            raise SystemExit("Google Drive resumable upload returned an invalid Range header")
        else:
            print(matches[-1] + 1)
        PY
        }

        run_media_put() {
          offset="$1"
          remaining=$((byte_size - offset))
          test "${remaining}" -ge 0 || { echo "Google Drive resumable upload returned an invalid completed offset" >&2; exit 1; }
          if test "${remaining}" -eq 0 && test "${byte_size}" -ne 0; then
            echo "Google Drive resumable upload returned an invalid completed offset" >&2
            exit 1
          fi
          set --
          if test "${offset}" -gt 0; then
            set -- --header "Content-Range: bytes ${offset}-$((byte_size - 1))/${byte_size}"
          fi
          : > "${media_headers_file}"
          : > "${media_response_file}"
          set +e
          media_http_code="$(
            tail -c "+$((offset + 1))" "${upload_path}" |
              curl --silent --show-error \
                --request PUT \
                --dump-header "${media_headers_file}" \
                --output "${media_response_file}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${access_token}" \
                --header "Content-Type: ${DRIVE_MIME_TYPE}" \
                --header "Content-Length: ${remaining}" \
                "$@" \
                --data-binary @- \
                "${session_url}"
          )"
          media_curl_status=$?
          set -e
          media_http_code="${media_http_code:-000}"
        }

        reconcile_session() {
          session_try=1
          while test "${session_try}" -le 3; do
            : > "${media_headers_file}"
            : > "${media_response_file}"
            set +e
            session_http_code="$(curl --silent --show-error \
              --request PUT \
              --dump-header "${media_headers_file}" \
              --output "${media_response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${access_token}" \
              --header 'Content-Length: 0' \
              --header "Content-Range: bytes */${byte_size}" \
              "${session_url}")"
            session_curl_status=$?
            set -e
            session_http_code="${session_http_code:-000}"
            if test "${session_curl_status}" -eq 0; then
              case "${session_http_code}" in
                200|201) file_id="$(response_file_id "${media_response_file}")"; return 0 ;;
                308) offset="$(received_offset "${media_headers_file}" "${byte_size}")"; return 0 ;;
              esac
            fi
            if retryable_media_failure "${session_curl_status}" "${session_http_code}" && test "${session_try}" -lt 3; then
              sleep "${session_try}"
              session_try=$((session_try + 1))
              continue
            fi
            if test "${session_curl_status}" -ne 0; then
              echo "Google Drive resumable upload status query failed after bounded retries" >&2
            else
              echo "Google Drive resumable upload status query failed with HTTP ${session_http_code}" >&2
            fi
            exit 1
          done
        }

        max_media_upload_attempts=5
        media_retry_delays=(3 5 8 13)
        media_attempt=1
        offset=0
        file_id=""
        while test "${media_attempt}" -le "${max_media_upload_attempts}"; do
          run_media_put "${offset}"
          if test "${media_curl_status}" -eq 0; then
            case "${media_http_code}" in
              200|201) file_id="$(response_file_id "${media_response_file}")"; break ;;
              308) offset="$(received_offset "${media_headers_file}" "${byte_size}")" ;;
              *)
                if ! retryable_media_failure "${media_curl_status}" "${media_http_code}"; then
                  echo "Google Drive resumable media upload failed with HTTP ${media_http_code}" >&2
                  exit 1
                fi
                reconcile_session
                ;;
            esac
          else
            reconcile_session
          fi
          test -z "${file_id}" || break
          if test "${media_attempt}" -ge "${max_media_upload_attempts}"; then
            echo "Google Drive resumable media upload failed after bounded recovery attempts" >&2
            exit 1
          fi
          retry_delay="${media_retry_delays[$((media_attempt - 1))]}"
          echo "Google Drive resumable media upload interrupted; retrying in ${retry_delay}s after session reconciliation" >&2
          drive_backoff_sleep "${retry_delay}"
          media_attempt=$((media_attempt + 1))
        done
        test -n "${file_id}" || { echo "Google Drive resumable media upload completed without a file id" >&2; exit 1; }
        printf 'file_id=%s\n' "${file_id}" >> "${GITHUB_OUTPUT}"
        printf 'folder_id=%s\n' "${target_folder_id}" >> "${GITHUB_OUTPUT}"
