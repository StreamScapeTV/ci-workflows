name: Validate primitive-backed Android source
description: Plan, execute, clean, or residue-check one product-neutral Android validation request through ciw

inputs:
  phase:
    description: "Bounded internal phase: plan, execute, cleanup, or residue"
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  validation_scope:
    description: protected-full, compile, unit, assemble, lint, targeted-unit, gradle, or script
    required: true
  working_directory:
    description: Bounded relative Android project directory
    required: false
    default: .
  gradle_wrapper_path:
    description: Bounded checked-in Gradle wrapper path relative to the project directory
    required: false
    default: gradlew
  validation_plan_json:
    description: Strict bounded JSON plan containing only caller-owned Gradle tasks, selector, or checked-in script data for the selected scope
    required: false
    default: "{}"
  private_dependency_repository:
    description: Optional exact private dependency repository
    required: false
  private_dependency_sha:
    description: Optional exact private dependency SHA
    required: false
  private_dependency_subdirectory:
    description: Optional bounded dependency subdirectory
    required: false
    default: .
  private_dependency_id:
    description: Optional bounded dependency identity
    required: false
  private_dependency_verified:
    description: Internal checkout verification flag
    required: false
  private_dependency_remotes_erased:
    description: Internal checkout remote-erasure flag
    required: false
  private_dependency_credentials_erased:
    description: Internal checkout credential-erasure flag
    required: false
  private_dependency_head_sha:
    description: Internal exact checked-out dependency SHA
    required: false
  private_dependency_checkout_repository:
    description: Internal checked-out dependency repository identity
    required: false
  private_dependency_checkout_id:
    description: Internal checked-out dependency identity
    required: false
  private_dependency_expected_subpath:
    description: Internal checked-out dependency subpath
    required: false
  maven_package_read_token:
    description: Transient package-read token exposed only to bounded product execution
    required: false

outputs:
  result:
    value: ${{ steps.android.outputs.result }}
  source_sha:
    value: ${{ steps.android.outputs.source_sha }}
  validation_scope:
    value: ${{ steps.android.outputs.validation_scope }}
  test_summary:
    value: ${{ steps.android.outputs.test_summary }}
  runner_profile:
    value: ${{ steps.android.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.android.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.android.outputs.workspace_profile }}
  execution_model:
    value: ${{ steps.android.outputs.execution_model }}
  private_dependency_used:
    value: ${{ steps.android.outputs.private_dependency_used }}
  private_dependency_repository:
    value: ${{ steps.android.outputs.private_dependency_repository }}
  private_dependency_sha:
    value: ${{ steps.android.outputs.private_dependency_sha }}
  private_dependency_subdirectory:
    value: ${{ steps.android.outputs.private_dependency_subdirectory }}
  private_dependency_id:
    value: ${{ steps.android.outputs.private_dependency_id }}
  clean_tree:
    value: ${{ steps.android.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.android.outputs.cleanup_result }}
  failure_code:
    value: ${{ steps.android.outputs.failure_code }}

runs:
  using: composite
  steps:
    - id: android
      name: Dispatch primitive-backed Android validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_VALIDATION_SCOPE: ${{ inputs.validation_scope }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_GRADLE_WRAPPER_PATH: ${{ inputs.gradle_wrapper_path }}
        INPUT_VALIDATION_PLAN_JSON: ${{ inputs.validation_plan_json }}
        INPUT_PRIVATE_DEPENDENCY_REPOSITORY: ${{ inputs.private_dependency_repository }}
        INPUT_PRIVATE_DEPENDENCY_SHA: ${{ inputs.private_dependency_sha }}
        INPUT_PRIVATE_DEPENDENCY_SUBDIRECTORY: ${{ inputs.private_dependency_subdirectory }}
        INPUT_PRIVATE_DEPENDENCY_ID: ${{ inputs.private_dependency_id }}
        INPUT_PRIVATE_DEPENDENCY_VERIFIED: ${{ inputs.private_dependency_verified }}
        INPUT_PRIVATE_DEPENDENCY_REMOTES_ERASED: ${{ inputs.private_dependency_remotes_erased }}
        INPUT_PRIVATE_DEPENDENCY_CREDENTIALS_ERASED: ${{ inputs.private_dependency_credentials_erased }}
        INPUT_PRIVATE_DEPENDENCY_HEAD_SHA: ${{ inputs.private_dependency_head_sha }}
        INPUT_PRIVATE_DEPENDENCY_CHECKOUT_REPOSITORY: ${{ inputs.private_dependency_checkout_repository }}
        INPUT_PRIVATE_DEPENDENCY_CHECKOUT_ID: ${{ inputs.private_dependency_checkout_id }}
        INPUT_PRIVATE_DEPENDENCY_EXPECTED_SUBPATH: ${{ inputs.private_dependency_expected_subpath }}
        CIW_MAVEN_PACKAGE_READ_TOKEN: ${{ inputs.maven_package_read_token }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          android validate \
          --phase "${{ inputs.phase }}" \
          --source-root source
