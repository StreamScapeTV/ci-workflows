name: Execute opaque private Apple CI
description: Execute or recover one Agent State-owned private Apple CI run without exposing private request fields to GitHub logs

inputs:
  phase:
    description: execute or recover
    required: false
    default: execute
  ci_run_id:
    description: Opaque Agent State CI run UUID
    required: true

runs:
  using: composite
  steps:
    - name: Run opaque private Apple CI phase
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" private-apple "${{ inputs.phase }}"
