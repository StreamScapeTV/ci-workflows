name: Central CI source
description: >-
  Mint the read-only GitHub App token, check out the exact requested branch or tag into ./source,
  attest the SHA and the fixed tracked entrypoint, and record the observed SHA in Agent State.
  The caller must have checked out Central at ./central-ci (the local agent-state action is used
  from there) and must pass AGENT_STATE_SUPABASE_URL/AGENT_STATE_SUPABASE_SECRET_KEY in the env of
  the step that uses this action.

inputs:
  repository:
    description: Source repository (owner/name)
    required: true
  ref:
    description: Branch or tag name without refs/ prefix
    required: true
  is_tag:
    description: "true or false"
    required: true
  entrypoint:
    description: Fixed tracked repository entrypoint, for example .ci/build.sh
    required: true
  ci_run_id:
    description: Agent State CI run UUID
    required: true
  app_id:
    description: Source GitHub App id
    required: true
  private_key:
    description: Source GitHub App private key
    required: true

outputs:
  source_sha:
    value: ${{ steps.verify.outputs.source_sha }}
  token:
    description: Read-only source token (masked)
    value: ${{ steps.token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Prepare source token
      id: token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: StreamScapeTV
        permission-contents: read
        permission-metadata: read

    - name: Resolve exact repository source ref
      id: ref
      shell: bash
      env:
        REQUESTED_REF: ${{ inputs.ref }}
        REQUESTED_IS_TAG: ${{ inputs.is_tag }}
      run: |
        set -Eeuo pipefail
        test -n "${REQUESTED_REF}" || { echo "CI requires one non-empty branch or tag name" >&2; exit 2; }
        case "${REQUESTED_IS_TAG}" in
          false) namespace=refs/heads ;;
          true) namespace=refs/tags ;;
          *) echo "CI is_tag must be true or false" >&2; exit 2 ;;
        esac
        full_ref="${namespace}/${REQUESTED_REF}"
        git check-ref-format "${full_ref}" >/dev/null || { echo "CI requested ref is not a valid Git ref" >&2; exit 2; }
        printf 'full_ref=%s\n' "${full_ref}" >> "${GITHUB_OUTPUT}"

    - name: Check out exact repository source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.ref.outputs.full_ref }}
        token: ${{ steps.token.outputs.token }}
        path: source
        fetch-depth: 1
        persist-credentials: false

    - name: Verify exact source and fixed tracked entrypoint
      id: verify
      shell: bash
      env:
        ENTRYPOINT: ${{ inputs.entrypoint }}
      run: |
        set -Eeuo pipefail
        [[ "${ENTRYPOINT}" =~ ^\.ci/[a-z0-9-]+\.sh$ ]] || { echo "entrypoint is not a fixed .ci script" >&2; exit 2; }
        source_sha="$(git -C source rev-parse HEAD)"
        [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 2
        test -z "$(git -C source status --porcelain --untracked-files=all)" || { echo "source checkout is not clean" >&2; exit 2; }
        git -C source ls-files --error-unmatch -- "${ENTRYPOINT}" >/dev/null || { echo "entrypoint is not tracked" >&2; exit 2; }
        mode="$(git -C source ls-files -s -- "${ENTRYPOINT}" | awk 'NR==1 {print $1}')"
        test "${mode}" = 100755 || { echo "entrypoint must be tracked mode 100755" >&2; exit 2; }
        path="source/${ENTRYPOINT}"
        test -f "${path}" && test ! -L "${path}" && test -x "${path}" || { echo "entrypoint must be a regular executable file" >&2; exit 2; }
        printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

    - name: Record observed source SHA
      uses: ./central-ci/actions/agent-state
      with:
        phase: observe-source
        ci_run_id: ${{ inputs.ci_run_id }}
        observed_source_sha: ${{ steps.verify.outputs.source_sha }}
