name: Record short-lived Central CI lifecycle
description: Register running CI metadata, observed checkout evidence, or terminal state in Agent State without storing logs

inputs:
  phase:
    description: start, evidence, or finish
    required: true
  project_key:
    description: Agent State project key for this source repository
    required: false
    default: ""
  repository:
    description: Full source repository in owner/name form
    required: false
    default: ""
  ref:
    description: Human branch or tag name without refs/heads or refs/tags prefix
    required: false
    default: ""
  is_tag:
    description: true when ref is a tag, otherwise false
    required: false
    default: "false"
  workflow_key:
    description: Semantic Central workflow key
    required: false
    default: ""
  profile:
    description: Bounded Central workflow profile
    required: false
    default: ""
  ci_run_id:
    description: Existing Agent State CI run id for webhook requests or prior lifecycle phases
    required: false
    default: ""
  observed_sha:
    description: Observed checkout SHA evidence; never request identity
    required: false
    default: ""
  terminal_status:
    description: succeeded, failed, cancelled, or timed_out
    required: false
    default: ""
  error_summary:
    description: Optional bounded stable terminal error summary
    required: false
    default: ""
  diagnostic_status:
    description: Optional bounded status for diagnostics persisted before finish
    required: false
    default: ""
  diagnostic_key:
    description: Optional bounded external diagnostic lookup key; never a log body
    required: false
    default: ""

outputs:
  ci_run_id:
    description: Existing or newly registered short-lived Agent State CI run id
    value: ${{ steps.lifecycle.outputs.ci_run_id }}

runs:
  using: composite
  steps:
    - id: lifecycle
      name: Apply one bounded CI lifecycle phase
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_PROJECT_KEY: ${{ inputs.project_key }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_IS_TAG: ${{ inputs.is_tag }}
        INPUT_WORKFLOW_KEY: ${{ inputs.workflow_key }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
        INPUT_OBSERVED_SHA: ${{ inputs.observed_sha }}
        INPUT_TERMINAL_STATUS: ${{ inputs.terminal_status }}
        INPUT_ERROR_SUMMARY: ${{ inputs.error_summary }}
        INPUT_DIAGNOSTIC_STATUS: ${{ inputs.diagnostic_status }}
        INPUT_DIAGNOSTIC_KEY: ${{ inputs.diagnostic_key }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" lifecycle "${{ inputs.phase }}"
