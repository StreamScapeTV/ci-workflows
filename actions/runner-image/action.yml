name: Runner image build and publish
description: Build, smoke, optionally publish to public GHCR, and clean one fixed ci-workflows runner image

inputs:
  image:
    description: Fixed runner image id
    required: true
  source_sha:
    description: Exact ci-workflows source SHA
    required: true
  release_tag:
    description: Optional human-readable Git release tag used as the versioned GHCR tag
    required: false
    default: ""
  publish:
    description: Whether to publish the already-smoked image to public GHCR
    required: false
    default: "false"

outputs:
  image_reference:
    description: Fixed versioned GHCR reference when release_tag is supplied
    value: ${{ steps.plan.outputs.remote_reference }}
  image_digest:
    description: Published GHCR manifest digest in publish mode
    value: ${{ steps.publish.outputs.image_digest }}

runs:
  using: composite
  steps:
    - id: plan
      name: Resolve fixed image paths and destination
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/runner_images.py" plan \
          --image "${IMAGE}" \
          --source-sha "${SOURCE_SHA}" \
          --source-root "${GITHUB_WORKSPACE}" \
          --release-tag "${RELEASE_TAG}" \
          --github-output "${GITHUB_OUTPUT}"

    - name: Require standard GitHub-hosted Buildah capacity
      shell: bash
      run: |
        set -Eeuo pipefail
        test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
        test "${RUNNER_OS:-}" = "Linux"
        command -v buildah >/dev/null
        command -v skopeo >/dev/null
        buildah --version
        skopeo --version

    - name: Prepare optional image-owned build inputs
      shell: bash
      env:
        CONTEXT_PATH: ${{ steps.plan.outputs.context_path }}
      run: |
        set -Eeuo pipefail
        preparer="${CONTEXT_PATH}/prepare_inputs.py"
        build_inputs="${CONTEXT_PATH}/.ciw-build-inputs"
        if test -e "${preparer}" || test -L "${preparer}"; then
          test -f "${preparer}"
          test ! -L "${preparer}"
          test ! -e "${build_inputs}"
          test ! -L "${build_inputs}"
          python3 "${preparer}"
          test -d "${build_inputs}"
          test ! -L "${build_inputs}"
        fi

    - name: Prepare isolated registry authentication state
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -Eeuo pipefail
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        test ! -e "${authfile}"
        test ! -L "${authfile}"
        umask 077
        printf '{}\n' > "${authfile}"
        chmod 0600 "${authfile}"

    - name: Build exact runner image once with Buildah
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT_PATH: ${{ steps.plan.outputs.context_path }}
        DOCKERFILE_PATH: ${{ steps.plan.outputs.dockerfile_path }}
        LOCAL_REFERENCE: ${{ steps.plan.outputs.local_reference }}
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        test -f "${authfile}"
        buildah bud \
          --authfile "${authfile}" \
          --layers=false \
          --isolation chroot \
          --label "org.opencontainers.image.source=https://github.com/StreamScapeTV/ci-workflows" \
          --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
          --tag "${LOCAL_REFERENCE}" \
          --file "${DOCKERFILE_PATH}" \
          "${CONTEXT_PATH}"

    - name: Run image-owned smoke from the same local image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LOCAL_REFERENCE: ${{ steps.plan.outputs.local_reference }}
        SMOKE_COMMAND: ${{ steps.plan.outputs.smoke_command }}
      run: |
        set -Eeuo pipefail
        container="ciw-${IMAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        buildah from --authfile "${authfile}" --name "${container}" "${LOCAL_REFERENCE}" >/dev/null
        buildah run "${container}" -- "${SMOKE_COMMAND}"

    - name: Authenticate to GHCR with the repository token
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GHCR_TOKEN: ${{ github.token }}
        REGISTRY_HOST: ${{ steps.plan.outputs.registry_host }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -Eeuo pipefail
        test "${REGISTRY_HOST}" = "ghcr.io"
        test -n "${RELEASE_TAG}"
        test -n "${GHCR_TOKEN}"
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        printf '%s' "${GHCR_TOKEN}" | buildah login \
          --authfile "${authfile}" \
          --username "${GITHUB_ACTOR}" \
          --password-stdin ghcr.io >/dev/null

    - id: publish
      name: Publish version and latest then require public GHCR read-back
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LOCAL_REFERENCE: ${{ steps.plan.outputs.local_reference }}
        REMOTE_REFERENCE: ${{ steps.plan.outputs.remote_reference }}
        LATEST_REFERENCE: ${{ steps.plan.outputs.latest_reference }}
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        push_tmp="${RUNNER_TEMP}/ciw-buildah-push-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}"
        anon_authfile="${RUNNER_TEMP}/ciw-runner-anon-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        mkdir -m 0700 "${push_tmp}"
        umask 077
        printf '{}\n' > "${anon_authfile}"
        export TMPDIR="${push_tmp}" TMP="${push_tmp}" TEMP="${push_tmp}"

        if existing="$(skopeo inspect --authfile "${authfile}" "docker://${REMOTE_REFERENCE}" 2>/dev/null)"; then
          existing_revision="$(printf '%s' "${existing}" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')"
          test "${existing_revision}" = "${SOURCE_SHA}"
        fi

        buildah push --authfile "${authfile}" "${LOCAL_REFERENCE}" "docker://${REMOTE_REFERENCE}"
        buildah push --authfile "${authfile}" "${LOCAL_REFERENCE}" "docker://${LATEST_REFERENCE}"

        version_json="$(skopeo inspect --authfile "${authfile}" "docker://${REMOTE_REFERENCE}")"
        latest_json="$(skopeo inspect --authfile "${authfile}" "docker://${LATEST_REFERENCE}")"
        version_digest="$(printf '%s' "${version_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')"
        latest_digest="$(printf '%s' "${latest_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')"
        test "${version_digest}" = "${latest_digest}"
        [[ "${version_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

        buildah logout --authfile "${authfile}" ghcr.io >/dev/null
        anonymous_version="$(skopeo inspect --authfile "${anon_authfile}" "docker://${REMOTE_REFERENCE}")"
        anonymous_latest="$(skopeo inspect --authfile "${anon_authfile}" "docker://${LATEST_REFERENCE}")"
        test "$(printf '%s' "${anonymous_version}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')" = "${version_digest}"
        test "$(printf '%s' "${anonymous_latest}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')" = "${version_digest}"
        printf 'image_digest=%s\n' "${version_digest}" >> "${GITHUB_OUTPUT}"

    - name: Remove exact runner-image build and authentication state
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT_PATH: ${{ steps.plan.outputs.context_path }}
        LOCAL_REFERENCE: ${{ steps.plan.outputs.local_reference }}
      run: |
        set +e
        failed=0
        container="ciw-${IMAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        authfile="${RUNNER_TEMP}/ciw-runner-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        anon_authfile="${RUNNER_TEMP}/ciw-runner-anon-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}.json"
        push_tmp="${RUNNER_TEMP}/ciw-buildah-push-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE}"
        buildah rm "${container}" >/dev/null 2>&1 || true
        buildah logout --authfile "${authfile}" ghcr.io >/dev/null 2>&1 || true
        rm -f -- "${authfile}" "${anon_authfile}" || failed=1
        rm -rf -- "${push_tmp}" || failed=1
        if test -n "${CONTEXT_PATH}"; then
          build_inputs="${CONTEXT_PATH}/.ciw-build-inputs"
          rm -rf -- "${build_inputs}" || failed=1
          test ! -e "${build_inputs}" || failed=1
        fi
        if test -n "${LOCAL_REFERENCE}"; then
          buildah rmi "${LOCAL_REFERENCE}" >/dev/null 2>&1 || true
        fi
        test ! -e "${authfile}" || failed=1
        test ! -e "${anon_authfile}" || failed=1
        test ! -e "${push_tmp}" || failed=1
        exit "${failed}"
