name: Run trusted Flux reconciliation
description: Resolve and optionally apply one structured plan from exact Flux-owned policy source
inputs:
  admitted_sha: {description: Exact trusted Flux source SHA, required: true}
  target_id: {description: Opaque target identifier interpreted only by Flux-owned policy, required: true}
  product_id: {description: Opaque product identifier interpreted only by Flux-owned policy, required: true}
  operation: {description: Contract-bounded reconciliation operation, required: true}
  policy_path: {description: Exact contract-matched Flux-owned policy adapter path, required: true}
  allowlist_path: {description: Exact contract-matched Flux-owned allowlist path, required: true}
  request_id: {description: Bounded request identifier, required: true}
  dry_run: {description: Resolve policy only when true, required: true}
  flux_kubeconfig: {description: Named Flux caller kubeconfig secret, required: false}
  flux_sops_age_key: {description: Named Flux caller SOPS age key, required: false}
outputs:
  result: {value: '${{ steps.reconcile.outputs.result }}'}
  reconciliation_state: {value: '${{ steps.reconcile.outputs.reconciliation_state }}'}
  request_id: {value: '${{ steps.reconcile.outputs.request_id }}'}
  failure_code: {value: '${{ steps.reconcile.outputs.failure_code }}'}
runs:
  using: composite
  steps:
    - name: Resolve and run trusted Flux reconciliation
      id: reconcile
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        FLUX_KUBECONFIG: ${{ inputs.flux_kubeconfig }}
        FLUX_SOPS_AGE_KEY: ${{ inputs.flux_sops_age_key }}
        CIW_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        CIW_TARGET_ID: ${{ inputs.target_id }}
        CIW_PRODUCT_ID: ${{ inputs.product_id }}
        CIW_OPERATION: ${{ inputs.operation }}
        CIW_POLICY_PATH: ${{ inputs.policy_path }}
        CIW_ALLOWLIST_PATH: ${{ inputs.allowlist_path }}
        CIW_REQUEST_ID: ${{ inputs.request_id }}
        CIW_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" flux reconcile \
          --admitted-sha "${CIW_ADMITTED_SHA}" \
          --target-id "${CIW_TARGET_ID}" \
          --product-id "${CIW_PRODUCT_ID}" \
          --operation "${CIW_OPERATION}" \
          --policy-path "${CIW_POLICY_PATH}" \
          --allowlist-path "${CIW_ALLOWLIST_PATH}" \
          --request-id "${CIW_REQUEST_ID}" \
          --dry-run "${CIW_DRY_RUN}"
