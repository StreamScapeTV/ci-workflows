name: Validate exact static-web source
description: Execute one bounded caller-owned static-web build and verification plan

inputs:
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  working_directory:
    description: Relative static-web project directory within the exact checkout
    required: false
    default: .
  validation_plan_json:
    description: Bounded caller-owned build script, output and verification plan
    required: true

outputs:
  result:
    value: ${{ steps.static_web.outputs.result }}
  build_result:
    value: ${{ steps.static_web.outputs.build_result }}
  output_verified:
    value: ${{ steps.static_web.outputs.output_verified }}
  output_digest:
    value: ${{ steps.static_web.outputs.output_digest }}
  output_file_count:
    value: ${{ steps.static_web.outputs.output_file_count }}
  test_summary:
    value: ${{ steps.static_web.outputs.test_summary }}
  cleanup_result:
    value: ${{ steps.static_web.outputs.cleanup_result }}
  failure_code:
    value: ${{ steps.static_web.outputs.failure_code }}
  cleanup_code:
    value: ${{ steps.static_web.outputs.cleanup_code }}

runs:
  using: composite
  steps:
    - id: static_web
      name: Dispatch bounded static-web validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_VALIDATION_PLAN_JSON: ${{ inputs.validation_plan_json }}
      run: |
        set -Eeuo pipefail
        interpreter="$(type -P python3.12 || true)"
        if [[ -z "${interpreter}" ]]; then
          interpreter="$(type -P python3 || true)"
        fi
        if [[ -z "${interpreter}" || "${interpreter}" != /* || ! -x "${interpreter}" ]]; then
          echo '::error::Runner-provided CPython is unavailable.' >&2
          exit 2
        fi
        GITHUB_WORKSPACE="${GITHUB_WORKSPACE}/source" \
          "${interpreter}" "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" static-web validate
