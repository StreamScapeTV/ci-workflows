name: Validate exact Node source
description: Plan or execute one checked-in Node validation profile through ciw

inputs:
  phase:
    description: Bounded internal phase, plan or execute
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  validation_profile:
    description: locked-node, next-static-export, frontend-contract-static, or node-source-audit
    required: true
  version_file:
    description: Optional contract-matched exact Node version file
    required: false
  node_version:
    description: Optional contract-matched exact Node version
    required: false
  working_directory:
    description: Contract-matched relative working directory
    required: false
    default: .
  install_profile:
    description: npm-ci or none as selected by the validation profile
    required: true
  command_profile:
    description: Checked-in reviewed Node command profile
    required: true
  script_path:
    description: Optional contract-matched checked-in audit hook
    required: false
  static_output_directory:
    description: Optional contract-matched static output directory
    required: false
  output_verifier_path:
    description: Optional contract-matched checked-in output verifier
    required: false
  public_environment:
    description: Optional canonical JSON object of reviewed public browser values
    required: false
  artifact_exception_id:
    description: Optional central artifact exception; initial Node API requires empty
    required: false

outputs:
  result:
    value: ${{ steps.node.outputs.result }}
  node_version:
    value: ${{ steps.node.outputs.node_version }}
  npm_version:
    value: ${{ steps.node.outputs.npm_version }}
  install_result:
    value: ${{ steps.node.outputs.install_result }}
  test_summary:
    value: ${{ steps.node.outputs.test_summary }}
  build_result:
    value: ${{ steps.node.outputs.build_result }}
  output_verified:
    value: ${{ steps.node.outputs.output_verified }}
  output_digest:
    value: ${{ steps.node.outputs.output_digest }}
  clean_tree:
    value: ${{ steps.node.outputs.clean_tree }}
  cleanup_result:
    value: ${{ steps.node.outputs.cleanup_result }}
  artifact_exception_used:
    value: ${{ steps.node.outputs.artifact_exception_used }}
  evidence_id:
    value: ${{ steps.node.outputs.evidence_id }}
  failure_code:
    value: ${{ steps.node.outputs.failure_code }}
  runner_profile:
    value: ${{ steps.node.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.node.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.node.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.node.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.node.outputs.source_trust }}

runs:
  using: composite
  steps:
    - id: node
      name: Dispatch bounded Node validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_INSTALL_PROFILE: ${{ inputs.install_profile }}
        INPUT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUT_STATIC_OUTPUT_DIRECTORY: ${{ inputs.static_output_directory }}
        INPUT_OUTPUT_VERIFIER_PATH: ${{ inputs.output_verifier_path }}
        INPUT_PUBLIC_ENVIRONMENT: ${{ inputs.public_environment }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          node validate \
          --phase "${{ inputs.phase }}" \
          --source-root source
