name: Run organization conformance report
description: Compare live workflow trees to the checked-in inventory and optionally publish one report issue
inputs:
  repository_scope: {description: Optional allowlisted project scope, required: false}
  dry_run: {description: Report only when true, required: true}
  request_id: {description: Bounded request identifier, required: true}
  token: {description: Named read or update credential selected by the workflow, required: true}
outputs:
  result: {value: '${{ steps.maintenance.outputs.result }}'}
  mutation_count: {value: '${{ steps.maintenance.outputs.mutation_count }}'}
  report_issue_url: {value: '${{ steps.maintenance.outputs.report_issue_url }}'}
  request_id: {value: '${{ steps.maintenance.outputs.request_id }}'}
  failure_code: {value: '${{ steps.maintenance.outputs.failure_code }}'}
runs:
  using: composite
  steps:
    - name: Run bounded organization conformance
      id: maintenance
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        MAINTENANCE_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/maintenance.py" conformance \
          --repository-scope "${{ inputs.repository_scope }}" \
          --dry-run "${{ inputs.dry_run }}" \
          --request-id "${{ inputs.request_id }}"
