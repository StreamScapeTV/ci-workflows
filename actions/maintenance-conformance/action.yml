name: Run organization conformance report
description: Compare live workflow trees to inventory and produce review-only immutable shared-reference proposals
inputs:
  repository_scope: {description: Optional allowlisted project scope, required: false}
  shared_reference_target_sha: {description: Optional exact ci-workflows SHA used only for reviewable repin proposals, required: false}
  dry_run: {description: Report only when true, required: true}
  request_id: {description: Bounded request identifier, required: true}
  token: {description: Named read or update credential selected by the workflow, required: true}
outputs:
  result: {value: '${{ steps.maintenance.outputs.result }}'}
  mutation_count: {value: '${{ steps.maintenance.outputs.mutation_count }}'}
  report_issue_url: {value: '${{ steps.maintenance.outputs.report_issue_url }}'}
  request_id: {value: '${{ steps.maintenance.outputs.request_id }}'}
  failure_code: {value: '${{ steps.maintenance.outputs.failure_code }}'}
runs:
  using: composite
  steps:
    - name: Run bounded organization conformance
      id: maintenance
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        MAINTENANCE_GITHUB_TOKEN: ${{ inputs.token }}
        CIW_REPOSITORY_SCOPE: ${{ inputs.repository_scope }}
        CIW_SHARED_REFERENCE_TARGET_SHA: ${{ inputs.shared_reference_target_sha }}
        CIW_DRY_RUN: ${{ inputs.dry_run }}
        CIW_REQUEST_ID: ${{ inputs.request_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" maintenance conformance \
          --repository-scope "${CIW_REPOSITORY_SCOPE}" \
          --shared-reference-target-sha "${CIW_SHARED_REFERENCE_TARGET_SHA}" \
          --dry-run "${CIW_DRY_RUN}" \
          --request-id "${CIW_REQUEST_ID}"
