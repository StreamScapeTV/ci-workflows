name: Validate exact Python source
description: Plan or execute one checked-in Python validation profile through ciw

inputs:
  phase:
    description: Bounded internal phase, plan or execute
    required: false
    default: execute
  admitted_sha:
    description: Exact admitted caller source SHA
    required: true
  validation_profile:
    description: audit, host, podman, or podman-postgres
    required: true
  command_profile:
    description: Checked-in reviewed command profile
    required: true
  working_directory:
    description: Contract-matched relative working directory
    required: false
    default: .
  version_file:
    description: Optional contract-matched relative Python version file
    required: false
  script_path:
    description: Optional contract-matched reviewed script path
    required: false
  artifact_exception_id:
    description: Optional central artifact exception; initial Python API requires empty
    required: false

outputs:
  result:
    value: ${{ steps.python.outputs.result }}
  test_summary:
    value: ${{ steps.python.outputs.test_summary }}
  source_sha:
    value: ${{ steps.python.outputs.source_sha }}
  resolved_python_version:
    value: ${{ steps.python.outputs.resolved_python_version }}
  validation_profile:
    value: ${{ steps.python.outputs.validation_profile }}
  command_profile:
    value: ${{ steps.python.outputs.command_profile }}
  cleanup_result:
    value: ${{ steps.python.outputs.cleanup_result }}
  failure_code:
    value: ${{ steps.python.outputs.failure_code }}
  artifact_exception_used:
    value: ${{ steps.python.outputs.artifact_exception_used }}
  evidence_id:
    value: ${{ steps.python.outputs.evidence_id }}
  runner_profile:
    value: ${{ steps.python.outputs.runner_profile }}
  runs_on_json:
    value: ${{ steps.python.outputs.runs_on_json }}
  workspace_profile:
    value: ${{ steps.python.outputs.workspace_profile }}
  timeout_minutes:
    value: ${{ steps.python.outputs.timeout_minutes }}
  source_trust:
    value: ${{ steps.python.outputs.source_trust }}

runs:
  using: composite
  steps:
    - id: python
      name: Dispatch bounded Python validation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_ADMITTED_SHA: ${{ inputs.admitted_sha }}
        INPUT_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        INPUT_COMMAND_PROFILE: ${{ inputs.command_profile }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUT_ARTIFACT_EXCEPTION_ID: ${{ inputs.artifact_exception_id }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" \
          python validate \
          --phase "${{ inputs.phase }}" \
          --source-root source
