name: Refresh canonical source snapshot

description: Refresh one exact main/develop canonical Drive source snapshot from the triggering GitHub branch SHA.

inputs:
  repository:
    description: Exact StreamScapeTV owner/name from GitHub event context
    required: true
  repository_name:
    description: Exact repository name from GitHub event context
    required: true
  ref:
    description: Exact integration branch name from GitHub event context
    required: true
  source_sha:
    description: Exact triggering GitHub source SHA
    required: true
  source_app_id:
    description: Source GitHub App ID
    required: true
  source_app_private_key:
    description: Source GitHub App private key
    required: true

runs:
  using: composite
  steps:
    - name: Validate automatic snapshot identity
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REPOSITORY_NAME: ${{ inputs.repository_name }}
        TARGET_REF: ${{ inputs.ref }}
        TARGET_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        python3 - <<'PY'
        import os
        import re
        repository = os.environ["TARGET_REPOSITORY"]
        repository_name = os.environ["TARGET_REPOSITORY_NAME"]
        ref = os.environ["TARGET_REF"]
        sha = os.environ["TARGET_SHA"]
        if not re.fullmatch(r"StreamScapeTV/[A-Za-z0-9_.-]{1,100}", repository):
            raise SystemExit("automatic source snapshot repository is invalid")
        if repository.rsplit("/", 1)[-1] != repository_name:
            raise SystemExit("automatic source snapshot repository name is inconsistent")
        if ref not in {"main", "develop"}:
            raise SystemExit("automatic source snapshot accepts only main/develop")
        if not re.fullmatch(r"[0-9a-f]{40}", sha):
            raise SystemExit("automatic source snapshot SHA must be one lowercase 40-character Git SHA")
        PY

    - name: Prepare exact source token
      id: source_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.source_app_id }}
        private-key: ${{ inputs.source_app_private_key }}
        owner: StreamScapeTV
        repositories: ${{ inputs.repository_name }}
        permission-contents: read
        permission-metadata: read

    - name: Check out exact triggering source
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.source_sha }}
        token: ${{ steps.source_token.outputs.token }}
        path: source
        fetch-depth: 1
        persist-credentials: false

    - name: Resolve observed source identity
      id: source_identity
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        source_sha="$(git -C source rev-parse HEAD)"
        tree_sha="$(git -C source rev-parse 'HEAD^{tree}')"
        test "${source_sha}" = "${EXPECTED_SOURCE_SHA}" || {
          echo "checked-out source does not match triggering push SHA" >&2
          exit 2
        }
        printf 'source_sha=%s\ntree_sha=%s\n' "${source_sha}" "${tree_sha}" >> "${GITHUB_OUTPUT}"

    - name: Resolve durable Drive repository folder
      id: drive_repository
      shell: bash
      run: |
        set -Eeuo pipefail
        folder_id="$(python3 - <<'PY'
        from pathlib import Path
        import re
        for name in ("AGENTS.md", "AGENTS.yaml"):
            path = Path("source") / name
            if not path.is_file():
                continue
            match = re.search(
                r"(?m)^- Google Drive repository folder ID: `([^`]+)`\s*$",
                path.read_text(encoding="utf-8"),
            )
            if match:
                print(match.group(1))
                raise SystemExit(0)
        print("")
        PY
        )"
        printf 'folder_id=%s\n' "${folder_id}" >> "${GITHUB_OUTPUT}"

    - name: Resolve Google Drive access token
      id: snapshot_drive
      shell: bash
      run: |
        set -Eeuo pipefail
        : "${GOOGLE_DRIVE_CLIENT_ID:?GOOGLE_DRIVE_CLIENT_ID is required}"
        : "${GOOGLE_DRIVE_CLIENT_SECRET:?GOOGLE_DRIVE_CLIENT_SECRET is required}"
        : "${GOOGLE_DRIVE_REFRESH_TOKEN:?GOOGLE_DRIVE_REFRESH_TOKEN is required}"
        : "${GOOGLE_DRIVE_ROOT_FOLDER_ID:?GOOGLE_DRIVE_ROOT_FOLDER_ID is required}"
        access_token="$(curl --fail --silent --show-error --request POST \
          --data-urlencode "client_id=${GOOGLE_DRIVE_CLIENT_ID}" \
          --data-urlencode "client_secret=${GOOGLE_DRIVE_CLIENT_SECRET}" \
          --data-urlencode "refresh_token=${GOOGLE_DRIVE_REFRESH_TOKEN}" \
          --data-urlencode "grant_type=refresh_token" \
          https://oauth2.googleapis.com/token \
          | python3 -c 'import json,sys; value=json.load(sys.stdin); token=value.get("access_token", ""); assert token; print(token)')"
        echo "::add-mask::${access_token}"
        printf 'access_token=%s\n' "${access_token}" >> "${GITHUB_OUTPUT}"

    - name: Verify branch is still at triggering SHA
      id: freshness
      shell: bash
      env:
        TARGET_TOKEN: ${{ steps.source_token.outputs.token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        current_sha="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${TARGET_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/heads/${TARGET_REF}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
        if test "${current_sha}" = "${EXPECTED_SOURCE_SHA}"; then
          printf 'current=true\n' >> "${GITHUB_OUTPUT}"
        else
          printf 'current=false\n' >> "${GITHUB_OUTPUT}"
          printf 'Skipped stale integration snapshot for `%s@%s`: event `%s`, current `%s`.\n' \
            "${TARGET_REPOSITORY}" "${TARGET_REF}" "${EXPECTED_SOURCE_SHA}" "${current_sha}" >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Create exact tracked-source snapshot
      id: snapshot
      if: ${{ steps.freshness.outputs.current == 'true' }}
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha }}
        TREE_SHA: ${{ steps.source_identity.outputs.tree_sha }}
      run: |
        set -Eeuo pipefail
        repository_name="${TARGET_REPOSITORY##*/}"
        ref_slug="$(python3 - "${TARGET_REF}" <<'PY'
        import sys, urllib.parse
        print(urllib.parse.quote(sys.argv[1], safe=""))
        PY
        )"
        archive_filename="${repository_name}-${ref_slug}.zip"
        archive="${RUNNER_TEMP}/repository-snapshot.zip"
        manifest="${RUNNER_TEMP}/manifest.json"
        git -C source archive --format=zip --output="${archive}" HEAD
        archive_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
        archive_size="$(wc -c < "${archive}" | tr -d '[:space:]')"
        python3 - "${manifest}" "${TARGET_REPOSITORY}" "${repository_name}" "${TARGET_REF}" "${SOURCE_SHA}" "${TREE_SHA}" "${archive_filename}" "${archive_sha256}" "${archive_size}" <<'PY'
        from pathlib import Path
        import json, sys
        path, repository, repository_name, ref, source_sha, tree_sha, filename, digest, size = sys.argv[1:]
        value = {
            "repository": repository,
            "repository_name": repository_name,
            "requested_ref": ref,
            "is_tag": False,
            "resolved_source_sha": source_sha,
            "tree_sha": tree_sha,
            "archive_format": "zip",
            "archive_format_version": 1,
            "archive_filename": filename,
            "archive_sha256": digest,
            "archive_size_bytes": int(size),
            "source_zip_sha256": digest,
            "source_zip_size_bytes": int(size),
        }
        Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
        PY
        {
          printf 'archive=%s\n' "${archive}"
          printf 'manifest=%s\n' "${manifest}"
          printf 'archive_filename=%s\n' "${archive_filename}"
          printf 'archive_sha256=%s\n' "${archive_sha256}"
          printf 'archive_size=%s\n' "${archive_size}"
        } >> "${GITHUB_OUTPUT}"

    - name: Recheck branch immediately before Drive mutation
      id: mutation_fence
      if: ${{ steps.snapshot.outcome == 'success' }}
      shell: bash
      env:
        TARGET_TOKEN: ${{ steps.source_token.outputs.token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        current_sha="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${TARGET_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/heads/${TARGET_REF}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
        if test "${current_sha}" = "${EXPECTED_SOURCE_SHA}"; then
          printf 'current=true\n' >> "${GITHUB_OUTPUT}"
        else
          printf 'current=false\n' >> "${GITHUB_OUTPUT}"
          printf 'Skipped stale integration snapshot before Drive mutation for `%s@%s`: event `%s`, current `%s`.\n' \
            "${TARGET_REPOSITORY}" "${TARGET_REF}" "${EXPECTED_SOURCE_SHA}" "${current_sha}" >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Upload repository snapshot archive
      if: ${{ steps.mutation_fence.outputs.current == 'true' }}
      id: source_upload
      uses: StreamScapeTV/ci-workflows/actions/google-drive@main
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
        file_path: ${{ steps.snapshot.outputs.archive }}
        file_name: ${{ steps.snapshot.outputs.archive_filename }}
        previous_file_name: source.zip
        mime_type: application/zip

    - name: Write first manifest with archive Drive identity
      if: ${{ steps.source_upload.outcome == 'success' }}
      shell: bash
      env:
        MANIFEST: ${{ steps.snapshot.outputs.manifest }}
        ARCHIVE_FILE_ID: ${{ steps.source_upload.outputs.file_id }}
        FOLDER_ID: ${{ steps.source_upload.outputs.folder_id }}
      run: |
        set -Eeuo pipefail
        python3 - "${MANIFEST}" "${ARCHIVE_FILE_ID}" "${FOLDER_ID}" <<'PY'
        from pathlib import Path
        import json, sys
        path, archive_file_id, folder_id = sys.argv[1:]
        value = json.loads(Path(path).read_text(encoding="utf-8"))
        value["archive_file_id"] = archive_file_id
        value["source_zip_file_id"] = archive_file_id
        value["folder_id"] = folder_id
        Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
        PY

    - name: Create manifest.json
      if: ${{ steps.source_upload.outcome == 'success' }}
      id: manifest_create
      uses: StreamScapeTV/ci-workflows/actions/google-drive@main
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
        file_path: ${{ steps.snapshot.outputs.manifest }}
        file_name: manifest.json
        mime_type: application/json

    - name: Add stable manifest Drive identity
      if: ${{ steps.manifest_create.outcome == 'success' }}
      shell: bash
      env:
        MANIFEST: ${{ steps.snapshot.outputs.manifest }}
        MANIFEST_FILE_ID: ${{ steps.manifest_create.outputs.file_id }}
      run: |
        set -Eeuo pipefail
        python3 - "${MANIFEST}" "${MANIFEST_FILE_ID}" <<'PY'
        from pathlib import Path
        import json, sys
        path, manifest_file_id = sys.argv[1:]
        value = json.loads(Path(path).read_text(encoding="utf-8"))
        value["manifest_file_id"] = manifest_file_id
        Path(path).write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
        PY

    - name: Update manifest.json in place
      if: ${{ steps.manifest_create.outcome == 'success' }}
      id: manifest_update
      uses: StreamScapeTV/ci-workflows/actions/google-drive@main
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        repository_folder_id: ${{ steps.drive_repository.outputs.folder_id }}
        file_path: ${{ steps.snapshot.outputs.manifest }}
        file_name: manifest.json
        mime_type: application/json

    - name: Verify stable identity and raw Drive readback
      if: ${{ steps.manifest_update.outcome == 'success' }}
      shell: bash
      env:
        DRIVE_ACCESS_TOKEN: ${{ steps.snapshot_drive.outputs.access_token }}
        ARCHIVE_FILE_ID: ${{ steps.source_upload.outputs.file_id }}
        MANIFEST_FILE_ID: ${{ steps.manifest_update.outputs.file_id }}
        CREATED_MANIFEST_ID: ${{ steps.manifest_create.outputs.file_id }}
        CREATED_FOLDER: ${{ steps.manifest_create.outputs.folder_id }}
        UPDATED_FOLDER: ${{ steps.manifest_update.outputs.folder_id }}
        LOCAL_ARCHIVE: ${{ steps.snapshot.outputs.archive }}
        LOCAL_MANIFEST: ${{ steps.snapshot.outputs.manifest }}
        EXPECTED_ARCHIVE_SHA256: ${{ steps.snapshot.outputs.archive_sha256 }}
        EXPECTED_ARCHIVE_SIZE: ${{ steps.snapshot.outputs.archive_size }}
      run: |
        set -Eeuo pipefail
        test "${CREATED_MANIFEST_ID}" = "${MANIFEST_FILE_ID}"
        test "${CREATED_FOLDER}" = "${UPDATED_FOLDER}"
        remote_archive="${RUNNER_TEMP}/snapshot-readback.zip"
        remote_manifest="${RUNNER_TEMP}/snapshot-readback-manifest.json"
        curl --fail --silent --show-error -H "Authorization: Bearer ${DRIVE_ACCESS_TOKEN}" \
          "https://www.googleapis.com/drive/v3/files/${ARCHIVE_FILE_ID}?alt=media" --output "${remote_archive}"
        curl --fail --silent --show-error -H "Authorization: Bearer ${DRIVE_ACCESS_TOKEN}" \
          "https://www.googleapis.com/drive/v3/files/${MANIFEST_FILE_ID}?alt=media" --output "${remote_manifest}"
        test "$(wc -c < "${remote_archive}" | tr -d '[:space:]')" = "${EXPECTED_ARCHIVE_SIZE}"
        test "$(sha256sum "${remote_archive}" | awk '{print $1}')" = "${EXPECTED_ARCHIVE_SHA256}"
        cmp -s "${LOCAL_ARCHIVE}" "${remote_archive}"
        cmp -s "${LOCAL_MANIFEST}" "${remote_manifest}"

    - name: Note newer source if it arrived after this snapshot
      if: ${{ steps.manifest_update.outcome == 'success' }}
      shell: bash
      env:
        TARGET_TOKEN: ${{ steps.source_token.outputs.token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        current_sha="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${TARGET_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/heads/${TARGET_REF}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
        if test "${current_sha}" != "${EXPECTED_SOURCE_SHA}"; then
          printf 'A newer `%s@%s` head `%s` arrived after this snapshot; the serialized newer push refresh will replace it.\n' \
            "${TARGET_REPOSITORY}" "${TARGET_REF}" "${current_sha}" >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Clean snapshot workspace
      if: ${{ always() }}
      shell: bash
      run: |
        rm -rf source
        rm -f "${RUNNER_TEMP}/repository-snapshot.zip" "${RUNNER_TEMP}/manifest.json" \
          "${RUNNER_TEMP}/snapshot-readback.zip" "${RUNNER_TEMP}/snapshot-readback-manifest.json"
