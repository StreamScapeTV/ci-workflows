name: Sync Gradle dependency seed
description: Stream one job-private Gradle modules delta to the fixed internal Flux cache service

inputs:
  source_sha:
    description: Exact admitted source SHA used only as bounded cache-update evidence
    required: true

outputs:
  result:
    value: ${{ steps.upload.outputs.result }}
  source_sha:
    value: ${{ steps.upload.outputs.source_sha }}
  generation:
    value: ${{ steps.upload.outputs.generation }}
  file_count:
    value: ${{ steps.upload.outputs.file_count }}
  total_bytes:
    value: ${{ steps.upload.outputs.total_bytes }}
  evidence_id:
    value: ${{ steps.upload.outputs.evidence_id }}

runs:
  using: composite
  steps:
    - id: upload
      name: Stream bounded Gradle dependency delta
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/ciw.py" gradle-seed upload
