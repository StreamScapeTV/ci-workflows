name: Cleanup registered CI workspace
description: Remove only marker-bound registered state and fail on residue or unsafe targets

outputs:
  state_id:
    value: ${{ steps.cleanup.outputs.state_id }}
  removed_paths:
    value: ${{ steps.cleanup.outputs.removed_paths }}
  removed_sensitive_paths:
    value: ${{ steps.cleanup.outputs.removed_sensitive_paths }}
  partial_setup:
    value: ${{ steps.cleanup.outputs.partial_setup }}
  platform:
    value: ${{ steps.cleanup.outputs.platform }}
  cleanup_verified:
    value: ${{ steps.cleanup.outputs.cleanup_verified }}

runs:
  using: composite
  steps:
    - id: cleanup
      name: Remove and verify registered workspace state
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        set -Eeuo pipefail
        PYTHONPATH="${GITHUB_ACTION_PATH}/../../src" \
          python3 "${GITHUB_ACTION_PATH}/../../scripts/ci/foundation.py" \
            --root "${GITHUB_ACTION_PATH}/../.." cleanup-workspace
